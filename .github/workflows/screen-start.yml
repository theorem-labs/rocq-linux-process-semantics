# screen-start.yml: at each event of a pull request from a fork on which CI runs (opened, synchronize and reopened,
# below), it starts the rescreen pass (.github/workflows/rescreen.yml) on main with the number of the pull request, and
# writes nothing else. That run of the pass does the work of that pull request alone, by the rules of the pass
# (rescreen.yml): the conflict run when the pull request has a merge conflict, else the screen and the approval of the
# runs of its head that GitHub holds, else nothing.
#
# Why pull_request_target: GitHub holds the CI run (pull_request) of a first-time contributor's pull request for a
# person's approval, and a run that GitHub holds starts no workflow_run. Without this file, such a pull request waits
# for an event of another item (rescreen.yml). GitHub runs each pull_request_target event with the copy of this file on
# the default branch (main), also for a pull request with a merge conflict, and whatever the approval settings say
# (GitHub's docs, "Events that trigger workflows" and "Managing GitHub Actions settings for a repository", read
# 2026-11-19). It is the one workflow of this repository that starts on pull_request_target (dispatch://OSSV-613/spec R4
# and R14). The token of such a run can write, so this file runs no file of the pull request: it checks nothing out,
# holds no secret and no identity token, and no run: line reads a field of the event that the author writes (the title,
# the body, the branch name). From 2026-12-02 GitHub blocks pull_request_target in public repositories by default:
# dispatch://INFRA-3395 sets the Actions event policy that allows it for this file alone.
#
# The types: the types on which a pull_request workflow of this repository runs, as only such an event can make a run
# that GitHub holds. ci.yml is the one such workflow, and its pull_request names no types, so GitHub's default:
# opened, synchronize and reopened (GitHub's docs, "Events that trigger workflows"). An edit, a label or a close of a
# pull request starts nothing here. .github/test_review.py reads the types from the other workflow files.
#
# What it reads and writes: its token has actions: write alone. It reads the runs of the head commit whose event is
# pull_request (repos/<repo>/actions/runs), and it makes one write, the start of rescreen.yml on main with the number of
# the pull request (gh workflow run rescreen.yml --ref main -f number=<n>). GitHub makes a workflow_dispatch run for
# that write, though github.token makes it (GitHub's docs, "GITHUB_TOKEN").
#
# The wait: the step waits until GitHub lists a pull_request run of the head commit that GitHub made at or after the
# event, at most 2 minutes, with a read every 10 seconds, so that the pass finds the CI run of this event: a run that
# GitHub holds gets its approval (approve, rescreen.yml). The time of the event is the pull request's updated_at in the
# event, which GitHub writes at the event. So the runs of an earlier event of the same head commit do not end the wait:
# a reopen, or a new pull request of a commit that has runs, lists them at once. With no such time, any pull_request
# run of the head commit ends the wait. A read that fails counts as no run listed. GitHub starts no CI run for a pull
# request with a merge conflict: the wait then ends at the 2 minutes, as R14 says, and the run of the pass that the step
# starts takes the conflict. Then the step exits 0. When GitHub refuses the start of the pass, the step fails. That is
# right: the work of the event then waits for the next run of the pass (rescreen.yml lists its events).
#
# A burst: a newer event of the same pull request cancels the run of this file that waits (the concurrency group of
# the pull request's number). So in a burst of events (an author who pushes many times), each run that a newer event
# cancelled while it waited starts nothing, and the newest event starts the pass. A run of the pass with a number
# reads that pull request and the held runs of its head, and ends there when it has no merge conflict and no held run.
# With a held run, it reads the runs of review.yml of the last hour, and starts no approval, with no more reads, when
# the author is at OUTSIDE_HOURLY_LIMIT or a run of the pull request has not finished. The runs of the pass with the
# number of one pull request share a group of their own, in which a newer run takes the place of the one that waits.
# So a burst costs a few calls of the API for each event, and cannot use up the token's 1,000 requests an hour. The
# runs of the pass with no number queue in another group, and none of them is cancelled.
#
# No loop: review.yml's jobs write their labels, comments and reviews with github.token, and an event that
# github.token makes starts no run of this file (GitHub's docs, "Events that trigger workflows": its workflow_dispatch
# and repository_dispatch start runs, and so does a pull request that it opens or pushes to, which review.yml never
# does). The OSS Verify App's reopen of a catch-up is an event of the pull request, and starts this file again: the
# run of the pass with the number of the pull request takes only its conflict or the approval of its held runs, and
# starts no catch-up. So an event starts no loop of screens. Its cost: one job of up to 2 minutes for each event, on a
# standard runner, whose minutes GitHub does not bill in a public repository.
name: screen-start

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

# A newer event of the pull request cancels the run that waits: the newest event starts the pass.
concurrency:
  group: screen-start-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Only for a pull request from a fork: its head repository is not this repository, or GitHub gives none (a fork
  # that is gone). A pull request from a branch of this repository comes from an account with write access: GitHub
  # holds none of its CI runs, and each of them starts the pass when it completes. Only in the public repository, as
  # rescreen.yml checks.
  start:
    if: >-
      github.repository == 'theorem-labs/rocq-linux-process-semantics' && github.repository_id == 1425819621
      && github.event.pull_request.head.repo.id != 1425819621
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {actions: write}
    steps:
      - name: Wait up to 2 minutes for a CI run of this event, then start the rescreen pass
        # Only values that GitHub sets, none that the author writes: the token, the repository, the head commit, the
        # number, and the time of the event (the pull request's updated_at, which GitHub writes at the event). gh
        # reads the repository from GH_REPO, as no checkout gives it one.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          NUMBER: ${{ github.event.pull_request.number }}
          SINCE: ${{ github.event.pull_request.updated_at }}
        run: |
          set -euo pipefail
          # The wait ends 2 minutes after it starts (R14).
          deadline=$(( $(date +%s) + 120 ))
          while :; do
            # The pull_request runs of the head commit that GitHub made at or after the event (SINCE, or any run when
            # it is empty), as GitHub lists them now. GitHub gives each time in one form (2026-11-19T10:00:00Z), so
            # jq compares the times as strings. A read that fails lists none.
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            listed=$(gh api --method GET "repos/$GH_REPO/actions/runs" -f head_sha="$HEAD" -f event=pull_request \
              --jq '[.workflow_runs[] | select(.head_sha == $ENV.HEAD and .event == "pull_request"
                and (.created_at // "") >= $ENV.SINCE)] | length') \
              || listed=0
            if [[ $listed =~ ^[1-9][0-9]*$ ]]; then
              echo "GitHub lists $listed pull_request run(s) of $HEAD made since the event."
              break
            fi
            now=$(date +%s)
            if (( now >= deadline )); then
              echo "GitHub lists no pull_request run of $HEAD made since the event, after 2 minutes."
              break
            fi
            sleep $(( deadline - now < 10 ? deadline - now : 10 ))
          done
          # The one write, with the number of the pull request. When GitHub refuses it, the step fails.
          gh workflow run rescreen.yml --ref main -f number="$NUMBER"
          echo "The rescreen pass starts on main for #$NUMBER."
