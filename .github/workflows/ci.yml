name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Each push to main gets its own group, so its run is never cancelled or
# replaced: the next push is routed against this one, so a lost run would leave
# this commit unchecked. A pull request's newer head cancels its older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides from this event's own diff which jobs run: against the base for a
  # pull request, against the previous tip of main for a push (so every
  # commit of a multi-commit push counts).
  #
  #   build    (the Rocq lanes and `opam install`) is false only when every
  #            changed path is *.md, LICENSE or one of the review workflow's
  #            own files below. Every other .github/ file stays an input:
  #            the lanes run .github/check_assumptions.py.
  #   review   (the review workflow's tests) is true when one of the review
  #            workflow's own files changed: .github/workflows/review.yml,
  #            .github/test_review.py, .github/test_screen.py,
  #            .github/screen.py, .github/review.md. The tests read the
  #            workflow and import the screen.
  #
  # It fails safe: no usable base, an empty diff or a change to this file
  # runs every job. .github/test_ci.py runs this script and the `ci` job's on
  # every case first, so a route that decides wrongly fails `CI`.
  route:
    name: Route
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.route.outputs.build }}
      review: ${{ steps.route.outputs.review }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Here because this job always runs and no route can skip it.
      - name: The route decides what it is meant to decide
        run: python3 .github/test_ci.py
      - id: route
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          everything() {
            echo "$1; running everything."
            { echo build=true; echo review=true; } >> "$GITHUB_OUTPUT"
            exit 0
          }
          case "$EVENT" in
            pull_request) base="$PR_BASE"; range="$base...HEAD" ;;
            push) base="$PUSH_BEFORE"; range="$base..HEAD" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            everything "No usable base ($EVENT)"
          fi
          git diff --name-only --no-renames "$range" > "$RUNNER_TEMP/changed"
          echo "Changed files:"; cat "$RUNNER_TEMP/changed"
          # An empty diff said nothing, which is what a wrong base looks like.
          [ -s "$RUNNER_TEMP/changed" ] || everything "The diff against $base is empty"
          grep -qx '\.github/workflows/ci\.yml' "$RUNNER_TEMP/changed" \
            && everything "This workflow changed"
          review_files='^\.github/(workflows/review\.yml|test_review\.py|test_screen\.py|screen\.py|review\.md)$'
          # grep answers 0 when it selects a line, 1 when it selects none, 2 or more on an error.
          answer() {
            rc=0; grep "$@" "$RUNNER_TEMP/changed" || rc=$?
            case "$rc" in
              0) echo true ;;
              1) echo false ;;
              *) echo "grep failed ($rc)" >&2; return 1 ;;
            esac
          }
          build=$(answer -Eqv "(\.md$|^LICENSE$|$review_files)")
          review=$(answer -Eq "$review_files")
          echo "build=$build review=$review"
          { echo "build=$build"; echo "review=$review"; } >> "$GITHUB_OUTPUT"

  build:
    name: Build and check (Rocq ${{ matrix.rocq }})
    needs: route
    if: needs.route.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          # The images pin an older dune; pin one that the build supports.
          - rocq: '9.2'
            dune: '3.23.1'
          - rocq: '9.3'
            dune: '3.24.2'
          - rocq: 'dev'
            dune: '3.24.2'
    steps:
      - uses: actions/checkout@v4

      # THE DUNE CACHE. dune stores each rule's outputs under a digest of all
      # the rule's inputs. The inputs include the rocq binary (dune 3.24.2,
      # src/dune_rules/command.ml, `dep_prog`) and the .vo files the rule
      # loads. So a restored entry serves only a rule whose inputs are byte for
      # byte the same. They do not include the OCaml plugins rocq loads, so
      # .github/dune-cache-toolchain.sh empties the cache when the toolchain
      # changed. The key decides only which entries are on disk. It never
      # decides which entry a rule uses, so it can fall back to a prefix. Only
      # a push to main saves. A cache that a pull request saves serves that
      # pull request alone, and it pushes main's caches out of the repository's
      # 10 GB. When the `dev` image moves, its entries miss, and the cache is
      # emptied if a plugin or a package changed.
      - name: The dune cache key
        id: dune-key
        run: |
          prefix="dune-build-$RUNNER_OS-rocq${{ matrix.rocq }}-dune${{ matrix.dune }}-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Restore the dune cache
        id: dune-restore
        uses: actions/cache/restore@v4
        with:
          path: .dune-cache
          key: ${{ steps.dune-key.outputs.key }}
          restore-keys: ${{ steps.dune-key.outputs.prefix }}

      - uses: rocq-prover/docker-opam-action@master
        with:
          # The action keeps its historical input name.
          coq_version: ${{ matrix.rocq }}
          before_install: |
            startGroup "Fix workspace permissions"
              sudo chown -R $(id -u):$(id -g) .
              git config --global --add safe.directory /github/workspace
            endGroup
            startGroup "Install Python 3"
              sudo apt-get update -y -q
              sudo apt-get install -y -q --no-install-recommends python3
            endGroup
          # The dune cache is in the workspace, because the workspace is the
          # one host directory that the action mounts into its container.
          #
          # `enabled`: under dune's default, `enabled-except-user-rules`, dune
          # 3.24.2 stores no Rocq or OCaml rule (only Melange rules opt in,
          # src/dune_rules/module_compilation.ml), and the cache stays empty.
          # `enabled` also stores the user rules, the Python generators of
          # theories/Examples/dune and tests/dune. Each one declares the files
          # it reads, except gen_fd_lemmas.py: it runs rocq, and in the opam
          # job's `dune build -p` it reads the installed decoder. So its rule
          # depends on (universe), and dune never takes it from the cache.
          #
          # `copy`: opam builds the dependencies outside the workspace. A hard
          # link across two mounts fails (EXDEV), and then dune stores nothing
          # (src/dune_cache/shared.ml, which logs it at info level only).
          install: |
            startGroup "Install dependencies"
              export DUNE_CACHE=enabled DUNE_CACHE_STORAGE_MODE=copy
              export DUNE_CACHE_ROOT="$PWD/.dune-cache"
              opam update -y
              opam pin add -k version -y dune "${{ matrix.dune }}"
              opam install -y -j 2 --deps-only .
            endGroup
            startGroup "Check the dune cache against the toolchain"
              bash .github/dune-cache-toolchain.sh "$DUNE_CACHE_ROOT"
            endGroup
          script: |
            startGroup "Tool versions"
              opam exec -- dune --version
              opam exec -- rocq --version
            endGroup
            startGroup "Build everything (dune build)"
              opam exec -- dune build --display short
            endGroup
            startGroup "Check the generated Checker.v files"
              python3 tools/gen_checker.py --check
              python3 tools/gen_checker.py --verify
            endGroup
            startGroup "Kernel-check and audit assumptions of the example proofs"
              opam exec -- python3 .github/check_assumptions.py
            endGroup
            startGroup "Test elf-snapshot"
              python3 tools/test_elf_snapshot.py
            endGroup
            startGroup "Trim the dune cache"
              opam exec -- dune cache trim --size=2500MB
              # dune writes some entries readable by their owner only, and the
              # owner is this container's user. The save step runs as the
              # runner's user.
              chmod -R a+rX .dune-cache
              du -sh .dune-cache
            endGroup
          uninstall: ''

      # A run whose key hit exactly saves nothing, because that key exists,
      # even when the toolchain check emptied the cache. Only a second run of
      # the same tree (a re-run, or a push that brings a tree back) does that,
      # and it builds cold. The next push of another tree saves again.
      - name: Save the dune cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.dune-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .dune-cache
          key: ${{ steps.dune-key.outputs.key }}

  # The scripts of .github/workflows/review.yml, run against a stand-in gh (.github/test_review.py): who is reviewed and
  # who is screened first, which jobs run on each route, which comments the review reads, and what the posted comment
  # can notify or link; and its screen, against stand-in services (.github/test_screen.py). It runs when the route's
  # `review` answer is true: a change to the review workflow's own files, or to this file.
  review-workflow:
    name: Review workflow
    needs: route
    if: needs.route.outputs.review == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false
      - run: python3 .github/test_review.py
      - run: python3 .github/test_screen.py

  opam:
    name: opam install
    needs: route
    if: needs.route.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # The same kind of dune cache as the build lanes (see the comment at their
    # `install:`), in dune's default root ~/.cache/dune. setup-ocaml's
    # `dune-cache: true` saved about 400 bytes on every run, for two reasons.
    # It left DUNE_CACHE at dune's default, which stores no Rocq or OCaml
    # rule. And opam's sandbox binds the build directory and that root as two
    # mounts, so dune's hard link between them fails (EXDEV). `enabled` and
    # `copy` remove both reasons.
    env:
      DUNE_CACHE: enabled
      DUNE_CACHE_STORAGE_MODE: copy
    steps:
      - uses: actions/checkout@v4

      - name: The dune cache key
        id: dune-key
        run: |
          prefix="dune-opam-$RUNNER_OS-ocaml5.3-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Restore the dune cache
        id: dune-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/dune
          key: ${{ steps.dune-key.outputs.key }}
          restore-keys: ${{ steps.dune-key.outputs.prefix }}

      # setup-ocaml's own opam cache (`cache`, on by default) saves only when
      # no entry with its key is visible from this run's ref, main's included
      # (setup-ocaml src/cache.ts, `saveOpamCache`). Main holds that entry, so
      # a pull request saves one only between a change of the key (the opam or
      # OCaml version) and main's next run.
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
          opam-repositories: |
            default: https://github.com/ocaml/opam-repository.git
            rocq-released: https://rocq-prover.org/opam/released

      # The dependencies first, so that the toolchain check below sees every
      # plugin the packages' build loads.
      - name: Install the dependencies
        run: opam install --yes --deps-only .

      - name: Check the dune cache against the toolchain
        run: bash .github/dune-cache-toolchain.sh ~/.cache/dune

      - name: Pin and install all packages
        run: opam pin add --yes .

      - name: Use the installed packages
        run: |
          opam exec -- rocq --version
          cat > "$RUNNER_TEMP/Use.v" <<'EOF'
          From LinuxProcessSemantics.EquivalenceDefinition Require Import Equivalence.
          From LinuxProcessSemantics.Common Require Import ShapeAlg.
          From LinuxProcessSemantics.Examples.rwx_flag_ns Require Import Proof.
          Check Proof.strong_universal.
          EOF
          opam exec -- rocq c "$RUNNER_TEMP/Use.v"
          opam exec -- elf-snapshot --help > /dev/null
          opam exec -- gen-fd-lemmas --help > /dev/null

      - name: Trim the dune cache
        run: |
          opam exec -- dune cache trim --size=2500MB
          du -sh ~/.cache/dune

      - name: Save the dune cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.dune-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/dune
          key: ${{ steps.dune-key.outputs.key }}

  # Main keeps one dune cache per lane and one for the opam job: after the
  # saves, this job deletes the older caches of each (.github/cache-prune.sh
  # says how). It alone holds `actions: write`, and it runs no code of a pull
  # request: the lanes and the opam job, which build that code, keep the
  # workflow's read-only token. Each new key ends with the tree of this commit,
  # so the job finds each family by that suffix.
  prune:
    name: Prune the dune caches
    needs: [route, build, opam]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.route.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned: this job holds a write token)
        with:
          persist-credentials: false
      - name: Delete the older caches of each lane
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          keys=$(gh api "repos/$GITHUB_REPOSITORY/actions/caches?key=dune-&ref=$GITHUB_REF&per_page=100" \
                   --jq ".actions_caches[].key | select(endswith(\"-$tree\"))") \
            || { echo "::warning::could not list the dune caches"; exit 0; }
          for new in $keys; do
            bash .github/cache-prune.sh "${new%"$tree"}" "$new"
          done

  # The one check to require: it always runs, and passes only when the route
  # succeeded with a decision and every job it started passed (a job the
  # route skipped counts as passed). All three Rocq lanes stay blocking.
  ci:
    name: CI
    needs: [route, build, opam, review-workflow]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          ROUTE: ${{ needs.route.result }}
          BUILD_ROUTED: ${{ needs.route.outputs.build }}
          REVIEW_ROUTED: ${{ needs.route.outputs.review }}
          BUILD: ${{ needs.build.result }}
          OPAM: ${{ needs.opam.result }}
          REVIEW_WORKFLOW: ${{ needs.review-workflow.result }}
        run: |
          echo "route=$ROUTE build-routed=$BUILD_ROUTED review-routed=$REVIEW_ROUTED build=$BUILD opam=$OPAM review-workflow=$REVIEW_WORKFLOW"
          [ "$ROUTE" = success ] || { echo "route did not succeed"; exit 1; }
          if [ "$BUILD_ROUTED" = true ]; then
            [ "$BUILD" = success ] && [ "$OPAM" = success ] || { echo "a lane did not pass"; exit 1; }
          elif [ "$BUILD_ROUTED" = false ]; then
            [ "$BUILD" = skipped ] && [ "$OPAM" = skipped ] || { echo "unexpected lane result"; exit 1; }
          else
            echo "the route decided nothing for the lanes"; exit 1
          fi
          if [ "$REVIEW_ROUTED" = true ]; then
            [ "$REVIEW_WORKFLOW" = success ] || { echo "the review workflow's tests did not pass"; exit 1; }
          elif [ "$REVIEW_ROUTED" = false ]; then
            [ "$REVIEW_WORKFLOW" = skipped ] || { echo "unexpected review workflow result"; exit 1; }
          else
            echo "the route decided nothing for the review workflow"; exit 1
          fi
