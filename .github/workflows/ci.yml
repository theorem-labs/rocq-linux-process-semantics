name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One group per branch: a newer push to main, or a pull request's newer head,
# cancels the run of the older one. Every job runs whole on every event, and
# no job reads the previous tip of main any more (a route once did), so the
# newer run checks all the older one would have. A cancelled run on main loses
# only its cache save; the newer run saves.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every job runs on every event: this repository has no merge queue, so a
  # pull request's run is the whole check of its change. A change that touches
  # no Rocq source keeps the lanes short through dune's cache, not by skipping
  # them. The tests of the review workflow have their own workflow,
  # .github/workflows/review-tests.yml.
  checks:
    name: Conflict markers and the gates' tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # A merge conflict left in a file no compiler reads has no other gate.
      # README.md carried three markers through six landings, one red head,
      # one repair and two fully green CI runs; SCOPE.md carried two on a
      # branch at the same time. Both are outside the Rocq lanes, which read
      # no Markdown, so this job searches every tracked file.
      - name: No conflict markers
        run: |
          set -euo pipefail
          # Only the opening and closing arms. The middle arm of a conflict
          # is seven '=' alone on a line, which is also how Markdown
          # underlines a title -- a gate that fails on a heading is worse
          # than no gate. Nothing loses by leaving it out: a conflict block
          # always carries both of these.
          if git grep -nE '^(<<<<<<<|>>>>>>>)( |$)' -- . ':(exclude).github/workflows/ci.yml'; then
            echo "::error::a merge conflict marker is committed in the lines above"
            exit 1
          fi
          echo "no conflict markers (searched every tracked file)"
      - name: The gates decide what they are meant to decide
        run: python3 .github/test_ci.py

  build:
    name: Build and check (Rocq ${{ matrix.rocq }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          # The images carry dune 3.21.1; the build needs the dune named here
          # (see THE DUNE OF THE BUILD below).
          - rocq: '9.2'
            dune: '3.23.1'
          - rocq: '9.3'
            dune: '3.24.2'
          - rocq: 'dev'
            dune: '3.24.2'
    steps:
      - uses: actions/checkout@v4

      # THE DUNE CACHE. dune stores each rule's outputs under a digest of all
      # the rule's inputs. The inputs include the rocq binary (dune 3.24.2,
      # src/dune_rules/command.ml, `dep_prog`) and the .vo files the rule
      # loads. So a restored entry serves only a rule whose inputs are byte for
      # byte the same. They do not include the OCaml plugins rocq loads, so
      # .github/dune-cache-toolchain.sh empties the cache when the toolchain
      # changed. The key decides only which entries are on disk. It never
      # decides which entry a rule uses, so it can fall back to a prefix.
      #
      # A push to main, and a pull request from a branch of this repository,
      # save when their exact key missed. GitHub scopes a cache to the ref that
      # saved it: main's entries serve every run, a pull request's serve only
      # that pull request's later runs (its restore looks in its own scope
      # first, then main's). So the second push of a pull request rebuilds
      # only what changed since its first, not its whole difference from main
      # again: with only main saving, each of #153's 16 runs rebuilt 45-56
      # minutes per lane, because main got one push that week. A pull
      # request's entries can hold whatever its own code wrote, and they serve
      # only that pull request, whose author already controls its workflow;
      # main's run reads main's scope alone. Fork pull requests and
      # workflow_dispatch runs do not save. After each run's saves, the prune
      # job deletes the older entries of each lane on that ref, best effort (a
      # cancelled run can leave one until the next prune or GitHub's eviction).
      # When the `dev` image moves, its entries miss, and the cache is emptied
      # if a plugin or a package changed.
      - name: The dune cache key
        id: dune-key
        run: |
          prefix="dune-build-$RUNNER_OS-rocq${{ matrix.rocq }}-dune${{ matrix.dune }}-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Restore the dune cache
        id: dune-restore
        uses: actions/cache/restore@v4
        with:
          path: .dune-cache
          key: ${{ steps.dune-key.outputs.key }}
          restore-keys: ${{ steps.dune-key.outputs.prefix }}

      - uses: rocq-prover/docker-opam-action@master
        with:
          # The action keeps its historical input name.
          coq_version: ${{ matrix.rocq }}
          before_install: |
            startGroup "Fix workspace permissions"
              sudo chown -R $(id -u):$(id -g) .
              git config --global --add safe.directory /github/workspace
            endGroup
            startGroup "Install Python 3"
              sudo apt-get update -y -q
              sudo apt-get install -y -q --no-install-recommends python3
            endGroup
          # The dune cache is in the workspace, because the workspace is the
          # one host directory that the action mounts into its container.
          #
          # `enabled`: under dune's default, `enabled-except-user-rules`, dune
          # 3.24.2 stores no Rocq or OCaml rule (only Melange rules opt in,
          # src/dune_rules/module_compilation.ml), and the cache stays empty.
          # `enabled` also stores the user rules, the Python generators of
          # theories/Examples/dune and tests/dune. Each one declares the files
          # it reads, except gen_fd_lemmas.py: it runs rocq, and in the opam
          # job's `dune build -p` it reads the installed decoder. So its rule
          # depends on (universe), and dune never takes it from the cache.
          #
          # `copy`: opam builds the dependencies outside the workspace. A hard
          # link across two mounts fails (EXDEV), and then dune stores nothing
          # (src/dune_cache/shared.ml, which logs it at info level only).
          #
          # THE DUNE OF THE BUILD. This repository and rocq-read-file 0.0.3
          # need dune 3.23 or later (`(lang dune 3.23)`, `(using rocq 0.13)`),
          # and the images carry 3.21.1. Upgrading the switch's dune made opam
          # rebuild every package that depends on it, rocq-runtime, rocq-core,
          # coqide-server, rocq-stdlib and bignums: 4 to 6.5 minutes of every
          # run. So the switch keeps the image's dune, and the pinned dune is
          # built beside it: from the source tarball that the opam repository
          # names and checksums (`opam source`), by the recipe of dune's own
          # opam file. It is built before the dune cache variables are set, so
          # its own rules do not enter this repository's dune cache.
          #
          # opam runs each package's build with the switch's bin first on PATH,
          # and so does `opam exec`. So `wrap-build-commands` puts the pinned
          # dune first for opam's builds of the dependencies, and the script
          # calls it by its path, $DUNE. `--ignore-constraints-on=dune` lets
          # opam install the dependencies beside the image's dune. Without the
          # pin of dune-configurator the solver takes its newest version, whose
          # `(lang dune 3.25)` the pinned dune cannot build; the pin keeps the
          # version of the pinned dune, the one opam chose before. opam builds
          # with every core, where the action's default was 2 of 4.
          #
          # `--ignore-constraints-on=dune` drops every dependency's bounds on
          # dune, not only the one above, so a later release could need a dune
          # newer than the pin, or older, and still be chosen. So opam's solver
          # checks the installed dependencies against the pinned dune, with
          # every constraint on: it simulates the old step, the pin of dune at
          # its version in this switch (`--dry-run` keeps the image's pin), and
          # the job fails unless that plan changes dune and otherwise only
          # recompiles what depends on it. A plan that removes, installs or
          # changes any other package, or no plan at all, means an installed
          # dependency's bounds exclude the pinned dune. With dune-configurator
          # 3.25.0 installed beside dune 3.23.1, the plan downgrades it. A plan
          # without dune in it would check nothing, so it fails too: then the
          # image carries the pinned dune, and the dune beside it can go.
          install: |
            startGroup "Build dune ${{ matrix.dune }} beside the switch"
              opam update -y
              opam source "dune.${{ matrix.dune }}" --dir /tmp/dune
              (cd /tmp/dune && ocaml boot/bootstrap.ml -j "$(nproc)" \
                && ./_boot/dune.exe build dune.install --release --profile dune-bootstrap -j "$(nproc)")
              export DUNE=/tmp/dune/_build/install/default/bin/dune
              "$DUNE" --version
              opam option wrap-build-commands="[\"env\" \"PATH=${DUNE%/*}:$PATH\"]"
            endGroup
            startGroup "Check the dune cache against the image's toolchain"
              export DUNE_CACHE=enabled DUNE_CACHE_STORAGE_MODE=copy
              export DUNE_CACHE_ROOT="$PWD/.dune-cache"
              bash .github/dune-cache-toolchain.sh "$DUNE_CACHE_ROOT" before
            endGroup
            startGroup "Install dependencies"
              opam pin add -n -k version -y dune-configurator "${{ matrix.dune }}"
              opam install -y -j "$(nproc)" --deps-only --ignore-constraints-on=dune .
            endGroup
            startGroup "Check the dependencies against dune ${{ matrix.dune }}"
              plan=$(opam pin add -k version --dry-run --show-actions -y dune "${{ matrix.dune }}" 2>&1) || {
                echo "$plan"
                echo "::error::opam finds no plan that installs dune ${{ matrix.dune }} beside these dependencies"
                exit 1; }
              echo "$plan"
              # awk exits 0 only for a valid plan, so its own failure (a
              # syntax error, or no awk at all) fails the job too.
              if ! awk '$1 == "-" && $3 == "dune" && ($2 == "upgrade" || $2 == "downgrade") { dune = 1; next }
                        $1 == "-" && $2 != "recompile" { print "not dune or a recompile: " $0; bad = 1 }
                        END { if (!dune) print "the plan does not change dune"; exit (bad || !dune) }' <<< "$plan"; then
                echo "::error::opam's plan for dune ${{ matrix.dune }} is not a change of dune and recompiles only"
                exit 1
              fi
            endGroup
            startGroup "Check the dune cache against the toolchain"
              bash .github/dune-cache-toolchain.sh "$DUNE_CACHE_ROOT" after
            endGroup
          script: |
            startGroup "Tool versions"
              opam exec -- "$DUNE" --version
              opam exec -- rocq --version
            endGroup
            startGroup "Stack limit for deep proof terms"
              # A deep Qed overflows the 8 MiB default and the process dies on a
              # signal, which reads like a proof fault and is not one.
              #
              # One command, not hard-then-soft: it sets both together and is
              # legal whether the soft limit starts at 8 MiB or at unlimited.
              # Lowering the hard limit below a soft limit of unlimited is
              # EINVAL, so the two-step form can leave the process at unlimited,
              # which some sandboxes serve as 8 MiB -- the very failure this
              # guards against.
              ulimit -s 131072
              # Read both back and refuse. A setter can return success and
              # change nothing; the printed value is the measurement and the
              # request is only a request. Without this the build runs at the
              # wrong limit and the result gets blamed on the proof.
              soft=$(ulimit -Ss); hard=$(ulimit -Hs)
              echo "stack soft=$soft hard=$hard"
              [ "$soft $hard" = "131072 131072" ] || {
                echo "stack limit is $soft/$hard, refusing"; exit 2; }
            endGroup
            startGroup "Build everything (dune build)"
              opam exec -- "$DUNE" build --display short
            endGroup
            startGroup "Check the generated Checker.v files"
              python3 tools/gen_checker.py --check
              python3 tools/gen_checker.py --verify
            endGroup
            startGroup "Kernel-check and audit assumptions of the example proofs"
              opam exec -- python3 .github/check_assumptions.py
            endGroup
            startGroup "Test elf-snapshot"
              python3 tools/test_elf_snapshot.py
            endGroup
            startGroup "Trim the dune cache"
              opam exec -- "$DUNE" cache trim --size=2500MB
              # dune writes some entries readable by their owner only, and the
              # owner is this container's user. The save step runs as the
              # runner's user.
              chmod -R a+rX .dune-cache
              du -sh .dune-cache
            endGroup
          uninstall: ''

      # A run whose key hit exactly saves nothing, because that key exists,
      # even when the toolchain check emptied the cache. Only a second run of
      # the same tree (a re-run, or a push that brings a tree back) does that,
      # and it builds cold. The next push of another tree saves again.
      - name: Save the dune cache
        if: >-
          ${{ steps.dune-restore.outputs.cache-hit != 'true'
          && ((github.event_name == 'push' && github.ref == 'refs/heads/main')
              || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        uses: actions/cache/save@v4
        with:
          path: .dune-cache
          key: ${{ steps.dune-key.outputs.key }}

  opam:
    name: opam install
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # The same kind of dune cache as the build lanes (see the comment at their
    # `install:`), in dune's default root ~/.cache/dune. setup-ocaml's
    # `dune-cache: true` saved about 400 bytes on every run, for two reasons.
    # It left DUNE_CACHE at dune's default, which stores no Rocq or OCaml
    # rule. And opam's sandbox binds the build directory and that root as two
    # mounts, so dune's hard link between them fails (EXDEV). `enabled` and
    # `copy` remove both reasons.
    env:
      DUNE_CACHE: enabled
      DUNE_CACHE_STORAGE_MODE: copy
    steps:
      - uses: actions/checkout@v4

      - name: The dune cache key
        id: dune-key
        run: |
          prefix="dune-opam-$RUNNER_OS-ocaml5.3-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Restore the dune cache
        id: dune-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/dune
          key: ${{ steps.dune-key.outputs.key }}
          restore-keys: ${{ steps.dune-key.outputs.prefix }}

      # setup-ocaml's own opam cache (`cache`, on by default) saves only when
      # no entry with its key is visible from this run's ref, main's included
      # (setup-ocaml src/cache.ts, `saveOpamCache`). Main holds that entry, so
      # a pull request saves one only between a change of the key (the opam or
      # OCaml version) and main's next run.
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
          opam-repositories: |
            default: https://github.com/ocaml/opam-repository.git
            rocq-released: https://rocq-prover.org/opam/released

      # The switch as setup-ocaml left it, then the dependencies, so that the
      # toolchain check after them sees every plugin the packages' build loads.
      - name: Check the dune cache against the compiler
        run: bash .github/dune-cache-toolchain.sh ~/.cache/dune before

      # Rocq is built from source on setup-ocaml's OCaml 5.3, which no lane
      # covers, so this job keeps its install, with every core. No cache keeps
      # the result: the repository's 10 GB of Actions cache holds the dune
      # caches, and an installed switch saved there (723 MB for a lane) was
      # evicted before the next run an hour later.
      - name: Install the dependencies
        run: opam install --yes -j "$(nproc)" --deps-only .

      - name: Check the dune cache against the toolchain
        run: bash .github/dune-cache-toolchain.sh ~/.cache/dune after

      - name: Pin and install all packages
        run: opam pin add --yes .

      - name: Use the installed packages
        run: |
          opam exec -- rocq --version
          cat > "$RUNNER_TEMP/Use.v" <<'EOF'
          From LinuxProcessSemantics.EquivalenceDefinition Require Import Equivalence.
          From LinuxProcessSemantics.Common Require Import ShapeAlg.
          From LinuxProcessSemantics.Examples.rwx_flag_ns Require Import Proof.
          Check Proof.strong_universal.
          EOF
          opam exec -- rocq c "$RUNNER_TEMP/Use.v"
          opam exec -- elf-snapshot --help > /dev/null
          opam exec -- gen-fd-lemmas --help > /dev/null

      - name: Trim the dune cache
        run: |
          opam exec -- dune cache trim --size=2500MB
          du -sh ~/.cache/dune

      - name: Save the dune cache
        if: >-
          ${{ steps.dune-restore.outputs.cache-hit != 'true'
          && ((github.event_name == 'push' && github.ref == 'refs/heads/main')
              || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/dune
          key: ${{ steps.dune-key.outputs.key }}

  # After the saves, this job deletes the older dune caches of each lane and of
  # the opam job on this run's ref (main, or the pull request's merge ref), so
  # each ref keeps about one per family (.github/cache-prune.sh says how). It
  # alone holds `actions: write`, and it runs no checked-out file of a pull
  # request: on a pull request it checks out main, runs main's script, and
  # reads the tree of the tested commit through the API. The lanes and the
  # opam job, which build that code, keep the workflow's read-only token. It
  # runs for pull requests from this repository's own branches only; a fork's
  # token cannot delete. Each new key ends with the tree of the tested commit,
  # so the job finds each family by that suffix.
  prune:
    name: Prune the dune caches
    needs: [build, opam]
    if: >-
      ${{ !cancelled()
      && ((github.event_name == 'push' && github.ref == 'refs/heads/main')
          || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned: this job holds a write token)
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.repository.default_branch || github.sha }}
          persist-credentials: false
      - name: Delete the older caches of each lane
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha) \
            || { echo "::warning::could not read the tree of $GITHUB_SHA"; exit 0; }
          keys=$(gh api "repos/$GITHUB_REPOSITORY/actions/caches?key=dune-&ref=$GITHUB_REF&per_page=100" \
                   --jq ".actions_caches[].key | select(endswith(\"-$tree\"))") \
            || { echo "::warning::could not list the dune caches"; exit 0; }
          for new in $keys; do
            bash .github/cache-prune.sh "${new%"$tree"}" "$new"
          done

  # The one check to require: it always runs, and passes only when every job it
  # needs succeeded. All three Rocq lanes stay blocking.
  ci:
    name: CI
    needs: [checks, build, opam]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -c 'map_values(.result)'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null \
            || { echo "a job did not pass"; exit 1; }
