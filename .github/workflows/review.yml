# review.yml: Claude reviews pull requests into main and issues by the rules in .github/review.md, and the review is
# posted as a comment there.
#
# Four workflows. CI (.github/workflows/ci.yml) runs on pull_request with the copy of ci.yml at the pull request's
# merge commit, a token that can only read, no secret and no identity token. This file runs when such a CI run
# completes (workflow_run), and on issues, issue_comment and workflow_dispatch; never on a schedule. GitHub runs each of
# these events with main's copy of this file, so a pull request, from a fork or not, cannot change what runs here. From
# the CI run, the jobs that hold a right take only its head commit, its head repository, its head branch and the pull
# requests that GitHub names in it. The trust job takes the one of those into main. For a fork's pull request GitHub
# names none, and the trust job finds it among the open pull requests by the head commit, the head repository and the
# head branch: only when exactly one has them, and that one is into main. A CI run of a pull request into another
# branch starts no review. The jobs read the head, the author, the text and the diff from the GitHub API, and never
# download an artifact of the CI run. The CI run's results reach the review as data: the head's check runs and statuses
# (.review/checks.json). A run by hand on a ref other than main runs no job: the if of each job checks the ref, so such
# a run holds no identity and posts nothing. GitHub's == compares strings with no case, so refs/heads/MAIN passes such
# an if: the step of the trust job, which every other job needs, also compares the ref byte for byte in the shell, and
# stops on any other ref. The rescreen pass (.github/workflows/rescreen.yml) runs on events alone too, and starts the
# runs of this file that the open items are due (below); it holds no identity and no secret, and writes nothing but
# those runs. Each event of a pull request from a fork on which a pull_request workflow runs (opened, synchronize,
# reopened and closed) starts it too, through .github/workflows/screen-start.yml, the one workflow of this repository
# that runs on pull_request_target: it holds actions: write alone, and only starts the pass with the number of that
# pull request. That run of the pass takes nothing for a pull request that is not open, and else only the conflict run
# of that pull request, or the screen and the approval of the runs of its head that GitHub holds.
#
# Tasks. The trust job gives each run one task, and the jobs after it do that task alone:
#   review    a pull request's new head (the workflow_run of its CI run), a new issue of an account with write access,
#             or a run by hand with a number: the review comment, and for a blocking finding of an outside pull request
#             the fix, as one review of suggested changes.
#   answer    a new comment of an outside item's author in its conversation (issue_comment): the answer to each
#             comment of the author that waits, and the fix when a comment asks for it.
#   draft     a new issue of an outside author: a draft of the reply, which is uploaded as an artifact of the run and
#             not posted.
#   reply     a run by hand with a reply text that Sami approved, which is posted as it is.
#   rescreen  a held item, screened again (below).
#   approve   a first-time contributor's pull request whose CI runs GitHub holds: the screen, and, when it passes, the
#             approval of the held runs. A head that changes a file under .github/, or 3,000 files or more, gets no
#             approval: Sami approves its runs. A run by hand with the task review on such a pull request gets this
#             task.
#   catchup   an outside pull request whose head no run met: the OSS Verify App closes and reopens it, which starts CI.
#             A pull request that a catch-up closed and could not reopen is only reopened. The label comment records
#             the head, so that each head gets one catch-up.
#   conflict  a pull request with a merge conflict, for which GitHub starts no CI run: a comment that asks its author
#             to resolve the conflict.
#   relabel   the import check run of R12 and the label and the label comment of a head, set again with no model from
#             what the workflow wrote of the head: its review, an answer of its author, its fixes and a hold comment.
#   stop      the rescreen pass's run for an item whose work is not tried again (a bound of its tries): the trust job
#             decides the stop again, and the comment job gives the item waits-on-theorem and the hold comment that
#             says so. No screen and no model.
#   measure   the screen, measured on its private labelled set.
# An answer run, or a run by hand, that reads a merge conflict in its pull request gets the task conflict. The name of a
# run gives its task, its item and the account whose limit it counts on (run-name, below), but a CI run's name gives the
# account that pushed: the name of its screen job (screen <account>) gives the account whose limit it counts on. The
# scripts that count runs read those names, and #<n> in a run's name ends at a space or at the end of the name, so that
# #12 is never #123.
#
# Export pull requests. The export opens pull requests into main from branches of this repository whose names start
# with release/. Such a pull request is no item of this workflow (OSSV-221's architect, 2026-11-22 17:18Z). The trust
# job gives it no task on any event and for any task, and the rescreen pass starts no run of it (held.sh, exported).
# So it gets no review, screen, label, comment, close, reopen, approval of held runs, import check run or withdrawal
# of one. A fork's branch with such a name does not make an export pull request: the head repository decides.
#
# Who is screened. Write access is what GitHub's collaborator permission API answers: admin or write (maintain counts
# as write). Membership of the organisation alone is not write access. The Apps in APPS count as having it.
#
# - When the item's author has write access, and so does the account whose action started the run, it is reviewed.
# - Otherwise it is screened first (the screen job, .github/screen.py). Independent checks read the text that the
#   account wrote: Google Cloud Model Armor's prompt injection and jailbreak filter, always; Azure AI Content Safety's
#   Prompt Shields, and a small Claude model with no tools whose answer a schema holds to the words clean and
#   suspicious, each when its identity is set up below. When every check that ran answers clean it is reviewed, as a
#   writer's is. Otherwise, and when a check that ran cannot answer, it is held: it gets the label review-held and a
#   short comment, and no review. Why it was held goes to a private bucket, never to this run's log or outputs. When
#   the account that started the run has no write access and the runs of the account whose limit the run counts on
#   have reached the screen OUTSIDE_HOURLY_LIMIT times in the last hour, it is held without a screen, and screened
#   again later with no person (below). An event's run counts on the account that started it, but a CI run of a pull
#   request whose author and pusher both have no write access counts on the author, never on the pusher: anyone can
#   open a pull request whose head is another account's fork branch. Toward the author's limit, the trust job counts
#   the author's own runs, the workflow_dispatch runs whose names end with the author, and the CI runs that another
#   account's pushes start for the author's pull request (their names give the pusher, and their screen jobs give the
#   author).
#   A CI run of another account can count on the author only when that account owns the head repository of an open
#   pull request of the author: the trust job reads the jobs of no other account's CI run, and of at most
#   2 * OUTSIDE_HOURLY_LIMIT runs, the author's own first. When runs that could count are left past those
#   reads, or GitHub does not list them all, or the open pull requests cannot be read, the author counts as at the
#   limit: the run is held without a screen, and a later run tries again. So no padding of runs moves an account past
#   its limit, and the owner of such a head repository can hold the author's items in this way until its runs are an
#   hour old. The pushes of a collaborator of that fork who is not its owner count on no one, and SCREENED_HOURLY_CAP
#   bounds their reviews.
# - An item held for a reason that is not its own is taken again with no person: at that limit; a screened review
#   stopped at SCREENED_HOURLY_CAP; or a screened review, answer or draft that failed or ran out of time, until it has
#   failed REVIEW_TRIES times. After REVIEW_TRIES runs since its hold that end with neither a new hold nor a post, its
#   hold comment says that it is not tried again. A run counts no try when a sign-in that judges nothing failed in it,
#   when the limit or the cap stopped it before any work, or when its trust job succeeded and decided that it has no
#   task (.github/review/held.sh, try_rule). A trust job that failed counts a try. Such a stop of the pass's own run of
#   an approval, a draft, an answer, a rescreen or a review, made while no earlier run of that name was running, settles
#   that work until a new head, comment or hold (held.sh, settles). A newer run of the head also ends the settle of a
#   review. The review, the answer, the draft and the approval of an item each have their own hold comment, so that a
#   hold of one never takes the place of the hold of another. The
#   rescreen pass (rescreen.yml) runs at each completed CI run, each push to main, each new or reopened issue, and by
#   hand. It lists the open pull requests and issues labelled review-held,
#   and for each of those works whose newest hold comment is such a hold, not the screen's, and is over an hour old,
#   it starts this workflow with the task that the marker of the hold names: the
#   answer of the comment that it names (-f task=answer
#   -f comment=<id>), the draft, the approval, or else -f task=rescreen, with the account the hold names
#   (-f account=<login>). A run that GitHub holds starts no workflow_run, so a held item waits for the next of those
#   events. Such a run takes an outsider's path: the trust job reads the author, the hold and the account
#   again from the API, never from the inputs alone, and the item is screened, then reviewed and the review posted, as
#   for an event; only when the author and that account both have write access is it reviewed without the screen, as a
#   writer's item is. When that account has no write access, its screen counts toward the account's
#   OUTSIDE_HOURLY_LIMIT with the account's own runs, so an account still at the limit stays held, and its hold comment
#   says from when it is tried again. An account with write access has no such limit: its rescreens are bounded by the
#   rescreen pass's count alone. An item that the screen held is never taken again this way. The same pass also starts
#   the answer to a comment of an outside author that waits for one, the draft of the reply to an outside issue that
#   has none stored, the approval of a first-time contributor's held runs, the catch-up and the review of a head that
#   no run reviewed, the comment on a merge conflict, a relabel when a conflict went away or the import's paths
#   changed, the App's writes again when the post job could not make them, and a stop when the work of an item reached
#   its bound of tries (rescreen.yml). Each event of a pull request from a fork on which a pull_request workflow runs
#   starts a run of the pass with the number of that pull request (screen-start.yml). That run takes nothing for a pull
#   request that is not open. Else it takes the conflict of that pull request, or the approval of the runs of its head
#   that GitHub holds and the hold of that approval, and no other work.
# - An account with write access can start a run by hand for any pull request or issue, with a task (-f task=<task>,
#   review when none is given) and, for a review, with the screen first (-f screen=true):
#
#   gh workflow run review.yml -R theorem-labs/rocq-linux-process-semantics -f number=<n>
#
# or "Run workflow" on this workflow's page in the Actions tab. GitHub lets only an account with write access start a
# run that way. An App must be one of the APPS. A run that github-actions[bot] starts (the rescreen pass's) is taken
# only for the pass's tasks, and only when its name is the one that the pass gives the task, what it names reads the
# same from the API now, and the reason why the pass started it still holds. Every review reads the comments and
# reviews of the author and of accounts with write access, and no others. An answer reads them too, and the
# workflow's own review, answers, hold comment, label comment and fix reviews on the item.
#
# - The reply to a new issue of an outside author is a draft, which this workflow uploads as the artifact
#   issue-draft-<n> of its run and never posts (.github/review-answer.md, "An issue draft"). Sami approves the text of a
#   reply, and a run by hand on main posts that text word for word, once, and reads nothing else. A person with write
#   access starts it, or an App of the APPS (legion-implementer[bot]), and never the rescreen pass. A run with no text,
#   or of a pull request or of an issue that is not open, posts nothing and fails:
#
#   gh workflow run review.yml -R theorem-labs/rocq-linux-process-semantics -f task=reply -f number=<n> -f reply=<text>
#
# - The screen can be measured: -f task=measure, with no number, runs every listed check three times
#   (-f measure_repeats=<1-5>) on each text of a labelled set kept in the private bucket (-f measure_set=
#   measure/set-v<n>.json, by default measure/set-v1.json), and puts the false holds and missed injections of each
#   rule of SCREEN_RULE's choices in the run's summary. The texts, and each check's words for
#   them, stay in the bucket.
#
# The jobs, and what each one holds:
#   trust   decides the task and the route: review, screen, or held at the limit. For a stop of the rescreen pass, it
#           runs the pass's own functions again for the item (.github/review/held.sh). It checks out that file and
#           .github/review/trusted.sh alone, at the workflow's own commit of main, and its token can only read
#           metadata, contents, pull requests and issues, check runs, and the runs of this repository's workflows.
#   gather  reads the pull request or the issue as data into .review/, and keeps it as this run's artifact, which the
#           screen job and the review job both take, by its SHA-256: the review reads what the screen passed. For an
#           answer, it also lists the comments of the author that wait for an answer: each comment, review and
#           review comment of the author made after what the workflow's newest review, answer or hold read (a review
#           read the conversation when its run started, and an answer up to the comment that its marker names). Its
#           token can only read, and it holds no model.
#   screen  runs in the environment review-screen. Its identity token is exchanged for short-lived tokens, which only
#           a job in that environment can get, and for Google Cloud and Anthropic only a job of this file on main:
#           Google Cloud (Model Armor, and adding the reason to its bucket), Azure (Prompt Shields) and Anthropic (a
#           service account of its own, not the review's). Two steps sign in before the screen: one to Google Cloud,
#           and one to Anthropic and Azure, which writes their tokens to a file in the runner's temporary directory
#           that the Screen step reads and deletes. A sign-in that fails fails the job before the screen, with no
#           verdict. SCREEN_CHECKS names the checks that run. Its GitHub token can only read, and no key is stored.
#           The checks get the text as data, and each answers a word; none can act on it. The screen reads up to
#           400,000 characters of an item and holds a longer one unread. Claude reads the text in pieces of at most
#           150,000 characters. A check that has not answered after 600 seconds holds the item. The sign-in to
#           Anthropic and Azure has 120 seconds of its own, so that the sign-in and the screen fit the job's 15
#           minutes. Its one output is the verdict.
#   review  reads .review/, with this repository's main and the Linux and QEMU source the model describes, and asks
#           Claude for the comment, its verdict and the list of what it asks (.github/review.md). It holds an identity
#           token, which Anthropic exchanges for a short-lived token that can call Claude and nothing else; no key is
#           stored. Anthropic's federation rule admits this file alone, on refs/heads/main, for this file's events,
#           and refuses a job in review-screen, so the screen job cannot get the review's Claude token. The review job
#           cannot get the screen's tokens either: they need the environment. Before the model, a step signs in to
#           Anthropic and drops the token, so that a run the rule does not admit fails there.
#           After the model, a step signs in again for the fresh reader: a second Claude request, with no tools, that
#           shortens the comment (.github/review/trim.py). Code adds each listed item that the shortened review omits,
#           and the whole review in a collapsed block. While SOUNDNESS_HOLD is true, code also gives the verdict person
#           to the review of an outside pull request, or of one whose author's write access GitHub did not say, that
#           changes a file that is not a Markdown file (.md), or a Markdown file that a dune, dune-project or
#           dune-workspace* file of the head or of main makes count: one in
#           its directory or above it that holds .md, or one anywhere that holds a word such as include or source_tree,
#           a glob whose pattern does not end with one fixed extension other than md, or a word with .md and also ..,
#           %{project_root}, %{workspace_root} or a leading /, or that the job cannot read (the gather job reads the
#           changed paths and those files itself), and adds the section on soundness after the shortened review
#           (.github/review/rules.py soundness). For an
#           answer, Claude answers the comments of the author that wait (.github/review-answer.md, "An answer"), and
#           the fresh reader shortens the answer. For a blocking finding of an outside pull request, or an answer that
#           asks for it, Claude then writes the fix as suggested changes on the lines of the diff
#           (.github/review-answer.md, "The fix"). No fix runs when the author said they will make the change, or when
#           2 fix reviews since the author's last own push did not make the review pass. Code keeps only the
#           suggestions on the diff (.github/review/rules.py suggestions). A step signs in again, and the fresh reader
#           shortens the words of the fix, never the lines of a suggested change. The fresh reader can refuse a review,
#           an answer or the words of a fix: then nothing of that text posts, no fix follows a refused review or answer,
#           the run's summary holds the reader's reason and no log line or output does, and the comment job gives the
#           item waits-on-theorem with Sami's next step.
#           The answer and the fix run in this job, so the hourly caps count them with the review. For a draft, Claude
#           writes the reply to a new issue of an outside author (.github/review-answer.md, "An issue draft"), and the
#           fresh reader trims it or refuses it, with the rules of the draft in its request. This job uploads the draft,
#           or the refused draft with the reader's reason, as the artifact issue-draft-<n> of its run, which the
#           OSSV controller copies into its ask to Sami. No output, summary or log line of the run holds the draft,
#           the refused draft or the reason. No job signs in to Google Cloud to store a draft, and a reply has no
#           review job.
#   post    runs in the environment post, which only main reaches and which holds the App's key from the LPS move. It
#           does the App's writes alone, each after a step of its own that mints a token for this repository alone:
#           one with checks: write and pull-requests: write, and one with actions: write alone, only for an approval
#           whose screen passed. For the review of an outside pull request whose screen passed, and for a relabel, it
#           reads the changed paths at the head with its own token and records the check run
#           repo-pairs/import-approved on the head when R12's rule holds (.github/review/rules.py import-check): the
#           screen passed, the verdict is pass, no changed file is under .github/, each changed file is a Markdown file
#           while SOUNDNESS_HOLD is true, and, while the repository variable REPO_PAIRS_IMPORT_PATHS gives the import's
#           paths, the import takes each changed path. The check run's external_id, <number>:<head>, names the pull
#           request that it approves. When a later review of that head gives a blocking finding or the verdict person
#           (also a writer's review by hand, with no screen), or a later screen holds the head, it updates that check
#           run to the conclusion neutral, with an output title that says why, so that the import no longer reads it
#           as an approval. For an approval, it reads the pull request again with its own token, and when
#           the head is still the one the screen read and changes no file under .github/, it approves each run that
#           GitHub holds of that head from the pull request's head repository and branch. For a catch-up, it closes and
#           reopens the pull request with the first token, so that GitHub starts a CI run of its head, or only reopens
#           one that a catch-up closed and could not reopen. It posts no comment and no label, holds no identity token
#           and no model, and its own GitHub token can only read. Until the LPS move of dispatch://OSSV-321, the
#           environment post holds no key: the job then skips each of these writes and their sign-ins, ends with
#           success, and says so in its summary (R10).
#   comment posts the review comment, or replaces the one it posted before, when POST_REVIEW says so, takes the label
#           review-held off (unless a hold of other work of the item is still tried again), and sets the state label
#           and the label comment (below); for a merge conflict, it posts the comment that asks the author to resolve
#           it, with the label waits-on-author. It posts the answer, once for each comment, and the fix as one review
#           of suggested changes, once for each head: an answer of which another run answered a comment after this
#           run read the item posts nothing, and the rescreen pass takes each comment that still waits. For a draft,
#           it posts the label comment alone, and for a reply the approved text, byte for byte and once. For a relabel,
#           it sets the state label and the label comment of the head again, from what the workflow wrote of the head
#           and what the post job decided. For a catch-up that reopened the pull request, it adds the line of the head
#           to the label comment. For an approval whose head changes a file under .github/ or 3,000 files or more, or
#           whose held runs the post job did not approve as the environment post holds no key of the App, it gives the
#           item waits-on-theorem with a label comment that says that Sami approves its runs. For a stop of the
#           rescreen pass, it gives the item waits-on-theorem and writes the hold comment that says that the work is
#           not tried again. It never commits or pushes: its token can write no file of the repository. It uses this
#           run's GitHub token, so none of its comments, reviews and labels starts a run of any workflow.
#   hold    labels a held pull request or issue review-held, says so in the hold comment of the work that it held (the
#           review, the answer, the draft or the approval), and sets the state label and the label comment. It holds
#           no model, and has no screen's reason to read: the screen job's one output is its verdict. It reads this
#           run's jobs and this workflow's runs: did a step that signs in fail (then it holds nothing, and the rescreen
#           pass takes the item again), was the review stopped at the cap, or cancelled by a newer run of the same item
#           and task?
# The rescreen pass is no job of this file: rescreen.yml starts, on main, the runs of this file that the open items are
# due, and runs the failed jobs of a review run again whose screen passed and whose review could not sign in. Its
# token has actions: write, and no job of this file has it.
#
# Labels (.github/review.md, "Outside items and labels"). Each outside item has one state label: waits-on-author when
# the next step is its author's, waits-on-theorem when the next step is Sami's (also for the runs of a pull request
# that changes a file under .github/ or 3,000 files or more, or of one whose screen passed while the environment
# post holds no key of the App), and none while the workflow works on it. The comment and hold jobs set it in the run
# of the event that changes the state, by the one rule of .github/review/rules.py, and setting one takes the other
# off. With it, the item gets one label comment of the workflow, edited in place, which names the next step and who
# takes it. review-held, the mark of a hold, stays beside the state label. Each write of an item's state label and
# label comment runs in one concurrency group of the item, label-<n>, queued and never cancelled: the comment job and
# the hold job are in it, and the comment job writes the label of a stop and of an approval whose held runs the post
# job did not approve. The trust job decides once whether the item's author is an outside author (its outputs outside
# and kind), and each step reads the answer of the author-kind table of .github/review/rules.py: only an outside
# author's item gets a state label, an approval of its held runs and the import check run of R12. Any other item gets no
# state label, and when GitHub did not say whether its author has write access, its state label and its label comment
# stay as they are.
#
# No job runs code of a pull request. The gather job checks out main, never the pull request; it reads the pull
# request's diff and files from git objects as data under .review/, with every CLAUDE.md, AGENTS.md and .claude/ taken
# out. Claude gets the tools Read, Glob and Grep only, in the permission mode dontAsk (a call that would need approval
# is refused), and reads nothing outside the checkout: not the runner's temporary files, which hold the identity
# token, the Claude token and git's own files, nor /proc. It can run nothing and write nothing. The screen job runs
# only .github/screen.py from main, and the review job runs only .github/review/trim.py and .github/review/rules.py
# from main, each after Claude. The post, comment and hold jobs check out main's .github/ alone, and run only
# .github/review/rules.py from it. The hold job also sources .github/review/held.sh from it, for the one rule of what
# counts as a try of a run (try_rule) and the one rule of each writer of a hold comment (replaced_hold). The trust job
# checks out .github/review/trusted.sh and .github/review/held.sh alone, at the commit of main whose workflow file runs,
# and sources those two files alone. The gather job sources .github/review/trusted.sh from its checkout of main.
#
# The sign-ins are admitted by rules outside this repository that name this file, main and its events. Until those
# rules admit the events workflow_run and issue_comment, the screen and review jobs of such runs fail at sign-in, and
# the runs that the rescreen pass starts by workflow_dispatch on main take the item again. Until the environment post
# holds the App's key, the post job skips its sign-ins and the App's writes, and ends with success.
#
# Never re-run this workflow with debug logging. A debug run prints the whole conversation with the model, with the
# pull request's or the issue's text, in the run's log, and anyone can read the logs of a public repository.
name: review
# The name of each run: its task, its item and the account whose limit it counts on, which the trust job, the Count
# step, the hold job and the rescreen pass (rescreen.yml) read. A workflow_run's name holds the whole head commit,
# because GitHub's expressions have no substring function, and that head maps to its pull request through the open pull
# requests (for the rescreen pass, the one that the run's trust job names, when more than one into main has the head).
# It holds the account that pushed: the name of the run's screen job gives the account whose limit it counts on.
# An issue_comment's name holds the comment's id (answer #<n> for <comment> by <login>), by which the rescreen
# pass sees that the run took the comment. A run by hand: <task> #<n>, then " at <head>", " for <comment>" and
# " of <account>" for the inputs given; a stop of the rescreen pass names its stop as its comment:
# stop #<n>[ at <head>] for <stop>.
run-name: >-
  ${{ github.event_name == 'workflow_run'
     && format('review {0} by {1}', github.event.workflow_run.head_sha, github.actor)
  || github.event_name == 'issues' && format('review #{0}', github.event.issue.number)
  || github.event_name == 'issue_comment'
     && format('answer #{0} for {1} by {2}', github.event.issue.number, github.event.comment.id,
               github.event.comment.user.login)
  || inputs.task == 'measure' && 'measure the screen'
  || format('{0} #{1}{2}{3}{4}', inputs.task, inputs.number, inputs.head && format(' at {0}', inputs.head) || '',
            inputs.comment && format(' for {0}', inputs.comment) || '',
            inputs.account && format(' of {0}', inputs.account) || '') }}

on:
  # Each completed run of CI; the trust job takes only a run of a pull request's event.
  workflow_run:
    workflows: [CI]
    types: [completed]
  issues:
    types: [opened, reopened]
  # Each new comment on an issue or a pull request; the trust job takes only one of the item's author.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      number:
        description: Number of the pull request or issue (none when measuring)
        required: false
        type: number
      task:
        description: What the run does (the top of this file)
        type: choice
        default: review
        options: [review, answer, draft, reply, rescreen, approve, catchup, conflict, relabel, stop, measure]
      screen:
        description: With the task review, screen it first, as the item of an account without write access is screened
        type: boolean
        default: false
      reply:
        description: With the task reply, the text that Sami approved, which is posted as it is
        type: string
        default: ""
      account:
        description: >-
          The account whose hourly limit this run counts toward. The rescreen pass sets it. A rescreen by hand needs
          the account of the run that the workflow held. For the run of an event, that is the item's author or the
          account that started the event. For a run by hand of an account with write access, it is that account. For
          a run that the rescreen pass started, it is the account that its name ends with. With another account, the
          run stops, and its notice names the right one.
        type: string
        default: ""
      comment:
        description: With the task answer, the id of the author's comment to answer; with the task stop, the stop
        type: string
        default: ""
      head:
        description: The head commit of the pull request that the run is about
        type: string
        default: ""
      measure_set:
        description: With the task measure, the labelled set to measure on, an object of the private bucket (measure/set-v<n>.json)
        type: string
        default: measure/set-v1.json
      measure_repeats:
        description: With the task measure, how many times each check answers each text of the set
        type: number
        default: 3

permissions: {}

env:
  # This repository's decision: "true" posts each review as a comment on its pull request or issue; any other value
  # keeps it in the run's summary only.
  POST_REVIEW: "true"
  # The OSS Verify App, which makes the writes of the post job: dispatch://INFRA-3395 at spec version 54, which Sami
  # approved (dispatch://INFRA-3395/ask/097a0674-1460-432e-8961-8ac0326f198e). Each value below is the App's own, and
  # none is a placeholder. OSS_VERIFY_APP_ID is its id: a read of the check run repo-pairs/import-approved takes only a
  # check run of that App. OSS_VERIFY_APP_CLIENT_ID is its client id, with which the post job mints its tokens.
  # OSS_VERIFY_APP_LOGIN is its login: a closed pull request is reopened only when its newest close is of that login.
  # rescreen.yml holds the same id and login, and APPS (below) holds the login.
  OSS_VERIFY_APP_ID: "5447700"
  OSS_VERIFY_APP_CLIENT_ID: "Iv23liAWPMahJZYsw3un"
  OSS_VERIFY_APP_LOGIN: "oss-verify[bot]"
  # The Apps that count as having write access: this organisation's own, legion-reviewer[bot], and
  # legion-implementer[bot], which starts the run that posts an approved reply (dispatch://INFRA-3395, R4). The Review
  # step admits no other App, except an App whose pull request or issue the screen passed, and github-actions[bot] for
  # a run of the rescreen pass (rescreen.yml) that the trust job accepted. APPS holds the login of the OSS Verify App
  # (OSS_VERIFY_APP_LOGIN) as text, because an env value cannot read another. The CI run that a catch-up's reopen
  # starts has that App as its actor. Without the login here, that run counts toward the hourly limit as the run of an
  # outside account.
  APPS: "sjawhar-agent[bot],oss-verify[bot],legion-reviewer[bot],legion-implementer[bot]"
  # The most reviews that may call the model in one hour. An agent of ours can open many pull requests at once, and
  # the screen passes others', so a burst must not start model runs without limit. A run at the cap stops before the
  # model, and the run is red; a maintainer can re-run it once the hour has passed. A run that the trust job stops, or
  # that the screen holds, never counts. The reviews of screened items count toward SCREENED_HOURLY_CAP instead.
  HOURLY_CAP: "10"
  # The same cap for the reviews of screened pull requests and issues, counted apart, so that accounts without write
  # access cannot use up HOURLY_CAP. A screened run at this cap is held. It is above OUTSIDE_HOURLY_LIMIT, so one
  # account cannot fill it alone; several new accounts together still can, and then the others' items are held.
  SCREENED_HOURLY_CAP: "6"
  # The most runs that one account without write access may start in an hour and have screened: its next pull request,
  # issue, push or comment in that hour is held without a screen. Every run its event started that the trust job did
  # not skip or stop counts, the held ones too, so a burst stays held until an hour has passed since its runs. A run
  # that the trust job stopped screened nothing and does not count: a CI run of a pull request into another branch, or
  # of a fork's branch that more than one open pull request has as its head. A run whose screen could not sign in does
  # not count: the rescreen pass takes its item again. A run whose screen passed and whose review could not sign in
  # counts once: the rescreen pass runs its failed jobs again, with no new screen. A CI run of the account's push whose
  # screen job names another account (the author of the pull request, the top of this file) used that account's limit
  # and does not count for this one. A CI run of another account's push whose screen job names this account counts for
  # this one. Only a run's jobs show those. The trust job reads the jobs only of the runs that could count on this
  # account: a CI run of another account only when that account owns the head repository of an open pull request of
  # this one, and has no write access. It reads at most twice this number of them: first the account's own runs that
  # finished or are CI runs, then those CI runs of other accounts. When runs that could count are left past those
  # reads, or GitHub does not list them all, or the open pull requests cannot be read, and the count is under this
  # number, the account counts as at its limit: the run is held, and a later run tries again. So no padding of runs
  # moves an account past its limit, and the owner of such a head repository can hold this account's items in this way
  # until its runs are an hour old. The pushes of a collaborator of such a fork who is not its owner count on no one,
  # and SCREENED_HOURLY_CAP bounds their reviews.
  # The runs that the rescreen pass starts and that screen (a rescreen, a review, an answer, a draft or an approval)
  # count toward the same limit, with its events (their names end with " of <account>"): so N, the most such runs of
  # one account that are screened in an hour, is this number less what its own events used. (The rescreen pass starts
  # up to this number of an account's such runs an hour whatever its events used, and the trust job holds the extra
  # ones at the limit.) One count and one limit, because such a run is the screen that the held or missed event did
  # not get: it gives an account no more screens an hour than its events alone could, which keeps it under
  # SCREENED_HOURLY_CAP, so one account cannot fill that pool. A smaller N for those runs would only leave a burst held
  # for longer; an account that keeps opening, pushing or reopening stays held. An account with write access has no
  # such limit (a writer's push to an outsider's item, whose cap or transient hold names the writer's run): the
  # rescreen pass still starts at most this number of its rescreens an hour. rescreen.yml has its own copy of this
  # value.
  OUTSIDE_HOURLY_LIMIT: "3"
  # The label a held pull request or issue gets, and the marker of the comment that says so (and rescreen.yml's copy).
  HELD_LABEL: review-held
  # The most times the review of a screened item that the screen passed may fail, or run out of time, before it waits
  # on Sami: each such hold is tried again with no person (the rescreen pass) while it has failed fewer times than this
  # number, and the hold of the last failure is not. A review stopped at SCREENED_HOURLY_CAP is not such a failure,
  # and is tried again whatever this number: the cap is not the item's.
  # It is also the most runs of the work that a hold names, since the hold or the newest run that settled it, that may
  # end with neither a new hold nor a post (a run that failed on a GitHub read, say), the most post jobs of a head that
  # may fail at a step that is not a sign-in, the most reviews that the rescreen pass starts of a head that a run left
  # with no review, the most relabels of a head whose merge conflict went away, and the most reopens of a pull request
  # that a catch-up left closed, before the rescreen pass leaves the work to Sami. rescreen.yml has its own copy of this
  # value, as of POST_REVIEW and APPS.
  REVIEW_TRIES: "3"
  # The soundness hold of R8 (.github/review.md, "Soundness of a Rocq proof"). Stock Rocq accepts three public proofs
  # of False: rocq-prover/rocq#22651, #22760 and #22772. The checks that the import's copy of a pull request must pass,
  # in theorem-labs/rocq-linux-process-semantics-internal, run stock Rocq, as this repository's CI lanes do. While this
  # is "true", code gives the review of an outside pull request that can change a proof, also of one whose author's
  # write access GitHub did not say (any changed file that is not a Markdown file, or a Markdown file that a dune,
  # dune-project or dune-workspace* file of the head or of main makes count, as .github/review.md says) the verdict
  # person and a section on soundness, whatever the model wrote (.github/review/rules.py soundness). The hold lasts
  # until those checks run a Rocq with the fixes for the three issues: only then set another value. Another value also
  # ends R12's Markdown-only rule: while the hold lasts, the post job records the import's check run only for a pull
  # request whose changed files are all Markdown files.
  SOUNDNESS_HOLD: "true"

jobs:
  # The task and the route of a run (the top of this file). Nothing runs in a fork of this repository, nor for a run by
  # hand on a ref other than main. A workflow_run is taken only for a CI run of a pull request's event that was not
  # cancelled, skipped or held (GitHub holds a first-time contributor's run, whose approval is the task approve); an
  # issue_comment only for a comment of the item's author that no App wrote. An export pull request gets no task on any
  # event and for any task (the step's export_stop).
  trust:
    if: >-
      github.repository_id == 1425819621 && github.ref == 'refs/heads/main'
      && (github.event_name != 'workflow_run'
          || (github.event.workflow_run.path == '.github/workflows/ci.yml'
              && github.event.workflow_run.event == 'pull_request'
              && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.conclusion != 'skipped'
              && github.event.workflow_run.conclusion != 'stale'
              && github.event.workflow_run.conclusion != 'action_required'))
      && (github.event_name != 'issue_comment'
          || (github.event.comment.user.login == github.event.issue.user.login
              && github.event.comment.user.type != 'Bot'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions: read for OUTSIDE_HOURLY_LIMIT, which reads this workflow's runs, and for a head's runs and their jobs;
    # issues and pull-requests: read for the item, its comments and its events, and the open pull requests; checks: read
    # for the check runs of a head, which the rescreen pass's functions read again for a stop (due_variable), and for
    # the notices of a CI run's trust job (reviewed); contents: read for the checkout of .github/review/trusted.sh and
    # .github/review/held.sh alone.
    permissions: {actions: read, contents: read, issues: read, pull-requests: read, checks: read}
    outputs:
      # review, answer, draft, reply, rescreen, approve, catchup, conflict, relabel, stop or measure (the top of this
      # file).
      task: ${{ steps.trust.outputs.task }}
      # review (no screen), screen (the screen first), limit (held at OUTSIDE_HOURLY_LIMIT) or measure.
      route: ${{ steps.trust.outputs.route }}
      # For the route limit, true when the account counts as at its limit because the trust job did not read every
      # run of the last hour that could count on it (earlier), which the hold says; else empty.
      uncounted: ${{ steps.trust.outputs.uncounted }}
      # The account that the screen is for: the account without write access whose action the run is, or else the
      # author. For a relabel, the author when kind is outsider. Empty on every other route.
      outsider: ${{ steps.trust.outputs.outsider }}
      # The kind of the item's author, which the trust job decides once (route, from trusted): writer (write access, or
      # one of the APPS), outsider (no write access, an App that the APPS list does not name, or no GitHub login) or
      # unknown (GitHub did not say). The label steps read it (.github/review/rules.py label): for unknown they change
      # no state label and no label comment. The rules that hold back read it beside outside, and treat unknown as
      # outside (.github/review/rules.py holds_back): the soundness rule and the review's prompt. Empty only for a run
      # with no item (a measurement).
      kind: ${{ steps.trust.outputs.kind }}
      # true when kind is outsider (an outside item, R5), false when it is writer or unknown; empty only with no item.
      # The rules that grant read it alone, as true or not: the author-kind table (.github/review/rules.py answers) and
      # the step "Whether a fix runs". Only an outside author's item gets a state label, an approval of its held runs,
      # the import check run of R12 and a fix.
      outside: ${{ steps.trust.outputs.outside }}
      # The account whose OUTSIDE_HOURLY_LIMIT the run counts on (an account with write access has none), which the
      # name of the screen job gives: earlier and held_account read it back from there.
      account: ${{ steps.trust.outputs.account }}
      number: ${{ steps.trust.outputs.number }}
      # The head commit of a pull request, as the API gave it to the trust job.
      head: ${{ steps.trust.outputs.head }}
      # The head commit that the name of the run gives (run-name, and held.sh take): the head of a CI run, or the input
      # head of a run by hand, which this job checks against the head of the pull request. Empty when the name gives
      # none, and for a draft. The rescreen pass tries the App's writes again only for a run whose name gives the head
      # (held.sh, due_retry), and takes no draft (held.sh, consider). So the post job's error of a withdrawal that
      # fails promises that retry only when named is the head.
      named: ${{ steps.trust.outputs.named }}
      # The comment that an answer answers.
      comment: ${{ steps.trust.outputs.comment }}
      # The run whose event this item's hold names (a hold that is tried again), and the screened reviews of the item
      # that failed so far, which a hold of a review that did not finish counts on.
      origin: ${{ steps.trust.outputs.origin }}
      tries: ${{ steps.trust.outputs.tries }}
      started: ${{ steps.trust.outputs.started }}
      # For the task stop, the stop that the trust job decided again, as JSON: its stop, its fact for the state label,
      # the hold comment that it takes the place of (empty for a new one), its title and text, and the head it names.
      stop: ${{ steps.trust.outputs.stop }}
    steps:
      # .github/review/trusted.sh and .github/review/held.sh alone, which the next step sources, at the commit of main
      # whose workflow file runs (github.sha); never a file of the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/review/trusted.sh
            .github/review/held.sh
          sparse-checkout-cone-mode: false
      - name: Whether the author and the account that started the run have write access
        id: trust
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.issue.number || inputs.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
          ACTOR: ${{ github.actor }}
          TASK: ${{ inputs.task }}
          SCREEN: ${{ inputs.screen }}
          ACCOUNT: ${{ inputs.account }}
          COMMENT: ${{ github.event.comment.id || inputs.comment }}
          HEAD: ${{ github.event.workflow_run.head_sha || inputs.head }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.id }}
          # The CI run's head branch: with the head commit and the head repository, it names the pull request of a CI
          # run of a fork's pull request.
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          # The pull requests that GitHub names in the CI run, as JSON, each with its number and its base. GitHub names
          # none for a run of a fork's pull request (CI run 40554405841 of #23).
          PULLS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          # With the task reply, the approved text: this job only checks that it holds a word.
          REPLY: ${{ inputs.reply }}
          RUN_ID: ${{ github.run_id }}
          # The import's paths, one glob on each line, while the import is live (R12), as the post and comment jobs read
          # them: the rescreen pass's functions read them again for a stop (due_variable). An empty value is no
          # variable: GitHub gives an empty value for a variable that is not set.
          IMPORT_PATHS: ${{ vars.REPO_PAIRS_IMPORT_PATHS }}
        run: |
          set -euo pipefail
          # The if of this job compares the ref with no case, as GitHub's == does, so refs/heads/MAIN passes it. The
          # shell compares it byte for byte: on any other ref this step reads nothing and gives no task, so no job after
          # it runs.
          [ "${GITHUB_REF:-}" = refs/heads/main ] \
            || { echo "::error::This run is not on refs/heads/main, so no job runs."; exit 1; }
          seen=$(mktemp -d -p "$RUNNER_TEMP")
          # trusted <login>: 0 for write access or one of the APPS, 1 for neither, 2 when GitHub could not say.
          source "$GITHUB_WORKSPACE/.github/review/trusted.sh"
          # known <login>: trusted's answer, 0 or 1; the run stops when GitHub could not say.
          known() {
            local rc=0
            trusted "$1" || rc=$?
            (( rc != 2 )) || { echo "::error::GitHub did not say whether $1 has write access. Re-run this run."; exit 1; }
            return "$rc"
          }
          source "$GITHUB_WORKSPACE/.github/review/held.sh"
          # open_pulls: open_rows, the open pull requests, read once in this step, one on each line: "<number> <head
          # commit> <id of the head repository, 0 when it is gone> <head branch> <base> <draft> <author> <owner of the
          # head repository, - when it is gone>". It fails when GitHub could not say.
          open_rows="" open_read=""
          open_pulls() {
            [ -z "$open_read" ] || return 0
            open_rows=$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --jq '.[] | "\(.number) \(
              .head.sha) \(.head.repo.id // 0) \(.head.ref // "-") \(.base.ref) \((.draft // false) | tostring) \(
              .user.login // "-") \(.head.repo.owner.login // "-")"') || return 1
            open_read=1
          }
          # open_with <head> <repository> <branch>: "<number> <base> <draft> <author>" of each open pull request whose
          # head commit, head repository and head branch are those (open_rows).
          open_with() {
            local number sha repository ref base draft author owner
            while read -r number sha repository ref base draft author owner; do
              [[ -n $number && $sha == "$1" && $repository == "$2" && $ref == "$3" ]] || continue
              echo "$number $base $draft $author"
            done <<< "$open_rows"
          }
          # earlier <login>: sets count to how many runs of this workflow in the last hour, before this run, the trust
          # job did not skip or stop and counted on <login>: each run that <login> started by an event (workflow_run,
          # issues or issue_comment); each run whose name, a name of the rescreen pass's (titled), ends with
          # " of <login>" (the trust job of a run that github-actions[bot] started checks that name, and a writer's run
          # by hand names the account that the writer gives); and each CI run (workflow_run) that another account's push
          # started and whose screen job names <login>, the author of its pull request (the top of this file). Three
          # lists give those runs: the runs of <login> (actor); the workflow_dispatch runs, which only writers and the
          # rescreen pass start; and the CI runs (workflow_run). So the runs of other accounts' comments and
          # issues, which anyone can start on any item, are in none of them. A run that GitHub skipped, with each of
          # its jobs, does not count. A run that has not finished counts with no read of its jobs, but a CI run, whose
          # screen job can name another account. The jobs of a run show whether it counts. A run of <login>'s event
          # whose screen job names another account (screen <account>: the account whose limit its trust job counted it
          # on, as the author of a pull request on <login>'s fork branch) used that account's limit, and does not count
          # for <login>. A CI run of another account counts when its screen job names <login>, and also while its jobs
          # do not show yet on whom its trust job counted it: no screen job of it is listed yet. Its trust job is not
          # listed or has not finished (queued or in progress), or its gather job, which the screen job needs beside
          # the trust job, has not finished (the name of the screen job needs the trust job's outputs, and GitHub lists
          # the screen job only once both have ended). A run of <login>'s own counts in that state too. So when one
          # push starts the CI runs of more than one pull request of <login>, whose trust jobs run side by side, the
          # trust job of each counts those before it. Such a run whose screen job is listed and names another account,
          # or names no account (GitHub lists a skipped job with its name not filled in: the trust job routed it to no
          # screen), does not show that its trust job counted it on <login>, and does not count.
          # A run whose trust job stopped it screened nothing, and does not count:
          # every job after the trust job was skipped, and GitHub lists the run as one that succeeded (the CI run of a
          # pull request into another branch, of a head that more than one open pull request has, or a run by hand
          # whose item closed, or lost its label, in between). Nor does a run whose screen job stopped at a failed step
          # whose name starts with "Sign in": it screened nothing, the rescreen pass takes its item again, and that run
          # must not find the account at its limit because of it. A run whose screen passed and whose review job then
          # could not sign in counts, once: its screen ran, and the rescreen pass runs its failed jobs again with no new
          # screen. The job rescreen, which this file had before the pass moved to rescreen.yml and which each of its
          # dispatched runs skipped, is not one of those jobs. A run of the first two lists whose trust job is not
          # listed counts. Only a run that could count on <login> has its jobs read. A CI run of another account can
          # count on <login> only when that account owns the head repository of an open pull request of <login>
          # (open_pulls, read once, and only when the list of CI runs gives a run of another account: a head repository
          # that is gone has no owner). Every other account's CI run cannot count on <login>, and costs no read. A CI
          # run of such an owner with write access (trusted, as GitHub gives it at this run) counts on that account,
          # which has no limit, and costs no read either. When the open pull requests cannot be read, <login> counts
          # as at its limit (uncounted). The pushes of a collaborator of such a fork who is not its owner count on no
          # one: the trust job of each such run counts it on <login>, and this count leaves it out. SCREENED_HOURLY_CAP
          # bounds the reviews of those runs. The jobs of each run are read once, also when two pages or two lists give
          # it, and of at most 2 * OUTSIDE_HOURLY_LIMIT runs in this run: first the runs of the first two lists, then
          # the CI runs of those owners, each list newest first. No jobs are read once count is at OUTSIDE_HOURLY_LIMIT:
          # the account is at its limit. When count is under it and runs that could count are left past those reads,
          # or GitHub does not list every run of a list (whole: the runs that it leaves out can count, those of the CI
          # runs only when such an owner exists), the count is not known: <login> counts as at its limit (uncounted),
          # the item is held, and a later run tries again. So a burst of runs that screened nothing costs each later run
          # no more reads than that, and no padding of runs moves <login> past its limit. The owner of the head
          # repository of a pull request of <login> can hold the items of <login> in this way with CI runs, until those
          # runs are an hour old. The run stops when GitHub could not say what runs there are or what jobs a run has.
          earlier() {
            local from round list out rows runs id state own actor entry verdict reads=0 cut owners
            local number sha repository ref base draft author owner
            local -a lists unread
            local -A once=()
            count=0
            from=$(date -u -d '-1 hour' +%Y-%m-%dT%H:%M:%SZ)
            # Two rounds: the runs of <login>'s events and the workflow_dispatch runs that name it, then the CI runs of
            # other accounts.
            for round in own other; do
              if [ "$round" = own ]; then
                lists=("actor=$1" event=workflow_dispatch)
              else
                (( count < OUTSIDE_HOURLY_LIMIT )) || return 0
                lists=(event=workflow_run)
              fi
              runs="" unread=() cut=""
              # Each run of a list on one line: "<id> <state> <own> <actor>", state count for a run that counts with no
              # read of its jobs, else read, own 1 for a run of <login>'s event, 0 for a workflow_dispatch run, 2 for a
              # CI run of another account, and actor the account that started it ("-" for none).
              for list in "${lists[@]}"; do
                # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
                out=$(LOGIN=$1 LIST=$list TITLED=$titled gh api --method GET --paginate \
                  "repos/$REPO/actions/workflows/review.yml/runs" -f "$list" -f created=">=$from" -F per_page=100 \
                  --jq "$pages"'(.workflow_runs[] | (.display_title // "") as $title
                    | select(.id < ($ENV.RUN_ID | tonumber) and .conclusion != "skipped"
                             and (if $ENV.LIST == "event=workflow_run"
                                  then .event == "workflow_run" and .actor.login != $ENV.LOGIN
                                  else (.actor.login == $ENV.LOGIN
                                        and (.event == "workflow_run" or .event == "issues"
                                             or .event == "issue_comment"))
                                       or (.event == "workflow_dispatch" and ($title | test($ENV.TITLED))
                                           and ($title | endswith(" of " + $ENV.LOGIN))) end))
                    | "\(.id) \(if .status != "completed" and .event != "workflow_run" then "count" else "read" end) \(
                      if .event == "workflow_dispatch" then 0 elif .actor.login == $ENV.LOGIN then 1 else 2 end) \(
                      .actor.login // "-")")') \
                  || { echo "::error::the runs of this workflow could not be read. Re-run this run."; exit 1; }
                if rows=$(whole <<< "$out"); then
                  runs+=$rows$'\n'
                else
                  cut=$list
                fi
              done
              owners=" "
              if [ "$round" = other ]; then
                # The owners of the head repositories of the open pull requests of <login>, " <owner> " each: only
                # their CI runs can count on <login>. No CI run of another account listed: none can count.
                [[ -n $cut || $runs =~ [0-9] ]] || return 0
                if ! open_pulls; then
                  echo "::notice::The open pull requests could not be read, so the CI runs that can count toward the" \
                    "limit of $1 are not known. So the workflow treats $1 as at the limit."
                  count=$OUTSIDE_HOURLY_LIMIT uncounted=true
                  return 0
                fi
                while read -r number sha repository ref base draft author owner; do
                  [[ -n $number && $author == "$1" && $owner != - ]] || continue
                  owners+="$owner "
                done <<< "$open_rows"
                [ "$owners" != " " ] || return 0
              fi
              if [ -n "$cut" ]; then
                echo "::notice::GitHub lists at most 1,000 runs of this workflow with $cut since $from, and more" \
                  "of them match. The runs that it does not list can count toward the limit of $1, so the workflow" \
                  "treats $1 as at the limit."
                count=$OUTSIDE_HOURLY_LIMIT uncounted=true
                return 0
              fi
              while read -r id state own actor; do
                [ -n "$id" ] || continue
                [[ $id =~ ^[0-9]+$ ]] || { echo "::error::a run id is not a number. Re-run this run."; exit 1; }
                [ -z "${once[$id]:-}" ] || continue
                once[$id]=1
                # A CI run of another account that owns no head repository of a pull request of <login>: no read.
                [[ $own != 2 || $owners == *" $actor "* ]] || continue
                if [ "$state" = count ]; then count=$((count + 1)); else unread+=("$id $own $actor"); fi
              done <<< "$runs"
              for entry in "${unread[@]}"; do
                read -r id own actor <<< "$entry"
                (( count < OUTSIDE_HOURLY_LIMIT )) || return 0
                # A CI run of a push of an owner with write access counts on that account, never on <login>: no read.
                # When GitHub does not say whether the account has write access, the run could count: it is read.
                if [ "$own" = 2 ] && trusted "$actor"; then continue; fi
                if (( reads == 2 * OUTSIDE_HOURLY_LIMIT )); then
                  echo "::notice::This run read the jobs of $reads runs that can count toward the limit of $1. More" \
                    "such runs of the last hour are left, so the workflow treats $1 as at the limit."
                  count=$OUTSIDE_HOURLY_LIMIT uncounted=true
                  return 0
                fi
                reads=$((reads + 1))
                # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
                verdict=$(LOGIN=$1 OWN=$own gh api --method GET --paginate "repos/$REPO/actions/runs/$id/jobs" \
                  -F per_page=100 --jq '([.jobs[] | select(.name == "trust")] | first) as $t
                    | [.jobs[] | select(.name != "trust" and .name != "rescreen")] as $rest
                    | ([$rest[] | .name // "" | capture("^screen (?<a>[A-Za-z0-9-]+(\\[bot\\])?)$") | .a]
                       | first) as $named
                    | if $ENV.OWN == "2" and $named != $ENV.LOGIN
                         and ($named != null or any($rest[]; (.name // "") | test("^screen( |$)"))) then "other"
                      elif $t == null then "count" elif $t.conclusion == "skipped" then "skip"
                      elif $t.status == "completed" and ($rest | length) > 0
                           and ($rest | all(.conclusion == "skipped")) then "skip"
                      elif $ENV.OWN == "1" and $named != null and $named != $ENV.LOGIN then "other"
                      elif any($rest[] | select(.name | test("^screen( |$)")) | .steps[]?;
                               (.name | startswith("Sign in")) and .conclusion == "failure") then "signin"
                      else "count" end') \
                  || { echo "::error::the jobs of run $id could not be read. Re-run this run."; exit 1; }
                if [[ $verdict == *count* ]]; then count=$((count + 1)); fi
              done
            done
          }
          fail() { echo "::error::$1 Re-run this run."; exit 1; }
          # origin: the run whose event this item's hold names, for a hold that is tried again; tries: the screened
          # reviews of the item that failed so far, which a rescreen carries from its hold to the next; account: the
          # account whose limit the run counts on, which the screen job's name gives (the account that started the run,
          # or the one that the inputs of the rescreen pass's run give, and the author of a CI run's pull request when
          # neither the author nor the pusher has write access); uncounted: true when earlier did not read every run
          # that could count on that account, which then counts as at its limit.
          task="" head="" comment="" of="" tries=0 origin=$RUN_ID account=$ACTOR uncounted=""
          # kind_of_author: author_kind, the kind of the item's author AUTHOR, decided once in this step from trusted:
          # writer when trusted gives 0 (write access, or one of the APPS), outsider for 1 (no write access, an App that
          # the APPS list does not name, or no GitHub login) and unknown for 2 (GitHub did not say). A later call asks
          # GitHub nothing.
          author_kind=""
          kind_of_author() {
            local rc=0
            [ -z "$author_kind" ] || return 0
            trusted "$AUTHOR" || rc=$?
            case $rc in
              0) author_kind=writer ;;
              1) author_kind=outsider ;;
              *) author_kind=unknown ;;
            esac
          }
          # route <route> <outsider>: the outputs, and the end of this step. Its notice names the item, so that the
          # rescreen pass tells which pull request a CI run reviewed when more than one into main has its head
          # (reviewed). On every route of an item with an author, the output kind is the kind of the author
          # (kind_of_author), and the output outside is true for an outsider and false for a writer or unknown. A run
          # with no author (a measurement) gives both empty. The output named is HEAD when it is a head commit, for a
          # run of an item that is not a draft: the name of a measurement gives no head, and the rescreen pass takes no
          # run of a draft again (held.sh, consider). The output started is the time now, or for a stop the time that
          # due_stop took before it read the comments of the item (stop_read).
          route() {
            local outside="" named=""
            if [ -n "$AUTHOR" ]; then
              kind_of_author
              outside=false
              [ "$author_kind" != outsider ] || outside=true
            fi
            if [ -n "$NUMBER" ] && [ "${is_draft:-false}" = false ] && [[ $HEAD =~ ^[0-9a-f]{40}$ ]]; then
              named=$HEAD
            fi
            echo "::notice::#$NUMBER: the task $task, the route $1."
            { echo "task=$task"; echo "route=$1"; echo "outsider=$2"; echo "number=$NUMBER"; echo "head=$head"
              echo "named=$named"; echo "account=$account"; echo "comment=$comment"; echo "origin=$origin"
              echo "tries=$tries"; echo "uncounted=$uncounted"; echo "kind=$author_kind"; echo "outside=$outside"
              echo "started=${stop_read:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"; } >> "$GITHUB_OUTPUT"
            exit 0
          }
          # stop <why>: no route, so no job after this one runs. Its notice names the item once the step knows it
          # (reviewed).
          stop() {
            local what="#$NUMBER"
            [ -n "$NUMBER" ] || what="commit $HEAD"
            echo "::notice::No ${task:-run} of $what: $1"
            exit 0
          }
          # export_stop <repository> <branch>: no task (stop) for an export pull request, whose head repository and head
          # branch are those (held.sh exported). Neither this workflow nor the rescreen pass acts on one.
          export_stop() {
            exported "$1" "$2" || return 0
            local why="it is an export pull request, from the branch $2 of this repository."
            stop "$why This workflow does not act on it."
          }
          # screened <author> <account>: the route of an item of <author> for an action of <account>: no screen when
          # both have write access; else the screen first, for the account without write access whose action it is
          # (<account>, or else <author>); or held at the limit with no screen, when <account> has no write access and
          # the runs of account (the account whose limit the run counts on: <account>, or the author of a CI run's pull
          # request) reached the screen OUTSIDE_HOURLY_LIMIT times in the last hour, or could not all be read (earlier).
          # A writer's action on an outsider's item has no limit. No <account> is the action of a person or an App that
          # started a run by hand, which GitHub lets only a writer do: the API is not asked.
          screened() {
            local a=0 b=0 outsider
            known "$1" || a=$?
            if [ -n "$2" ]; then known "$2" || b=$?; fi
            (( a != 0 || b != 0 )) || route review ""
            outsider=$1
            (( b == 0 )) || outsider=$2
            [[ $outsider =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || stop "$outsider is not a GitHub login."
            echo "::notice::#$NUMBER is screened first: $outsider has no write access."
            if (( b != 0 )); then
              earlier "$account"
              (( count < OUTSIDE_HOURLY_LIMIT )) || route limit "$outsider"
            fi
            route screen "$outsider"
          }
          # item: what the API says of #NUMBER now: state, AUTHOR, kind (pr or issue), is_draft, and labelled (with
          # HELD_LABEL); for a pull request also merged, base, pr_head (its head commit), mergeable (its
          # mergeable_state: dirty for a merge conflict, unknown while GitHub has not computed it), head_repo (the id
          # of its head repository, 0 when that repository is gone) and head_ref (its head branch). An export pull
          # request, open or closed, gets no task (export_stop), whatever the event or the task.
          item() {
            local data
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            data=$(gh api "repos/$REPO/issues/$NUMBER" --jq '[.state, .user.login,
              (if .pull_request then "pr" else "issue" end), ((.draft // false) | tostring),
              (any(.labels[]?; .name == $ENV.HELD_LABEL) | tostring)] | join(" ")') || fail "#$NUMBER could not be read."
            read -r state AUTHOR kind is_draft labelled <<< "$data"
            merged=false base="" pr_head="" mergeable="" head_repo=0 head_ref=-
            if [ "$kind" = pr ]; then
              data=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '[((.merged // false) | tostring), .base.ref, .head.sha,
                (.mergeable_state // "unknown"), ((.head.repo.id // 0) | tostring), .head.ref // "-"] | join(" ")') \
                || fail "pull request #$NUMBER could not be read."
              read -r merged base pr_head mergeable head_repo head_ref <<< "$data"
              export_stop "$head_repo" "$head_ref"
            fi
          }
          # held_runs: how many runs of the head pr_head from the head repository head_repo and its branch head_ref
          # GitHub holds for a person's approval, as held_at counts them: the runs that the post job approves, never
          # another run of the same commit, and none when the head repository is gone. GitHub lists a held run with the
          # status action_required, or with the status completed and the conclusion action_required (ci_of).
          held_runs() {
            if ! [[ $head_repo =~ ^[1-9][0-9]*$ ]]; then echo 0; return 0; fi
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            SHA=$pr_head REPOSITORY=$head_repo BRANCH=$head_ref gh api --method GET --paginate \
              "repos/$REPO/actions/runs" -f head_sha="$pr_head" -f status=action_required -F per_page=100 \
              --jq '[.workflow_runs[]
                | select((.status == "action_required" or .conclusion == "action_required")
                         and .head_sha == $ENV.SHA and .event == "pull_request"
                         and ((.head_repository.id // 0) | tostring) == $ENV.REPOSITORY
                         and .head_branch == $ENV.BRANCH)] | length' \
              | awk '{ n += $1 } END { print n + 0 }'
          }
          # replied: true when the label comment of #NUMBER says that its first reply posted.
          replied() {
            local n
            n=$(comments "$NUMBER" | jq -s '[.[] | select(.user.login == "github-actions[bot]"
              and (.body | startswith("<!-- review-label -->"))
              and (.body | test("(^|\n)<!-- issue-reply-posted [0-9]+ -->(\n|$)")))] | length') \
              || fail "the comments of #$NUMBER could not be read."
            (( n > 0 ))
          }
          # stored: true when the label comment of #NUMBER says that the draft of its reply is stored, or that its
          # first reply posted.
          stored() {
            local n
            n=$(comments "$NUMBER" | jq -s '[.[] | select(.user.login == "github-actions[bot]"
              and ((.body // "") | startswith("<!-- review-label -->"))
              and ((.body // "") | test("(^|\n)<!-- (issue-draft [0-9]+-[0-9]+|issue-reply-posted [0-9]+) -->(\n|$)")))]
              | length') || fail "the comments of #$NUMBER could not be read."
            (( n > 0 ))
          }
          # newest <work>: the newest hold of <work> on #NUMBER (limit_hold): held_at, and held_run, held_tries and
          # held_task when the rescreen pass tries it again (held_run is - for a hold that it does not try again, and
          # empty with no hold of <work>).
          newest() {
            local hold
            hold=$(limit_hold "$NUMBER" "$1") || fail "the comments of #$NUMBER could not be read."
            read -r held_at held_run held_tries _ held_task _ <<< "$hold"
          }
          # again <task>: for a run of the rescreen pass, when the newest hold of its work (newest) is one that the pass
          # tries again as <task>. The pass takes such a hold again only when it is over an hour old, so a younger one
          # stops this run. This run then keeps the hold's run and tries (origin and tries), so that a hold of it counts
          # on.
          again() {
            [[ -n ${held_run:-} && $held_run != - && ${held_task:-} == "$1" ]] || return 0
            [[ $held_at < $(date -u -d '-1 hour' +%Y-%m-%dT%H:%M:%SZ) ]] \
              || stop "its hold of $held_at is under an hour old."
            [[ $held_tries =~ ^[0-9]+$ ]] || stop "its hold names no count of tries."
            origin=$held_run tries=$held_tries
          }
          # comment_author: the author of the comment COMMENT, when it is an issue comment, a review comment or a
          # review of #NUMBER. Nothing when it is none of them.
          comment_author() {
            local path out url login
            for path in "issues/comments/$COMMENT" "pulls/comments/$COMMENT" "pulls/$NUMBER/reviews/$COMMENT"; do
              [[ $kind == pr || $path == issues/* ]] || continue
              if out=$(gh api "repos/$REPO/$path" --jq '"\(.issue_url // .pull_request_url // "-") \(.user.login // "-")"' 2>&1); then
                read -r url login <<< "$out"
                if [[ $url == */issues/$NUMBER || $url == */pulls/$NUMBER ]]; then echo "$login"; return 0; fi
              else
                [[ $out == *"(HTTP 404)"* ]] || return 1
              fi
            done
          }
          # left_closed: true when #NUMBER is a pull request that a catch-up run closed and could not reopen: it is not
          # merged, and its newest closed event is the OSS Verify App's (OSS_VERIFY_APP_LOGIN) and falls between
          # the start and the end of another run of the task catchup of it whose post job failed or was cancelled (the
          # closing run). A catchup run since then that reopened it would have left it open, or closed by a newer event.
          # The runs are read one day at a time (runs_in, which reads a day that GitHub cut at 1,000 runs one hour at a
          # time), from the day before the close to today, however long ago the close was. Never once its hold comment
          # says that the catch-up could not reopen it (gave_up): then it waits on Sami, and no run is read.
          left_closed() {
            local closed at by day today runs id started ended post given
            [ "$kind" = pr ] && [ "$merged" = false ] || return 1
            closed=$(gh api --paginate "repos/$REPO/issues/$NUMBER/events" --jq '.[] | select(.event == "closed")
              | "\(.created_at) \(.actor.login // "-")"' | sort | tail -n 1) || fail "the events of #$NUMBER could not be read."
            read -r at by <<< "$closed"
            [ "${by:-}" = "$OSS_VERIFY_APP_LOGIN" ] || return 1
            [[ $at =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || return 1
            given=$(gave_up "$NUMBER") || fail "the comments of #$NUMBER could not be read."
            [ "$given" = false ] || return 1
            day=$(date -u -d "${at:0:10} -1 day" +%Y-%m-%d)
            today=$(date -u +%Y-%m-%d)
            while [[ ! $day > $today ]]; do
              # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
              runs=$(PATTERN="^catchup #$NUMBER( |\$)" runs_in workflow_dispatch "$day" "$pages"'(.workflow_runs[]
                  | select(.event == "workflow_dispatch" and (.id | tostring) != $ENV.RUN_ID
                           and ((.display_title // "") | test($ENV.PATTERN)))
                  | "\(.id) \(.run_started_at // .created_at) \(if .status == "completed" then .updated_at else "-" end)")') \
                || fail "the runs of $day could not be read."
              while read -r id started ended; do
                [ -n "$id" ] || continue
                [[ $id =~ ^[0-9]+$ ]] || fail "a run id is not a number."
                if [[ $at < $started || ($ended != - && $ended < $at) ]]; then continue; fi
                post=$(gh api --method GET --paginate "repos/$REPO/actions/runs/$id/jobs" -F per_page=100 \
                  --jq '.jobs[] | select(.name == "post") | .conclusion // "running"') \
                  || fail "the jobs of run $id could not be read."
                if [[ $post == failure || $post == cancelled ]]; then return 0; fi
              done <<< "$runs"
              day=$(date -u -d "$day +1 day" +%Y-%m-%d)
            done
            return 1
          }
          # restart <run>: the check of a stop runs no job again (rerun, of the rescreen pass's functions in held.sh),
          # and takes each such start as one that GitHub refused: the pass decides a stop after a rerun of the same item
          # only when GitHub refused that rerun.
          restart() { return 1; }
          # due_stop: the task stop, which only the rescreen pass starts (rescreen.yml), when it decides that the work
          # of an item is not tried again: COMMENT names the stop (halt, of the pass's functions in held.sh). The run's
          # name must be the one that the pass gives it from what the API says now, and the pass's own reads and
          # functions, run here again for this item alone (consider, or consider_closed for a catch-up left closed),
          # must decide the same stop now: else the run stops. A run of the item that has not finished, but this one, so
          # stops it. The output stop gives the comment job the stop as halt wrote it. A stop screens nothing, runs no
          # model and counts toward no limit and no cap.
          due_stop() {
            local line closed found
            [[ $COMMENT =~ ^(hold-(review|answer|draft|approve)|head-(review|approve|import|catchup)|reopen|answer-post)$ ]] \
              || stop "$COMMENT is not a stop of the rescreen pass."
            [ "$POST_REVIEW" = true ] || stop "POST_REVIEW is not true, so the rescreen pass decides no stop."
            [[ $REVIEW_TRIES =~ ^[1-9][0-9]*$ ]] || { echo "::error::REVIEW_TRIES is not a number"; exit 1; }
            item
            want="stop #$NUMBER${pr_head:+ at $pr_head} for $COMMENT"
            title=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.display_title // ""') \
              || fail "this run could not be read."
            [ "$title" = "$want" ] || stop "its name \"$title\" is not the rescreen pass's for it (\"$want\")."
            read_pulls || fail "the open pull requests could not be read."
            read_runs || fail "the runs of this workflow could not be read."
            # The time before the read of the comments from which halt picks the hold comment that the stop replaces
            # (consider or consider_closed): the output started (route). The comment job writes nothing when a comment
            # of the workflow changed at or after it. So a hold that another run writes after this time is not replaced.
            stop_read=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            if [ "$state" = open ]; then
              line=$(gh api "repos/$REPO/issues/$NUMBER" --jq "$item_row") || fail "#$NUMBER could not be read."
              read -r number kind draft labelled opened author <<< "$line"
              consider || fail "the rescreen pass's functions could not read from GitHub what they need for #$NUMBER."
            else
              [ "$kind" = pr ] && [ "$merged" = false ] || stop "it is $state."
              closed=$(gh api --paginate "repos/$REPO/issues/$NUMBER/events" --jq '.[] | select(.event == "closed")
                | "\(.created_at) \(.actor.login // "-")"' | sort | tail -n 1) || fail "the events of #$NUMBER could not be read."
              read -r at by <<< "$closed"
              number=$NUMBER author=$AUTHOR
              consider_closed \
                || fail "the rescreen pass's functions could not read from GitHub what they need for #$NUMBER."
            fi
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            found=$(STOP=$COMMENT jq -c 'select(.stop == $ENV.STOP)' "$seen/stops" | tail -n 1) \
              || fail "the stops of #$NUMBER could not be read."
            [ -n "$found" ] || stop "the rescreen pass's functions, run again now, decide no such stop of it."
            echo "stop=$found" >> "$GITHUB_OUTPUT"
            head=$pr_head comment=$COMMENT
            route review ""
          }
          [[ $OUTSIDE_HOURLY_LIMIT =~ ^[1-9][0-9]*$ ]] || { echo "::error::OUTSIDE_HOURLY_LIMIT is not a number"; exit 1; }
          [[ $RUN_ID =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a run id: $RUN_ID"; exit 1; }
          case $EVENT in
            # A pull request's new head: the open pull request into main of the CI run. A run of a pull request of this
            # repository names its pull requests (PULLS): it is taken only when one of them is into main of this
            # repository, and that one is it, so a CI run of a pull request into another branch starts no review and
            # counts toward no cap. A run of a fork's pull request names none (GitHub leaves the list empty): it is the
            # open pull request whose head commit, head repository and head branch are the CI run's, when exactly one
            # open pull request, of any base, has them, and it is taken only when that one is into main. Anyone can
            # open a pull request whose head is another account's fork branch, and a push to that branch starts a CI
            # run of each such pull request, all alike: when more than one has the head, the run is none of theirs
            # alone, so it starts no review and counts toward no limit, and the rescreen pass reviews each one into
            # main in a run of its own, on its author's limit (due_unreviewed). The number comes from the CI run or
            # from that lookup; the author, the head and the rest come from the API. The account that the Review step's
            # action admits is the CI run's actor (the pusher, also on a later attempt of that run), never the account
            # that re-ran it. The account whose limit the run counts on is the author's when neither the author nor the
            # pusher has write access: anyone can open a pull request whose head is another account's fork branch, and
            # that account's pushes to its own branch then never use its own hour. Else it is the pusher's, as for each
            # other event: a writer's push has no limit, and an outsider's push to a writer's pull request counts on
            # the pusher. A CI run of an export pull request starts no review (export_stop). When the CI run names the
            # pull request, item stops the run. When it names none, the head repository and the head branch of the CI
            # run stop it.
            workflow_run)
              task=review
              [[ $HEAD =~ ^[0-9a-f]{40}$ && $HEAD_REPOSITORY =~ ^[1-9][0-9]*$ && -n $HEAD_BRANCH ]] \
                || stop "the CI run names no head commit, head repository and head branch."
              # "<how many pull requests the CI run names> <each number of one into main of this repository>".
              # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
              found=$(jq -r 'if type == "array" then . elif . == null then [] else error("not a list") end
                | [length] + [.[] | select(.base.ref == "main"
                    and ((.base.repo.id // 0) | tostring) == $ENV.GITHUB_REPOSITORY_ID) | .number]
                | map(tostring) | join(" ")' <<< "${PULLS:-null}") || fail "the CI run's pull requests could not be read."
              read -r named into <<< "$found"
              if (( named > 0 )); then
                [ -n "${into:-}" ] || stop "the CI run is of pull requests into other branches than main."
                [[ $into =~ ^[1-9][0-9]*$ ]] || stop "the CI run names more than one pull request into main ($into)."
                NUMBER=$into
                item
                [ "$kind" = pr ] || stop "it is not a pull request."
                [ "$state" = open ] || stop "it is $state."
                [ "$base" = main ] || stop "it is into $base, not main."
                [[ $pr_head == "$HEAD" && $head_repo == "$HEAD_REPOSITORY" && $head_ref == "$HEAD_BRANCH" ]] \
                  || stop "its head is $pr_head of the branch $head_ref of repository $head_repo, not the CI run's."
              else
                # "<number> <base> <draft> <author>" of each open pull request, of any base, whose head commit, head
                # repository and head branch are the CI run's, from the one read of the open pull requests.
                open_pulls || fail "the open pull requests could not be read."
                found=$(open_with "$HEAD" "$HEAD_REPOSITORY" "$HEAD_BRANCH")
                n=$(grep -c . <<< "$found" || true)
                (( n > 0 )) || stop "no open pull request has this head from its repository and branch."
                why="$n open pull requests have this head from its repository and branch, so this run counts for none"
                (( n == 1 )) || stop "$why of them. The rescreen pass reviews each one into main in a run of its own."
                read -r NUMBER onto is_draft AUTHOR <<< "$found"
                [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || fail "not a number: $NUMBER."
                export_stop "$HEAD_REPOSITORY" "$HEAD_BRANCH"
                [ "$onto" = main ] || stop "it is into $onto, not main."
              fi
              [ "$is_draft" = false ] || stop "it is a draft."
              head=$HEAD
              a=0 b=0
              known "$AUTHOR" || a=$?
              known "$ACTOR" || b=$?
              (( a == 0 || b == 0 )) || account=$AUTHOR
              screened "$AUTHOR" "$ACTOR" ;;
            # A new issue, or one reopened: a writer's is reviewed, and an outsider's gets a draft of its reply.
            issues)
              [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
              a=0
              known "$AUTHOR" || a=$?
              task=review
              (( a == 0 )) || task=draft
              screened "$AUTHOR" "$ACTOR" ;;
            # A new comment of the item's author (the job's if) is answered when the item is open, its author has no
            # write access and, on an issue, the first reply posted. A pull request with a merge conflict gets the task
            # conflict instead.
            issue_comment)
              task=answer
              [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
              [[ $COMMENT =~ ^[1-9][0-9]*$ ]] || stop "the event names no comment."
              comment=$COMMENT
              item
              head=$pr_head
              [ "$state" = open ] || stop "it is $state."
              [ "$AUTHOR" = "$ACTOR" ] || stop "the comment is $ACTOR's, not its author's ($AUTHOR)."
              a=0
              known "$AUTHOR" || a=$?
              (( a != 0 )) || stop "its author $AUTHOR has write access."
              [ "$kind" = pr ] || replied || stop "its first reply has not posted."
              if [ "$mergeable" = dirty ]; then task=conflict; route review ""; fi
              screened "$AUTHOR" "$ACTOR" ;;
            workflow_dispatch)
              task=${TASK:-review}
              case $task in
                review|answer|draft|reply|rescreen|approve|catchup|conflict|relabel|stop|measure) ;;
                *) stop "it is not a task of this workflow." ;;
              esac
              # GitHub lets only an account with write access start a run by hand; an App must be one of the APPS, as
              # the Review step's allowed_bots says. github-actions[bot] is the rescreen pass's dispatch (rescreen.yml),
              # made with that pass's token, which has actions: write: it is taken only for the tasks that the pass
              # starts, with the name that the pass gives the task (below), and never for a reply or a measurement. A
              # stop is the pass's alone.
              if [ "$ACTOR" = 'github-actions[bot]' ]; then
                case $task in reply|measure) stop "github-actions[bot] starts no run of this task." ;; esac
              elif [[ $ACTOR == *'[bot]' ]]; then
                known "$ACTOR" || stop "the App that started this run ($ACTOR) is not one of the APPS."
              fi
              [ "$task" != stop ] || [ "$ACTOR" = 'github-actions[bot]' ] \
                || stop "only the rescreen pass starts a stop, as github-actions[bot]."
              # A measurement of the screen reads no pull request or issue (the screen job's Measure step).
              if [ "$task" = measure ]; then NUMBER=""; route measure ""; fi
              [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
              [[ -z $HEAD || $HEAD =~ ^[0-9a-f]{40}$ ]] || stop "$HEAD is not a head commit."
              [ "$task" != stop ] || due_stop
              [[ -z $COMMENT || $COMMENT =~ ^[1-9][0-9]*$ ]] || stop "$COMMENT is not a comment id."
              comment=$COMMENT
              item
              head=$pr_head
              # A reply that cannot post fails the run, so that the person or the App that started it sees why: a run
              # of a pull request, of an issue that is not open, or with no text of a reply.
              if [ "$task" = reply ]; then
                [ "$kind" = issue ] || { echo "::error::#$NUMBER is a pull request, and a reply is for an issue. Nothing posts."; exit 1; }
                [ "$state" = open ] || { echo "::error::issue #$NUMBER is $state. Nothing posts."; exit 1; }
                [[ ${REPLY:-} =~ [^[:space:]] ]] || { echo "::error::the run gives no text of a reply. Nothing posts."; exit 1; }
              fi
              [[ -z $HEAD || $HEAD == "$pr_head" ]] || stop "its head is ${pr_head:-none}, not $HEAD."
              # A closed item gets no task, but the catch-up of a pull request that a catch-up run closed and could not
              # reopen: that run reopens it, and closes nothing.
              if [ "$state" != open ]; then
                [ "$task" = catchup ] && left_closed || stop "it is $state."
              fi
              [ "$kind" != pr ] || [ "$base" = main ] || stop "it is into $base, not main."
              case $task in
                draft|reply) [ "$kind" = issue ] || stop "it is not an issue." ;;
                approve|catchup|conflict|relabel) [ "$kind" = pr ] || stop "it is not a pull request." ;;
              esac
              # The rescreen pass's name for the task, from what the API says now: the item, its head, and its author
              # when the author has no write access (a rescreen names the account of the run that the workflow held,
              # checked below, and the head of a pull request). The review of a writer's pull request names the account
              # that the inputs give: the task review below checks it against the CI runs of the head. The account a
              # name gives is the one whose limit the run counts on; a run by hand of a person or an App counts on none.
              # Each task below then reads again, for the rescreen pass's run, the reason why the pass started it, and
              # stops when the reason no longer holds.
              limited=""
              if [ "$ACTOR" = 'github-actions[bot]' ]; then
                [ "$is_draft" = false ] || stop "it is a draft."
                a=0
                known "$AUTHOR" || a=$?
                (( a == 0 )) || of=" of $AUTHOR"
                case $task in
                  rescreen) want="rescreen #$NUMBER${pr_head:+ at $pr_head} of $ACCOUNT" ;;
                  review) want="review #$NUMBER at $pr_head${of:-${ACCOUNT:+ of $ACCOUNT}}" ;;
                  approve) want="approve #$NUMBER at $pr_head$of" ;;
                  answer) want="answer #$NUMBER for $COMMENT$of" ;;
                  draft) want="draft #$NUMBER$of" ;;
                  *) want="$task #$NUMBER at $pr_head" ;;
                esac
                title=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.display_title // ""') \
                  || fail "this run could not be read."
                [ "$title" = "$want" ] || stop "its name \"$title\" is not the rescreen pass's for it (\"$want\")."
                account=$ACCOUNT limited=$ACCOUNT
              fi
              case $task in
                # A held item screened again: an outsider's path, decided from what the API says now, never from the
                # inputs alone. The item must be held, the newest hold of its review must be one that is tried again as
                # a rescreen (at the limit, at the cap, or a review that did not finish, whose marker names no task),
                # and the run that hold names must give the account that the inputs give. The rescreen pass's run also
                # needs that hold to be over an hour old.
                rescreen)
                  [ "$is_draft" = false ] || stop "it is a draft."
                  [ "$labelled" = true ] || stop "it is not labelled $HELD_LABEL."
                  newest review
                  if [[ -z $held_run || $held_run == - ]]; then
                    others=$(holds "$NUMBER") || fail "the comments of #$NUMBER could not be read."
                    other=$(awk 'NF && $3 != "-" && !found { print $6; found = 1 }' <<< "$others")
                    [ -z "$other" ] || stop "its hold is tried again as the task $other, not as a rescreen."
                    stop "it has no hold that is tried again."
                  fi
                  origin=$held_run tries=$held_tries
                  [[ $tries =~ ^[0-9]+$ ]] || stop "its hold names no count of tries."
                  [ "$ACTOR" != 'github-actions[bot]' ] || again rescreen
                  account=$(held_account "$origin" "$AUTHOR") || fail "run $origin could not be read."
                  [ -n "$account" ] || stop "its hold names no run whose account this workflow can tell."
                  [ "$ACCOUNT" = "$account" ] \
                    || stop "the account of the run that the workflow held is $account, not ${ACCOUNT:-none}."
                  if [ "$mergeable" = dirty ]; then task=conflict; route review ""; fi
                  # A writer's item whose hold names a writer's run (at the cap, or a review that did not finish) is
                  # reviewed without the screen.
                  screened "$AUTHOR" "$account" ;;
                # A review, or the screen first when the inputs ask for it. A review by hand of a pull request whose
                # head has runs that GitHub holds, from its head repository and head branch (held_runs), gets the task
                # approve, which screens it and approves them. The rescreen pass's review of a head (the pass's review,
                # rescreen.yml) needs the head to have no review of this workflow's form of now, no hold comment that
                # names it, no merge conflict that its label comment records, and no CI run from its head repository and
                # head branch that has not finished: the review of that CI run comes after it. The pass's review of a
                # writer's pull request is screened first when the account that started the newest of those CI runs
                # (pusher) has no write access and is not one of the APPS: on the limit of that account, as the run of
                # that CI run's own event is (workflow_run, above). That account must be the one that the run's name
                # gives, and with no such account the name gives none.
                review)
                  if [ "$mergeable" = dirty ]; then task=conflict; route review ""; fi
                  if [ "$ACTOR" = 'github-actions[bot]' ]; then
                    [[ $pr_head =~ ^[0-9a-f]{40}$ ]] || stop "it names no head commit."
                    marks=$(head_marks "$NUMBER" "$pr_head") || fail "the comments of #$NUMBER could not be read."
                    read -r reviewed named conflicted _ <<< "$marks"
                    [ "$reviewed" != new ] || stop "a review of the workflow names $pr_head."
                    [ "$named" = false ] || stop "a hold comment names $pr_head."
                    [ "$conflicted" = false ] \
                      || stop "its label comment records a merge conflict of $pr_head, which a relabel takes out first."
                    ci=$(ci_of "$pr_head" "$head_repo" "$head_ref") || fail "the CI runs of $pr_head could not be read."
                    [ "$ci" != pending ] || stop "a CI run of $pr_head has not finished, and its review comes after it."
                    [ -z "$of" ] || screened "$AUTHOR" "$limited"
                    pushed=$(pusher "$pr_head" "$head_repo" "$head_ref") \
                      || fail "the CI runs of $pr_head could not be read."
                    b=0
                    [ -z "$pushed" ] || known "$pushed" || b=$?
                    (( b != 0 )) || pushed=""
                    starter="${pushed:-no account without write access}${pushed:+, an account without write access,}"
                    why="$starter started the newest CI run of $pr_head, but this run names ${ACCOUNT:-no account}."
                    [ "$ACCOUNT" = "$pushed" ] || stop "$why"
                    [ -z "$pushed" ] || screened "$AUTHOR" "$pushed"
                    route review ""
                  fi
                  if [ "$kind" = pr ]; then
                    n=$(held_runs) || fail "the runs of $pr_head could not be read."
                    if (( n > 0 )); then task=approve; screened "$AUTHOR" "$limited"; fi
                  fi
                  [ "$SCREEN" != true ] || route screen ""
                  route review "" ;;
                # The answer to a comment of the item's author, as for the event issue_comment. The rescreen pass's run
                # needs the comment to wait still (waiting), and a hold of an answer that it tries again to be over an
                # hour old.
                answer)
                  [ -n "$COMMENT" ] || stop "it names no comment to answer."
                  who=$(comment_author) || fail "comment $COMMENT could not be read."
                  [ -n "$who" ] || stop "comment $COMMENT is not one of #$NUMBER."
                  [ "$who" = "$AUTHOR" ] || stop "comment $COMMENT is $who's, not its author's ($AUTHOR)."
                  a=0
                  known "$AUTHOR" || a=$?
                  (( a != 0 )) || stop "its author $AUTHOR has write access."
                  [ "$kind" = pr ] || replied || stop "its first reply has not posted."
                  if [ "$ACTOR" = 'github-actions[bot]' ]; then
                    waits=$(waiting "$NUMBER" "$AUTHOR" "$kind") || fail "the comments of #$NUMBER could not be read."
                    grep -q " $COMMENT\$" <<< "$waits" \
                      || stop "comment $COMMENT waits for no answer: an answer, a review or a hold of the workflow read it."
                    newest answer
                    again answer
                  fi
                  if [ "$mergeable" = dirty ]; then task=conflict; route review ""; fi
                  screened "$AUTHOR" "$limited" ;;
                # The draft of the reply to an outside author's issue. The rescreen pass's run needs no stored draft and
                # no posted reply, no hold of the issue that is not tried again (the newest of its work: the issue
                # waits on Sami), and a hold of a draft that the pass tries again to be over an hour old.
                draft)
                  a=0
                  known "$AUTHOR" || a=$?
                  (( a != 0 )) || stop "its author $AUTHOR has write access."
                  if [ "$ACTOR" = 'github-actions[bot]' ]; then
                    if stored; then stop "the draft of its reply is stored, or its reply posted."; fi
                    others=$(holds "$NUMBER") || fail "the comments of #$NUMBER could not be read."
                    [ -z "$(awk '$3 == "-"' <<< "$others")" ] || stop "a hold of it is not tried again."
                    newest draft
                    again draft
                  fi
                  screened "$AUTHOR" "$limited" ;;
                # A reply text that Sami approved: no screen and no model.
                reply) route review "" ;;
                # The screen of a first-time contributor's pull request, and the approval of its held runs when it
                # passes. The rescreen pass's run needs held runs at the head, no line of the label comment that records
                # the head as one whose runs the workflow does not approve (a file under .github/, or 3,000 files or
                # more; head_marks: the post job approves no run of such a head), a hold of an approval that it tries
                # again to be over an hour old, and no earlier run of its name that has not finished. A run of the pass
                # with a number and a run with none are in groups of their own: both can read #NUMBER before either
                # starts a run, and each then starts an approve run of the head. Without this check, the later run
                # screens the head a second time and counts a second screen on the author's limit (a screen that the
                # group screen-approve-<n> cancels counts too). The check costs one more read of the API: the
                # workflow_dispatch runs of review.yml since 00:00 UTC yesterday (runs_in, which reads a list that
                # GitHub cut again one day, then one hour, at a time). The later run finds the earlier one there,
                # unfinished, and stops. The earlier run finds no such run, as it reads only the runs before its own. A
                # conflict needs no such check: its run screens nothing and counts toward no limit, and the comment job,
                # one run at a time in the group label-<n>, posts the comment of a head only when it is not there yet.
                approve)
                  if [ "$mergeable" = dirty ]; then task=conflict; route review ""; fi
                  if [ "$ACTOR" = 'github-actions[bot]' ]; then
                    n=$(held_runs) || fail "the runs of $pr_head could not be read."
                    (( n > 0 )) || stop "GitHub holds no run of $pr_head."
                    marks=$(head_marks "$NUMBER" "$pr_head") || fail "the comments of #$NUMBER could not be read."
                    read -r _ _ _ _ steered <<< "$marks"
                    why="its label comment records that the pull request at $pr_head changes a file under .github/, or"
                    why+=" it changes 3,000 files or more. The workflow does not approve the runs of $pr_head, so Sami"
                    why+=" approves them."
                    [ "$steered" = false ] || stop "$why"
                    newest approve
                    again approve
                    # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
                    unended=$(WANT=$want runs_in workflow_dispatch ">=$(date -u -d '-1 day' +%Y-%m-%d)T00:00:00Z" \
                      "$pages"'(.workflow_runs[] | select(.event == "workflow_dispatch" and .status != "completed"
                        and .id < ($ENV.RUN_ID | tonumber) and (.display_title // "") == $ENV.WANT) | .id)') \
                      || fail "the workflow_dispatch runs of review.yml since 00:00 UTC yesterday could not be read."
                    [ -z "$unended" ] \
                      || stop "approve run ${unended%%$'\n'*} of $pr_head, made before this run, has not finished."
                  fi
                  screened "$AUTHOR" "$limited" ;;
                # The comment that asks the author to resolve a merge conflict, while the conflict is there. The
                # rescreen pass's run needs a label comment that does not record the conflict of the head yet.
                conflict)
                  [ "$mergeable" = dirty ] || stop "it has no merge conflict (its mergeable_state is ${mergeable:-unknown})."
                  if [ "$ACTOR" = 'github-actions[bot]' ]; then
                    marks=$(head_marks "$NUMBER" "$pr_head") || fail "the comments of #$NUMBER could not be read."
                    read -r _ _ conflicted _ <<< "$marks"
                    [ "$conflicted" = false ] || stop "its label comment records the merge conflict of $pr_head already."
                  fi
                  route review "" ;;
                # The App's close and reopen, or only the reopen of a pull request that a catch-up run closed (above):
                # no screen and no model. The rescreen pass's catch-up of an open pull request (rescreen.yml, catchup)
                # needs an outside author, a head repository that is still there (GitHub cannot reopen a pull request
                # whose head repository is gone), no review and no hold comment that names the head, no catch-up of the
                # head that its label comment records (once for each head), and CI runs of the head that all ended, the
                # newest over an hour ago.
                catchup)
                  if [ "$state" = open ] && [ "$mergeable" = dirty ]; then task=conflict; route review ""; fi
                  if [ "$ACTOR" = 'github-actions[bot]' ] && [ "$state" = open ]; then
                    [ -n "$of" ] || stop "its author $AUTHOR has write access."
                    [[ $head_repo =~ ^[1-9][0-9]*$ ]] || stop "its head repository is gone, so it is not closed."
                    marks=$(head_marks "$NUMBER" "$pr_head") || fail "the comments of #$NUMBER could not be read."
                    read -r reviewed named _ caught _ <<< "$marks"
                    [ "$reviewed" = none ] || stop "a review names $pr_head."
                    [ "$named" = false ] || stop "a hold comment names $pr_head."
                    [ "$caught" = false ] || stop "its label comment records a catch-up of $pr_head already."
                    ci=$(ci_of "$pr_head" "$head_repo" "$head_ref") || fail "the CI runs of $pr_head could not be read."
                    [[ -n $ci && $ci != pending ]] || stop "no CI run of $pr_head ended, or one has not finished."
                    [[ $ci < $(date -u -d '-1 hour' +%Y-%m-%dT%H:%M:%SZ) ]] \
                      || stop "the CI run of $pr_head ended at $ci, less than an hour ago."
                  fi
                  route review "" ;;
                # The import check run of R12 and the label of the head, set again from what the workflow wrote of the
                # head: no screen and no model. The outsider is the author when the author is an outsider
                # (kind_of_author), as the import check run is for an outside pull request alone, whose review came
                # after a screen that passed. When GitHub does not say whether the author has write access, the relabel
                # goes on with no outsider: it records no check run and changes no label, but it can withdraw a check
                # run (.github/review/rules.py answers). The rescreen pass's run needs GitHub to know whether the head
                # has a merge conflict, and a review, a hold comment or a recorded merge conflict of the workflow that
                # names the head. A relabel that is refused here settles nothing: the rescreen pass starts it again, at
                # its next run for a merge conflict that went away (held.sh due_conflict), and an hour after it for the
                # App's retry of a withdrawal (due_retry) and for a new value of REPO_PAIRS_IMPORT_PATHS (due_variable).
                relabel)
                  if [ "$mergeable" = dirty ]; then task=conflict; route review ""; fi
                  if [ "$ACTOR" = 'github-actions[bot]' ]; then
                    [ "$mergeable" != unknown ] || stop "GitHub does not say yet whether $pr_head has a merge conflict."
                    marks=$(head_marks "$NUMBER" "$pr_head") || fail "the comments of #$NUMBER could not be read."
                    read -r reviewed named conflicted _ <<< "$marks"
                    [[ $reviewed == new || $named == true || $conflicted == true ]] \
                      || stop "no review, hold comment or merge conflict of the workflow names $pr_head."
                  fi
                  kind_of_author
                  [ "$author_kind" = outsider ] || route review ""
                  [[ $AUTHOR =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || stop "$AUTHOR is not a GitHub login."
                  route review "$AUTHOR" ;;
              esac ;;
            *) echo "::error::not an event of this workflow: $EVENT"; exit 1 ;;
          esac

  # Data only: nothing gathered here runs, and this job holds no model. The number, the head, the author and the text
  # come from the GitHub API, never from the CI run. The pull request's files come from git objects of its head
  # (git diff, git cat-file), never from a checkout, so no attribute, filter or hook of the pull request applies. What
  # .review/ leaves out is listed in omitted.txt. It is kept as one tar file, so that no file name of the pull request
  # can stop the upload, for a day, and the screen and review jobs take it by its SHA-256. An approval is gathered
  # only for its screen: no review follows it.
  gather:
    needs: trust
    if: >-
      github.ref == 'refs/heads/main'
      && (needs.trust.outputs.route == 'review' || needs.trust.outputs.route == 'screen')
      && (needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen'
          || needs.trust.outputs.task == 'answer' || needs.trust.outputs.task == 'draft'
          || (needs.trust.outputs.task == 'approve' && needs.trust.outputs.route == 'screen'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {contents: read, pull-requests: read, issues: read, checks: read, statuses: read}
    outputs:
      kind: ${{ steps.what.outputs.kind }}
      number: ${{ steps.what.outputs.number }}
      digest: ${{ steps.keep.outputs.digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with: {persist-credentials: false, fetch-depth: 0}

      - name: What to review
        id: what
        env:
          NUMBER: ${{ needs.trust.outputs.number }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          kind=$(gh api "repos/$REPO/issues/$NUMBER" --jq 'if .pull_request then "pr" else "issue" end')
          echo "Reviewing $kind #$NUMBER."
          { echo "kind=$kind"; echo "number=$NUMBER"; } >> "$GITHUB_OUTPUT"

      - name: Gather the pull request or issue
        id: gather
        env:
          KIND: ${{ steps.what.outputs.kind }}
          NUMBER: ${{ steps.what.outputs.number }}
          # The head the trust job read from the API. When the pull request has moved on since, a newer push started
          # its own CI run, and so its own run of this file, which the trust job judged by that push's account: this
          # run gathers nothing, and so neither screens nor reviews.
          EVENT_HEAD: ${{ needs.trust.outputs.head }}
          # For an answer: the task, and the comment that the trust job read, which must still wait for an answer.
          TASK: ${{ needs.trust.outputs.task }}
          COMMENT: ${{ needs.trust.outputs.comment }}
        run: |
          set -euo pipefail
          out=.review
          mkdir -p "$out"
          : > "$out/omitted.txt"
          # trusted <login>: 0 for write access or one of the APPS, 1 for neither, 2 when GitHub could not say.
          source "$GITHUB_WORKSPACE/.github/review/trusted.sh"
          # comments
          # The comments, reviews and review comments that the review reads: those of the pull request's or the
          # issue's author, and of each account that trusted passes. GitHub's REST API names an App <name>[bot]. An
          # answer also reads the workflow's own comments and reviews of the item (own), as data: its review, its
          # answers, its hold comment and its label comment (each by the marker that starts it), and its fix reviews
          # with their suggested changes. They tell the answer the next step and whom the item waits on. The screen
          # reads none of them (.github/screen.py, own_accounts). The others are counted in omitted.txt, and never read.
          author=$(gh api "repos/$REPO/issues/$NUMBER" --jq .user.login)
          gh api --paginate "repos/$REPO/issues/$NUMBER/comments" \
            --jq '.[] | {id, author: .user.login, created_at, updated_at, body}' > "$RUNNER_TEMP/comments.jsonl"
          : > "$RUNNER_TEMP/reviews.jsonl"
          : > "$RUNNER_TEMP/review-comments.jsonl"
          if [ "$KIND" = pr ]; then
            gh api --paginate "repos/$REPO/pulls/$NUMBER/reviews" \
              --jq '.[] | {id, author: .user.login, state, submitted_at, body}' > "$RUNNER_TEMP/reviews.jsonl"
            gh api --paginate "repos/$REPO/pulls/$NUMBER/comments" \
              --jq '.[] | {id, review: .pull_request_review_id, author: .user.login, path,
                           line: (.line // .original_line), created_at, body}' \
              > "$RUNNER_TEMP/review-comments.jsonl"
          fi
          readers=("$author")
          while IFS= read -r login; do
            if [ "$login" != "$author" ] && trusted "$login"; then readers+=("$login"); fi
          done < <(cat "$RUNNER_TEMP"/{comments,reviews,review-comments}.jsonl | jq -r '.author // empty' | sort -u)
          read_json=$(jq -cn '$ARGS.positional' --args "${readers[@]}")
          own=false
          [ "${TASK:-}" != answer ] || own=true
          # The ids of the workflow's own fix reviews, whose review comments are its suggested changes.
          fixes=$(jq -cs --argjson own "$own" 'if $own then map(select(.author == "github-actions[bot]"
            and ((.body // "") | startswith("<!-- review-fix ")))) | map(.id) else [] end' "$RUNNER_TEMP/reviews.jsonl")
          # shellcheck disable=SC2016 # $readers, $own, $fixes and $what are jq's
          keep='(.author | IN($readers[])) or ($own and .author == "github-actions[bot]"
            and (if $what == "comments" then (.body // "") | test("^<!-- review(-answer [0-9]+| -->|-held -->|-label -->)")
                 elif $what == "reviews" then .id | IN($fixes[]) else .review | IN($fixes[]) end))'
          for what in comments reviews review-comments; do
            jq -s --argjson readers "$read_json" --argjson own "$own" --argjson fixes "$fixes" --arg what "$what" \
              "map(select($keep))" "$RUNNER_TEMP/$what.jsonl" > "$RUNNER_TEMP/$what.json"
            left=$(jq -s --argjson readers "$read_json" --argjson own "$own" --argjson fixes "$fixes" --arg what "$what" \
              "map(select($keep | not)) | length" "$RUNNER_TEMP/$what.jsonl")
            (( left == 0 )) || echo "$left $what by accounts without write access: not read" >> "$out/omitted.txt"
          done
          # For an answer, the comments of the author that wait for it, oldest first (answer-to.json): each comment,
          # each review with a text and each review comment of the author made after what the workflow's newest review,
          # fix review, answer or hold read, as the trust job and the rescreen pass tell them (waiting). A review and a
          # fix review read the conversation when their run started, as their marker <!-- review-read <time> --> says
          # (one with no such marker, from before it, when GitHub last changed it), so that a comment made while their
          # run ran still waits. That marker counts only among the marker lines at the start of the comment or the
          # review, which the workflow writes, as for waiting: the text of a review of before the move off
          # pull_request_target can hold any marker. An answer answers the comments up to the one that its marker
          # names, the newest that waited for it. A hold comment counts from the time GitHub last changed it. A hold of
          # an answer that the workflow tries again (its marker names the task answer) answers nothing: each comment
          # that waited when it was written, up to the one that its marker names, still waits until an answer answers
          # it, whatever review or hold came after that hold. The answer answers each comment that waits, and its
          # marker names the newest.
          # When the comment that the trust job read waits no more, an answer, a review or a hold of the workflow read
          # it: this run gathers nothing.
          if [ "$own" = true ]; then
            # shellcheck disable=SC2016 # $author, $c, $r, $rc and the names bound in the filter are jq's
            jq -n --arg author "$author" --slurpfile c "$RUNNER_TEMP/comments.json" \
              --slurpfile r "$RUNNER_TEMP/reviews.json" --slurpfile rc "$RUNNER_TEMP/review-comments.json" '
              def read_at: (.body // "")
                | capture("^<!-- review(-held|-fix [0-9a-f]{40})? -->(\n<!-- review-(head|verdict|screened) [^\n]* -->)*\n<!-- review-read (?<t>[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z) -->(\n|$)") | .t;
              ([$c[0][], $r[0][], $rc[0][]] | map(select(.author == $author)
                  | {key: (.id | tostring), value: (.created_at // .submitted_at // "")}) | from_entries) as $made
              | ([$c[0][] | select(.author == "github-actions[bot]" and ((.body // "") | test("^<!-- review-answer [0-9]+")))
                  | ((.body | capture("^<!-- review-answer (?<c>[0-9]+)") | .c) as $id | $made[$id] // .updated_at)]
                 | map(strings) | max // "") as $answered
              | ([($c[0][] | select(.author == "github-actions[bot]" and ((.body // "") as $b
                    | ($b | test("^<!-- review(-held)? -->")) and (($b | startswith("<!-- review-held -->"))
                        and ($b | test("\n<!-- review-held-[a-z]+ [0-9]+ [0-9]+ answer [0-9]+ -->(\n|$)")) | not)))
                  | {read: (read_at // .updated_at), at: .updated_at}),
                  ($r[0][] | select(.author == "github-actions[bot]")
                   | {read: (read_at // .submitted_at), at: .submitted_at})]) as $reads
              | ($reads | map(.read) + [$answered] | map(strings) | max // "") as $since
              | [$c[0][] | select(.author == "github-actions[bot]" and ((.body // "") | startswith("<!-- review-held -->")))
                  | (.body | capture("\n<!-- review-held-[a-z]+ [0-9]+ [0-9]+ answer (?<c>[0-9]+) -->(\n|$)") | .c) as $id
                  | {upto: $made[$id], at: .updated_at} | select(.upto != null)] as $holds
              | [($c[0][] | select(.author == $author) | {id, kind: "comment", created_at, body}),
                 ($r[0][] | select(.author == $author and ((.body // "") | test("\\S")))
                  | {id, kind: "review", created_at: .submitted_at, body}),
                 ($rc[0][] | select(.author == $author) | {id, kind: "review comment", created_at, path, line, body})]
              | map(select((.created_at // "") as $m | $m > $since or any($holds[]; . as $h | $m <= $h.upto
                  and $m > $answered and $m > ([$reads[] | select(.at < $h.at) | .read] | map(strings) | max // ""))))
              | sort_by(.created_at)' > "$out/answer-to.json"
            if ! jq -e --arg id "${COMMENT:-}" 'any(.[]; (.id | tostring) == $id)' "$out/answer-to.json" > /dev/null; then
              echo "::notice::#$NUMBER: the comment ${COMMENT:-} waits for no answer: an answer, a review or a hold of the workflow read it. This run gathers nothing."
              echo "answered=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "#$NUMBER: $(jq length "$out/answer-to.json") comments of $author wait for the answer."
          fi
          # end of comments
          if [ "$KIND" = issue ]; then
            gh issue view "$NUMBER" -R "$REPO" --json number,title,author,createdAt,state,body \
              | jq --slurpfile c "$RUNNER_TEMP/comments.json" '. + {comments: $c[0]}' > "$out/issue.json"
          else
            gh pr view "$NUMBER" -R "$REPO" --json \
              number,title,author,createdAt,isDraft,baseRefName,headRefOid,headRepository,body,commits,files \
              | jq --slurpfile c "$RUNNER_TEMP/comments.json" --slurpfile r "$RUNNER_TEMP/reviews.json" \
                  '. + {comments: $c[0], reviews: $r[0]}' > "$out/pr.json"
            gh pr view "$NUMBER" -R "$REPO" --json statusCheckRollup > "$out/checks.json"
            # The review comments, each with its author, path, line and body: the screen leaves out those of the
            # workflow's own accounts, as it does their comments and reviews (.github/screen.py, own_accounts).
            jq '[.[] | {author, path, line, body}]' "$RUNNER_TEMP/review-comments.json" > "$out/review-comments.json"
            if [ -n "$EVENT_HEAD" ] && [ "$(jq -r .headRefOid "$out/pr.json")" != "$EVENT_HEAD" ]; then
              echo "::notice::#$NUMBER has moved on from $EVENT_HEAD: the run of its newer push considers it."
              echo "moved=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            base=$(jq -r .baseRefName "$out/pr.json")
            [ "$base" = main ] || { echo "::error::pull request #$NUMBER is into $base, not main: not reviewed."; exit 1; }
            git fetch -q --no-tags origin "+refs/pull/$NUMBER/head:refs/review/head"
            head=$(git rev-parse refs/review/head)
            [ "$head" = "$(jq -r .headRefOid "$out/pr.json")" ] \
              || { echo "::error::the pull request's head moved while it was read; the next run reviews the new head."; exit 1; }
            # main as the checkout fetched it: the commit that the pull request merges into, whose dune files the
            # soundness rule reads too.
            main=$(git rev-parse --verify "origin/main^{commit}")
            mb=$(git merge-base "$main" "$head")
            printf 'base %s\nhead %s\n' "$mb" "$head" > "$out/commits.txt"
            # Each changed path, a renamed file's old path too, which head/ and omitted.txt take.
            git diff --no-renames --name-only -z "$mb" "$head" > "$RUNNER_TEMP/changed"
            changed=$(tr -cd '\0' < "$RUNNER_TEMP/changed" | wc -c)
            (( changed <= 3000 )) || { echo "::error::$changed changed files: too large for this review."; exit 1; }
            # The diff as GitHub shows the pull request: a renamed file as a rename, with only its changed lines, so
            # that the fix keeps no suggestion on a line that GitHub's diff does not show (rules.py suggestions).
            git diff --find-renames --no-ext-diff --no-textconv "$mb" "$head" > "$out/pr.diff"
            # Each changed file as the pull request has it: regular files only, each cut at 2 MiB, 512 MiB in all.
            total=0
            while IFS= read -r -d '' path; do
              mode=$(git ls-tree --format='%(objectmode)' "$head" -- ":(literal)$path")
              case $mode in
                '') echo "$path: deleted" >> "$out/omitted.txt"; continue ;;
                100644|100755) ;;
                *) echo "$path: not a regular file (mode $mode)" >> "$out/omitted.txt"; continue ;;
              esac
              file="$out/head/$path"
              mkdir -p "$(dirname -- "$file")"
              git cat-file blob "$head:$path" > "$file"
              size=$(stat -c %s "$file")
              total=$((total + size))
              (( total <= 536870912 )) || { echo "::error::the changed files hold over 512 MiB: too large for this review."; exit 1; }
              if (( size > 2097152 )); then
                truncate -s 2097152 "$file"
                echo "$path: cut at 2 MiB of its $size bytes" >> "$out/omitted.txt"
              fi
            done < "$RUNNER_TEMP/changed"
            # Claude Code reads a CLAUDE.md, an AGENTS.md or a .claude/ beside a file it reads as instructions. The pull
            # request's are data, so they go.
            if [ -d "$out/head" ]; then
              find "$out/head" \( -iname 'CLAUDE*.md' -o -iname 'AGENTS*.md' -o -iname .claude \) -prune -print0 \
                | while IFS= read -r -d '' p; do
                    echo "${p#"$out"/head/}: removed (instructions for Claude Code)" >> "$out/omitted.txt"
                    rm -rf -- "$p"
                  done
            fi
            # The facts of the soundness rule (R8), which this job reads itself, never the model: the changed paths from
            # every page of the files of the pull request (gh pr view gives at most 100), each file's path and the path
            # that it had before a rename, read after a check of the head and before a second check of it. A list that
            # a read did not finish, of another head, or shorter than changed_files (GitHub lists at most 3,000 files)
            # is not whole, and the rule counts it as a change of a proof. rules.py proofs writes soundness.json: each
            # changed path that counts, with why (a .v file, any other file that is not a Markdown file, or a Markdown
            # file that a dune, dune-project or dune-workspace* file of the head or of main makes count: one in its
            # directory or above it that holds .md; or one anywhere that holds the word include, :include,
            # source_tree, copy_files or copy_files# outside a comment line, a glob_files or glob_files_rec whose
            # pattern does not end with one fixed extension other than md, or a word or a string with .md and also ..,
            # %{project_root} or %{workspace_root}, or a leading /), and the dune file that made it count with the text
            # in it. It reads those files once, from git objects anywhere in the tree, only when a changed path is a
            # Markdown file. It also writes whether the list is whole, and each such dune file that it could not read
            # (unparsed: a link or a submodule in its place, or an object that git does not hold), which makes each
            # changed Markdown file count.
            count=""
            : > "$RUNNER_TEMP/files.jsonl"
            if pr=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '"\(.head.sha) \(.changed_files)"') \
                && [ "${pr%% *}" = "$head" ] \
                && gh api --paginate "repos/$REPO/pulls/$NUMBER/files?per_page=100" \
                  --jq '.[] | {filename, previous_filename} | @json' > "$RUNNER_TEMP/files.jsonl" \
                && [ "$(gh api "repos/$REPO/pulls/$NUMBER" --jq .head.sha)" = "$head" ]; then
              count=${pr#* }
            else
              echo "::warning::the files of #$NUMBER at $head could not be read whole: the soundness rule counts the pull request as a change of a proof."
            fi
            python3 .github/review/rules.py proofs "$head" "$main" "$RUNNER_TEMP/files.jsonl" "$count" \
              > "$out/soundness.json"
          fi
          echo "Gathered $(find "$out" -type f | wc -l) files."

      # Nothing is kept when the pull request moved on, or when the comment of an answer waits no more.
      - name: Keep it for the screen and the review
        id: keep
        if: steps.gather.outputs.moved != 'true' && steps.gather.outputs.answered != 'true'
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/review-data"
          tar -cf "$RUNNER_TEMP/review-data/review.tar" .review
          digest=$(sha256sum "$RUNNER_TEMP/review-data/review.tar" | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Kept .review/ as review.tar, SHA-256 $digest."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (sha-pinned)
        if: steps.gather.outputs.moved != 'true' && steps.gather.outputs.answered != 'true'
        with: {name: review-data, path: "${{ runner.temp }}/review-data/review.tar", if-no-files-found: error, retention-days: 1, overwrite: true}

  # The screen of a pull request or issue whose author, or the account that started the run, has no write access, or
  # that a run by hand asked to screen (the top of this file, and .github/screen.py). In the environment review-screen,
  # whose jobs alone can exchange their identity token for the screen's three: so this job cannot get the review's
  # Claude token, and no other job, the review's included, can get the screen's. Its one output is the verdict, clean
  # or held; the reason goes to the private bucket REASON_BUCKET. Its name gives the account whose limit the run counts
  # on (the trust job's account), which the trust job (earlier) and the rescreen pass (held_account) read back: a CI
  # run's name gives the account that pushed, and that account need not be it.
  screen:
    name: screen ${{ needs.trust.outputs.account }}
    needs: [trust, gather]
    # A screen of what the gather job kept, or a measurement, which needs no gather job.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main'
          && ((needs.trust.outputs.route == 'screen' && needs.gather.result == 'success'
               && needs.gather.outputs.digest != '') || needs.trust.outputs.route == 'measure') }}
    environment: {name: review-screen, deployment: false}
    # One screen at a time for each item and task: a newer head cancels the screen of the older one. An answer never
    # cancels a review's screen, nor a review an answer's. A draft or a reply is never cancelled.
    concurrency:
      group: screen-${{ needs.trust.outputs.task }}-${{ needs.trust.outputs.number }}
      cancel-in-progress: ${{ needs.trust.outputs.task != 'draft' && needs.trust.outputs.task != 'reply' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ needs.trust.outputs.route == 'measure' && 60 || 15 }}
    permissions: {contents: read, id-token: write}
    outputs:
      verdict: ${{ steps.screen.outputs.verdict }}
    env:
      # Ids and endpoints, not secrets. Google Cloud: the pool, its provider and the account that only this
      # environment's jobs of this file reach, Model Armor's template, and the bucket the reason goes to.
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/805240912354/locations/global/workloadIdentityPools/review-screen/providers/github
      GCP_SERVICE_ACCOUNT: review-screen@theorem-agent-infra.iam.gserviceaccount.com
      MODEL_ARMOR_URL: https://modelarmor.us.rep.googleapis.com
      MODEL_ARMOR_TEMPLATE: projects/theorem-agent-infra/locations/us/templates/review-screen
      STORAGE_URL: https://storage.googleapis.com
      REASON_BUCKET: theorem-agent-infra-review-screen-reasons
      # The reason object of this run's attempt, which the Screen step writes, or the sign-in to Anthropic and Azure
      # when it fails, and what it names of the run.
      REASON_OBJECT: ${{ github.repository }}/${{ github.run_id }}-${{ github.run_attempt }}.json
      REPOSITORY: ${{ github.repository }}
      NUMBER: ${{ needs.trust.outputs.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Azure: Theorem's tenant, the managed identity review-screen, whose federated credential admits this
      # repository's jobs in review-screen, and whose role allows text:shieldPrompt on the Content Safety account and
      # nothing else.
      AZURE_LOGIN_URL: https://login.microsoftonline.com
      AZURE_TENANT_ID: aaa6ad34-51af-41e7-891f-f16f5c53c396
      AZURE_CLIENT_ID: 878cb696-144f-4c60-b04c-3974fad24e96
      CONTENT_SAFETY_URL: https://theorem-review-screen.cognitiveservices.azure.com
      # Anthropic: Theorem's organization, the service account review-screen (not the review's oss-verify-ci), its
      # workspace, and the federation rule rocq-linux-process-semantics-screen, which admits only this file's jobs in
      # review-screen on main, for this file's events (workflow_run and issue_comment from when that rule admits them),
      # with the scope workspace:inference.
      ANTHROPIC_URL: https://api.anthropic.com
      ANTHROPIC_ORGANIZATION_ID: 5fd73c3e-8a2c-4166-b80d-fb5ce0c1b4a6
      ANTHROPIC_WORKSPACE_ID: wrkspc_01Qr1iUVcow4jdgQM7Amfks5
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01JFhEhPizCyTiK2i22mRJ8a
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01SQMHj4Tw85dV4DNYWQDKeA
      SCREEN_MODEL: claude-haiku-5-5
      # The checks that run, all three. A listed check whose settings are missing, or that cannot answer (a 429 of
      # Prompt Shields' free tier among the causes), holds the item; a check leaves only by leaving this list.
      SCREEN_CHECKS: model_armor,prompt_shields,claude
      # How the checks' words make the verdict (.github/screen.py, RULES, with the measurement behind the choice):
      # held when the model answers suspicious, or Model Armor and Prompt Shields both do; and, under every rule, when
      # a check cannot answer.
      SCREEN_RULE: claude_or_both_detectors
    steps:
      # main's .github/, for screen.py; never the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with: {persist-credentials: false, sparse-checkout: .github, sparse-checkout-cone-mode: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (sha-pinned)
        if: needs.trust.outputs.route != 'measure'
        with: {name: review-data, path: "${{ runner.temp }}/review-data"}
      # The one copy of the env and the script of this step: the review job's step of this name runs them as well
      # (*take-env and *take there).
      - name: Take the gathered pull request or issue
        if: needs.trust.outputs.route != 'measure'
        env: &take-env {DIGEST: "${{ needs.gather.outputs.digest }}"}
        run: &take |
          set -euo pipefail
          tar=$RUNNER_TEMP/review-data/review.tar
          [[ $DIGEST =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the gather job gave no SHA-256"; exit 1; }
          printf '%s  %s\n' "$DIGEST" "$tar" | sha256sum -c --strict
          # The listing goes to a file first: grep -q in a pipe would stop tar early, and pipefail would read that as
          # the check passing.
          tar -tf "$tar" > "$RUNNER_TEMP/review-data/members"
          ! grep -qvE '^\.review(/|$)' "$RUNNER_TEMP/review-data/members" \
            || { echo "::error::review.tar holds more than .review/"; exit 1; }
          ! grep -qE '(^|/)\.\.(/|$)' "$RUNNER_TEMP/review-data/members" || { echo "::error::review.tar holds a .. path"; exit 1; }
          [ ! -e .review ] || { echo "::error::.review is there already"; exit 1; }
          tar -xf "$tar" --no-same-owner --no-same-permissions
          echo "Took $(find .review -type f | wc -l) files."

      # A token for 10 minutes, or an hour for a measurement, which can run longer, which the account can use for
      # Model Armor, for adding an object to the reason bucket and for reading the labelled set, and for nothing else.
      # A sign-in that fails fails this job before the screen, with no verdict, and the hold job holds nothing for it.
      - name: Sign in to Google Cloud
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (sha-pinned)
        with: {workload_identity_provider: "${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}", service_account: "${{ env.GCP_SERVICE_ACCOUNT }}", token_format: access_token, access_token_lifetime: "${{ needs.trust.outputs.route == 'measure' && '3600s' || '600s' }}", create_credentials_file: false, export_environment_variables: false}
      # This step exchanges the identity token for Microsoft Entra's token for Prompt Shields and for Anthropic's token
      # for the screen's model, each when SCREEN_CHECKS lists its check and the job's env above sets up its identity.
      # Both tokens go to a file under the runner's temporary directory that only the runner's account can read, and
      # that the Screen or Measure step deletes as it reads it; never to this log or an output. An exchange that fails,
      # or that has not answered after the sign-in's own 120 seconds, fails this job before the screen, with no
      # verdict, and the hold job holds nothing for it. This log then gets the HTTP status and the host of a refused
      # exchange alone: the service's answer goes to the reason object in REASON_BUCKET, with the Google token of the
      # step before, and is lost when that object cannot be written.
      - name: Sign in to Anthropic and Azure
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python3 .github/screen.py --sign-in
      # The screen reads the tokens of the step before and deletes their file.
      - name: Screen
        id: screen
        if: needs.trust.outputs.route != 'measure'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python3 .github/screen.py .review
      # Every listed check, three times, on each text of the labelled set kept in the private bucket, and the verdict
      # of each rule of SCREEN_RULE's choices, with the tokens of the sign-in. The texts and their words stay in the
      # bucket; this log and the run's summary get the counts per rule alone.
      - name: Measure
        if: needs.trust.outputs.route == 'measure'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          MEASURE_SET: ${{ inputs.measure_set }}
          MEASURE_OBJECT: measure/runs/${{ github.repository }}/${{ github.run_id }}-${{ github.run_attempt }}.json
          MEASURE_REPEATS: ${{ inputs.measure_repeats }}
        run: |
          set -euo pipefail
          [[ $MEASURE_SET =~ ^measure/set-v[0-9]+\.json$ ]] || { echo "::error::not a labelled set: $MEASURE_SET"; exit 1; }
          [[ $MEASURE_REPEATS =~ ^[1-5]$ ]] || { echo "::error::MEASURE_REPEATS must be 1 to 5"; exit 1; }
          python3 .github/screen.py --measure

  review:
    # The hourly caps tell the two kinds of review apart by this name.
    name: ${{ needs.trust.outputs.route == 'screen' && 'review (screened)' || 'review' }}
    needs: [trust, gather, screen]
    # A writer's, or a request by hand; or one the screen passed. A run whose gather job failed, or whose screen held
    # it, failed or was cancelled, has no review. Its tasks: the review, the rescreen of a review, and the answer to the
    # comments of an outside item's author, with the fix that a review or an answer starts; and the draft of the reply
    # to a new issue of an outside author. The approved reply has no job here: the comment job posts the text of its
    # run, which this job neither reads nor keeps.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main'
      && needs.gather.result == 'success' && needs.gather.outputs.digest != ''
      && (needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen'
          || needs.trust.outputs.task == 'answer' || needs.trust.outputs.task == 'draft')
      && (needs.trust.outputs.route == 'review'
          || (needs.trust.outputs.route == 'screen' && needs.screen.result == 'success'
              && needs.screen.outputs.verdict == 'clean'))
    # One run of this job at a time for each pull request or issue and task: a new push replaces the review of the old
    # head, and a later comment's answer run answers every comment that waits. An answer never cancels a review, nor a
    # review an answer: their groups differ. A draft or a reply is never cancelled. A run that the trust job stops, or
    # that the screen holds, never reaches this job, so it cancels nothing.
    concurrency:
      group: review-${{ needs.trust.outputs.task }}-${{ needs.trust.outputs.number }}
      cancel-in-progress: ${{ needs.trust.outputs.task != 'draft' && needs.trust.outputs.task != 'reply' }}
    runs-on: ubuntu-24.04
    # The review, the answer or the draft, then the fix, each with its own time.
    timeout-minutes: 100
    permissions: {contents: read, pull-requests: read, issues: read, checks: read, statuses: read, actions: read, id-token: write}
    outputs:
      head: ${{ steps.result.outputs.head || steps.answered.outputs.head }}
      # The review's verdict (pass, blocking or person), after the soundness rule (SOUNDNESS_HOLD) and the rule of the
      # verdict blocking, for the state label.
      verdict: ${{ steps.result.outputs.verdict }}
      # The facts of the two stops of the fix, for the state label: will_fix (true or false), when the author said they
      # will make the change, and fix_stop, when 2 fix reviews since the author's last own push did not make the
      # review pass.
      will_fix: ${{ steps.fixable.outputs.will_fix }}
      fix_stop: ${{ steps.fixable.outputs.fix_stop }}
      body: ${{ steps.result.outputs.body }}
      # The answer, with its marker. It is empty when the answer gives none.
      answer: ${{ steps.answered.outputs.body }}
      # The fix: the request of one review of suggested changes (POST pulls/<n>/reviews). It is empty when no fix posts.
      fix: ${{ steps.fixed.outputs.review }}
      # The text that the fresh reader refused, so that nothing of it posts: review, answer or fix. Empty when it
      # refused none.
      refused: ${{ steps.result.outputs.refused || steps.answered.outputs.refused || steps.fixed.outputs.refused }}
      # The run and the attempt of a draft that this job uploaded, <run>-<attempt>, which name the run of its artifact:
      # never its text. It is empty when no draft was uploaded.
      draft: ${{ steps.drafted.outputs.draft }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      # Theorem's Anthropic organization, its service account oss-verify-ci and its workspace, and the federation rule
      # that admits this file on main (ids, not secrets), which the Claude steps, the sign-ins to Anthropic and the
      # fresh reader read.
      ANTHROPIC_URL: https://api.anthropic.com
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01PuYUs4GWGMxDQi1kLWwu7y
      ANTHROPIC_ORGANIZATION_ID: 5fd73c3e-8a2c-4166-b80d-fb5ce0c1b4a6
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01WdHTLcJPEfiPttcuLK1hGT
      ANTHROPIC_WORKSPACE_ID: wrkspc_01Qr1iUVcow4jdgQM7Amfks5
      # The Linux the model describes (README.md, SCOPE.md: stable Linux v6.18.46), and QEMU 10.0.11, the version of
      # SCOPE.md's QEMU measurements.
      LINUX_URL: https://github.com/gregkh/linux
      LINUX_COMMIT: 1f99e9ab748fc5c32120de9c4eca31abfe54a4d5
      QEMU_URL: https://github.com/qemu/qemu
      QEMU_COMMIT: e3ad0582fdcec5c194835b0b4e8342cdc197b5cb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with: {persist-credentials: false}

      # Anthropic's exchange of a new identity token, with the federation rule, the organization, the service account
      # and the workspace of the job's env, which the Review step uses too, before any step that runs the model. The
      # step only shows that the rule admits this run: the Claude token it gets is checked and then dropped, never
      # printed, written or kept, and the Review step gets a token of its own. When the rule does not admit the run (a
      # run of an event that the rule does not admit yet, say), the job fails here, at a step whose name starts with
      # "Sign in", before the model, and the hold job holds nothing for it: the rescreen pass takes the item again. curl
      # reads the request header and the exchange's body from its standard input, so that no token is in a command
      # line.
      - name: Sign in to Anthropic
        run: |
          set -euo pipefail
          fail() { echo "::error::The sign-in to Anthropic failed: $1 No model ran."; exit 1; }
          [[ -n ${ACTIONS_ID_TOKEN_REQUEST_URL:-} && -n ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-} ]] \
            || fail "this job can get no identity token."
          jwt=$(printf 'header = "Authorization: Bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            | curl -sS --fail --retry 3 -K - -G --data-urlencode audience=https://api.anthropic.com \
                "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -er '.value | strings | select(length > 0)') \
            || fail "GitHub gave no identity token."
          answer=$(JWT=$jwt jq -n '{grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer", assertion: $ENV.JWT,
              federation_rule_id: $ENV.ANTHROPIC_FEDERATION_RULE_ID, organization_id: $ENV.ANTHROPIC_ORGANIZATION_ID,
              service_account_id: $ENV.ANTHROPIC_SERVICE_ACCOUNT_ID, workspace_id: $ENV.ANTHROPIC_WORKSPACE_ID}' \
            | curl -sS --retry 3 -H 'Content-Type: application/json' --data-binary @- -w '\n%{http_code}' \
                "$ANTHROPIC_URL/v1/oauth/token") || fail "Anthropic could not be reached."
          jwt=""
          status=${answer##*$'\n'}
          answer=${answer%$'\n'*}
          # An answer that is not 2xx holds no token. This log gets its HTTP status alone, never a part of Anthropic's
          # answer: the log of a public repository is public, and no private store is there for the answer.
          [[ $status == 2[0-9][0-9] ]] || fail "HTTP $status from Anthropic."
          jq -e '.access_token | strings | length > 0' <<< "$answer" > /dev/null 2>&1 \
            || fail "Anthropic gave no access token."
          answer=""
          echo "Anthropic's federation rule admits this run. The Review step gets a token of its own."

      # Counts this workflow's other runs whose review job started in the last hour, or has not started, and has called
      # the model or may still call it: one whose Review, Answer or Draft step ran or runs (the Fix step runs after one
      # of them, in the same job, and counts with it); one that passed the step "Hold at the hourly cap" and has not
      # finished; and one that has not finished that step yet and belongs to an earlier run, which goes first. So in a
      # burst the earliest runs go ahead and the later ones stop at that step. A job is of the hour by the time when it
      # started, and a job that has not started by the time when its attempt of the run started. A run counts once,
      # whatever attempts of its review job the jobs list (filter=all): the rescreen pass runs again the failed jobs of
      # a run whose screen passed and whose review could not sign in, and that run counts once. This run's own
      # attempts never count. The runs of workflow_run, issues, issue_comment and workflow_dispatch are read, never a
      # fork's own run of this file (pull_request). A re-run keeps the time when its run was made, and GitHub's created
      # filter reads that time: so each run that has not finished is read, whenever it was made, and each run that
      # ended is read when it was made up to 27 hours ago. That covers a job's 100 minutes and its time in the queue,
      # and the day after a run was made in which the rescreen pass runs its failed jobs again (the retention-days of
      # review-data, which a re-run reads). A review job that waits for its run's trust job is not listed yet, and one
      # the trust job skipped has no Review, Answer or Draft step, so neither counts. The runs are listed one status at
      # a time (GitHub's status filter takes a status or a conclusion): each one that the filter takes but two,
      # skipped, the end of a run whose every job GitHub skipped (the run of a comment of a person who is not the
      # author of its item, say), and completed, which holds those runs too. So such runs never fill a list. The lists
      # are read in the order in which a run goes through those statuses, so that a run that moves on between two
      # reads is in a later list. A run that ended before the hour began has no review job of the hour, so its jobs are
      # not read. Only jobs of this run's kind count, by the job's name, whatever the task of their run: a writer's
      # review or answer against HOURLY_CAP, a screened one (a draft among them) against SCREENED_HOURLY_CAP. GitHub
      # gives at most 1,000 runs for a list with a filter, the newest first, and its total_count then says that more
      # match: the runs that such a list does not give can hold reviews of the hour, so the count is then the cap. A
      # read that fails stops the run here, not at "Hold at the hourly cap", so that the hold job, which reads a
      # failure of that step as the cap, never says the cap was reached when it was not.
      - name: Count the reviews of the last hour
        id: count
        env:
          RUN_ID: ${{ github.run_id }}
          POOL: ${{ needs.trust.outputs.route == 'screen' && 'review (screened)' || 'review' }}
          CAP: ${{ needs.trust.outputs.route == 'screen' && env.SCREENED_HOURLY_CAP || env.HOURLY_CAP }}
        run: |
          set -uo pipefail
          stop() { echo "::error::$1 No model ran. A maintainer can re-run this run."; exit 1; }
          [[ $CAP =~ ^[1-9][0-9]*$ ]] || stop "the cap is not a number."
          SINCE=$(date -u -d '-1 hour' +%s) || stop "the time could not be read."
          from=$(date -u -d '-27 hours' +%Y-%m-%dT%H:%M:%SZ) || stop "the time could not be read."
          export SINCE
          runs="" cut=""
          for status in requested queued pending waiting in_progress success failure cancelled timed_out neutral \
            action_required stale; do
            made=()
            case $status in
              requested|queued|pending|waiting|in_progress) ;;
              *) made=(-f "created=>=$from") ;;
            esac
            # Before the runs of each page, "= <total_count> <runs on the page>".
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            out=$(gh api --method GET --paginate "repos/$REPO/actions/workflows/review.yml/runs" \
              -f status="$status" "${made[@]}" -F per_page=100 \
              --jq '"= \(.total_count // (.workflow_runs | length)) \(.workflow_runs | length)", (.workflow_runs[]
                | select((.id | tostring) != $ENV.RUN_ID
                         and (.event == "workflow_run" or .event == "issues" or .event == "issue_comment"
                              or .event == "workflow_dispatch") and .conclusion != "skipped"
                         and (.status != "completed" or .updated_at == null
                              or (.updated_at | fromdateiso8601) >= ($ENV.SINCE | tonumber)))
                | "\(.id) \(.run_started_at // .created_at)")') \
              || stop "the runs could not be read."
            # GitHub runs this step with bash -e: the status of awk is read with ||, so that a cut list does not end it.
            whole=0
            rows=$(awk '$1 == "=" { if ($2 > total) total = $2; listed += $3; next } { rows[++n] = $0 }
              END { if (listed < total) exit 3; for (i = 1; i <= n; i++) print rows[i] }' <<< "$out") || whole=$?
            case $whole in
              0) runs+=$rows$'\n' ;;
              3) cut=$status runs=""; break ;;
              *) stop "the runs could not be read." ;;
            esac
          done
          count=0
          if [ -n "$cut" ]; then
            echo "GitHub lists at most 1,000 runs of this workflow of the status $cut${made[*]:+ made since $from}," \
              "and more of them match. The runs that it does not list can hold reviews of the last hour, so the count" \
              "is the cap."
            count=$CAP
          fi
          declare -A counted=()
          while read -r id started; do
            [ -n "$id" ] || continue
            [[ $id =~ ^[0-9]+$ ]] || stop "a run id is not a number."
            [ -z "${counted[$id]:-}" ] || continue
            counted[$id]=1
            # true on a page of the run's jobs that holds a review job of this pool that counts.
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            found=$(RUN_STARTED=$started gh api --method GET --paginate "repos/$REPO/actions/runs/$id/jobs" \
              -f filter=all -F per_page=100 --jq '
                any(.jobs[]; .name == $ENV.POOL
                  and ((.started_at // $ENV.RUN_STARTED) | fromdateiso8601) >= ($ENV.SINCE | tonumber)
                  and ([(.steps // [])[] | select(.name == "Review" or .name == "Answer" or .name == "Draft")] as $models
                    | ([(.steps // [])[] | select(.name == "Hold at the hourly cap")] | first) as $cap
                    | any($models[]; .status == "in_progress" or (.conclusion != null and .conclusion != "skipped"))
                      or (.status != "completed" and $cap != null and $cap.conclusion == "success")
                      or (.status != "completed" and ($cap == null or $cap.status != "completed")
                          and .run_id < ($ENV.RUN_ID | tonumber))))') || stop "the jobs of run $id could not be read."
            [[ -n $found ]] && ! grep -qvxE 'true|false' <<< "$found" || stop "the jobs of run $id could not be read."
            if grep -qx true <<< "$found"; then count=$((count + 1)); fi
          done <<< "$runs"
          # A failed write would leave the count empty: it stops the run here (the next step refuses an empty count too).
          echo "count=$count" >> "$GITHUB_OUTPUT" || stop "the count could not be written."
          echo "$count reviews ($POOL) called the model, or may, in the last hour."

      # A count that is not a number, or a cap that is not one, lets no model run. It fails here, in a step of its own,
      # so that the hold job reads it as a review that did not finish (a try counts), not as the cap reached.
      - name: Check the count and the cap
        env:
          COUNT: ${{ steps.count.outputs.count }}
          CAP: ${{ needs.trust.outputs.route == 'screen' && env.SCREENED_HOURLY_CAP || env.HOURLY_CAP }}
        run: |
          set -uo pipefail
          [[ $COUNT =~ ^[0-9]+$ && $CAP =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::no count of the hour's reviews ($COUNT) or no cap ($CAP). No model ran."; exit 1; }
          echo "A count of $COUNT against a cap of $CAP."

      # Runs after the two steps above have passed, so it fails only when the count is at the cap: the hold job reads
      # this step's failure as the cap reached.
      - name: Hold at the hourly cap
        env:
          COUNT: ${{ steps.count.outputs.count }}
          POOL: ${{ needs.trust.outputs.route == 'screen' && 'review (screened)' || 'review' }}
          CAP: ${{ needs.trust.outputs.route == 'screen' && env.SCREENED_HOURLY_CAP || env.HOURLY_CAP }}
        run: |
          set -uo pipefail
          if (( COUNT >= CAP )); then
            echo "::error::HELD: $COUNT reviews ($POOL) called the model, or may, in the last hour: the cap is $CAP." \
              "No model ran. A maintainer can re-run this run once the hour has passed."
            exit 1
          fi
          echo "$COUNT reviews ($POOL) in the last hour, under the cap of $CAP."

      # What the gather job kept.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (sha-pinned)
        with: {name: review-data, path: "${{ runner.temp }}/review-data"}
      # The env and the script of the screen job's step of this name (&take-env and &take there).
      - name: Take the gathered pull request or issue
        env: *take-env
        run: *take

      # The source the model describes, for the kernel and QEMU code that comments and issues cite.
      - name: Gather the Linux and QEMU source
        run: |
          set -euo pipefail
          out=.review
          fetch() {
            local dir=$1 url=$2 commit=$3; shift 3
            git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 --filter=blob:none "$url" "$commit"
            git -C "$dir" sparse-checkout set --no-cone "$@"
            git -C "$dir" -c advice.detachedHead=false checkout -q FETCH_HEAD
            rm -rf "$dir/.git"
            find "$dir" \( -iname 'CLAUDE*.md' -o -iname 'AGENTS*.md' -o -iname .claude \) -prune -exec rm -rf {} +
          }
          fetch "$out/linux" "$LINUX_URL" "$LINUX_COMMIT" /mm/ /kernel/ /ipc/ /lib/ /arch/riscv/ /include/ /fs/ /net/ \
            /security/ /init/ /block/ /io_uring/ /drivers/char/ /drivers/tty/
          fetch "$out/qemu" "$QEMU_URL" "$QEMU_COMMIT" /linux-user/ /include/user/ /target/riscv/
          echo "Gathered $(find "$out" -type f | wc -l) files."

      # The Review step's action writes this job's GitHub token into the checkout's git configuration (as the origin
      # URL), and Claude can read every file of the working directory. So git's own directory moves under the runner's
      # temporary directory, which Claude cannot read, and .git becomes a file that names it. git works as before.
      - name: Keep git's configuration out of Claude's reach
        run: |
          set -euo pipefail
          git init -q --separate-git-dir="$RUNNER_TEMP/review-git"
          [ -f .git ] || { echo "::error::.git is still a directory"; exit 1; }

      # The action would download and run Claude Code's installer (curl https://claude.ai/install.sh | bash) and a Bun
      # at run time, unchecked, in a job that holds an identity token. This step downloads the versions that the action
      # at its pinned commit installs, and refuses any file whose SHA-256 is not the one written here. When the action's
      # pin moves, take the new versions from its src/entrypoints/run.ts (claudeCodeVersion) and its action.yml
      # (bun-version), and their digests from https://downloads.claude.ai/claude-code-releases/<version>/manifest.json
      # (platforms.linux-x64.checksum) and from the bun-linux-x64.zip asset of the oven-sh/bun release.
      - name: Download Claude Code and Bun at pinned digests
        env:
          CLAUDE_CODE_VERSION: 2.1.312
          CLAUDE_CODE_SHA256: 4f4178ce41d83e23341ebfbaecdbcf8ea6bf7baea0690025abe49eeec3a5d01d
          BUN_VERSION: 1.4.4
          BUN_SHA256: bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c
        run: |
          set -euo pipefail
          [ "$(uname -sm)" = "Linux x86_64" ] || { echo "::error::the pinned binaries are for Linux on x86-64"; exit 1; }
          dir=$RUNNER_TEMP/review-tools
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/claude" \
            "https://downloads.claude.ai/claude-code-releases/$CLAUDE_CODE_VERSION/linux-x64/claude"
          curl -fsSL --retry 3 -o "$dir/bun.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/bun-linux-x64.zip"
          printf '%s  %s\n' "$CLAUDE_CODE_SHA256" "$dir/claude" "$BUN_SHA256" "$dir/bun.zip" | sha256sum -c --strict
          unzip -q -j "$dir/bun.zip" bun-linux-x64/bun -d "$dir"
          rm "$dir/bun.zip"
          chmod +x "$dir/claude" "$dir/bun"

      # allowed_non_write_users, which a screened item sets, makes the action put /usr/bin and /bin before the pinned
      # Bun on the PATH. So no other Bun may be there.
      - name: No Bun but the pinned one
        run: |
          set -euo pipefail
          for bun in /usr/bin/bun /bin/bun; do
            [ ! -e "$bun" ] || { echo "::error::$bun is on the runner, ahead of the pinned Bun"; exit 1; }
          done

      - name: Review
        id: review
        if: needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen'
        timeout-minutes: 50
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1 (v1.0.264, sha-pinned)
        with:
          # The job's Anthropic ids (ids, not secrets).
          anthropic_federation_rule_id: ${{ env.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ env.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ env.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ env.ANTHROPIC_WORKSPACE_ID }}
          github_token: ${{ github.token }}
          # The action itself refuses a run started by an account without write access (its default), and any App
          # but these, except the account whose pull request or issue the screen passed: this job runs for a
          # screened item only when the screen job's verdict is clean (its if). The rescreen pass's runs are started by
          # github-actions[bot], which it admits for a run by hand alone, and this job runs only when the trust job
          # accepted that run: then the run reviews a screened item whose screen passed, or a writer's item.
          allowed_non_write_users: ${{ needs.trust.outputs.route == 'screen' && needs.trust.outputs.outsider || '' }}
          allowed_bots: >-
            ${{ github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]'
            && format('{0},github-actions[bot]', env.APPS)
            || needs.trust.outputs.route == 'screen' && endsWith(needs.trust.outputs.outsider, '[bot]')
            && format('{0},{1}', env.APPS, needs.trust.outputs.outsider) || env.APPS }}
          path_to_claude_code_executable: ${{ runner.temp }}/review-tools/claude
          path_to_bun_executable: ${{ runner.temp }}/review-tools/bun
          # Claude reads nothing outside the checkout. The runner's temporary files hold the identity token, the
          # exchanged Claude token and git's configuration, and /proc holds the environment: the deny rules name them
          # as well.
          settings: >-
            {"permissions": {"blockReadsOutsideWorkingDirectories": true,
            "deny": ["Read(//home/runner/work/_temp/**)", "Read(//proc/**)"]}}
          # The first two of the three steps of .github/review.md: the repository's rules, and the whole copies of the
          # two skills to write by, with their reference and example files. The third, the fresh reader, is the step
          # after the next. The prompt says whether this review treats the author as an outside author, and why. It is
          # a rule that holds back, so it reads the trust job's kind and outside in the form of rules.py holds_back: an
          # author whose write access GitHub did not say counts as outside, and so does an empty outside. The schema is
          # the same for every item.
          prompt: >-
            Read .github/review.md: it is the rules of this review. Before you write, read the whole of the two skill
            copies that it names, with their reference and example files. These are
            .github/review/skills/asd-ste100/SKILL.md, .github/review/skills/asd-ste100/references/writing-rules.md,
            .github/review/skills/asd-ste100/examples/before-after.md, .github/review/skills/ce-noslop/SKILL.md,
            .github/review/skills/ce-noslop/references/patterns.md and
            .github/review/skills/ce-noslop/references/terminology.md. Review
            ${{ needs.gather.outputs.kind == 'pr' && 'pull request' || 'issue' }} #${{ needs.gather.outputs.number }}
            of this repository as .github/review.md says, from what .review/ holds.
            ${{ needs.trust.outputs.kind == 'unknown' && 'GitHub did not say whether its author has write access to this
            repository. So this review treats its author as an outside author.'
            || needs.trust.outputs.outside == 'false' && 'The workflow does not treat its author as an outside author:
            the author has write access to this repository, or is one of the GitHub Apps that the workflow''s APPS list
            names.' || 'The workflow treats its author as an outside author: the author has no write access to this
            repository, or is a GitHub App that the workflow''s APPS list does not name.' }} Give the comment, the
            verdict, will_fix and the list of items as the structured output (.github/review.md, "What the review
            gives").
          claude_args: >-
            --tools Read,Glob,Grep --permission-mode dontAsk --model claude-opus-5-5 --effort xhigh --max-turns 300
            --json-schema '{"type": "object", "additionalProperties": false,
            "required": ["comment", "verdict", "will_fix", "items"],
            "properties": {"comment": {"type": "string", "description": "The review comment, in Markdown."},
            "verdict": {"type": "string", "enum": ["pass", "blocking", "person"]},
            "will_fix": {"type": "boolean"},
            "items": {"type": "array", "items": {"type": "object", "additionalProperties": false,
            "required": ["kind", "ref", "text", "optional"],
            "properties": {"kind": {"type": "string", "enum": ["change", "question"]},
            "ref": {"type": ["string", "null"]}, "text": {"type": "string"}, "optional": {"type": "boolean"}}}}}}'

      # The answer to the comments of the author of an outside item that wait (.github/review-answer.md, "An answer"):
      # the first two of the three steps, with the rules of the answer and the whole copies of the three skills to
      # write by. The settings are the Review step's: the same tools, the same reach, the same identity. The gather job
      # lists the comments that wait in .review/answer-to.json, and the conversation holds the workflow's newest review
      # and its label comment, which give the next step.
      - name: Answer
        id: answer
        if: needs.trust.outputs.task == 'answer'
        timeout-minutes: 30
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1 (v1.0.264, sha-pinned)
        with:
          anthropic_federation_rule_id: ${{ env.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ env.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ env.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ env.ANTHROPIC_WORKSPACE_ID }}
          github_token: ${{ github.token }}
          allowed_non_write_users: ${{ needs.trust.outputs.route == 'screen' && needs.trust.outputs.outsider || '' }}
          allowed_bots: >-
            ${{ github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]'
            && format('{0},github-actions[bot]', env.APPS)
            || needs.trust.outputs.route == 'screen' && endsWith(needs.trust.outputs.outsider, '[bot]')
            && format('{0},{1}', env.APPS, needs.trust.outputs.outsider) || env.APPS }}
          path_to_claude_code_executable: ${{ runner.temp }}/review-tools/claude
          path_to_bun_executable: ${{ runner.temp }}/review-tools/bun
          settings: >-
            {"permissions": {"blockReadsOutsideWorkingDirectories": true,
            "deny": ["Read(//home/runner/work/_temp/**)", "Read(//proc/**)"]}}
          prompt: >-
            Read .github/review-answer.md: it is the rules of this answer. Read .github/review.md, which it names.
            Before you write, read the whole of the three skill copies that it names, with their reference and example
            files. These are .github/review/skills/write-to-maintainer/SKILL.md,
            .github/review/skills/write-to-maintainer/judge.md, .github/review/skills/asd-ste100/SKILL.md,
            .github/review/skills/asd-ste100/references/writing-rules.md,
            .github/review/skills/asd-ste100/examples/before-after.md, .github/review/skills/ce-noslop/SKILL.md,
            .github/review/skills/ce-noslop/references/patterns.md and
            .github/review/skills/ce-noslop/references/terminology.md. The author of
            ${{ needs.gather.outputs.kind == 'pr' && 'pull request' || 'issue' }} #${{ needs.gather.outputs.number }}
            of this repository wrote the comments in .review/answer-to.json, the newest last, and they wait for an
            answer. Answer them in one text, as .github/review-answer.md says ("An answer"), from what .review/
            holds. The conversation in .review/${{ needs.gather.outputs.kind == 'pr' && 'pr' || 'issue' }}.json
            holds the newest review of the workflow and its label comment, which give the next step. Give action,
            will_fix and the text as the structured output.
          claude_args: >-
            --tools Read,Glob,Grep --permission-mode dontAsk --model claude-opus-5-5 --effort xhigh --max-turns 200
            --json-schema '{"type": "object", "additionalProperties": false,
            "required": ["action", "will_fix", "text"],
            "properties": {"action": {"type": "string", "enum": ["answer", "fix", "none"]},
            "will_fix": {"type": "boolean"},
            "text": {"type": "string", "description": "The answer, in Markdown."}}}'

      # The draft of the reply to a new issue of an outside author (.github/review-answer.md, "An issue draft"): the
      # first two of the three steps, with the rules of the draft and the whole copies of the three skills to write
      # by. The settings are the Answer step's: the same tools, the same reach, the same identity. The draft leaves
      # this job only as its artifact (below): the action writes no report to the run's summary and no output of Claude
      # to this log (display_report and show_full_output, each set to "false" here).
      - name: Draft
        id: draft
        if: needs.trust.outputs.task == 'draft'
        timeout-minutes: 30
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1 (v1.0.264, sha-pinned)
        with:
          anthropic_federation_rule_id: ${{ env.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ env.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ env.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ env.ANTHROPIC_WORKSPACE_ID }}
          github_token: ${{ github.token }}
          allowed_non_write_users: ${{ needs.trust.outputs.route == 'screen' && needs.trust.outputs.outsider || '' }}
          allowed_bots: >-
            ${{ github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]'
            && format('{0},github-actions[bot]', env.APPS)
            || needs.trust.outputs.route == 'screen' && endsWith(needs.trust.outputs.outsider, '[bot]')
            && format('{0},{1}', env.APPS, needs.trust.outputs.outsider) || env.APPS }}
          path_to_claude_code_executable: ${{ runner.temp }}/review-tools/claude
          path_to_bun_executable: ${{ runner.temp }}/review-tools/bun
          display_report: "false"
          show_full_output: "false"
          settings: >-
            {"permissions": {"blockReadsOutsideWorkingDirectories": true,
            "deny": ["Read(//home/runner/work/_temp/**)", "Read(//proc/**)"]}}
          prompt: >-
            Read .github/review-answer.md: it is the rules of this draft. Read .github/review.md, which it names.
            Before you write, read the whole of the three skill copies that it names, with their reference and example
            files. These are .github/review/skills/write-to-maintainer/SKILL.md,
            .github/review/skills/write-to-maintainer/judge.md, .github/review/skills/asd-ste100/SKILL.md,
            .github/review/skills/asd-ste100/references/writing-rules.md,
            .github/review/skills/asd-ste100/examples/before-after.md, .github/review/skills/ce-noslop/SKILL.md,
            .github/review/skills/ce-noslop/references/patterns.md and
            .github/review/skills/ce-noslop/references/terminology.md. Write the reply to issue
            #${{ needs.gather.outputs.number }} of this repository, as .github/review-answer.md says ("An issue
            draft"), from what .review/ holds: the issue and its comments are in .review/issue.json. Give the text of
            the reply as the structured output.
          claude_args: >-
            --tools Read,Glob,Grep --permission-mode dontAsk --model claude-opus-5-5 --effort xhigh --max-turns 200
            --json-schema '{"type": "object", "additionalProperties": false, "required": ["text"],
            "properties": {"text": {"type": "string", "description": "The reply, in Markdown."}}}'

      # The fresh reader's token (.github/review/trim.py sign-in): Anthropic exchanges a new identity token of this
      # job with the Review step's federation rule, organization, service account and workspace. The token goes to a
      # file in the runner's temporary directory that only the runner's account can read, and that the step that runs
      # the reader (the comment, the answer or the draft) reads and deletes. It never goes to this log or an output.
      # Claude has finished before this step. When the exchange fails, the job fails here. The model ran, so the run
      # counts a try (held.sh try_rule). After a screen, the hold job holds the item as work that did not finish.
      - name: Sign in to Anthropic for the fresh reader
        run: python3 .github/review/trim.py sign-in

      # The third of the three steps of .github/review.md, and the comment as it is posted. The model gives its
      # comment, its verdict, will_fix and its list. First comes the soundness rule of R8, whatever the model wrote
      # (.github/review/rules.py soundness): while SOUNDNESS_HOLD is true, the review of a pull request whose author the
      # rule treats as outside (rules.py holds_back, from the trust job's outside and kind: also an author whose write
      # access GitHub did not say) that can change a proof gets the verdict person, a question on soundness in its list
      # when the list has none, and the section on soundness. The gather job's soundness.json says which changed paths
      # count (a .v file, any other file that is not a Markdown file, or a Markdown file that a dune, dune-project or
      # dune-workspace* file of the head or of main makes count, by the rule of .github/review.md), from every page of
      # the pull request's files. A list that is not whole counts as such a change too, and a dune file that the job
      # could not read (unparsed) makes each changed Markdown file count. The section lists, as facts, the rule with
      # those files but the .v files, the files that the job could not read, the lines of the changed .v files at
      # the head that use the VM, the native compiler or a primitive array, and each changed .v file at the head that
      # the gather job did not keep whole. Then comes the rule of the verdict blocking (.github/review/rules.py
      # blocking): a review whose verdict is blocking, and whose list holds a question item and no blocking finding (a
      # change item whose optional is false), gets the verdict person. So an outside pull request waits on Sami, not on
      # its author, and no fix runs. The posted result line takes the form of the verdict after both rules (trim.py's
      # with_result): for person, "Questions for Sami:" with one bullet for each question whose text the trimmed text
      # does not hold. The trimmed text loses the model's "No blocking finding.", and loses its "Blocking findings."
      # only when the list holds no blocking finding: else that line and its findings stay below the questions. A bare
      # "Questions for Sami:" that the reader dropped, with no question item, goes back with a pointer to the collapsed
      # copy of the review. A verdict blocking whose list holds no question stays blocking.
      # .github/review/trim.py makes the comment unable to notify anyone, to link another issue or pull request, or to
      # link or load anything outside github.com (trim.py's inert), cuts it at 20,000 characters, and closes what it
      # leaves open (trim.py's closed). Then it runs the fresh reader: one request to Claude, with no tools, that holds
      # the reader's instruction, the list and that text alone, with the token of the step before. A reader that fails
      # fails this job, so nothing posts untrimmed: a screened item is held as a review that did not finish, and is
      # tried again. A reader that refuses the review (trim.py's status 3) gives the output refused=review and no
      # comment or verdict: nothing of the review posts, no fix runs, no import check run is recorded, and the comment
      # job gives the item waits-on-theorem with Sami's next step. The run's summary then gets the reader's reason
      # alone, for Sami, and neither this log nor an output holds it. The comment: the header and its markers, the
      # trimmed text, the section on soundness, each listed item that the trimmed text lacks, the footer, and the text
      # that the reader read in a collapsed block. The model writes none of the fixed parts, and the reader never sees
      # them. The trimmed text and each added item are made inert and closed too: no text of the model or the reader
      # leaves a fenced code block, an HTML block or a <details> open for the fixed part after it, and none closes the
      # collapsed block. The header's marker <!-- review-read <time> --> gives the time when the trust job of this run
      # decided it, before the gather job read the conversation: a comment of the author made after that time is one
      # that this review did not read, and it still waits for its answer (the trust job's waiting). The header of a
      # pull request's review holds the marker <!-- review-screened <head> --> after its verdict only when the route
      # of this run was screen and the screen passed the head (R12): a relabel records the import check run only for a
      # head whose review holds it. A review whose route was review (a writer's item, or a writer's run by hand with no
      # screen) holds none. The header's last marker, <!-- review-run <run> -->, gives the id of this run
      # (GITHUB_RUN_ID). Each reader of the import check counts this review from the time of the marker
      # <!-- review-read <time> -->, never from when it posts (.github/review/rules.py word_time; OSSV-221's architect,
      # 2026-11-24 01:20Z). The line of a withdrawal that this run owes for its verdict goes once this review stands,
      # and a review whose run read the item after the time of a line can take that line out: the time of the hold or
      # the withdrawal of the run that the line names, or else when the step of that run that wrote the line ended
      # (.github/review/rules.py owed).
      # The run's summary gets the text that the reader read, the list, and the section on soundness with every line.
      # For a review, every step after this one belongs to the fix. So when this step gave a blocking finding or the
      # verdict person and the job then failed or was cancelled, this text is final: the comment job posts it as for a
      # review that succeeded, with no fix, while the pull request is still at its head (OSSV-221's architect,
      # 2026-11-22 10:46Z). After a pass, such a run posts nothing, and after a screen the hold job holds it.
      - name: The comment, as it is posted
        id: result
        if: needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen'
        env:
          RESULT: ${{ steps.review.outputs.execution_file }}
          RULES: ${{ github.server_url }}/${{ github.repository }}/blob/main/.github/review.md
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The trust job's outputs as they are: rules.py soundness reads both (holds_back).
          OUTSIDE: ${{ needs.trust.outputs.outside }}
          AUTHOR_KIND: ${{ needs.trust.outputs.kind }}
          STARTED: ${{ needs.trust.outputs.started }}
          ROUTE: ${{ needs.trust.outputs.route }}
          SCREENED: ${{ needs.screen.outputs.verdict }}
        run: |
          set -euo pipefail
          # trim.py deletes the token's file as it reads it. This deletes it too when trim.py does not run.
          trap 'rm -f -- "$RUNNER_TEMP/reader-token"' EXIT
          [[ $STARTED =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
            || { echo "::error::no start time of this run. Nothing posts."; exit 1; }
          [[ ${GITHUB_RUN_ID:-} =~ ^[1-9][0-9]*$ ]] || { echo "::error::no id of this run. Nothing posts."; exit 1; }
          work=$RUNNER_TEMP/comment
          mkdir -p "$work"
          jq -e 'map(select(.type == "result")) | last | .structured_output
            | select(type == "object" and (.comment | type) == "string" and (.verdict | IN("pass", "blocking", "person"))
                     and (.will_fix | type) == "boolean" and (.items | type) == "array")' "$RESULT" > "$work/output.json" \
            || { echo "::error::The review gave no comment, verdict, will_fix and list. Nothing posts."; exit 1; }
          python3 .github/review/rules.py soundness .review "$work/output.json" "${SOUNDNESS_HOLD:-}" "$OUTSIDE" \
            "${AUTHOR_KIND:-}" "$work/section.md" "$work/section-all.md"
          python3 .github/review/rules.py blocking "$work/output.json"
          jq -j .comment "$work/output.json" > "$work/review.md"
          jq .items "$work/output.json" > "$work/items.json"
          verdict=$(jq -r .verdict "$work/output.json")
          will_fix=$(jq -r .will_fix "$work/output.json")
          what="this issue" markers=""
          if [ -f .review/commits.txt ]; then
            head=$(sed -n 's/^head //p' .review/commits.txt)
            [[ $head =~ ^[0-9a-f]{40}$ ]] || { echo "::error::.review/commits.txt names no head commit."; exit 1; }
            what="commit ${head:0:12}"
            fix=""
            [ "$will_fix" = false ] || fix=" will-fix"
            markers=$'\n'"<!-- review-head $head -->"$'\n'"<!-- review-verdict $head $verdict$fix -->"
            if [ "${ROUTE:-}" = screen ] && [ "${SCREENED:-}" = clean ]; then
              markers+=$'\n'"<!-- review-screened $head -->"
            fi
            echo "head=$head" >> "$GITHUB_OUTPUT"
          fi
          markers+=$'\n'"<!-- review-read $STARTED -->"$'\n'"<!-- review-run $GITHUB_RUN_ID -->"
          printf '%s%s\n%s\n' '<!-- review -->' "$markers" "**Automated review** of $what" > "$work/head.md"
          printf '%s\n' "Claude wrote this review with [these rules]($RULES), in [this workflow run]($RUN)." \
            > "$work/foot.md"
          rc=0
          python3 .github/review/trim.py review --review "$work/review.md" --items "$work/items.json" \
            --verdict "$verdict" --head "$work/head.md" --section "$work/section.md" --foot "$work/foot.md" \
            --summary "$GITHUB_STEP_SUMMARY" --summary-extra "$work/section-all.md" > "$work/body.md" || rc=$?
          if (( rc == 3 )); then
            echo "refused=review" >> "$GITHUB_OUTPUT"
            echo "The fresh reader refused the review. Nothing of it posts: Sami writes the review by hand."
            exit 0
          fi
          (( rc == 0 )) || { echo "::error::The fresh reader gave no trimmed text. Nothing posts."; exit 1; }
          { echo "verdict=$verdict"; echo "will_fix=$will_fix"; } >> "$GITHUB_OUTPUT"
          delimiter="body_$(openssl rand -hex 16)"
          { echo "body<<$delimiter"; cat "$work/body.md"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

      # The third of the three steps for an answer, and the answer as it is posted: one request to the fresh reader
      # (trim.py answer), with the token of the sign-in step. A reader that fails fails this job, so nothing posts
      # untrimmed. A reader that refuses the answer (trim.py's status 3) gives the output refused=answer, and no answer,
      # action or will_fix: nothing of the answer posts, no fix runs, and the comment job gives the item
      # waits-on-theorem with Sami's next step. The run's summary gets the reader's reason alone, for Sami, and neither
      # this log nor an output holds it. The answer: its marker, which names the newest comment that it answers (and,
      # when the author said they will make the change, will-fix and the head), a fixed line, the trimmed text made
      # inert and closed (trim.py's closed), and the footer. An action of none posts nothing.
      - name: The answer, as it is posted
        id: answered
        if: needs.trust.outputs.task == 'answer'
        env:
          RESULT: ${{ steps.answer.outputs.execution_file }}
          RULES: ${{ github.server_url }}/${{ github.repository }}/blob/main/.github/review-answer.md
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # trim.py deletes the token's file as it reads it. This deletes it too when trim.py does not run.
          trap 'rm -f -- "$RUNNER_TEMP/reader-token"' EXIT
          work=$RUNNER_TEMP/answer
          mkdir -p "$work"
          jq -e 'map(select(.type == "result")) | last | .structured_output
            | select(type == "object" and (.action | IN("answer", "fix", "none")) and (.will_fix | type) == "boolean"
                     and (.text | type) == "string")' "$RESULT" > "$work/output.json" \
            || { echo "::error::The answer gave no action, will_fix and text. Nothing posts."; exit 1; }
          action=$(jq -r .action "$work/output.json")
          will_fix=$(jq -r .will_fix "$work/output.json")
          head=""
          if [ -f .review/commits.txt ]; then
            head=$(sed -n 's/^head //p' .review/commits.txt)
            [[ $head =~ ^[0-9a-f]{40}$ ]] || { echo "::error::.review/commits.txt names no head commit."; exit 1; }
            echo "head=$head" >> "$GITHUB_OUTPUT"
          fi
          newest=$(jq -r 'last | .id // empty' .review/answer-to.json)
          [[ $newest =~ ^[1-9][0-9]*$ ]] \
            || { echo "::error::.review/answer-to.json names no comment that waits for an answer. Nothing posts."; exit 1; }
          if [ "$action" = none ]; then
            { echo "action=$action"; echo "will_fix=$will_fix"; } >> "$GITHUB_OUTPUT"
            echo "The comments up to $newest ask nothing and change no next step: no answer posts."
            exit 0
          fi
          jq -j .text "$work/output.json" > "$work/answer.md"
          said=""
          if [ "$will_fix" = true ] && [ -n "$head" ]; then said=" will-fix $head"; fi
          printf '%s\n%s\n' "<!-- review-answer $newest$said -->" "**Automated answer**" > "$work/head.md"
          printf '%s\n' "Claude wrote this answer with [these rules]($RULES), in [this workflow run]($RUN)." \
            > "$work/foot.md"
          rc=0
          python3 .github/review/trim.py answer --text "$work/answer.md" --head "$work/head.md" --foot "$work/foot.md" \
            --summary "$GITHUB_STEP_SUMMARY" > "$work/body.md" || rc=$?
          if (( rc == 3 )); then
            echo "refused=answer" >> "$GITHUB_OUTPUT"
            echo "The fresh reader refused the answer. Nothing of it posts, and no fix runs: Sami answers the comment by hand."
            exit 0
          fi
          (( rc == 0 )) || { echo "::error::The fresh reader gave no trimmed text. Nothing posts."; exit 1; }
          { echo "action=$action"; echo "will_fix=$will_fix"; } >> "$GITHUB_OUTPUT"
          delimiter="body_$(openssl rand -hex 16)"
          { echo "body<<$delimiter"; cat "$work/body.md"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

      # The third of the three steps for the draft: one request to the fresh reader (trim.py draft), with the token of
      # the sign-in step, that holds the rules of the draft (.github/review-answer.md and the write-to-maintainer copy)
      # beside the draft. The reader trims the draft, or refuses it and gives its reason. Then the one file that the
      # next step uploads as the artifact of this run, issue-draft.txt, in the one form that the OSSV controller reads
      # on each repository that it watches: the lines issue: <issue> and run: <run id>, a line reason: <the reader's
      # reason, on one line> for a refused draft alone, a line ---, and then the draft as the reader trimmed it, or a
      # refused draft as the model wrote it. Sami reads it in a terminal, and the author of an issue can steer the
      # model's text, so every control character but tab and newline, and every bidirectional-text control, is taken out
      # of the file. No output, summary or log line of this job holds the draft, the refused draft or the reason: the
      # summary names the artifact alone. A reader that fails fails this job, so nothing is uploaded: a screened issue
      # is held as a review that did not finish, and tried again. The output draft, <run>-<attempt>, names the run of
      # the artifact for the label comment.
      - name: The draft, as the fresh reader leaves it
        id: drafted
        if: needs.trust.outputs.task == 'draft'
        env:
          RESULT: ${{ steps.draft.outputs.execution_file }}
          NUMBER: ${{ needs.trust.outputs.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # trim.py deletes the token's file as it reads it. This deletes it too when trim.py does not run.
          trap 'rm -f -- "$RUNNER_TEMP/reader-token"' EXIT
          [[ $NUMBER =~ ^[1-9][0-9]*$ && $RUN_ID =~ ^[1-9][0-9]*$ && $RUN_ATTEMPT =~ ^[1-9][0-9]*$ ]] \
            || { echo "::error::no issue number, run id or attempt. Nothing is uploaded."; exit 1; }
          work=$RUNNER_TEMP/draft kept=$RUNNER_TEMP/issue-draft
          mkdir -p "$work" "$kept"
          jq -j -e 'map(select(.type == "result")) | last | .structured_output
            | select(type == "object" and (.text | type) == "string") | .text' "$RESULT" > "$work/draft.md" \
            || { echo "::error::The draft gave no text. Nothing is uploaded."; exit 1; }
          # strip: standard input with the characters that the file below never holds taken out: the C0 controls but
          # tab and newline, DEL, the C1 controls, and the bidirectional-text controls U+061C, U+200E, U+200F, U+202A
          # to U+202E and U+2066 to U+2069.
          strip='import re, sys; sys.stdout.buffer.write(re.sub("[\x00-\x08\x0b-\x1f\x7f-\x9f\u061c\u200e\u200f\u202a-\u202e\u2066-\u2069]", "", sys.stdin.buffer.read().decode()).encode())'
          # The OSSV controller refuses a draft that is empty or white space alone. So a draft that is empty or white
          # space alone after strip (as Python's str.strip reads white space, a no-break space too) goes to no reader
          # and to no file. After its line ---, the file holds this draft after strip when the reader refused it, else
          # the reader's trim, which holds a word (trim.py read): strip takes out no word.
          python3 -c "$strip" < "$work/draft.md" \
            | python3 -c 'import sys; sys.exit(not sys.stdin.buffer.read().decode().strip())' \
            || { echo "::error::The draft has no word in it. Nothing is uploaded."; exit 1; }
          python3 .github/review/trim.py draft --text "$work/draft.md" --rules .github/review-answer.md \
            --rules .github/review/skills/write-to-maintainer/SKILL.md > "$work/read.json" \
            || { echo "::error::The fresh reader gave no answer for the draft. Nothing is uploaded."; exit 1; }
          refused=$(jq -r .refused "$work/read.json")
          if [ "$refused" = true ]; then
            cp "$work/draft.md" "$work/text"
            told="The fresh reader refused the draft of the reply to issue #$NUMBER. The artifact issue-draft-$NUMBER of this run holds the draft and the reason of the reader. No job posts them."
          else
            jq -j .text "$work/read.json" > "$work/text"
            told="The artifact issue-draft-$NUMBER of this run holds the draft of the reply to issue #$NUMBER. No job posts it: Sami approves the text of a reply first."
          fi
          { printf 'issue: %s\nrun: %s\n' "$NUMBER" "$RUN_ID"
            if [ "$refused" = true ]; then jq -j '"reason: \(.reason | gsub("\\s+"; " "))\n"' "$work/read.json"; fi
            printf -- '---\n'
            cat "$work/text"; } | python3 -c "$strip" > "$kept/issue-draft.txt"
          echo "The fresh reader read the draft. The next step uploads it as the artifact issue-draft-$NUMBER."
          printf '%s\n' "$told" >> "$GITHUB_STEP_SUMMARY"
          echo "draft=$RUN_ID-$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      # The draft's file, as the artifact issue-draft-<issue> of this run. The OSSV controller lists the artifacts of
      # that name with its own read-only token and copies the newest into its ask to Sami: Sami chose an artifact over
      # a private store (dispatch://INFRA-3395/ask/5d55f3cb-5359-4b52-af6e-85231a37ccf7). Anyone who can read this
      # repository can read the artifact: the draft is made only from the public issue and the public rules files, and
      # it posts only after Sami approves its text. GitHub keeps it 90 days, the longest it keeps an artifact of a public
      # repository (or less, when the repository's setting is shorter), as a draft can wait weeks for Sami. A new
      # attempt of the run replaces the artifact of the attempt before it (overwrite).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (sha-pinned)
        if: needs.trust.outputs.task == 'draft'
        with: {name: "issue-draft-${{ needs.trust.outputs.number }}", path: "${{ runner.temp }}/issue-draft", if-no-files-found: error, retention-days: 90, overwrite: true}

      # Whether the fix runs (.github/review-answer.md, "The fix"): for the verdict blocking of the review, after the
      # soundness rule and the rule of the verdict blocking, or for an answer whose action is fix, of an outside pull
      # request. The two stops: no fix runs when the author said they will make the change (the will_fix of the review
      # or of the answer, or for a review an earlier answer at this head whose marker says will-fix), nor when 2 fix
      # reviews since the author's last own push did not make the review pass (rules.py fixes, from the head's history
      # and the pull request's reviews, as the API gives them). The outputs will_fix and fix_stop give the comment job
      # the facts of the state label. When the fix runs, this step writes what it is for into .review/fix.json, which
      # the Fix step reads: the review's output, or the comments of the author and the answer. A draft has no fix, and
      # neither has a review or an answer that the fresh reader refused: it gives no verdict and no action.
      - name: Whether a fix runs
        id: fixable
        if: needs.trust.outputs.task != 'draft'
        env:
          TASK: ${{ needs.trust.outputs.task }}
          OUTSIDE: ${{ needs.trust.outputs.outside }}
          KIND: ${{ needs.gather.outputs.kind }}
          NUMBER: ${{ needs.gather.outputs.number }}
          VERDICT: ${{ steps.result.outputs.verdict }}
          REVIEW_WILL_FIX: ${{ steps.result.outputs.will_fix }}
          ACTION: ${{ steps.answered.outputs.action }}
          ANSWER_WILL_FIX: ${{ steps.answered.outputs.will_fix }}
        run: |
          set -euo pipefail
          will_fix=false asked=false
          if [ "$TASK" = answer ]; then
            # The author of an issue makes no change that a review asks for.
            [ "$ANSWER_WILL_FIX" != true ] || [ "$KIND" != pr ] || will_fix=true
            [ "$ACTION" != fix ] || asked=true
          else
            [ "$REVIEW_WILL_FIX" != true ] || will_fix=true
            [ "$VERDICT" != blocking ] || asked=true
          fi
          # outcome <fix_stop> <fix>: the outputs, and the end of this step.
          outcome() {
            { echo "will_fix=$will_fix"; echo "fix_stop=$1"; echo "fix=$2"; } >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$asked" = false ]; then
            echo "No fix: the review gives no blocking finding, or the answer asks for no fix."
            outcome false false
          fi
          if [ "$KIND" != pr ] || [ "$OUTSIDE" != true ]; then
            echo "No fix: only an outside pull request gets one."
            outcome false false
          fi
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          head=$(sed -n 's/^head //p' .review/commits.txt)
          [[ $head =~ ^[0-9a-f]{40}$ ]] || { echo "::error::.review/commits.txt names no head commit."; exit 1; }
          if [ "$TASK" != answer ] && [ "$will_fix" = false ]; then
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            said=$(HEAD=$head gh api --paginate "repos/$REPO/issues/$NUMBER/comments" --jq '[.[]
              | select(.user.login == "github-actions[bot]"
                       and ((.body // "") | test("^<!-- review-answer [0-9]+ will-fix " + $ENV.HEAD + " -->(\n|$)")))]
              | length' | awk '{ n += $1 } END { print n + 0 }') \
              || { echo "::error::the comments of #$NUMBER could not be read."; exit 1; }
            (( said == 0 )) || will_fix=true
          fi
          if [ "$will_fix" = true ]; then
            echo "No fix: the author wrote that they will make the change."
            outcome false false
          fi
          work=$RUNNER_TEMP/fixable
          mkdir -p "$work"
          gh api "repos/$REPO/commits?sha=$head&per_page=100" --jq '.[] | @json' > "$work/commits.jsonl" \
            || { echo "::error::the commits of $head could not be read."; exit 1; }
          gh api --paginate "repos/$REPO/pulls/$NUMBER/reviews" --jq '.[] | @json' > "$work/reviews.jsonl" \
            || { echo "::error::the reviews of #$NUMBER could not be read."; exit 1; }
          count=$(python3 .github/review/rules.py fixes "$work/commits.jsonl" "$work/reviews.jsonl" "$head") \
            || { echo "::error::the fix reviews since the author's last own push could not be counted."; exit 1; }
          if (( count >= 2 )); then
            echo "No fix: $count fix reviews since the author's last own push, and the review still gives a blocking finding."
            outcome true false
          fi
          if [ "$TASK" = answer ]; then
            jq --slurpfile comments .review/answer-to.json '{for: "answer", comments: $comments[0], answer: .text}' \
              "$RUNNER_TEMP/answer/output.json" > .review/fix.json
          else
            jq '{for: "review", review: .}' "$RUNNER_TEMP/comment/output.json" > .review/fix.json
          fi
          echo "A fix runs: $count fix reviews since the author's last own push."
          outcome false true

      # The fix, as suggested changes (.github/review-answer.md, "The fix"): the first two of the three steps, with the
      # settings of the Review step and the whole copies of the three skills to write by. Claude writes no file and
      # runs nothing: it gives the summary and the suggestions, and the next steps post them as a review.
      - name: Fix
        id: fix
        if: steps.fixable.outputs.fix == 'true'
        timeout-minutes: 30
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1 (v1.0.264, sha-pinned)
        with:
          anthropic_federation_rule_id: ${{ env.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ env.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ env.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ env.ANTHROPIC_WORKSPACE_ID }}
          github_token: ${{ github.token }}
          allowed_non_write_users: ${{ needs.trust.outputs.route == 'screen' && needs.trust.outputs.outsider || '' }}
          allowed_bots: >-
            ${{ github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]'
            && format('{0},github-actions[bot]', env.APPS)
            || needs.trust.outputs.route == 'screen' && endsWith(needs.trust.outputs.outsider, '[bot]')
            && format('{0},{1}', env.APPS, needs.trust.outputs.outsider) || env.APPS }}
          path_to_claude_code_executable: ${{ runner.temp }}/review-tools/claude
          path_to_bun_executable: ${{ runner.temp }}/review-tools/bun
          settings: >-
            {"permissions": {"blockReadsOutsideWorkingDirectories": true,
            "deny": ["Read(//home/runner/work/_temp/**)", "Read(//proc/**)"]}}
          prompt: >-
            Read .github/review-answer.md: it is the rules of this fix. Read .github/review.md, which it names. Before
            you write, read the whole of the three skill copies that it names, with their reference and example files.
            These are .github/review/skills/write-to-maintainer/SKILL.md,
            .github/review/skills/write-to-maintainer/judge.md, .github/review/skills/asd-ste100/SKILL.md,
            .github/review/skills/asd-ste100/references/writing-rules.md,
            .github/review/skills/asd-ste100/examples/before-after.md, .github/review/skills/ce-noslop/SKILL.md,
            .github/review/skills/ce-noslop/references/patterns.md and
            .github/review/skills/ce-noslop/references/terminology.md. Write the fix of pull request
            #${{ needs.gather.outputs.number }} of this repository that .review/fix.json asks for, as
            .github/review-answer.md says ("The fix"), from what .review/ holds: suggested changes on the right-side
            lines of .review/pr.diff, numbered as in the files under .review/head/. Give the summary and the
            suggestions as the structured output.
          claude_args: >-
            --tools Read,Glob,Grep --permission-mode dontAsk --model claude-opus-5-5 --effort xhigh --max-turns 200
            --json-schema '{"type": "object", "additionalProperties": false,
            "required": ["summary", "suggestions"],
            "properties": {"summary": {"type": "string"},
            "suggestions": {"type": "array", "items": {"type": "object", "additionalProperties": false,
            "required": ["path", "start_line", "line", "replacement", "why"],
            "properties": {"path": {"type": "string"}, "start_line": {"type": "integer"}, "line": {"type": "integer"},
            "replacement": {"type": "string"}, "why": {"type": "string"}}}}}}'

      # A new token for the fresh reader of the fix, as "Sign in to Anthropic for the fresh reader" gets one: the step
      # that made the comment or the answer took that token and deleted its file. When this exchange fails, the job
      # fails here, and the run counts a try (held.sh try_rule). A review gave a blocking finding before this step: the
      # comment job posts that review with no fix, and the post job withdraws the import check runs of the head for it
      # (their ifs). After a screen, the hold job holds an answer that failed here, and no review.
      - name: Sign in to Anthropic for the fresh reader of the fix
        if: steps.fixable.outputs.fix == 'true'
        run: python3 .github/review/trim.py sign-in

      # The fix as it is posted: code keeps only the suggestions whose lines are right-side lines of one hunk of
      # .review/pr.diff, and makes each other one a sentence that names its file and lines, with its why (rules.py
      # suggestions, its key off). The fresh reader trims the summary and the why of each suggestion on the diff, one
      # request each, and never reads a suggestion block, which holds the lines of the fix byte for byte, nor a
      # sentence of off (trim.py fix). The review: its marker (the head), its marker <!-- review-read <time> --> (when
      # the trust job of this run decided it, before the gather job read the conversation, as in the review comment),
      # a fixed line, the trimmed summary, each sentence of off and the footer, and one comment for each suggestion, on
      # the right side of the diff. The trimmed words are made inert and closed (trim.py's closed), so that the
      # summary takes in no sentence of off and no why takes in its suggestion block. The why in a sentence of off is
      # made inert, and the sentence closed. With no suggestion on the diff, no fix posts. A reader that fails fails
      # this job, so nothing posts untrimmed. A reader that refuses the summary or a why (trim.py's status 3) gives the
      # output refused=fix and no review: nothing of the fix posts, and the comment job gives the item waits-on-theorem
      # with Sami's next step. The run's summary gets the reader's reason alone, for Sami, and neither this log nor an
      # output holds it.
      - name: The fix, as it is posted
        id: fixed
        if: steps.fixable.outputs.fix == 'true'
        env:
          RESULT: ${{ steps.fix.outputs.execution_file }}
          RULES: ${{ github.server_url }}/${{ github.repository }}/blob/main/.github/review-answer.md
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STARTED: ${{ needs.trust.outputs.started }}
        run: |
          set -euo pipefail
          # trim.py deletes the token's file as it reads it. This deletes it too when trim.py does not run.
          trap 'rm -f -- "$RUNNER_TEMP/reader-token"' EXIT
          [[ $STARTED =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
            || { echo "::error::no start time of this run. Nothing posts."; exit 1; }
          work=$RUNNER_TEMP/fix
          mkdir -p "$work"
          jq -e 'map(select(.type == "result")) | last | .structured_output
            | select(type == "object" and (.summary | type) == "string" and (.suggestions | type) == "array")' \
            "$RESULT" > "$work/output.json" || { echo "::error::The fix gave no summary and suggestions. Nothing posts."; exit 1; }
          python3 .github/review/rules.py suggestions "$work/output.json" .review/pr.diff > "$work/kept.json" \
            || { echo "::error::The suggestions of the fix are not as .github/review-answer.md gives them. Nothing posts."; exit 1; }
          kept=$(jq '.suggestions | length' "$work/kept.json")
          if (( kept == 0 )); then
            echo "No suggestion of the fix is on the lines of the diff: no fix posts."
            exit 0
          fi
          head=$(sed -n 's/^head //p' .review/commits.txt)
          [[ $head =~ ^[0-9a-f]{40}$ ]] || { echo "::error::.review/commits.txt names no head commit."; exit 1; }
          printf '%s\n%s\n%s\n' "<!-- review-fix $head -->" "<!-- review-read $STARTED -->" \
            "**Automated fix** of commit ${head:0:12}, as suggested changes" > "$work/head.md"
          printf '%s\n' "Claude wrote this fix with [these rules]($RULES), in [this workflow run]($RUN)." \
            > "$work/foot.md"
          rc=0
          python3 .github/review/trim.py fix --fix "$work/kept.json" --commit "$head" --head "$work/head.md" \
            --foot "$work/foot.md" --summary "$GITHUB_STEP_SUMMARY" > "$work/review.json" || rc=$?
          if (( rc == 3 )); then
            echo "refused=fix" >> "$GITHUB_OUTPUT"
            echo "The fresh reader refused the fix. Nothing of it posts: Sami writes the fix by hand."
            exit 0
          fi
          (( rc == 0 )) || { echo "::error::The fresh reader gave no trimmed text. Nothing posts."; exit 1; }
          echo "$kept suggested changes post."
          delimiter="review_$(openssl rand -hex 16)"
          { echo "review<<$delimiter"; cat "$work/review.json"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

  # The OSS Verify App's writes, and nothing else: no comment and no label. In the environment post, which only
  # main's runs reach and which holds the App's key (OSS_VERIFY_APP_PRIVATE_KEY) from the LPS move. Each write
  # comes after a step of its own that mints a token for this repository alone: token A, with checks: write and
  # pull-requests: write, for the import check run of a review or a relabel and for the close and reopen of a
  # catch-up; token B, with actions: write alone, for the approval of a head's held runs, minted only for the task
  # approve when the screen passed, GitHub holds runs of the head that the screen read, and that head changes no file
  # under .github/. Until the LPS move of dispatch://OSSV-321, the environment post of this repository holds no key
  # (R10): while the key is empty (APP_KEY_SET), the job skips the two sign-ins and each step that needs the App or
  # that only finds work for it, ends with success, and says so in its summary. A key that GitHub refuses fails the
  # sign-ins alone. Its own token can only read (actions: read lists a head's held runs, and checks: read the check
  # runs of a head). It holds no identity token and no model. Its first step after the checkout reads the answers of
  # the author-kind table for the task and the trust job's outside (.github/review/rules.py answers), and the steps
  # after it read them. For the review and the relabel of an outside author's pull request, it decides the import
  # check run of R12 on the head (.github/review/rules.py import-check) and records repo-pairs/import-approved, with
  # conclusion success, when the rule holds. When a later review of the head gives a blocking finding or the verdict
  # person (also a review whose job failed or was cancelled after it gave that verdict), or a later screen holds the
  # head, it updates that check run to the conclusion neutral (R12), whoever the author is. For an approval, it reads
  # the files of the head too (.github/review/rules.py steering). It checks out main's .github/ for those, and runs
  # nothing else from it. Its outputs: recorded, true when it recorded that check run at the head; decision, what it
  # decided for that check run: record, or why it records none (.github/review/rules.py DECISIONS); standing, for the
  # decision hand, true when an import check run of the head with conclusion success still stands after this job;
  # caught, the head of a pull request that a catch-up closed and reopened, or only reopened, which the comment job
  # records in the label comment; steering, the head of an approval that changes a file under .github/ or 3,000 files
  # or more, whose runs it does not approve; and no_key, the head of an approval whose held runs it found and did not
  # approve, as the environment post holds no key. The comment job records each of the last two in the label comment.
  # owed and withdrawn tell the comment job, or the hold job for a held screen, which head's withdrawal of import check
  # runs this job owes, and which one it finished, for the marker line <!-- withdraw-owed <head> <why> <run> --> of
  # the label comment, where <run> is the run whose own comment gives the reason. gave_way, the decision held,
  # withdrawn or newer of the own record of a run on the route screen, tells the comment job to post nothing on the
  # item.
  post:
    needs: [trust, gather, screen, review]
    # The review or the rescreen of a pull request whose review succeeded, whoever its author is and whatever the route
    # (a review by hand runs no screen, and its review can withdraw the import check run of the head); a relabel; a
    # catch-up; an approval whose screen passed; and a review, a rescreen or an approval of a pull request whose screen
    # held its head, which only withdraws the import check run of that head. The hold job holds such a head, and holds
    # no key of the App. Also the review or the rescreen of a pull request whose review job failed or was cancelled
    # after it gave a blocking finding or the verdict person (at the fix, say): that verdict judged the head, so this
    # job withdraws the import check runs of the head for it, as for a review that succeeded, and records, approves and
    # decides nothing (OSSV-221's architect, 2026-11-22 06:23Z and 10:46Z). GitHub fills in the outputs of a job that
    # failed or was cancelled, so the verdict and the head are there. GitHub's implicit success() would skip this job
    # when a job it needs was skipped: the gather, screen and review jobs of a relabel or a catch-up, and the review job
    # of an approval or of a held screen.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main'
          && (((needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen')
               && needs.gather.outputs.kind == 'pr'
               && (needs.review.result == 'success'
                   || ((needs.review.result == 'failure' || needs.review.result == 'cancelled')
                       && (needs.review.outputs.verdict == 'blocking' || needs.review.outputs.verdict == 'person'))))
              || ((needs.trust.outputs.task == 'relabel' || needs.trust.outputs.task == 'catchup')
                  && needs.trust.result == 'success')
              || (needs.trust.outputs.task == 'approve' && needs.screen.result == 'success'
                  && needs.screen.outputs.verdict == 'clean')
              || ((needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen'
                   || needs.trust.outputs.task == 'approve')
                  && needs.trust.outputs.route == 'screen' && needs.gather.outputs.kind == 'pr'
                  && needs.screen.result == 'success' && needs.screen.outputs.verdict != 'clean')) }}
    environment: {name: post, deployment: false}
    # One at a time for each item, and none cancelled: GitHub keeps every pending one (queue: max).
    concurrency:
      group: post-${{ needs.trust.outputs.number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {contents: read, pull-requests: read, actions: read, checks: read}
    # Whether the environment post holds the key of the OSS Verify App: true or false, never the key. Each step
    # that needs the App, or that only finds work for it, runs only when it is true (R10).
    env:
      APP_KEY_SET: ${{ secrets.OSS_VERIFY_APP_PRIVATE_KEY != '' && 'true' || 'false' }}
    outputs:
      recorded: ${{ steps.record.outputs.recorded == 'true' && 'true' || 'false' }}
      decision: ${{ steps.decide.outputs.decision }}
      # The value of REPO_PAIRS_IMPORT_PATHS that the decision read, as JSON: its text as a string, or null when it read
      # none. The variable can change between this job and the comment job, which sets the label with this value, so
      # that the label comment records the value that the decision rested on.
      imports: ${{ steps.decide.outputs.imports }}
      # For the decision hand: true when the decision found an import check run of the head with conclusion success,
      # and no later step of this job withdraws one. Else false.
      standing: >-
        ${{ steps.decide.outputs.standing == 'true' && steps.withdraw.outputs.checks == '' && 'true' || 'false' }}
      caught: ${{ steps.catchup.outputs.caught }}
      steering: ${{ steps.held.outputs.steering }}
      no_key: ${{ steps.no_key.outputs.head }}
      # The withdrawal of the import check runs of a head (R12), which the comment job, or the hold job for a held
      # screen, of this run records in the label comment with the run whose own comment gives the reason
      # (.github/review/rules.py owed). owed: "<head> <why>" of a withdrawal that this job found a reason for and did
      # not finish: GitHub refused it, or the job failed before it. withdrawn: the head whose withdrawal this job
      # finished: it found no import check run of the head with conclusion success to withdraw, withdrew each one that
      # it withdraws, or recorded the check run that says that the head is not approved for the import, for its own
      # verdict or screen when no such success stood (OSSV-221's architect, 2026-11-24 05:33Z). A refusal of that check
      # run leaves owed, as a refused withdrawal does.
      # GitHub fills in the outputs of a job at its end, also when it failed, from the outputs of the steps that ran. So
      # each step that finds a reason writes owed before its next command that can fail or that withdraws: the step
      # "Write the output owed for the withdrawal of the import check runs", for the verdict blocking or person of this
      # run's review (also of a review job that failed or was cancelled after it gave that verdict) or for a screen of
      # this run that held the head; the decision step, for a reason that it reads from the comments of the item; and
      # the step that finds the check runs, before it reads them.
      owed: >-
        ${{ steps.withdraw.outputs.clear == '' && steps.withdrawn.outputs.head == '' && steps.neutral.outputs.head == ''
        && (steps.withdraw.outputs.owed || steps.decide.outputs.owed || steps.own.outputs.owed) || '' }}
      withdrawn: ${{ steps.withdraw.outputs.clear || steps.withdrawn.outputs.head || steps.neutral.outputs.head }}
      # The source runs of the withdrawals of the head before this job withdrew any, each with the time from which its
      # withdrawals count (.github/review/rules.py sources): "<run>=<time> ...", or empty. The line
      # <!-- withdraw-owed <head> <why> <run> --> goes for a review comment of the head only when its run read the item
      # after the hold or the withdrawal of <run>, or else after the step of <run> that wrote the line ended. A review
      # with no marker of that read counts from when GitHub last changed it, and a pass with none never counts
      # (.github/review/rules.py line_reason and word_time).
      sources: ${{ steps.withdraw.outputs.sources }}
      # The decision held, withdrawn or newer of the own record of a run on the route screen (screened_run in the
      # decision step): a run that read the item at or after this run held the head, withdrew its import check run, or
      # gave it a verdict. The comment job of this run then posts nothing on the item. Empty for any other decision.
      gave_way: ${{ steps.decide.outputs.gave_way }}
    steps:
      # main's .github/, for .github/review/rules.py; never the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with: {ref: main, persist-credentials: false, sparse-checkout: .github, sparse-checkout-cone-mode: false}
      # The answers of the author-kind table for the task of this run and the trust job's outside alone
      # (.github/review/rules.py answers): approve, record, withdraw and retry, which the steps below read. The step
      # writes and logs only these four. No step of this job reads the answer label: the label steps of the comment and
      # hold jobs decide it, with the trust job's kind. The author is outside when that outside is true, and only then:
      # the trust job's outsider is read for no answer.
      - name: Read the author-kind table
        id: answers
        env:
          TASK: ${{ needs.trust.outputs.task }}
          NUMBER: ${{ needs.trust.outputs.number }}
          OUTSIDE: ${{ needs.trust.outputs.outside }}
          OUTSIDER: ${{ needs.trust.outputs.outsider }}
        run: |
          set -euo pipefail
          answers=$(python3 .github/review/rules.py answers "$TASK" "$OUTSIDE" "$OUTSIDER") \
            || { echo "::error::the author-kind table gives no answers for the task $TASK."; exit 1; }
          answers=$(grep -E '^(approve|record|withdraw|retry)=' <<< "$answers")
          echo "#$NUMBER: the author-kind table gives, for the task $TASK and outside=$OUTSIDE:" \
            "$(tr '\n' ' ' <<< "$answers")"
          printf '%s\n' "$answers" >> "$GITHUB_OUTPUT"
      # The withdrawal that this run's review or screen gives, which the step "Find the import check runs that a later
      # review or screen withdraws" makes: the verdict blocking or person of this run's review, also of a review job
      # that failed or was cancelled after it gave that verdict, or a screen of this run that held the head. The job
      # knows it from its start, so this step writes the output owed, "<head> <why>", before any step that can fail: a
      # later step that fails then leaves that output, and the comment job or the hold job records the line
      # <!-- withdraw-owed <head> <why> <run> -->, with the id of this run. Its if is the if of that step, without the
      # relabel.
      - name: Write the output owed for the withdrawal of the import check runs
        id: own
        if: >-
          env.APP_KEY_SET == 'true' && steps.answers.outputs.withdraw == 'true'
          && (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
          && (((needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen')
               && (needs.review.result == 'success'
                   || ((needs.review.result == 'failure' || needs.review.result == 'cancelled')
                       && (needs.review.outputs.verdict == 'blocking' || needs.review.outputs.verdict == 'person'))
                   || (needs.screen.result == 'success' && needs.screen.outputs.verdict != 'clean')))
              || (needs.trust.outputs.task == 'approve' && needs.screen.result == 'success'
                  && needs.screen.outputs.verdict != 'clean'))
        env:
          TASK: ${{ needs.trust.outputs.task }}
          REVIEWED: ${{ needs.review.result }}
          # The head that the trust job read (of a held screen), and the head that the review read, with its verdict.
          TRUST_HEAD: ${{ needs.trust.outputs.head }}
          REVIEW_HEAD: ${{ needs.review.outputs.head }}
          VERDICT: ${{ needs.review.outputs.verdict }}
        run: |
          set -euo pipefail
          # The review's head and verdict, of a review job that succeeded, or that failed or was cancelled after its
          # verdict (the if); else the screen of this run held the trust job's head.
          head=$REVIEW_HEAD why=$VERDICT gave=review
          if [ "$TASK" = approve ] \
            || { [ "$REVIEWED" != success ] && [ "$REVIEWED" != failure ] && [ "$REVIEWED" != cancelled ]; }; then
            head=$TRUST_HEAD why=screen gave=trust
          fi
          case $why in
            blocking|person|screen) ;;
            *) exit 0 ;;
          esac
          [[ $head =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the $gave job gave no head commit: $head"; exit 1; }
          echo "owed=$head $why" >> "$GITHUB_OUTPUT"
      # The decision of R12 on the import check run at the head, with this job's own token, only on a run of
      # workflow_run or workflow_dispatch: for each review or rescreen whose review succeeded, with the review's verdict
      # after the soundness rule, and for a relabel, which runs no model. The check run is for an outside author's pull
      # request alone (the author-kind table's record): for any other author, the decision is writer, with no read of
      # the files, and the comment job gives the item no outside label (R5). A review or a rescreen records the check
      # run only when the screen of this run passed the head, also in a run by hand that asked for the screen. A
      # relabel takes the verdict from the markers of the newest review comment that names the head, also for another
      # author, as the step that withdraws a check run reads it. A relabel and a review by hand with no screen follow
      # one rule (rules.py verdict; OSSV-221's architect, 2026-11-20 21:33Z and 22:21Z). In that rule a review comment
      # counts from the time when its run read the item, its marker <!-- review-read <time> -->, never from when it
      # posted. One with no such marker counts from when GitHub last changed it for a blocking finding or the verdict
      # person, and at no time for a pass. A hold comment of the screen counts from the time when its run read the item
      # too, its marker <!-- review-held-read <time> -->, and one with no such marker from when GitHub last changed it
      # (rules.py word_time; 2026-11-24 01:20Z and 01:26Z, and 09:43Z, A3). "Newest" and "newer" in this comment are in
      # that order. A relabel records a check run only when the newest review comment of the head is a screened pass: it
      # holds the marker
      # <!-- review-screened <head> -->, and no hold comment of the screen that names the head is newer (screened).
      # It records none either when a withdrawal (conclusion neutral) among the import check runs of the head stands,
      # and no such screened pass is newer than the time from which it counts, which its summary names: for a run's own
      # verdict or screen, when that run read the item (OSSV-221's architect, 2026-11-24 05:23Z); for an older reason,
      # the time when the run that gave it read the item (its review), or of its hold, its withdrawal or its line, or
      # the time of the withdrawal when none was known. The import check runs of the head are in the order of the time
      # that each one names, never of completed_at: for a success, the time when its run read the item, and for a
      # withdrawal, the time from which it counts (2026-11-24 09:43Z). A success that names no time is older than each
      # other one, and a withdrawal that names no time is newer. The withdrawal of the newest read stands when no
      # success names a newer read: at a tie, the withdrawal is the newer. A withdrawal that succeeded is itself the
      # record of its reason, also when the comment of that reason never posted, and one whose summary names no time
      # blocks (2026-11-23 01:47Z and 03:06Z). The decision is then withdrawn (.github/review/rules.py
      # withdrawal_stands). A check run that says that the head is not approved for the import (conclusion neutral,
      # .github/review/rules.py not-approved) counts as a withdrawal by its run from the time when that run read the
      # item: the post job of a run whose own verdict or screen withdraws posts it when the head has no import check run
      # with conclusion success at all (2026-11-24 05:33Z), for an author whom the rules that hold back treat as outside
      # (rules.py holds_back: also an author whose write access GitHub did not say; 2026-11-24 09:28Z). The logs call
      # either form a check run that is not an approval.
      # Each run withdraws each check run of the head that still stands when the newest screened review comment does
      # not pass, or one newer than it gives a blocking finding or the verdict person (output earlier, with that
      # reason). It withdraws also while the label comment holds the line <!-- withdraw-owed <head> <why> <run> --> for
      # the head, for its why, whatever the newest review says: a withdrawal that an earlier run found a reason for and
      # did not finish, or whose reason no comment of the workflow gives yet (.github/review/rules.py owed). A relabel
      # with such a line records no check run. When the newest review comment of the head is then a screened pass and no
      # comment of the workflow gives the reason of the line, the decision is withdrawn, and the label comment says so
      # (.github/review/rules.py NO_REASON). When a hold comment of the screen that names the head is newer than each
      # screened review comment (held), a later screen held the head: the decision is held, so that the label comment
      # says so, and a later step withdraws its check run. A review by hand with no screen (a review or a rescreen whose
      # route is not screen) records no check run, as no screen ran in its run, and keeps its own verdict. It reads the
      # rule for every author, as a relabel does, so that it withdraws for the same reasons.
      # The rule gives its decision only for an outside author. For screened or earlier, its decision is screened when
      # the rule withdraws, and hand when it does not. So is a relabel's in the state earlier with the verdict pass.
      # The comment job replaces the review comment in place, but a review with no screen never replaces a screened
      # review of the same head that gives a blocking finding or the verdict person: it posts a comment of its own. So a
      # review with no screen hides only a screened pass of the same head. An import check run of the head that stands
      # is then the record of that screened pass, as only a screened pass records one. So for an outside author, an
      # unscreened newest pass with no reason to withdraw gives the decision hand while such a check run stands
      # (replaced). Else the decision is screen, and the label comment says that no screen passed the head in a run that
      # also reviewed it. A run whose decision is hand records and withdraws nothing, and reads whether an import check
      # run of the head with the conclusion success, for the value of the variable now, still stands (output standing).
      # The comment job counts such a check run as recorded, unless a later step of this job withdraws it: so the state
      # is import when one stands while the variable is set, and decide when none does. The state of the decision
      # screened follows this run's verdict, and for a pass the label comment says that the screen and the review passed
      # the pull request.
      # When the head is no longer the pull request's, the decision is moved, and the new head waits for a pass of its
      # own. The changed paths come from every page of the files of the pull request at the head, each file's path and
      # the path that it had before a rename, read after the check of the head and before a second check of it. The
      # list stops at 3,000 files: when it does not hold each changed file, no check run is recorded.
      # A run on the route screen whose review passed the head records its own check run only while that pass is the
      # newest word on the head (OSSV-221's architect, 2026-11-23 18:38Z). The post jobs of an item share one group,
      # so this one can run long after its review, behind the post job of a newer run of the same head, and its own
      # review comment posts only after it. A screened pass counts from the time when its run read the item, never from
      # when its comment posted (2026-11-24 01:20Z). So this run reads the comments of the item and the import check
      # runs of the head against the time when its trust job read the item (STARTED): the decision is held when a hold
      # comment of the screen that names the head is at or after that time, withdrawn when a withdrawal among the import
      # check runs of the head stands (in that order) and counts from a time at or after it, and newer when a review
      # comment of the head of another run gives a blocking finding or the verdict person and counts from a time at or
      # after it (.github/review/rules.py own-record and word_time). Each of them records nothing, as the decisions
      # held and withdrawn of a relabel do. The decisions held and newer of such a run withdraw nothing either: the run
      # of the hold or of that review withdraws for its own cause, and a check run that a newer pass recorded after it
      # stays. Each of the three goes to the output gave_way too, and the comment job of such a run posts nothing on the
      # item (OSSV-221's architect, 2026-11-24 01:26Z, (a)). A hold, a withdrawal or a review older than that time
      # leaves the record: a blocking review, then a fix and a screen that passed the head again. When the post job of
      # a newer run whose own verdict or screen withdraws came first and found no import check run with conclusion
      # success, it posted a check run that says that the head is not approved for the import, which counts from the
      # time when that run read the item: this run reads it as a withdrawal, and its decision is withdrawn (2026-11-24
      # 05:33Z). When this run's post job comes first, the newer run's post job withdraws this run's record, as this
      # run read the item before it (2026-11-24 05:23Z).
      - name: Decide the import check of the head
        id: decide
        if: >-
          (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
          && (((needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen')
               && needs.review.result == 'success')
              || needs.trust.outputs.task == 'relabel')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TASK: ${{ needs.trust.outputs.task }}
          NUMBER: ${{ needs.trust.outputs.number }}
          # The author-kind table's answers record and withdraw (the first step of this job), and the route of this run.
          RECORD: ${{ steps.answers.outputs.record }}
          WITHDRAW: ${{ steps.answers.outputs.withdraw }}
          ROUTE: ${{ needs.trust.outputs.route }}
          # The head that the review read, or the head of a relabel, which the trust job read.
          HEAD: ${{ needs.trust.outputs.task == 'relabel' && needs.trust.outputs.head || needs.review.outputs.head }}
          VERDICT: ${{ needs.review.outputs.verdict }}
          # The time when the trust job of this run read the item: the bound of the own record of a run on the route
          # screen (screened_run).
          STARTED: ${{ needs.trust.outputs.started }}
          # The import's paths, one glob on each line, while the import is live (R12). An empty value is no variable:
          # GitHub gives an empty value for a variable that is not set.
          IMPORT_PATHS: ${{ vars.REPO_PAIRS_IMPORT_PATHS }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          [[ $HEAD =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no head commit to decide on: $HEAD"; exit 1; }
          # decided <decision> <what>: the log line of the decision, with <what> as its second sentence (a clause that
          # reads as a sentence when its first letter is upper case), the outputs decision and imports (the value of
          # the variable that it read), and the end of this step.
          decided() {
            echo "#$NUMBER at $HEAD: the import check gets the decision $1. ${2^}."
            echo "decision=$1" >> "$GITHUB_OUTPUT"
            echo "imports=$(jq -acn --arg v "$IMPORT_PATHS" 'if $v == "" then null else $v end')" >> "$GITHUB_OUTPUT"
            exit 0
          }
          # write_owed <why>: the output owed, "<head> <why>", as soon as this step reads from the comments of the item
          # why the import check runs of the head are withdrawn (held, or the why of rules.py verdict): a command after
          # it that fails leaves that output. It writes only while the step that finds the check runs can run
          # (APP_KEY_SET and the table's withdraw), and with the why of that step: screen for held, else the verdict
          # blocking or person of this run's review or of the newest review comment of a relabel (verdict), else <why>.
          write_owed() {
            local why=$1
            if [ "$why" != screen ] && { [ "$verdict" = blocking ] || [ "$verdict" = person ]; }; then why=$verdict; fi
            if [ "$APP_KEY_SET" = true ] && [ "$WITHDRAW" = true ]; then echo "owed=$HEAD $why" >> "$GITHUB_OUTPUT"; fi
          }
          # standing: for the decision hand, the output standing, and stands: true when an import check run of the OSS
          # Verify App with conclusion success, for this pull request (external_id <number>:<head>), stands on the head,
          # and its output text holds the marker line of R12 for the value of the variable now (rules.py
          # import-marker). One that rested on another value does not count. The read asks for every check run of the
          # head (filter=all): by default GitHub lists only the newest of each name, which can hide an older success.
          standing() {
            local found marker values=()
            [ -z "$IMPORT_PATHS" ] || values=("$IMPORT_PATHS")
            marker=$(python3 .github/review/rules.py import-marker "$HEAD" "${values[@]}")
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            found=$(SHA=$HEAD MARKER=$marker gh api --method GET --paginate "repos/$REPO/commits/$HEAD/check-runs" \
              -f check_name=repo-pairs/import-approved -f filter=all -F per_page=100 --jq '.check_runs[]
                | select(.name == "repo-pairs/import-approved" and .head_sha == $ENV.SHA
                         and (.app.id | tostring) == $ENV.OSS_VERIFY_APP_ID
                         and .external_id == "\($ENV.NUMBER):\($ENV.SHA)" and .conclusion == "success"
                         and (.output.text // "" | split("\n") | any(. == $ENV.MARKER))) | .id') \
              || { echo "::error::the import check runs of $HEAD could not be read."; exit 1; }
            stands=false
            [ -z "$found" ] || stands=true
            echo "standing=$stands" >> "$GITHUB_OUTPUT"
          }
          # replaced <verdict> <state> <why>: the rule's verdict, state and why of the head, for an outside author. The
          # comment job replaces the review comment in place, so a pass with no screen can hide a screened pass of the
          # head. For the state unscreened, the verdict pass and no why, an import check run of the head that stands
          # (standing) is the record of that screened pass: the decision is hand. Else this decides nothing.
          replaced() {
            if [ "$RECORD" = true ] && [ "$2" = unscreened ] && [ "$1" = pass ] && [ "$3" = - ]; then
              standing
              [ "$stands" != true ] \
                || decided hand "the newest review of $HEAD passed it with no screen, and its import check run stands"
            fi
          }
          # import_checks: each import check run of the OSS Verify App for this pull request (external_id
          # <number>:<head>) on the head, with its conclusion, completed_at and summary (which names the source of a
          # withdrawal), one on each line of $RUNNER_TEMP/import-checks.jsonl. The read asks for every check run of
          # the head (filter=all).
          import_checks() {
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            SHA=$HEAD gh api --method GET --paginate "repos/$REPO/commits/$HEAD/check-runs" \
              -f check_name=repo-pairs/import-approved -f filter=all -F per_page=100 --jq '.check_runs[]
                | select(.name == "repo-pairs/import-approved" and .head_sha == $ENV.SHA
                         and (.app.id | tostring) == $ENV.OSS_VERIFY_APP_ID
                         and .external_id == "\($ENV.NUMBER):\($ENV.SHA)")
                | {id, conclusion, completed_at, summary: (.output.summary // "")} | @json' \
                > "$RUNNER_TEMP/import-checks.jsonl" \
              || { echo "::error::the import check runs of $HEAD could not be read."; exit 1; }
          }
          # relabeled: for a relabel, the verdict of the newest review comment that names the head, its state and why
          # (rules.py verdict), and the run of that comment with the time when that run read the item (record_run and
          # record_read, from its markers, or - when it has none): a record of this relabel rests on that review, so it
          # names that run and that time (rules.py check_run). screen is true only for screened: that comment holds the
          # marker <!-- review-screened <head> --> and no hold comment of the screen that names the head is newer. The
          # outputs verdict, held and earlier (why: blocking or person, or the why of the line
          # <!-- withdraw-owed <head> <why> <run> --> of the label comment, with from_owed true) give them to the step
          # that withdraws an import check run, and held or a why writes the output owed first (write_owed). A newer
          # hold comment (held) gives the decision held. For an outside author, the state screened with the verdict pass
          # and a why (that line) gives a decision that records no check run, as a relabel that withdraws records none:
          # withdrawn when no comment of the workflow gives the why of that line (posted is unposted: the comment of the
          # line's run that gives its why, or a screened review comment whose run read the item after the time of the
          # line: the hold or the withdrawal of that run, or else the end of the step of that run that wrote the line;
          # rules.py owed and word_time), so that the label comment says so (rules.py, the decision withdrawn), and
          # screened else. For an outside author whose newest review comment is a screened pass, rules.py verdict reads
          # the comments again with the import check runs of the head (import_checks), whose summaries decide posted.
          # A withdrawal that succeeded is itself the record of the verdict that caused it (OSSV-221's architect,
          # 2026-11-23 01:47Z and 03:06Z), and the run that withdrew it can have ended before its comment posted. So
          # when the withdrawal of the newest read among them (by the time that each one names, never by completed_at;
          # 2026-11-24 09:43Z) has no success of a newer read over it, and no screened review comment that passes the
          # head counts from a time after the time that its summary names (its run read the item after it; rules.py
          # word_time; stands names the withdrawal, and since names that time, or - when the summary names none), the
          # state screened with the verdict pass gives the decision withdrawn too, and no check run is recorded. The
          # state earlier with the verdict pass gives the decision screened with a why, and hand with none. The state
          # unscreened gives replaced.
          relabeled() {
            local reviewed state why from posted stands since said
            reviewed=$(python3 .github/review/rules.py verdict "$NUMBER" "$HEAD") \
              || { echo "::error::the comments of #$NUMBER could not be read."; exit 1; }
            read -r verdict state why from posted stands since record_run record_read <<< "$reviewed"
            if [ "$RECORD" = true ] && [ "$state" = screened ] && [ "$verdict" = pass ]; then
              import_checks
              reviewed=$(python3 .github/review/rules.py verdict "$NUMBER" "$HEAD" "$RUNNER_TEMP/import-checks.jsonl") \
                || { echo "::error::the comments of #$NUMBER could not be read."; exit 1; }
              read -r verdict state why from posted stands since record_run record_read <<< "$reviewed"
            fi
            [ "$verdict" != - ] || verdict=""
            screen=false
            [ "$state" != screened ] || screen=true
            echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
            if [ "$state" = held ]; then
              write_owed screen
              echo "held=true" >> "$GITHUB_OUTPUT"
              said="a screen held $HEAD, and no screened review comment of $HEAD comes from a run that read"
              decided held "$said #$NUMBER after that hold"
            fi
            if [ "$why" != - ]; then
              write_owed "$why"
              echo "earlier=$why" >> "$GITHUB_OUTPUT"
            fi
            [ "$from" != owed ] || echo "from_owed=true" >> "$GITHUB_OUTPUT"
            if [ "$RECORD" = true ] && [ "$state" = screened ] && [ "$verdict" = pass ] && [ "$why" != - ]; then
              said="the label comment records why an earlier run withdraws the import check runs of $HEAD"
              [ "$posted" != unposted ] \
                || decided withdrawn "no review or hold comment gives the cause that the label comment names"
              decided screened "$said"
            fi
            if [ "$RECORD" = true ] && [ "$state" = screened ] && [ "$verdict" = pass ] && [ "$stands" != - ]; then
              said="#$NUMBER: check run $stands is the newest import check run of $HEAD by the time that each one"
              said+=" names."
              if [ "$since" != - ]; then
                echo "$said It is not an approval, because its conclusion is neutral. It counts from $since, the time" \
                  "that its summary names. No screened pass of $HEAD comes from a run that read #$NUMBER after $since."
                said="check run $stands is not an approval, and no screened pass of $HEAD comes from a run that read"
                said+=" #$NUMBER after $since"
              else
                echo "$said Its summary names no time, so it counts as newer than each other one and each" \
                  "screened pass of $HEAD."
                said="check run $stands is not an approval, and it counts as newer than each screened pass of $HEAD"
              fi
              decided withdrawn "$said"
            fi
            if [ "$RECORD" = true ] && [ "$state" = earlier ] && [ "$verdict" = pass ]; then
              if [ "$why" != - ]; then
                said="the newest review of $HEAD gives the verdict $verdict"
                decided screened "$said, and a screen passed the head in an earlier run"
              fi
              standing
              said="the newest review of $HEAD passed it with no screen, after a screen passed it in an earlier run"
              decided hand "$said"
            fi
            replaced "$verdict" "$state" "$why"
          }
          # by_hand: for a review or a rescreen with no screen in this run (a review by hand), of any author, the
          # verdict of the newest review comment of the head (earlier: this run's review has not posted yet), its state
          # and why (rules.py verdict), as relabeled reads them. The run keeps its own verdict, and records no check
          # run. held gives the output held, so that the step that withdraws an import check run withdraws it, as for a
          # relabel. Else a why (blocking or person, or the why of the line <!-- withdraw-owed <head> <why> <run> --> of
          # the label comment, with from_owed true) goes to the output earlier, so that the same step withdraws each
          # check run that still stands for that verdict. held or a why writes the output owed first (write_owed). Only
          # for an outside author does the rule give a decision: held gives held, and screened or earlier gives screened
          # with a why, and hand with none, with the output standing. The state unscreened gives replaced, and else the
          # import check below gives the decision screen.
          by_hand() {
            local reviewed earlier state why from said
            reviewed=$(python3 .github/review/rules.py verdict "$NUMBER" "$HEAD") \
              || { echo "::error::the comments of #$NUMBER could not be read."; exit 1; }
            read -r earlier state why from _ <<< "$reviewed"
            if [ "$state" = held ]; then
              write_owed screen
              echo "held=true" >> "$GITHUB_OUTPUT"
              [ "$RECORD" = true ] || return 0
              said="a screen held $HEAD, and no screened review comment of $HEAD comes from a run that read"
              decided held "$said #$NUMBER after that hold"
            fi
            if [ "$why" != - ]; then
              write_owed "$why"
              echo "earlier=$why" >> "$GITHUB_OUTPUT"
            fi
            [ "$from" != owed ] || echo "from_owed=true" >> "$GITHUB_OUTPUT"
            [ "$RECORD" = true ] || return 0
            if [ "$state" = screened ] || [ "$state" = earlier ]; then
              if [ "$why" != - ]; then
                said="the newest review of $HEAD gives the verdict $earlier"
                decided screened "$said, and a screen passed the head in an earlier run"
              fi
              standing
              said="a review by hand records no check run, but a screen passed $HEAD in the run of an earlier review"
              decided hand "$said"
            fi
            replaced "$earlier" "$state" "$why"
          }
          # screened_run: for a review or a rescreen on the route screen of an outside author whose review passed the
          # head, whether another run gave a word on the head that counts from a time at or after STARTED, the time
          # when the trust job of this run read the item (OSSV-221's architect, 2026-11-23 18:38Z, and 2026-11-24
          # 01:20Z and 01:26Z). The pass of this run counts from STARTED. A review comment or a hold comment of the
          # screen counts from the time when its run read the item (its marker <!-- review-read <time> --> or
          # <!-- review-held-read <time> -->), never from when it posted, and a hold with no such marker from when
          # GitHub last changed it (.github/review/rules.py word_time; 2026-11-24 09:43Z, A3). Only such a run records
          # a check run: with any other verdict, the rules of R12 below give the decision that the label comment needs,
          # and this run withdraws each check run that stands for that verdict. It reads the comments of the item and
          # the import check runs of the head (import_checks), with the id of this run (rules.py own-record). held: a
          # hold comment of the screen that names the head counts from a time at or after STARTED, so the screen of a
          # run that read the item at or after this run held the head. The decision is held, and nothing is recorded.
          # Nothing is withdrawn either: this writes neither the output owed nor held, so the step that withdraws finds
          # no cause in this run. The run of the hold withdraws for its own screen, or owes that withdrawal, and a check
          # run that a pass of a newer read recorded stays. Else withdrawn: a
          # withdrawal among the import check runs of the head stands (the one of the newest read, by the time that each
          # one names, never by completed_at), and it counts from a time at or after STARTED, so it outranks the pass of
          # this run. A check run that a newer run posted to say that the head is not approved for the import is such a
          # withdrawal (rules.py not-approved), also when it completed before the check run of not-approved of an older
          # read. The decision is withdrawn, as for a relabel, and nothing is recorded. Else newer: a review comment of
          # the head of another run gives a blocking finding or the verdict person, and counts from a time at or after
          # STARTED. A run that read the item at or after this run gave that verdict. The decision is newer, and nothing
          # is recorded. As for held, this writes neither the output owed nor held: the run of that review withdraws for
          # its own verdict, or owes that withdrawal. Each of these three decisions also goes to the output gave_way:
          # the comment job of this run then posts nothing on the item, no review, no label and no label comment, as the
          # newer run owns them (OSSV-221's architect, 2026-11-24 01:26Z, (a)). Else this decides nothing, and the rules
          # of R12 below decide: a record of this run names this run and STARTED (record_run and record_read; rules.py
          # check_run), so that a withdrawal by a run that read the item before STARTED leaves it (2026-11-24 05:23Z). A
          # read that fails fails this step.
          screened_run() {
            local found decision what since given said
            [ "$verdict" = pass ] || return 0
            [[ $STARTED =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
              || { echo "::error::no start time of this run, so it records no import check."; exit 1; }
            [[ ${GITHUB_RUN_ID:-} =~ ^[1-9][0-9]*$ ]] \
              || { echo "::error::no id of this run, so it records no import check."; exit 1; }
            record_run=$GITHUB_RUN_ID record_read=$STARTED
            import_checks
            found=$(python3 .github/review/rules.py own-record "$NUMBER" "$HEAD" "$STARTED" "$GITHUB_RUN_ID" \
              "$RUNNER_TEMP/import-checks.jsonl") \
              || { echo "::error::the comments of #$NUMBER could not be read."; exit 1; }
            read -r decision what since given <<< "$found"
            case $decision in
              held|withdrawn|newer) echo "gave_way=$decision" >> "$GITHUB_OUTPUT" ;;
            esac
            if [ "$decision" = held ]; then
              said="a hold of the screen of $HEAD counts from $what, at or after this run read #$NUMBER at $STARTED"
              decided held "$said"
            fi
            if [ "$decision" = withdrawn ]; then
              if [ "$since" != - ]; then
                echo "#$NUMBER: check run $what is the newest import check run of $HEAD by the time that each one" \
                  "names. It is not an approval, because its conclusion is neutral. It counts from $since. This run" \
                  "read #$NUMBER at $STARTED, at or before that time. The pass of this run counts from $STARTED. No" \
                  "screened pass of $HEAD comes from a run that read #$NUMBER after $since."
                said="check run $what is not an approval, and no screened pass of $HEAD comes from a run that read"
                said+=" #$NUMBER after $since"
              else
                echo "#$NUMBER: check run $what is the newest import check run of $HEAD by the time that each one" \
                  "names. Its summary names no time, so it counts as newer than each other one and each screened" \
                  "pass of $HEAD."
                said="check run $what is not an approval, and it counts as newer than each screened pass of $HEAD"
              fi
              decided withdrawn "$said"
            fi
            if [ "$decision" = newer ]; then
              if [ "$what" = - ]; then
                echo "#$NUMBER: a review comment of $HEAD that names no run gives the verdict $given. GitHub last" \
                  "changed it at $since, at or after this run read #$NUMBER at $STARTED."
                said="a review comment that GitHub changed at or after the time when this run read #$NUMBER gave $HEAD"
                said+=" the verdict"
                decided newer "$said $given"
              fi
              echo "#$NUMBER: the review of run $what gives $HEAD the verdict $given. Run $what read #$NUMBER at" \
                "$since, at or after this run read #$NUMBER at $STARTED."
              said="a run that read #$NUMBER at or after the time when this run read it gave $HEAD the verdict"
              decided newer "$said $given"
            fi
          }
          pr=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '"\(.head.sha) \(.changed_files)"') \
            || { echo "::error::pull request #$NUMBER could not be read."; exit 1; }
          read -r sha count <<< "$pr"
          [ "$sha" = "$HEAD" ] || decided moved "the head of the pull request is now $sha"
          # The screen of this run passed the head when the route is screen: the review job, which this step needs to
          # have succeeded, runs on that route only after a screen that passed. A review by hand with no screen has the
          # route review (by_hand).
          screen=false verdict=$VERDICT record_run=- record_read=-
          [ "$ROUTE" != screen ] || screen=true
          if [ "$RECORD" != true ]; then
            [ "$TASK" != relabel ] || relabeled
            [ "$TASK" = relabel ] || [ "$screen" = true ] || by_hand
            decided writer "the author of #$NUMBER is not an outside author: it has write access, or GitHub did not say"
          fi
          [[ $count =~ ^[0-9]+$ ]] || { echo "::error::#$NUMBER gives no count of changed files."; exit 1; }
          gh api --paginate "repos/$REPO/pulls/$NUMBER/files?per_page=100" \
            --jq '.[] | {filename, previous_filename} | @json' > "$RUNNER_TEMP/files.jsonl" \
            || { echo "::error::the files of #$NUMBER could not be read."; exit 1; }
          sha=$(gh api "repos/$REPO/pulls/$NUMBER" --jq .head.sha) \
            || { echo "::error::pull request #$NUMBER could not be read."; exit 1; }
          said="the head of the pull request changed to $sha while the step read its files"
          [ "$sha" = "$HEAD" ] || decided moved "$said"
          [ "$TASK" != relabel ] || relabeled
          [ "$TASK" = relabel ] || [ "$screen" = true ] || by_hand
          [ "$TASK" = relabel ] || [ "$screen" != true ] || screened_run
          # The variable's text, given only when it is set: an empty value is no variable.
          imports=()
          [ -z "$IMPORT_PATHS" ] || imports=("$IMPORT_PATHS")
          decision=$(python3 .github/review/rules.py import-check "$RUNNER_TEMP/files.jsonl" "$count" "$NUMBER" \
            "$HEAD" "$screen" "$verdict" "${SOUNDNESS_HOLD:-}" "$record_run" "$record_read" \
            "$RUNNER_TEMP/import-check.json" "${imports[@]}") \
            || { echo "::error::the import check of $HEAD could not be decided."; exit 1; }
          files_read=$(grep -c . "$RUNNER_TEMP/files.jsonl" || true)
          decided "$decision" "the step read $files_read of the $count changed files"
      # The import check run of the head that a later review or screen withdraws (R12): with this job's own token, each
      # check run repo-pairs/import-approved of the OSS Verify App on the head, with conclusion success, whose
      # external_id is <number>:<head>. A check run belongs to a commit, so one of another pull request of the same
      # commit is not this pull request's. The reasons: this run's review of the head (a review, a rescreen, a review by
      # hand, or the review comment that a relabel reads) gave a blocking finding or the verdict person, or this run's
      # screen held the head, or a relabel or a review by hand with no screen found a hold comment of the screen that
      # names the head and is newer than the newest review comment of the head with the marker
      # <!-- review-screened <head> --> (the decision's held), whatever the verdict. A relabel or a review by hand with
      # no screen also withdraws each check run that still stands when the newest screened review comment of the head
      # does not pass, or one newer than it gives a blocking finding or the verdict person, or while the label comment
      # holds the line <!-- withdraw-owed <head> <why> <run> --> (the decision's earlier, from rules.py verdict), for
      # that reason when its own verdict gives none. The if of this step reads the screen's verdict: a review or a
      # rescreen whose review job did not succeed runs this step only when the screen held the head, or when the review
      # job failed or was cancelled after it gave a blocking finding or the verdict person (the if of this job), and an
      # approval only when the screen held the head. Once it has a reason, before it reads the check runs, the step
      # writes the output owed, "<head> <why>": a read or a withdrawal that fails after it leaves that output, and the
      # comment job or the hold job records the line. An earlier step of this job wrote it already when it found the
      # reason (the step "Write the output owed for the withdrawal of the import check runs", or write_owed of the
      # decision step). With no check run to withdraw, its output clear names the head: nothing is owed for it. The read
      # asks for every check run of the head (filter=all): by default GitHub lists only the newest of each name, which
      # can hide an older success under a newer one that was withdrawn. A withdrawal counts from the time of its reason,
      # and withdraws only a check run whose run read the item at or before that time, or that names no such run
      # (OSSV-221's architect, 2026-11-24 05:23Z): an older read never withdraws the record of a newer read. When
      # each check run with conclusion success is the record of a newer read, nothing is withdrawn, the log says so,
      # and the output clear names the head, as when no such check run stands.
      # When the head has no import check run with conclusion success at all, a run whose own verdict or screen gives
      # the reason (kind own) leaves a record of it all the same (2026-11-24 05:33Z). It does so for an author whom the
      # rules that hold back treat as outside (.github/review/rules.py holds_back; 2026-11-24 09:28Z): the trust job's
      # outside is not false, or its kind is unknown (GitHub did not say whether the author has write access). The step
      # makes the request of a check run with the conclusion neutral that says that the head is not approved for the
      # import (.github/review/rules.py not-approved): it names this run, why and STARTED. The output neutral names the
      # head in the place of clear, and the step "Record that the head is not approved for the import" posts it after
      # the sign-in. The post jobs of an item run one at a time, and the post job of a run that read the item before
      # STARTED can come after this one: it reads that check run as a withdrawal that counts from STARTED, and records
      # nothing. A newer read's record that stands, and the kinds held, owed and earlier, make no such request: a newer
      # read outranks this run, and the reason of an older kind is a comment or a line already. Only an outside author's
      # runs record a check run, but an earlier run of the head can have read the author as outside while GitHub did not
      # say so in this run. So a failed read of the author's access never leaves an older pass standing under the
      # verdict or the hold of this run. A writer's run makes no such request.
      # The request of each check run goes to the runner's temporary directory (.github/review/rules.py withdrawal):
      # the conclusion neutral, an output title that names the pull request and says why, a summary that also names
      # this run, the head, why and the time from which the withdrawal counts, with the run that gave why when it is an
      # earlier run whose time is known, and completed_at, the time of the withdrawal. For own, the withdrawal counts
      # from the time when this run read the item (STARTED), never from the time of the withdrawal. Its name, its
      # external_id and its output text, the marker line of the value that it recorded, stay. With no such check run,
      # nothing is withdrawn, and token A is minted only for the check run of not-approved. While the environment post
      # holds no key (APP_KEY_SET), no step can withdraw what this step finds, so it does not run. A read that fails
      # fails the job. The step runs when the author-kind table's withdraw holds (the first step of this job), for every
      # author: a check run of R12 that an earlier run recorded may stand on the head, whatever the trust job says of
      # the author now. The error of a read that fails, and of a withdrawal or a check run of not-approved that GitHub
      # refuses (the steps after the sign-in), follows the table's retry and the name of this run. For an outside
      # author, the rescreen pass's retry of the App's writes (a relabel, held.sh due_retry) withdraws the check run
      # again, an hour or more after this run ends. It records no check run of not-approved, so the error of that path
      # says so. That retry takes only a run whose name gives the head (the trust job's named): a CI run, or a run by
      # hand whose input head is set, as each run of the pass for a pull request sets it. held.sh take records no head
      # for any other run. After a hold that is not tried again names the head,
      # that relabel is the one App write that the pass tries again for the head, and only when the relabel withdraws:
      # a screen held the head after each review that screened it, the newest review of the head gives a blocking
      # finding or the verdict person, or the label comment holds the line
      # <!-- withdraw-owed <head> <why> <run> --> (held.sh, consider). Such a relabel records no check run. After
      # REVIEW_TRIES failed tries, this run among them, the head is not tried again, and the label comment names the
      # next step for Sami (held.sh, head_stopped). A later run of the head whose trust job failed or was cancelled (it
      # ran out of time, say) counts a try too (held.sh failures). So the error says so. The pass tries no App write of
      # another author's pull request again (held.sh, consider and access_of), so for such an author, and for a run
      # whose name gives no head, the error says to re-run this run.
      - name: Find the import check runs that a later review or screen withdraws
        id: withdraw
        if: >-
          env.APP_KEY_SET == 'true' && steps.answers.outputs.withdraw == 'true'
          && (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
          && (((needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen')
               && (needs.review.result == 'success'
                   || ((needs.review.result == 'failure' || needs.review.result == 'cancelled')
                       && (needs.review.outputs.verdict == 'blocking' || needs.review.outputs.verdict == 'person'))
                   || (needs.screen.result == 'success' && needs.screen.outputs.verdict != 'clean')))
              || needs.trust.outputs.task == 'relabel'
              || (needs.trust.outputs.task == 'approve' && needs.screen.result == 'success'
                  && needs.screen.outputs.verdict != 'clean'))
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TASK: ${{ needs.trust.outputs.task }}
          NUMBER: ${{ needs.trust.outputs.number }}
          REVIEWED: ${{ needs.review.result }}
          # The head that the trust job read (of a relabel, or of a held screen), and the head that the review read.
          TRUST_HEAD: ${{ needs.trust.outputs.head }}
          REVIEW_HEAD: ${{ needs.review.outputs.head }}
          # The verdict of the review comment that a relabel reads (the decision's), or else of this run's review.
          VERDICT: ${{ steps.decide.outputs.verdict || needs.review.outputs.verdict }}
          # true when a relabel or a review by hand with no screen found a newer hold of the screen, of any author.
          HELD: ${{ steps.decide.outputs.held }}
          # The reason of the rule of rules.py verdict for a relabel or a review by hand: blocking or person, or the why
          # of the line <!-- withdraw-owed <head> <why> <run> --> of the label comment, and then FROM_OWED is true.
          EARLIER: ${{ steps.decide.outputs.earlier }}
          FROM_OWED: ${{ steps.decide.outputs.from_owed }}
          # The author-kind table's answer retry (the first step of this job).
          RETRY: ${{ steps.answers.outputs.retry }}
          # The head that the name of this run gives (the trust job's named), or empty.
          NAMED: ${{ needs.trust.outputs.named }}
          # The time when the trust job of this run read the item: the time from which an own withdrawal counts.
          STARTED: ${{ needs.trust.outputs.started }}
          # The trust job's outputs outside and kind, as they are. This run records that the head is not approved for
          # the import by the rule that holds back (.github/review/rules.py holds_back): unless outside is false, and
          # also when kind is unknown (GitHub did not say whether the author has write access).
          OUTSIDE: ${{ needs.trust.outputs.outside }}
          AUTHOR_KIND: ${{ needs.trust.outputs.kind }}
          # The import's paths, one glob on each line, while the import is live (R12): the marker line of the check run
          # that says that the head is not approved for the import. An empty value is no variable.
          IMPORT_PATHS: ${{ vars.REPO_PAIRS_IMPORT_PATHS }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          head=$REVIEW_HEAD why=$VERDICT gave=review
          if [ "$TASK" = relabel ]; then
            head=$TRUST_HEAD gave=trust
          elif [ "$TASK" = approve ] \
            || { [ "$REVIEWED" != success ] && [ "$REVIEWED" != failure ] && [ "$REVIEWED" != cancelled ]; }; then
            head=$TRUST_HEAD why=screen gave=trust
          fi
          [ "${HELD:-}" != true ] || why=screen
          # kind: own when the cause is this run's own verdict or the hold of its own screen, else the kind of the
          # older cause (rules.py source): held for a newer hold of the screen, owed for the line
          # <!-- withdraw-owed <head> <why> <run> --> (FROM_OWED), and earlier for a review comment of the head: the
          # newest one, which a relabel reads (a relabel gives no verdict of its own), or EARLIER (rules.py verdict).
          # who, asks and has: the review whose verdict withdraws, and what it says. For own, it is this run's review, a
          # review later than the check run. The review of another kind can be older than the check run, so its texts do
          # not say later. For a relabel's review and for the line, the texts are those of the check run's title
          # (rules.py OWED_WITHDRAWN): a past verdict, asked and had. For EARLIER, who says that the review came before
          # this run, and asks and has give the verdict that its comment gives now.
          who="a later review" asks="asks for a change" has="has questions for Sami" kind=own
          if [ "$TASK" = relabel ]; then
            who="an automated review of $head" asks="asked for a change" has="had questions for Sami" kind=earlier
          fi
          [ "${HELD:-}" != true ] || kind=held
          if [ -n "${EARLIER:-}" ] && [ "$why" != blocking ] && [ "$why" != person ]; then
            why=$EARLIER who="a review of $head before this run" asks="asks for a change" has="has questions for Sami"
            kind=earlier
            if [ "${FROM_OWED:-}" = true ]; then
              who="an automated review of $head" asks="asked for a change" has="had questions for Sami"
              kind=owed
            fi
          fi
          # because: why the import check runs of the head are withdrawn. For the screen, only own says a later screen:
          # it is this run's own screen, which held the head in this run. Every other kind says an automated screen,
          # as the title and the summary of the withdrawal do (rules.py OWED_WITHDRAWN): the hold of another kind can
          # be older than the check run. Only a relabel and a review by hand reach held (the decision's held, from
          # rules.py verdict); a run on the route screen whose own record finds a newer hold withdraws nothing for it
          # (screened_run).
          case $why in
            blocking) because="$who $asks" ;;
            person) because="$who $has" ;;
            screen)
              because="a later screen held $head"
              [ "$kind" = own ] || because="an automated screen held $head" ;;
            *) echo "#$NUMBER: this run withdraws no import check run of $head."; exit 0 ;;
          esac
          [[ $head =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the $gave job gave no head commit: $head"; exit 1; }
          echo "owed=$head $why" >> "$GITHUB_OUTPUT"
          # again: what the error of a read that fails says comes next: the rescreen pass's retry when the author-kind
          # table's retry holds and the name of this run gives the head, else a re-run of this run.
          again=" Re-run this run."
          if [ "$RETRY" = true ] && [ "$NAMED" = "$head" ]; then
            again=" The rescreen pass tries this withdrawal again in a relabel of this head, an hour or more after this"
            again+=" run ends. After $REVIEW_TRIES failed tries, this one included, the label comment names the next"
            again+=" step for Sami."
          fi
          # Each import check run of the OSS Verify App for this pull request on the head, with its conclusion,
          # completed_at and summary, and the output text that a withdrawal keeps.
          # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
          SHA=$head gh api --method GET --paginate "repos/$REPO/commits/$head/check-runs" \
            -f check_name=repo-pairs/import-approved -f filter=all -F per_page=100 --jq '.check_runs[]
              | select(.name == "repo-pairs/import-approved" and .head_sha == $ENV.SHA
                       and (.app.id | tostring) == $ENV.OSS_VERIFY_APP_ID
                       and .external_id == "\($ENV.NUMBER):\($ENV.SHA)")
              | {id, conclusion, completed_at, summary: (.output.summary // ""), text: (.output.text // "")} | @json' \
            > "$RUNNER_TEMP/import-checks.jsonl" \
            || { echo "::error::the import check runs of $head could not be read, so none of them is withdrawn.$again"
                 exit 1; }
          # sources: the source runs and times that the withdrawals of the head name, before this run withdraws any
          # (rules.py sources). The comment job or the hold job takes the line <!-- withdraw-owed <head> <why> <run> -->
          # out for a review comment of the head only when its run read the item after the hold or the withdrawal of
          # <run>, or else after the end of the step of <run> that wrote the line (rules.py word_time).
          sources=$(python3 .github/review/rules.py sources "$head" "$RUNNER_TEMP/import-checks.jsonl") \
            || { echo "::error::the import check runs of $head could not be read, so none of them is withdrawn.$again"
                 exit 1; }
          echo "sources=$sources" >> "$GITHUB_OUTPUT"
          jq -c 'select(.conclusion == "success")' "$RUNNER_TEMP/import-checks.jsonl" > "$RUNNER_TEMP/approved.jsonl"
          # Each request names this run (GITHUB_RUN_ID) as the run that withdraws the check run, and kind. For own, the
          # time is when this run read the item (STARTED). Else it names the run of the older cause and its time: for
          # earlier the time when that run read the item (its review), the time of its hold or withdrawal, or for owed
          # the end of the step of that run that wrote the line (rules.py source). When no time is known, it says so,
          # and the time is that of the withdrawal (OSSV-221's architect, 2026-11-23 03:06Z and 04:39Z, and 2026-11-24
          # 01:20Z and 05:23Z). rules.py withdrawal makes a request only for a check run whose run read the item at or
          # before that time, or that names no such run, and for each one when no time is known.
          source=- at=-
          if [ "$kind" = own ] && [ -s "$RUNNER_TEMP/approved.jsonl" ]; then
            [[ ${STARTED:-} =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
              || { echo "::error::no start time of this run, so none of the import check runs of $head is" \
                     "withdrawn.$again"; exit 1; }
            at=$STARTED
          elif [ "$kind" != own ] && [ -s "$RUNNER_TEMP/approved.jsonl" ]; then
            found=$(python3 .github/review/rules.py source "$NUMBER" "$head" "$why" "$kind" \
              "$RUNNER_TEMP/import-checks.jsonl") \
              || { echo "::error::the comments of #$NUMBER could not be read, so none of the import check runs of" \
                     "$head is withdrawn.$again"; exit 1; }
            read -r source at <<< "$found"
          fi
          ids=$(python3 .github/review/rules.py withdrawal "$NUMBER" "$head" "$why" "$kind" "$GITHUB_RUN_ID" "$source" \
            "$at" "$RUNNER_TEMP/approved.jsonl" "$RUNNER_TEMP") \
            || { echo "::error::the requests that withdraw the import check runs could not be made."; exit 1; }
          ids=$(tr '\n' ' ' <<< "$ids")
          ids=${ids% }
          # kept: each check run with conclusion success that this run leaves, as the record of a newer read.
          kept=$(jq -r --arg ids " $ids " '.id as $id | select($ids | contains(" \($id) ") | not) | $id' \
            "$RUNNER_TEMP/approved.jsonl" | tr '\n' ' ')
          kept=${kept% }
          if [ -n "$kept" ]; then
            echo "#$NUMBER: the import check runs $kept of $head stand. Each one is the record of a run that read" \
              "#$NUMBER after $at. The withdrawal of this run counts from $at, so it leaves them."
          fi
          if [ -z "$ids" ]; then
            # With no import check run to withdraw, own says what this run's own review or screen gave: no check run
            # stands for that review or screen to be later than. after names that review or hold.
            if [ "$kind" = own ]; then
              case $why in
                blocking) because="the review of this run asks for a change" after="that review" ;;
                person) because="the review of this run has questions for Sami" after="that review" ;;
                screen) because="the screen of this run held $head" after="that hold" ;;
              esac
            fi
            # With no import check run of conclusion success at all, a run whose own verdict or screen withdraws makes
            # the request of a check run with the conclusion neutral that says that the head is not approved for the
            # import (rules.py not-approved; OSSV-221's architect, 2026-11-24 05:33Z). It does so when the rules that
            # hold back treat the author as outside (rules.py holds_back; 2026-11-24 09:28Z): OUTSIDE is not false, or
            # AUTHOR_KIND is unknown. The post job of a run that read the item before STARTED can come after this one,
            # and it reads that check run as a withdrawal that counts from STARTED. The step "Record that the head is
            # not approved for the import" posts it, after the sign-in.
            if [ -z "$kept" ] && [ "$kind" = own ] \
              && { [ "${OUTSIDE:-}" != false ] || [ "${AUTHOR_KIND:-}" = unknown ]; }; then
              # again: the error of this path says what comes next. The rescreen pass's retry is a relabel, which
              # withdraws for the line of this run but records no such check run.
              if [ "$RETRY" = true ] && [ "$NAMED" = "$head" ]; then
                again=" An hour or more after this run ends, the rescreen pass starts a relabel of this head. Because"
                again+=" $because, that relabel withdraws each import check run with the conclusion success. It leaves"
                again+=" one only when the run that recorded it read #$NUMBER after $after. It records no check run"
                again+=" that says that the head is not approved. After $REVIEW_TRIES failed tries, this one included,"
                again+=" the label comment names the next step for Sami."
              fi
              [[ ${STARTED:-} =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
                || { echo "::error::no start time of this run, so no check run records that $head is not approved" \
                       "for the import.$again"; exit 1; }
              values=()
              [ -z "${IMPORT_PATHS:-}" ] || values=("$IMPORT_PATHS")
              python3 .github/review/rules.py not-approved "$NUMBER" "$head" "$why" "$GITHUB_RUN_ID" "$STARTED" \
                "$RUNNER_TEMP/not-approved.json" "${values[@]}" \
                || { echo "::error::the request that records that $head is not approved for the import could not be" \
                       "made."; exit 1; }
              echo "#$NUMBER: $because, and $head has no import check run with the conclusion success. So a later" \
                "step of this job records a check run that says that $head is not approved for the import. It counts" \
                "from $STARTED, when this run read #$NUMBER."
              echo "neutral=$head" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ -n "$kept" ] || echo "#$NUMBER: $because, but $head has no import check run to withdraw."
            echo "clear=$head" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "#$NUMBER: a later step of this job withdraws the import check runs $ids of $head, because $because."
          { echo "checks=$ids"; echo "head=$head"; } >> "$GITHUB_OUTPUT"
      # Token A: for the import check run when the decision is to record it or a later review or screen withdraws it,
      # for the check run that says that the head is not approved for the import, and for the close and reopen of a
      # catch-up. Only while the environment post holds the App's key.
      - name: Sign in as the OSS Verify App
        id: app
        if: >-
          env.APP_KEY_SET == 'true'
          && (needs.trust.outputs.task == 'catchup' || steps.decide.outputs.decision == 'record'
              || steps.withdraw.outputs.checks != '' || steps.withdraw.outputs.neutral != '')
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0 (sha-pinned)
        with:
          client-id: ${{ env.OSS_VERIFY_APP_CLIENT_ID }}
          private-key: ${{ secrets.OSS_VERIFY_APP_PRIVATE_KEY }}
          owner: theorem-labs
          repositories: rocq-linux-process-semantics
          permission-checks: write
          permission-pull-requests: write
      # The import check run repo-pairs/import-approved, with conclusion success, on the head that the decision judged,
      # recorded with token A. A check run belongs to a commit, and so shows on each pull request of that commit: its
      # external_id, <number>:<head>, and its output title name this pull request, and the import counts the check run
      # as the approval of that pull request alone. Its output text holds the marker line of the value of
      # REPO_PAIRS_IMPORT_PATHS that the decision read. A call that fails fails the job: recorded stays false, and the
      # rescreen pass takes the head again. A token A that could not be minted skips this step for the same end. While
      # the environment post holds no key, this step does not run: recorded stays false, and the job succeeds. The
      # decision step gives record only while no withdrawal that stands counts from a time at or after the time when
      # this run read the item. A check run that says that the head is not approved for the import counts as such a
      # withdrawal: a newer run posted it when it found no success to withdraw (the step after the next).
      - name: Record the import check of the head
        id: record
        if: env.APP_KEY_SET == 'true' && steps.decide.outputs.decision == 'record'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.trust.outputs.number }}
        run: |
          set -euo pipefail
          request=$RUNNER_TEMP/import-check.json
          # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
          head=$(jq -r 'select(.name == "repo-pairs/import-approved" and .conclusion == "success"
              and .external_id == "\($ENV.NUMBER):\(.head_sha)") | .head_sha' "$request" 2> /dev/null || true)
          [[ $head =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the decision wrote no import check to record."; exit 1; }
          id=$(gh api --method POST "repos/$REPO/check-runs" --input "$request" --jq .id) \
            || { echo "::error::the import check of $head could not be recorded."; exit 1; }
          echo "Recorded the check run $id, repo-pairs/import-approved, for #$NUMBER on $head."
          echo "recorded=true" >> "$GITHUB_OUTPUT"
      # The withdrawal of the import check runs that the step "Find the import check runs that a later review or screen
      # withdraws" found, with token A, each with its request: the conclusion neutral, so that the import no longer
      # reads it as the approval of the pull request. A call that fails fails the job, with an error that names the
      # head and the import check run, and says what comes next: the retry of the rescreen pass when the author-kind
      # table's retry holds and the name of this run gives the head (the comment of the step that found it says how),
      # else a re-run of this run. Once each one is withdrawn, the output head names the head: the job's output
      # withdrawn, by which the comment job takes the line <!-- withdraw-owed <head> <why> <run> --> out of the label
      # comment while a comment of the workflow gives a reason for it (.github/review/rules.py owed).
      - name: Withdraw the import check runs of the head
        id: withdrawn
        if: env.APP_KEY_SET == 'true' && steps.withdraw.outputs.checks != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          CHECKS: ${{ steps.withdraw.outputs.checks }}
          HEAD: ${{ steps.withdraw.outputs.head }}
          # The author-kind table's answer retry (the first step of this job).
          RETRY: ${{ steps.answers.outputs.retry }}
          # The head that the name of this run gives (the trust job's named), or empty.
          NAMED: ${{ needs.trust.outputs.named }}
        run: |
          set -euo pipefail
          # again: what the error of a withdrawal that fails says comes next: the rescreen pass's retry when the
          # author-kind table's retry holds and the name of this run gives the head, else a re-run of this run.
          again=" Re-run this run."
          if [ "$RETRY" = true ] && [ "$NAMED" = "$HEAD" ]; then
            again=" The rescreen pass tries this withdrawal again in a relabel of this head, an hour or more after this"
            again+=" run ends. After $REVIEW_TRIES failed tries, this one included, the label comment names the next"
            again+=" step for Sami."
          fi
          read -r -a ids <<< "$CHECKS"
          for id in "${ids[@]}"; do
            [[ $id =~ ^[1-9][0-9]*$ ]] || { echo "::error::not the id of an import check run: $id"; exit 1; }
            gh api --method PATCH "repos/$REPO/check-runs/$id" --input "$RUNNER_TEMP/withdraw-$id.json" \
              --jq .conclusion > /dev/null \
              || { echo "::error::the import check run $id of $HEAD could not be withdrawn.$again"; exit 1; }
            echo "Withdrew the import check run $id of $HEAD: its conclusion is now neutral."
          done
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
      # The check run that says that the head is not approved for the import (.github/review/rules.py not-approved).
      # The step "Find the import check runs that a later review or screen withdraws" made its request for this run's
      # own verdict or screen, as the head had no import check run with conclusion success (OSSV-221's architect,
      # 2026-11-24 05:33Z), for an author whom the rules that hold back treat as outside (.github/review/rules.py
      # holds_back; 2026-11-24 09:28Z). For this check run, this step and its sign-in read only that step's output
      # neutral, so they follow the same rule. It is posted with token A, as the record step posts a record (POST
      # repos/<repo>/check-runs), but with the conclusion neutral: the import reads only a success, so it approves
      # nothing. Its summary names this run, the head, why and the time when this run read the item. The post job of a
      # run that read the item before that time can come after this one: it reads the check run as a withdrawal that
      # stands, and records nothing. The step posts only a request for this pull request at that head.
      # A call that fails fails the job, as a withdrawal that GitHub refuses does: the output owed stays, and the
      # comment job or the hold job records the line <!-- withdraw-owed <head> <why> <run> -->. The error says what
      # comes next: the rescreen pass's relabel of the head when the author-kind table's retry holds and the name of
      # this run gives the head, else a re-run of this run. That relabel withdraws for the line, but it records no check
      # run that says that the head is not approved. Once it is posted, the output head names the head: the job's
      # output withdrawn.
      - name: Record that the head is not approved for the import
        id: neutral
        if: env.APP_KEY_SET == 'true' && steps.withdraw.outputs.neutral != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.trust.outputs.number }}
          HEAD: ${{ steps.withdraw.outputs.neutral }}
          # The author-kind table's answer retry (the first step of this job).
          RETRY: ${{ steps.answers.outputs.retry }}
          # The head that the name of this run gives (the trust job's named), or empty.
          NAMED: ${{ needs.trust.outputs.named }}
        run: |
          set -euo pipefail
          # again: what the error of a call that fails says comes next. The rescreen pass's retry is a relabel, which
          # withdraws for the line of this run but records no such check run.
          again=" Re-run this run."
          if [ "$RETRY" = true ] && [ "$NAMED" = "$HEAD" ]; then
            again=" An hour or more after this run ends, the rescreen pass starts a relabel of this head. For the"
            again+=" verdict or the screen of this run, that relabel withdraws each import check run with the"
            again+=" conclusion success. It leaves one only when the run that recorded it read #$NUMBER after that"
            again+=" verdict or screen. It records no check run that says that the head is not approved. After"
            again+=" $REVIEW_TRIES failed tries, this one included, the label comment names the next step for Sami."
          fi
          request=$RUNNER_TEMP/not-approved.json
          # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
          sha=$(jq -r 'select(.name == "repo-pairs/import-approved" and .conclusion == "neutral"
              and .external_id == "\($ENV.NUMBER):\(.head_sha)") | .head_sha' "$request" 2> /dev/null || true)
          [[ $HEAD =~ ^[0-9a-f]{40}$ && $sha == "$HEAD" ]] \
            || { echo "::error::no request says that $HEAD is not approved for the import."; exit 1; }
          id=$(gh api --method POST "repos/$REPO/check-runs" --input "$request" --jq .id) \
            || { echo "::error::the check run that says that $HEAD is not approved for the import could not be" \
                   "recorded.$again"; exit 1; }
          echo "Recorded the check run $id, repo-pairs/import-approved, with the conclusion neutral for #$NUMBER on" \
            "$HEAD. It says that $HEAD is not approved for the import."
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
      # The catch-up, with token A: a pull request that is closed and reopened gets a new CI run of its head (the event
      # pull_request), and the review of that CI run follows. An open pull request is closed, then reopened; one that a
      # catch-up run closed and could not reopen (the trust job took it as such) is only reopened. The pull request's
      # state now tells which. An open one whose head moved since the trust job read it, or whose head repository is
      # gone (GitHub cannot reopen such a pull request), is not closed. A closed one is reopened only while its newest
      # close is the App's own, so that a pull request that someone closed in between stays closed. The reopen is tried
      # 3 times, 10 seconds apart; then the step fails, and the rescreen pass tries the reopen again an hour later. Once
      # the pull request is open again, the output caught names its head: the comment job records it in the label
      # comment, so that the rescreen pass catches up each head once. While the environment post holds no key, this
      # step does not run, and the pull request stays as it is.
      - name: Close and reopen the pull request
        id: catchup
        if: env.APP_KEY_SET == 'true' && needs.trust.outputs.task == 'catchup'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.trust.outputs.number }}
          HEAD: ${{ needs.trust.outputs.head }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          [[ $HEAD =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the trust job gave no head commit: $HEAD"; exit 1; }
          pr=$(gh api "repos/$REPO/pulls/$NUMBER" \
            --jq '"\(.state) \((.merged // false) | tostring) \(.head.sha) \(.head.repo.id // 0)"') \
            || { echo "::error::pull request #$NUMBER could not be read."; exit 1; }
          read -r state merged sha repository <<< "$pr"
          if [ "$state" = open ]; then
            if [ "$sha" != "$HEAD" ]; then
              echo "::notice::#$NUMBER moved from $HEAD to $sha after the trust job read it. It is not closed."
              exit 0
            fi
            if ! [[ $repository =~ ^[1-9][0-9]*$ ]]; then
              echo "::notice::the head repository of #$NUMBER is gone, so GitHub could not reopen it. It is not closed."
              exit 0
            fi
            gh api --method PATCH "repos/$REPO/pulls/$NUMBER" -f state=closed --jq .state > /dev/null \
              || { echo "::error::#$NUMBER could not be closed."; exit 1; }
            echo "Closed #$NUMBER."
          else
            if [ "$merged" != false ]; then
              echo "::notice::#$NUMBER is merged. It is not reopened."
              exit 0
            fi
            closed=$(gh api --paginate "repos/$REPO/issues/$NUMBER/events" --jq '.[] | select(.event == "closed")
              | "\(.created_at) \(.actor.login // "-")"' | sort | tail -n 1) \
              || { echo "::error::the events of #$NUMBER could not be read."; exit 1; }
            if [ "${closed##* }" != "$OSS_VERIFY_APP_LOGIN" ]; then
              echo "::notice::#$NUMBER was closed last by ${closed##* }, not by the catch-up. It is not reopened."
              exit 0
            fi
          fi
          for try in 1 2 3; do
            if gh api --method PATCH "repos/$REPO/pulls/$NUMBER" -f state=open --jq .state > /dev/null; then
              echo "Reopened #$NUMBER: GitHub starts a CI run of $sha."
              [[ ! $sha =~ ^[0-9a-f]{40}$ ]] || echo "caught=$sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::try $try of 3 to reopen #$NUMBER failed."
            if (( try < 3 )); then sleep 10; fi
          done
          echo "::error::#$NUMBER is closed, and 3 tries to reopen it failed. The rescreen pass tries again an hour later."
          exit 1

      # An approval whose screen passed, for an outside author (the author-kind table's approve, the first step of this
      # job): no run of another author's pull request is approved. With this job's own token: the pull request now,
      # and the runs that GitHub holds of the head that the screen read (with the status action_required, or with the
      # status completed and the conclusion action_required, as GitHub lists a held run). When the head moved since the
      # trust job read it, the screen did not read the new head: nothing is approved, and the new head's held runs wait
      # for a run of their own. Only a run of the event pull_request at that head, from the pull request's head
      # repository and head branch, is approved, and no other run of the same commit (OSSV-679's decision 7). No run is
      # approved when the head adds, changes or deletes a file under .github/ (R10), even when the screen passed: such a
      # file steers the workflows, and an approved run of such a head could misuse the runners. The step reads each path
      # from every page of the files of the pull request at the head: the path of each file, and the path that it had
      # before a rename (.github/review/rules.py steering). It reads them after the runs and before a second check of
      # the head. For such a head, the output steering names the head, and the comment job records it. GitHub lists at
      # most 3,000 files of a pull request, so the workflow counts a list of 3,000 files or more, and a count of 3,000
      # or more, as a head that changes such a file: that head gets the same output steering. A read that fails
      # fails this step, and so does a list shorter than a count below 3,000, which is a read that did not give each
      # changed file: no run is approved. While the environment post holds no key, this step still runs, and the last
      # step of this job names the head whose held runs it found (no_key).
      - name: The held runs of the screened head
        id: held
        if: >-
          needs.trust.outputs.task == 'approve' && needs.screen.outputs.verdict == 'clean'
          && steps.answers.outputs.approve == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.trust.outputs.number }}
          HEAD: ${{ needs.trust.outputs.head }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          [[ $HEAD =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the trust job gave no head commit: $HEAD"; exit 1; }
          pr=$(gh api "repos/$REPO/pulls/$NUMBER" \
            --jq '"\(.head.sha) \(.head.repo.id // 0) \(.head.ref) \(.changed_files)"') \
            || { echo "::error::pull request #$NUMBER could not be read."; exit 1; }
          read -r sha repository branch count <<< "$pr"
          if [ "$sha" != "$HEAD" ]; then
            echo "::notice::#$NUMBER moved from $HEAD to $sha after the screen. This run approves no run of $HEAD or" \
              "of $sha."
            exit 0
          fi
          if ! [[ $repository =~ ^[1-9][0-9]*$ ]]; then
            echo "::notice::#$NUMBER has no head repository. The workflow approves no run of it."
            exit 0
          fi
          # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
          runs=$(SHA=$HEAD REPOSITORY=$repository BRANCH=$branch gh api --method GET --paginate "repos/$REPO/actions/runs" \
            -f head_sha="$HEAD" -f status=action_required -F per_page=100 --jq '.workflow_runs[]
              | select((.status == "action_required" or .conclusion == "action_required")
                       and .event == "pull_request" and .head_sha == $ENV.SHA
                       and ((.head_repository.id // 0) | tostring) == $ENV.REPOSITORY
                       and .head_branch == $ENV.BRANCH)
              | .id') \
            || { echo "::error::the runs of $HEAD could not be read."; exit 1; }
          ids=""
          while read -r id; do
            [ -n "$id" ] || continue
            [[ $id =~ ^[1-9][0-9]*$ ]] || { echo "::error::a run id is not a number: $id"; exit 1; }
            ids="$ids${ids:+ }$id"
          done <<< "$runs"
          if [ -z "$ids" ]; then
            echo "#$NUMBER: GitHub holds no run of $HEAD from its head repository and branch. The workflow approves" \
              "no run."
            exit 0
          fi
          echo "#$NUMBER: GitHub holds the runs $ids of $HEAD."
          # refuse <why>: the end of this step with a failure, and no run approved. The post job fails, so the rescreen
          # pass tries the approval of the head again, at most once an hour, and stops after REVIEW_TRIES failed tries
          # (held.sh, due_approve and head_stopped approval).
          refuse() {
            echo "::error::$1 This run approves no run of $HEAD. The rescreen pass tries the approval of $HEAD again" \
              "in a later run, at most once an hour. After $REVIEW_TRIES failed tries, it does not try again, and the" \
              "label comment names the next step for Sami."
            exit 1
          }
          [[ $count =~ ^[0-9]+$ ]] || refuse "#$NUMBER gives no count of changed files."
          files=$RUNNER_TEMP/files.jsonl
          gh api --paginate "repos/$REPO/pulls/$NUMBER/files?per_page=100" \
            --jq '.[] | {filename, previous_filename} | @json' > "$files" \
            || refuse "the files of #$NUMBER could not be read."
          steered=$(python3 .github/review/rules.py steering "$files") \
            || refuse "the files of #$NUMBER are not in the form in which GitHub lists them."
          sha=$(gh api "repos/$REPO/pulls/$NUMBER" --jq .head.sha) \
            || { echo "::error::pull request #$NUMBER could not be read."; exit 1; }
          if [ "$sha" != "$HEAD" ]; then
            echo "::notice::#$NUMBER moved from $HEAD to $sha while its files were read. This run approves no run of" \
              "$HEAD or of $sha."
            exit 0
          fi
          # GitHub lists at most 3,000 files of a pull request. So the workflow counts a list of 3,000 files or more,
          # and a count of 3,000 or more, as a head that changes a file under .github/ (R10). A list shorter than a
          # count below 3,000 is a read that did not give each changed file: the step refuses, and the rescreen pass
          # tries the approval again.
          listed=$(grep -c . "$files" || true)
          if [ "$steered" = true ] || [ "$listed" -ge 3000 ] || [ "$count" -ge 3000 ]; then
            if [ "$steered" = true ]; then
              echo "::notice::#$NUMBER changes a file under .github/ at $HEAD. The workflow approves no run of" \
                "$HEAD. Sami, a person at Theorem with write access, approves its runs on GitHub."
            else
              echo "::notice::#$NUMBER changes $count files at $HEAD. GitHub lists at most 3,000 files of a pull" \
                "request. So the workflow counts a pull request of 3,000 files or more as one that changes a file" \
                "under .github/. The workflow approves no run of $HEAD. Sami, a person at Theorem with write access," \
                "approves its runs on GitHub."
            fi
            echo "steering=$HEAD" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$listed" = "$count" ] || refuse "GitHub lists $listed of the $count changed files of #$NUMBER."
          echo "runs=$ids" >> "$GITHUB_OUTPUT"
      # Token B: for the approval of the runs that the step before found, only when the screen passed, the author-kind
      # table's approve holds, and the environment post holds the App's key.
      - name: Sign in as the OSS Verify App to approve
        id: approver
        if: >-
          env.APP_KEY_SET == 'true' && needs.trust.outputs.task == 'approve' && needs.screen.outputs.verdict == 'clean'
          && steps.answers.outputs.approve == 'true' && steps.held.outputs.runs != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0 (sha-pinned)
        with:
          client-id: ${{ env.OSS_VERIFY_APP_CLIENT_ID }}
          private-key: ${{ secrets.OSS_VERIFY_APP_PRIVATE_KEY }}
          owner: theorem-labs
          repositories: rocq-linux-process-semantics
          permission-actions: write
      # Each of those runs, approved with token B: GitHub then starts it. Every run is tried, and a call that fails
      # fails this step and the job: the App's write failed, and the rescreen pass takes the head again.
      - name: Approve the held runs of the screened head
        if: env.APP_KEY_SET == 'true' && steps.approver.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.approver.outputs.token }}
          REPO: ${{ github.repository }}
          RUNS: ${{ steps.held.outputs.runs }}
        run: |
          set -euo pipefail
          read -r -a ids <<< "$RUNS"
          (( ${#ids[@]} > 0 )) || { echo "::error::the step before found no run to approve."; exit 1; }
          failed=0
          for id in "${ids[@]}"; do
            [[ $id =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a run id: $id"; exit 1; }
            if gh api --method POST "repos/$REPO/actions/runs/$id/approve" > /dev/null; then
              echo "Approved run $id."
            else
              echo "::error::run $id could not be approved."
              failed=1
            fi
          done
          exit "$failed"
      # While the environment post holds no key of the OSS Verify App (APP_KEY_SET; R10, until the LPS move of
      # dispatch://OSSV-321), each step before that needs the App did not run. This step says so in the run's summary.
      # For an approval whose held runs the step "The held runs of the screened head" found, the output head names
      # the head that the screen read: the comment job gives the pull request waits-on-theorem, with a label comment
      # that says that a person at Theorem approves its runs and that records the head, so that the rescreen pass
      # starts no second approval of it.
      - name: Say that the environment post has no key of the OSS Verify App
        id: no_key
        if: env.APP_KEY_SET != 'true'
        env:
          HEAD: ${{ needs.trust.outputs.head }}
          RUNS: ${{ steps.held.outputs.runs }}
        run: |
          set -euo pipefail
          echo "The environment \`post\` has no key of the OSS Verify App. So this run approved no held run," \
            "recorded or changed no check run \`repo-pairs/import-approved\`, and closed or reopened no pull request." \
            >> "$GITHUB_STEP_SUMMARY"
          [ -n "${RUNS:-}" ] || exit 0
          [[ $HEAD =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the trust job gave no head commit: $HEAD"; exit 1; }
          echo "::notice::GitHub holds the runs $RUNS of $HEAD. The environment post has no key of the OSS Verify" \
            "App, so the workflow approves none of them. A person at Theorem approves them."
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

  # The posts, with this run's own GitHub token: the review comment, the answer, the fix as one review of suggested
  # changes, the approved reply, or the comment that asks the author of a pull request with a merge conflict to resolve
  # it, and the state label and the label comment of each, which .github/review/rules.py sets from main's checkout of
  # .github/. A draft posts nothing but its label comment, after the review job uploaded it, and a relabel nothing but
  # the state label and the label comment of its head. A catch-up that closed and reopened the pull request posts
  # nothing but the line of its head in the label comment, and keeps the state label and the text of that comment. A
  # stop of the rescreen pass posts the label and the hold comment of its work alone. An approval whose head changes a
  # file under .github/ (the post job's output steering), or whose held runs the post job did not approve as the
  # environment post holds no key of the OSS Verify App (its output no_key), posts its state label and its label
  # comment alone. A review, an answer or a fix that the fresh reader refused posts nothing: the item gets
  # waits-on-theorem and a label comment with Sami's next step. A review, a rescreen, a relabel or an approval of a pull
  # request posts nothing at all when a review or a hold of its head is newer than the read of this run, or when a
  # withdrawal is newer than the screened pass of this run (the step "Skip the posts when the head has a review or hold
  # newer than this run's read, or a withdrawal newer than this run's screened pass").
  # No App token posts here, so none of these comments, reviews and labels starts a run of a workflow. It never commits
  # or pushes: its token can write no file of the repository. It runs whatever the post job's result, and reads that
  # job's recorded as false when it did not succeed. Whatever that result, it records in the label comment the
  # withdrawal of import check runs that the post job owes, with the run whose own comment gives the reason, and takes
  # that line out once a run finished it and a comment of the workflow gives a reason for it: its own review, for a
  # withdrawal that this run's review gave. A review or a rescreen of a pull request whose review job failed or was
  # cancelled after it gave a blocking finding or the verdict person (its outputs verdict and head are set) has a final
  # review: each step of the review job after "The comment, as it is posted" belongs to the fix. This job posts that
  # review as for a review that succeeded, while the pull request is still at the head of the review, and posts no fix.
  # Its label step gives the state of a review whose fix posted nothing (OSSV-221's architect, 2026-11-22 10:46Z). That
  # is so on each route, also on a review by hand with no screen. This job does not run after a review job that failed
  # or was cancelled before its verdict, nor after a pass: the post job decides nothing for such a review, so its label
  # comment could say that a screen passed a head that no screen passed. After a screen, the hold job holds such a run.
  comment:
    needs: [trust, gather, review, post]
    # GitHub's implicit success() skips a job with a skipped ancestor, and a writer's run skips the screen job. A reply
    # and a stop have no gather, screen or review job: they need the trust job alone. A catch-up needs a post job that
    # reopened the pull request (its output caught), and an approval one that approved no run of a head that changes a
    # file under .github/ (its output steering) or no held run of a head for lack of the App's key (its output no_key).
    # A review or a rescreen of a pull request whose review job failed or was cancelled after a blocking finding or the
    # verdict person needs the review job's outputs verdict and head.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main'
          && (((needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen'
                || needs.trust.outputs.task == 'answer' || needs.trust.outputs.task == 'draft')
               && needs.review.result == 'success')
              || ((needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen')
                  && (needs.review.result == 'failure' || needs.review.result == 'cancelled')
                  && (needs.review.outputs.verdict == 'blocking' || needs.review.outputs.verdict == 'person')
                  && needs.review.outputs.head != '')
              || ((needs.trust.outputs.task == 'conflict' || needs.trust.outputs.task == 'relabel'
                   || needs.trust.outputs.task == 'reply' || needs.trust.outputs.task == 'stop')
                  && needs.trust.result == 'success')
              || (needs.trust.outputs.task == 'catchup' && needs.post.result == 'success'
                  && needs.post.outputs.caught != '')
              || (needs.trust.outputs.task == 'approve' && needs.post.result == 'success'
                  && (needs.post.outputs.steering != '' || needs.post.outputs.no_key != ''))) }}
    # One at a time for each item, and none cancelled: GitHub keeps every pending one (queue: max). Every write of the
    # item's state label and label comment runs in this group, label-<n>: this job's, the hold job's, and a stop's, a
    # catch-up's and an approval's, which this job writes.
    concurrency:
      group: label-${{ needs.trust.outputs.number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # contents: read for main's .github/, which holds .github/review/rules.py; actions: read for the jobs of the run
    # that a line <!-- withdraw-owed <head> <why> <run> --> names, which give the time of that line when no hold or
    # withdrawal of that run gives one (rules.py line_written); checks: read for the import check runs of the head,
    # which the label step reads again before it writes the state import.
    permissions: {contents: read, issues: write, pull-requests: write, actions: read, checks: read}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ needs.trust.outputs.number }}
      BODY: ${{ needs.review.outputs.body }}
      # What the post job did at the head: false, and no decision, when that job did not succeed. IMPORTS is the value
      # of REPO_PAIRS_IMPORT_PATHS that its decision read, as JSON, and empty when it gave no decision. STANDING is true
      # for the decision hand when an import check run of the head still stands after that job.
      RECORDED: ${{ needs.post.result == 'success' && needs.post.outputs.recorded || 'false' }}
      DECISION: ${{ needs.post.result == 'success' && needs.post.outputs.decision || '' }}
      STANDING: ${{ needs.post.result == 'success' && needs.post.outputs.standing || 'false' }}
      IMPORTS: ${{ needs.post.result == 'success' && needs.post.outputs.decision != '' && needs.post.outputs.imports || '' }}
    steps:
      # main's .github/, for .github/review/rules.py; never the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with: {ref: main, persist-credentials: false, sparse-checkout: .github, sparse-checkout-cone-mode: false}
      # The withdrawal of the import check runs of a head that the post job owes (R12): it found a reason to withdraw
      # them, and GitHub refused the withdrawal, or the job failed before it (the post job's output owed, "<head>
      # <why>"). The label comment records it in the line <!-- withdraw-owed <head> <why> <run> -->
      # (.github/review/rules.py owed). <run> is the run whose own comment gives the reason (OSSV-221's architect,
      # 2026-11-22 17:27Z). It is this run (GITHUB_RUN_ID) when this run's own review of that head gives that verdict
      # (own=true). Else, as for a relabel whose withdrawal GitHub refused, rules.py keeps the run of the line of that
      # head and reason that stands, or names the run of the newest review comment of the head with that verdict, and
      # this run only when no such comment names a run (owed_run). Every later write of the label comment keeps the
      # line (KEPT). A relabel and a review by hand of that head withdraw again for its why while the line stands,
      # whatever the newest review says (rules.py verdict, held.sh relabel_withdraws): an edit of a review comment in
      # place can hide the review that gave the reason. Only a run that finished the withdrawal of that head takes the
      # line out (the post job's output withdrawn), and only while a comment of the workflow gives a reason for it: the
      # hold comment or the review comment of the line's run that gives its why, or a review comment of the head whose
      # run read the item after the time of the line (with no marker of that read: one that GitHub last changed after
      # it, and no pass), which must be screened unless the trust job's outside is false (OSSV-221's architect,
      # 2026-11-22 16:06Z and 16:08Z, 2026-11-23 01:47Z, and 2026-11-24 01:20Z and 01:26Z; rules.py word_time). That
      # time is the hold or the withdrawal of the line's run (the post job's output sources), or else when the step of
      # that run that wrote the line ended (2026-11-23 04:39Z). Until then, each later relabel withdraws and records
      # nothing. When the post job finished the withdrawal for a blocking finding or the verdict person of this run's
      # own review of that head, that review has not posted yet. So this step writes the line of that head and verdict
      # all the same (rules.py owed with owed= and withdrawn=), and gives the head to the step after the post of the
      # review (its output pending), which takes the line out once that review, which names this run, stands. When
      # GitHub refuses the post of the review, the line stays. This step reads the post job's outputs whatever that
      # job's result: GitHub fills them in at the end of that job, also when it failed. It is the first step after the
      # checkout, and its if reads no other step, so no step of this job that fails skips it: it runs for a relabel
      # whose post job failed too, which the label step leaves as it is, and for a review that GitHub refused to post.
      # The label step after it keeps the line. For an author whose write access GitHub did not give, the line goes in
      # all the same, as the post job withdraws for every author (OSSV-221's architect, 2026-11-23 01:47Z), but no line
      # goes out. A record of an owed withdrawal never makes a label comment: for an item with none, rules.py writes
      # nothing (status 3) and gives the line as this step's output line, which the label step gives to the label
      # comment that it writes (marker=<line>). The label step writes the line also when it stops for a hold made after
      # the run started (rules.py mark). Else, when the label step writes no label comment, the line of an item with no
      # label comment is not recorded. That is so when the step is skipped, stops before its label call, or leaves the
      # labels of a relabel whose post job failed, or of an author whose write access GitHub did not give. For a line
      # of this run's own review, rules.py gives status 0 for an item with no label comment, and the label step gets no
      # line: that review gives the reason once it posts.
      - name: Record a withdrawal that the post job owes
        id: owed
        if: env.POST_REVIEW == 'true' && (needs.post.outputs.owed != '' || needs.post.outputs.withdrawn != '')
        env:
          OWED: ${{ needs.post.outputs.owed }}
          WITHDRAWN: ${{ needs.post.outputs.withdrawn }}
          SOURCES: ${{ needs.post.outputs.sources }}
          TASK: ${{ needs.trust.outputs.task }}
          # The head that this run's review read, and its verdict.
          REVIEW_HEAD: ${{ needs.review.outputs.head }}
          VERDICT: ${{ needs.review.outputs.verdict }}
          # The trust job's outputs as they are, which .github/review/rules.py reads (the author-kind table).
          OUTSIDE: ${{ needs.trust.outputs.outside }}
          OUTSIDER: ${{ needs.trust.outputs.outsider }}
          AUTHOR_KIND: ${{ needs.trust.outputs.kind }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          [[ ${GITHUB_RUN_ID:-} =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a run id: ${GITHUB_RUN_ID:-}"; exit 1; }
          owed=${OWED:+$OWED $GITHUB_RUN_ID} own=false
          # This run's own review of the head gives a blocking finding or the verdict person: the line names this run,
          # whose review gives that verdict.
          if { [ "$TASK" = review ] || [ "$TASK" = rescreen ]; } && [ -n "${REVIEW_HEAD:-}" ] \
            && { [ "${VERDICT:-}" = blocking ] || [ "${VERDICT:-}" = person ]; }; then
            if [ "${WITHDRAWN:-}" = "$REVIEW_HEAD" ]; then
              # The post job finished the withdrawal: the line of that head and verdict stays until the review posts.
              owed="$WITHDRAWN $VERDICT $GITHUB_RUN_ID" own=true
              echo "pending=$WITHDRAWN" >> "$GITHUB_OUTPUT"
            elif [ "${OWED:-}" = "$REVIEW_HEAD $VERDICT" ]; then
              own=true
            fi
          fi
          rc=0
          python3 .github/review/rules.py owed "$NUMBER" owed="$owed" withdrawn="${WITHDRAWN:-}" own="$own" \
            sources="${SOURCES:-}" task="$TASK" outside="${OUTSIDE:-}" outsider="${OUTSIDER:-}" \
            author="${AUTHOR_KIND:-}" || rc=$?
          (( rc != 3 )) || exit 0
          exit "$rc"
      # Whether the posts of this run are skipped because a review or a hold of its head is newer than the read of this
      # run, or a withdrawal is newer than the screened pass of this run (OSSV-221's architect, 2026-11-24 01:20Z and
      # 01:26Z, (a)), for the tasks that read the head of a pull request: a review, a rescreen, a relabel and an
      # approval. Such a run posts nothing on the item: no review comment, no replacement of one, no fix, no label and
      # no label comment. The run of that newer word owns the comment and the label of the item. The posts are skipped
      # when the own record of this run recorded nothing for such a word (the post job's output gave_way: the decision
      # held, withdrawn or newer of a screened run), or when another run gave a word on the head that counts from a
      # time at or after STARTED, the time when the trust job of this run read the item (.github/review/rules.py
      # newer-word). A word is a review comment of the head, with any verdict, or a hold comment of the screen of the
      # head. A review or a hold counts from the time when its run read the item (its marker <!-- review-read <time> -->
      # or <!-- review-held-read <time> -->), never from when it posted (OSSV-221's architect, 2026-11-24 09:43Z, A3). A
      # hold with no such marker counts from when GitHub last changed it. A review with no such marker counts from when
      # GitHub last changed it for a blocking finding or the verdict person, and a pass with none never counts (rules.py
      # word_time). A word at STARTED counts, which fails closed. A
      # word of this run (an earlier attempt of it) does not count. A withdrawal skips the posts only through the
      # output gave_way, which only the own record of a screened pass gives: the pass of such a run counts from
      # STARTED. The decisions held and withdrawn of a relabel or of a review by hand set no output gave_way: such a run
      # read the head after that hold or withdrawal, so its read is the newer one. Its posts are still skipped for a
      # word that counts from a time at or after STARTED. The step "Record a withdrawal that the post job owes" runs
      # before this one: its line makes later runs withdraw, and it stays in the label comment.
      # When the item has no label comment, that step writes no line, and a run whose posts are skipped does not record
      # it. Such a run writes one line to its log and its summary, which names the word and its run, or the decision of
      # the post job, and says that the line stays. It writes the output gave_way too. Each later step that writes on
      # the item reads that output in its if. The step "Keep the review in the run's summary" still runs. A read that
      # fails fails this step, and nothing posts.
      - name: >-
          Skip the posts when the head has a review or hold newer than this run's read, or a withdrawal newer than
          this run's screened pass
        id: way
        if: >-
          env.POST_REVIEW == 'true' && (needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen'
          || needs.trust.outputs.task == 'relabel' || needs.trust.outputs.task == 'approve')
        env:
          GAVE_WAY: ${{ needs.post.outputs.gave_way }}
          # The head that this run read: its review's, or the trust job's for a relabel or an approval. An issue has
          # none.
          HEAD: ${{ needs.review.outputs.head || needs.trust.outputs.head }}
          STARTED: ${{ needs.trust.outputs.started }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          # The review of an issue reads no head.
          [ -n "${HEAD:-}" ] || exit 0
          [[ $HEAD =~ ^[0-9a-f]{40}$ ]] || { echo "::error::not a head commit: $HEAD. Nothing posts."; exit 1; }
          [[ $STARTED =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
            || { echo "::error::no start time of this run. Nothing posts."; exit 1; }
          [[ ${GITHUB_RUN_ID:-} =~ ^[1-9][0-9]*$ ]] \
            || { echo "::error::not a run id: ${GITHUB_RUN_ID:-}. Nothing posts."; exit 1; }
          case ${GAVE_WAY:-} in
            held) said="Its post job gave the decision held. A screen held $HEAD at or after that time." ;;
            withdrawn)
              said="Its post job gave the decision withdrawn. The newest import check run of $HEAD, by the time that"
              said+=" each one names, is not an approval. It counts as newer than each screened pass of $HEAD. Its"
              said+=" summary names a time at or after $STARTED, or no time." ;;
            newer)
              said="Its post job gave the decision newer. A review comment that counts from a time at or after that"
              said+=" time gives $HEAD a blocking finding or the verdict person." ;;
            "")
              found=$(python3 .github/review/rules.py newer-word "$NUMBER" "$HEAD" "$STARTED" "$GITHUB_RUN_ID") \
                || { echo "::error::the comments of #$NUMBER could not be read. Nothing posts."; exit 1; }
              [ "$found" != - ] || exit 0
              read -r other kind at <<< "$found"
              if [ "$kind" = hold ] && [ "$other" != - ]; then
                said="The screen of run $other held $HEAD, and its hold counts from $at, at or after that time."
              elif [ "$kind" = hold ]; then
                said="A screen held $HEAD, and its hold comment, which names no run, is from $at, at or after that"
                said+=" time."
              elif [ "$other" != - ]; then
                said="Run $other read #$NUMBER at $at, at or after that time, and its review gives $HEAD the verdict"
                said+=" $kind."
              else
                said="A review comment of $HEAD that names no run gives the verdict $kind, and GitHub last changed it"
                said+=" at $at, at or after that time."
              fi ;;
            *)
              echo "::error::the post job's output gave_way is not held, withdrawn or newer: $GAVE_WAY. Nothing posts."
              exit 1 ;;
          esac
          line="#$NUMBER: this run read #$NUMBER at $STARTED. $said So the later steps of this run post nothing on"
          line+=" #$NUMBER: no review, no fix, no label and no label comment. A withdraw-owed line that an earlier step"
          line+=" of this run wrote in the label comment, if any, stays."
          echo "$line"
          printf '%s\n' "$line" >> "$GITHUB_STEP_SUMMARY"
          echo "gave_way=true" >> "$GITHUB_OUTPUT"
      # The review comment: it replaces the newest review comment of the workflow on the item, or posts a new one when
      # there is none. A review with no screen in its run (its marker lines hold no <!-- review-screened <head> -->)
      # never replaces a screened review comment of the same head that gives a blocking finding or the verdict person:
      # it posts a comment of its own. A relabel and a review by hand read that screened review (rules.py verdict), and
      # withdraw the import check runs of the head for it, also after GitHub refused an earlier withdrawal. The
      # review of a review job that failed or was cancelled after its verdict posts here too, as that job gave it, but
      # only while the pull request is at the head of that review: a newer run of the same item and task cancels the
      # review job (its concurrency), and a new push replaces the review of the old head. When the head moved, this
      # step posts nothing, and the label step writes nothing either. A run whose posts the step before skipped posts
      # no review.
      - name: Post the review, or replace the one posted before
        if: >-
          env.POST_REVIEW == 'true' && (needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen')
          && needs.review.outputs.refused != 'review' && steps.way.outputs.gave_way != 'true'
        env:
          # The review job's result, and the head that the review read.
          REVIEWED: ${{ needs.review.result }}
          HEAD: ${{ needs.review.outputs.head }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ && -n $BODY ]] || { echo "::error::no review to post"; exit 1; }
          if [ "${REVIEWED:-}" = failure ] || [ "${REVIEWED:-}" = cancelled ]; then
            [[ ${HEAD:-} =~ ^[0-9a-f]{40}$ ]] \
              || { echo "::error::the review job gave no head commit: ${HEAD:-}"; exit 1; }
            now=$(gh api "repos/$REPO/pulls/$NUMBER" --jq .head.sha) || { echo "::error::no head of #$NUMBER"; exit 1; }
            if [ "$now" != "$HEAD" ]; then
              echo "#$NUMBER moved from $HEAD to $now, so this run posts no review of $HEAD."
              exit 0
            fi
          fi
          last=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- review -->")))
              | {id, body} | @json' | tail -n 1)
          id=""
          if [ -n "$last" ]; then
            # The id of that comment, or nothing when it is a screened review of this review's head with a blocking
            # finding or the verdict person and this review has no screen. The marker lines are at their fixed places.
            # shellcheck disable=SC2016 # $new, $o, $n and $h are jq's
            id=$(jq -r --arg new "$BODY" '(.body | split("\n")) as $o | ($new | split("\n")) as $n
              | ((($o[1] // "") | capture("^<!-- review-head (?<h>[0-9a-f]{40}) -->$") | .h) // "") as $h
              | if $h != "" and $n[1] == $o[1]
                   and (($o[2] // "") | test("^<!-- review-verdict " + $h + " (blocking|person)( will-fix)? -->$"))
                   and $o[3] == "<!-- review-screened " + $h + " -->" and $n[3] != "<!-- review-screened " + $h + " -->"
                then "" else .id end' <<< "$last")
            [ -n "$id" ] || echo "#$NUMBER: its newest review comment is a screened review of the same head that asks" \
              "for a change or has questions for Sami. This review had no screen, so it posts a comment of its own."
          fi
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -f body="$BODY" --jq .html_url
          else
            gh api --method POST "repos/$REPO/issues/$NUMBER/comments" -f body="$BODY" --jq .html_url
          fi
      # The line <!-- withdraw-owed <head> <why> <run> --> of this run's own review, which the step "Record a withdrawal
      # that the post job owes" wrote after the post job finished the withdrawal of that head (its output pending).
      # Once the review, whose marker <!-- review-run <run> --> names this run, stands, it gives the reason, and the
      # line goes (.github/review/rules.py owed). rules.py keeps the line while no review comment of this run gives the
      # head that verdict, as when this run posted no review: its head moved, or the fresh reader refused it. GitHub
      # runs this step only when no step before it failed, so a review that GitHub refused to post leaves the line. A
      # run whose posts were skipped writes nothing on the item, and the line stays.
      - name: Take out the line of a withdrawal that the posted review records
        if: steps.owed.outputs.pending != '' && steps.way.outputs.gave_way != 'true'
        env:
          PENDING: ${{ steps.owed.outputs.pending }}
          SOURCES: ${{ needs.post.outputs.sources }}
          TASK: ${{ needs.trust.outputs.task }}
          # The trust job's outputs as they are, which .github/review/rules.py reads (the author-kind table).
          OUTSIDE: ${{ needs.trust.outputs.outside }}
          OUTSIDER: ${{ needs.trust.outputs.outsider }}
          AUTHOR_KIND: ${{ needs.trust.outputs.kind }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          python3 .github/review/rules.py owed "$NUMBER" owed= withdrawn="$PENDING" own= sources="${SOURCES:-}" \
            task="$TASK" outside="${OUTSIDE:-}" outsider="${OUTSIDER:-}" author="${AUTHOR_KIND:-}"
      # The answer, once for each comment that it answers, from the comments of the item as they are just before it
      # posts. A comment of github-actions[bot] with the same text is this run's answer, which an earlier attempt of
      # this job posted. Any other answer of github-actions[bot] (it starts with <!-- review-answer ) that names the
      # same newest comment, or that GitHub made at or after the time when this run's trust job read the item
      # (STARTED), is the answer of another run, which answered a comment of this answer first: this run then posts no
      # answer, and no fix and no label either (the output other), whatever it read before. The step after this one
      # marks such a run, and the rescreen pass starts the answer of each comment that still waits. An answer whose
      # action is none, or that the fresh reader refused, posts nothing.
      - name: Post the answer
        id: answer
        if: needs.trust.outputs.task == 'answer' && needs.review.outputs.refused != 'answer'
        env:
          ANSWER: ${{ needs.review.outputs.answer }}
          STARTED: ${{ needs.trust.outputs.started }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          if [ -z "$ANSWER" ]; then
            echo "#$NUMBER: the comments of its author ask nothing, so no answer posts."
            exit 0
          fi
          marker=${ANSWER%%$'\n'*}
          re='^<!-- review-answer ([1-9][0-9]*)( will-fix [0-9a-f]{40})? -->$'
          [[ $marker =~ $re ]] || { echo "::error::the answer does not start with its marker."; exit 1; }
          id=${BASH_REMATCH[1]}
          if [ "$POST_REVIEW" != true ]; then
            printf '%s\n' "$ANSWER" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ $STARTED =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
            || { echo "::error::no start time of this run"; exit 1; }
          # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
          posted=$(PREFIX="<!-- review-answer $id " gh api --paginate "repos/$REPO/issues/$NUMBER/comments" --jq '.[]
            | select(.user.login == "github-actions[bot]" and ((.body // "") | startswith("<!-- review-answer ")))
            | if .body == $ENV.ANSWER then "this"
              elif (.body | startswith($ENV.PREFIX)) or (.created_at // "") >= $ENV.STARTED then "other"
              else empty end') \
            || { echo "::error::the comments of #$NUMBER could not be read"; exit 1; }
          if grep -qx this <<< "$posted"; then
            echo "#$NUMBER: this run posted its answer to the comment $id before."
          elif grep -qx other <<< "$posted"; then
            echo "#$NUMBER: another run answered a comment of this answer after this run read the item at $STARTED. This run posts no answer, no fix and no label."
            echo "other=true" >> "$GITHUB_OUTPUT"
          else
            gh api --method POST "repos/$REPO/issues/$NUMBER/comments" -f body="$ANSWER" --jq .html_url
          fi
      # Another run answered a comment of this run's answer first (the step before): this run posts nothing of its own.
      # The rescreen pass reads this step by its name (facts, its commented left) and starts the answer of each comment
      # that still waits.
      - name: Leave the answer to a later run
        if: steps.answer.outputs.other == 'true'
        run: echo "#$NUMBER gets no answer, fix or label from this run. The rescreen pass starts the answer of each comment that still waits."
      # The fix, as one review of suggested changes on the head (POST pulls/<n>/reviews, event COMMENT, commit_id the
      # head, one comment on the right side of the diff for each suggestion), once for each head: a review of
      # github-actions[bot] whose body starts with <!-- review-fix <head> --> is the fix posted already. A pull
      # request that moved on from the head is the next run's, and so is the fix of an answer that another run answered
      # first (Post the answer). A run whose posts were skipped posts no fix. The output posted tells the label step
      # that a fix review is there. Only a review job that succeeded gives a fix that posts: after a review job that
      # failed or was cancelled, no fix posts.
      - name: Post the fix as suggested changes
        id: fixed
        if: >-
          needs.review.outputs.fix != '' && steps.answer.outputs.other != 'true' && needs.review.result == 'success'
          && steps.way.outputs.gave_way != 'true'
        env:
          FIX: ${{ needs.review.outputs.fix }}
          HEAD: ${{ needs.review.outputs.head }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ && $HEAD =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no pull request or no head"; exit 1; }
          printf '%s\n' "$FIX" > "$RUNNER_TEMP/fix.json"
          marker="<!-- review-fix $HEAD -->"
          jq -e --arg head "$HEAD" --arg marker "$marker" 'keys == ["body", "comments", "commit_id", "event"]
            and .commit_id == $head and .event == "COMMENT" and (.body | type == "string" and startswith($marker + "\n"))
            and (.comments | type == "array" and length > 0
                 and all(.[]; (.path | type) == "string" and (.line | type) == "number" and .side == "RIGHT"
                              and (.body | type) == "string"))' "$RUNNER_TEMP/fix.json" > /dev/null \
            || { echo "::error::the fix is not one review of suggested changes at $HEAD with its marker."; exit 1; }
          if [ "$POST_REVIEW" != true ]; then
            jq -r '.body, (.comments[] | "\n`\(.path):\(.line)`\n\n\(.body)")' "$RUNNER_TEMP/fix.json" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          now=$(gh api "repos/$REPO/pulls/$NUMBER" --jq .head.sha) || { echo "::error::no head of #$NUMBER"; exit 1; }
          [ "$now" = "$HEAD" ] || { echo "#$NUMBER has moved on from $HEAD: the run of its new head decides."; exit 0; }
          # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
          posted=$(MARKER=$marker gh api --paginate "repos/$REPO/pulls/$NUMBER/reviews" --jq '.[]
            | select(.user.login == "github-actions[bot]" and ((.body // "") | startswith($ENV.MARKER + "\n"))) | .id') \
            || { echo "::error::the reviews of #$NUMBER could not be read"; exit 1; }
          if [ -n "$posted" ]; then
            echo "#$NUMBER: the fix of $HEAD posted before."
          else
            gh api --method POST "repos/$REPO/pulls/$NUMBER/reviews" --input "$RUNNER_TEMP/fix.json" --jq .html_url
          fi
          echo "posted=true" >> "$GITHUB_OUTPUT"
      # The approved reply to an issue of an outside author (.github/review-answer.md, "An issue draft"): the text of the
      # run by hand, byte for byte, with no trim, no change and no added line, once: a comment of github-actions[bot]
      # with the same body is the reply posted already. The text comes from the run's input through this step's
      # environment alone, never into the script. No job of the run reads or keeps it otherwise. The output id, the id
      # of the reply's comment, goes to the label comment as the marker <!-- issue-reply-posted <id> -->, after which the
      # trust job answers the comments of the issue's author.
      - name: Post the approved reply
        id: replied
        if: needs.trust.outputs.task == 'reply'
        env:
          REPLY: ${{ inputs.reply }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          [[ ${REPLY:-} =~ [^[:space:]] ]] || { echo "::error::the run gives no text of a reply. Nothing posts."; exit 1; }
          if [ "$POST_REVIEW" != true ]; then
            printf '%s\n' "$REPLY" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
          posted=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" --jq '.[]
            | select(.user.login == "github-actions[bot]" and .body == $ENV.REPLY) | .id') \
            || { echo "::error::the comments of #$NUMBER could not be read"; exit 1; }
          id=${posted%%$'\n'*}
          if [ -n "$id" ]; then
            echo "#$NUMBER: the approved reply posted before, as comment $id."
          else
            id=$(gh api --method POST "repos/$REPO/issues/$NUMBER/comments" -f body="$REPLY" --jq .id) \
              || { echo "::error::the approved reply could not be posted"; exit 1; }
            echo "#$NUMBER: the approved reply posted, as comment $id."
          fi
          [[ $id =~ ^[1-9][0-9]*$ ]] || { echo "::error::the approved reply has no comment id: $id"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      # A review settles the hold of the review: a request by hand, or a later push that the screen passed. So does a
      # stored draft, and an approved reply that posted, for the hold of the draft. Not the review of an older head: a
      # newer push may have been held since. Nor when a hold counts from a time at or after the start of this run: a
      # newer event of the issue or the pull request was held. A hold of the screen counts from the time when its run
      # read the item, and any other hold, or one with no marker of that read, from when GitHub last changed it
      # (rules.py word_time). A hold of an answer that is tried again leaves the state as it is, so one that came after
      # this run started stops the labels of an answer's run alone. An approved reply that posted is recorded
      # whatever came after it, since the trust job reads its marker. An answer settles only a hold of an answer (its
      # marker names the task answer): it answers each comment that waits, the held one too. Each work (the review, the
      # answer, the draft, the approval) has its own hold comment, and review-held stays on while the newest hold of
      # another work than this run's is one that the rescreen pass tries again and that work posted nothing since: the
      # rescreen pass takes that work again, and a rescreen needs the label. An answer also leaves the label on for a
      # hold of another work that is not tried again (the screen's, which waits on Sami), until that work posts. Then
      # the state label of the outcome, and the label comment (.github/review/rules.py), from the item's kind, the
      # trust job's outside, outsider and kind as they are (the author-kind table: an outside author's item gets its
      # state label; the item of an author whose write access GitHub did not give keeps its state label and its label
      # comment as they are; any other item gets no state label), the review's verdict, the two
      # stops of the fix (will_fix and fix_stop), whether a fix review posted, whether the post job recorded the import
      # check run at the head and its decision on it, the stored draft (its marker <!-- issue-draft <run>-<attempt> -->,
      # waits-on-theorem), the posted reply (its marker <!-- issue-reply-posted <id> -->, waits-on-author), and the text
      # that the fresh reader refused (waits-on-theorem, with Sami's step for it). An answer changes the state only when
      # the author said they will make the change, when a fix posted or stopped, or when the reader refused the answer or
      # the fix: else the label stays as the item's review, hold or reply set it. A relabel posts no review and leaves
      # review-held on: it sets the state of its head again from what the workflow wrote of that head
      # (.github/review/rules.py relabel): the verdict and will-fix of the review comment that names it, an answer's
      # will-fix at it, its fix reviews, and a hold comment that names it, the newer of a review and a hold first. With
      # only a merge conflict of the head in the label comment, which is gone now, it gives no state label and takes that
      # conflict's line out, so that the rescreen pass reviews the head; with nothing of the head, the labels stay. The
      # label comment of an outside pull request holds the marker line <!-- repo-pairs-import-paths <head>: <value> -->
      # of R12, with the value of REPO_PAIRS_IMPORT_PATHS that the post job's decision at the head read (this step's own
      # read when that job gave no decision), and its text names the step for the import by that value. So the rescreen
      # pass reads the value that the state rested on, and relabels the head when the variable changed since. An answer
      # that another run answered first (Post the answer) leaves the labels as that run set them. A relabel whose post
      # job ran and failed or was cancelled gave no decision on the import check run of its head. Its label comment
      # would then say that the screen and the review passed the head, also when no screen passed it or a later screen
      # held it. So it writes nothing, and the label and the label comment stay as the runs before it left them. The
      # step "Record a withdrawal that the post job owes", the first after the checkout, still records the withdrawal
      # that such a post job owes, in a label comment that the item has. After a post job that failed or was cancelled,
      # the rescreen pass's retry of the App's writes takes the head again (held.sh, due_retry). When that step found
      # no label comment (its output line), this step gives the line as marker=<line> to its label call, which writes a
      # label comment with the line in any state. When a hold made after this run started stops this step, it still
      # writes the line (rules.py mark). When this step writes no label comment otherwise, as for such a relabel, the
      # line of an item with no label comment is not recorded.
      # For the post job's decision hand (a review by hand, or a relabel, whose newest review of the head passed it with
      # no screen, after a screen passed the head in the run of an earlier review), that job recorded no check run. An
      # import check run of the head with conclusion success that still stands after it (its output standing) counts as
      # recorded: so the state is import while the variable is set, and decide, with Sami's steps, when none stands.
      # Just before it writes the state import (the post job recorded the check run, or one stands for the decision
      # hand, and the variable is set), this step reads the import check runs of the head again (OSSV-221's architect,
      # 2026-11-24 05:23Z): after the post job of this run, the post job of another run can withdraw that check run. It
      # writes the state import only while a check run of this pull request on the head with conclusion success stands
      # with the marker line of that value (rules.py import-marker). Else it writes the state of the decision withdrawn:
      # its text says that no comment gives the reason for the withdrawal yet. A read that fails fails this step before
      # it writes anything.
      # With the decision screened, the state follows this run's verdict, as for any review. With the decision withdrawn
      # of a relabel, the state decide gets its own text and Sami's step for a review by hand, in the place of the
      # passed text and the steps of the import (rules.py NO_REASON). After a review job that
      # failed or was cancelled after a blocking finding or the verdict person, the review posted and no fix did: the
      # facts are those of a review whose fix posted nothing (fix_posted false), so the state is change, person, or what
      # the rule gives for those facts. That review settles the hold of the review as any posted review does, so the
      # label review-held comes off as after any review: the rescreen pass reads a run whose comment job posted as one
      # that settled the hold (held.sh held_work), and the hold job holds no such run. A run whose posts were skipped
      # (the step "Skip the posts when the head has a review or hold newer than this run's read, or a withdrawal newer
      # than this run's screened pass") writes no label and no label comment: the run of that newer word owns them.
      - name: Take the label review-held off and set the state label
        if: >-
          env.POST_REVIEW == 'true' && needs.trust.outputs.task != 'conflict' && needs.trust.outputs.task != 'stop'
          && needs.trust.outputs.task != 'catchup' && needs.trust.outputs.task != 'approve'
          && steps.answer.outputs.other != 'true' && steps.way.outputs.gave_way != 'true'
        env:
          TASK: ${{ needs.trust.outputs.task }}
          # The head that the review read, or the head of a relabel, which the trust job read.
          HEAD: ${{ needs.trust.outputs.task == 'relabel' && needs.trust.outputs.head || needs.review.outputs.head }}
          STARTED: ${{ needs.trust.outputs.started }}
          # The post job's result: success, failure, cancelled, or skipped when it did not run.
          POSTED: ${{ needs.post.result }}
          KIND: ${{ needs.trust.outputs.task == 'relabel' && 'pr' || needs.gather.outputs.kind }}
          # The trust job's outputs as they are, which .github/review/rules.py reads (outside_author and the author-kind
          # table): outside true is an outside author, whose item gets its state label (R5); kind unknown changes no
          # state label and no label comment; any other author's item gets no state label.
          OUTSIDER: ${{ needs.trust.outputs.outsider }}
          OUTSIDE: ${{ needs.trust.outputs.outside }}
          AUTHOR_KIND: ${{ needs.trust.outputs.kind }}
          VERDICT: ${{ needs.review.outputs.verdict }}
          WILL_FIX: ${{ needs.review.outputs.will_fix }}
          FIX_STOP: ${{ needs.review.outputs.fix_stop }}
          FIX_POSTED: ${{ steps.fixed.outputs.posted }}
          DRAFT: ${{ needs.review.outputs.draft }}
          REPLIED: ${{ steps.replied.outputs.id }}
          REFUSED: ${{ needs.review.outputs.refused }}
          # The line <!-- withdraw-owed <head> <why> <run> --> that the step "Record a withdrawal that the post job
          # owes" did not write, as the item had no label comment.
          OWED_LINE: ${{ steps.owed.outputs.line }}
          # The import's paths, one glob on each line, while the import is live (R12), as this step reads them, for a run
          # whose post job gave no decision. An empty value is no variable: GitHub gives an empty value for a variable
          # that is not set.
          IMPORT_PATHS: ${{ vars.REPO_PAIRS_IMPORT_PATHS }}
        run: |
          set -uo pipefail
          [[ $STARTED =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
            || { echo "::error::no start time of this run"; exit 1; }
          if [ "${TASK:-}" = relabel ] && { [ "${POSTED:-}" = failure ] || [ "${POSTED:-}" = cancelled ]; }; then
            echo "#$NUMBER: the post job of this relabel failed or was cancelled, so the workflow changes neither its" \
              "labels nor its label comment."
            exit 0
          fi
          # The stored draft and the posted reply, each with the marker line that the label comment keeps.
          draft_stored=false reply_posted=false markers=()
          case ${TASK:-} in
            draft)
              [[ ${DRAFT:-} =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]] || { echo "::error::the review job names no stored draft"; exit 1; }
              draft_stored=true markers=("marker=<!-- issue-draft $DRAFT -->") ;;
            reply)
              [[ ${REPLIED:-} =~ ^[1-9][0-9]*$ ]] || { echo "::error::the approved reply has no comment id"; exit 1; }
              reply_posted=true markers=("marker=<!-- issue-reply-posted $REPLIED -->") ;;
          esac
          [ -z "${OWED_LINE:-}" ] || markers+=("marker=$OWED_LINE")
          if [ -n "$HEAD" ]; then
            now=$(gh api "repos/$REPO/pulls/$NUMBER" --jq .head.sha) || { echo "::error::no head of #$NUMBER"; exit 1; }
            [ "$now" = "$HEAD" ] \
              || { echo "#$NUMBER moved from $HEAD to $now, so the workflow changes neither its labels nor its label" \
                     "comment."; exit 0; }
          fi
          # The work of this run: the review (a review or a rescreen), the answer, or the draft (a draft or a reply).
          work=review
          case ${TASK:-} in
            answer) work=answer ;;
            draft|reply) work=draft ;;
          esac
          # works: the start of a jq filter that defines work, the work that a hold comment's body holds, as the trust
          # job's works gives it: the task of the marker of a hold that is tried again (review for a marker with no
          # task), else the title's.
          works='def work: (capture("\n<!-- review-held-(limit|cap|transient) [0-9]+(?: [0-9]+(?: (?<t>answer|draft|approve)(?: [1-9][0-9]*)?)?)? -->(\n|$)")
              | .t // "review")
            // (capture("^<!-- review-held -->\n[*][*]Automated (?<t>answer|reply|start of the checks|check for the import|close and reopen) held[.][*][*](\n|$)")
              | {"answer": "answer", "reply": "draft", "start of the checks": "approve", "check for the import": "import",
                 "close and reopen": "catchup"}[.t])
            // "review"; '
          # What the hold comments of github-actions[bot] say, as "<last> <pending> <unsettled> <own> <tried>".
          # last: the time from which the newest hold that stops this run's labels counts, - for none: each hold for an
          # answer's run, and for any other run each hold but one of an answer that is tried again. A hold of the
          # screen counts from the time when its run read the item (its marker <!-- review-held-read <time> -->), and
          # any other hold, or one with no such marker, from when GitHub last changed it (.github/review/rules.py
          # word_time; OSSV-221's architect, 2026-11-24 09:43Z, A3). pending: true
          # when the newest hold of another work than this run's is one that the rescreen pass tries again and that
          # work posted nothing since: no review that names the head of the hold (its marker
          # <!-- review-head <head> --> on the line after <!-- review -->, where the workflow writes it, never in the
          # text), for a held review or approval; no answer, for a held answer; no stored draft and no posted reply, for
          # a held draft. unsettled: true when the newest hold of another such work, tried again or not (the screen's,
          # which waits on Sami), is one that its work posted nothing since. own: true when the newest hold of this
          # run's work is tried again. tried: true when the hold of last, the newest hold that stops this run's labels,
          # is tried again.
          found=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" --jq '.[] | @json') \
            || { echo "::error::the comments of #$NUMBER could not be read"; exit 1; }
          # shellcheck disable=SC2016 # $ENV and the names bound in the filter are jq's
          held=$(W=$work jq -rs "$works"'map(select(.user.login == "github-actions[bot]")
              | {at: (.updated_at // ""), made: (.created_at // .updated_at // ""), body: (.body // "")}) as $ours
            | [$ours[] | select(.body | startswith("<!-- review-held -->")) | .work = (.body | work)
                | .tried = (.body | test("\n<!-- review-held-(limit|cap|transient) [0-9]+ "))
                | .head = ((.body | capture("\n<!-- review-held-head (?<h>[0-9a-f]{40}) -->(\n|$)") | .h) // "")
                | .word = (if (.body | contains("The automated screen held ")) and (.tried | not)
                    then (.body | capture("\n<!-- review-held-read (?<t>[0-9]{4}-[0-9]{2}-[0-9]{2}"
                      + "T[0-9]{2}:[0-9]{2}:[0-9]{2}Z) -->(\n|$)") | .t) // .at else .at end)] as $holds
            | def posted: . as $h
                | if .work == "answer" then any($ours[]; (.body | startswith("<!-- review-answer ")) and .made > $h.at)
                  elif .work == "draft" then any($ours[]; (.body | startswith("<!-- review-label -->"))
                    and (.body | test("\n<!-- (issue-draft [0-9]+-[0-9]+|issue-reply-posted [0-9]+) -->(\n|$)")))
                  else any($ours[]; (.body | startswith("<!-- review -->")) and .at > $h.at
                    and ($h.head == ""
                         or (.body | startswith("<!-- review -->\n<!-- review-head " + $h.head + " -->\n"))))
                  end;
              ($holds | group_by(.work) | map(max_by(.at) | select(.work != $ENV.W))) as $others
              | ($holds | map(select($ENV.W == "answer" or ((.work == "answer" and .tried) | not)))) as $stops
              | [($stops | map(.word) | max // "-"),
                 any($others[]; .tried and (posted | not)),
                 any($others[]; (.work | IN("review", "answer", "draft", "approve")) and (posted | not)),
                 ($holds | map(select(.work == $ENV.W)) | max_by(.at) | .tried // false),
                 ($stops | max_by(.word) | .tried // false)]
              | map(tostring) | join(" ")' <<< "$found") \
            || { echo "::error::the hold comments of #$NUMBER could not be read"; exit 1; }
          read -r last pending unsettled own tried <<< "$held"
          if [[ ${TASK:-} != reply && $last != - && ! $last < $STARTED ]]; then
            echo "#$NUMBER has a hold that counts from $last, after this run started at $STARTED: the labels stay."
            # OWED_LINE still goes into a label comment (rules.py mark): the step "Record a withdrawal that the post job
            # owes" did not write it. mark leaves the state label and the text of a label comment as they are. An item
            # with no label comment gets one with no state label, in a state that follows the hold of last (tried).
            # For a hold that the rescreen pass tries again, it is working: that hold comment gives the time from which
            # the workflow tries again. For any other hold (a hold of the screen, or a stop), it is after-hold, which
            # names Sami's next step in the words of the state screen (the state stopped says the same).
            state=after-hold
            [ "$tried" != true ] || state=working
            [ -z "${OWED_LINE:-}" ] \
              || python3 .github/review/rules.py mark "$NUMBER" "$OWED_LINE" "state=$state" || exit 1
            exit 0
          fi
          take_off() {
            local out
            out=$(gh api --method DELETE "repos/$REPO/issues/$NUMBER/labels/$HELD_LABEL" 2>&1) \
              || [[ $out == *"(HTTP 404)"* ]] || { echo "::error::the label could not be taken off: $out"; exit 1; }
          }
          # The variable's text, given only when it is set: an empty value is no variable. When the post job decided on
          # the import check at the head, the state rests on the value that its decision read (IMPORTS), not on this
          # step's read: the variable can change between the two jobs, and the label comment records that value.
          paths=$IMPORT_PATHS
          if [ -n "${IMPORTS:-}" ]; then
            paths=$(jq -je 'if . == null then "" elif type == "string" then . else error("not a value") end' \
              <<< "$IMPORTS" && printf .) \
              || { echo "::error::the post job gave no value of the import's paths"; exit 1; }
            paths=${paths%.}
          fi
          # approved: the post job recorded the import check run at the head, or, for its decision hand, one that an
          # earlier run recorded still stands (STANDING). The label rule reads it as its fact recorded, which gives the
          # state import while the variable is set. So just before that, this reads the import check runs of the head
          # again: with no check run of the OSS Verify App for this pull request (external_id <number>:<head>) with
          # conclusion success and the marker line of the value (rules.py import-marker), approved is false, and the
          # decision is withdrawn. The read asks for every check run of the head (filter=all).
          approved=$RECORDED decision=${DECISION:-}
          [ "$decision" != hand ] || [ "${STANDING:-}" != true ] || approved=true
          if [ "$approved" = true ] && [ -n "$paths" ]; then
            marker=$(python3 .github/review/rules.py import-marker "$HEAD" "$paths") || exit 1
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            found=$(SHA=$HEAD MARKER=$marker gh api --method GET --paginate "repos/$REPO/commits/$HEAD/check-runs" \
              -f check_name=repo-pairs/import-approved -f filter=all -F per_page=100 --jq '.check_runs[]
                | select(.name == "repo-pairs/import-approved" and .head_sha == $ENV.SHA
                         and (.app.id | tostring) == $ENV.OSS_VERIFY_APP_ID
                         and .external_id == "\($ENV.NUMBER):\($ENV.SHA)" and .conclusion == "success"
                         and (.output.text // "" | split("\n") | any(. == $ENV.MARKER))) | .id') \
              || { echo "::error::the import check runs of $HEAD could not be read, so the labels stay."; exit 1; }
            if [ -z "$found" ]; then
              echo "#$NUMBER: no import check run of $HEAD with the conclusion success and the marker of the import's" \
                "paths stands now. Another run withdrew the check run that the post job of this run recorded or" \
                "found. So the label comment gives the decision withdrawn, and it does not say that the workflow" \
                "recorded the check."
              approved=false decision=withdrawn
            fi
          fi
          will_fix=false fix_stop=false fix_posted=false verdict=$VERDICT
          [ "${WILL_FIX:-}" != true ] || will_fix=true
          [ "${FIX_STOP:-}" != true ] || fix_stop=true
          [ "${FIX_POSTED:-}" != true ] || fix_posted=true
          if [ "${TASK:-}" = answer ]; then
            if [ "$own" = true ] && [ "$unsettled" != true ]; then take_off; fi
            if [ "$will_fix" = false ] && [ "$fix_stop" = false ] && [ "$fix_posted" = false ] && [ -z "${REFUSED:-}" ]; then
              echo "#$NUMBER: the answer changes no state, so the labels stay."
              exit 0
            fi
          elif [ "${TASK:-}" != relabel ]; then
            if [ "$pending" = true ]; then
              echo "#$NUMBER: a hold of other work is tried again, so the label $HELD_LABEL stays on."
            else
              take_off
            fi
          fi
          facts=()
          [ -z "$paths" ] || facts=("import_paths=$paths")
          # The trust job's outputs as they are: rules.py reads the kind of the author from them (outside_author and
          # the author-kind table). The head names the marker line of R12 in the label comment of an outside pull
          # request (rules.py import-marker). A pull request with the review's verdict and no outside state gets the
          # state reviewed (rules.py), whoever started the run.
          run=(outside="${OUTSIDE:-}" outsider="${OUTSIDER:-}" author="${AUTHOR_KIND:-}")
          if [ "${TASK:-}" = relabel ]; then
            python3 .github/review/rules.py relabel "$NUMBER" "$HEAD" "${run[@]}" kind="$KIND" recorded="$approved" \
              decision="$decision" "${facts[@]}" "${markers[@]}"
            exit
          fi
          heads=()
          [[ ! $HEAD =~ ^[0-9a-f]{40}$ ]] || heads=("head=$HEAD")
          python3 .github/review/rules.py label "$NUMBER" task="${TASK:-}" "${run[@]}" kind="$KIND" verdict="$verdict" \
            will_fix="$will_fix" fix_stop="$fix_stop" fix_posted="$fix_posted" recorded="$approved" \
            decision="$decision" draft_stored="$draft_stored" reply_posted="$reply_posted" refused="${REFUSED:-}" \
            "${heads[@]}" "${facts[@]}" "${markers[@]}"
      - name: Keep the review in the run's summary
        if: >-
          env.POST_REVIEW != 'true' && (needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen')
          && needs.review.outputs.refused != 'review'
        run: printf '%s\n' "$BODY" >> "$GITHUB_STEP_SUMMARY"
      # A pull request with a merge conflict starts no CI run, and so no review: its author resolves the conflict, and
      # the next push starts both. One comment for each head, which says so, and a label comment that holds
      # <!-- review-conflict-state <head> --> (.github/review/rules.py), with the trust job's outputs as they are (the
      # author-kind table): an outside author's pull request gets waits-on-author, which takes the place of
      # waits-on-theorem; any other pull request gets no state label; and when GitHub did not say whether the author has
      # write access, the comment on the conflict posts, but the state labels and the label comment stay as they are.
      # The comment stays as the record of the conflict; the label comment's line goes when a later state of the item
      # takes its place.
      - name: Ask the author to resolve the merge conflict
        if: needs.trust.outputs.task == 'conflict'
        env:
          HEAD: ${{ needs.trust.outputs.head }}
          OUTSIDE: ${{ needs.trust.outputs.outside }}
          OUTSIDER: ${{ needs.trust.outputs.outsider }}
          AUTHOR_KIND: ${{ needs.trust.outputs.kind }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          [[ $HEAD =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no head commit of #$NUMBER"; exit 1; }
          marker="<!-- review-conflict $HEAD -->"
          body=$(printf '%s\n%s\n\n%s\n' "$marker" "**Merge conflict with \`main\`** at commit ${HEAD:0:12}." \
            "GitHub runs no checks on a pull request with a merge conflict, so the automated review does not run. Merge \`main\` into the branch, or rebase the branch on \`main\`. Resolve each conflict. Then push the branch. After the push, the checks and the automated review run again.")
          if [ "$POST_REVIEW" != true ]; then
            printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
          posted=$(MARKER=$marker gh api --paginate "repos/$REPO/issues/$NUMBER/comments" --jq '.[]
            | select(.user.login == "github-actions[bot]" and (.body | startswith($ENV.MARKER))) | .id') \
            || { echo "::error::the comments of #$NUMBER could not be read"; exit 1; }
          if [ -n "$posted" ]; then
            echo "#$NUMBER: the comment on the conflict at $HEAD was posted before."
          else
            gh api --method POST "repos/$REPO/issues/$NUMBER/comments" -f body="$body" --jq .html_url
          fi
          python3 .github/review/rules.py label "$NUMBER" task=conflict outside="${OUTSIDE:-}" \
            outsider="${OUTSIDER:-}" author="${AUTHOR_KIND:-}" conflict=true head="$HEAD"
      # A stop of the rescreen pass (rescreen.yml): the work of the item that the trust job decided again is not tried
      # again. First the state label of the stop's fact (tries_used_up, or left_closed for a pull request that a
      # catch-up closed and could not reopen), with Sami's next step in the label comment (.github/review/rules.py, with
      # the trust job's outputs as they are: the author-kind table gives the state label to an outside author's item,
      # none to any other, and no change of the state label or the label comment when GitHub did not say whether the
      # author has write access), then the hold comment of the stop, which names the head of a pull request, in the
      # place of the hold comment that the trust job picked for it by the one rule of each writer of a hold comment
      # (held.sh replaced_hold, which halt calls): never a hold of other work, nor a hold of the screen, which a relabel
      # and a review by hand read. Else it posts a new one. A label that could not be set leaves the hold comment and
      # its marker as they are, so the next rescreen pass decides the stop again, and so does a hold comment that could
      # not be written. Nothing is written when a comment of the workflow on the item changed at or after the time that
      # the trust job took before it read the comments (started): a hold, a review, an answer or the label comment of
      # another run. The next rescreen pass decides from it.
      # Nor when the pull request is at another head now than the one that the stop names, which the trust job read
      # (halt): the stop is stale, and the run's summary says so (.github/review/rules.py hold-head, the one check of
      # each writer of a hold comment). A stop of an issue names no head.
      - name: Say that the work of the item is not tried again
        if: needs.trust.outputs.task == 'stop'
        env:
          STOP: ${{ needs.trust.outputs.stop }}
          STARTED: ${{ needs.trust.outputs.started }}
          OUTSIDE: ${{ needs.trust.outputs.outside }}
          OUTSIDER: ${{ needs.trust.outputs.outsider }}
          AUTHOR_KIND: ${{ needs.trust.outputs.kind }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          [[ $STARTED =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
            || { echo "::error::no start time of this run"; exit 1; }
          field() { jq -r --arg k "$1" '.[$k] // "" | strings' <<< "$STOP"; }
          fact=$(field fact) id=$(field id) title=$(field title) text=$(field text) head=$(field head)
          [[ $fact == tries_used_up || $fact == left_closed ]] || { echo "::error::the stop names no fact of a label"; exit 1; }
          [[ -z $id || $id =~ ^[1-9][0-9]*$ ]] || { echo "::error::the stop names no comment id"; exit 1; }
          [[ -z $head || $head =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the stop names no head commit"; exit 1; }
          [[ -n $title && -n $text ]] || { echo "::error::the stop has no title or text of a hold comment"; exit 1; }
          # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
          changed=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" --jq '.[]
            | select(.user.login == "github-actions[bot]" and ((.body // "") | startswith("<!-- review"))
                     and (.updated_at // "") >= $ENV.STARTED) | .id') \
            || { echo "::error::the comments of #$NUMBER could not be read"; exit 1; }
          if [ -n "$changed" ]; then
            echo "#$NUMBER: a comment of the workflow on it was posted or changed at or after $STARTED. The trust job" \
              "read the clock at that time, before it read the comments. So this run writes nothing. The next" \
              "rescreen pass decides again."
            exit 0
          fi
          rc=0
          python3 .github/review/rules.py hold-head "$NUMBER" "$head" || rc=$?
          (( rc != 3 )) || exit 0
          (( rc == 0 )) || exit 1
          python3 .github/review/rules.py label "$NUMBER" task=stop outside="${OUTSIDE:-}" outsider="${OUTSIDER:-}" \
            author="${AUTHOR_KIND:-}" "$fact=true" \
            || { echo "::error::the label of #$NUMBER could not be set. The next rescreen pass decides the stop again."; exit 1; }
          body=$(printf '%s\n%s\n\n%s' '<!-- review-held -->' "**$title**" "$text")
          [ -z "$head" ] || body+=$'\n\n'"<!-- review-held-head $head -->"
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -f body="$body" --jq .html_url
          else
            gh api --method POST "repos/$REPO/issues/$NUMBER/comments" -f body="$body" --jq .html_url
          fi
      # A catch-up that closed and reopened the pull request, or only reopened it (the post job's caught, its head
      # now): the label comment records that head in the line <!-- review-catchup <head> --> (.github/review/rules.py
      # mark), which every later label comment keeps. The state label and the text of the label comment stay as they
      # are: the review of the CI run that the reopen starts sets them. An item with no label comment gets one, of
      # the state in which the workflow still works on it. The rescreen pass reads the line, so that it catches up
      # each head once, however long ago (rescreen.yml, catchup).
      - name: Record the catch-up of the head
        if: env.POST_REVIEW == 'true' && needs.trust.outputs.task == 'catchup'
        env:
          CAUGHT: ${{ needs.post.outputs.caught }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          [[ $CAUGHT =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::the post job names no head that it caught up: $CAUGHT"; exit 1; }
          python3 .github/review/rules.py mark "$NUMBER" "<!-- review-catchup $CAUGHT -->"
      # An approval whose head changes a file under .github/ or 3,000 files or more (the post job's steering, the head
      # that it read): the post job approved no run of it, so Sami, a person at Theorem with write access, approves its
      # runs (R10). The item gets waits-on-theorem, and its label comment says so and holds the line
      # <!-- review-steering <head> --> (.github/review/rules.py), which every later label comment keeps. The rescreen
      # pass and the trust job read that line, so that no run of the pass screens that head again for its approval.
      # An approval whose held runs the post job found while the environment post held no key of the OSS Verify App
      # (the post job's no_key, the head that the screen read) gets waits-on-theorem the same way, with a label comment
      # that says that the workflow cannot approve the runs yet, and the line <!-- review-no-key <head> -->, which the
      # rescreen pass reads (held.sh, due_approve). Nothing is written when the pull request moved on from the head:
      # the new head gets an approval of its own. Nothing is written either when the posts of this run were skipped.
      # The label call gives the trust job's outputs as they are (the author-kind table): the post job approves the held
      # runs of an outside author's pull request alone, so only such an approval comes here.
      - name: Say that a person at Theorem approves the runs of the head
        if: env.POST_REVIEW == 'true' && needs.trust.outputs.task == 'approve' && steps.way.outputs.gave_way != 'true'
        env:
          STEERING: ${{ needs.post.outputs.steering }}
          NO_KEY: ${{ needs.post.outputs.no_key }}
          OUTSIDE: ${{ needs.trust.outputs.outside }}
          OUTSIDER: ${{ needs.trust.outputs.outsider }}
          AUTHOR_KIND: ${{ needs.trust.outputs.kind }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          # The fact of the state, and the head that the post job read.
          fact=steering head=$STEERING
          [ -n "$STEERING" ] || fact=no_key head=$NO_KEY
          [[ $head =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::the post job gave no head commit for the label comment: $head"; exit 1; }
          now=$(gh api "repos/$REPO/pulls/$NUMBER" --jq .head.sha) || { echo "::error::no head of #$NUMBER"; exit 1; }
          [ "$now" = "$head" ] \
            || { echo "#$NUMBER moved from $head to $now, so the workflow changes neither its labels nor its" \
                   "label comment."; exit 0; }
          python3 .github/review/rules.py label "$NUMBER" task=approve outside="${OUTSIDE:-}" outsider="${OUTSIDER:-}" \
            author="${AUTHOR_KIND:-}" "$fact=true" head="$head"

  # A pull request or an issue that the screen held, that could not be gathered or screened, whose review the screen
  # passed but that did not finish (SCREENED_HOURLY_CAP among the causes), or whose account is at OUTSIDE_HOURLY_LIMIT:
  # the label review-held, and one comment that says it was held, which a later hold of the same work replaces: the
  # review (a review or a rescreen), the answer, the draft and the approval each have their own hold comment, so that a
  # hold of one never takes the place of the hold of another, and the rescreen pass takes each again. A hold of the
  # screen of a head is replaced only by a later hold of the screen of that same head: a relabel and a review by hand
  # read it. The one rule of each writer of a hold comment says so (held.sh replaced_hold). A hold of a pull request
  # whose head is not its head now is stale: it writes no hold comment and changes no label (rules.py hold-head). The
  # comment says nothing of why the screen held it: the screen job's one output is its verdict. A hold that the
  # rescreen pass tries again ends with the marker <!-- review-held-<kind> <run> <tries> -->, by which the pass finds it
  # and the account: limit (OUTSIDE_HOURLY_LIMIT); cap, a screened review stopped at SCREENED_HOURLY_CAP; or transient,
  # a screened review that failed otherwise or ran out of time, while it has failed fewer than REVIEW_TRIES times. <run>
  # is the run of the event this hold comes from (a run that takes the hold again keeps it), and <tries> the screened
  # reviews of it that failed so far. The marker of an answer's hold ends with the task and the comment that it answers:
  # <!-- review-held-<kind> <run> <tries> answer <comment id> -->, and the marker of a draft's hold with the task:
  # <!-- review-held-<kind> <run> <tries> draft -->, so that the rescreen pass tries the answer again as the answer of
  # that comment, and the draft as a draft, which posts nothing, and never either as a review. Such a hold gives the
  # UTC time when the item is tried again, and no state label: the workflow still works on the item. An answer's hold
  # of that kind leaves the state label as it is: the state of the item does not wait for the answer. An approval has
  # no review, so it is held only at the limit, with the marker <!-- review-held-limit <run> <tries> approve -->, or by
  # its screen, whose hold says that the checks of the pull request have not run. A hold that is not tried again (the
  # screen's, or the last try of a review, an answer or a draft) gives waits-on-theorem and a label comment that names
  # Sami's next step (.github/review/rules.py, from main's checkout of .github/). The label call gives the trust job's
  # outside, outsider and kind as they are (the author-kind table). Only an outside author's item gets the state label
  # (R5). Any other item, as a writer's pull request whose head an outsider pushed and whose screen held it, gets that
  # label comment, with its marker <!-- waits-on-theorem: Sami -->, but no state label. When GitHub did not say whether
  # the author has write access, the state labels and the label comment stay as they are, but review-held and the hold
  # comment go on, as they are the hold's. Each hold of a pull request also names the head that the run read, in the
  # marker <!-- review-held-head <head> -->, by which the pass tells which head a hold stops, and after it the id of the
  # run that wrote it, in the marker <!-- review-held-run <run> -->. A hold of the screen of a pull request names,
  # between those two, the time when the trust job of this run read the item, in the marker
  # <!-- review-held-read <time> -->: each reader counts the hold from that time, never from when it posts
  # (.github/review/rules.py word_time; OSSV-221's architect, 2026-11-24 09:43Z, A3). A cancelled screen holds nothing,
  # nor a screened review or answer that a newer run of the same item and task cancelled: that run decides.
  # Nor a screened review or rescreen of a pull request whose review job failed or was cancelled after a blocking
  # finding or the verdict person (its outputs verdict and head are set): its review is final, and the comment job
  # posts it with no fix (OSSV-221's architect, 2026-11-22 10:46Z). Nor a run that judged nothing of the item, by the
  # one rule of what counts as a try (held.sh try_rule): in this attempt of the run, a step whose name starts with "Sign
  # in" failed in its screen job, its review job's step "Sign in to Anthropic" failed (before any model), or its post
  # job's "Sign in as the OSS Verify App to approve" failed. Such a run gets no comment, no label and no try, and the
  # rescreen pass takes the item again. The post job's "Sign in as the OSS Verify App" and the review job's two
  # sign-ins of the fresh reader are not such steps: the label step says why. The if below cannot see the steps of
  # another job, so a screen job that failed at its sign-in starts this job, which reads this attempt's jobs first and
  # stops. It needs the post job: before its label step, it records the withdrawal of import check runs that this run
  # owes, as the comment job does, which does not run for a held screen. That record never makes a label comment: the
  # label step writes the line for an item with none. After its label step, it takes the line of a withdrawal that the
  # post job finished out, once the hold comment of this run for the head stands. A review, a rescreen or an approval
  # of a pull request on the route screen holds nothing when a review or a hold of its head is newer than the read of
  # this run (the step "Skip the posts of this run when a review or hold of the head is newer than this run's read").
  hold:
    needs: [trust, gather, screen, review, post]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main'
      && (needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen'
          || needs.trust.outputs.task == 'answer' || needs.trust.outputs.task == 'draft'
          || needs.trust.outputs.task == 'approve')
      && (needs.trust.outputs.route == 'limit'
      || (needs.trust.outputs.route == 'screen'
          && (needs.gather.result == 'failure' || needs.screen.result == 'failure'
              || (needs.screen.result == 'success' && needs.screen.outputs.verdict != 'clean')
              || (needs.screen.outputs.verdict == 'clean'
                  && (needs.review.result == 'failure' || needs.review.result == 'cancelled')
                  && ((needs.review.outputs.verdict != 'blocking' && needs.review.outputs.verdict != 'person')
                      || needs.review.outputs.head == '')))))
    # One at a time for each item, and none cancelled: GitHub keeps every pending one (queue: max). It is the item's
    # group label-<n>, as the comment job's: every write of the item's state label and label comment runs in it.
    concurrency:
      group: label-${{ needs.trust.outputs.number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions: read for this run's jobs (did a sign-in fail? was the review stopped at the cap?) and this workflow's
    # runs (did a newer run of the item and task cancel it?); pull-requests: write reads the open pull requests too,
    # which map a head to its pull request, and the head of this pull request now (is the hold stale?); checks: read
    # for the notices of a newer CI run's trust job, which name its pull request; contents: read for main's .github/,
    # which holds .github/review/rules.py and .github/review/held.sh.
    permissions: {contents: read, issues: write, pull-requests: write, actions: read, checks: read}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ needs.trust.outputs.number }}
      TASK: ${{ needs.trust.outputs.task }}
      ROUTE: ${{ needs.trust.outputs.route }}
      # The trust job's outputs as they are, which the label call gives .github/review/rules.py (the author-kind table).
      OUTSIDER: ${{ needs.trust.outputs.outsider }}
      OUTSIDE: ${{ needs.trust.outputs.outside }}
      AUTHOR_KIND: ${{ needs.trust.outputs.kind }}
      # The account whose OUTSIDE_HOURLY_LIMIT the run counts on, which a hold at the limit names: the item's author,
      # or the account of the latest event.
      ACCOUNT: ${{ needs.trust.outputs.account }}
      # true when the account counts as at its limit because the trust job did not read every run that could count
      # on it: the hold then does not say that the account had that many screens.
      UNCOUNTED: ${{ needs.trust.outputs.uncounted }}
      REVIEW: ${{ needs.review.result }}
      ORIGIN: ${{ needs.trust.outputs.origin }}
      TRIES: ${{ needs.trust.outputs.tries }}
      # The comment that an answer answers, which the marker of its hold names.
      COMMENT: ${{ needs.trust.outputs.comment }}
      # The head of a pull request, as the trust job read it, which each hold of a pull request names.
      HEAD: ${{ needs.trust.outputs.head }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      # main's .github/, for .github/review/rules.py and .github/review/held.sh; never the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with: {ref: main, persist-credentials: false, sparse-checkout: .github, sparse-checkout-cone-mode: false}
      # A screen of this run that held the head, in a review, a rescreen or an approval: the tasks whose post job
      # withdraws for a held screen (the author-kind table's withdraw). The if alone reads the screen, and the step
      # writes only the literal output held=true, which the next step reads: no step of this job reads anything else
      # of the screen.
      - name: Whether the screen of this run held the item in a review, a rescreen or an approval
        id: screened
        if: >-
          (needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen'
           || needs.trust.outputs.task == 'approve')
          && needs.screen.result == 'success' && needs.screen.outputs.verdict != 'clean'
        run: echo "held=true" >> "$GITHUB_OUTPUT"
      # The withdrawal of the import check runs of a head that this run owes (R12), in the line
      # <!-- withdraw-owed <head> <why> <run> --> of the label comment (.github/review/rules.py owed), as the comment
      # job's step "Record a withdrawal that the post job owes" records it: the post job's outputs owed and withdrawn,
      # whatever that job's result. <run> is the run whose own comment gives the reason (OSSV-221's architect,
      # 2026-11-22 17:27Z): for the post job's output owed, rules.py keeps the run of the line of that head and reason
      # that stands, or names the run of the comment that gives it, and this run (GITHUB_RUN_ID) only when no such
      # comment names a run (own=false). In a review, a rescreen or an approval, a screen of this run that held the head
      # of a pull request owes that withdrawal too: these are the tasks whose post job withdraws for a held screen (the
      # author-kind table's withdraw), and an answer or a draft withdraws nothing. So for such a screen (the output held
      # of the step before) this step writes the line <head> screen <run> itself, with this run, whose hold comment
      # gives the reason (own=true), also when the post job's output withdrawn names that head: the line stays until
      # the hold comment of this run for the head posts (OSSV-221's architect, 2026-11-22 14:21Z and 16:06Z). For a
      # withdrawal that the post job finished, the step after the label step takes the line out (this step's output
      # pending). In some runs the post job does not run, or does not finish its withdrawal. A later run that finds no
      # import check run of the head with conclusion success takes the line out, once the hold comment of this run
      # names the head, or a review comment of the head stands whose run read the item after the time of the line
      # (rules.py word_time): the hold or the withdrawal of the line's run (the post job's output sources), or else
      # when the step of that run that wrote the line ended. The step runs before the label step, which can fail. A
      # record of an owed withdrawal never makes a label comment: for an item with none, rules.py writes nothing (status
      # 3) and gives the line as this step's output line, which the label step gives to the label comment that its
      # label call writes (marker=<line>). When the label step writes no label comment (it stops before its label call:
      # a run that judged nothing (held.sh try_rule), a newer run, a stale hold, an answer's hold that is tried again,
      # or an error), the line of an item with no label comment is not recorded. For a withdrawal that the post job
      # finished, rules.py gives status 0 for an item with no label comment, and the label step gets no line: the hold
      # comment gives the reason once it posts.
      - name: Record a withdrawal that this run owes
        id: owed
        if: >-
          env.POST_REVIEW == 'true' && (needs.post.outputs.owed != '' || needs.post.outputs.withdrawn != ''
          || steps.screened.outputs.held == 'true')
        env:
          OWED: ${{ needs.post.outputs.owed }}
          WITHDRAWN: ${{ needs.post.outputs.withdrawn }}
          SOURCES: ${{ needs.post.outputs.sources }}
          # true when the screen of this run held the head in a review, a rescreen or an approval (the step before).
          SCREEN_HELD: ${{ steps.screened.outputs.held }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          [[ ${GITHUB_RUN_ID:-} =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a run id: ${GITHUB_RUN_ID:-}"; exit 1; }
          owed=${OWED:+$OWED $GITHUB_RUN_ID} own=false
          if [ "${SCREEN_HELD:-}" = true ] && [[ ${HEAD:-} =~ ^[0-9a-f]{40}$ ]]; then
            owed="$HEAD screen $GITHUB_RUN_ID" own=true
            # The post job finished the withdrawal of the head: the line stays until the hold comment of this run names
            # the head.
            [ "${WITHDRAWN:-}" != "$HEAD" ] || echo "pending=$HEAD" >> "$GITHUB_OUTPUT"
          fi
          [ -n "$owed" ] || [ -n "${WITHDRAWN:-}" ] || exit 0
          rc=0
          python3 .github/review/rules.py owed "$NUMBER" owed="$owed" withdrawn="${WITHDRAWN:-}" own="$own" \
            sources="${SOURCES:-}" task="$TASK" outside="${OUTSIDE:-}" outsider="${OUTSIDER:-}" \
            author="${AUTHOR_KIND:-}" || rc=$?
          (( rc != 3 )) || exit 0
          exit "$rc"
      # Whether the posts of this run are skipped because a review or a hold of its head is newer than the read of this
      # run, as the comment job's step that skips its posts decides it (OSSV-221's architect, 2026-11-24 01:20Z and
      # 01:26Z, (a)), for a review, a rescreen or an approval of a pull request on the route screen, which read a head.
      # Another run gave a word on the head that counts from a time at or after STARTED, the time when the trust job of
      # this run read the item: a review comment of the head, or a hold comment of the screen of the head. Each counts
      # from the time when its run read the item (its marker <!-- review-read <time> --> or
      # <!-- review-held-read <time> -->), never from when it posted (OSSV-221's architect, 2026-11-24 09:43Z, A3). A
      # hold with no such marker counts from when GitHub last changed it, and a pass with none never counts. A word at
      # STARTED counts, which fails closed, and a word of this run does not (.github/review/rules.py newer-word): the
      # hold of an earlier attempt of this run never makes it give way. This job reads no withdrawal.
      # Then the later steps of this run post nothing on the item: no hold comment, no label and no label comment. The
      # run of that newer word owns them. The step "Record a withdrawal that this run owes" runs before this one, and
      # its line stays. This step writes one line to its log and the run's summary, which names the word and its run
      # and says that the line stays, and the output gave_way, which the steps after it read. An answer and a draft
      # read no head, and a hold at the limit ran no screen: this step does not run for them. A read that fails fails
      # this step, and nothing is held.
      - name: Skip the posts of this run when a review or hold of the head is newer than this run's read
        id: way
        if: >-
          needs.trust.outputs.route == 'screen' && needs.trust.outputs.head != ''
          && (needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen'
              || needs.trust.outputs.task == 'approve')
        env:
          STARTED: ${{ needs.trust.outputs.started }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          [[ $HEAD =~ ^[0-9a-f]{40}$ ]] || { echo "::error::not a head commit: $HEAD. Nothing is held."; exit 1; }
          [[ $STARTED =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
            || { echo "::error::no start time of this run. Nothing is held."; exit 1; }
          [[ ${GITHUB_RUN_ID:-} =~ ^[1-9][0-9]*$ ]] \
            || { echo "::error::not a run id: ${GITHUB_RUN_ID:-}. Nothing is held."; exit 1; }
          found=$(python3 .github/review/rules.py newer-word "$NUMBER" "$HEAD" "$STARTED" "$GITHUB_RUN_ID") \
            || { echo "::error::the comments of #$NUMBER could not be read. Nothing is held."; exit 1; }
          [ "$found" != - ] || exit 0
          read -r other kind at <<< "$found"
          if [ "$kind" = hold ] && [ "$other" != - ]; then
            said="The screen of run $other held $HEAD, and its hold counts from $at, at or after that time."
          elif [ "$kind" = hold ]; then
            said="A screen held $HEAD, and its hold comment, which names no run, is from $at, at or after that time."
          elif [ "$other" != - ]; then
            said="Run $other read #$NUMBER at $at, at or after that time, and its review gives $HEAD the verdict $kind."
          else
            said="A review comment of $HEAD that names no run gives the verdict $kind, and GitHub last changed it at"
            said+=" $at, at or after that time."
          fi
          line="#$NUMBER: this run read #$NUMBER at $STARTED. $said So the later steps of this run post nothing on"
          line+=" #$NUMBER: no hold comment, no label and no label comment. A withdraw-owed line that an earlier step"
          line+=" of this run wrote in the label comment, if any, stays."
          echo "$line"
          printf '%s\n' "$line" >> "$GITHUB_STEP_SUMMARY"
          echo "gave_way=true" >> "$GITHUB_OUTPUT"
      # The hold comment, the label review-held, the state label and the label comment, unless the step before skipped
      # the posts of this run.
      - name: Label it and say that it was held
        if: steps.way.outputs.gave_way != 'true'
        env:
          # The line <!-- withdraw-owed <head> <why> <run> --> that the step "Record a withdrawal that this run owes"
          # did not write, as the item had no label comment. The label call below gives it to the label comment that
          # it writes.
          OWED_LINE: ${{ steps.owed.outputs.line }}
          # The time when the trust job of this run read the item, which a hold of the screen of a pull request names
          # in the marker <!-- review-held-read <time> -->, as the review of the comment job names it in its marker
          # <!-- review-read <time> -->.
          STARTED: ${{ needs.trust.outputs.started }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          [[ $RUN_ID =~ ^[1-9][0-9]*$ && $RUN_ATTEMPT =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a run id or attempt"; exit 1; }
          [[ $REVIEW_TRIES =~ ^[1-9][0-9]*$ ]] || { echo "::error::REVIEW_TRIES is not a number"; exit 1; }
          # .github/review/held.sh, from main's checkout of .github/, for two rules: try_rule, of what counts as a try
          # of a run (next), and replaced_hold, of each writer of a hold comment (below).
          seen=$(mktemp -d -p "$RUNNER_TEMP")
          source "$GITHUB_WORKSPACE/.github/review/held.sh"
          # Every step of this file that exists to get a token, or to show that the run can get one, has a name that
          # starts with "Sign in", and no other step has: the screen job's two, the review job's three, and the post
          # job's two. A new such step must be named so too. In the screen job, that name alone makes a failure of the
          # step judge nothing; in another job, try_rule must name the step for that.
          # This attempt of the run judged nothing of the item when tried (try_rule) gives signin: a step whose name
          # starts with "Sign in" failed in the screen job, the review job's first sign-in (before any model) failed, or
          # the post job's "Sign in as the OSS Verify App to approve" failed. Then this job writes no comment and no
          # label, and counts no try, and the rescreen pass takes the item again. The review job's two sign-ins of the
          # fresh reader are not such steps: the model ran before them, and the second comes after the verdict
          # (OSSV-221's architect, 2026-11-22 06:23Z). So this job holds a run that failed at the first, as a review, an
          # answer or a draft that did not finish, and counts a try. It holds an answer that failed at the second too. A
          # review that failed at the second gave a blocking finding: the if of this job takes no such run, and the
          # comment job posts that review. The post job's "Sign in as the OSS Verify App" is not such a step either.
          # In a run that this job holds, that step signs in only to withdraw the import check runs of the head that
          # the screen held. So the screen judged the item, and this job writes the hold with the workflow's token,
          # whatever that sign-in did. This job needs the post job, so the jobs that it reads always show that step.
          # tried also gives cap for a review stopped at the hourly cap (below), which counts no try. Only signin stops
          # the hold: this run has not finished, so tried can give running here. A run at the limit ran no job but the
          # trust job: this job reads no jobs for it, and its hold counts no try. When the jobs cannot be read, nothing
          # is held, so that a run that judged nothing is never held: this job fails instead.
          tried=""
          if [ "$ROUTE" != limit ]; then
            gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" --jq '.jobs[] | @json' \
              > "$seen/attempt" \
              || { echo "::error::the jobs of this run could not be read, so nothing is held: the rescreen workflow takes the item again."; exit 1; }
            judged=$(jq -rs "$try_rule"'"\(tried) \([judges_nothing] | first // "")"' "$seen/attempt")
            read -r tried signin <<< "$judged"
            if [ "$tried" = signin ]; then
              line="#$NUMBER is not held: the step \"$signin\" failed in this run. This run writes no hold comment and no label, and counts no try. The rescreen workflow takes the item again at its next run."
              echo "$line"
              printf '%s\n' "$line" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          tries=${TRIES:-0}
          [[ $tries =~ ^[0-9]+$ ]] || tries=0
          kind=""
          # The fact that this hold gives the label rule (.github/review/rules.py): held, for a hold that is tried
          # again, with no state label; screen_held or tries_used_up, for a hold that is not, with waits-on-theorem.
          fact=held
          # What was held, for the texts: the review of the item, the answer to the comments of its author, the draft of
          # the reply to an issue, or the approval of a first-time contributor's held runs.
          work_of="the automated review" title="Automated review held."
          if [ "$TASK" = answer ]; then
            work_of="the automated answer to your comment" title="Automated answer held."
          elif [ "$TASK" = draft ]; then
            work_of="the automated reply" title="Automated reply held."
          elif [ "$TASK" = approve ]; then
            work_of="the automated start of the checks" title="Automated start of the checks held."
          fi
          if [ "$ROUTE" != limit ] && [ "$REVIEW" = cancelled ]; then
            # A newer run of the same item and task (its next push, its next comment, its rescreen, or a request by
            # hand) cancels this run's review: only such a run is in the review job's concurrency group. That run
            # decides, whoever asked for this one. Not a newer run whose trust job was skipped (a CI run that was
            # cancelled, say), failed or was cancelled, nor one that its trust job stopped (every job after it was
            # skipped: the CI run of a pull request into another branch, say): it decides nothing, so this run holds the
            # item. A trust job not listed yet, still running, or passed with a job after it that was not skipped may
            # still decide. A run's name gives its task and item: #<n> ends at a space or at the end of the name, and a
            # workflow_run's head maps to its pull request through the open pull requests. When more than one pull
            # request into main has that head (another fork can push the same commit), a CI run is this item's only
            # when the notice of its trust job names this item or names none, as the rescreen pass reads it
            # (reviewed): the trust job reviews each CI run as the run of one pull request alone. A run whose notices
            # cannot be read is taken as this item's. GitHub gives at most 1,000 runs for a list with created, the
            # newest first, and total_count then says that more match: when it cut the list before it reached this
            # run, a newer run can be one that it does not list, and nothing is held.
            [[ $TASK =~ ^[a-z]+$ ]] || { echo "::error::not a task: $TASK"; exit 1; }
            same="^$TASK #$NUMBER( |\$)"
            pushed='^review ([0-9a-f]{40}) by '
            routed='^#([1-9][0-9]*): the task [a-z]+, the route [a-z]+\.$'
            halted='^No [a-z]+ of #([1-9][0-9]*): '
            heads=""
            # Before the runs of each page, "= <total_count> <runs on the page> <the oldest run on the page>".
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            newer=$(gh api --method GET --paginate "repos/$REPO/actions/workflows/review.yml/runs" \
              -f created=">=$(date -u -d '-1 day' +%Y-%m-%dT%H:%M:%SZ)" -F per_page=100 \
              --jq '"= \(.total_count // (.workflow_runs | length)) \(.workflow_runs | length) \([.workflow_runs[].id] | min // 0)",
                (.workflow_runs[]
                | select(.id > ($ENV.RUN_ID | tonumber) and (.event == "workflow_run" or .event == "issues"
                         or .event == "issue_comment" or .event == "workflow_dispatch"))
                | "\(.id) \(.event) \(.display_title // "" | gsub("[\r\n]"; " "))")') \
              || { echo "::error::the runs of this workflow could not be read"; exit 1; }
            awk -v run="$RUN_ID" '$1 == "=" { if ($2 > total) total = $2; listed += $3
                if ($3 > 0 && (oldest == "" || $4 < oldest)) oldest = $4 }
              END { exit (listed < total && (oldest == "" || oldest > run)) }' <<< "$newer" \
              || { echo "::error::GitHub lists at most 1,000 runs of this workflow since a day ago, and the runs that it" \
                     "does not list can be newer than this run. Nothing is held."; exit 1; }
            while read -r id event name; do
              [ -n "$id" ] && [ "$id" != = ] || continue
              [[ $id =~ ^[0-9]+$ ]] || { echo "::error::a run id is not a number"; exit 1; }
              shared=""
              if [[ $name =~ $same ]]; then
                :
              elif [[ $TASK == review && $event == workflow_run && $name =~ $pushed ]]; then
                sha=${BASH_REMATCH[1]}
                if [ -z "$heads" ]; then
                  heads=$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
                    --jq '.[] | "\(.head.sha) \(.number) \(.base.ref)"') \
                    || { echo "::error::the open pull requests could not be read"; exit 1; }
                  heads=${heads:--}
                fi
                awk -v s="$sha" -v n="$NUMBER" '$1 == s && $2 == n { found = 1 } END { exit !found }' <<< "$heads" \
                  || continue
                (( $(awk -v s="$sha" '$1 == s && $3 == "main" { n++ } END { print n + 0 }' <<< "$heads") < 2 )) \
                  || shared=1
              else
                continue
              fi
              jobs=$(gh api --method GET --paginate "repos/$REPO/actions/runs/$id/jobs" -F per_page=100 \
                --jq '.jobs[] | @json') || { echo "::error::the jobs of run $id could not be read"; exit 1; }
              # "<the trust job's verdict> <its check run>": skipped, failure or cancelled, its conclusion; stopped when
              # every job after it was skipped; else running, for a run that may still decide.
              read -r trust check <<< "$(jq -rs '(map(select(.name == "trust")) | first) as $t
                | map(select(.name != "trust" and .name != "rescreen")) as $rest
                | (if $t == null then "running"
                   elif ($t.conclusion // "") | IN("skipped", "failure", "cancelled") then $t.conclusion
                   elif $t.status == "completed" and ($rest | length) > 0 and ($rest | all(.conclusion == "skipped"))
                   then "stopped" else "running" end)
                  + " " + (($t // {}) | .check_run_url // "" | split("/") | last | if . == "" then "-" else . end)' \
                <<< "$jobs")"
              case $trust in
                skipped|failure|cancelled|stopped) continue ;;
              esac
              if [ -n "$shared" ] && [[ $check =~ ^[1-9][0-9]*$ ]]; then
                told=""
                notes=$(gh api --method GET --paginate "repos/$REPO/check-runs/$check/annotations" -F per_page=100 \
                  --jq '.[] | select(.annotation_level == "notice") | .message // "" | gsub("[\r\n]"; " ")') || notes=""
                while IFS= read -r note; do
                  if [[ $note =~ $routed || $note =~ $halted ]]; then
                    told=${BASH_REMATCH[1]}
                    break
                  fi
                done <<< "$notes"
                if [ -n "$told" ] && [ "$told" != "$NUMBER" ]; then
                  echo "Run $id is the CI run of #$told, which has the same head: not a run of #$NUMBER."
                  continue
                fi
              fi
              echo "A newer run of #$NUMBER ($TASK) cancelled this run's review: that run decides."
              exit 0
            done <<< "$newer"
          fi
          data=$(gh api "repos/$REPO/issues/$NUMBER" --jq '[(if .pull_request then "pr" else "issue" end), (.user.login // "-")] | join(" ")') \
            || { echo "::error::#$NUMBER could not be read"; exit 1; }
          read -r item author <<< "$data"
          what="this pull request"
          [ "$item" = pr ] || what="this issue"
          # The rescreen pass (rescreen.yml) takes a hold with a marker once its comment is an hour old, at its first
          # run after that, which an event starts. Such a hold says that first, then that the author does not need to do
          # anything, then why. A limit hold ends with a paragraph of its own: the account can still be at its limit at
          # the first such event after the time that the hold gives. Then the pass starts no run and leaves the hold
          # comment as it is (rescreen.yml, pace), and a later event of the list starts the screen. The other holds end
          # with only that a new hold replaces this comment, since a rescreen can be held for another cause than theirs.
          # The events are those on which the pass takes the open items (the top of rescreen.yml). The hold of an
          # approval has one more: a push to its own pull request, or a reopen, on which CI runs, starts
          # screen-start.yml. Its run of the pass, with the number of that pull request, takes the hold of that approval
          # when GitHub holds a run of the head. That run takes no other hold, and no other item.
          next=$(date -u -d '+1 hour' '+%Y-%m-%d %H:%M UTC')
          events=$'\n\n'"- A CI run in this repository ends."$'\n'"- Someone pushes to \`main\`."$'\n'"- Someone opens or reopens an issue."
          [ "$TASK" != approve ] \
            || events+=$'\n'"- Someone pushes to this pull request or reopens it, and its checks wait for approval."
          events+=$'\n\n'
          again="The workflow screens $what again at the first of these events after $next:${events}You do not need to do anything."$'\n\n'
          again_other="If the workflow holds $what again, this comment says why."
          # The account that the screen was for (OUTSIDER): the item's author, or else the account of the latest event.
          from="${what^} comes from an account without write access to this repository."
          [ "$OUTSIDER" = "$author" ] || from="The latest event of $what comes from an account without write access to this repository."
          if [ "$ROUTE" = limit ]; then
            [[ $OUTSIDER =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || { echo "::error::not a GitHub login: $OUTSIDER"; exit 1; }
            # The account at the limit (ACCOUNT, the trust job's account; with none, the account of the event): the
            # item's author, or else the account of the latest event. A CI run of a pull request whose author and pusher
            # both have no write access uses the limit of the author: the comment then names both.
            account=${ACCOUNT:-$OUTSIDER}
            [[ $account =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || { echo "::error::not a GitHub login: $account"; exit 1; }
            kind=limit
            limit="The workflow screens the pull requests, issues, pushes and comments of such an account before it reviews or answers them. The limit for one such account is $OUTSIDE_HOURLY_LIMIT screens in the last hour."
            who="this account" whose="this account"
            if [ "$account" != "$author" ]; then
              why="The latest event of $what comes from an account without write access to this repository. $limit"
            elif [ "$OUTSIDER" = "$account" ]; then
              why="The author of $what has an account without write access to this repository. $limit"
            else
              who="the account of the author" whose="the author"
              why="The latest event of $what comes from an account without write access to this repository. For this event, the workflow uses the limit of the author of $what, who also has an account without write access. $limit"
            fi
            # A trust job that did not read every run of the last hour that could count on the account counts it as at
            # its limit (UNCOUNTED): the account can have had fewer screens, so the comment does not say that it had
            # that many.
            if [ "${UNCOUNTED:-}" = true ]; then
              why+=" The workflow did not read all of its own runs of the last hour that can count toward the limit of $whose. So the workflow treats $who as at that limit."
            else
              why+=" ${who^} is at that limit."
            fi
            why="$again$why"$'\n\n'"${who^} can still be at the limit at the first event of the list above after $next. Then the workflow keeps $what held and screens it at a later event of that list."
          elif [ -z "$OUTSIDER" ]; then
            # A run by hand that asked for the screen first: no account's limit, and no try again.
            if [ "$REVIEW" = failure ] || [ "$REVIEW" = cancelled ]; then
              fact=tries_used_up
              why="The automated review did not finish. The workflow does not try it again. The automated screen passed $what."
            else
              fact=screen_held
              why="The automated screen held $what, so the automated review did not run. You do not need to do anything."
            fi
          elif [ "$REVIEW" = failure ] || [ "$REVIEW" = cancelled ]; then
            # Stopped at SCREENED_HOURLY_CAP: tried (read above) gives cap, as the review job's step "Hold at the hourly
            # cap" failed in this attempt of this run. Such a run counts no try (try_rule).
            if [ "$tried" = cap ]; then
              kind=cap
              why="$again$from The automated screen passed $what. The workflow runs at most $SCREENED_HOURLY_CAP automated reviews and answers each hour for such accounts, and it already ran $SCREENED_HOURLY_CAP. $again_other"
            else
              tries=$((tries + 1))
              if (( tries < REVIEW_TRIES )); then
                kind=transient
                why="$again$from The automated screen passed $what, but $work_of did not finish. This was try $tries of $REVIEW_TRIES. $again_other"
              else
                fact=tries_used_up
                why="${work_of^} did not finish after $tries tries. The workflow does not try it again. $from The automated screen passed $what."
              fi
            fi
          else
            fact=screen_held
            if [ "$TASK" = answer ]; then
              why="The automated screen held $what, so the workflow wrote no answer. You do not need to do anything."
            elif [ "$TASK" = approve ]; then
              why="The automated screen held this pull request, so its checks have not run. You do not need to do anything."
            elif [ "$TASK" = draft ]; then
              why="The automated screen held this issue, so the workflow wrote no reply. You do not need to do anything."
            else
              why="The automated screen held $what, so the automated review did not run. You do not need to do anything."
            fi
          fi
          marker=""
          if [ -n "$kind" ]; then
            [[ $ORIGIN =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a run id: $ORIGIN"; exit 1; }
            # The task that takes the hold again, when it is not a rescreen, and the comment of an answer.
            suffix=""
            case $TASK in
              answer)
                [[ ${COMMENT:-} =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a comment id: ${COMMENT:-}"; exit 1; }
                suffix=" answer $COMMENT" ;;
              draft|approve) suffix=" $TASK" ;;
            esac
            marker=$'\n'"<!-- review-held-$kind $ORIGIN $tries$suffix -->"
          fi
          # The head of a pull request that the run read, which the rescreen pass reads: a hold that is not tried again
          # stops the work on that head. For a hold of the screen (the fact screen_held), after it, the time when the
          # trust job of this run read the item (STARTED): each reader of the order of the words on the head counts this
          # hold from that time, never from when it posts, as it counts a review from its marker
          # <!-- review-read <time> --> (.github/review/rules.py word_time; OSSV-221's architect, 2026-11-24 09:43Z,
          # A3). A STARTED that is not a time stops the hold before it posts. Last, the id of this run (GITHUB_RUN_ID,
          # as the step that owes writes it in the line of a withdrawal): the line of this run's screen goes once this
          # hold stands (owe, in rules.py).
          if [[ ${HEAD:-} =~ ^[0-9a-f]{40}$ ]]; then
            [[ ${GITHUB_RUN_ID:-} =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a run id: ${GITHUB_RUN_ID:-}"; exit 1; }
            marker+=$'\n'"<!-- review-held-head $HEAD -->"
            if [ "$fact" = screen_held ]; then
              [[ ${STARTED:-} =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
                || { echo "::error::not a time when this run read the item: ${STARTED:-}. Nothing is held."; exit 1; }
              marker+=$'\n'"<!-- review-held-read $STARTED -->"
            fi
            marker+=$'\n'"<!-- review-held-run $GITHUB_RUN_ID -->"
          fi
          body=$(printf '%s\n%s\n\n%s\n%s' '<!-- review-held -->' "**$title**" "$why" "$marker")
          # A hold of a pull request names the head that the trust job read (HEAD). When the pull request is at another
          # head now, as GitHub gives it to .github/review/rules.py hold-head, the hold is stale: this job writes no
          # hold comment and changes no label, and the run's summary says so. So it never takes the place of the hold of
          # the screen of the current head. That check is the one of each writer of a hold comment. A hold of an issue
          # (item, as GitHub gives it above) reads no head, and goes on.
          head="" named=""
          [[ ! ${HEAD:-} =~ ^[0-9a-f]{40}$ ]] || head=$HEAD
          [ "$item" != pr ] || named=$head
          rc=0
          python3 .github/review/rules.py hold-head "$NUMBER" "$named" || rc=$?
          (( rc != 3 )) || exit 0
          (( rc == 0 )) || exit 1
          # Adding a label that does not exist makes it, so a failed creation (two holds at once) only loses its colour
          # and its description.
          python3 .github/review/rules.py make-label "$HELD_LABEL"
          gh api --method POST "repos/$REPO/issues/$NUMBER/labels" -f "labels[]=$HELD_LABEL" --jq '.[].name' > /dev/null
          # The hold comment that this hold replaces, by the one rule of each writer of a hold comment (held.sh
          # replaced_hold), or none, and then this hold posts a new comment. Its work is the task of its marker for a
          # hold that is tried again (review for a marker with no task), else the work of its title, as the trust job's
          # works gives it. A hold of other work stays as it is. A hold of the screen (fact screen_held) replaces a hold
          # of the screen of the same head, or one that is not the screen's. Any other hold never replaces a hold of the
          # screen: a relabel and a review by hand read it (rules.py verdict, held.sh relabel_withdraws).
          work=review
          case $TASK in answer|draft|approve) work=$TASK ;; esac
          screen=false
          [ "$fact" != screen_held ] || screen=true
          id=$(replaced_hold "$NUMBER" "$work" "$screen" "$head") \
            || { echo "::error::the comments of #$NUMBER could not be read"; exit 1; }
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -f body="$body" --jq .html_url
          else
            gh api --method POST "repos/$REPO/issues/$NUMBER/comments" -f body="$body" --jq .html_url
          fi
          # An answer's hold that is tried again leaves the state label and the label comment as they are: the next
          # step of the item does not change while its answer waits.
          if [ "$TASK" = answer ] && [ "$fact" = held ]; then
            echo "#$NUMBER: the answer is held and tried again, so its state label stays."
            exit 0
          fi
          # The state label and the label comment of the hold's fact, by the author-kind table for the hold job and the
          # trust job's outputs as they are: only an outside author's item gets the state label. The line of an owed
          # withdrawal that the step before did not write (OWED_LINE) goes into that label comment.
          owing=()
          [ -z "${OWED_LINE:-}" ] || owing=("marker=$OWED_LINE")
          python3 .github/review/rules.py label "$NUMBER" task=hold outside="${OUTSIDE:-}" outsider="${OUTSIDER:-}" \
            author="${AUTHOR_KIND:-}" "$fact=true" "${owing[@]}"
      # The line <head> screen <run> that the step "Record a withdrawal that this run owes" wrote after the post job
      # finished the withdrawal of the head (its output pending). Once the hold comment of this run for the head stands
      # (its marker <!-- review-held-run <run> -->), it gives the reason, and the line goes (.github/review/rules.py
      # owed). rules.py keeps the line while no hold comment of the screen of this run names the head, as when the step
      # before posted no hold comment: a run that judged nothing, a newer run, or a stale hold. GitHub runs this step
      # only when no step before it failed, so a hold comment that GitHub refused to post leaves the line. A run whose
      # posts were skipped writes nothing on the item, and the line stays.
      - name: Take out the line of a withdrawal that the posted hold records
        if: steps.owed.outputs.pending != '' && steps.way.outputs.gave_way != 'true'
        env:
          PENDING: ${{ steps.owed.outputs.pending }}
          SOURCES: ${{ needs.post.outputs.sources }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          python3 .github/review/rules.py owed "$NUMBER" owed= withdrawn="$PENDING" own= sources="${SOURCES:-}" \
            task="$TASK" outside="${OUTSIDE:-}" outsider="${OUTSIDER:-}" author="${AUTHOR_KIND:-}"
