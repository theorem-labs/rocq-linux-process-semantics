# review.yml: Claude reviews pull requests into main and issues by the rules in .github/review.md, and the review is
# posted as a comment there.
#
# Two workflows. CI (.github/workflows/ci.yml) runs on pull_request with the copy of ci.yml at the pull request's merge
# commit, a token that can only read, no secret and no identity token. This file runs when such a CI run completes
# (workflow_run), and on issues, issue_comment, schedule and workflow_dispatch. GitHub runs each of these events with
# main's copy of this file, so a pull request, from a fork or not, cannot change what runs here. From the CI run, the
# jobs that hold a right take only its head commit, its head repository and the pull requests that GitHub names in it.
# The trust job takes the one of those into main. For a fork's pull request GitHub names none, and the trust job finds
# it among the open ones into main by the head commit and the head repository. A CI run of a pull request into another
# branch starts no review. The jobs read the head, the author, the text and the diff from the GitHub API, and never
# download an artifact of the CI run. The CI run's results reach the review as data: the head's check runs and
# statuses (.review/checks.json). A run by hand on a ref other than main runs no job: the if of each job
# checks the ref, so such a run holds no identity and posts nothing. GitHub's == compares strings with no case, so
# refs/heads/MAIN passes such an if: the step of the trust job, which every other job needs, and the step of the
# rescreen job, which runs without it, also compare the ref byte for byte in the shell, and stop on any other ref.
#
# Tasks. The trust job gives each run one task, and the jobs after it do that task alone:
#   review    a pull request's new head (the workflow_run of its CI run), a new issue of an account with write access,
#             or a run by hand with a number: the review comment, and for a blocking finding of an outside pull request
#             the fix, as one review of suggested changes.
#   answer    a new comment of an outside item's author in its conversation (issue_comment): the answer to each
#             comment of the author that waits, and the fix when a comment asks for it.
#   draft     a new issue of an outside author: a draft of the reply, which is uploaded as an artifact of the run and
#             not posted.
#   reply     a run by hand with a reply text that Sami approved, which is posted as it is.
#   rescreen  a held item, screened again (below).
#   approve   a first-time contributor's pull request whose CI runs GitHub holds: the screen, and, when it passes, the
#             approval of the held runs. A run by hand with the task review on such a pull request gets this task.
#   catchup   an outside pull request whose head no run met: the OSS Verify App closes and reopens it, which starts CI.
#             A pull request that a catch-up closed and could not reopen is only reopened.
#   conflict  a pull request with a merge conflict, for which GitHub starts no CI run: a comment that asks its author
#             to resolve the conflict.
#   relabel   the import check run of R12 and the label and the label comment of a head, set again with no model from
#             what the workflow wrote of the head: its review, an answer of its author, its fixes and a hold comment.
#   measure   the screen, measured on its private labelled set.
# An answer run, or a run by hand, that reads a merge conflict in its pull request gets the task conflict. The name of a
# run gives its task, its item and the account whose limit it counts on (run-name, below). The scripts that count runs
# read that name, and #<n> in it ends at a space or at the end of the name, so that #12 is never #123.
#
# Who is screened. Write access is what GitHub's collaborator permission API answers: admin or write (maintain counts
# as write). Membership of the organisation alone is not write access. The Apps in APPS count as having it.
#
# - When the item's author has write access, and so does the account whose action started the run, it is reviewed.
# - Otherwise it is screened first (the screen job, .github/screen.py). Independent checks read the text that the
#   account wrote: Google Cloud Model Armor's prompt injection and jailbreak filter, always; Azure AI Content Safety's
#   Prompt Shields, and a small Claude model with no tools whose answer a schema holds to the words clean and
#   suspicious, each when its identity is set up below. When every check that ran answers clean it is reviewed, as a
#   writer's is. Otherwise, and when a check that ran cannot answer, it is held: it gets the label review-held and a
#   short comment, and no review. Why it was held goes to a private bucket, never to this run's log or outputs. When
#   the account that started the run has no write access and its runs have reached the screen OUTSIDE_HOURLY_LIMIT
#   times in the last hour, it is held without a screen, and screened again later with no person (below).
# - An item held for a reason that is not its own is taken again with no person: at that limit; a screened review
#   stopped at SCREENED_HOURLY_CAP; or a screened review, answer or draft that failed or ran out of time, until it has
#   failed REVIEW_TRIES times. After REVIEW_TRIES runs since its hold that end with neither a new hold nor a post, its
#   hold comment says that it is not tried again; a run that ended at a failed sign-in counts no try. The review, the
#   answer, the draft and the approval of an item each have their own hold comment, so that a hold of one never takes
#   the place of the hold of another. Every 15 minutes (the schedule below) the rescreen job lists the open pull
#   requests and issues labelled review-held, and for each of those works whose newest hold comment is such a hold,
#   not the screen's, and is over an hour old, it starts this workflow with the task that the marker of the hold
#   names: the answer of the comment that it names (-f task=answer -f comment=<id>), the draft, the approval, or else
#   -f task=rescreen, with the account the hold names (-f account=<login>). Such a run takes an outsider's path: the
#   trust job reads the author, the hold and the account again from the API, never from the inputs alone, and the item
#   is screened, then reviewed and the review posted, as for an event; only when the author and that account both have
#   write access is it reviewed without the screen, as a writer's item is. When that account has no write access, its
#   screen counts toward the account's OUTSIDE_HOURLY_LIMIT with the account's own runs, so an account still at the
#   limit stays held, and its hold comment says from when it is tried again. An account with write access has no such
#   limit: its rescreens are bounded by the rescreen job's count alone (below). An item that the screen held is never
#   taken again this way. The same job also starts the answer to a comment of an outside author that waits for one,
#   the draft of the reply to an outside issue that has none stored, the approval of a first-time contributor's held
#   runs, the catch-up and the review of a head that no run reviewed, the comment on a merge conflict, a relabel when
#   a conflict went away or the import's paths changed, and the App's writes again when the post job could not make
#   them (the rescreen job, below).
# - An account with write access can start a run by hand for any pull request or issue, with a task (-f task=<task>,
#   review when none is given) and, for a review, with the screen first (-f screen=true):
#
#   gh workflow run review.yml -R theorem-labs/rocq-linux-process-semantics -f number=<n>
#
# or "Run workflow" on this workflow's page in the Actions tab. GitHub lets only an account with write access start a
# run that way. An App must be one of the APPS. A run that github-actions[bot] starts (the rescreen job's) is taken
# only for that job's tasks, and only when its name is the one that job gives the task, what it names reads the same
# from the API now, and the reason why that job started it still holds. Every review reads the comments and reviews of
# the author and of accounts with write access, and no others. An answer reads them too, and the workflow's own
# review, answers, hold comment, label comment and fix reviews on the item.
#
# - The reply to a new issue of an outside author is a draft, which this workflow uploads as the artifact
#   issue-draft-<n> of its run and never posts (.github/review-answer.md, "An issue draft"). Sami approves the text of a
#   reply, and a run by hand on main posts that text word for word, once, and reads nothing else. A person with write
#   access starts it, or an App of the APPS (legion-implementer[bot]), and never the rescreen job. A run with no text,
#   or of a pull request or of an issue that is not open, posts nothing and fails:
#
#   gh workflow run review.yml -R theorem-labs/rocq-linux-process-semantics -f task=reply -f number=<n> -f reply=<text>
#
# - The screen can be measured: -f task=measure, with no number, runs every listed check three times
#   (-f measure_repeats=<1-5>) on each text of a labelled set kept in the private bucket (-f measure_set=
#   measure/set-v<n>.json, by default measure/set-v1.json), and puts the false holds and missed injections of each
#   rule of SCREEN_RULE's choices in the run's summary. The texts, and each check's words for
#   them, stay in the bucket.
#
# The jobs, and what each one holds:
#   trust   decides the task and the route: review, screen, or held at the limit. It checks nothing out, and its token
#           can only read metadata, pull requests and issues, and this workflow's runs.
#   gather  reads the pull request or the issue as data into .review/, and keeps it as this run's artifact, which the
#           screen job and the review job both take, by its SHA-256: the review reads what the screen passed. For an
#           answer, it also lists the comments of the author that wait for an answer: each comment, review and
#           review comment of the author made after what the workflow's newest review, answer or hold read (a review
#           read the conversation when its run started, and an answer up to the comment that its marker names). Its
#           token can only read, and it holds no model.
#   screen  runs in the environment review-screen. Its identity token is exchanged for short-lived tokens, which only
#           a job in that environment can get, and for Google Cloud and Anthropic only a job of this file on main:
#           Google Cloud (Model Armor, and adding the reason to its bucket), Azure (Prompt Shields) and Anthropic (a
#           service account of its own, not the review's). Two steps sign in before the screen: one to Google Cloud,
#           and one to Anthropic and Azure, which writes their tokens to a file in the runner's temporary directory
#           that the Screen step reads and deletes. A sign-in that fails fails the job before the screen, with no
#           verdict. SCREEN_CHECKS names the checks that run. Its GitHub token can only read, and no key is stored.
#           The checks get the text as data, and each answers a word; none can act on it. The screen reads up to
#           400,000 characters of an item and holds a longer one unread. Claude reads the text in pieces of at most
#           150,000 characters. A check that has not answered after 600 seconds holds the item. The sign-in to
#           Anthropic and Azure has 120 seconds of its own, so that the sign-in and the screen fit the job's 15
#           minutes. Its one output is the verdict.
#   review  reads .review/, with this repository's main and the Linux and QEMU source the model describes, and asks
#           Claude for the comment, its verdict and the list of what it asks (.github/review.md). It holds an identity
#           token, which Anthropic exchanges for a short-lived token that can call Claude and nothing else; no key is
#           stored. Anthropic's federation rule admits this file alone, on refs/heads/main, for this file's events,
#           and refuses a job in review-screen, so the screen job cannot get the review's Claude token. The review job
#           cannot get the screen's tokens either: they need the environment. Before the model, a step signs in to
#           Anthropic and drops the token, so that a run the rule does not admit fails there.
#           After the model, a step signs in again for the fresh reader: a second Claude request, with no tools, that
#           shortens the comment (.github/review/trim.py). Code adds each listed item that the shortened review omits,
#           and the whole review in a collapsed block. While SOUNDNESS_HOLD is true, code also gives the verdict person
#           to the review of an outside pull request that adds, changes or deletes a .v file, and adds the section on
#           soundness after the shortened review (.github/review/rules.py soundness). For an answer, Claude answers the
#           comments of the author that wait (.github/review-answer.md, "An answer"), and the fresh reader shortens
#           the answer. For a blocking finding of an outside pull request, or an answer that asks for it, Claude then
#           writes the fix as suggested changes on the lines of the diff (.github/review-answer.md, "The fix"). No fix
#           runs when the author said they will make the change, or when 2 fix reviews since the author's last own
#           push did not make the review pass. Code keeps only the suggestions on the diff (.github/review/rules.py
#           suggestions). A step signs in again, and the fresh reader shortens the words of the fix, never the lines
#           of a suggested change. The fresh reader can refuse a review, an answer or the words of a fix: then nothing
#           of that text posts, no fix follows a refused review or answer, the run's summary holds the reader's reason
#           and no log line or output does, and the comment job gives the item waits-on-theorem with Sami's next step.
#           The answer and the fix run in this job, so the hourly caps count them with the review. For a draft, Claude
#           writes the reply to a new issue of an outside author (.github/review-answer.md, "An issue draft"), and the
#           fresh reader trims it or refuses it, with the rules of the draft in its request. This job uploads the draft,
#           or the refused draft with the reader's reason, as the artifact issue-draft-<n> of its run, which the OSSV
#           controller copies into its ask to Sami. No output, summary or log line of the run holds the draft, the
#           refused draft or the reason. No job signs in to Google Cloud for a draft, and a reply has no review job.
#   post    runs in the environment post, which only main reaches and which holds the OSS Verify App's key. It does
#           the App's writes alone, each after a step of its own that mints a token for this repository alone: one
#           with checks: write and pull-requests: write, and one with actions: write alone, only for an approval
#           whose screen passed. For the review of an outside pull request whose screen passed, and for a relabel, it
#           reads the changed paths at the head with its own token and records the check run
#           repo-pairs/import-approved on the head when R12's rule holds (.github/review/rules.py import-check): the
#           screen passed, the verdict is pass, no changed file is under .github/, each changed file is a Markdown file
#           while SOUNDNESS_HOLD is true, and, while the repository variable REPO_PAIRS_IMPORT_PATHS gives the import's
#           paths, the import takes each changed path. For an approval, it reads the pull request again with its own
#           token, and when the head is still the one the screen read, it approves each run that GitHub holds of that
#           head from the pull request's head repository and branch. For a catch-up, it closes and reopens the pull
#           request with the first token, so that GitHub starts a CI run of its head, or only reopens one that a
#           catch-up closed and could not reopen. It posts no comment and no label, holds no identity token and no
#           model, and its own GitHub token can only read.
#   comment posts the review comment, or replaces the one it posted before, when POST_REVIEW says so, takes the label
#           review-held off (unless a hold of other work of the item is still tried again), and sets the state label
#           and the label comment (below); for a merge conflict, it posts the comment that asks the author to resolve
#           it, with the label waits-on-author. It posts the answer, once for each comment, and the fix as one review
#           of suggested changes, once for each head. For a draft, it posts the label comment alone, and for a reply
#           the approved text, byte for byte and once. For a relabel, it sets the state label and the label comment of
#           the head again, from what the workflow wrote of the head and what the post job decided. It never commits
#           or pushes: its token can write no file of the repository. It uses this run's GitHub token, so none of its
#           comments, reviews and labels starts a run of any workflow.
#   hold    labels a held pull request or issue review-held, says so in the hold comment of the work that it held (the
#           review, the answer, the draft or the approval), and sets the state label and the label comment. It holds
#           no model, and has no screen's reason to read: the screen job's one output is its verdict. It reads this
#           run's jobs and this workflow's runs: did a step that signs in fail (then it holds
#           nothing, and the schedule takes the item again), was the review stopped at the cap, or cancelled by a
#           newer run of the same item and task?
#   rescreen
#           runs on the schedule alone, in the public repository alone, and starts on main the runs that the open items
#           are due: the work that a hold names, an answer that waits, a draft that is not stored, the approval of
#           held runs, the catch-up or the review of a head that no run reviewed, the comment on a merge conflict, a
#           relabel, the App's writes that failed, and the reopen of a pull request that a catch-up left closed. When
#           the screen of a review passed and its review job could not sign in, it runs the failed jobs of that run
#           again, so that the screen is paid once. It is the only job whose own token has actions: write, which it
#           needs to start a run and to run failed jobs again, and it uses it for nothing else. Its issues and
#           pull-requests: write let it give an item whose work reached REVIEW_TRIES without settling a hold comment
#           that says that it is not tried again, and waits-on-theorem. It reads the open and the closed items, this
#           workflow's runs, and the CI runs and check runs of a head, and holds no model.
#
# Labels (.github/review.md, "Outside items and labels"). Each outside item has one state label: waits-on-author when
# the next step is its author's, waits-on-theorem when the next step is Sami's, and none while the workflow works on
# it. The comment, hold and rescreen jobs set it in the run of the event that changes the state, by the one rule of
# .github/review/rules.py, and setting one takes the other off. With it, the item gets one label comment of the
# workflow, edited in place, which names the next step and who takes it. review-held, the mark of a hold, stays beside
# the state label.
#
# No job runs code of a pull request. The gather job checks out main, never the pull request; it reads the pull
# request's diff and files from git objects as data under .review/, with every CLAUDE.md, AGENTS.md and .claude/ taken
# out. Claude gets the tools Read, Glob and Grep only, in the permission mode dontAsk (a call that would need approval
# is refused), and reads nothing outside the checkout: not the runner's temporary files, which hold the identity
# token, the Claude token and git's own files, nor /proc. It can run nothing and write nothing. The screen job runs
# only .github/screen.py from main, and the review job runs only .github/review/trim.py and .github/review/rules.py
# from main, each after Claude. The post, comment, hold and rescreen jobs check out main's .github/ alone, and run
# only .github/review/rules.py from it.
#
# The sign-ins are admitted by rules outside this repository that name this file, main and its events. Until those
# rules admit the events workflow_run and issue_comment, the screen and review jobs of such runs fail at sign-in, and
# the schedule's runs by hand on main take the item again. Until the environment post holds the App's key, the post
# job's sign-ins fail, and nothing else does.
#
# Never re-run this workflow with debug logging. A debug run prints the whole conversation with the model, with the
# pull request's or the issue's text, in the run's log, and anyone can read the logs of a public repository.
name: review
# The name of each run: its task, its item and the account whose limit it counts on, which the trust job, the Count
# step, the hold job and the rescreen job read. A workflow_run's name holds the whole head commit, because GitHub's
# expressions have no substring function, and that head maps to its pull request through the open pull requests. An
# issue_comment's name holds the comment's id (answer #<n> for <comment> by <login>), by which the rescreen job sees
# that the run took the comment. A run by hand: <task> #<n>, then " at <head>", " for <comment>" and " of <account>"
# for the inputs given.
run-name: >-
  ${{ github.event_name == 'schedule' && 'rescreen the held items'
  || github.event_name == 'workflow_run'
     && format('review {0} by {1}', github.event.workflow_run.head_sha, github.actor)
  || github.event_name == 'issues' && format('review #{0}', github.event.issue.number)
  || github.event_name == 'issue_comment'
     && format('answer #{0} for {1} by {2}', github.event.issue.number, github.event.comment.id,
               github.event.comment.user.login)
  || inputs.task == 'measure' && 'measure the screen'
  || format('{0} #{1}{2}{3}{4}', inputs.task, inputs.number, inputs.head && format(' at {0}', inputs.head) || '',
            inputs.comment && format(' for {0}', inputs.comment) || '',
            inputs.account && format(' of {0}', inputs.account) || '') }}

on:
  # Each completed run of CI; the trust job takes only a run of a pull request's event.
  workflow_run:
    workflows: [CI]
    types: [completed]
  issues:
    types: [opened, reopened]
  # Each new comment on an issue or a pull request; the trust job takes only one of the item's author.
  issue_comment:
    types: [created]
  # The rescreen job's own minutes, off the hour: :07, :22, :37 and :52.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      number:
        description: Number of the pull request or issue (none when measuring)
        required: false
        type: number
      task:
        description: What the run does (the top of this file)
        type: choice
        default: review
        options: [review, answer, draft, reply, rescreen, approve, catchup, conflict, relabel, measure]
      screen:
        description: With the task review, screen it first, as the item of an account without write access is screened
        type: boolean
        default: false
      reply:
        description: With the task reply, the text that Sami approved, which is posted as it is
        type: string
        default: ""
      account:
        description: The account whose hourly limit the run counts on (the rescreen job sets it)
        type: string
        default: ""
      comment:
        description: With the task answer, the id of the author's comment to answer
        type: string
        default: ""
      head:
        description: The head commit of the pull request that the run is about
        type: string
        default: ""
      measure_set:
        description: With the task measure, the labelled set to measure on, an object of the private bucket (measure/set-v<n>.json)
        type: string
        default: measure/set-v1.json
      measure_repeats:
        description: With the task measure, how many times each check answers each text of the set
        type: number
        default: 3

permissions: {}

env:
  # This repository's decision: "true" posts each review as a comment on its pull request or issue; any other value
  # keeps it in the run's summary only.
  POST_REVIEW: "true"
  # The Apps that count as having write access: this organisation's own, legion-reviewer[bot], and
  # legion-implementer[bot], which starts the run that posts an approved reply (dispatch://INFRA-3395, R4). The Review
  # step admits no other App, except an App whose pull request or issue the screen passed, and github-actions[bot] for
  # a run of the rescreen job that the trust job accepted.
  APPS: "sjawhar-agent[bot],oss-verify[bot],legion-reviewer[bot],legion-implementer[bot]"
  # The most reviews that may call the model in one hour. An agent of ours can open many pull requests at once, and
  # the screen passes others', so a burst must not start model runs without limit. A run at the cap stops before the
  # model, and the run is red; a maintainer can re-run it once the hour has passed. A run that the trust job stops, or
  # that the screen holds, never counts. The reviews of screened items count toward SCREENED_HOURLY_CAP instead.
  HOURLY_CAP: "10"
  # The same cap for the reviews of screened pull requests and issues, counted apart, so that accounts without write
  # access cannot use up HOURLY_CAP. A screened run at this cap is held. It is above OUTSIDE_HOURLY_LIMIT, so one
  # account cannot fill it alone; several new accounts together still can, and then the others' items are held.
  SCREENED_HOURLY_CAP: "6"
  # The most runs that one account without write access may start in an hour and have screened: its next pull request,
  # issue, push or comment in that hour is held without a screen. Every run its event started that the trust job did
  # not skip counts, the held ones too, so a burst stays held until an hour has passed since its runs. A run whose
  # screen or review could not sign in does not count: the schedule takes its item again. Only a run's jobs show that,
  # and the trust job reads the jobs of at most twice this number of the account's runs that failed: each one more of
  # them counts.
  # The runs that the rescreen job starts and that screen (a rescreen, a review, an answer, a draft or an approval)
  # count toward the same limit, with its events (their names end with " of <account>"): so N, the most such runs of
  # one account that are screened in an hour, is this number less what its own events used. (The rescreen job starts
  # up to this number of an account's such runs an hour whatever its events used, and the trust job holds the extra
  # ones at the limit.) One count and one limit, because such a run is the screen that the held or missed event did
  # not get: it gives an account no more screens an hour than its events alone could, which keeps it under
  # SCREENED_HOURLY_CAP, so one account cannot fill that pool. A smaller N for those runs would only leave a burst held
  # for longer; an account that keeps opening, pushing or reopening stays held. An account with write access has no
  # such limit (a writer's push to an outsider's item, whose cap or transient hold names the writer's run): the
  # rescreen job still starts at most this number of its rescreens an hour.
  OUTSIDE_HOURLY_LIMIT: "3"
  # The label a held pull request or issue gets, and the marker of the comment that says so.
  HELD_LABEL: review-held
  # The most times the review of a screened item that the screen passed may fail, or run out of time, before it waits
  # on Sami: each such hold is tried again with no person (the rescreen job) while it has failed fewer times than this
  # number, and the hold of the last failure is not. A review stopped at SCREENED_HOURLY_CAP is not such a failure,
  # and is tried again whatever this number: the cap is not the item's.
  # It is also the most runs of the work that a hold names, since the hold, that may end with neither a new hold nor a
  # post (a run that failed on a GitHub read, say), the most post jobs of a head that may fail at a step that is not a
  # sign-in, the most reviews that the rescreen job starts of a head that a run left with no review, the most relabels
  # of a head whose merge conflict went away, and the most reopens of a pull request that a catch-up left closed,
  # before the rescreen job leaves the work to Sami.
  REVIEW_TRIES: "3"
  # The soundness hold of R8 (.github/review.md, "Soundness of a Rocq proof"). Stock Rocq accepts three public proofs
  # of False: rocq-prover/rocq#22651, #22760 and #22772. The checks that the import's copy of a pull request must pass,
  # in theorem-labs/rocq-linux-process-semantics-internal, run stock Rocq, as this repository's CI lanes do. While this
  # is "true", code gives the review of an outside pull request that adds, changes or deletes a .v file the verdict
  # person and a section on soundness, whatever the model wrote (.github/review/rules.py soundness). The hold lasts
  # until those checks run a Rocq with the fixes for the three issues: only then set another value. Another value also
  # ends R12's Markdown-only rule: while the hold lasts, the post job records the import's check run only for a pull
  # request whose changed files are all Markdown files.
  SOUNDNESS_HOLD: "true"

jobs:
  # The task and the route of a run (the top of this file). Nothing runs in a fork of this repository, nor for a run by
  # hand on a ref other than main. A scheduled run is the rescreen job's alone. A workflow_run is taken only for a CI
  # run of a pull request's event that was not cancelled, skipped or held (GitHub holds a first-time contributor's run,
  # whose approval is the task approve); an issue_comment only for a comment of the item's author that no App wrote.
  trust:
    if: >-
      github.repository_id == 1425819621 && github.ref == 'refs/heads/main' && github.event_name != 'schedule'
      && (github.event_name != 'workflow_run'
          || (github.event.workflow_run.path == '.github/workflows/ci.yml'
              && github.event.workflow_run.event == 'pull_request'
              && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.conclusion != 'skipped'
              && github.event.workflow_run.conclusion != 'stale'
              && github.event.workflow_run.conclusion != 'action_required'))
      && (github.event_name != 'issue_comment'
          || (github.event.comment.user.login == github.event.issue.user.login
              && github.event.comment.user.type != 'Bot'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions: read for OUTSIDE_HOURLY_LIMIT, which reads this workflow's runs, and for a head's held runs; issues and
    # pull-requests: read for the item, its comments and its events, and the open pull requests.
    permissions: {actions: read, issues: read, pull-requests: read}
    outputs:
      # review, answer, draft, reply, rescreen, approve, catchup, conflict, relabel or measure (the top of this file).
      task: ${{ steps.trust.outputs.task }}
      # review (no screen), screen (the screen first), limit (held at OUTSIDE_HOURLY_LIMIT) or measure.
      route: ${{ steps.trust.outputs.route }}
      outsider: ${{ steps.trust.outputs.outsider }}
      number: ${{ steps.trust.outputs.number }}
      # The head commit of a pull request, as the API gave it to the trust job.
      head: ${{ steps.trust.outputs.head }}
      # The comment that an answer answers.
      comment: ${{ steps.trust.outputs.comment }}
      # The run whose event this item's hold names (a hold that is tried again), and the screened reviews of the item
      # that failed so far, which a hold of a review that did not finish counts on.
      origin: ${{ steps.trust.outputs.origin }}
      tries: ${{ steps.trust.outputs.tries }}
      started: ${{ steps.trust.outputs.started }}
    steps:
      - name: Whether the author and the account that started the run have write access
        id: trust
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.issue.number || inputs.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
          ACTOR: ${{ github.actor }}
          TASK: ${{ inputs.task }}
          SCREEN: ${{ inputs.screen }}
          ACCOUNT: ${{ inputs.account }}
          COMMENT: ${{ github.event.comment.id || inputs.comment }}
          HEAD: ${{ github.event.workflow_run.head_sha || inputs.head }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.id }}
          # The pull requests that GitHub names in the CI run, as JSON, each with its number and its base. GitHub names
          # none for a run of a fork's pull request (CI run 40554405841 of #23).
          PULLS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          # With the task reply, the approved text: this job only checks that it holds a word.
          REPLY: ${{ inputs.reply }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # The if of this job compares the ref with no case, as GitHub's == does, so refs/heads/MAIN passes it. The
          # shell compares it byte for byte: on any other ref this step reads nothing and gives no task, so no job after
          # it runs.
          [ "${GITHUB_REF:-}" = refs/heads/main ] \
            || { echo "::error::This run is not on refs/heads/main, so no job runs."; exit 1; }
          seen=$(mktemp -d -p "$RUNNER_TEMP")
          # trusted
          # trusted <login>: 0 when <login> is one of the APPS, or an account that GitHub's collaborator permission API
          # gives admin or write; 1 when it is neither; 2 when the API could not say. The API is asked once for each
          # login in this step (permission_of).
          declare -A permission_of=()
          trusted() {
            local permission
            [[ $1 =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || return 1
            [[ ,$APPS, != *",$1,"* ]] || return 0
            [[ $1 != *'[bot]' ]] || return 1
            if [ -z "${permission_of[$1]+set}" ]; then
              permission=$(gh api "repos/$REPO/collaborators/$1/permission" --jq .permission) || return 2
              permission_of[$1]=$permission
            fi
            [[ ${permission_of[$1]} == admin || ${permission_of[$1]} == write ]]
          }
          # end of trusted
          # known <login>: trusted's answer, 0 or 1; the run stops when GitHub could not say.
          known() {
            local rc=0
            trusted "$1" || rc=$?
            (( rc != 2 )) || { echo "::error::GitHub did not say whether $1 has write access. Re-run this run."; exit 1; }
            return "$rc"
          }
          # held
          # titled: the names of the runs that the rescreen job starts and that name an account (run-name):
          # <task> #<n>[ at <head>][ for <comment>] of <login>. BASH_REMATCH[2] is then the number, and [5] the login.
          titled='^(rescreen|review|answer|draft|approve) #([1-9][0-9]*)( at [0-9a-f]{40})?( for [1-9][0-9]*)? of ([A-Za-z0-9-]+(\[bot\])?)$'
          # comments <number>: each comment of <number>, one JSON object on each line, as GitHub lists them. They are
          # read once in this step, and kept in $seen, a directory that the step makes for itself.
          comments() {
            local file=$seen/comments-$1
            if [ ! -f "$file" ]; then
              gh api --paginate "repos/$REPO/issues/$1/comments" --jq '.[] | @json' > "$file.part" || return 1
              mv "$file.part" "$file"
            fi
            cat "$file"
          }
          # works: the start of a jq filter that defines work, the work that a hold comment's body (its input) holds.
          # Each work has hold comments of its own, so that a hold of one work never takes the place of a hold of
          # another, and the schedule takes each work again. A hold that the rescreen job tries again names its work in
          # its marker: answer, draft or approve as the marker names the task, and review for a marker with no task (a
          # rescreen takes it again). Any other hold names it in its title: answer ("Automated answer held."), draft
          # ("Automated reply held."), approve ("Automated approval held."), import ("Automated check for the import
          # held."), catchup ("Automated close and reopen held." or "Automated catch-up held."), and review for any
          # other.
          works='def work: (capture("\n<!-- review-held-(limit|cap|transient) [0-9]+(?: [0-9]+(?: (?<t>answer|draft|approve)(?: [1-9][0-9]*)?)?)? -->(\n|$)")
              | .t // "review")
            // (capture("^<!-- review-held -->\n[*][*]Automated (?<t>answer|reply|approval|check for the import|close and reopen|catch-up) held[.][*][*](\n|$)")
              | {"answer": "answer", "reply": "draft", "approval": "approve", "check for the import": "import",
                 "close and reopen": "catchup", "catch-up": "catchup"}[.t])
            // "review"; '
          # holds <number>: the newest hold comment of each work (works) on <number>, one on each line: "<work> <time>
          # <run> <tries> <kind> <task> <comment> <id> <head>". For a hold that the rescreen job tries again (its marker
          # <!-- review-held-<kind> <run> <tries>[ <task>[ <comment>]] -->): <kind> is limit (OUTSIDE_HOURLY_LIMIT),
          # cap (SCREENED_HOURLY_CAP) or transient (a screened review, answer or draft that failed or ran out of time),
          # <run> the run of the event this hold comes from (a run that takes the hold again keeps it), <tries> the
          # screened reviews of it that failed so far, <task> the task that takes it again (answer, draft or approve as
          # the marker names it, and rescreen for a marker with no task), and <comment> the comment that a held answer
          # answers (- for none). Each of <run> to <comment> is - for a hold that is not tried again (the screen held
          # it, or its tries are used up). <id> is the id of the comment, and <head> the head that the hold names (- for
          # none). Only github-actions[bot]'s comments count.
          holds() {
            comments "$1" | jq -rs "$works"'map(select(.user.login == "github-actions[bot]"
                and ((.body // "") | startswith("<!-- review-held -->")))
                | {at: (.updated_at // "-"), id, body: (.body // "")} | .work = (.body | work))
              | group_by(.work)[] | max_by(.at)
              | "\(.work) \(.at) \((.body
                  | capture("\n<!-- review-held-(?<kind>limit|cap|transient) (?<run>[0-9]+)(?: (?<tries>[0-9]+)(?: (?<task>answer|draft|approve)(?: (?<comment>[1-9][0-9]*))?)?)? -->(\n|$)")
                  | "\(.run) \(.tries // "0") \(.kind) \(.task // "rescreen") \(.comment // "-")") // "- - - - -") \(
                .id) \((.body | capture("\n<!-- review-held-head (?<h>[0-9a-f]{40}) -->(\n|$)") | .h) // "-")"'
          }
          # limit_hold <number> <work>: the newest hold comment of <work> on <number> (holds), as "<time> <run> <tries>
          # <kind> <task> <comment> <id> <head>". Nothing when <work> has no hold comment.
          limit_hold() {
            local found
            found=$(holds "$1") || return 1
            awk -v w="$2" '$1 == w { sub(/^[^ ]+ /, ""); print }' <<< "$found"
          }
          # waiting <number> <author> <kind>: "<time> <id>" of each comment, review with a text and review comment of
          # <author> on <number> (a pull request when <kind> is pr) that waits for an answer, oldest first, as the gather
          # job lists them for an answer (answer-to.json): each one made after what the workflow's newest review, fix
          # review, answer or hold read. A review and a fix review read the conversation when their run started, as
          # their marker <!-- review-read <time> --> says (one with no such marker, from before it, when GitHub last
          # changed it), so that a comment made while their run ran still waits. An answer answers the comments up to
          # the one that its marker names, the newest that waited for it, so that a comment made while it ran still
          # waits too. A hold counts from the time GitHub last changed it. A hold that the workflow tries again as an
          # answer answers nothing: each comment that waited when it was written, up to the one that its marker names,
          # still waits until an answer answers it, whatever review or hold came after that hold.
          waiting() {
            local found
            # shellcheck disable=SC2016 # $b is jq's
            found=$(comments "$1" | jq -c '(.body // "") as $b | {made: .created_at, at: .updated_at, id,
              author: .user.login, own: (if .user.login != "github-actions[bot]" then null
                elif ($b | startswith("<!-- review-held -->"))
                     and ($b | test("\n<!-- review-held-[a-z]+ [0-9]+ [0-9]+ answer [0-9]+ -->(\n|$)"))
                then {held: ($b | capture("\n<!-- review-held-[a-z]+ [0-9]+ [0-9]+ answer (?<c>[0-9]+) -->") | .c)}
                elif ($b | test("^<!-- review-answer [0-9]+")) then {answers: ($b | capture("^<!-- review-answer (?<c>[0-9]+)") | .c)}
                elif ($b | test("^<!-- review(-held)? -->")) then {read: (($b
                  | capture("\n<!-- review-read (?<t>[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z) -->(\n|$)")
                  | .t) // .updated_at)}
                else null end)}') \
              || return 1
            if [ "$3" = pr ]; then
              # shellcheck disable=SC2016 # $b is jq's
              found+=$'\n'$(gh api --paginate "repos/$REPO/pulls/$1/reviews" --jq '.[] | (.body // "") as $b
                | {made: .submitted_at, at: .submitted_at, id, author: .user.login, text: ($b | test("\\S")),
                   own: (if .user.login == "github-actions[bot]" and ($b | startswith("<!-- review-fix ")) then {read: (($b
                     | capture("\n<!-- review-read (?<t>[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z) -->(\n|$)")
                     | .t) // .submitted_at)} else null end)}
                | @json') || return 1
              found+=$'\n'$(gh api --paginate "repos/$REPO/pulls/$1/comments" \
                --jq '.[] | {made: .created_at, id, author: .user.login, own: null} | @json') || return 1
            fi
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            AUTHOR_OF=$2 jq -rs '(map(select(.author == $ENV.AUTHOR_OF) | {key: (.id | tostring), value: (.made // "")})
                | from_entries) as $made
              | ([.[] | select(.own.answers) | $made[.own.answers] // .at] | map(strings) | max // "") as $answered
              | [.[] | select(.own.read) | {read: .own.read, at}] as $reads
              | ($reads | map(.read) + [$answered] | map(strings) | max // "") as $since
              | [.[] | select(.own.held) | {upto: $made[.own.held], at} | select(.upto != null)] as $holds
              | .[] | select(.author == $ENV.AUTHOR_OF and .text != false and ((.made // "") as $m
                  | $m > $since or any($holds[]; . as $h | $m <= $h.upto and $m > $answered
                      and $m > ([$reads[] | select(.at < $h.at) | .read] | map(strings) | max // ""))))
              | "\(.made) \(.id)"' <<< "$found" | sort
          }
          # held_account <run>: the account whose limit a hold of <run> counts on, when <run> is a run of this
          # workflow (by its path): the account that started it, for a run of workflow_run, issues or issue_comment;
          # the account its name ends with, for a run that github-actions[bot] started (the rescreen job's) with one of
          # that job's names (titled); the account that started it, for a run by hand of an App in APPS or of an
          # account with write access (trusted), which has no limit. Nothing for any other run, or when GitHub no
          # longer has it (a deleted or expired run). It fails when GitHub could not say.
          held_account() {
            local run path event login title rc=0
            [[ $1 =~ ^[1-9][0-9]*$ ]] || return 0
            run=$(gh api "repos/$REPO/actions/runs/$1" \
              --jq '"\(.path // "-") \(.event) \(.actor.login) \(.display_title // "" | gsub("[\r\n]"; " "))"' 2>&1) \
              || { [[ $run == *"(HTTP 404)"* ]] || return 1; return 0; }
            read -r path event login title <<< "$run"
            [[ $path == '.github/workflows/review.yml' && $login =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || return 0
            case $event in
              workflow_run|issues|issue_comment) echo "$login" ;;
              workflow_dispatch)
                if [ "$login" = 'github-actions[bot]' ]; then
                  if [[ $title =~ $titled ]]; then echo "${BASH_REMATCH[5]}"; fi
                else
                  trusted "$login" || rc=$?
                  (( rc != 2 )) || return 1
                  (( rc != 0 )) || echo "$login"
                fi ;;
            esac
          }
          # head_marks <number> <head>: what the comments of github-actions[bot] on <number> say of <head>, as
          # "<review> <held> <conflict>". review is new when a comment holds the marker <!-- review-head <head> --> of
          # this workflow's review, old when one starts with <!-- review --> and holds "of commit " and the first 12
          # characters of <head> (the review of before the move off pull_request_target), and none else. held is true
          # when a hold comment names <head> (<!-- review-held-head <head> -->). conflict is true when the label
          # comment holds <!-- review-conflict-state <head> -->: <head> waits on its author for a merge conflict.
          head_marks() {
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            comments "$1" | SHA=$2 jq -rs 'map(select(.user.login == "github-actions[bot]") | .body // "") as $b
              | [(if any($b[]; test("(^|\n)<!-- review-head " + $ENV.SHA + " -->(\n|$)")) then "new"
                  elif any($b[]; startswith("<!-- review -->") and contains("of commit " + $ENV.SHA[0:12])) then "old"
                  else "none" end),
                 any($b[]; startswith("<!-- review-held -->")
                   and test("\n<!-- review-held-head " + $ENV.SHA + " -->(\n|$)")),
                 any($b[]; startswith("<!-- review-label -->")
                   and test("\n<!-- review-conflict-state " + $ENV.SHA + " -->(\n|$)"))] | map(tostring) | join(" ")'
          }
          # gave_up <number>: true when a hold comment of github-actions[bot] on <number> says that the automated
          # catch-up closed it and could not reopen it. The catch-up then tries nothing more on it.
          gave_up() {
            comments "$1" | jq -rs 'any(.[]; .user.login == "github-actions[bot]" and ((.body // "")
              | startswith("<!-- review-held -->")
                and contains("\n\nThe automated catch-up closed this pull request and could not reopen it after ")))'
          }
          # pages: the start of the --jq filter of a list of runs, which gives, before the rows of each page, the line
          # "= <total_count> <runs on the page>" that whole reads.
          pages='"= \(.total_count // (.workflow_runs | length)) \(.workflow_runs | length)", '
          # whole: the rows of a list of runs read with pages, from standard input. It fails, with no row, when GitHub
          # cut the list: GitHub gives at most 1,000 runs for a list with created, event, head_sha or status, the newest
          # first, and its total_count then says that more runs match.
          whole() {
            awk '$1 == "=" { if ($2 > total) total = $2; listed += $3; next } { rows[++n] = $0 }
              END { if (listed < total) exit 3; for (i = 1; i <= n; i++) print rows[i] }'
          }
          # runs_in <event> <created> <filter>: the rows that <filter> (a --jq filter that starts with pages) gives of
          # this workflow's runs of <event> created in <created>: from the start of a day on (>=<day>T00:00:00Z), on a
          # day (<day>), or in an hour of a day. A list that GitHub cut is read again one day at a time, and the list of
          # a day one hour at a time. It fails when GitHub could not say, or when it cut the list of an hour.
          runs_in() {
            local out rows day today hour
            out=$(gh api --method GET --paginate "repos/$REPO/actions/workflows/review.yml/runs" -f event="$1" \
              -f created="$2" -F per_page=100 --jq "$3") || return 1
            if rows=$(whole <<< "$out"); then
              [ -z "$rows" ] || printf '%s\n' "$rows"
              return 0
            fi
            case $2 in
              '>='[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]T00:00:00Z)
                day=${2:2:10} today=$(date -u +%Y-%m-%d)
                while [[ ! $day > $today ]]; do
                  runs_in "$1" "$day" "$3" || return 1
                  day=$(date -u -d "$day +1 day" +%Y-%m-%d)
                done ;;
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9])
                for hour in $(seq -w 0 23); do
                  runs_in "$1" "${2}T$hour:00:00Z..${2}T$hour:59:59Z" "$3" || return 1
                done ;;
              *) echo "::error::GitHub lists at most 1,000 runs of $1 created $2, and more of them match." >&2; return 1 ;;
            esac
          }
          # ci_of <head>: the CI runs of <head> of the event pull_request: pending while one of them is queued, in
          # progress, waiting or held for a person's approval (action_required), or while GitHub does not list them all
          # (whole); else the time when the newest one ended; nothing when there is none.
          ci_of() {
            local out rows
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            out=$(SHA=$1 gh api --method GET --paginate "repos/$REPO/actions/runs" -f head_sha="$1" -F per_page=100 \
              --jq "$pages"'(.workflow_runs[] | select(.head_sha == $ENV.SHA and .event == "pull_request"
                  and .path == ".github/workflows/ci.yml")
                | if .status == "completed" then .updated_at // "-" else "pending" end)') || return 1
            if ! rows=$(whole <<< "$out"); then echo pending; return 0; fi
            sort <<< "$rows" | awk '$0 == "pending" { p = 1 } NF { last = $0 } END { print (p ? "pending" : last) }'
          }
          # end of held
          # earlier <login>: sets count to how many runs of this workflow in the last hour, before this run, the trust
          # job did not skip and either <login> started by an event (workflow_run, issues or issue_comment), or whose
          # name, a name of the rescreen job's (titled), ends with " of <login>": the trust job of a run that
          # github-actions[bot] started checks that name, and a writer's run by hand names the account that the writer
          # gives. Two lists give those runs: the runs of <login> (actor), and the runs by hand (workflow_dispatch),
          # which only writers and the rescreen job start. So the runs of other accounts, which a comment of anyone on
          # any item starts, are in neither list. A run that GitHub skipped, with each of its jobs, does not count. A
          # run that has not finished counts, and so does a run of an event that succeeded: their jobs are not read.
          # The jobs of a run of an event that failed or was cancelled show whether it counts: a run whose screen or
          # review job stopped at a failed step whose name starts with "Sign in" could not sign in, and does not count:
          # the schedule takes its item again, and that run must not find the account at its limit because of it. The
          # jobs of a run by hand that finished show it too, and whether its trust job refused it (the item closed, or
          # lost its label, in between): then every other job of it was skipped, it screened nothing, and it does not
          # count. The rescreen job, which every dispatched run skips, is not one of those jobs. A run whose trust job
          # is not listed counts. The jobs of each run are read once, also when two pages or both lists give it, and of
          # at most 2 * OUTSIDE_HOURLY_LIMIT runs in this run: each run past those counts, as it may, so that a burst
          # of runs that could not sign in costs each later run no more reads than that. No jobs are read once count
          # is at OUTSIDE_HOURLY_LIMIT: the account is at its limit. When GitHub does not list every run of a list
          # (whole), the runs that it leaves out can be the account's: the account is at its limit.
          # The run stops when GitHub could not say.
          earlier() {
            local from list out rows runs="" id kind state run verdict reads=0
            local -a unread=()
            local -A once=()
            count=0
            from=$(date -u -d '-1 hour' +%Y-%m-%dT%H:%M:%SZ)
            # Each run of the list on one line: "<id> <kind> <state>", kind dispatch for a run by hand and event for
            # the others, and state count for a run that counts with no read of its jobs, else read.
            for list in "actor=$1" event=workflow_dispatch; do
              # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
              out=$(LOGIN=$1 TITLED=$titled gh api --method GET --paginate \
                "repos/$REPO/actions/workflows/review.yml/runs" -f "$list" -f created=">=$from" -F per_page=100 \
                --jq "$pages"'(.workflow_runs[] | (.display_title // "") as $title
                  | select(.id < ($ENV.RUN_ID | tonumber) and .conclusion != "skipped"
                           and ((.actor.login == $ENV.LOGIN
                                 and (.event == "workflow_run" or .event == "issues" or .event == "issue_comment"))
                                or (.event == "workflow_dispatch" and ($title | test($ENV.TITLED))
                                    and ($title | endswith(" of " + $ENV.LOGIN)))))
                  | "\(.id) \(if .event == "workflow_dispatch" then "dispatch" else "event" end) \(
                      if .status != "completed" or (.event != "workflow_dispatch" and .conclusion == "success")
                      then "count" else "read" end)")') \
                || { echo "::error::the runs of this workflow could not be read. Re-run this run."; exit 1; }
              if ! rows=$(whole <<< "$out"); then
                echo "::notice::GitHub lists at most 1,000 runs of this workflow with $list since $from, and more of" \
                  "them match. The runs that it does not list can be runs of $1, so $1 is held at the limit."
                count=$OUTSIDE_HOURLY_LIMIT
                return 0
              fi
              runs+=$rows$'\n'
            done
            while read -r id kind state; do
              [ -n "$id" ] || continue
              [[ $id =~ ^[0-9]+$ ]] || { echo "::error::a run id is not a number. Re-run this run."; exit 1; }
              [ -z "${once[$id]:-}" ] || continue
              once[$id]=1
              if [ "$state" = count ]; then count=$((count + 1)); else unread+=("$id $kind"); fi
            done <<< "$runs"
            for run in "${unread[@]}"; do
              (( count < OUTSIDE_HOURLY_LIMIT )) || break
              read -r id kind <<< "$run"
              if (( reads == 2 * OUTSIDE_HOURLY_LIMIT )); then
                count=$((count + 1))
                continue
              fi
              reads=$((reads + 1))
              # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
              verdict=$(KIND=$kind gh api --method GET --paginate "repos/$REPO/actions/runs/$id/jobs" -F per_page=100 \
                --jq '([.jobs[] | select(.name == "trust")] | first) as $t
                  | [.jobs[] | select(.name != "trust" and .name != "rescreen")] as $rest
                  | if $t == null then "count" elif $t.conclusion == "skipped" then "skip"
                    elif $ENV.KIND == "dispatch" and $t.status == "completed" and ($rest | length) > 0
                         and ($rest | all(.conclusion == "skipped")) then "skip"
                    elif any($rest[] | select(.name | test("^(screen|review)( |$)")) | .steps[]?;
                             (.name | startswith("Sign in")) and .conclusion == "failure") then "signin"
                    else "count" end') \
                || { echo "::error::the jobs of run $id could not be read. Re-run this run."; exit 1; }
              if [[ $verdict == *count* ]]; then count=$((count + 1)); fi
            done
          }
          fail() { echo "::error::$1 Re-run this run."; exit 1; }
          # origin: the run whose event this item's hold names, for a hold that is tried again; tries: the screened
          # reviews of the item that failed so far, which a rescreen carries from its hold to the next.
          task="" head="" comment="" of="" tries=0 origin=$RUN_ID account=$ACTOR
          # route <route> <outsider>: the outputs, and the end of this step.
          route() {
            echo "#$NUMBER: the task $task, the route $1."
            { echo "task=$task"; echo "route=$1"; echo "outsider=$2"; echo "number=$NUMBER"; echo "head=$head"
              echo "account=$account"; echo "comment=$comment"; echo "origin=$origin"; echo "tries=$tries"
              echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; } >> "$GITHUB_OUTPUT"
            exit 0
          }
          # stop <why>: no route, so no job after this one runs.
          stop() {
            local what="#$NUMBER"
            [ -n "$NUMBER" ] || what="commit $HEAD"
            echo "::notice::No ${task:-run} of $what: $1"
            exit 0
          }
          # screened <author> <account>: the route of an item of <author> for an action of <account>: no screen when
          # both have write access; else the screen first, for the account without write access whose action it is
          # (<account>, or else <author>); or held at the limit with no screen, when <account> has no write access and
          # its runs reached the screen OUTSIDE_HOURLY_LIMIT times in the last hour. A writer's action on an outsider's
          # item has no limit. No <account> is the action of a person or an App that started a run by hand, which
          # GitHub lets only a writer do: the API is not asked.
          screened() {
            local a=0 b=0 outsider
            known "$1" || a=$?
            if [ -n "$2" ]; then known "$2" || b=$?; fi
            (( a != 0 || b != 0 )) || route review ""
            outsider=$1
            (( b == 0 )) || outsider=$2
            [[ $outsider =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || stop "$outsider is not a GitHub login."
            echo "::notice::#$NUMBER is screened first: $outsider has no write access."
            if (( b != 0 )); then
              earlier "$2"
              (( count < OUTSIDE_HOURLY_LIMIT )) || route limit "$outsider"
            fi
            route screen "$outsider"
          }
          # item: what the API says of #NUMBER now: state, AUTHOR, kind (pr or issue), is_draft, and labelled (with
          # HELD_LABEL); for a pull request also merged, base, pr_head (its head commit), mergeable (its
          # mergeable_state: dirty for a merge conflict, unknown while GitHub has not computed it) and head_repo (the
          # id of its head repository, 0 when that repository is gone).
          item() {
            local data
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            data=$(gh api "repos/$REPO/issues/$NUMBER" --jq '[.state, .user.login,
              (if .pull_request then "pr" else "issue" end), ((.draft // false) | tostring),
              (any(.labels[]?; .name == $ENV.HELD_LABEL) | tostring)] | join(" ")') || fail "#$NUMBER could not be read."
            read -r state AUTHOR kind is_draft labelled <<< "$data"
            merged=false base="" pr_head="" mergeable="" head_repo=0
            if [ "$kind" = pr ]; then
              data=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '[((.merged // false) | tostring), .base.ref, .head.sha,
                (.mergeable_state // "unknown"), ((.head.repo.id // 0) | tostring)] | join(" ")') \
                || fail "pull request #$NUMBER could not be read."
              read -r merged base pr_head mergeable head_repo <<< "$data"
            fi
          }
          # held_runs: how many runs of the head pr_head GitHub holds for a person's approval (status action_required).
          held_runs() {
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            SHA=$pr_head gh api --method GET --paginate "repos/$REPO/actions/runs" -f head_sha="$pr_head" \
              -f status=action_required -F per_page=100 --jq '[.workflow_runs[] | select(.status == "action_required"
                and .head_sha == $ENV.SHA and .event == "pull_request")] | length' | awk '{ n += $1 } END { print n + 0 }'
          }
          # replied: true when the label comment of #NUMBER says that its first reply posted.
          replied() {
            local n
            n=$(comments "$NUMBER" | jq -s '[.[] | select(.user.login == "github-actions[bot]"
              and (.body | startswith("<!-- review-label -->"))
              and (.body | test("(^|\n)<!-- issue-reply-posted [0-9]+ -->(\n|$)")))] | length') \
              || fail "the comments of #$NUMBER could not be read."
            (( n > 0 ))
          }
          # stored: true when the label comment of #NUMBER says that the draft of its reply is stored, or that its
          # first reply posted.
          stored() {
            local n
            n=$(comments "$NUMBER" | jq -s '[.[] | select(.user.login == "github-actions[bot]"
              and ((.body // "") | startswith("<!-- review-label -->"))
              and ((.body // "") | test("(^|\n)<!-- (issue-draft [0-9]+-[0-9]+|issue-reply-posted [0-9]+) -->(\n|$)")))]
              | length') || fail "the comments of #$NUMBER could not be read."
            (( n > 0 ))
          }
          # newest <work>: the newest hold of <work> on #NUMBER (limit_hold): held_at, and held_run, held_tries and
          # held_task when the rescreen job tries it again (held_run is - for a hold that it does not try again, and
          # empty with no hold of <work>).
          newest() {
            local hold
            hold=$(limit_hold "$NUMBER" "$1") || fail "the comments of #$NUMBER could not be read."
            read -r held_at held_run held_tries _ held_task _ <<< "$hold"
          }
          # again <task>: for a run of the rescreen job, when the newest hold of its work (newest) is one that that job
          # tries again as <task>. That job takes such a hold again only when it is over an hour old, so a younger one
          # stops this run. This run then keeps the hold's run and tries (origin and tries), so that a hold of it counts
          # on.
          again() {
            [[ -n ${held_run:-} && $held_run != - && ${held_task:-} == "$1" ]] || return 0
            [[ $held_at < $(date -u -d '-1 hour' +%Y-%m-%dT%H:%M:%SZ) ]] \
              || stop "its hold of $held_at is under an hour old."
            [[ $held_tries =~ ^[0-9]+$ ]] || stop "its hold names no count of tries."
            origin=$held_run tries=$held_tries
          }
          # comment_author: the author of the comment COMMENT, when it is an issue comment, a review comment or a
          # review of #NUMBER. Nothing when it is none of them.
          comment_author() {
            local path out url login
            for path in "issues/comments/$COMMENT" "pulls/comments/$COMMENT" "pulls/$NUMBER/reviews/$COMMENT"; do
              [[ $kind == pr || $path == issues/* ]] || continue
              if out=$(gh api "repos/$REPO/$path" --jq '"\(.issue_url // .pull_request_url // "-") \(.user.login // "-")"' 2>&1); then
                read -r url login <<< "$out"
                if [[ $url == */issues/$NUMBER || $url == */pulls/$NUMBER ]]; then echo "$login"; return 0; fi
              else
                [[ $out == *"(HTTP 404)"* ]] || return 1
              fi
            done
          }
          # left_closed: true when #NUMBER is a pull request that a catch-up run closed and could not reopen: it is not
          # merged, and its newest closed event is oss-verify[bot]'s and falls between the start and the end of another
          # run of the task catchup of it whose post job failed or was cancelled (the closing run). A catchup run since
          # then that reopened it would have left it open, or closed by a newer event. The runs are read one day at a
          # time (runs_in, which reads a day that GitHub cut at 1,000 runs one hour at a time), from the day before the
          # close to today, however long ago the close was. Never once its hold comment says that the catch-up could not
          # reopen it (gave_up): then it waits on Sami, and no run is read.
          left_closed() {
            local closed at by day today runs id started ended post given
            [ "$kind" = pr ] && [ "$merged" = false ] || return 1
            closed=$(gh api --paginate "repos/$REPO/issues/$NUMBER/events" --jq '.[] | select(.event == "closed")
              | "\(.created_at) \(.actor.login // "-")"' | sort | tail -n 1) || fail "the events of #$NUMBER could not be read."
            read -r at by <<< "$closed"
            [ "${by:-}" = 'oss-verify[bot]' ] || return 1
            [[ $at =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || return 1
            given=$(gave_up "$NUMBER") || fail "the comments of #$NUMBER could not be read."
            [ "$given" = false ] || return 1
            day=$(date -u -d "${at:0:10} -1 day" +%Y-%m-%d)
            today=$(date -u +%Y-%m-%d)
            while [[ ! $day > $today ]]; do
              # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
              runs=$(PATTERN="^catchup #$NUMBER( |\$)" runs_in workflow_dispatch "$day" "$pages"'(.workflow_runs[]
                  | select(.event == "workflow_dispatch" and (.id | tostring) != $ENV.RUN_ID
                           and ((.display_title // "") | test($ENV.PATTERN)))
                  | "\(.id) \(.run_started_at // .created_at) \(if .status == "completed" then .updated_at else "-" end)")') \
                || fail "the runs of $day could not be read."
              while read -r id started ended; do
                [ -n "$id" ] || continue
                [[ $id =~ ^[0-9]+$ ]] || fail "a run id is not a number."
                if [[ $at < $started || ($ended != - && $ended < $at) ]]; then continue; fi
                post=$(gh api --method GET --paginate "repos/$REPO/actions/runs/$id/jobs" -F per_page=100 \
                  --jq '.jobs[] | select(.name == "post") | .conclusion // "running"') \
                  || fail "the jobs of run $id could not be read."
                if [[ $post == failure || $post == cancelled ]]; then return 0; fi
              done <<< "$runs"
              day=$(date -u -d "$day +1 day" +%Y-%m-%d)
            done
            return 1
          }
          [[ $OUTSIDE_HOURLY_LIMIT =~ ^[1-9][0-9]*$ ]] || { echo "::error::OUTSIDE_HOURLY_LIMIT is not a number"; exit 1; }
          [[ $RUN_ID =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a run id: $RUN_ID"; exit 1; }
          case $EVENT in
            # A pull request's new head: the open pull request into main of the CI run. A run of a pull request of this
            # repository names its pull requests (PULLS): it is taken only when one of them is into main of this
            # repository, and that one is it, so a CI run of a pull request into another branch starts no review and
            # counts toward no cap. A run of a fork's pull request names none (GitHub leaves the list empty): it is the
            # one open pull request into main whose head is the CI run's head commit, from the CI run's head repository,
            # whatever the base of the pull request whose CI run it is. The number comes from the CI run or from that
            # lookup; the author, the head and the rest come from the API. The account is the CI run's actor (the
            # pusher, also on a later attempt of that run), never the account that re-ran it.
            workflow_run)
              task=review
              [[ $HEAD =~ ^[0-9a-f]{40}$ && $HEAD_REPOSITORY =~ ^[1-9][0-9]*$ ]] \
                || stop "the CI run names no head commit and head repository."
              # "<how many pull requests the CI run names> <each number of one into main of this repository>".
              # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
              found=$(jq -r 'if type == "array" then . elif . == null then [] else error("not a list") end
                | [length] + [.[] | select(.base.ref == "main"
                    and ((.base.repo.id // 0) | tostring) == $ENV.GITHUB_REPOSITORY_ID) | .number]
                | map(tostring) | join(" ")' <<< "${PULLS:-null}") || fail "the CI run's pull requests could not be read."
              read -r named into <<< "$found"
              if (( named > 0 )); then
                [ -n "${into:-}" ] || stop "the CI run is of pull requests into other branches than main."
                [[ $into =~ ^[1-9][0-9]*$ ]] || stop "the CI run names more than one pull request into main ($into)."
                NUMBER=$into
                item
                [ "$kind" = pr ] || stop "it is not a pull request."
                [ "$state" = open ] || stop "it is $state."
                [ "$base" = main ] || stop "it is into $base, not main."
                [[ $pr_head == "$HEAD" && $head_repo == "$HEAD_REPOSITORY" ]] \
                  || stop "its head is $pr_head of repository $head_repo, not the CI run's."
              else
                # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
                found=$(gh api --paginate "repos/$REPO/pulls?state=open&base=main&per_page=100" --jq '.[]
                  | select(.head.sha == $ENV.HEAD and ((.head.repo.id // 0) | tostring) == $ENV.HEAD_REPOSITORY
                           and .base.ref == "main")
                  | "\(.number) \((.draft // false) | tostring) \(.user.login)"') \
                  || fail "the open pull requests could not be read."
                n=$(grep -c . <<< "$found" || true)
                (( n == 1 )) || stop "$n open pull requests into main have this head from its repository."
                read -r NUMBER is_draft AUTHOR <<< "$found"
                [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || fail "not a number: $NUMBER."
              fi
              [ "$is_draft" = false ] || stop "it is a draft."
              head=$HEAD
              screened "$AUTHOR" "$ACTOR" ;;
            # A new issue, or one reopened: a writer's is reviewed, and an outsider's gets a draft of its reply.
            issues)
              [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
              a=0
              known "$AUTHOR" || a=$?
              task=review
              (( a == 0 )) || task=draft
              screened "$AUTHOR" "$ACTOR" ;;
            # A new comment of the item's author (the job's if) is answered when the item is open, its author has no
            # write access and, on an issue, the first reply posted. A pull request with a merge conflict gets the task
            # conflict instead.
            issue_comment)
              task=answer
              [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
              [[ $COMMENT =~ ^[1-9][0-9]*$ ]] || stop "the event names no comment."
              comment=$COMMENT
              item
              head=$pr_head
              [ "$state" = open ] || stop "it is $state."
              [ "$AUTHOR" = "$ACTOR" ] || stop "the comment is $ACTOR's, not its author's ($AUTHOR)."
              a=0
              known "$AUTHOR" || a=$?
              (( a != 0 )) || stop "its author $AUTHOR has write access."
              [ "$kind" = pr ] || replied || stop "its first reply has not posted."
              if [ "$mergeable" = dirty ]; then task=conflict; route review ""; fi
              screened "$AUTHOR" "$ACTOR" ;;
            workflow_dispatch)
              task=${TASK:-review}
              case $task in
                review|answer|draft|reply|rescreen|approve|catchup|conflict|relabel|measure) ;;
                *) stop "it is not a task of this workflow." ;;
              esac
              # GitHub lets only an account with write access start a run by hand; an App must be one of the APPS, as
              # the Review step's allowed_bots says. github-actions[bot] is the rescreen job's dispatch, made with that
              # job's token, which has actions: write: it is taken only for the tasks that job starts, with the name
              # that job gives the task (below), and never for a reply or a measurement.
              if [ "$ACTOR" = 'github-actions[bot]' ]; then
                case $task in reply|measure) stop "github-actions[bot] starts no run of this task." ;; esac
              elif [[ $ACTOR == *'[bot]' ]]; then
                known "$ACTOR" || stop "the App that started this run ($ACTOR) is not one of the APPS."
              fi
              # A measurement of the screen reads no pull request or issue (the screen job's Measure step).
              if [ "$task" = measure ]; then NUMBER=""; route measure ""; fi
              [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
              [[ -z $HEAD || $HEAD =~ ^[0-9a-f]{40}$ ]] || stop "$HEAD is not a head commit."
              [[ -z $COMMENT || $COMMENT =~ ^[1-9][0-9]*$ ]] || stop "$COMMENT is not a comment id."
              comment=$COMMENT
              item
              head=$pr_head
              # A reply that cannot post fails the run, so that the person or the App that started it sees why: a run
              # of a pull request, of an issue that is not open, or with no text of a reply.
              if [ "$task" = reply ]; then
                [ "$kind" = issue ] || { echo "::error::#$NUMBER is a pull request, and a reply is for an issue. Nothing posts."; exit 1; }
                [ "$state" = open ] || { echo "::error::issue #$NUMBER is $state. Nothing posts."; exit 1; }
                [[ ${REPLY:-} =~ [^[:space:]] ]] || { echo "::error::the run gives no text of a reply. Nothing posts."; exit 1; }
              fi
              [[ -z $HEAD || $HEAD == "$pr_head" ]] || stop "its head is ${pr_head:-none}, not $HEAD."
              # A closed item gets no task, but the catch-up of a pull request that a catch-up run closed and could not
              # reopen: that run reopens it, and closes nothing.
              if [ "$state" != open ]; then
                [ "$task" = catchup ] && left_closed || stop "it is $state."
              fi
              [ "$kind" != pr ] || [ "$base" = main ] || stop "it is into $base, not main."
              case $task in
                draft|reply) [ "$kind" = issue ] || stop "it is not an issue." ;;
                approve|catchup|conflict|relabel) [ "$kind" = pr ] || stop "it is not a pull request." ;;
              esac
              # The rescreen job's name for the task, from what the API says now: the item, its head, and its author
              # when the author has no write access (a rescreen names the account its hold names, checked below, and
              # the head of a pull request). The account a name gives is the one whose limit the run counts on; a run
              # by hand of a person or an App counts on none. Each task below then reads again, for the rescreen job's
              # run, the reason why that job started it, and stops when the reason no longer holds.
              limited=""
              if [ "$ACTOR" = 'github-actions[bot]' ]; then
                [ "$is_draft" = false ] || stop "it is a draft."
                a=0
                known "$AUTHOR" || a=$?
                (( a == 0 )) || of=" of $AUTHOR"
                case $task in
                  rescreen) want="rescreen #$NUMBER${pr_head:+ at $pr_head} of $ACCOUNT" ;;
                  review|approve) want="$task #$NUMBER at $pr_head$of" ;;
                  answer) want="answer #$NUMBER for $COMMENT$of" ;;
                  draft) want="draft #$NUMBER$of" ;;
                  *) want="$task #$NUMBER at $pr_head" ;;
                esac
                title=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.display_title // ""') \
                  || fail "this run could not be read."
                [ "$title" = "$want" ] || stop "its name \"$title\" is not the rescreen job's for it (\"$want\")."
                account=$ACCOUNT limited=$ACCOUNT
              fi
              case $task in
                # A held item screened again: an outsider's path, decided from what the API says now, never from the
                # inputs alone. The item must be held, the newest hold of its review must be one that is tried again as
                # a rescreen (at the limit, at the cap, or a review that did not finish, whose marker names no task),
                # and the run that hold names must give the account that the inputs give. The rescreen job's run also
                # needs that hold to be over an hour old.
                rescreen)
                  [ "$is_draft" = false ] || stop "it is a draft."
                  [ "$labelled" = true ] || stop "it is not labelled $HELD_LABEL."
                  newest review
                  if [[ -z $held_run || $held_run == - ]]; then
                    others=$(holds "$NUMBER") || fail "the comments of #$NUMBER could not be read."
                    other=$(awk 'NF && $3 != "-" && !found { print $6; found = 1 }' <<< "$others")
                    [ -z "$other" ] || stop "its hold is tried again as the task $other, not as a rescreen."
                    stop "it has no hold that is tried again."
                  fi
                  origin=$held_run tries=$held_tries
                  [[ $tries =~ ^[0-9]+$ ]] || stop "its hold names no count of tries."
                  [ "$ACTOR" != 'github-actions[bot]' ] || again rescreen
                  account=$(held_account "$origin") || fail "run $origin could not be read."
                  [ -n "$account" ] || stop "its hold names no run whose account this workflow can tell."
                  [ "$ACCOUNT" = "$account" ] || stop "the account its hold names is $account, not ${ACCOUNT:-none}."
                  if [ "$mergeable" = dirty ]; then task=conflict; route review ""; fi
                  # A writer's item whose hold names a writer's run (at the cap, or a review that did not finish) is
                  # reviewed without the screen.
                  screened "$AUTHOR" "$account" ;;
                # A review, or the screen first when the inputs ask for it. A review by hand of a pull request whose
                # head has runs that GitHub holds gets the task approve, which screens it and approves them. The
                # rescreen job's review of a head (the rescreen job, (b) and (c)) needs the head to have no review of
                # this workflow's form of now, no hold comment that names it, no merge conflict that its label comment
                # records, and no CI run that has not finished: the review of that CI run comes after it.
                review)
                  if [ "$mergeable" = dirty ]; then task=conflict; route review ""; fi
                  if [ "$ACTOR" = 'github-actions[bot]' ]; then
                    [[ $pr_head =~ ^[0-9a-f]{40}$ ]] || stop "it names no head commit."
                    marks=$(head_marks "$NUMBER" "$pr_head") || fail "the comments of #$NUMBER could not be read."
                    read -r reviewed named conflicted <<< "$marks"
                    [ "$reviewed" != new ] || stop "a review of the workflow names $pr_head."
                    [ "$named" = false ] || stop "a hold comment names $pr_head."
                    [ "$conflicted" = false ] \
                      || stop "its label comment records a merge conflict of $pr_head, which a relabel takes out first."
                    ci=$(ci_of "$pr_head") || fail "the CI runs of $pr_head could not be read."
                    [ "$ci" != pending ] || stop "a CI run of $pr_head has not finished, and its review comes after it."
                    [ -z "$of" ] || screened "$AUTHOR" "$limited"
                    route review ""
                  fi
                  if [ "$kind" = pr ]; then
                    n=$(held_runs) || fail "the runs of $pr_head could not be read."
                    if (( n > 0 )); then task=approve; screened "$AUTHOR" "$limited"; fi
                  fi
                  [ "$SCREEN" != true ] || route screen ""
                  route review "" ;;
                # The answer to a comment of the item's author, as for the event issue_comment. The rescreen job's run
                # needs the comment to wait still (waiting), and a hold of an answer that it tries again to be over an
                # hour old.
                answer)
                  [ -n "$COMMENT" ] || stop "it names no comment to answer."
                  who=$(comment_author) || fail "comment $COMMENT could not be read."
                  [ -n "$who" ] || stop "comment $COMMENT is not one of #$NUMBER."
                  [ "$who" = "$AUTHOR" ] || stop "comment $COMMENT is $who's, not its author's ($AUTHOR)."
                  a=0
                  known "$AUTHOR" || a=$?
                  (( a != 0 )) || stop "its author $AUTHOR has write access."
                  [ "$kind" = pr ] || replied || stop "its first reply has not posted."
                  if [ "$ACTOR" = 'github-actions[bot]' ]; then
                    waits=$(waiting "$NUMBER" "$AUTHOR" "$kind") || fail "the comments of #$NUMBER could not be read."
                    grep -q " $COMMENT\$" <<< "$waits" \
                      || stop "comment $COMMENT waits for no answer: an answer, a review or a hold of the workflow read it."
                    newest answer
                    again answer
                  fi
                  if [ "$mergeable" = dirty ]; then task=conflict; route review ""; fi
                  screened "$AUTHOR" "$limited" ;;
                # The draft of the reply to an outside author's issue. The rescreen job's run needs no stored draft and
                # no posted reply, no hold of the issue that is not tried again (the newest of its work: the issue
                # waits on Sami), and a hold of a draft that that job tries again to be over an hour old.
                draft)
                  a=0
                  known "$AUTHOR" || a=$?
                  (( a != 0 )) || stop "its author $AUTHOR has write access."
                  if [ "$ACTOR" = 'github-actions[bot]' ]; then
                    if stored; then stop "the draft of its reply is stored, or its reply posted."; fi
                    others=$(holds "$NUMBER") || fail "the comments of #$NUMBER could not be read."
                    [ -z "$(awk '$3 == "-"' <<< "$others")" ] || stop "a hold of it is not tried again."
                    newest draft
                    again draft
                  fi
                  screened "$AUTHOR" "$limited" ;;
                # A reply text that Sami approved: no screen and no model.
                reply) route review "" ;;
                # The screen of a first-time contributor's pull request, and the approval of its held runs when it
                # passes. The rescreen job's run needs held runs at the head, and a hold of an approval that it tries
                # again to be over an hour old.
                approve)
                  if [ "$mergeable" = dirty ]; then task=conflict; route review ""; fi
                  if [ "$ACTOR" = 'github-actions[bot]' ]; then
                    n=$(held_runs) || fail "the runs of $pr_head could not be read."
                    (( n > 0 )) || stop "GitHub holds no run of $pr_head."
                    newest approve
                    again approve
                  fi
                  screened "$AUTHOR" "$limited" ;;
                # The comment that asks the author to resolve a merge conflict, while the conflict is there. The
                # rescreen job's run needs a label comment that does not record the conflict of the head yet.
                conflict)
                  [ "$mergeable" = dirty ] || stop "it has no merge conflict (its mergeable_state is ${mergeable:-unknown})."
                  if [ "$ACTOR" = 'github-actions[bot]' ]; then
                    marks=$(head_marks "$NUMBER" "$pr_head") || fail "the comments of #$NUMBER could not be read."
                    read -r _ _ conflicted <<< "$marks"
                    [ "$conflicted" = false ] || stop "its label comment records the merge conflict of $pr_head already."
                  fi
                  route review "" ;;
                # The App's close and reopen, or only the reopen of a pull request that a catch-up run closed (above):
                # no screen and no model. The rescreen job's catch-up of an open pull request (the rescreen job, (a))
                # needs an outside author, a head repository that is still there (GitHub cannot reopen a pull request
                # whose head repository is gone), no review of the head, and CI runs of the head that all ended, the
                # newest over an hour ago.
                catchup)
                  if [ "$state" = open ] && [ "$mergeable" = dirty ]; then task=conflict; route review ""; fi
                  if [ "$ACTOR" = 'github-actions[bot]' ] && [ "$state" = open ]; then
                    [ -n "$of" ] || stop "its author $AUTHOR has write access."
                    [[ $head_repo =~ ^[1-9][0-9]*$ ]] || stop "its head repository is gone, so it is not closed."
                    marks=$(head_marks "$NUMBER" "$pr_head") || fail "the comments of #$NUMBER could not be read."
                    read -r reviewed _ _ <<< "$marks"
                    [ "$reviewed" = none ] || stop "a review names $pr_head."
                    ci=$(ci_of "$pr_head") || fail "the CI runs of $pr_head could not be read."
                    [[ -n $ci && $ci != pending ]] || stop "no CI run of $pr_head ended, or one has not finished."
                    [[ $ci < $(date -u -d '-1 hour' +%Y-%m-%dT%H:%M:%SZ) ]] \
                      || stop "the CI run of $pr_head ended at $ci, less than an hour ago."
                  fi
                  route review "" ;;
                # The import check run of R12 and the label of the head, set again from what the workflow wrote of the
                # head: no screen and no model. The outsider is the author when the author has no write access, as the
                # import check run is for an outside pull request alone, whose review came after a screen that passed.
                # The rescreen job's run needs GitHub to know whether the head has a merge conflict, and a review, a
                # hold comment or a recorded merge conflict of the workflow that names the head. The rescreen job
                # starts a relabel that is refused here again at its next run.
                relabel)
                  if [ "$mergeable" = dirty ]; then task=conflict; route review ""; fi
                  if [ "$ACTOR" = 'github-actions[bot]' ]; then
                    [ "$mergeable" != unknown ] || stop "GitHub does not say yet whether $pr_head has a merge conflict."
                    marks=$(head_marks "$NUMBER" "$pr_head") || fail "the comments of #$NUMBER could not be read."
                    read -r reviewed named conflicted <<< "$marks"
                    [[ $reviewed == new || $named == true || $conflicted == true ]] \
                      || stop "no review, hold comment or merge conflict of the workflow names $pr_head."
                  fi
                  a=0
                  known "$AUTHOR" || a=$?
                  (( a != 0 )) || route review ""
                  [[ $AUTHOR =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || stop "$AUTHOR is not a GitHub login."
                  route review "$AUTHOR" ;;
              esac ;;
            *) echo "::error::not an event of this workflow: $EVENT"; exit 1 ;;
          esac

  # Data only: nothing gathered here runs, and this job holds no model. The number, the head, the author and the text
  # come from the GitHub API, never from the CI run. The pull request's files come from git objects of its head
  # (git diff, git cat-file), never from a checkout, so no attribute, filter or hook of the pull request applies. What
  # .review/ leaves out is listed in omitted.txt. It is kept as one tar file, so that no file name of the pull request
  # can stop the upload, for a day, and the screen and review jobs take it by its SHA-256. An approval is gathered
  # only for its screen: no review follows it.
  gather:
    needs: trust
    if: >-
      github.ref == 'refs/heads/main'
      && (needs.trust.outputs.route == 'review' || needs.trust.outputs.route == 'screen')
      && (needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen'
          || needs.trust.outputs.task == 'answer' || needs.trust.outputs.task == 'draft'
          || (needs.trust.outputs.task == 'approve' && needs.trust.outputs.route == 'screen'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {contents: read, pull-requests: read, issues: read, checks: read, statuses: read}
    outputs:
      kind: ${{ steps.what.outputs.kind }}
      number: ${{ steps.what.outputs.number }}
      digest: ${{ steps.keep.outputs.digest }}
      # true for an outside item: its author has no write access and is not one of the APPS. The review's prompt says
      # which it is (.github/review.md, "Outside items and labels"), and the soundness rule reads it (SOUNDNESS_HOLD).
      outside: ${{ steps.gather.outputs.outside }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with: {persist-credentials: false, fetch-depth: 0}

      - name: What to review
        id: what
        env:
          NUMBER: ${{ needs.trust.outputs.number }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          kind=$(gh api "repos/$REPO/issues/$NUMBER" --jq 'if .pull_request then "pr" else "issue" end')
          echo "Reviewing $kind #$NUMBER."
          { echo "kind=$kind"; echo "number=$NUMBER"; } >> "$GITHUB_OUTPUT"

      - name: Gather the pull request or issue
        id: gather
        env:
          KIND: ${{ steps.what.outputs.kind }}
          NUMBER: ${{ steps.what.outputs.number }}
          # The head the trust job read from the API. When the pull request has moved on since, a newer push started
          # its own CI run, and so its own run of this file, which the trust job judged by that push's account: this
          # run gathers nothing, and so neither screens nor reviews.
          EVENT_HEAD: ${{ needs.trust.outputs.head }}
          # For an answer: the task, and the comment that the trust job read, which must still wait for an answer.
          TASK: ${{ needs.trust.outputs.task }}
          COMMENT: ${{ needs.trust.outputs.comment }}
        run: |
          set -euo pipefail
          out=.review
          mkdir -p "$out"
          : > "$out/omitted.txt"
          # trusted
          # trusted <login>: 0 when <login> is one of the APPS, or an account that GitHub's collaborator permission API
          # gives admin or write; 1 when it is neither; 2 when the API could not say. The API is asked once for each
          # login in this step (permission_of).
          declare -A permission_of=()
          trusted() {
            local permission
            [[ $1 =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || return 1
            [[ ,$APPS, != *",$1,"* ]] || return 0
            [[ $1 != *'[bot]' ]] || return 1
            if [ -z "${permission_of[$1]+set}" ]; then
              permission=$(gh api "repos/$REPO/collaborators/$1/permission" --jq .permission) || return 2
              permission_of[$1]=$permission
            fi
            [[ ${permission_of[$1]} == admin || ${permission_of[$1]} == write ]]
          }
          # end of trusted
          # comments
          # The comments, reviews and review comments that the review reads: those of the pull request's or the
          # issue's author, and of each account that trusted passes. GitHub's REST API names an App <name>[bot]. An
          # answer also reads the workflow's own comments and reviews of the item (own), as data: its review, its
          # answers, its hold comment and its label comment (each by the marker that starts it), and its fix reviews
          # with their suggested changes. They tell the answer the next step and whom the item waits on. The others
          # are counted in omitted.txt, and never read.
          author=$(gh api "repos/$REPO/issues/$NUMBER" --jq .user.login)
          # outside: true when trusted does not pass the author, also when GitHub could not say (status 2).
          outside=false
          trusted "$author" || outside=true
          echo "outside=$outside" >> "$GITHUB_OUTPUT"
          gh api --paginate "repos/$REPO/issues/$NUMBER/comments" \
            --jq '.[] | {id, author: .user.login, created_at, updated_at, body}' > "$RUNNER_TEMP/comments.jsonl"
          : > "$RUNNER_TEMP/reviews.jsonl"
          : > "$RUNNER_TEMP/review-comments.jsonl"
          if [ "$KIND" = pr ]; then
            gh api --paginate "repos/$REPO/pulls/$NUMBER/reviews" \
              --jq '.[] | {id, author: .user.login, state, submitted_at, body}' > "$RUNNER_TEMP/reviews.jsonl"
            gh api --paginate "repos/$REPO/pulls/$NUMBER/comments" \
              --jq '.[] | {id, review: .pull_request_review_id, author: .user.login, path,
                           line: (.line // .original_line), created_at, body}' \
              > "$RUNNER_TEMP/review-comments.jsonl"
          fi
          readers=("$author")
          while IFS= read -r login; do
            if [ "$login" != "$author" ] && trusted "$login"; then readers+=("$login"); fi
          done < <(cat "$RUNNER_TEMP"/{comments,reviews,review-comments}.jsonl | jq -r '.author // empty' | sort -u)
          read_json=$(jq -cn '$ARGS.positional' --args "${readers[@]}")
          own=false
          [ "${TASK:-}" != answer ] || own=true
          # The ids of the workflow's own fix reviews, whose review comments are its suggested changes.
          fixes=$(jq -cs --argjson own "$own" 'if $own then map(select(.author == "github-actions[bot]"
            and ((.body // "") | startswith("<!-- review-fix ")))) | map(.id) else [] end' "$RUNNER_TEMP/reviews.jsonl")
          # shellcheck disable=SC2016 # $readers, $own, $fixes and $what are jq's
          keep='(.author | IN($readers[])) or ($own and .author == "github-actions[bot]"
            and (if $what == "comments" then (.body // "") | test("^<!-- review(-answer [0-9]+| -->|-held -->|-label -->)")
                 elif $what == "reviews" then .id | IN($fixes[]) else .review | IN($fixes[]) end))'
          for what in comments reviews review-comments; do
            jq -s --argjson readers "$read_json" --argjson own "$own" --argjson fixes "$fixes" --arg what "$what" \
              "map(select($keep))" "$RUNNER_TEMP/$what.jsonl" > "$RUNNER_TEMP/$what.json"
            left=$(jq -s --argjson readers "$read_json" --argjson own "$own" --argjson fixes "$fixes" --arg what "$what" \
              "map(select($keep | not)) | length" "$RUNNER_TEMP/$what.jsonl")
            (( left == 0 )) || echo "$left $what by accounts without write access: not read" >> "$out/omitted.txt"
          done
          # For an answer, the comments of the author that wait for it, oldest first (answer-to.json): each comment,
          # each review with a text and each review comment of the author made after what the workflow's newest review,
          # fix review, answer or hold read, as the trust and rescreen jobs tell them (waiting). A review and a fix
          # review read the conversation when their run started, as their marker <!-- review-read <time> --> says (one
          # with no such marker, from before it, when GitHub last changed it), so that a comment made while their run
          # ran still waits. An answer answers the comments up to the one that its marker names, the newest that waited
          # for it. A hold comment counts from the time GitHub last changed it. A hold of an answer that the workflow
          # tries again (its marker names the task answer) answers nothing: each comment that waited when it was
          # written, up to the one that its marker names, still waits until an answer answers it, whatever review or
          # hold came after that hold. The answer answers each comment that waits, and its marker names the newest.
          # When the comment that the trust job read waits no more, an answer, a review or a hold of the workflow read
          # it: this run gathers nothing.
          if [ "$own" = true ]; then
            # shellcheck disable=SC2016 # $author, $c, $r, $rc and the names bound in the filter are jq's
            jq -n --arg author "$author" --slurpfile c "$RUNNER_TEMP/comments.json" \
              --slurpfile r "$RUNNER_TEMP/reviews.json" --slurpfile rc "$RUNNER_TEMP/review-comments.json" '
              def read_at: (.body // "")
                | capture("\n<!-- review-read (?<t>[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z) -->(\n|$)") | .t;
              ([$c[0][], $r[0][], $rc[0][]] | map(select(.author == $author)
                  | {key: (.id | tostring), value: (.created_at // .submitted_at // "")}) | from_entries) as $made
              | ([$c[0][] | select(.author == "github-actions[bot]" and ((.body // "") | test("^<!-- review-answer [0-9]+")))
                  | ((.body | capture("^<!-- review-answer (?<c>[0-9]+)") | .c) as $id | $made[$id] // .updated_at)]
                 | map(strings) | max // "") as $answered
              | ([($c[0][] | select(.author == "github-actions[bot]" and ((.body // "") as $b
                    | ($b | test("^<!-- review(-held)? -->")) and (($b | startswith("<!-- review-held -->"))
                        and ($b | test("\n<!-- review-held-[a-z]+ [0-9]+ [0-9]+ answer [0-9]+ -->(\n|$)")) | not)))
                  | {read: (read_at // .updated_at), at: .updated_at}),
                  ($r[0][] | select(.author == "github-actions[bot]")
                   | {read: (read_at // .submitted_at), at: .submitted_at})]) as $reads
              | ($reads | map(.read) + [$answered] | map(strings) | max // "") as $since
              | [$c[0][] | select(.author == "github-actions[bot]" and ((.body // "") | startswith("<!-- review-held -->")))
                  | (.body | capture("\n<!-- review-held-[a-z]+ [0-9]+ [0-9]+ answer (?<c>[0-9]+) -->(\n|$)") | .c) as $id
                  | {upto: $made[$id], at: .updated_at} | select(.upto != null)] as $holds
              | [($c[0][] | select(.author == $author) | {id, kind: "comment", created_at, body}),
                 ($r[0][] | select(.author == $author and ((.body // "") | test("\\S")))
                  | {id, kind: "review", created_at: .submitted_at, body}),
                 ($rc[0][] | select(.author == $author) | {id, kind: "review comment", created_at, path, line, body})]
              | map(select((.created_at // "") as $m | $m > $since or any($holds[]; . as $h | $m <= $h.upto
                  and $m > $answered and $m > ([$reads[] | select(.at < $h.at) | .read] | map(strings) | max // ""))))
              | sort_by(.created_at)' > "$out/answer-to.json"
            if ! jq -e --arg id "${COMMENT:-}" 'any(.[]; (.id | tostring) == $id)' "$out/answer-to.json" > /dev/null; then
              echo "::notice::#$NUMBER: the comment ${COMMENT:-} waits for no answer: an answer, a review or a hold of the workflow read it. This run gathers nothing."
              echo "answered=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "#$NUMBER: $(jq length "$out/answer-to.json") comments of $author wait for the answer."
          fi
          # end of comments
          if [ "$KIND" = issue ]; then
            gh issue view "$NUMBER" -R "$REPO" --json number,title,author,createdAt,state,body \
              | jq --slurpfile c "$RUNNER_TEMP/comments.json" '. + {comments: $c[0]}' > "$out/issue.json"
          else
            gh pr view "$NUMBER" -R "$REPO" --json \
              number,title,author,createdAt,isDraft,baseRefName,headRefOid,headRepository,body,commits,files \
              | jq --slurpfile c "$RUNNER_TEMP/comments.json" --slurpfile r "$RUNNER_TEMP/reviews.json" \
                  '. + {comments: $c[0], reviews: $r[0]}' > "$out/pr.json"
            gh pr view "$NUMBER" -R "$REPO" --json statusCheckRollup > "$out/checks.json"
            jq -r '.[] | "\(.author) \(.path):\(.line) \(.body)"' "$RUNNER_TEMP/review-comments.json" \
              > "$out/review-comments.txt"
            if [ -n "$EVENT_HEAD" ] && [ "$(jq -r .headRefOid "$out/pr.json")" != "$EVENT_HEAD" ]; then
              echo "::notice::#$NUMBER has moved on from $EVENT_HEAD: the run of its newer push considers it."
              echo "moved=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            base=$(jq -r .baseRefName "$out/pr.json")
            [ "$base" = main ] || { echo "::error::pull request #$NUMBER is into $base, not main: not reviewed."; exit 1; }
            git fetch -q --no-tags origin "+refs/pull/$NUMBER/head:refs/review/head"
            head=$(git rev-parse refs/review/head)
            [ "$head" = "$(jq -r .headRefOid "$out/pr.json")" ] \
              || { echo "::error::the pull request's head moved while it was read; the next run reviews the new head."; exit 1; }
            mb=$(git merge-base origin/main "$head")
            printf 'base %s\nhead %s\n' "$mb" "$head" > "$out/commits.txt"
            git diff --no-renames --name-only -z "$mb" "$head" > "$RUNNER_TEMP/changed"
            changed=$(tr -cd '\0' < "$RUNNER_TEMP/changed" | wc -c)
            (( changed <= 3000 )) || { echo "::error::$changed changed files: too large for this review."; exit 1; }
            git diff --no-renames --no-ext-diff --no-textconv "$mb" "$head" > "$out/pr.diff"
            # Each changed file as the pull request has it: regular files only, each cut at 2 MiB, 512 MiB in all.
            total=0
            while IFS= read -r -d '' path; do
              mode=$(git ls-tree --format='%(objectmode)' "$head" -- ":(literal)$path")
              case $mode in
                '') echo "$path: deleted" >> "$out/omitted.txt"; continue ;;
                100644|100755) ;;
                *) echo "$path: not a regular file (mode $mode)" >> "$out/omitted.txt"; continue ;;
              esac
              file="$out/head/$path"
              mkdir -p "$(dirname -- "$file")"
              git cat-file blob "$head:$path" > "$file"
              size=$(stat -c %s "$file")
              total=$((total + size))
              (( total <= 536870912 )) || { echo "::error::the changed files hold over 512 MiB: too large for this review."; exit 1; }
              if (( size > 2097152 )); then
                truncate -s 2097152 "$file"
                echo "$path: cut at 2 MiB of its $size bytes" >> "$out/omitted.txt"
              fi
            done < "$RUNNER_TEMP/changed"
            # Claude Code reads a CLAUDE.md, an AGENTS.md or a .claude/ beside a file it reads as instructions. The pull
            # request's are data, so they go.
            if [ -d "$out/head" ]; then
              find "$out/head" \( -iname 'CLAUDE*.md' -o -iname 'AGENTS*.md' -o -iname .claude \) -prune -print0 \
                | while IFS= read -r -d '' p; do
                    echo "${p#"$out"/head/}: removed (instructions for Claude Code)" >> "$out/omitted.txt"
                    rm -rf -- "$p"
                  done
            fi
          fi
          echo "Gathered $(find "$out" -type f | wc -l) files."

      # Nothing is kept when the pull request moved on, or when the comment of an answer waits no more.
      - name: Keep it for the screen and the review
        id: keep
        if: steps.gather.outputs.moved != 'true' && steps.gather.outputs.answered != 'true'
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/review-data"
          tar -cf "$RUNNER_TEMP/review-data/review.tar" .review
          digest=$(sha256sum "$RUNNER_TEMP/review-data/review.tar" | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Kept .review/ as review.tar, SHA-256 $digest."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (sha-pinned)
        if: steps.gather.outputs.moved != 'true' && steps.gather.outputs.answered != 'true'
        with: {name: review-data, path: "${{ runner.temp }}/review-data/review.tar", if-no-files-found: error, retention-days: 1, overwrite: true}

  # The screen of a pull request or issue whose author, or the account that started the run, has no write access, or
  # that a run by hand asked to screen (the top of this file, and .github/screen.py). In the environment review-screen,
  # whose jobs alone can exchange their identity token for the screen's three: so this job cannot get the review's
  # Claude token, and no other job, the review's included, can get the screen's. Its one output is the verdict, clean
  # or held; the reason goes to the private bucket REASON_BUCKET.
  screen:
    name: screen ${{ needs.trust.outputs.outsider }}
    needs: [trust, gather]
    # A screen of what the gather job kept, or a measurement, which needs no gather job.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main'
          && ((needs.trust.outputs.route == 'screen' && needs.gather.result == 'success'
               && needs.gather.outputs.digest != '') || needs.trust.outputs.route == 'measure') }}
    environment: {name: review-screen, deployment: false}
    # One screen at a time for each item and task: a newer head cancels the screen of the older one. An answer never
    # cancels a review's screen, nor a review an answer's. A draft or a reply is never cancelled.
    concurrency:
      group: screen-${{ needs.trust.outputs.task }}-${{ needs.trust.outputs.number }}
      cancel-in-progress: ${{ needs.trust.outputs.task != 'draft' && needs.trust.outputs.task != 'reply' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ needs.trust.outputs.route == 'measure' && 60 || 15 }}
    permissions: {contents: read, id-token: write}
    outputs:
      verdict: ${{ steps.screen.outputs.verdict }}
    env:
      # Ids and endpoints, not secrets. Google Cloud: the pool, its provider and the account that only this
      # environment's jobs of this file reach, Model Armor's template, and the bucket the reason goes to.
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/805240912354/locations/global/workloadIdentityPools/review-screen/providers/github
      GCP_SERVICE_ACCOUNT: review-screen@theorem-agent-infra.iam.gserviceaccount.com
      MODEL_ARMOR_URL: https://modelarmor.us.rep.googleapis.com
      MODEL_ARMOR_TEMPLATE: projects/theorem-agent-infra/locations/us/templates/review-screen
      STORAGE_URL: https://storage.googleapis.com
      REASON_BUCKET: theorem-agent-infra-review-screen-reasons
      # The reason object of this run's attempt, which the Screen step writes, or the sign-in to Anthropic and Azure
      # when it fails, and what it names of the run.
      REASON_OBJECT: ${{ github.repository }}/${{ github.run_id }}-${{ github.run_attempt }}.json
      REPOSITORY: ${{ github.repository }}
      NUMBER: ${{ needs.trust.outputs.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Azure: Theorem's tenant, the managed identity review-screen, whose federated credential admits this
      # repository's jobs in review-screen, and whose role allows text:shieldPrompt on the Content Safety account and
      # nothing else.
      AZURE_LOGIN_URL: https://login.microsoftonline.com
      AZURE_TENANT_ID: aaa6ad34-51af-41e7-891f-f16f5c53c396
      AZURE_CLIENT_ID: 878cb696-144f-4c60-b04c-3974fad24e96
      CONTENT_SAFETY_URL: https://theorem-review-screen.cognitiveservices.azure.com
      # Anthropic: Theorem's organization, the service account review-screen (not the review's oss-verify-ci), its
      # workspace, and the federation rule rocq-linux-process-semantics-screen, which admits only this file's jobs in
      # review-screen on main, for this file's events (workflow_run and issue_comment from when that rule admits them),
      # with the scope workspace:inference.
      ANTHROPIC_URL: https://api.anthropic.com
      ANTHROPIC_ORGANIZATION_ID: 5fd73c3e-8a2c-4166-b80d-fb5ce0c1b4a6
      ANTHROPIC_WORKSPACE_ID: wrkspc_01Qr1iUVcow4jdgQM7Amfks5
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01JFhEhPizCyTiK2i22mRJ8a
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01SQMHj4Tw85dV4DNYWQDKeA
      SCREEN_MODEL: claude-haiku-5-5
      # The checks that run, all three. A listed check whose settings are missing, or that cannot answer (a 429 of
      # Prompt Shields' free tier among the causes), holds the item; a check leaves only by leaving this list.
      SCREEN_CHECKS: model_armor,prompt_shields,claude
      # How the checks' words make the verdict (.github/screen.py, RULES, with the measurement behind the choice):
      # held when the model answers suspicious, or Model Armor and Prompt Shields both do; and, under every rule, when
      # a check cannot answer.
      SCREEN_RULE: claude_or_both_detectors
    steps:
      # main's .github/, for screen.py; never the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with: {persist-credentials: false, sparse-checkout: .github, sparse-checkout-cone-mode: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (sha-pinned)
        if: needs.trust.outputs.route != 'measure'
        with: {name: review-data, path: "${{ runner.temp }}/review-data"}
      - name: Take the gathered pull request or issue
        if: needs.trust.outputs.route != 'measure'
        env: {DIGEST: "${{ needs.gather.outputs.digest }}"}
        run: |
          set -euo pipefail
          tar=$RUNNER_TEMP/review-data/review.tar
          [[ $DIGEST =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the gather job gave no SHA-256"; exit 1; }
          printf '%s  %s\n' "$DIGEST" "$tar" | sha256sum -c --strict
          # The listing goes to a file first: grep -q in a pipe would stop tar early, and pipefail would read that as
          # the check passing.
          tar -tf "$tar" > "$RUNNER_TEMP/review-data/members"
          ! grep -qvE '^\.review(/|$)' "$RUNNER_TEMP/review-data/members" \
            || { echo "::error::review.tar holds more than .review/"; exit 1; }
          ! grep -qE '(^|/)\.\.(/|$)' "$RUNNER_TEMP/review-data/members" || { echo "::error::review.tar holds a .. path"; exit 1; }
          [ ! -e .review ] || { echo "::error::.review is there already"; exit 1; }
          tar -xf "$tar" --no-same-owner --no-same-permissions
          echo "Took $(find .review -type f | wc -l) files."

      # A token for 10 minutes, or an hour for a measurement, which can run longer, which the account can use for
      # Model Armor, for adding an object to the reason bucket and for reading the labelled set, and for nothing else.
      # A sign-in that fails fails this job before the screen, with no verdict, and the hold job holds nothing for it.
      - name: Sign in to Google Cloud
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (sha-pinned)
        with: {workload_identity_provider: "${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}", service_account: "${{ env.GCP_SERVICE_ACCOUNT }}", token_format: access_token, access_token_lifetime: "${{ needs.trust.outputs.route == 'measure' && '3600s' || '600s' }}", create_credentials_file: false, export_environment_variables: false}
      # This step exchanges the identity token for Microsoft Entra's token for Prompt Shields and for Anthropic's token
      # for the screen's model, each when SCREEN_CHECKS lists its check and the job's env above sets up its identity.
      # Both tokens go to a file under the runner's temporary directory that only the runner's account can read, and
      # that the Screen or Measure step deletes as it reads it; never to this log or an output. An exchange that fails,
      # or that has not answered after the sign-in's own 120 seconds, fails this job before the screen, with no
      # verdict, and the hold job holds nothing for it. This log then gets the HTTP status and the error code of a
      # refused exchange alone: the service's text goes to the reason object in REASON_BUCKET, with the Google token
      # of the step before, and is lost when that object cannot be written.
      - name: Sign in to Anthropic and Azure
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python3 .github/screen.py --sign-in
      # The screen reads the tokens of the step before and deletes their file.
      - name: Screen
        id: screen
        if: needs.trust.outputs.route != 'measure'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python3 .github/screen.py .review
      # Every listed check, three times, on each text of the labelled set kept in the private bucket, and the verdict
      # of each rule of SCREEN_RULE's choices, with the tokens of the sign-in. The texts and their words stay in the
      # bucket; this log and the run's summary get the counts per rule alone.
      - name: Measure
        if: needs.trust.outputs.route == 'measure'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          MEASURE_SET: ${{ inputs.measure_set }}
          MEASURE_OBJECT: measure/runs/${{ github.repository }}/${{ github.run_id }}-${{ github.run_attempt }}.json
          MEASURE_REPEATS: ${{ inputs.measure_repeats }}
        run: |
          set -euo pipefail
          [[ $MEASURE_SET =~ ^measure/set-v[0-9]+\.json$ ]] || { echo "::error::not a labelled set: $MEASURE_SET"; exit 1; }
          [[ $MEASURE_REPEATS =~ ^[1-5]$ ]] || { echo "::error::MEASURE_REPEATS must be 1 to 5"; exit 1; }
          python3 .github/screen.py --measure

  review:
    # The hourly caps tell the two kinds of review apart by this name.
    name: ${{ needs.trust.outputs.route == 'screen' && 'review (screened)' || 'review' }}
    needs: [trust, gather, screen]
    # A writer's, or a request by hand; or one the screen passed. A run whose gather job failed, or whose screen held
    # it, failed or was cancelled, has no review. Its tasks: the review, the rescreen of a review, and the answer to the
    # comments of an outside item's author, with the fix that a review or an answer starts; and the draft of the reply
    # to a new issue of an outside author. The approved reply has no job here: the comment job posts the text of its
    # run, which this job neither reads nor keeps.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main'
      && needs.gather.result == 'success' && needs.gather.outputs.digest != ''
      && (needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen'
          || needs.trust.outputs.task == 'answer' || needs.trust.outputs.task == 'draft')
      && (needs.trust.outputs.route == 'review'
          || (needs.trust.outputs.route == 'screen' && needs.screen.result == 'success'
              && needs.screen.outputs.verdict == 'clean'))
    # One run of this job at a time for each pull request or issue and task: a new push replaces the review of the old
    # head, and a later comment's answer run answers every comment that waits. An answer never cancels a review, nor a
    # review an answer: their groups differ. A draft or a reply is never cancelled. A run that the trust job stops, or
    # that the screen holds, never reaches this job, so it cancels nothing.
    concurrency:
      group: review-${{ needs.trust.outputs.task }}-${{ needs.trust.outputs.number }}
      cancel-in-progress: ${{ needs.trust.outputs.task != 'draft' && needs.trust.outputs.task != 'reply' }}
    runs-on: ubuntu-24.04
    # The review, the answer or the draft, then the fix, each with its own time.
    timeout-minutes: 100
    permissions: {contents: read, pull-requests: read, issues: read, checks: read, statuses: read, actions: read, id-token: write}
    outputs:
      head: ${{ steps.result.outputs.head || steps.answered.outputs.head }}
      # The review's verdict (pass, blocking or person), after the soundness rule (SOUNDNESS_HOLD), for the state label.
      verdict: ${{ steps.result.outputs.verdict }}
      # The facts of the two stops of the fix, for the state label: will_fix (true or false), when the author said they
      # will make the change, and fix_stop, when 2 fix reviews since the author's last own push did not make the
      # review pass.
      will_fix: ${{ steps.fixable.outputs.will_fix }}
      fix_stop: ${{ steps.fixable.outputs.fix_stop }}
      body: ${{ steps.result.outputs.body }}
      # The answer, with its marker. It is empty when the answer gives none.
      answer: ${{ steps.answered.outputs.body }}
      # The fix: the request of one review of suggested changes (POST pulls/<n>/reviews). It is empty when no fix posts.
      fix: ${{ steps.fixed.outputs.review }}
      # The text that the fresh reader refused, so that nothing of it posts: review, answer or fix. Empty when it
      # refused none.
      refused: ${{ steps.result.outputs.refused || steps.answered.outputs.refused || steps.fixed.outputs.refused }}
      # The run and the attempt of a draft that this job uploaded, <run>-<attempt>, which name the run of its artifact:
      # never its text. It is empty when no draft was uploaded.
      draft: ${{ steps.drafted.outputs.draft }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      # Theorem's Anthropic organization, its service account oss-verify-ci and its workspace, and the federation rule
      # that admits this file on main (ids, not secrets), which the Claude steps, the sign-ins to Anthropic and the
      # fresh reader read.
      ANTHROPIC_URL: https://api.anthropic.com
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01PuYUs4GWGMxDQi1kLWwu7y
      ANTHROPIC_ORGANIZATION_ID: 5fd73c3e-8a2c-4166-b80d-fb5ce0c1b4a6
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01WdHTLcJPEfiPttcuLK1hGT
      ANTHROPIC_WORKSPACE_ID: wrkspc_01Qr1iUVcow4jdgQM7Amfks5
      # The Linux the model describes (README.md, SCOPE.md: stable Linux v6.18.46), and QEMU 10.0.11, the version of
      # SCOPE.md's QEMU measurements.
      LINUX_URL: https://github.com/gregkh/linux
      LINUX_COMMIT: 1f99e9ab748fc5c32120de9c4eca31abfe54a4d5
      QEMU_URL: https://github.com/qemu/qemu
      QEMU_COMMIT: e3ad0582fdcec5c194835b0b4e8342cdc197b5cb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with: {persist-credentials: false}

      # Anthropic's exchange of a new identity token, with the federation rule, the organization, the service account
      # and the workspace of the job's env, which the Review step uses too, before any step that runs the model. The
      # step only shows that the rule admits this run: the Claude token it gets is checked and then dropped, never
      # printed, written or kept, and the Review step gets a token of its own. When the rule does not admit the run (a
      # run of an event that the rule does not admit yet, say), the job fails here, at a step whose name starts with
      # "Sign in", before the model, and the hold job holds nothing for it: the schedule takes the item again. curl
      # reads the request header and the exchange's body from its standard input, so that no token is in a command
      # line.
      - name: Sign in to Anthropic
        run: |
          set -euo pipefail
          fail() { echo "::error::The sign-in to Anthropic failed: $1 No model ran."; exit 1; }
          [[ -n ${ACTIONS_ID_TOKEN_REQUEST_URL:-} && -n ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-} ]] \
            || fail "this job can get no identity token."
          jwt=$(printf 'header = "Authorization: Bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            | curl -sS --fail --retry 3 -K - -G --data-urlencode audience=https://api.anthropic.com \
                "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -er '.value | strings | select(length > 0)') \
            || fail "GitHub gave no identity token."
          answer=$(JWT=$jwt jq -n '{grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer", assertion: $ENV.JWT,
              federation_rule_id: $ENV.ANTHROPIC_FEDERATION_RULE_ID, organization_id: $ENV.ANTHROPIC_ORGANIZATION_ID,
              service_account_id: $ENV.ANTHROPIC_SERVICE_ACCOUNT_ID, workspace_id: $ENV.ANTHROPIC_WORKSPACE_ID}' \
            | curl -sS --retry 3 -H 'Content-Type: application/json' --data-binary @- -w '\n%{http_code}' \
                "$ANTHROPIC_URL/v1/oauth/token") || fail "Anthropic could not be reached."
          jwt=""
          status=${answer##*$'\n'}
          answer=${answer%$'\n'*}
          # An answer that is not 2xx holds no token. This log gets its HTTP status and its error code alone (OAuth's
          # error field, or the type of Anthropic's error object), never Anthropic's text: the log of a public
          # repository is public, and no private store is there for the text.
          if [[ $status != 2[0-9][0-9] ]]; then
            code=$(jq -r '.error | if type == "object" then .type else . end | strings
              | select(test("^[A-Za-z0-9_.:-]{1,64}$"))' <<< "$answer" 2> /dev/null) || code=""
            fail "HTTP $status from Anthropic, ${code:+error code }${code:-no error code}."
          fi
          jq -e '.access_token | strings | length > 0' <<< "$answer" > /dev/null 2>&1 \
            || fail "Anthropic gave no access token."
          answer=""
          echo "Anthropic's federation rule admits this run. The Review step gets a token of its own."

      # Counts this workflow's other runs whose review job started in the last hour, or has not started, and has called
      # the model or may still call it: one whose Review, Answer or Draft step ran or runs (the Fix step runs after one
      # of them, in the same job, and counts with it); one that passed the step "Hold at the hourly cap" and has not
      # finished; and one that has not finished that step yet and belongs to an earlier run, which goes first. So in a
      # burst the earliest runs go ahead and the later ones stop at that step. A run counts once, whatever attempts of
      # its review job the jobs list (filter=all): the schedule runs again the failed jobs of a run whose screen passed
      # and whose review could not sign in, and that run counts once. This run's own attempts never count. Runs created
      # up to 3 hours ago are read, which covers a job's 100 minutes and its time in the queue: the runs of
      # workflow_run, issues, issue_comment and workflow_dispatch, never a fork's own run of this file (pull_request). A
      # review job that waits for its run's trust job is not listed yet, and one the trust job skipped has no Review,
      # Answer or Draft step, so neither counts. The runs are listed one status at a time (GitHub's status filter takes
      # a status or a conclusion): each one that the filter takes but two, skipped, the end of a run whose every job
      # GitHub skipped (the run of a comment of a person who is not the author of its item, say), and completed, which
      # holds those runs too. So such runs never fill a list. The lists are read in the order in which a run goes
      # through those statuses, so that a run that moves on between two reads is in a later list. A run that ended
      # before the hour began has no review job of the hour, so its jobs are not read. Only jobs of this run's kind
      # count, by the job's name, whatever the task of their run: a writer's review or answer against HOURLY_CAP, a
      # screened one (a draft among them) against SCREENED_HOURLY_CAP. GitHub gives at most 1,000 runs for a list with
      # created, the newest first, and its total_count then says that more match: the runs that such a list does not
      # give can hold reviews of the hour, so the count is then the cap. A read that fails stops the run here, not at
      # "Hold at the hourly cap", so that the hold job, which reads a failure of that step as the cap, never says the
      # cap was reached when it was not.
      - name: Count the reviews of the last hour
        id: count
        env:
          RUN_ID: ${{ github.run_id }}
          POOL: ${{ needs.trust.outputs.route == 'screen' && 'review (screened)' || 'review' }}
          CAP: ${{ needs.trust.outputs.route == 'screen' && env.SCREENED_HOURLY_CAP || env.HOURLY_CAP }}
        run: |
          set -uo pipefail
          stop() { echo "::error::$1 No model ran. A maintainer can re-run this run."; exit 1; }
          [[ $CAP =~ ^[1-9][0-9]*$ ]] || stop "the cap is not a number."
          SINCE=$(date -u -d '-1 hour' +%s) || stop "the time could not be read."
          from=$(date -u -d '-3 hours' +%Y-%m-%dT%H:%M:%SZ) || stop "the time could not be read."
          export SINCE
          runs="" cut=""
          for status in requested queued pending waiting in_progress success failure cancelled timed_out neutral \
            action_required stale; do
            # Before the runs of each page, "= <total_count> <runs on the page>".
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            out=$(gh api --method GET --paginate "repos/$REPO/actions/workflows/review.yml/runs" \
              -f status="$status" -f created=">=$from" -F per_page=100 \
              --jq '"= \(.total_count // (.workflow_runs | length)) \(.workflow_runs | length)", (.workflow_runs[]
                | select((.id | tostring) != $ENV.RUN_ID
                         and (.event == "workflow_run" or .event == "issues" or .event == "issue_comment"
                              or .event == "workflow_dispatch") and .conclusion != "skipped"
                         and (.status != "completed" or .updated_at == null
                              or (.updated_at | fromdateiso8601) >= ($ENV.SINCE | tonumber)))
                | "\(.id) \(.created_at)")') \
              || stop "the runs could not be read."
            # GitHub runs this step with bash -e: the status of awk is read with ||, so that a cut list does not end it.
            whole=0
            rows=$(awk '$1 == "=" { if ($2 > total) total = $2; listed += $3; next } { rows[++n] = $0 }
              END { if (listed < total) exit 3; for (i = 1; i <= n; i++) print rows[i] }' <<< "$out") || whole=$?
            case $whole in
              0) runs+=$rows$'\n' ;;
              3) cut=$status runs=""; break ;;
              *) stop "the runs could not be read." ;;
            esac
          done
          count=0
          if [ -n "$cut" ]; then
            echo "GitHub lists at most 1,000 runs of this workflow of the status $cut since $from, and more of them" \
              "match. The runs that it does not list can hold reviews of the last hour, so the count is the cap."
            count=$CAP
          fi
          declare -A counted=()
          while read -r id created; do
            [ -n "$id" ] || continue
            [[ $id =~ ^[0-9]+$ ]] || stop "a run id is not a number."
            [ -z "${counted[$id]:-}" ] || continue
            counted[$id]=1
            # true on a page of the run's jobs that holds a review job of this pool that counts.
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            found=$(RUN_CREATED=$created gh api --method GET --paginate "repos/$REPO/actions/runs/$id/jobs" \
              -f filter=all -F per_page=100 --jq '
                any(.jobs[]; .name == $ENV.POOL
                  and ((.started_at // $ENV.RUN_CREATED) | fromdateiso8601) >= ($ENV.SINCE | tonumber)
                  and ([(.steps // [])[] | select(.name == "Review" or .name == "Answer" or .name == "Draft")] as $models
                    | ([(.steps // [])[] | select(.name == "Hold at the hourly cap")] | first) as $cap
                    | any($models[]; .status == "in_progress" or (.conclusion != null and .conclusion != "skipped"))
                      or (.status != "completed" and $cap != null and $cap.conclusion == "success")
                      or (.status != "completed" and ($cap == null or $cap.status != "completed")
                          and .run_id < ($ENV.RUN_ID | tonumber))))') || stop "the jobs of run $id could not be read."
            [[ -n $found ]] && ! grep -qvxE 'true|false' <<< "$found" || stop "the jobs of run $id could not be read."
            if grep -qx true <<< "$found"; then count=$((count + 1)); fi
          done <<< "$runs"
          # A failed write would leave the count empty: it stops the run here (the next step refuses an empty count too).
          echo "count=$count" >> "$GITHUB_OUTPUT" || stop "the count could not be written."
          echo "$count reviews ($POOL) called the model, or may, in the last hour."

      # A count that is not a number, or a cap that is not one, lets no model run. It fails here, in a step of its own,
      # so that the hold job reads it as a review that did not finish (a try counts), not as the cap reached.
      - name: Check the count and the cap
        env:
          COUNT: ${{ steps.count.outputs.count }}
          CAP: ${{ needs.trust.outputs.route == 'screen' && env.SCREENED_HOURLY_CAP || env.HOURLY_CAP }}
        run: |
          set -uo pipefail
          [[ $COUNT =~ ^[0-9]+$ && $CAP =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::no count of the hour's reviews ($COUNT) or no cap ($CAP). No model ran."; exit 1; }
          echo "A count of $COUNT against a cap of $CAP."

      # Runs after the two steps above have passed, so it fails only when the count is at the cap: the hold job reads
      # this step's failure as the cap reached.
      - name: Hold at the hourly cap
        env:
          COUNT: ${{ steps.count.outputs.count }}
          POOL: ${{ needs.trust.outputs.route == 'screen' && 'review (screened)' || 'review' }}
          CAP: ${{ needs.trust.outputs.route == 'screen' && env.SCREENED_HOURLY_CAP || env.HOURLY_CAP }}
        run: |
          set -uo pipefail
          if (( COUNT >= CAP )); then
            echo "::error::HELD: $COUNT reviews ($POOL) called the model, or may, in the last hour: the cap is $CAP." \
              "No model ran. A maintainer can re-run this run once the hour has passed."
            exit 1
          fi
          echo "$COUNT reviews ($POOL) in the last hour, under the cap of $CAP."

      # What the gather job kept.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (sha-pinned)
        with: {name: review-data, path: "${{ runner.temp }}/review-data"}
      - name: Take the gathered pull request or issue
        env: {DIGEST: "${{ needs.gather.outputs.digest }}"}
        run: |
          set -euo pipefail
          tar=$RUNNER_TEMP/review-data/review.tar
          [[ $DIGEST =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the gather job gave no SHA-256"; exit 1; }
          printf '%s  %s\n' "$DIGEST" "$tar" | sha256sum -c --strict
          # The listing goes to a file first: grep -q in a pipe would stop tar early, and pipefail would read that as
          # the check passing.
          tar -tf "$tar" > "$RUNNER_TEMP/review-data/members"
          ! grep -qvE '^\.review(/|$)' "$RUNNER_TEMP/review-data/members" \
            || { echo "::error::review.tar holds more than .review/"; exit 1; }
          ! grep -qE '(^|/)\.\.(/|$)' "$RUNNER_TEMP/review-data/members" || { echo "::error::review.tar holds a .. path"; exit 1; }
          [ ! -e .review ] || { echo "::error::.review is there already"; exit 1; }
          tar -xf "$tar" --no-same-owner --no-same-permissions
          echo "Took $(find .review -type f | wc -l) files."

      # The source the model describes, for the kernel and QEMU code that comments and issues cite.
      - name: Gather the Linux and QEMU source
        run: |
          set -euo pipefail
          out=.review
          fetch() {
            local dir=$1 url=$2 commit=$3; shift 3
            git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 --filter=blob:none "$url" "$commit"
            git -C "$dir" sparse-checkout set --no-cone "$@"
            git -C "$dir" -c advice.detachedHead=false checkout -q FETCH_HEAD
            rm -rf "$dir/.git"
            find "$dir" \( -iname 'CLAUDE*.md' -o -iname 'AGENTS*.md' -o -iname .claude \) -prune -exec rm -rf {} +
          }
          fetch "$out/linux" "$LINUX_URL" "$LINUX_COMMIT" /mm/ /kernel/ /ipc/ /lib/ /arch/riscv/ /include/ /fs/ /net/ \
            /security/ /init/ /block/ /io_uring/ /drivers/char/ /drivers/tty/
          fetch "$out/qemu" "$QEMU_URL" "$QEMU_COMMIT" /linux-user/ /include/user/ /target/riscv/
          echo "Gathered $(find "$out" -type f | wc -l) files."

      # The Review step's action writes this job's GitHub token into the checkout's git configuration (as the origin
      # URL), and Claude can read every file of the working directory. So git's own directory moves under the runner's
      # temporary directory, which Claude cannot read, and .git becomes a file that names it. git works as before.
      - name: Keep git's configuration out of Claude's reach
        run: |
          set -euo pipefail
          git init -q --separate-git-dir="$RUNNER_TEMP/review-git"
          [ -f .git ] || { echo "::error::.git is still a directory"; exit 1; }

      # The action would download and run Claude Code's installer (curl https://claude.ai/install.sh | bash) and a Bun
      # at run time, unchecked, in a job that holds an identity token. This step downloads the versions that the action
      # at its pinned commit installs, and refuses any file whose SHA-256 is not the one written here. When the action's
      # pin moves, take the new versions from its src/entrypoints/run.ts (claudeCodeVersion) and its action.yml
      # (bun-version), and their digests from https://downloads.claude.ai/claude-code-releases/<version>/manifest.json
      # (platforms.linux-x64.checksum) and from the bun-linux-x64.zip asset of the oven-sh/bun release.
      - name: Download Claude Code and Bun at pinned digests
        env:
          CLAUDE_CODE_VERSION: 2.1.312
          CLAUDE_CODE_SHA256: 4f4178ce41d83e23341ebfbaecdbcf8ea6bf7baea0690025abe49eeec3a5d01d
          BUN_VERSION: 1.4.4
          BUN_SHA256: bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c
        run: |
          set -euo pipefail
          [ "$(uname -sm)" = "Linux x86_64" ] || { echo "::error::the pinned binaries are for Linux on x86-64"; exit 1; }
          dir=$RUNNER_TEMP/review-tools
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/claude" \
            "https://downloads.claude.ai/claude-code-releases/$CLAUDE_CODE_VERSION/linux-x64/claude"
          curl -fsSL --retry 3 -o "$dir/bun.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/bun-linux-x64.zip"
          printf '%s  %s\n' "$CLAUDE_CODE_SHA256" "$dir/claude" "$BUN_SHA256" "$dir/bun.zip" | sha256sum -c --strict
          unzip -q -j "$dir/bun.zip" bun-linux-x64/bun -d "$dir"
          rm "$dir/bun.zip"
          chmod +x "$dir/claude" "$dir/bun"

      # allowed_non_write_users, which a screened item sets, makes the action put /usr/bin and /bin before the pinned
      # Bun on the PATH. So no other Bun may be there.
      - name: No Bun but the pinned one
        run: |
          set -euo pipefail
          for bun in /usr/bin/bun /bin/bun; do
            [ ! -e "$bun" ] || { echo "::error::$bun is on the runner, ahead of the pinned Bun"; exit 1; }
          done

      - name: Review
        id: review
        if: needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen'
        timeout-minutes: 50
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1 (v1.0.264, sha-pinned)
        with:
          # The job's Anthropic ids (ids, not secrets).
          anthropic_federation_rule_id: ${{ env.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ env.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ env.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ env.ANTHROPIC_WORKSPACE_ID }}
          github_token: ${{ github.token }}
          # The action itself refuses a run started by an account without write access (its default), and any App
          # but these, except the account whose pull request or issue the screen passed: this job runs for a
          # screened item only when the screen job's verdict is clean (its if). The rescreen job's runs are started by
          # github-actions[bot], which it admits for a run by hand alone, and this job runs only when the trust job
          # accepted that run: then the run reviews a screened item whose screen passed, or a writer's item.
          allowed_non_write_users: ${{ needs.trust.outputs.route == 'screen' && needs.trust.outputs.outsider || '' }}
          allowed_bots: >-
            ${{ github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]'
            && format('{0},github-actions[bot]', env.APPS)
            || needs.trust.outputs.route == 'screen' && endsWith(needs.trust.outputs.outsider, '[bot]')
            && format('{0},{1}', env.APPS, needs.trust.outputs.outsider) || env.APPS }}
          path_to_claude_code_executable: ${{ runner.temp }}/review-tools/claude
          path_to_bun_executable: ${{ runner.temp }}/review-tools/bun
          # Claude reads nothing outside the checkout. The runner's temporary files hold the identity token, the
          # exchanged Claude token and git's configuration, and /proc holds the environment: the deny rules name them
          # as well.
          settings: >-
            {"permissions": {"blockReadsOutsideWorkingDirectories": true,
            "deny": ["Read(//home/runner/work/_temp/**)", "Read(//proc/**)"]}}
          # The first two of the three steps of .github/review.md: the repository's rules, and the whole copies of the
          # two skills to write by, with their reference and example files. The third, the fresh reader, is the step
          # after the next. The prompt says whether the author has write access (the gather job's outside), and the
          # schema is the same for a writer's item and an outside one.
          prompt: >-
            Read .github/review.md: it is the rules of this review. Before you write, read the whole of the two skill
            copies that it names, with their reference and example files. These are
            .github/review/skills/asd-ste100/SKILL.md, .github/review/skills/asd-ste100/references/writing-rules.md,
            .github/review/skills/asd-ste100/examples/before-after.md, .github/review/skills/ce-noslop/SKILL.md,
            .github/review/skills/ce-noslop/references/patterns.md and
            .github/review/skills/ce-noslop/references/terminology.md. Review
            ${{ needs.gather.outputs.kind == 'pr' && 'pull request' || 'issue' }} #${{ needs.gather.outputs.number }}
            of this repository as .github/review.md says, from what .review/ holds.
            ${{ needs.gather.outputs.outside == 'false' && 'Its author has write access to this repository.'
            || 'Its author has no write access to this repository.' }} Give the comment, the verdict, will_fix and the
            list of items as the structured output (.github/review.md, "What the review gives").
          claude_args: >-
            --tools Read,Glob,Grep --permission-mode dontAsk --model claude-opus-5-5 --effort xhigh --max-turns 300
            --json-schema '{"type": "object", "additionalProperties": false,
            "required": ["comment", "verdict", "will_fix", "items"],
            "properties": {"comment": {"type": "string", "description": "The review comment, in Markdown."},
            "verdict": {"type": "string", "enum": ["pass", "blocking", "person"]},
            "will_fix": {"type": "boolean"},
            "items": {"type": "array", "items": {"type": "object", "additionalProperties": false,
            "required": ["kind", "ref", "text", "optional"],
            "properties": {"kind": {"type": "string", "enum": ["change", "question"]},
            "ref": {"type": ["string", "null"]}, "text": {"type": "string"}, "optional": {"type": "boolean"}}}}}}'

      # The answer to the comments of the author of an outside item that wait (.github/review-answer.md, "An answer"):
      # the first two of the three steps, with the rules of the answer and the whole copies of the three skills to
      # write by. The settings are the Review step's: the same tools, the same reach, the same identity. The gather job
      # lists the comments that wait in .review/answer-to.json, and the conversation holds the workflow's newest review
      # and its label comment, which give the next step.
      - name: Answer
        id: answer
        if: needs.trust.outputs.task == 'answer'
        timeout-minutes: 30
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1 (v1.0.264, sha-pinned)
        with:
          anthropic_federation_rule_id: ${{ env.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ env.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ env.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ env.ANTHROPIC_WORKSPACE_ID }}
          github_token: ${{ github.token }}
          allowed_non_write_users: ${{ needs.trust.outputs.route == 'screen' && needs.trust.outputs.outsider || '' }}
          allowed_bots: >-
            ${{ github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]'
            && format('{0},github-actions[bot]', env.APPS)
            || needs.trust.outputs.route == 'screen' && endsWith(needs.trust.outputs.outsider, '[bot]')
            && format('{0},{1}', env.APPS, needs.trust.outputs.outsider) || env.APPS }}
          path_to_claude_code_executable: ${{ runner.temp }}/review-tools/claude
          path_to_bun_executable: ${{ runner.temp }}/review-tools/bun
          settings: >-
            {"permissions": {"blockReadsOutsideWorkingDirectories": true,
            "deny": ["Read(//home/runner/work/_temp/**)", "Read(//proc/**)"]}}
          prompt: >-
            Read .github/review-answer.md: it is the rules of this answer. Read .github/review.md, which it names.
            Before you write, read the whole of the three skill copies that it names, with their reference and example
            files. These are .github/review/skills/write-to-maintainer/SKILL.md,
            .github/review/skills/write-to-maintainer/judge.md, .github/review/skills/asd-ste100/SKILL.md,
            .github/review/skills/asd-ste100/references/writing-rules.md,
            .github/review/skills/asd-ste100/examples/before-after.md, .github/review/skills/ce-noslop/SKILL.md,
            .github/review/skills/ce-noslop/references/patterns.md and
            .github/review/skills/ce-noslop/references/terminology.md. The author of
            ${{ needs.gather.outputs.kind == 'pr' && 'pull request' || 'issue' }} #${{ needs.gather.outputs.number }}
            of this repository wrote the comments in .review/answer-to.json, the newest last, and they wait for an
            answer. Answer them in one text, as .github/review-answer.md says ("An answer"), from what .review/
            holds. The conversation in .review/${{ needs.gather.outputs.kind == 'pr' && 'pr' || 'issue' }}.json
            holds the newest review of the workflow and its label comment, which give the next step. Give action,
            will_fix and the text as the structured output.
          claude_args: >-
            --tools Read,Glob,Grep --permission-mode dontAsk --model claude-opus-5-5 --effort xhigh --max-turns 200
            --json-schema '{"type": "object", "additionalProperties": false,
            "required": ["action", "will_fix", "text"],
            "properties": {"action": {"type": "string", "enum": ["answer", "fix", "none"]},
            "will_fix": {"type": "boolean"},
            "text": {"type": "string", "description": "The answer, in Markdown."}}}'

      # The draft of the reply to a new issue of an outside author (.github/review-answer.md, "An issue draft"): the
      # first two of the three steps, with the rules of the draft and the whole copies of the three skills to write
      # by. The settings are the Answer step's: the same tools, the same reach, the same identity. The draft leaves
      # this job only as its artifact (below): the action writes no report to the run's summary and no output of Claude
      # to this log (display_report and show_full_output, each set to "false" here).
      - name: Draft
        id: draft
        if: needs.trust.outputs.task == 'draft'
        timeout-minutes: 30
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1 (v1.0.264, sha-pinned)
        with:
          anthropic_federation_rule_id: ${{ env.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ env.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ env.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ env.ANTHROPIC_WORKSPACE_ID }}
          github_token: ${{ github.token }}
          allowed_non_write_users: ${{ needs.trust.outputs.route == 'screen' && needs.trust.outputs.outsider || '' }}
          allowed_bots: >-
            ${{ github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]'
            && format('{0},github-actions[bot]', env.APPS)
            || needs.trust.outputs.route == 'screen' && endsWith(needs.trust.outputs.outsider, '[bot]')
            && format('{0},{1}', env.APPS, needs.trust.outputs.outsider) || env.APPS }}
          path_to_claude_code_executable: ${{ runner.temp }}/review-tools/claude
          path_to_bun_executable: ${{ runner.temp }}/review-tools/bun
          display_report: "false"
          show_full_output: "false"
          settings: >-
            {"permissions": {"blockReadsOutsideWorkingDirectories": true,
            "deny": ["Read(//home/runner/work/_temp/**)", "Read(//proc/**)"]}}
          prompt: >-
            Read .github/review-answer.md: it is the rules of this draft. Read .github/review.md, which it names.
            Before you write, read the whole of the three skill copies that it names, with their reference and example
            files. These are .github/review/skills/write-to-maintainer/SKILL.md,
            .github/review/skills/write-to-maintainer/judge.md, .github/review/skills/asd-ste100/SKILL.md,
            .github/review/skills/asd-ste100/references/writing-rules.md,
            .github/review/skills/asd-ste100/examples/before-after.md, .github/review/skills/ce-noslop/SKILL.md,
            .github/review/skills/ce-noslop/references/patterns.md and
            .github/review/skills/ce-noslop/references/terminology.md. Write the reply to issue
            #${{ needs.gather.outputs.number }} of this repository, as .github/review-answer.md says ("An issue
            draft"), from what .review/ holds: the issue and its comments are in .review/issue.json. Give the text of
            the reply as the structured output.
          claude_args: >-
            --tools Read,Glob,Grep --permission-mode dontAsk --model claude-opus-5-5 --effort xhigh --max-turns 200
            --json-schema '{"type": "object", "additionalProperties": false, "required": ["text"],
            "properties": {"text": {"type": "string", "description": "The reply, in Markdown."}}}'

      # The fresh reader's token (.github/review/trim.py sign-in): Anthropic exchanges a new identity token of this
      # job with the Review step's federation rule, organization, service account and workspace. The token goes to a
      # file in the runner's temporary directory that only the runner's account can read, and that the step that runs
      # the reader (the comment, the answer or the draft) reads and deletes. It never goes to this log or an output.
      # Claude has finished before this step. When the exchange fails, the job fails here, at a step whose name starts
      # with "Sign in", and the hold job holds nothing for it: the schedule takes the item again.
      - name: Sign in to Anthropic for the fresh reader
        run: python3 .github/review/trim.py sign-in

      # The third of the three steps of .github/review.md, and the comment as it is posted. The model gives its
      # comment, its verdict, will_fix and its list. First comes the soundness rule of R8, whatever the model wrote
      # (.github/review/rules.py soundness): while SOUNDNESS_HOLD is true, the review of an outside pull request (the
      # gather job's outside) that adds, changes or deletes a .v file gets the verdict person, a question on soundness
      # in its list when the list has none, and the section on soundness. The section lists, as facts, the lines of
      # the changed .v files at the head that use the VM, the native compiler or a primitive array.
      # .github/review/trim.py makes the comment unable to notify anyone, to link another issue or pull request, or to
      # link or load anything outside github.com (trim.py's inert), and cuts it at 20,000 characters. Then it runs the
      # fresh reader: one request to Claude, with no tools, that holds the reader's instruction, the list and that text
      # alone, with the token of the step before. A reader that fails fails this job, so nothing posts untrimmed: a
      # screened item is held as a review that did not finish, and is tried again. A reader that refuses the review
      # (trim.py's status 3) gives the output refused=review and no comment or verdict: nothing of the review posts, no
      # fix runs, no import check run is recorded, and the comment job gives the item waits-on-theorem with Sami's next
      # step. The run's summary then gets the reader's reason alone, for Sami, and neither this log nor an output holds
      # it. The comment: the header and its markers, the trimmed text, the section on soundness, each listed item that
      # the trimmed text lacks, the footer, and the text that the reader read in a collapsed block. The model writes
      # none of the fixed parts, and the reader never sees them. The trimmed text and the added items are made inert
      # too. The header's marker <!-- review-read <time> --> gives the time when the trust job of this run decided it,
      # before the gather job read the conversation: a comment of the author made after that time is one that this
      # review did not read, and it still waits for its answer (the trust job's waiting). The run's summary gets the
      # text that the reader read, the list, and the section on soundness with every line.
      - name: The comment, as it is posted
        id: result
        if: needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen'
        env:
          RESULT: ${{ steps.review.outputs.execution_file }}
          RULES: ${{ github.server_url }}/${{ github.repository }}/blob/main/.github/review.md
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTSIDE: ${{ needs.gather.outputs.outside }}
          STARTED: ${{ needs.trust.outputs.started }}
        run: |
          set -euo pipefail
          # trim.py deletes the token's file as it reads it. This deletes it too when trim.py does not run.
          trap 'rm -f -- "$RUNNER_TEMP/reader-token"' EXIT
          [[ $STARTED =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
            || { echo "::error::no start time of this run. Nothing posts."; exit 1; }
          work=$RUNNER_TEMP/comment
          mkdir -p "$work"
          jq -e 'map(select(.type == "result")) | last | .structured_output
            | select(type == "object" and (.comment | type) == "string" and (.verdict | IN("pass", "blocking", "person"))
                     and (.will_fix | type) == "boolean" and (.items | type) == "array")' "$RESULT" > "$work/output.json" \
            || { echo "::error::The review gave no comment, verdict, will_fix and list. Nothing posts."; exit 1; }
          python3 .github/review/rules.py soundness .review "$work/output.json" "${SOUNDNESS_HOLD:-}" "$OUTSIDE" \
            "$work/section.md" "$work/section-all.md"
          jq -j .comment "$work/output.json" > "$work/review.md"
          jq .items "$work/output.json" > "$work/items.json"
          verdict=$(jq -r .verdict "$work/output.json")
          will_fix=$(jq -r .will_fix "$work/output.json")
          what="this issue" markers=""
          if [ -f .review/commits.txt ]; then
            head=$(sed -n 's/^head //p' .review/commits.txt)
            [[ $head =~ ^[0-9a-f]{40}$ ]] || { echo "::error::.review/commits.txt names no head commit."; exit 1; }
            what="commit ${head:0:12}"
            fix=""
            [ "$will_fix" = false ] || fix=" will-fix"
            markers=$'\n'"<!-- review-head $head -->"$'\n'"<!-- review-verdict $head $verdict$fix -->"
            echo "head=$head" >> "$GITHUB_OUTPUT"
          fi
          markers+=$'\n'"<!-- review-read $STARTED -->"
          printf '%s%s\n%s\n' '<!-- review -->' "$markers" "**Automated review** of $what" > "$work/head.md"
          foot="Claude wrote this review with [these rules]($RULES), in [this workflow run]($RUN)."
          foot+=" A second Claude session shortened the review."
          printf '%s\n' "$foot" > "$work/foot.md"
          rc=0
          python3 .github/review/trim.py review --review "$work/review.md" --items "$work/items.json" \
            --head "$work/head.md" --section "$work/section.md" --foot "$work/foot.md" \
            --summary "$GITHUB_STEP_SUMMARY" --summary-extra "$work/section-all.md" > "$work/body.md" || rc=$?
          if (( rc == 3 )); then
            echo "refused=review" >> "$GITHUB_OUTPUT"
            echo "The fresh reader refused the review. Nothing of it posts: Sami writes the review by hand."
            exit 0
          fi
          (( rc == 0 )) || { echo "::error::The fresh reader gave no trimmed text. Nothing posts."; exit 1; }
          { echo "verdict=$verdict"; echo "will_fix=$will_fix"; } >> "$GITHUB_OUTPUT"
          delimiter="body_$(openssl rand -hex 16)"
          { echo "body<<$delimiter"; cat "$work/body.md"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

      # The third of the three steps for an answer, and the answer as it is posted: one request to the fresh reader
      # (trim.py answer), with the token of the sign-in step. A reader that fails fails this job, so nothing posts
      # untrimmed. A reader that refuses the answer (trim.py's status 3) gives the output refused=answer, and no answer,
      # action or will_fix: nothing of the answer posts, no fix runs, and the comment job gives the item
      # waits-on-theorem with Sami's next step. The run's summary gets the reader's reason alone, for Sami, and neither
      # this log nor an output holds it. The answer: its marker, which names the newest comment that it answers (and,
      # when the author said they will make the change, will-fix and the head), a fixed line, the trimmed text made
      # inert, and the footer. An action of none posts nothing.
      - name: The answer, as it is posted
        id: answered
        if: needs.trust.outputs.task == 'answer'
        env:
          RESULT: ${{ steps.answer.outputs.execution_file }}
          RULES: ${{ github.server_url }}/${{ github.repository }}/blob/main/.github/review-answer.md
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # trim.py deletes the token's file as it reads it. This deletes it too when trim.py does not run.
          trap 'rm -f -- "$RUNNER_TEMP/reader-token"' EXIT
          work=$RUNNER_TEMP/answer
          mkdir -p "$work"
          jq -e 'map(select(.type == "result")) | last | .structured_output
            | select(type == "object" and (.action | IN("answer", "fix", "none")) and (.will_fix | type) == "boolean"
                     and (.text | type) == "string")' "$RESULT" > "$work/output.json" \
            || { echo "::error::The answer gave no action, will_fix and text. Nothing posts."; exit 1; }
          action=$(jq -r .action "$work/output.json")
          will_fix=$(jq -r .will_fix "$work/output.json")
          head=""
          if [ -f .review/commits.txt ]; then
            head=$(sed -n 's/^head //p' .review/commits.txt)
            [[ $head =~ ^[0-9a-f]{40}$ ]] || { echo "::error::.review/commits.txt names no head commit."; exit 1; }
            echo "head=$head" >> "$GITHUB_OUTPUT"
          fi
          newest=$(jq -r 'last | .id // empty' .review/answer-to.json)
          [[ $newest =~ ^[1-9][0-9]*$ ]] \
            || { echo "::error::.review/answer-to.json names no comment that waits for an answer. Nothing posts."; exit 1; }
          if [ "$action" = none ]; then
            { echo "action=$action"; echo "will_fix=$will_fix"; } >> "$GITHUB_OUTPUT"
            echo "The comments up to $newest ask nothing and change no next step: no answer posts."
            exit 0
          fi
          jq -j .text "$work/output.json" > "$work/answer.md"
          said=""
          if [ "$will_fix" = true ] && [ -n "$head" ]; then said=" will-fix $head"; fi
          printf '%s\n%s\n' "<!-- review-answer $newest$said -->" "**Automated answer**" > "$work/head.md"
          printf '%s\n' "Claude wrote this answer with [these rules]($RULES), in [this workflow run]($RUN)." \
            > "$work/foot.md"
          rc=0
          python3 .github/review/trim.py answer --text "$work/answer.md" --head "$work/head.md" --foot "$work/foot.md" \
            --summary "$GITHUB_STEP_SUMMARY" > "$work/body.md" || rc=$?
          if (( rc == 3 )); then
            echo "refused=answer" >> "$GITHUB_OUTPUT"
            echo "The fresh reader refused the answer. Nothing of it posts, and no fix runs: Sami answers the comment by hand."
            exit 0
          fi
          (( rc == 0 )) || { echo "::error::The fresh reader gave no trimmed text. Nothing posts."; exit 1; }
          { echo "action=$action"; echo "will_fix=$will_fix"; } >> "$GITHUB_OUTPUT"
          delimiter="body_$(openssl rand -hex 16)"
          { echo "body<<$delimiter"; cat "$work/body.md"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

      # The third of the three steps for the draft: one request to the fresh reader (trim.py draft), with the token of
      # the sign-in step, that holds the rules of the draft (.github/review-answer.md and the write-to-maintainer copy)
      # beside the draft. The reader trims the draft, or refuses it and gives its reason. Then the file that the next
      # step uploads as the artifact of this run: a header, the reason of a refused draft on one line, a line ---, and
      # the draft as the reader trimmed it (draft.txt), or a refused draft as the model wrote it (refused-draft.txt).
      # Sami reads it in a terminal, and the author of an issue can steer the model's text, so every control character
      # but tab and newline, and every bidirectional-text control, is taken out of the file. No output, summary or log
      # line of this job holds the draft, the refused draft or the reason: the summary names the artifact alone. A
      # reader that fails fails this job, so nothing is uploaded: a screened issue is held as a review that did not
      # finish, and tried again. The output draft, <run>-<attempt>, names the run of the artifact for the label comment.
      - name: The draft, as the fresh reader leaves it
        id: drafted
        if: needs.trust.outputs.task == 'draft'
        env:
          RESULT: ${{ steps.draft.outputs.execution_file }}
          NUMBER: ${{ needs.trust.outputs.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # trim.py deletes the token's file as it reads it. This deletes it too when trim.py does not run.
          trap 'rm -f -- "$RUNNER_TEMP/reader-token"' EXIT
          [[ $NUMBER =~ ^[1-9][0-9]*$ && $RUN_ID =~ ^[1-9][0-9]*$ && $RUN_ATTEMPT =~ ^[1-9][0-9]*$ ]] \
            || { echo "::error::no issue number, run id or attempt. Nothing is uploaded."; exit 1; }
          work=$RUNNER_TEMP/draft kept=$RUNNER_TEMP/issue-draft
          mkdir -p "$work" "$kept"
          jq -j -e 'map(select(.type == "result")) | last | .structured_output
            | select(type == "object" and (.text | type) == "string") | .text' "$RESULT" > "$work/draft.md" \
            || { echo "::error::The draft gave no text. Nothing is uploaded."; exit 1; }
          grep -q '[^[:space:]]' "$work/draft.md" || { echo "::error::The draft has no word in it. Nothing is uploaded."; exit 1; }
          python3 .github/review/trim.py draft --text "$work/draft.md" --rules .github/review-answer.md \
            --rules .github/review/skills/write-to-maintainer/SKILL.md > "$work/read.json" \
            || { echo "::error::The fresh reader gave no answer for the draft. Nothing is uploaded."; exit 1; }
          refused=$(jq -r .refused "$work/read.json")
          if [ "$refused" = true ]; then
            name=refused-draft.txt kind="refused issue draft"
            cp "$work/draft.md" "$work/text"
            told="The fresh reader refused the draft of the reply to issue #$NUMBER. The artifact issue-draft-$NUMBER of this run holds the draft and the reason of the reader. No job posts them."
          else
            name=draft.txt kind="issue draft"
            jq -j .text "$work/read.json" > "$work/text"
            told="The artifact issue-draft-$NUMBER of this run holds the draft of the reply to issue #$NUMBER. No job posts it: Sami approves the text of a reply first."
          fi
          # Taken out of the file: the C0 controls but tab and newline, DEL, the C1 controls, and the bidirectional-text
          # controls U+061C, U+200E, U+200F, U+202A to U+202E and U+2066 to U+2069.
          { printf 'rocq-linux-process-semantics %s v1\nissue: %s\nrun: %s\n' "$kind" "$NUMBER" "$RUN"
            if [ "$refused" = true ]; then jq -j '"reason: \(.reason | gsub("\\s+"; " "))\n"' "$work/read.json"; fi
            printf -- '---\n'
            cat "$work/text"; } \
            | python3 -c 'import re, sys; sys.stdout.buffer.write(re.sub("[\x00-\x08\x0b-\x1f\x7f-\x9f\u061c\u200e\u200f\u202a-\u202e\u2066-\u2069]", "", sys.stdin.buffer.read().decode()).encode())' \
            > "$kept/$name"
          echo "The fresh reader read the draft. The next step uploads it as the artifact issue-draft-$NUMBER."
          printf '%s\n' "$told" >> "$GITHUB_STEP_SUMMARY"
          echo "draft=$RUN_ID-$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      # The draft's file, as the artifact issue-draft-<issue> of this run. The OSSV controller lists the artifacts of
      # that name with its own read-only token and copies the newest into its ask to Sami: Sami chose an artifact over
      # a private store (dispatch://INFRA-3395/ask/5d55f3cb-5359-4b52-af6e-85231a37ccf7). Anyone who can read this
      # repository can read the artifact: the draft is made only from the public issue and the public rules files, and
      # it posts only after Sami approves its text. GitHub keeps it 90 days, the longest it keeps an artifact of a public
      # repository (or less, when the repository's setting is shorter), as a draft can wait weeks for Sami. A new
      # attempt of the run replaces the artifact of the attempt before it (overwrite).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (sha-pinned)
        if: needs.trust.outputs.task == 'draft'
        with: {name: "issue-draft-${{ needs.trust.outputs.number }}", path: "${{ runner.temp }}/issue-draft", if-no-files-found: error, retention-days: 90, overwrite: true}

      # Whether the fix runs (.github/review-answer.md, "The fix"): for a blocking finding of the review, after the
      # soundness rule, or for an answer whose action is fix, of an outside pull request. The two stops: no fix runs
      # when the author said they will make the change (the will_fix of the review or of the answer, or for a review
      # an earlier answer at this head whose marker says will-fix), nor when 2 fix reviews since the author's last own
      # push did not make the review pass (rules.py fixes, from the head's history and the pull request's reviews, as
      # the API gives them). The outputs will_fix and fix_stop give the comment job the facts of the state label. When
      # the fix runs, this step writes what it is for into .review/fix.json, which the Fix step reads: the review's
      # output, or the comments of the author and the answer. A draft has no fix, and neither has a review or an
      # answer that the fresh reader refused: it gives no verdict and no action.
      - name: Whether a fix runs
        id: fixable
        if: needs.trust.outputs.task != 'draft'
        env:
          TASK: ${{ needs.trust.outputs.task }}
          OUTSIDE: ${{ needs.gather.outputs.outside }}
          KIND: ${{ needs.gather.outputs.kind }}
          NUMBER: ${{ needs.gather.outputs.number }}
          VERDICT: ${{ steps.result.outputs.verdict }}
          REVIEW_WILL_FIX: ${{ steps.result.outputs.will_fix }}
          ACTION: ${{ steps.answered.outputs.action }}
          ANSWER_WILL_FIX: ${{ steps.answered.outputs.will_fix }}
        run: |
          set -euo pipefail
          will_fix=false asked=false
          if [ "$TASK" = answer ]; then
            # The author of an issue makes no change that a review asks for.
            [ "$ANSWER_WILL_FIX" != true ] || [ "$KIND" != pr ] || will_fix=true
            [ "$ACTION" != fix ] || asked=true
          else
            [ "$REVIEW_WILL_FIX" != true ] || will_fix=true
            [ "$VERDICT" != blocking ] || asked=true
          fi
          # outcome <fix_stop> <fix>: the outputs, and the end of this step.
          outcome() {
            { echo "will_fix=$will_fix"; echo "fix_stop=$1"; echo "fix=$2"; } >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$asked" = false ]; then
            echo "No fix: the review gives no blocking finding, or the answer asks for no fix."
            outcome false false
          fi
          if [ "$KIND" != pr ] || [ "$OUTSIDE" != true ]; then
            echo "No fix: only an outside pull request gets one."
            outcome false false
          fi
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          head=$(sed -n 's/^head //p' .review/commits.txt)
          [[ $head =~ ^[0-9a-f]{40}$ ]] || { echo "::error::.review/commits.txt names no head commit."; exit 1; }
          if [ "$TASK" != answer ] && [ "$will_fix" = false ]; then
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            said=$(HEAD=$head gh api --paginate "repos/$REPO/issues/$NUMBER/comments" --jq '[.[]
              | select(.user.login == "github-actions[bot]"
                       and ((.body // "") | test("^<!-- review-answer [0-9]+ will-fix " + $ENV.HEAD + " -->(\n|$)")))]
              | length' | awk '{ n += $1 } END { print n + 0 }') \
              || { echo "::error::the comments of #$NUMBER could not be read."; exit 1; }
            (( said == 0 )) || will_fix=true
          fi
          if [ "$will_fix" = true ]; then
            echo "No fix: the author wrote that they will make the change."
            outcome false false
          fi
          work=$RUNNER_TEMP/fixable
          mkdir -p "$work"
          gh api "repos/$REPO/commits?sha=$head&per_page=100" --jq '.[] | @json' > "$work/commits.jsonl" \
            || { echo "::error::the commits of $head could not be read."; exit 1; }
          gh api --paginate "repos/$REPO/pulls/$NUMBER/reviews" --jq '.[] | @json' > "$work/reviews.jsonl" \
            || { echo "::error::the reviews of #$NUMBER could not be read."; exit 1; }
          count=$(python3 .github/review/rules.py fixes "$work/commits.jsonl" "$work/reviews.jsonl" "$head") \
            || { echo "::error::the fix reviews since the author's last own push could not be counted."; exit 1; }
          if (( count >= 2 )); then
            echo "No fix: $count fix reviews since the author's last own push, and the review still gives a blocking finding."
            outcome true false
          fi
          if [ "$TASK" = answer ]; then
            jq --slurpfile comments .review/answer-to.json '{for: "answer", comments: $comments[0], answer: .text}' \
              "$RUNNER_TEMP/answer/output.json" > .review/fix.json
          else
            jq '{for: "review", review: .}' "$RUNNER_TEMP/comment/output.json" > .review/fix.json
          fi
          echo "A fix runs: $count fix reviews since the author's last own push."
          outcome false true

      # The fix, as suggested changes (.github/review-answer.md, "The fix"): the first two of the three steps, with the
      # settings of the Review step and the whole copies of the three skills to write by. Claude writes no file and
      # runs nothing: it gives the summary and the suggestions, and the next steps post them as a review.
      - name: Fix
        id: fix
        if: steps.fixable.outputs.fix == 'true'
        timeout-minutes: 30
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1 (v1.0.264, sha-pinned)
        with:
          anthropic_federation_rule_id: ${{ env.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ env.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ env.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ env.ANTHROPIC_WORKSPACE_ID }}
          github_token: ${{ github.token }}
          allowed_non_write_users: ${{ needs.trust.outputs.route == 'screen' && needs.trust.outputs.outsider || '' }}
          allowed_bots: >-
            ${{ github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]'
            && format('{0},github-actions[bot]', env.APPS)
            || needs.trust.outputs.route == 'screen' && endsWith(needs.trust.outputs.outsider, '[bot]')
            && format('{0},{1}', env.APPS, needs.trust.outputs.outsider) || env.APPS }}
          path_to_claude_code_executable: ${{ runner.temp }}/review-tools/claude
          path_to_bun_executable: ${{ runner.temp }}/review-tools/bun
          settings: >-
            {"permissions": {"blockReadsOutsideWorkingDirectories": true,
            "deny": ["Read(//home/runner/work/_temp/**)", "Read(//proc/**)"]}}
          prompt: >-
            Read .github/review-answer.md: it is the rules of this fix. Read .github/review.md, which it names. Before
            you write, read the whole of the three skill copies that it names, with their reference and example files.
            These are .github/review/skills/write-to-maintainer/SKILL.md,
            .github/review/skills/write-to-maintainer/judge.md, .github/review/skills/asd-ste100/SKILL.md,
            .github/review/skills/asd-ste100/references/writing-rules.md,
            .github/review/skills/asd-ste100/examples/before-after.md, .github/review/skills/ce-noslop/SKILL.md,
            .github/review/skills/ce-noslop/references/patterns.md and
            .github/review/skills/ce-noslop/references/terminology.md. Write the fix of pull request
            #${{ needs.gather.outputs.number }} of this repository that .review/fix.json asks for, as
            .github/review-answer.md says ("The fix"), from what .review/ holds: suggested changes on the right-side
            lines of .review/pr.diff, numbered as in the files under .review/head/. Give the summary and the
            suggestions as the structured output.
          claude_args: >-
            --tools Read,Glob,Grep --permission-mode dontAsk --model claude-opus-5-5 --effort xhigh --max-turns 200
            --json-schema '{"type": "object", "additionalProperties": false,
            "required": ["summary", "suggestions"],
            "properties": {"summary": {"type": "string"},
            "suggestions": {"type": "array", "items": {"type": "object", "additionalProperties": false,
            "required": ["path", "start_line", "line", "replacement", "why"],
            "properties": {"path": {"type": "string"}, "start_line": {"type": "integer"}, "line": {"type": "integer"},
            "replacement": {"type": "string"}, "why": {"type": "string"}}}}}}'

      # A new token for the fresh reader of the fix, as "Sign in to Anthropic for the fresh reader" gets one: the step
      # that made the comment or the answer took that token and deleted its file. When this exchange fails, the job
      # fails here, at a step whose name starts with "Sign in", and the hold job holds nothing for it.
      - name: Sign in to Anthropic for the fresh reader of the fix
        if: steps.fixable.outputs.fix == 'true'
        run: python3 .github/review/trim.py sign-in

      # The fix as it is posted: code keeps only the suggestions whose lines are right-side lines of one hunk of
      # .review/pr.diff, and makes each other one a sentence of the summary that names its file and lines (rules.py
      # suggestions). The fresh reader trims the summary and each why, one request each, and never reads a suggestion
      # block, which holds the lines of the fix byte for byte (trim.py fix). The review: its marker (the head), its
      # marker <!-- review-read <time> --> (when the trust job of this run decided it, before the gather job read the
      # conversation, as in the review comment), a fixed line, the trimmed summary and the footer, and one comment for
      # each suggestion, on the right side of the diff. With no suggestion on the diff, no fix posts. A reader that
      # fails fails this job, so nothing posts untrimmed. A reader that refuses the summary or a why (trim.py's status
      # 3) gives the output refused=fix and no review: nothing of the fix posts, and the comment job gives the item
      # waits-on-theorem with Sami's next step. The run's summary gets the reader's reason alone, for Sami, and neither
      # this log nor an output holds it.
      - name: The fix, as it is posted
        id: fixed
        if: steps.fixable.outputs.fix == 'true'
        env:
          RESULT: ${{ steps.fix.outputs.execution_file }}
          RULES: ${{ github.server_url }}/${{ github.repository }}/blob/main/.github/review-answer.md
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STARTED: ${{ needs.trust.outputs.started }}
        run: |
          set -euo pipefail
          # trim.py deletes the token's file as it reads it. This deletes it too when trim.py does not run.
          trap 'rm -f -- "$RUNNER_TEMP/reader-token"' EXIT
          [[ $STARTED =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
            || { echo "::error::no start time of this run. Nothing posts."; exit 1; }
          work=$RUNNER_TEMP/fix
          mkdir -p "$work"
          jq -e 'map(select(.type == "result")) | last | .structured_output
            | select(type == "object" and (.summary | type) == "string" and (.suggestions | type) == "array")' \
            "$RESULT" > "$work/output.json" || { echo "::error::The fix gave no summary and suggestions. Nothing posts."; exit 1; }
          python3 .github/review/rules.py suggestions "$work/output.json" .review/pr.diff > "$work/kept.json" \
            || { echo "::error::The suggestions of the fix are not as .github/review-answer.md gives them. Nothing posts."; exit 1; }
          kept=$(jq '.suggestions | length' "$work/kept.json")
          if (( kept == 0 )); then
            echo "No suggestion of the fix is on the lines of the diff: no fix posts."
            exit 0
          fi
          head=$(sed -n 's/^head //p' .review/commits.txt)
          [[ $head =~ ^[0-9a-f]{40}$ ]] || { echo "::error::.review/commits.txt names no head commit."; exit 1; }
          printf '%s\n%s\n%s\n' "<!-- review-fix $head -->" "<!-- review-read $STARTED -->" \
            "**Automated fix** of commit ${head:0:12}, as suggested changes" > "$work/head.md"
          printf '%s\n' "Claude wrote this fix with [these rules]($RULES), in [this workflow run]($RUN). A second Claude session shortened the words of this fix. It did not change the lines of any suggested change. A suggested change changes nothing until you apply it." \
            > "$work/foot.md"
          rc=0
          python3 .github/review/trim.py fix --fix "$work/kept.json" --commit "$head" --head "$work/head.md" \
            --foot "$work/foot.md" --summary "$GITHUB_STEP_SUMMARY" > "$work/review.json" || rc=$?
          if (( rc == 3 )); then
            echo "refused=fix" >> "$GITHUB_OUTPUT"
            echo "The fresh reader refused the fix. Nothing of it posts: Sami writes the fix by hand."
            exit 0
          fi
          (( rc == 0 )) || { echo "::error::The fresh reader gave no trimmed text. Nothing posts."; exit 1; }
          echo "$kept suggested changes post."
          delimiter="review_$(openssl rand -hex 16)"
          { echo "review<<$delimiter"; cat "$work/review.json"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

  # The OSS Verify App's writes, and nothing else: no comment and no label. In the environment post, which only main's
  # runs reach and which holds the App's key (OSS_VERIFY_APP_PRIVATE_KEY). Each write comes after a step of its own
  # that mints a token for this repository alone: token A, with checks: write and pull-requests: write, for the import
  # check run of a review or a relabel and for the close and reopen of a catch-up; token B, with actions: write alone,
  # for the approval of a head's held runs, minted only for the task approve when the screen passed and GitHub holds
  # runs of the head that the screen read. A missing key fails these steps alone. Its own token can only read
  # (actions: read lists a head's held runs). It holds no identity token and no model. For the review of an outside
  # pull request and for a relabel, it decides the import check run of R12 on the head (.github/review/rules.py
  # import-check) and records repo-pairs/import-approved, with conclusion success, when the rule holds. It checks out
  # main's .github/ for that, and runs nothing else from it. Its outputs: recorded, true when it recorded that check run
  # at the head, and decision, what it decided for that check run: record, or the first rule of R12 that does not hold.
  post:
    needs: [trust, gather, screen, review]
    # The review or the rescreen of an outside pull request whose screen passed and whose review succeeded, a relabel, a
    # catch-up, and an approval whose screen passed. GitHub's implicit success() would skip it when a job it needs was
    # skipped: the gather, screen and review jobs of a relabel or a catch-up, and the review job of an approval.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main'
          && (((needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen')
               && needs.trust.outputs.route == 'screen' && needs.gather.outputs.kind == 'pr'
               && needs.review.result == 'success')
              || ((needs.trust.outputs.task == 'relabel' || needs.trust.outputs.task == 'catchup')
                  && needs.trust.result == 'success')
              || (needs.trust.outputs.task == 'approve' && needs.screen.result == 'success'
                  && needs.screen.outputs.verdict == 'clean')) }}
    environment: {name: post, deployment: false}
    # One at a time for each item, and none cancelled: GitHub keeps every pending one (queue: max).
    concurrency:
      group: post-${{ needs.trust.outputs.number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {contents: read, pull-requests: read, actions: read}
    outputs:
      recorded: ${{ steps.record.outputs.recorded == 'true' && 'true' || 'false' }}
      decision: ${{ steps.decide.outputs.decision }}
    steps:
      # main's .github/, for .github/review/rules.py; never the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        if: >-
          needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen'
          || needs.trust.outputs.task == 'relabel'
        with: {ref: main, persist-credentials: false, sparse-checkout: .github, sparse-checkout-cone-mode: false}
      # The decision of R12 on the import check run at the head, with this job's own token, only on a run of
      # workflow_run or workflow_dispatch: for the review of a head whose screen passed, with the review's verdict after
      # the soundness rule, and for a relabel, which runs no model. It is for an outside pull request alone: a run whose
      # trust job gave no outsider (a writer's pull request, also one that a run by hand screened) gets no check run. A
      # relabel takes the verdict from the marker of the review comment that names the head, and the screen passed that
      # head when such a review is there: the review of an outside pull request posts only after its screen passed.
      # When the head is no longer the pull request's, the decision is moved, and the new head waits for a pass of its
      # own. The changed paths come from every page of the files of the pull request at the head, each file's path and
      # the path that it had before a rename, read after the check of the head and before a second check of it. The
      # list stops at 3,000 files: when it does not hold each changed file, no check run is recorded.
      - name: Decide the import check of the head
        id: decide
        if: >-
          (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
          && (((needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen')
               && needs.screen.outputs.verdict == 'clean')
              || needs.trust.outputs.task == 'relabel')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TASK: ${{ needs.trust.outputs.task }}
          NUMBER: ${{ needs.trust.outputs.number }}
          OUTSIDER: ${{ needs.trust.outputs.outsider }}
          # The head that the review read, or the head of a relabel, which the trust job read.
          HEAD: ${{ needs.trust.outputs.task == 'relabel' && needs.trust.outputs.head || needs.review.outputs.head }}
          VERDICT: ${{ needs.review.outputs.verdict }}
          # The import's paths, one glob on each line, while the import is live (R12). An empty value is no variable:
          # GitHub gives an empty value for a variable that is not set.
          IMPORT_PATHS: ${{ vars.REPO_PAIRS_IMPORT_PATHS }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          [[ $HEAD =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no head commit to decide on: $HEAD"; exit 1; }
          # decided <decision> <what>: the output decision, and the end of this step.
          decided() {
            echo "#$NUMBER at $HEAD: the decision on the import check is $1 ($2)."
            echo "decision=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }
          pr=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '"\(.head.sha) \(.changed_files)"') \
            || { echo "::error::pull request #$NUMBER could not be read."; exit 1; }
          read -r sha count <<< "$pr"
          [ "$sha" = "$HEAD" ] || decided moved "the pull request moved on to $sha"
          [[ $count =~ ^[0-9]+$ ]] || { echo "::error::#$NUMBER gives no count of changed files."; exit 1; }
          gh api --paginate "repos/$REPO/pulls/$NUMBER/files?per_page=100" \
            --jq '.[] | {filename, previous_filename} | @json' > "$RUNNER_TEMP/files.jsonl" \
            || { echo "::error::the files of #$NUMBER could not be read."; exit 1; }
          sha=$(gh api "repos/$REPO/pulls/$NUMBER" --jq .head.sha) \
            || { echo "::error::pull request #$NUMBER could not be read."; exit 1; }
          [ "$sha" = "$HEAD" ] || decided moved "the pull request moved on to $sha while its files were read"
          screen=true verdict=$VERDICT
          if [ "$TASK" = relabel ]; then
            reviewed=$(python3 .github/review/rules.py verdict "$NUMBER" "$HEAD") \
              || { echo "::error::the comments of #$NUMBER could not be read."; exit 1; }
            verdict=$reviewed
            [ -n "$verdict" ] || screen=false
          fi
          # The import check run is for an outside pull request alone, which the screen passed before its review.
          [ -n "$OUTSIDER" ] || screen=false
          # The variable's text, given only when it is set: an empty value is no variable.
          imports=()
          [ -z "$IMPORT_PATHS" ] || imports=("$IMPORT_PATHS")
          decision=$(python3 .github/review/rules.py import-check "$RUNNER_TEMP/files.jsonl" "$count" "$HEAD" \
            "$screen" "$verdict" "${SOUNDNESS_HOLD:-}" "$RUNNER_TEMP/import-check.json" "${imports[@]}") \
            || { echo "::error::the import check of $HEAD could not be decided."; exit 1; }
          decided "$decision" "$(grep -c . "$RUNNER_TEMP/files.jsonl" || true) of $count changed files read"
      # Token A: for the import check run when the step before decided to record it, and for the close and reopen of a
      # catch-up.
      - name: Sign in as the OSS Verify App
        id: app
        if: needs.trust.outputs.task == 'catchup' || steps.decide.outputs.decision == 'record'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0 (sha-pinned)
        with:
          app-id: 5447700
          private-key: ${{ secrets.OSS_VERIFY_APP_PRIVATE_KEY }}
          owner: theorem-labs
          repositories: rocq-linux-process-semantics
          permission-checks: write
          permission-pull-requests: write
      # The import check run repo-pairs/import-approved, with conclusion success, on the head that the decision judged,
      # recorded with token A. Its output text holds the marker line of the value of REPO_PAIRS_IMPORT_PATHS that the
      # decision read. A call that fails fails the job: recorded stays false, and the schedule takes the head again. A
      # token A that could not be minted skips this step for the same end.
      - name: Record the import check of the head
        id: record
        if: steps.decide.outputs.decision == 'record'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          request=$RUNNER_TEMP/import-check.json
          head=$(jq -r 'select(.name == "repo-pairs/import-approved" and .conclusion == "success") | .head_sha' \
            "$request" 2> /dev/null || true)
          [[ $head =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the decision wrote no import check to record."; exit 1; }
          id=$(gh api --method POST "repos/$REPO/check-runs" --input "$request" --jq .id) \
            || { echo "::error::the import check of $head could not be recorded."; exit 1; }
          echo "Recorded the check run $id, repo-pairs/import-approved, on $head."
          echo "recorded=true" >> "$GITHUB_OUTPUT"
      # The catch-up, with token A: a pull request that is closed and reopened gets a new CI run of its head (the event
      # pull_request), and the review of that CI run follows. An open pull request is closed, then reopened; one that a
      # catch-up run closed and could not reopen (the trust job took it as such) is only reopened. The pull request's
      # state now tells which. An open one whose head moved since the trust job read it, or whose head repository is
      # gone (GitHub cannot reopen such a pull request), is not closed. A closed one is reopened only while its newest
      # close is the App's own, so that a pull request that someone closed in between stays closed. The reopen is tried
      # 3 times, 10 seconds apart; then the step fails, and the schedule tries the reopen again an hour later.
      - name: Close and reopen the pull request
        if: needs.trust.outputs.task == 'catchup'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.trust.outputs.number }}
          HEAD: ${{ needs.trust.outputs.head }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          [[ $HEAD =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the trust job gave no head commit: $HEAD"; exit 1; }
          pr=$(gh api "repos/$REPO/pulls/$NUMBER" \
            --jq '"\(.state) \((.merged // false) | tostring) \(.head.sha) \(.head.repo.id // 0)"') \
            || { echo "::error::pull request #$NUMBER could not be read."; exit 1; }
          read -r state merged sha repository <<< "$pr"
          if [ "$state" = open ]; then
            if [ "$sha" != "$HEAD" ]; then
              echo "::notice::#$NUMBER moved from $HEAD to $sha after the trust job read it. It is not closed."
              exit 0
            fi
            if ! [[ $repository =~ ^[1-9][0-9]*$ ]]; then
              echo "::notice::the head repository of #$NUMBER is gone, so GitHub could not reopen it. It is not closed."
              exit 0
            fi
            gh api --method PATCH "repos/$REPO/pulls/$NUMBER" -f state=closed --jq .state > /dev/null \
              || { echo "::error::#$NUMBER could not be closed."; exit 1; }
            echo "Closed #$NUMBER."
          else
            if [ "$merged" != false ]; then
              echo "::notice::#$NUMBER is merged. It is not reopened."
              exit 0
            fi
            closed=$(gh api --paginate "repos/$REPO/issues/$NUMBER/events" --jq '.[] | select(.event == "closed")
              | "\(.created_at) \(.actor.login // "-")"' | sort | tail -n 1) \
              || { echo "::error::the events of #$NUMBER could not be read."; exit 1; }
            if [ "${closed##* }" != 'oss-verify[bot]' ]; then
              echo "::notice::#$NUMBER was closed last by ${closed##* }, not by the catch-up. It is not reopened."
              exit 0
            fi
          fi
          for try in 1 2 3; do
            if gh api --method PATCH "repos/$REPO/pulls/$NUMBER" -f state=open --jq .state > /dev/null; then
              echo "Reopened #$NUMBER: GitHub starts a CI run of $sha."
              exit 0
            fi
            echo "::warning::try $try of 3 to reopen #$NUMBER failed."
            if (( try < 3 )); then sleep 10; fi
          done
          echo "::error::#$NUMBER is closed, and 3 tries to reopen it failed. The schedule tries again in an hour."
          exit 1

      # An approval whose screen passed. With this job's own token: the pull request now, and the runs that GitHub
      # holds of the head that the screen read (status action_required). When the head moved since the trust job read
      # it, the screen did not read the new head: nothing is approved, and the new head's held runs wait for a run of
      # their own. Only a run of the event pull_request at that head, from the pull request's head repository and head
      # branch, is approved, and no other run of the same commit (OSSV-679's decision 7).
      - name: The held runs of the screened head
        id: held
        if: needs.trust.outputs.task == 'approve' && needs.screen.outputs.verdict == 'clean'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.trust.outputs.number }}
          HEAD: ${{ needs.trust.outputs.head }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          [[ $HEAD =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the trust job gave no head commit: $HEAD"; exit 1; }
          pr=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '"\(.head.sha) \(.head.repo.id // 0) \(.head.ref)"') \
            || { echo "::error::pull request #$NUMBER could not be read."; exit 1; }
          read -r sha repository branch <<< "$pr"
          if [ "$sha" != "$HEAD" ]; then
            echo "::notice::#$NUMBER moved from $HEAD to $sha after the screen. No run is approved."
            exit 0
          fi
          if ! [[ $repository =~ ^[1-9][0-9]*$ ]]; then
            echo "::notice::#$NUMBER has no head repository. No run is approved."
            exit 0
          fi
          # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
          runs=$(SHA=$HEAD REPOSITORY=$repository BRANCH=$branch gh api --method GET --paginate "repos/$REPO/actions/runs" \
            -f head_sha="$HEAD" -f status=action_required -F per_page=100 --jq '.workflow_runs[]
              | select(.status == "action_required" and .event == "pull_request" and .head_sha == $ENV.SHA
                       and ((.head_repository.id // 0) | tostring) == $ENV.REPOSITORY
                       and .head_branch == $ENV.BRANCH)
              | .id') \
            || { echo "::error::the runs of $HEAD could not be read."; exit 1; }
          ids=""
          while read -r id; do
            [ -n "$id" ] || continue
            [[ $id =~ ^[1-9][0-9]*$ ]] || { echo "::error::a run id is not a number: $id"; exit 1; }
            ids="$ids${ids:+ }$id"
          done <<< "$runs"
          if [ -z "$ids" ]; then
            echo "#$NUMBER: GitHub holds no run of $HEAD from its head repository and branch. No run is approved."
            exit 0
          fi
          echo "#$NUMBER: GitHub holds the runs $ids of $HEAD."
          echo "runs=$ids" >> "$GITHUB_OUTPUT"
      # Token B: for the approval of the runs that the step before found, only when the screen passed.
      - name: Sign in as the OSS Verify App to approve
        id: approver
        if: >-
          needs.trust.outputs.task == 'approve' && needs.screen.outputs.verdict == 'clean'
          && steps.held.outputs.runs != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0 (sha-pinned)
        with:
          app-id: 5447700
          private-key: ${{ secrets.OSS_VERIFY_APP_PRIVATE_KEY }}
          owner: theorem-labs
          repositories: rocq-linux-process-semantics
          permission-actions: write
      # Each of those runs, approved with token B: GitHub then starts it. Every run is tried, and a call that fails
      # fails this step and the job: the App's write failed, and the schedule takes the head again.
      - name: Approve the held runs of the screened head
        if: steps.approver.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.approver.outputs.token }}
          REPO: ${{ github.repository }}
          RUNS: ${{ steps.held.outputs.runs }}
        run: |
          set -euo pipefail
          read -r -a ids <<< "$RUNS"
          (( ${#ids[@]} > 0 )) || { echo "::error::the step before found no run to approve."; exit 1; }
          failed=0
          for id in "${ids[@]}"; do
            [[ $id =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a run id: $id"; exit 1; }
            if gh api --method POST "repos/$REPO/actions/runs/$id/approve" > /dev/null; then
              echo "Approved run $id."
            else
              echo "::error::run $id could not be approved."
              failed=1
            fi
          done
          exit "$failed"

  # The posts, with this run's own GitHub token: the review comment, the answer, the fix as one review of suggested
  # changes, the approved reply, or the comment that asks the author of a pull request with a merge conflict to resolve
  # it, and the state label and the label comment of each, which .github/review/rules.py sets from main's checkout of
  # .github/. A draft posts nothing but its label comment, after the review job uploaded it, and a relabel nothing but
  # the state label and the label comment of its head. A review, an answer or a fix that the fresh reader refused posts
  # nothing: the item gets waits-on-theorem and a label comment with Sami's next step. No App token posts here, so none
  # of these comments, reviews and labels starts a run of a workflow. It never commits or pushes: its token can write
  # no file of the repository. It runs whatever the post job's result, and reads that job's recorded as false when it
  # did not succeed.
  comment:
    needs: [trust, gather, review, post]
    # GitHub's implicit success() skips a job with a skipped ancestor, and a writer's run skips the screen job. A reply
    # has no gather, screen or review job: it needs the trust job alone.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main'
          && (((needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen'
                || needs.trust.outputs.task == 'answer' || needs.trust.outputs.task == 'draft')
               && needs.review.result == 'success')
              || ((needs.trust.outputs.task == 'conflict' || needs.trust.outputs.task == 'relabel'
                   || needs.trust.outputs.task == 'reply')
                  && needs.trust.result == 'success')) }}
    # One at a time for each item, and none cancelled: GitHub keeps every pending one (queue: max).
    concurrency:
      group: comment-${{ needs.trust.outputs.number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # contents: read for main's .github/, which holds .github/review/rules.py.
    permissions: {contents: read, issues: write, pull-requests: write}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ needs.trust.outputs.number }}
      BODY: ${{ needs.review.outputs.body }}
      # What the post job did at the head: false, and no decision, when that job did not succeed.
      RECORDED: ${{ needs.post.result == 'success' && needs.post.outputs.recorded || 'false' }}
      DECISION: ${{ needs.post.result == 'success' && needs.post.outputs.decision || '' }}
    steps:
      # main's .github/, for .github/review/rules.py; never the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with: {ref: main, persist-credentials: false, sparse-checkout: .github, sparse-checkout-cone-mode: false}
      - name: Post the review, or replace the one posted before
        if: >-
          env.POST_REVIEW == 'true' && (needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen')
          && needs.review.outputs.refused != 'review'
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ && -n $BODY ]] || { echo "::error::no review to post"; exit 1; }
          id=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- review -->"))) | .id' \
            | tail -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -f body="$BODY" --jq .html_url
          else
            gh api --method POST "repos/$REPO/issues/$NUMBER/comments" -f body="$BODY" --jq .html_url
          fi
      # The answer, once for each comment that it answers: a comment of github-actions[bot] that starts with the
      # answer's marker, <!-- review-answer <comment id>, is the answer posted already. An answer whose action is none,
      # or that the fresh reader refused, posts nothing.
      - name: Post the answer
        if: needs.trust.outputs.task == 'answer' && needs.review.outputs.refused != 'answer'
        env:
          ANSWER: ${{ needs.review.outputs.answer }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          if [ -z "$ANSWER" ]; then
            echo "#$NUMBER: the comments of its author ask nothing, so no answer posts."
            exit 0
          fi
          marker=${ANSWER%%$'\n'*}
          re='^<!-- review-answer ([1-9][0-9]*)( will-fix [0-9a-f]{40})? -->$'
          [[ $marker =~ $re ]] || { echo "::error::the answer does not start with its marker."; exit 1; }
          id=${BASH_REMATCH[1]}
          if [ "$POST_REVIEW" != true ]; then
            printf '%s\n' "$ANSWER" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
          posted=$(PREFIX="<!-- review-answer $id " gh api --paginate "repos/$REPO/issues/$NUMBER/comments" --jq '.[]
            | select(.user.login == "github-actions[bot]" and ((.body // "") | startswith($ENV.PREFIX))) | .id') \
            || { echo "::error::the comments of #$NUMBER could not be read"; exit 1; }
          if [ -n "$posted" ]; then
            echo "#$NUMBER: the comment $id has its answer already."
          else
            gh api --method POST "repos/$REPO/issues/$NUMBER/comments" -f body="$ANSWER" --jq .html_url
          fi
      # The fix, as one review of suggested changes on the head (POST pulls/<n>/reviews, event COMMENT, commit_id the
      # head, one comment on the right side of the diff for each suggestion), once for each head: a review of
      # github-actions[bot] whose body starts with <!-- review-fix <head> --> is the fix posted already. A pull
      # request that moved on from the head is the next run's. The output posted tells the label step that a fix
      # review is there.
      - name: Post the fix as suggested changes
        id: fixed
        if: needs.review.outputs.fix != ''
        env:
          FIX: ${{ needs.review.outputs.fix }}
          HEAD: ${{ needs.review.outputs.head }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ && $HEAD =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no pull request or no head"; exit 1; }
          printf '%s\n' "$FIX" > "$RUNNER_TEMP/fix.json"
          marker="<!-- review-fix $HEAD -->"
          jq -e --arg head "$HEAD" --arg marker "$marker" 'keys == ["body", "comments", "commit_id", "event"]
            and .commit_id == $head and .event == "COMMENT" and (.body | type == "string" and startswith($marker + "\n"))
            and (.comments | type == "array" and length > 0
                 and all(.[]; (.path | type) == "string" and (.line | type) == "number" and .side == "RIGHT"
                              and (.body | type) == "string"))' "$RUNNER_TEMP/fix.json" > /dev/null \
            || { echo "::error::the fix is not one review of suggested changes at $HEAD with its marker."; exit 1; }
          if [ "$POST_REVIEW" != true ]; then
            jq -r '.body, (.comments[] | "\n`\(.path):\(.line)`\n\n\(.body)")' "$RUNNER_TEMP/fix.json" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          now=$(gh api "repos/$REPO/pulls/$NUMBER" --jq .head.sha) || { echo "::error::no head of #$NUMBER"; exit 1; }
          [ "$now" = "$HEAD" ] || { echo "#$NUMBER has moved on from $HEAD: the run of its new head decides."; exit 0; }
          # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
          posted=$(MARKER=$marker gh api --paginate "repos/$REPO/pulls/$NUMBER/reviews" --jq '.[]
            | select(.user.login == "github-actions[bot]" and ((.body // "") | startswith($ENV.MARKER + "\n"))) | .id') \
            || { echo "::error::the reviews of #$NUMBER could not be read"; exit 1; }
          if [ -n "$posted" ]; then
            echo "#$NUMBER: the fix of $HEAD posted before."
          else
            gh api --method POST "repos/$REPO/pulls/$NUMBER/reviews" --input "$RUNNER_TEMP/fix.json" --jq .html_url
          fi
          echo "posted=true" >> "$GITHUB_OUTPUT"
      # The approved reply to an issue of an outside author (.github/review-answer.md, "An issue draft"): the text of the
      # run by hand, byte for byte, with no trim, no change and no added line, once: a comment of github-actions[bot]
      # with the same body is the reply posted already. The text comes from the run's input through this step's
      # environment alone, never into the script. No job of the run reads or keeps it otherwise. The output id, the id
      # of the reply's comment, goes to the label comment as the marker <!-- issue-reply-posted <id> -->, after which the
      # trust job answers the comments of the issue's author.
      - name: Post the approved reply
        id: replied
        if: needs.trust.outputs.task == 'reply'
        env:
          REPLY: ${{ inputs.reply }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          [[ ${REPLY:-} =~ [^[:space:]] ]] || { echo "::error::the run gives no text of a reply. Nothing posts."; exit 1; }
          if [ "$POST_REVIEW" != true ]; then
            printf '%s\n' "$REPLY" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
          posted=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" --jq '.[]
            | select(.user.login == "github-actions[bot]" and .body == $ENV.REPLY) | .id') \
            || { echo "::error::the comments of #$NUMBER could not be read"; exit 1; }
          id=${posted%%$'\n'*}
          if [ -n "$id" ]; then
            echo "#$NUMBER: the approved reply posted before, as comment $id."
          else
            id=$(gh api --method POST "repos/$REPO/issues/$NUMBER/comments" -f body="$REPLY" --jq .id) \
              || { echo "::error::the approved reply could not be posted"; exit 1; }
            echo "#$NUMBER: the approved reply posted, as comment $id."
          fi
          [[ $id =~ ^[1-9][0-9]*$ ]] || { echo "::error::the approved reply has no comment id: $id"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      # A review settles the hold of the review: a request by hand, or a later push that the screen passed. So does a
      # stored draft, and an approved reply that posted, for the hold of the draft. Not the review of an older head: a
      # newer push may have been held since. Nor when a hold came after this run started: a newer event of the issue or
      # the pull request was held. A hold of an answer that is tried again leaves the state as it is, so one that came
      # after this run started stops the labels of an answer's run alone. An approved reply that posted is recorded
      # whatever came after it, since the trust job reads its marker. An answer settles only a hold of an answer (its
      # marker names the task answer): it answers each comment that waits, the held one too. Each work (the review, the
      # answer, the draft, the approval) has its own hold comment, and review-held stays on while the newest hold of
      # another work than this run's is one that the rescreen job tries again and that work posted nothing since: the
      # rescreen job takes that work again, and a rescreen needs the label. An answer also leaves the label on for a
      # hold of another work that is not tried again (the screen's, which waits on Sami), until that work posts. Then
      # the state label of the outcome, and the label comment (.github/review/rules.py), from the item's kind, whether
      # this run took an outsider's path (so the screen passed it), the review's verdict, the two stops of the fix
      # (will_fix and fix_stop), whether a fix review posted, whether the post job recorded the import check run at
      # the head and its decision on it, the stored draft (its marker <!-- issue-draft <run>-<attempt> -->,
      # waits-on-theorem), the posted reply (its marker <!-- issue-reply-posted <id> -->, waits-on-author), and the text
      # that the fresh reader refused (waits-on-theorem, with Sami's step for it). An answer changes the state only when
      # the author said they will make the change, when a fix posted or stopped, or when the reader refused the answer or
      # the fix: else the label stays as the item's review, hold or reply set it. A relabel posts no review and leaves
      # review-held on: it sets the state of its head again from what the workflow wrote of that head
      # (.github/review/rules.py relabel): the verdict and will-fix of the review comment that names it, an answer's
      # will-fix at it, its fix reviews, and a hold comment that names it, the newer of a review and a hold first. With
      # only a merge conflict of the head in the label comment, which is gone now, it gives no state label and takes that
      # conflict's line out, so that the schedule reviews the head; with nothing of the head, the labels stay. The label
      # comment of an outside pull request holds the marker line <!-- repo-pairs-import-paths <head>: <value> --> of R12,
      # with the value of REPO_PAIRS_IMPORT_PATHS that this step read, and its text names the step for the import by
      # that value.
      - name: Take the label review-held off and set the state label
        if: env.POST_REVIEW == 'true' && needs.trust.outputs.task != 'conflict'
        env:
          TASK: ${{ needs.trust.outputs.task }}
          # The head that the review read, or the head of a relabel, which the trust job read.
          HEAD: ${{ needs.trust.outputs.task == 'relabel' && needs.trust.outputs.head || needs.review.outputs.head }}
          STARTED: ${{ needs.trust.outputs.started }}
          KIND: ${{ needs.trust.outputs.task == 'relabel' && 'pr' || needs.gather.outputs.kind }}
          OUTSIDER: ${{ needs.trust.outputs.outsider }}
          VERDICT: ${{ needs.review.outputs.verdict }}
          WILL_FIX: ${{ needs.review.outputs.will_fix }}
          FIX_STOP: ${{ needs.review.outputs.fix_stop }}
          FIX_POSTED: ${{ steps.fixed.outputs.posted }}
          DRAFT: ${{ needs.review.outputs.draft }}
          REPLIED: ${{ steps.replied.outputs.id }}
          REFUSED: ${{ needs.review.outputs.refused }}
          # The import's paths, one glob on each line, while the import is live (R12), as the post job reads them. An
          # empty value is no variable: GitHub gives an empty value for a variable that is not set.
          IMPORT_PATHS: ${{ vars.REPO_PAIRS_IMPORT_PATHS }}
        run: |
          set -uo pipefail
          [[ $STARTED =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
            || { echo "::error::no start time of this run"; exit 1; }
          # The stored draft and the posted reply, each with the marker line that the label comment keeps.
          draft_stored=false reply_posted=false markers=()
          case ${TASK:-} in
            draft)
              [[ ${DRAFT:-} =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]] || { echo "::error::the review job names no stored draft"; exit 1; }
              draft_stored=true markers=("marker=<!-- issue-draft $DRAFT -->") ;;
            reply)
              [[ ${REPLIED:-} =~ ^[1-9][0-9]*$ ]] || { echo "::error::the approved reply has no comment id"; exit 1; }
              reply_posted=true markers=("marker=<!-- issue-reply-posted $REPLIED -->") ;;
          esac
          if [ -n "$HEAD" ]; then
            now=$(gh api "repos/$REPO/pulls/$NUMBER" --jq .head.sha) || { echo "::error::no head of #$NUMBER"; exit 1; }
            [ "$now" = "$HEAD" ] || { echo "#$NUMBER has moved on from $HEAD: the labels stay."; exit 0; }
          fi
          # The work of this run: the review (a review or a rescreen), the answer, or the draft (a draft or a reply).
          work=review
          case ${TASK:-} in
            answer) work=answer ;;
            draft|reply) work=draft ;;
          esac
          # works: the start of a jq filter that defines work, the work that a hold comment's body holds, as the trust
          # job's works gives it: the task of the marker of a hold that is tried again (review for a marker with no
          # task), else the title's.
          works='def work: (capture("\n<!-- review-held-(limit|cap|transient) [0-9]+(?: [0-9]+(?: (?<t>answer|draft|approve)(?: [1-9][0-9]*)?)?)? -->(\n|$)")
              | .t // "review")
            // (capture("^<!-- review-held -->\n[*][*]Automated (?<t>answer|reply|approval|check for the import|close and reopen|catch-up) held[.][*][*](\n|$)")
              | {"answer": "answer", "reply": "draft", "approval": "approve", "check for the import": "import",
                 "close and reopen": "catchup", "catch-up": "catchup"}[.t])
            // "review"; '
          # What the hold comments of github-actions[bot] say, as "<last> <pending> <unsettled> <own>". last: when
          # GitHub last changed the newest hold that stops this run's labels, - for none: each hold for an answer's
          # run, and for any other run each hold but one of an answer that is tried again. pending: true when the
          # newest hold of another work than this run's is one that the rescreen job tries again and that work posted
          # nothing since: no review that names the head of the hold, for a held review or approval; no answer, for a
          # held answer; no stored draft and no posted reply, for a held draft. unsettled: true when the newest hold of
          # another such work, tried again or not (the screen's, which waits on Sami), is one that its work posted
          # nothing since. own: true when the newest hold of this run's work is tried again.
          found=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" --jq '.[] | @json') \
            || { echo "::error::the comments of #$NUMBER could not be read"; exit 1; }
          # shellcheck disable=SC2016 # $ENV and the names bound in the filter are jq's
          held=$(W=$work jq -rs "$works"'map(select(.user.login == "github-actions[bot]")
              | {at: (.updated_at // ""), made: (.created_at // .updated_at // ""), body: (.body // "")}) as $ours
            | [$ours[] | select(.body | startswith("<!-- review-held -->")) | .work = (.body | work)
                | .tried = (.body | test("\n<!-- review-held-(limit|cap|transient) [0-9]+ "))
                | .head = ((.body | capture("\n<!-- review-held-head (?<h>[0-9a-f]{40}) -->(\n|$)") | .h) // "")] as $holds
            | def posted: . as $h
                | if .work == "answer" then any($ours[]; (.body | startswith("<!-- review-answer ")) and .made > $h.at)
                  elif .work == "draft" then any($ours[]; (.body | startswith("<!-- review-label -->"))
                    and (.body | test("\n<!-- (issue-draft [0-9]+-[0-9]+|issue-reply-posted [0-9]+) -->(\n|$)")))
                  else any($ours[]; (.body | startswith("<!-- review -->")) and .at > $h.at
                    and ($h.head == "" or (.body | contains("\n<!-- review-head " + $h.head + " -->\n"))))
                  end;
              ($holds | group_by(.work) | map(max_by(.at) | select(.work != $ENV.W))) as $others
              | [($holds | map(select($ENV.W == "answer" or ((.work == "answer" and .tried) | not)) | .at) | max // "-"),
                 any($others[]; .tried and (posted | not)),
                 any($others[]; (.work | IN("review", "answer", "draft", "approve")) and (posted | not)),
                 ($holds | map(select(.work == $ENV.W)) | max_by(.at) | .tried // false)]
              | map(tostring) | join(" ")' <<< "$found") \
            || { echo "::error::the hold comments of #$NUMBER could not be read"; exit 1; }
          read -r last pending unsettled own <<< "$held"
          if [[ ${TASK:-} != reply && $last != - && ! $last < $STARTED ]]; then
            echo "#$NUMBER was held at $last, after this run started at $STARTED: the labels stay."
            exit 0
          fi
          take_off() {
            local out
            out=$(gh api --method DELETE "repos/$REPO/issues/$NUMBER/labels/$HELD_LABEL" 2>&1) \
              || [[ $out == *"(HTTP 404)"* ]] || { echo "::error::the label could not be taken off: $out"; exit 1; }
          }
          will_fix=false fix_stop=false fix_posted=false verdict=$VERDICT
          [ "${WILL_FIX:-}" != true ] || will_fix=true
          [ "${FIX_STOP:-}" != true ] || fix_stop=true
          [ "${FIX_POSTED:-}" != true ] || fix_posted=true
          if [ "${TASK:-}" = answer ]; then
            if [ "$own" = true ] && [ "$unsettled" != true ]; then take_off; fi
            if [ "$will_fix" = false ] && [ "$fix_stop" = false ] && [ "$fix_posted" = false ] && [ -z "${REFUSED:-}" ]; then
              echo "#$NUMBER: the answer changes no state, so the labels stay."
              exit 0
            fi
          elif [ "${TASK:-}" != relabel ]; then
            if [ "$pending" = true ]; then
              echo "#$NUMBER: a hold of other work is tried again, so the label $HELD_LABEL stays on."
            else
              take_off
            fi
          fi
          outsider=false
          [ -z "$OUTSIDER" ] || outsider=true
          # The variable's text, given only when it is set: an empty value is no variable.
          imports=()
          facts=()
          if [ -n "$IMPORT_PATHS" ]; then
            imports=("$IMPORT_PATHS")
            facts=("import_paths=$IMPORT_PATHS")
          fi
          if [ "$KIND" = pr ] && [ "$outsider" = true ] && [[ $HEAD =~ ^[0-9a-f]{40}$ ]]; then
            marker=$(python3 .github/review/rules.py import-marker "$HEAD" "${imports[@]}") \
              || { echo "::error::no marker line of the import's paths at $HEAD"; exit 1; }
            markers+=("marker=$marker")
          fi
          if [ "${TASK:-}" = relabel ]; then
            python3 .github/review/rules.py relabel "$NUMBER" "$HEAD" kind="$KIND" outsider="$outsider" \
              recorded="$RECORDED" decision="$DECISION" "${facts[@]}" "${markers[@]}"
            exit
          fi
          python3 .github/review/rules.py label "$NUMBER" kind="$KIND" outsider="$outsider" verdict="$verdict" \
            will_fix="$will_fix" fix_stop="$fix_stop" fix_posted="$fix_posted" recorded="$RECORDED" \
            decision="$DECISION" draft_stored="$draft_stored" reply_posted="$reply_posted" refused="${REFUSED:-}" \
            "${facts[@]}" "${markers[@]}"
      - name: Keep the review in the run's summary
        if: >-
          env.POST_REVIEW != 'true' && (needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen')
          && needs.review.outputs.refused != 'review'
        run: printf '%s\n' "$BODY" >> "$GITHUB_STEP_SUMMARY"
      # A pull request with a merge conflict starts no CI run, and so no review: its author resolves the conflict, and
      # the next push starts both. One comment for each head, which says so, and the label waits-on-author, which takes
      # the place of waits-on-theorem, with a label comment that holds <!-- review-conflict-state <head> -->
      # (.github/review/rules.py). The comment stays as the record of the conflict; the label comment's line goes
      # when a later state of the item takes its place.
      - name: Ask the author to resolve the merge conflict
        if: needs.trust.outputs.task == 'conflict'
        env:
          HEAD: ${{ needs.trust.outputs.head }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          [[ $HEAD =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no head commit of #$NUMBER"; exit 1; }
          marker="<!-- review-conflict $HEAD -->"
          body=$(printf '%s\n%s\n\n%s\n' "$marker" "**Merge conflict with \`main\`** at commit ${HEAD:0:12}." \
            "GitHub runs no checks on a pull request with a merge conflict, so the automated review does not run. Resolve the conflict: merge \`main\` into the branch, or rebase the branch on \`main\`. Then push the branch. After the push, the checks and the automated review run again.")
          if [ "$POST_REVIEW" != true ]; then
            printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
          posted=$(MARKER=$marker gh api --paginate "repos/$REPO/issues/$NUMBER/comments" --jq '.[]
            | select(.user.login == "github-actions[bot]" and (.body | startswith($ENV.MARKER))) | .id') \
            || { echo "::error::the comments of #$NUMBER could not be read"; exit 1; }
          if [ -n "$posted" ]; then
            echo "#$NUMBER: the comment on the conflict at $HEAD was posted before."
          else
            gh api --method POST "repos/$REPO/issues/$NUMBER/comments" -f body="$body" --jq .html_url
          fi
          python3 .github/review/rules.py label "$NUMBER" conflict=true head="$HEAD"

  # A pull request or an issue that the screen held, that could not be gathered or screened, whose review the screen
  # passed but that did not finish (SCREENED_HOURLY_CAP among the causes), or whose account is at OUTSIDE_HOURLY_LIMIT:
  # the label review-held, and one comment that says it was held, which a later hold of the same work replaces: the
  # review (a review or a rescreen), the answer, the draft and the approval each have their own hold comment, so that a
  # hold of one never takes the place of the hold of another, and the schedule takes each again. The comment says
  # nothing of why the screen held it: the screen job's one output is its verdict. A hold that the rescreen job tries
  # again ends with the marker <!-- review-held-<kind> <run> <tries> -->, by which that job finds it and the account:
  # limit (OUTSIDE_HOURLY_LIMIT); cap, a screened review stopped at SCREENED_HOURLY_CAP; or transient, a screened
  # review that failed otherwise or ran out of time, while it has failed fewer than REVIEW_TRIES times. <run> is the run
  # of the event this hold comes from (a run that takes the hold again keeps it), and <tries> the screened reviews of
  # it that failed so far. The marker of an answer's hold ends with the task and the comment that it answers:
  # <!-- review-held-<kind> <run> <tries> answer <comment id> -->, and the marker of a draft's hold with the task:
  # <!-- review-held-<kind> <run> <tries> draft -->, so that the rescreen job tries the answer again as the answer of
  # that comment, and the draft as a draft, which posts nothing, and never either as a review. Such a hold gives the
  # UTC time when the item is tried again, and no state label: the workflow still works on the item. An answer's hold
  # of that kind leaves the state label as it is: the state of the item does not wait for the answer. An approval has
  # no review, so it is held only at the limit, with the marker <!-- review-held-limit <run> <tries> approve -->, or by
  # its screen, whose hold says that the checks of the pull request have not run. A hold that is not tried again (the
  # screen's, or the last try of a review, an answer or a draft) gives waits-on-theorem and a label comment that names
  # Sami's next step (.github/review/rules.py, from main's checkout of .github/). Each hold of a pull request also
  # names the head that the run read, in the marker <!-- review-held-head <head> -->, by which the schedule tells which
  # head a hold stops. A cancelled screen holds nothing, nor a screened review or answer that a newer run of the same
  # item and task cancelled: that run decides. Nor a run whose sign-in failed: a step whose name starts with "Sign in"
  # failed in this attempt of the run, in any of its jobs. Such a run judged nothing of the item, so it gets no
  # comment, no label and no try, and the schedule takes the item again. The if below cannot see the steps of another
  # job, so a screen job that failed at its sign-in starts this job, which reads this attempt's jobs first and stops.
  hold:
    needs: [trust, gather, screen, review]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main'
      && (needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen'
          || needs.trust.outputs.task == 'answer' || needs.trust.outputs.task == 'draft'
          || needs.trust.outputs.task == 'approve')
      && (needs.trust.outputs.route == 'limit'
      || (needs.trust.outputs.route == 'screen'
          && (needs.gather.result == 'failure' || needs.screen.result == 'failure'
              || (needs.screen.result == 'success' && needs.screen.outputs.verdict != 'clean')
              || (needs.screen.outputs.verdict == 'clean'
                  && (needs.review.result == 'failure' || needs.review.result == 'cancelled')))))
    # One at a time for each item, and none cancelled: GitHub keeps every pending one (queue: max).
    concurrency:
      group: hold-${{ needs.trust.outputs.number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions: read for this run's jobs (did a sign-in fail? was the review stopped at the cap?) and this workflow's
    # runs (did a newer run of the item and task cancel it?); pull-requests: write reads the open pull requests too,
    # which map a head to its pull request; contents: read for main's .github/, which holds .github/review/rules.py.
    permissions: {contents: read, issues: write, pull-requests: write, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ needs.trust.outputs.number }}
      TASK: ${{ needs.trust.outputs.task }}
      ROUTE: ${{ needs.trust.outputs.route }}
      OUTSIDER: ${{ needs.trust.outputs.outsider }}
      REVIEW: ${{ needs.review.result }}
      ORIGIN: ${{ needs.trust.outputs.origin }}
      TRIES: ${{ needs.trust.outputs.tries }}
      # The comment that an answer answers, which the marker of its hold names.
      COMMENT: ${{ needs.trust.outputs.comment }}
      # The head of a pull request, as the trust job read it, which each hold of a pull request names.
      HEAD: ${{ needs.trust.outputs.head }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      # main's .github/, for .github/review/rules.py; never the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with: {ref: main, persist-credentials: false, sparse-checkout: .github, sparse-checkout-cone-mode: false}
      - name: Label it and say that it was held
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          [[ $RUN_ID =~ ^[1-9][0-9]*$ && $RUN_ATTEMPT =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a run id or attempt"; exit 1; }
          [[ $REVIEW_TRIES =~ ^[1-9][0-9]*$ ]] || { echo "::error::REVIEW_TRIES is not a number"; exit 1; }
          # Every step of this file that exists to get a token, or to show that the run can get one, has a name that
          # starts with "Sign in", and no other step has: the screen job's two, the review job's five, and the post
          # job's two. A new such step must be named so too, or this job would hold its failure as one of the item.
          # When such a step failed in this attempt of the run, in any of its jobs, nothing of the item was judged: no
          # comment, no label and no try, and the schedule takes the item again. A run at the limit ran no job but the
          # trust job. The failed steps tell a review stopped at SCREENED_HOURLY_CAP too (below). When the jobs cannot
          # be read, nothing is held, so that a run whose sign-in failed is never held: this job fails instead.
          failed=""
          if [ "$ROUTE" != limit ]; then
            failed=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" \
              --jq '.jobs[] | .steps[]? | select(.conclusion == "failure") | .name') \
              || { echo "::error::the jobs of this run could not be read, so nothing is held: the schedule takes the item again."; exit 1; }
            signin=$(grep -m 1 '^Sign in' <<< "$failed" || true)
            if [ -n "$signin" ]; then
              line="#$NUMBER is not held: the step \"$signin\" failed in this run. This run writes no hold comment and no label, and counts no try. The schedule takes the item again."
              echo "$line"
              printf '%s\n' "$line" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          tries=${TRIES:-0}
          [[ $tries =~ ^[0-9]+$ ]] || tries=0
          kind=""
          # The fact that this hold gives the label rule (.github/review/rules.py): held, for a hold that is tried
          # again, with no state label; screen_held or tries_used_up, for a hold that is not, with waits-on-theorem.
          fact=held
          # What was held, for the texts: the review of the item, the answer to the comments of its author, the draft of
          # the reply to an issue, or the approval of a first-time contributor's held runs.
          work_of="the automated review" title="Automated review held."
          if [ "$TASK" = answer ]; then
            work_of="the automated answer to the author's comment" title="Automated answer held."
          elif [ "$TASK" = draft ]; then
            work_of="the automated draft of a reply" title="Automated reply held."
          elif [ "$TASK" = approve ]; then
            work_of="the automated approval of the checks" title="Automated approval held."
          fi
          if [ "$ROUTE" != limit ] && [ "$REVIEW" = cancelled ]; then
            # A newer run of the same item and task (its next push, its next comment, its rescreen, or a request by
            # hand) cancels this run's review: only such a run is in the review job's concurrency group. That run
            # decides, whoever asked for this one. Not a newer run whose trust job was skipped (a CI run that was
            # cancelled, say), failed or was cancelled: it decides nothing, so this run holds the item. A trust job not
            # listed yet, still running, or passed may still decide. A run's name gives its task and item: #<n> ends at
            # a space or at the end of the name, and a workflow_run's head maps to its pull request through the open
            # pull requests. GitHub gives at most 1,000 runs for a list with created, the newest first, and total_count
            # then says that more match: when it cut the list before it reached this run, a newer run can be one that it
            # does not list, and nothing is held.
            [[ $TASK =~ ^[a-z]+$ ]] || { echo "::error::not a task: $TASK"; exit 1; }
            same="^$TASK #$NUMBER( |\$)"
            pushed='^review ([0-9a-f]{40}) by '
            heads=""
            # Before the runs of each page, "= <total_count> <runs on the page> <the oldest run on the page>".
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            newer=$(gh api --method GET --paginate "repos/$REPO/actions/workflows/review.yml/runs" \
              -f created=">=$(date -u -d '-1 day' +%Y-%m-%dT%H:%M:%SZ)" -F per_page=100 \
              --jq '"= \(.total_count // (.workflow_runs | length)) \(.workflow_runs | length) \([.workflow_runs[].id] | min // 0)",
                (.workflow_runs[]
                | select(.id > ($ENV.RUN_ID | tonumber) and (.event == "workflow_run" or .event == "issues"
                         or .event == "issue_comment" or .event == "workflow_dispatch"))
                | "\(.id) \(.event) \(.display_title // "" | gsub("[\r\n]"; " "))")') \
              || { echo "::error::the runs of this workflow could not be read"; exit 1; }
            awk -v run="$RUN_ID" '$1 == "=" { if ($2 > total) total = $2; listed += $3
                if ($3 > 0 && (oldest == "" || $4 < oldest)) oldest = $4 }
              END { exit (listed < total && (oldest == "" || oldest > run)) }' <<< "$newer" \
              || { echo "::error::GitHub lists at most 1,000 runs of this workflow since a day ago, and the runs that it" \
                     "does not list can be newer than this run. Nothing is held."; exit 1; }
            while read -r id event title; do
              [ -n "$id" ] && [ "$id" != = ] || continue
              [[ $id =~ ^[0-9]+$ ]] || { echo "::error::a run id is not a number"; exit 1; }
              if [[ $title =~ $same ]]; then
                :
              elif [[ $TASK == review && $event == workflow_run && $title =~ $pushed ]]; then
                sha=${BASH_REMATCH[1]}
                if [ -z "$heads" ]; then
                  heads=$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --jq '.[] | "\(.head.sha) \(.number)"') \
                    || { echo "::error::the open pull requests could not be read"; exit 1; }
                  heads=${heads:--}
                fi
                grep -qxF "$sha $NUMBER" <<< "$heads" || continue
              else
                continue
              fi
              trust=$(gh api --method GET --paginate "repos/$REPO/actions/runs/$id/jobs" -F per_page=100 \
                --jq '.jobs[] | select(.name == "trust") | .conclusion // "running"') \
                || { echo "::error::the jobs of run $id could not be read"; exit 1; }
              case $trust in
                skipped|failure|cancelled) ;;
                *) echo "A newer run of #$NUMBER ($TASK) cancelled this run's review: that run decides."; exit 0 ;;
              esac
            done <<< "$newer"
          fi
          item=$(gh api "repos/$REPO/issues/$NUMBER" --jq 'if .pull_request then "pr" else "issue" end') \
            || { echo "::error::#$NUMBER could not be read"; exit 1; }
          what="this pull request"
          [ "$item" = pr ] || what="this issue"
          # The rescreen job takes a hold with a marker once its comment is an hour old, at its next run of the four
          # each hour. A limit hold says what happens if the account is still at its limit; the other holds say only
          # that a new hold replaces this comment, since a rescreen can be held for another cause than theirs.
          next=$(date -u -d '+1 hour' '+%Y-%m-%d %H:%M UTC')
          again="The workflow screens $what again at its first scheduled run after $next. A scheduled run starts every 15 minutes."
          again_limit="$again If the account is still at the limit then, the workflow holds $what again. This comment then gives the new time."
          again_other="$again If the workflow holds it again, this comment says why."
          if [ "$ROUTE" = limit ]; then
            [[ $OUTSIDER =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || { echo "::error::not a GitHub login: $OUTSIDER"; exit 1; }
            kind=limit
            why="The latest event of $what comes from an account with no write access to this repository. The workflow screens at most $OUTSIDE_HOURLY_LIMIT pull requests, issues, pushes and comments of such an account each hour for automated reviews and answers. This account is at that limit. $again_limit"
          elif [ -z "$OUTSIDER" ]; then
            # A run by hand that asked for the screen first: no account's limit, and no try again.
            if [ "$REVIEW" = failure ] || [ "$REVIEW" = cancelled ]; then
              fact=tries_used_up
              why="This run started by hand with the option \`screen\` set, so the automated screen ran first. The automated screen passed $what, but the automated review did not finish. The workflow does not try it again."
            else
              fact=screen_held
              why="This run started by hand with the option \`screen\` set, so the automated screen ran first. The automated screen held $what, so the automated review did not run. You do not need to do anything."
            fi
          elif [ "$REVIEW" = failure ] || [ "$REVIEW" = cancelled ]; then
            # Stopped at SCREENED_HOURLY_CAP: its step of that name failed, in this attempt of this run (failed, read
            # above).
            if grep -qxF 'Hold at the hourly cap' <<< "$failed"; then
              kind=cap
              why="${what^} comes from an account without write access to this repository. The automated screen passed it, but the workflow already ran its limit of $SCREENED_HOURLY_CAP automated reviews and answers an hour for such accounts. $again_other"
            else
              tries=$((tries + 1))
              if (( tries < REVIEW_TRIES )); then
                kind=transient
                why="${what^} comes from an account without write access to this repository. The automated screen passed it, but $work_of did not finish. This was try $tries of $REVIEW_TRIES. $again_other"
              else
                fact=tries_used_up
                why="${what^} comes from an account without write access to this repository. The automated screen passed it, but $work_of did not finish after $tries tries. The workflow does not try it again."
              fi
            fi
          else
            fact=screen_held
            if [ "$TASK" = answer ]; then
              why="The automated screen held $what, so the workflow wrote no answer. You do not need to do anything."
            elif [ "$TASK" = approve ]; then
              why="The automated screen held this pull request, so its checks have not run. You do not need to do anything."
            elif [ "$item" = pr ]; then
              why="The automated screen held this pull request, so the automated review did not run. You do not need to do anything."
            else
              why="The automated screen held this issue, so the workflow wrote no reply. You do not need to do anything."
            fi
          fi
          marker=""
          if [ -n "$kind" ]; then
            [[ $ORIGIN =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a run id: $ORIGIN"; exit 1; }
            # The task that takes the hold again, when it is not a rescreen, and the comment of an answer.
            suffix=""
            case $TASK in
              answer)
                [[ ${COMMENT:-} =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a comment id: ${COMMENT:-}"; exit 1; }
                suffix=" answer $COMMENT" ;;
              draft|approve) suffix=" $TASK" ;;
            esac
            marker=$'\n'"<!-- review-held-$kind $ORIGIN $tries$suffix -->"
          fi
          # The head of a pull request that the run read, which the schedule reads: a hold that is not tried again
          # stops the work on that head.
          if [[ ${HEAD:-} =~ ^[0-9a-f]{40}$ ]]; then
            marker+=$'\n'"<!-- review-held-head $HEAD -->"
          fi
          body=$(printf '%s\n%s\n\n%s\n%s' '<!-- review-held -->' "**$title**" "$why" "$marker")
          # Adding a label that does not exist makes it, so a failed creation (two holds at once) only loses its colour
          # and its description.
          python3 .github/review/rules.py make-label "$HELD_LABEL"
          gh api --method POST "repos/$REPO/issues/$NUMBER/labels" -f "labels[]=$HELD_LABEL" --jq '.[].name' > /dev/null
          # The newest hold comment of the work of this hold, which this one replaces: a hold that is tried again names
          # its work in its marker (review for a marker with no task), and any other hold in its title, as the trust
          # job's works gives it. A hold of other work stays as it is.
          work=review
          case $TASK in answer|draft|approve) work=$TASK ;; esac
          # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
          id=$(W=$work gh api --paginate "repos/$REPO/issues/$NUMBER/comments" \
            --jq 'def work: (capture("\n<!-- review-held-(limit|cap|transient) [0-9]+(?: [0-9]+(?: (?<t>answer|draft|approve)(?: [1-9][0-9]*)?)?)? -->(\n|$)")
                  | .t // "review")
                // (capture("^<!-- review-held -->\n[*][*]Automated (?<t>answer|reply|approval|check for the import|close and reopen|catch-up) held[.][*][*](\n|$)")
                  | {"answer": "answer", "reply": "draft", "approval": "approve", "check for the import": "import",
                     "close and reopen": "catchup", "catch-up": "catchup"}[.t])
                // "review";
              .[] | select(.user.login == "github-actions[bot]" and ((.body // "") | startswith("<!-- review-held -->"))
                           and ((.body // "") | work) == $ENV.W) | .id' \
            | tail -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -f body="$body" --jq .html_url
          else
            gh api --method POST "repos/$REPO/issues/$NUMBER/comments" -f body="$body" --jq .html_url
          fi
          # An answer's hold that is tried again leaves the state label and the label comment as they are: the next
          # step of the item does not change while its answer waits.
          if [ "$TASK" = answer ] && [ "$fact" = held ]; then
            echo "#$NUMBER: the answer is held and tried again, so its state label stays."
            exit 0
          fi
          python3 .github/review/rules.py label "$NUMBER" "$fact=true"

  # The schedule's job, in the public repository alone. Every 15 minutes it starts, on main, the runs of this file that
  # the open items are due, at most one for each item and task (-f task=<task>, the top of this file):
  #   held      the work that each hold names, once the hold is over an hour old: a hold at OUTSIDE_HOURLY_LIMIT, of a
  #             screened review stopped at SCREENED_HOURLY_CAP, or of a screened review, answer or draft that failed or
  #             ran out of time, under REVIEW_TRIES. The marker of the hold names the task: answer (with the comment
  #             that it answers), draft or approve, and else rescreen. The review, the answer, the draft and the
  #             approval each have their own hold comment, and the newest hold of each is taken for itself. Never a
  #             hold that is not tried again (the screen's, or a last try): that work waits on Sami.
  #   answer    a comment of an outside item's author that waits for an answer (as the gather job lists them) and is
  #             over 15 minutes old, on an issue only after its first reply posted: once for each comment, then once
  #             an hour while the newest run of that comment posted nothing of its own (it ended at a failed sign-in,
  #             its comment job failed, or its hold job held it and no hold takes it again), up to REVIEW_TRIES runs
  #             whose comment job failed. A run of the comment's own event names the comment too. A run that its trust
  #             job stopped takes no comment.
  #   draft     an outside issue whose label comment holds no stored draft and no posted reply, once an hour after its
  #             newest draft run ended.
  #   approve   a first-time contributor's pull request whose head has runs that GitHub holds, while no approval run
  #             screened that head with a verdict since the newest held run (its screen job passed and its post job
  #             did not fail, or a hold that is not tried again names the head), once an hour.
  #   retry     the App's retry: a run of a head whose post job failed, at a sign-in (until the environment post holds
  #             the App's key) or at a write of the App, gets an approval again for an approval, a relabel for a review
  #             or a relabel (it records the import check run with no model), and a catch-up for a catch-up, once an
  #             hour.
  #   conflict  an outside pull request whose head has a merge conflict (mergeable_state dirty), for which GitHub starts
  #             no CI run, and whose label comment does not record that conflict yet (its line
  #             <!-- review-conflict-state <head> -->): the comment that asks the author to resolve it. When the line
  #             is there and GitHub says that the conflict is gone, with no push: a relabel, which sets the label and
  #             the label comment of the head again from what the workflow wrote of it (a review, an answer of its
  #             author, a hold comment, its fixes) and takes the line out. A relabel that ran waits an hour before the
  #             next one, and after REVIEW_TRIES relabels that left the line, the head is not tried again. While its
  #             conflict lasts, or its line is there, the head gets no other run of this list. A head whose merge
  #             state GitHub has not computed after a second read waits for the next run.
  #   catchup   an outside pull request whose head no review and no run of this workflow names, whose head repository
  #             is still there, and whose newest CI run of that head ended over an hour ago, with none still to finish:
  #             the post job closes and reopens it with the OSS Verify App's token, so that GitHub starts CI on it and
  #             the review follows. Once for each head. A pull request whose head repository is gone is never closed:
  #             GitHub cannot reopen it.
  #   review    an outside pull request whose head has a review in the form of before this workflow's move off
  #             pull_request_target, and not one of now, under the CI conditions of catchup: a review of that head from
  #             the API, with no close and no reopen. Once for each head, and again once an hour while its runs end at a
  #             failed sign-in or a failed comment job (up to REVIEW_TRIES of the second). Also each open pull request
  #             into main, a writer's too, whose head a run of this workflow names, no review and no hold comment
  #             names, and no CI run of which has not finished (an approval's CI run comes before its review): at the
  #             next run when each run that named the head stopped at its trust job, gave a conflict or was a relabel
  #             (a draft, another base, a conflict that went away), and else once the newest of them ended over an hour
  #             ago. After REVIEW_TRIES such reviews that ended
  #             with no failed sign-in and gave no conflict, the head is not tried again. When the newest run of the
  #             head is a review whose screen passed and whose review job failed at a sign-in, its failed jobs run again
  #             (POST actions/runs/<id>/rerun-failed-jobs) in the place of a new run, at most once an hour: the screen's
  #             verdict stands and is paid once, and the hourly caps count that run once. After 50 re-runs of it (its
  #             run_attempt past 50), or when GitHub refuses the re-run, a new run instead. GitHub re-runs no run made
  #             over 30 days ago, and this job reads the runs of the last 8 days alone.
  #   relabel   an outside pull request whose value of REPO_PAIRS_IMPORT_PATHS recorded for its head (the newer of the
  #             label comment's line <!-- repo-pairs-import-paths <head>: <value> --> and the output text of the
  #             head's check run repo-pairs/import-approved) is not the value now, or whose head has a review and no
  #             such line: a relabel, so that a variable that appears, changes or goes sets each label again by R12.
  #             Once an hour.
  #   reopen    a pull request that a catch-up run closed and could not reopen (a catch-up left closed: the trust job
  #             says how it is told), the one closed item that this job takes: a catch-up, which only reopens it, once
  #             an hour, whatever became of the catch-up runs after the one that closed it. After REVIEW_TRIES such
  #             runs that did not reopen it (a run that the trust job refused, or whose post job failed or was
  #             cancelled, counts; one that failed at a sign-in does not), it gets a hold comment that says so and
  #             waits-on-theorem with the label comment's step "Sami reopens the pull request", and this job fails
  #             once. Its runs by hand are read one day at a time back to the day before its close, however long ago.
  # A post job of an approval, a review, a relabel or a catch-up that failed at a step that is not a sign-in counts a
  # try of the head. After REVIEW_TRIES of them, the item gets a hold comment that names the head and says that its
  # automated work did not finish and is not tried again, and waits-on-theorem with the label comment's step "Sami
  # starts the automated work on this item again by hand" (.github/review/rules.py, from main's checkout of .github/),
  # and this job fails for that run.
  # Never for a draft pull request, a closed item (but a catch-up left closed), or a pull request into another branch
  # than main, and nothing for an item while a run of it has not finished: its screen and review can outlast the 15
  # minutes between runs, and a second run would use the hour's screens twice. It reads this workflow's runs of the
  # last 8 days by their names: the runs by hand one day at a time, as the App's retry can start 24 a day for each item,
  # and the runs of workflow_run, issue_comment and issues once each. GitHub gives at most 1,000 runs for a list with
  # created, and its total_count then says that more match: such a list is read again a day at a time, a day an hour
  # at a time, and a list of one hour that GitHub cut fails this run. It never reads the scheduled runs. It reads the
  # closed pull requests that are not merged in one GraphQL query, with the
  # newest close of each. It reads the jobs only of the runs that decide an item, the runs that GitHub holds for a
  # person's approval once for all heads (each head's own when GitHub cut that list at 1,000 runs), the head's CI runs
  # only for a catch-up or a review (as if one has not finished, when GitHub cut that list), and the head's check runs
  # only for the variable. Oldest reason first, each account gets at
  # most OUTSIDE_HOURLY_LIMIT runs that screen in an hour (a rescreen, a review, an answer, a draft or an approval whose
  # name ends with the account), less those that it had in the last hour, as the trust job counts them; the trust job
  # of each run counts again, with the account's own events, and holds the item again at the limit. A catch-up, a
  # conflict and a relabel screen nothing, run no model and count toward no limit. The trust job of each run reads
  # again from the API why this job started it, and stops when the reason no longer holds.
  # The work that a hold names is tried up to REVIEW_TRIES times since the hold: each run of its task since the hold
  # counts, as one that ended with neither a new hold nor a post, but a run that ended at a failed sign-in, which
  # judged nothing and counts no try (D19). Each try waits until the newest run of the task is over an hour old, as the
  # first waits on the hold. Then this job gives the item waits-on-theorem, with the same step for Sami, replaces the
  # hold comment of that work with one that says that the work is not tried again, and fails for that run. A hold whose
  # newest run of its task had a post job that approved held runs or recorded the import check run, or a comment job
  # that posted, is settled: it counts no try and starts nothing, and the held runs decide an approval.
  # Each reason is a function due_<reason> of the step below, which consider calls for each open item. A failed read
  # or start for one item leaves that item for the next run: the job goes on with the others, and fails at the end.
  # It is the only job of this file whose own token has actions: write, which starting a run needs, and it uses that
  # right only to start runs and to run the failed jobs of a review run again (above): it approves no held run (the
  # post job does, with the OSS Verify App's token, and only that job holds the App's key). A run that this token
  # starts starts no run of another workflow when it ends, and none
  # needs to: an approval and a reopen start CI with the App's token, in the post job. Its issues and pull-requests:
  # write let it set labels and write hold comments, checks: read lets it read the check runs of a head (the value of
  # REPO_PAIRS_IMPORT_PATHS that the import check recorded), and contents: read checks out main's .github/. It holds no
  # model, and writes nothing but those runs, labels and comments. Its cost: one job of a few seconds every 15 minutes,
  # 96 runs a day on a standard runner, whose minutes GitHub does not bill in a public repository.
  rescreen:
    if: >-
      github.event_name == 'schedule' && github.ref == 'refs/heads/main'
      && github.repository == 'theorem-labs/rocq-linux-process-semantics' && github.repository_id == 1425819621
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One at a time, so that two runs cannot start the same item.
    concurrency: {group: review-rescreen, cancel-in-progress: false}
    permissions: {actions: write, issues: write, pull-requests: write, checks: read, contents: read}
    steps:
      # main's .github/, for .github/review/rules.py; never the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with: {ref: main, persist-credentials: false, sparse-checkout: .github, sparse-checkout-cone-mode: false}
      - name: Start the runs that the open items are due
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # The import's paths, one glob on each line, while the import is live (R12), as the post and comment jobs
          # read them: the relabel of each head whose recorded value is not this one. An empty value is no variable:
          # GitHub gives an empty value for a variable that is not set.
          IMPORT_PATHS: ${{ vars.REPO_PAIRS_IMPORT_PATHS }}
        run: |
          set -euo pipefail
          # The if of this job compares the ref with no case, as GitHub's == does, so refs/heads/MAIN passes it. The
          # shell compares it byte for byte: on any other ref this step reads, starts and writes nothing.
          [ "${GITHUB_REF:-}" = refs/heads/main ] \
            || { echo "::error::This run is not on refs/heads/main, so the schedule starts no run."; exit 1; }
          [[ $OUTSIDE_HOURLY_LIMIT =~ ^[1-9][0-9]*$ ]] || { echo "::error::OUTSIDE_HOURLY_LIMIT is not a number"; exit 1; }
          [[ $REVIEW_TRIES =~ ^[1-9][0-9]*$ ]] || { echo "::error::REVIEW_TRIES is not a number"; exit 1; }
          # Without a posted review, answer or label comment, no run that this job starts settles an item: every held
          # item would be tried again up to REVIEW_TRIES times for nothing, and then left to Sami.
          if [ "$POST_REVIEW" != true ]; then
            echo "::notice::POST_REVIEW is not true: reviews are not posted, so the schedule starts no run."
            exit 0
          fi
          seen=$(mktemp -d -p "$RUNNER_TEMP")
          # trusted
          # trusted <login>: 0 when <login> is one of the APPS, or an account that GitHub's collaborator permission API
          # gives admin or write; 1 when it is neither; 2 when the API could not say. The API is asked once for each
          # login in this step (permission_of).
          declare -A permission_of=()
          trusted() {
            local permission
            [[ $1 =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || return 1
            [[ ,$APPS, != *",$1,"* ]] || return 0
            [[ $1 != *'[bot]' ]] || return 1
            if [ -z "${permission_of[$1]+set}" ]; then
              permission=$(gh api "repos/$REPO/collaborators/$1/permission" --jq .permission) || return 2
              permission_of[$1]=$permission
            fi
            [[ ${permission_of[$1]} == admin || ${permission_of[$1]} == write ]]
          }
          # end of trusted
          # held
          # titled: the names of the runs that the rescreen job starts and that name an account (run-name):
          # <task> #<n>[ at <head>][ for <comment>] of <login>. BASH_REMATCH[2] is then the number, and [5] the login.
          titled='^(rescreen|review|answer|draft|approve) #([1-9][0-9]*)( at [0-9a-f]{40})?( for [1-9][0-9]*)? of ([A-Za-z0-9-]+(\[bot\])?)$'
          # comments <number>: each comment of <number>, one JSON object on each line, as GitHub lists them. They are
          # read once in this step, and kept in $seen, a directory that the step makes for itself.
          comments() {
            local file=$seen/comments-$1
            if [ ! -f "$file" ]; then
              gh api --paginate "repos/$REPO/issues/$1/comments" --jq '.[] | @json' > "$file.part" || return 1
              mv "$file.part" "$file"
            fi
            cat "$file"
          }
          # works: the start of a jq filter that defines work, the work that a hold comment's body (its input) holds.
          # Each work has hold comments of its own, so that a hold of one work never takes the place of a hold of
          # another, and the schedule takes each work again. A hold that the rescreen job tries again names its work in
          # its marker: answer, draft or approve as the marker names the task, and review for a marker with no task (a
          # rescreen takes it again). Any other hold names it in its title: answer ("Automated answer held."), draft
          # ("Automated reply held."), approve ("Automated approval held."), import ("Automated check for the import
          # held."), catchup ("Automated close and reopen held." or "Automated catch-up held."), and review for any
          # other.
          works='def work: (capture("\n<!-- review-held-(limit|cap|transient) [0-9]+(?: [0-9]+(?: (?<t>answer|draft|approve)(?: [1-9][0-9]*)?)?)? -->(\n|$)")
              | .t // "review")
            // (capture("^<!-- review-held -->\n[*][*]Automated (?<t>answer|reply|approval|check for the import|close and reopen|catch-up) held[.][*][*](\n|$)")
              | {"answer": "answer", "reply": "draft", "approval": "approve", "check for the import": "import",
                 "close and reopen": "catchup", "catch-up": "catchup"}[.t])
            // "review"; '
          # holds <number>: the newest hold comment of each work (works) on <number>, one on each line: "<work> <time>
          # <run> <tries> <kind> <task> <comment> <id> <head>". For a hold that the rescreen job tries again (its marker
          # <!-- review-held-<kind> <run> <tries>[ <task>[ <comment>]] -->): <kind> is limit (OUTSIDE_HOURLY_LIMIT),
          # cap (SCREENED_HOURLY_CAP) or transient (a screened review, answer or draft that failed or ran out of time),
          # <run> the run of the event this hold comes from (a run that takes the hold again keeps it), <tries> the
          # screened reviews of it that failed so far, <task> the task that takes it again (answer, draft or approve as
          # the marker names it, and rescreen for a marker with no task), and <comment> the comment that a held answer
          # answers (- for none). Each of <run> to <comment> is - for a hold that is not tried again (the screen held
          # it, or its tries are used up). <id> is the id of the comment, and <head> the head that the hold names (- for
          # none). Only github-actions[bot]'s comments count.
          holds() {
            comments "$1" | jq -rs "$works"'map(select(.user.login == "github-actions[bot]"
                and ((.body // "") | startswith("<!-- review-held -->")))
                | {at: (.updated_at // "-"), id, body: (.body // "")} | .work = (.body | work))
              | group_by(.work)[] | max_by(.at)
              | "\(.work) \(.at) \((.body
                  | capture("\n<!-- review-held-(?<kind>limit|cap|transient) (?<run>[0-9]+)(?: (?<tries>[0-9]+)(?: (?<task>answer|draft|approve)(?: (?<comment>[1-9][0-9]*))?)?)? -->(\n|$)")
                  | "\(.run) \(.tries // "0") \(.kind) \(.task // "rescreen") \(.comment // "-")") // "- - - - -") \(
                .id) \((.body | capture("\n<!-- review-held-head (?<h>[0-9a-f]{40}) -->(\n|$)") | .h) // "-")"'
          }
          # limit_hold <number> <work>: the newest hold comment of <work> on <number> (holds), as "<time> <run> <tries>
          # <kind> <task> <comment> <id> <head>". Nothing when <work> has no hold comment.
          limit_hold() {
            local found
            found=$(holds "$1") || return 1
            awk -v w="$2" '$1 == w { sub(/^[^ ]+ /, ""); print }' <<< "$found"
          }
          # waiting <number> <author> <kind>: "<time> <id>" of each comment, review with a text and review comment of
          # <author> on <number> (a pull request when <kind> is pr) that waits for an answer, oldest first, as the gather
          # job lists them for an answer (answer-to.json): each one made after what the workflow's newest review, fix
          # review, answer or hold read. A review and a fix review read the conversation when their run started, as
          # their marker <!-- review-read <time> --> says (one with no such marker, from before it, when GitHub last
          # changed it), so that a comment made while their run ran still waits. An answer answers the comments up to
          # the one that its marker names, the newest that waited for it, so that a comment made while it ran still
          # waits too. A hold counts from the time GitHub last changed it. A hold that the workflow tries again as an
          # answer answers nothing: each comment that waited when it was written, up to the one that its marker names,
          # still waits until an answer answers it, whatever review or hold came after that hold.
          waiting() {
            local found
            # shellcheck disable=SC2016 # $b is jq's
            found=$(comments "$1" | jq -c '(.body // "") as $b | {made: .created_at, at: .updated_at, id,
              author: .user.login, own: (if .user.login != "github-actions[bot]" then null
                elif ($b | startswith("<!-- review-held -->"))
                     and ($b | test("\n<!-- review-held-[a-z]+ [0-9]+ [0-9]+ answer [0-9]+ -->(\n|$)"))
                then {held: ($b | capture("\n<!-- review-held-[a-z]+ [0-9]+ [0-9]+ answer (?<c>[0-9]+) -->") | .c)}
                elif ($b | test("^<!-- review-answer [0-9]+")) then {answers: ($b | capture("^<!-- review-answer (?<c>[0-9]+)") | .c)}
                elif ($b | test("^<!-- review(-held)? -->")) then {read: (($b
                  | capture("\n<!-- review-read (?<t>[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z) -->(\n|$)")
                  | .t) // .updated_at)}
                else null end)}') \
              || return 1
            if [ "$3" = pr ]; then
              # shellcheck disable=SC2016 # $b is jq's
              found+=$'\n'$(gh api --paginate "repos/$REPO/pulls/$1/reviews" --jq '.[] | (.body // "") as $b
                | {made: .submitted_at, at: .submitted_at, id, author: .user.login, text: ($b | test("\\S")),
                   own: (if .user.login == "github-actions[bot]" and ($b | startswith("<!-- review-fix ")) then {read: (($b
                     | capture("\n<!-- review-read (?<t>[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z) -->(\n|$)")
                     | .t) // .submitted_at)} else null end)}
                | @json') || return 1
              found+=$'\n'$(gh api --paginate "repos/$REPO/pulls/$1/comments" \
                --jq '.[] | {made: .created_at, id, author: .user.login, own: null} | @json') || return 1
            fi
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            AUTHOR_OF=$2 jq -rs '(map(select(.author == $ENV.AUTHOR_OF) | {key: (.id | tostring), value: (.made // "")})
                | from_entries) as $made
              | ([.[] | select(.own.answers) | $made[.own.answers] // .at] | map(strings) | max // "") as $answered
              | [.[] | select(.own.read) | {read: .own.read, at}] as $reads
              | ($reads | map(.read) + [$answered] | map(strings) | max // "") as $since
              | [.[] | select(.own.held) | {upto: $made[.own.held], at} | select(.upto != null)] as $holds
              | .[] | select(.author == $ENV.AUTHOR_OF and .text != false and ((.made // "") as $m
                  | $m > $since or any($holds[]; . as $h | $m <= $h.upto and $m > $answered
                      and $m > ([$reads[] | select(.at < $h.at) | .read] | map(strings) | max // ""))))
              | "\(.made) \(.id)"' <<< "$found" | sort
          }
          # held_account <run>: the account whose limit a hold of <run> counts on, when <run> is a run of this
          # workflow (by its path): the account that started it, for a run of workflow_run, issues or issue_comment;
          # the account its name ends with, for a run that github-actions[bot] started (the rescreen job's) with one of
          # that job's names (titled); the account that started it, for a run by hand of an App in APPS or of an
          # account with write access (trusted), which has no limit. Nothing for any other run, or when GitHub no
          # longer has it (a deleted or expired run). It fails when GitHub could not say.
          held_account() {
            local run path event login title rc=0
            [[ $1 =~ ^[1-9][0-9]*$ ]] || return 0
            run=$(gh api "repos/$REPO/actions/runs/$1" \
              --jq '"\(.path // "-") \(.event) \(.actor.login) \(.display_title // "" | gsub("[\r\n]"; " "))"' 2>&1) \
              || { [[ $run == *"(HTTP 404)"* ]] || return 1; return 0; }
            read -r path event login title <<< "$run"
            [[ $path == '.github/workflows/review.yml' && $login =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || return 0
            case $event in
              workflow_run|issues|issue_comment) echo "$login" ;;
              workflow_dispatch)
                if [ "$login" = 'github-actions[bot]' ]; then
                  if [[ $title =~ $titled ]]; then echo "${BASH_REMATCH[5]}"; fi
                else
                  trusted "$login" || rc=$?
                  (( rc != 2 )) || return 1
                  (( rc != 0 )) || echo "$login"
                fi ;;
            esac
          }
          # head_marks <number> <head>: what the comments of github-actions[bot] on <number> say of <head>, as
          # "<review> <held> <conflict>". review is new when a comment holds the marker <!-- review-head <head> --> of
          # this workflow's review, old when one starts with <!-- review --> and holds "of commit " and the first 12
          # characters of <head> (the review of before the move off pull_request_target), and none else. held is true
          # when a hold comment names <head> (<!-- review-held-head <head> -->). conflict is true when the label
          # comment holds <!-- review-conflict-state <head> -->: <head> waits on its author for a merge conflict.
          head_marks() {
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            comments "$1" | SHA=$2 jq -rs 'map(select(.user.login == "github-actions[bot]") | .body // "") as $b
              | [(if any($b[]; test("(^|\n)<!-- review-head " + $ENV.SHA + " -->(\n|$)")) then "new"
                  elif any($b[]; startswith("<!-- review -->") and contains("of commit " + $ENV.SHA[0:12])) then "old"
                  else "none" end),
                 any($b[]; startswith("<!-- review-held -->")
                   and test("\n<!-- review-held-head " + $ENV.SHA + " -->(\n|$)")),
                 any($b[]; startswith("<!-- review-label -->")
                   and test("\n<!-- review-conflict-state " + $ENV.SHA + " -->(\n|$)"))] | map(tostring) | join(" ")'
          }
          # gave_up <number>: true when a hold comment of github-actions[bot] on <number> says that the automated
          # catch-up closed it and could not reopen it. The catch-up then tries nothing more on it.
          gave_up() {
            comments "$1" | jq -rs 'any(.[]; .user.login == "github-actions[bot]" and ((.body // "")
              | startswith("<!-- review-held -->")
                and contains("\n\nThe automated catch-up closed this pull request and could not reopen it after ")))'
          }
          # pages: the start of the --jq filter of a list of runs, which gives, before the rows of each page, the line
          # "= <total_count> <runs on the page>" that whole reads.
          pages='"= \(.total_count // (.workflow_runs | length)) \(.workflow_runs | length)", '
          # whole: the rows of a list of runs read with pages, from standard input. It fails, with no row, when GitHub
          # cut the list: GitHub gives at most 1,000 runs for a list with created, event, head_sha or status, the newest
          # first, and its total_count then says that more runs match.
          whole() {
            awk '$1 == "=" { if ($2 > total) total = $2; listed += $3; next } { rows[++n] = $0 }
              END { if (listed < total) exit 3; for (i = 1; i <= n; i++) print rows[i] }'
          }
          # runs_in <event> <created> <filter>: the rows that <filter> (a --jq filter that starts with pages) gives of
          # this workflow's runs of <event> created in <created>: from the start of a day on (>=<day>T00:00:00Z), on a
          # day (<day>), or in an hour of a day. A list that GitHub cut is read again one day at a time, and the list of
          # a day one hour at a time. It fails when GitHub could not say, or when it cut the list of an hour.
          runs_in() {
            local out rows day today hour
            out=$(gh api --method GET --paginate "repos/$REPO/actions/workflows/review.yml/runs" -f event="$1" \
              -f created="$2" -F per_page=100 --jq "$3") || return 1
            if rows=$(whole <<< "$out"); then
              [ -z "$rows" ] || printf '%s\n' "$rows"
              return 0
            fi
            case $2 in
              '>='[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]T00:00:00Z)
                day=${2:2:10} today=$(date -u +%Y-%m-%d)
                while [[ ! $day > $today ]]; do
                  runs_in "$1" "$day" "$3" || return 1
                  day=$(date -u -d "$day +1 day" +%Y-%m-%d)
                done ;;
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9])
                for hour in $(seq -w 0 23); do
                  runs_in "$1" "${2}T$hour:00:00Z..${2}T$hour:59:59Z" "$3" || return 1
                done ;;
              *) echo "::error::GitHub lists at most 1,000 runs of $1 created $2, and more of them match." >&2; return 1 ;;
            esac
          }
          # ci_of <head>: the CI runs of <head> of the event pull_request: pending while one of them is queued, in
          # progress, waiting or held for a person's approval (action_required), or while GitHub does not list them all
          # (whole); else the time when the newest one ended; nothing when there is none.
          ci_of() {
            local out rows
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            out=$(SHA=$1 gh api --method GET --paginate "repos/$REPO/actions/runs" -f head_sha="$1" -F per_page=100 \
              --jq "$pages"'(.workflow_runs[] | select(.head_sha == $ENV.SHA and .event == "pull_request"
                  and .path == ".github/workflows/ci.yml")
                | if .status == "completed" then .updated_at // "-" else "pending" end)') || return 1
            if ! rows=$(whole <<< "$out"); then echo pending; return 0; fi
            sort <<< "$rows" | awk '$0 == "pending" { p = 1 } NF { last = $0 } END { print (p ? "pending" : last) }'
          }
          # end of held
          hour=$(date -u -d '-1 hour' +%Y-%m-%dT%H:%M:%SZ)
          quarter=$(date -u -d '-15 minutes' +%Y-%m-%dT%H:%M:%SZ)
          first=$(date -u -d '-7 days' +%Y-%m-%d)
          failed=0
          # The open pull requests: the head, the base, whether each is a draft, and the id of its head repository (0
          # when that repository is gone). A workflow_run's name gives its head, which they map to its pull request.
          pulls=$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | "\(.number) \(.head.sha) \(.base.ref) \((.draft // false) | tostring) \(.head.repo.id // 0)"') \
            || { echo "::error::the open pull requests could not be read."; exit 1; }
          declare -A pr_of=() pr_head=() pr_base=() pr_draft=() pr_repo=()
          while read -r n sha base draft repository; do
            [[ ${n:-} =~ ^[1-9][0-9]*$ && ${sha:-} =~ ^[0-9a-f]{40}$ ]] || continue
            pr_of[$sha]=$n pr_head[$n]=$sha pr_base[$n]=$base pr_draft[$n]=$draft pr_repo[$n]=${repository:-0}
          done <<< "$pulls"
          # This workflow's runs of the last 8 days, by their names: the runs by hand one day at a time, the runs of
          # each event in one list from the first of those days, and never the scheduled runs. GitHub gives at most
          # 1,000 runs for one list with created: a list that it cut is read again one day, then one hour, at a time,
          # and a list of one hour that it cut stops this run (runs_in). row gives each run on one line: "<id>
          # <created> <ended> <status> <conclusion> <event> <started> <attempt> <name>", - for none (ended, for a run
          # that is not completed); attempt is its run_attempt, 1 for its first.
          row='def row: "\(.id) \(.created_at // "-") \(if .status == "completed"
            then (.updated_at // .created_at // "-") else "-" end) \(.status // "-") \(.conclusion // "-") \(.event) \(
            .run_started_at // .created_at // "-") \(.run_attempt // 1) \(.display_title // "" | gsub("[\r\n]"; " "))";'
          # by_hand <day>: the runs by hand of <day>, as rows.
          by_hand() {
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            DAY=$1 runs_in workflow_dispatch "$1" "$row$pages"'(.workflow_runs[]
              | select(.event == "workflow_dispatch" and ((.created_at // "") | startswith($ENV.DAY))) | row)'
          }
          : > "$seen/listed"
          for back in 7 6 5 4 3 2 1 0; do
            day=$(date -u -d "-$back days" +%Y-%m-%d)
            by_hand "$day" >> "$seen/listed" || { echo "::error::the runs of $day could not be read."; exit 1; }
          done
          for event in workflow_run issue_comment issues; do
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            EVENT=$event FROM="${first}T00:00:00Z" runs_in "$event" ">=${first}T00:00:00Z" "$row$pages"'(.workflow_runs[]
              | select(.event == $ENV.EVENT and (.created_at // "") >= $ENV.FROM) | row)' \
              >> "$seen/listed" || { echo "::error::the runs of the event $event could not be read."; exit 1; }
          done
          # Each run that names an item, in $seen/runs: "<id> <created> <ended> <status> <conclusion> <event> <number>
          # <task> <head> <comment> <account> <started> <attempt>", - for none. A name gives its task and its item
          # (run-name): #<n> ends at a space or at the end of the name, so that #12 is never #123, and a workflow_run's
          # name gives its head, which the open pull requests map to its pull request. An item with a run that has not
          # finished, of any task, gets no run (running).
          named='^(review|answer|draft|reply|rescreen|approve|catchup|conflict|relabel) #([1-9][0-9]*)( at ([0-9a-f]{40}))?( for ([1-9][0-9]*))?( of ([A-Za-z0-9-]+(\[bot\])?))?$'
          pushed='^review ([0-9a-f]{40}) by '
          opened='^review #([1-9][0-9]*)$'
          answered='^answer #([1-9][0-9]*) for ([1-9][0-9]*) by '
          declare -A running=() reached=()
          # take <file>: each run of the rows of <file> that names an item, into $seen/runs.
          take() {
            local id created ended status conclusion event started attempt title number task head comment account
            while read -r id created ended status conclusion event started attempt title; do
              [[ ${id:-} =~ ^[1-9][0-9]*$ ]] || continue
              number="" task="" head=- comment=- account=-
              case $event in
                workflow_dispatch)
                  [[ ${title:-} =~ $named ]] || continue
                  task=${BASH_REMATCH[1]} number=${BASH_REMATCH[2]} head=${BASH_REMATCH[4]:--}
                  comment=${BASH_REMATCH[6]:--} account=${BASH_REMATCH[8]:--} ;;
                workflow_run)
                  [[ ${title:-} =~ $pushed ]] || continue
                  task=review head=${BASH_REMATCH[1]}
                  number=${pr_of[$head]:-} ;;
                issues)
                  [[ ${title:-} =~ $opened ]] || continue
                  task=review number=${BASH_REMATCH[1]} ;;
                issue_comment)
                  [[ ${title:-} =~ $answered ]] || continue
                  task=answer number=${BASH_REMATCH[1]} comment=${BASH_REMATCH[2]} ;;
                *) continue ;;
              esac
              [ -n "$number" ] || continue
              [ "$status" = completed ] || running[$number]=1
              echo "$id $created $ended $status $conclusion $event $number $task $head $comment $account $started" \
                "${attempt:--}" >> "$seen/runs"
            done < "$1"
          }
          : > "$seen/runs"
          take "$seen/listed"
          # reach <day>: the runs by hand of each day from <day> to the day before the first of the 8 days, each day
          # listed once, into $seen/runs: a catch-up left closed reads back to the day before its close.
          reach() {
            local day=$1
            while [[ $day < $first ]]; do
              if [ -z "${reached[$day]:-}" ]; then
                by_hand "$day" > "$seen/back-$day" || { echo "::error::the runs of $day could not be read."; return 1; }
                take "$seen/back-$day"
                reached[$day]=1
              fi
              day=$(date -u -d "$day +1 day" +%Y-%m-%d)
            done
          }
          # facts <run>: what the jobs of <run> show, read once: "<signin> <screen> <post> <settled> <early> <reviewed>
          # <commented> <held> <counts>", - for none. signin: a step whose name starts with "Sign in" failed in a job of
          # the run, which so judged nothing. screen: the conclusion of its screen job. post: the conclusion of its post
          # job, signin for one that failed at such a step and failure for one that failed at another (a write of the
          # App, say). settled: its post job approved held runs or recorded the import check run. early: stopped when
          # its trust job stopped it (the job was skipped, or every job after it was), conflict when the comment job
          # alone ran after it (the task conflict). reviewed: signin when its review job failed at such a step.
          # commented: the conclusion of its comment job, which posts the review, the answer or the label comment of a
          # draft (success when it did, failure or cancelled when it posted nothing or not all). held: held when its
          # hold job ran, so the run itself posted nothing. counts: count when the run counts toward the limit of the
          # account that its name ends with, as the trust job's earlier counts it (not a run that its trust job
          # refused, nor one whose screen or review could not sign in), else skip.
          facts() {
            local file=$seen/jobs-$1
            if [ ! -f "$file" ]; then
              gh api --method GET --paginate "repos/$REPO/actions/runs/$1/jobs" -F per_page=100 --jq '.jobs[] | @json' \
                > "$file.part" || return 1
              mv "$file.part" "$file"
            fi
            jq -rs 'def signed_out:
                any(.steps[]?; ((.name // "") | startswith("Sign in")) and .conclusion == "failure");
              (map(select(.name == "trust")) | first) as $t | (map(select(.name == "post")) | first) as $p
              | map(select(.name != "trust" and .name != "rescreen")) as $rest
              | [(if any(.[]; signed_out) then "signin" else "-" end),
                 ((map(select(.name | test("^screen( |$)"))) | first | .conclusion) // "-"),
                 (if $p == null then "-" elif $p.conclusion != "failure" then ($p.conclusion // "running")
                  elif ($p | signed_out) then "signin" else "failure" end),
                 (if $p != null and any($p.steps[]?; .conclusion == "success" and (.name
                    | IN("Approve the held runs of the screened head", "Record the import check of the head")))
                  then "settled" else "-" end),
                 (if $t == null then "-" elif $t.conclusion == "skipped" then "stopped"
                  elif $t.status == "completed" and ($rest | length) > 0 and ($rest | all(.conclusion == "skipped"))
                  then "stopped"
                  elif [$rest[] | select(.conclusion != "skipped") | .name] == ["comment"] then "conflict"
                  else "-" end),
                 (if any($rest[] | select(.name | test("^review( |$)")); signed_out) then "signin" else "-" end),
                 ((map(select(.name == "comment")) | first) as $c
                  | if $c == null then "-" else ($c.conclusion // "running") end),
                 (if any(.[]; .name == "hold" and .conclusion == "success") then "held" else "-" end),
                 (if $t == null then "count" elif $t.conclusion == "skipped" then "skip"
                  elif $t.status == "completed" and ($rest | length) > 0 and ($rest | all(.conclusion == "skipped"))
                  then "skip"
                  elif any($rest[] | select(.name | test("^(screen|review)( |$)")); signed_out) then "skip"
                  else "count" end)] | join(" ")' "$file"
          }
          declare -A used=() paced=() owed=() access=()
          # access_of <login>: access[<login>], trusted's answer for <login>, 0 or 1, kept for this run. It fails when
          # GitHub could not say.
          access_of() {
            local rc=0
            [ -z "${access[$1]:-}" ] || return 0
            trusted "$1" || rc=$?
            (( rc != 2 )) || { echo "::error::GitHub did not say whether $1 has write access."; return 1; }
            access[$1]=$rc
          }
          # held_of: held_list, "<head> <created>" of each run of the event pull_request that GitHub holds for a
          # person's approval (status action_required), read once in this run. GitHub lists at most 1,000 of them, the
          # newest first: when it cut the list, held_list is empty and held_cut is set, and held_at reads the runs of
          # each head.
          held_list="" held_read="" held_cut=""
          held_of() {
            local out
            [ -z "$held_read" ] || return 0
            out=$(gh api --method GET --paginate "repos/$REPO/actions/runs" -f status=action_required \
              -f event=pull_request -F per_page=100 --jq "$pages"'(.workflow_runs[] | select(.status == "action_required"
                and .event == "pull_request") | "\(.head_sha) \(.created_at // "-")")') || return 1
            held_list=$(whole <<< "$out") || held_cut=1
            held_read=1
          }
          # held_at <head>: after held_of, when each run of <head> that GitHub holds was made, one on each line. When
          # GitHub cut the list of the runs of every head, the runs of <head> alone are read: the newest come first, so
          # that list gives whether <head> has one and when the newest was made, cut or not.
          held_at() {
            if [ -z "$held_cut" ]; then
              awk -v h="$1" '$1 == h { print $2 }' <<< "$held_list"
              return 0
            fi
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            SHA=$1 gh api --method GET --paginate "repos/$REPO/actions/runs" -f head_sha="$1" -f status=action_required \
              -F per_page=100 --jq '.workflow_runs[] | select(.status == "action_required" and .head_sha == $ENV.SHA
                and .event == "pull_request") | .created_at // "-"'
          }
          # pace <login>: used[<login>], the runs of the last hour whose names end with " of <login>" and that count
          # toward its limit (facts), with the runs that this job started for it in this run.
          pace() {
            local id f
            [ -z "${paced[$1]:-}" ] || return 0
            used[$1]=0
            while read -r id; do
              f=$(facts "$id") || { echo "::error::the jobs of run $id could not be read."; return 1; }
              [ "${f##* }" != count ] || used[$1]=$(( ${used[$1]} + 1 ))
            done < <(awk -v a="$1" -v from="$hour" '$6 == "workflow_dispatch" && $11 == a && $2 >= from &&
              $8 ~ /^(rescreen|review|answer|draft|approve)$/ { print $1 }' "$seen/runs")
            paced[$1]=1
          }
          : > "$seen/due"
          # owe <at> <task> <account> <head> <comment> <why>: #number is due a run of <task>, for <account> (empty for
          # none), at most one for each item and task. The runs start oldest <at> (when the reason began) first.
          owe() {
            local key=$number:$2
            [ -z "${owed[$key]:-}" ] || return 0
            owed[$key]=1
            echo "$1 $number $2 ${3:--} ${4:--} ${5:--} $6" >> "$seen/due"
          }
          # runs_of <tasks> [<head>] [<event>]: "<created> <ended> <run>" of each run of #number of a task of <tasks>
          # (a regular expression), of <head> and of <event> when they are given, oldest first.
          runs_of() {
            awk -v n="$number" -v re="^($1)\$" -v h="${2:-}" -v e="${3:-}" '$7 == n && $8 ~ re &&
              (h == "" || $9 == h) &&
              (e == "" || $6 == e) { print $2, $3, $1 }' "$seen/runs" | sort
          }
          # hold_id <work>: the id of the newest hold comment of <work> on #number (limit_hold), nothing for none.
          hold_id() {
            local line id
            line=$(limit_hold "$number" "$1") || return 1
            read -r _ _ _ _ _ _ id _ <<< "$line"
            echo "${id:-}"
          }
          # marks_of: marks, the markers of the label comment of #number that this job reads, one on each line: draft
          # for the stored draft of its reply, and replied for a reply that posted.
          marks_of() {
            [ -z "$marks_read" ] || return 0
            marks=$(comments "$number" | jq -r 'select(.user.login == "github-actions[bot]"
                and ((.body // "") | startswith("<!-- review-label -->")))
              | (if (.body | test("(^|\n)<!-- issue-draft [0-9]+-[0-9]+ -->(\n|$)")) then "draft" else empty end),
                (if (.body | test("(^|\n)<!-- issue-reply-posted [0-9]+ -->(\n|$)")) then "replied" else empty end)' \
              | sort -u) || { echo "::error::the comments of #$number could not be read."; return 1; }
            marks_read=1
          }
          # waits_of: waits, the comments of the author of #number that wait for an answer (waiting).
          waits_of() {
            [ -z "$waits_read" ] || return 0
            waits=$(waiting "$number" "$author" "$kind") \
              || { echo "::error::the comments of #$number could not be read."; return 1; }
            waits_read=1
          }
          # say_held <id> <title> <text>: the hold comment of #number with <title> and <text>, which names the head of a
          # pull request and holds no marker of a hold that is tried again, in the place of the comment <id> (- for a
          # new comment).
          say_held() {
            local body
            body=$(printf '%s\n%s\n\n%s' '<!-- review-held -->' "**$2**" "$3")
            [ -z "$head" ] || body+=$'\n\n'"<!-- review-held-head $head -->"
            if [ "$1" != - ]; then
              gh api --method PATCH "repos/$REPO/issues/comments/$1" -f body="$body" --jq .html_url
            else
              gh api --method POST "repos/$REPO/issues/$number/comments" -f body="$body" --jq .html_url
            fi
          }
          # stopped <task> <tries>: the work of the hold is not tried again, after <tries> runs of <task>. Only while
          # the newest hold comment of that work is still the one read above (at h_at): a newer hold of it (a new
          # event's, or a run's that finished meanwhile) is not overwritten, and the next run decides from it. The hold
          # comment of other work stays as it is. waits-on-theorem first, so that a label that could not be set leaves
          # the hold comment's marker, and the next run tries both again. A comment that could not be replaced keeps its
          # marker, and the next run tries again. This run fails for it.
          stopped() {
            local newest at id title work what of=$1
            [ "$of" != rescreen ] || of=review
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            newest=$(W=$of gh api --paginate "repos/$REPO/issues/$number/comments" --jq "$works"'.[]
              | select(.user.login == "github-actions[bot]" and ((.body // "") | startswith("<!-- review-held -->"))
                       and ((.body // "") | work) == $ENV.W)
              | "\(.updated_at) \(.id)"' | sort | tail -n 1) \
              || { echo "::error::the comments of #$number could not be read."; return 1; }
            read -r at id <<< "$newest"
            if [ "${at:-}" != "$h_at" ]; then
              echo "#$number: its hold changed (${at:-none}, read at $h_at) since this run read it: left for the next" \
                "run."
              return 0
            fi
            echo "::error::#$number: $1 ran $2 times since its hold at $h_at, with no new hold and nothing posted: it" \
              "is not tried again, and the label comment names the next step for Sami."
            failed=1
            [[ $id =~ ^[1-9][0-9]*$ ]] || { echo "::error::#$number has no hold comment to replace."; return 0; }
            python3 .github/review/rules.py label "$number" tries_used_up=true \
              || { echo "::error::the label of #$number could not be set; the next run tries again."; return 0; }
            case $1 in
              answer) title="Automated answer held." work="the automated answer" ;;
              draft) title="Automated reply held." work="the automated draft of a reply" ;;
              approve) title="Automated approval held." work="the automated approval of the checks" ;;
              *) title="Automated review held." work="the automated review" ;;
            esac
            what="this issue"
            [ "$kind" != pr ] || what="this pull request"
            say_held "$id" "$title" "The workflow tried $work again $2 times after it held $what, and none of these tries finished. The workflow does not try it again. You do not need to do anything." \
              || echo "::error::the hold comment of #$number could not be replaced; the next run tries again."
          }
          # head_stopped <work> <tries>: the automated <work> (review; approval, of the held runs; import, the import
          # check; or catchup) of the head of #number did not finish after <tries> tries, and is not tried again:
          # waits-on-theorem, with the label comment's step "Sami starts the automated work on this item again by hand",
          # then a hold comment that says so and names the head, in the place of the newest hold comment of that work
          # (works), and never of a hold of other work, which the schedule still takes again. That hold stops each later
          # try of the head, and no other reason takes the head in this run (taken). This run fails for it.
          head_stopped() {
            local id title text of=catchup commit="the head commit ${head:0:12}"
            taken=1
            case $1 in
              review) of=review title="Automated review held." text="The automated review of $commit did not finish after $2 tries." ;;
              approval)
                of=approve title="Automated approval held."
                text="The automated approval of the checks of $commit did not finish after $2 tries." ;;
              import)
                of=import title="Automated check for the import held."
                text="The automated check of $commit for the import into the internal repository did not finish after $2 tries." ;;
              *)
                title="Automated close and reopen held."
                text="The workflow tried $2 times to close and reopen this pull request so that GitHub starts the checks of $commit. No try finished." ;;
            esac
            echo "::error::#$number at $head: $text It is not tried again, and the label comment names the next step" \
              "for Sami."
            failed=1
            python3 .github/review/rules.py label "$number" tries_used_up=true \
              || { echo "::error::the label of #$number could not be set; the next run tries again."; return 0; }
            id=$(hold_id "$of") || { echo "::error::the comments of #$number could not be read."; return 0; }
            say_held "${id:--}" "$title" "$text The workflow does not try it again." \
              || echo "::error::the hold comment of #$number could not be written; the next run tries again."
          }
          # left_stopped <tries>: the catch-up that closed #number could not reopen it after <tries> runs that only
          # reopen it, and is not tried again: waits-on-theorem, with the label comment's step "Sami reopens the pull
          # request", then a hold comment that says so, in the place of the newest hold comment of a catch-up. That
          # comment ends each later read of the item's runs (gave_up). This run fails for it.
          left_stopped() {
            local id
            echo "::error::#$number: the automated catch-up closed it and could not reopen it after $1 tries: it is not" \
              "tried again, and the label comment names the next step for Sami."
            failed=1
            python3 .github/review/rules.py label "$number" left_closed=true \
              || { echo "::error::the label of #$number could not be set; the next run tries again."; return 0; }
            id=$(hold_id catchup) || { echo "::error::the comments of #$number could not be read."; return 0; }
            say_held "${id:--}" "Automated catch-up held." \
              "The automated catch-up closed this pull request and could not reopen it after $1 tries. The workflow closed it so that GitHub starts its checks." \
              || echo "::error::the hold comment of #$number could not be written; the next run tries again."
          }
          # failures <tasks>: of the runs of the head of #number of a task of <tasks>, newest first, back to the newest
          # whose post job succeeded, how many failed in the post job at a step that is not a sign-in (at most
          # REVIEW_TRIES): each counts a try of the head.
          failures() {
            local n=0 run f post
            while read -r _ _ run; do
              f=$(facts "$run") || { echo "::error::the jobs of run $run could not be read." >&2; return 1; }
              read -r _ _ post _ <<< "$f"
              [ "$post" != success ] || break
              [ "$post" != failure ] || n=$((n + 1))
              (( n < REVIEW_TRIES )) || break
            done < <(runs_of "$1" "$head" | sort -r)
            echo "$n"
          }
          # held_as <work>: the newest hold of <work> on #number, of the holds that consider read (hold, as holds gives
          # them): "<time> <run> <tries> <kind> <task> <comment> <id> <head>", nothing for none.
          held_as() {
            awk -v w="$1" '$1 == w { sub(/^[^ ]+ /, ""); print }' <<< "$hold"
          }
          # due_held: the work that each hold of #number names, labelled review-held, once the hold is over an hour old:
          # the newest hold of its review, of its answer, of its draft and of its approval, each for itself (held_work),
          # so that the hold of one work never keeps the schedule from the hold of another.
          due_held() {
            local work h_at h_origin h_task h_comment tried=""
            for work in review answer draft approve; do
              read -r h_at h_origin _ _ h_task h_comment _ <<< "$(held_as "$work")"
              [[ -n ${h_origin:-} && $h_origin != - ]] || continue
              tried=1
              held_work || return 1
            done
            [ -n "$tried" ] \
              || echo "#$number: no hold that is tried again (the screen held it, or its tries are used up)."
          }
          # held_work: the work of the hold that due_held read (h_at, h_origin, h_task, h_comment), once that hold is
          # over an hour old. It is due while its reason holds (an answer while its comment waits, a draft while none is
          # stored), and while its hold is not settled: the newest run of its task since the hold had no post job that
          # approved held runs or recorded the import check run, and no comment job that posted (its review, its answer
          # or the label comment of its draft; not the comment on a merge conflict). Each other run of its task since
          # the hold is a try that settled nothing (a review's hold is taken again as a rescreen, and counts the
          # rescreens and the reviews), but a run that ended at a failed step whose name starts with "Sign in": that
          # run judged nothing, counts no try, and the work is taken again (D19). After REVIEW_TRIES tries (stopped), or
          # while the newest run of its task is under an hour old, it is not started. retaken holds the task of each
          # hold that this takes, which the other reasons leave to it.
          held_work() {
            local task=$h_task pattern since tries=0 newest="" created run latest="" f who
            local signin="" settled="" early="" commented=""
            retaken+=" $task"
            [[ $h_at =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
              || { echo "::error::#$number: its hold has no time."; return 1; }
            if [[ ! $h_at < $hour ]]; then
              echo "#$number: held at $h_at, less than an hour ago."
              return 0
            fi
            case $task in
              answer)
                if [ "$h_comment" = - ]; then
                  echo "#$number: its hold of an answer names no comment: left alone."
                  retaken=${retaken%" $task"}
                  return 0
                fi
                waits_of || return 1
                if ! grep -q " $h_comment\$" <<< "$waits"; then
                  echo "#$number: comment $h_comment waits for no answer, so its hold is settled."
                  retaken=${retaken%" $task"}
                  return 0
                fi ;;
              draft)
                marks_of || return 1
                if [ -n "$marks" ]; then
                  echo "#$number: its draft is stored, or its reply posted, so its hold is settled."
                  retaken=${retaken%" $task"}
                  return 0
                fi ;;
            esac
            pattern=$task
            [ "$task" != rescreen ] || pattern='rescreen|review'
            since=$(runs_of "$pattern" "" workflow_dispatch | awk -v at="$h_at" '$1 >= at')
            # Each run of the task since the hold, oldest first: the facts of the newest stay, and each run but one that
            # could not sign in counts a try.
            while read -r created _ run; do
              [ -n "${run:-}" ] || continue
              f=$(facts "$run") || { echo "::error::the jobs of run $run could not be read."; return 1; }
              read -r signin _ _ settled early _ commented _ <<< "$f"
              newest=$created latest=$run
              [ "$signin" = signin ] || tries=$((tries + 1))
            done <<< "$since"
            if [ "$settled" = settled ] || { [ "$commented" = success ] && [ "$early" = - ]; }; then
              echo "#$number: run $latest of $task approved the held runs, recorded the import check or posted, so" \
                "its hold is settled."
              retaken=${retaken%" $task"}
              return 0
            fi
            if (( tries >= REVIEW_TRIES )); then
              stopped "$task" "$tries"
              return
            fi
            if [ -n "$latest" ]; then
              # Spaced as the hold's own hour is, so that a short outage of GitHub does not use up the tries.
              if [[ ! $newest < $hour ]]; then
                echo "#$number: $task ran at $newest, less than an hour ago, with no new hold: tried again later."
                return 0
              fi
              if (( tries > 0 )); then
                echo "#$number: $tries runs of $task since its hold settled nothing; trying again."
              else
                echo "#$number: each run of $task since its hold could not sign in, which counts no try; trying again."
              fi
            fi
            who=$(held_account "$h_origin") || { echo "::error::run $h_origin could not be read."; return 1; }
            if [ -z "$who" ]; then
              echo "#$number: its hold names no run whose account this job can tell: left alone."
              retaken=${retaken%" $task"}
              return 0
            fi
            # A rescreen counts on the account that the hold names; an answer, a draft and an approval on the outside
            # author, as the trust job names them.
            case $task in
              rescreen) owe "$h_at" rescreen "$who" "$head" - "held at $h_at, for $who" ;;
              answer) owe "$h_at" answer "$limited" - "$h_comment" "its answer held at $h_at" ;;
              draft) owe "$h_at" draft "$limited" - - "its draft held at $h_at" ;;
              approve) owe "$h_at" approve "$limited" "$head" - "its approval held at $h_at" ;;
            esac
          }
          # answer_stopped <comment> <tries>: the comment job of <tries> answer runs of <comment> failed, so its answer
          # is not tried again: waits-on-theorem, with the label comment's step "Sami starts the automated work on this
          # item again by hand", then a hold comment that says so, in the place of the newest hold comment of an answer.
          # That hold is not tried again, so the comments before it wait for no answer (waiting). This run fails for it.
          answer_stopped() {
            local id what="this issue"
            [ "$kind" != pr ] || what="this pull request"
            echo "::error::#$number: the comment job of $2 answer runs of comment $1 failed: the answer is not tried" \
              "again, and the label comment names the next step for Sami."
            failed=1
            python3 .github/review/rules.py label "$number" tries_used_up=true \
              || { echo "::error::the label of #$number could not be set; the next run tries again."; return 0; }
            id=$(hold_id answer) || { echo "::error::the comments of #$number could not be read."; return 0; }
            say_held "${id:--}" "Automated answer held." "The workflow wrote the automated answer to the author's comment on $what $2 times, and could not post it. The workflow does not try it again. You do not need to do anything." \
              || echo "::error::the hold comment of #$number could not be written; the next run tries again."
          }
          # due_answer: the answer to the newest comment of the author of #number that waits for one (waiting) and is
          # over 15 minutes old, on an issue only after its first reply posted. The newest run that names the comment,
          # of its own event (issue_comment) or by hand, took it, but one that its trust job stopped, and but one that
          # posted nothing of its own: it ended at a failed sign-in, its comment job failed or was cancelled (a GitHub
          # error on the post, say, for which no hold job runs), or its hold job held it. Once for each comment, then
          # once an hour while the newest run of that comment posted nothing so. After REVIEW_TRIES runs of the comment
          # whose comment job failed or was cancelled, the answer is not tried again (answer_stopped): each of them ran
          # the screen and the model. A hold of an answer that is tried again leaves the comments to that hold
          # (due_held), which counts its tries.
          due_answer() {
            local at id runs created ended run f signin early commented held tries=0
            if [ "$kind" = issue ]; then
              marks_of || return 1
              grep -qx replied <<< "$marks" || return 0
            fi
            [[ $retaken != *" answer"* ]] || return 0
            waits_of || return 1
            [ -n "$waits" ] || return 0
            read -r at id <<< "$(awk -v q="$quarter" '$1 < q' <<< "$waits" | tail -n 1)"
            if [ -z "${id:-}" ]; then
              echo "#$number: a comment of $author waits for an answer, and is under 15 minutes old."
              return 0
            fi
            runs=$(awk -v n="$number" -v c="$id" '$7 == n && $8 == "answer" && $10 == c { print $2, $3, $1 }' \
              "$seen/runs" | sort)
            read -r created ended run <<< "$(tail -n 1 <<< "$runs")"
            if [ -n "${run:-}" ]; then
              f=$(facts "$run") || { echo "::error::the jobs of run $run could not be read."; return 1; }
              read -r signin _ _ _ early _ commented held _ <<< "$f"
              if [[ $commented == failure || $commented == cancelled ]]; then
                while read -r _ _ run; do
                  f=$(facts "$run") || { echo "::error::the jobs of run $run could not be read."; return 1; }
                  read -r _ _ _ _ _ _ commented _ <<< "$f"
                  [[ $commented != failure && $commented != cancelled ]] || tries=$((tries + 1))
                done <<< "$runs"
                if (( tries >= REVIEW_TRIES )); then
                  answer_stopped "$id" "$tries"
                  return 0
                fi
              fi
              if (( tries > 0 )) || [[ $signin == signin || $held == held ]]; then
                if [[ ! $ended < $hour ]]; then
                  echo "#$number: run $run of comment $id posted nothing (a failed sign-in, a failed comment job, or a" \
                    "hold), less than an hour ago: tried again later."
                  return 0
                fi
              elif [ "$early" != stopped ]; then
                echo "#$number: run $run took comment $id."
                return 0
              fi
            fi
            owe "$at" answer "$limited" - "$id" "comment $id of $author waits for an answer"
          }
          # due_draft: the draft of the reply to an outside issue whose label comment holds neither a stored draft nor
          # a posted reply, once an hour after its newest draft run (of its issues event, by hand or of this job) ended.
          # Not after a hold that is not tried again (the issue waits on Sami), and not while a hold is tried again
          # (due_held takes it).
          due_draft() {
            local last
            marks_of || return 1
            [ -z "$marks" ] || return 0
            if [ -n "$(awk '$3 == "-"' <<< "$hold")" ]; then
              echo "#$number: its hold is not tried again, so its draft waits on Sami."
              return 0
            fi
            [ -z "$retaken" ] || return 0
            last=$(awk -v n="$number" '$7 == n && (($6 == "workflow_dispatch" && $8 == "draft") || $6 == "issues") {
              print $3 }' "$seen/runs" | sort | tail -n 1)
            if [ -n "$last" ] && [[ ! $last < $hour ]]; then
              echo "#$number: its draft run ended at $last, less than an hour ago: tried again later."
              return 0
            fi
            owe "${last:-$opened}" draft "$limited" - - "no draft of a reply to it is stored"
          }
          # due_approve: the approval of the runs of the head of #number that GitHub holds (status action_required),
          # while no approval run screened the head with a verdict since the newest held run: its screen job passed and
          # its post job did not fail (by the App's retry, one that failed leaves no verdict), or a hold that is not
          # tried again, the newest of its work, names the head. Once an hour after the newest approval run of the head.
          # A post job that failed at a step that is not a sign-in counts a try of the head; after REVIEW_TRIES of them,
          # the head is not tried again (head_stopped). A hold of an approval that is tried again leaves it to that hold
          # (due_held).
          due_approve() {
            local list n last created ended run f screen post tries
            held_of || { echo "::error::the runs of $head could not be read."; return 1; }
            list=$(held_at "$head") || { echo "::error::the runs of $head could not be read."; return 1; }
            n=$(grep -c . <<< "$list" || true)
            (( n > 0 )) || return 0
            last=$(sort <<< "$list" | tail -n 1)
            [[ $retaken != *" approve"* ]] || return 0
            if [ -n "$(awk -v h="$head" -v last="$last" '$3 == "-" && $9 == h && $2 >= last' <<< "$hold")" ]; then
              echo "#$number: a hold that is not tried again names $head."
              return 0
            fi
            read -r created ended run <<< "$(runs_of approve "$head" workflow_dispatch | tail -n 1)"
            if [ -n "${run:-}" ]; then
              if [[ ! $ended < $hour ]]; then
                echo "#$number: approval run $run of $head ended at $ended, less than an hour ago."
                return 0
              fi
              if [[ ! $created < $last ]]; then
                f=$(facts "$run") || { echo "::error::the jobs of run $run could not be read."; return 1; }
                read -r _ screen post _ <<< "$f"
                if [ "$screen" = success ] && [ "$post" != failure ] && [ "$post" != signin ]; then
                  echo "#$number: run $run screened $head with a verdict."
                  return 0
                fi
                if [ "$post" = failure ]; then
                  tries=$(failures approve) || return 1
                  if (( tries >= REVIEW_TRIES )); then
                    head_stopped approval "$tries"
                    return 0
                  fi
                fi
              fi
            fi
            owe "$last" approve "$limited" "$head" - "GitHub holds $n runs of $head"
          }
          # due_retry <tasks> <task> <work>: the App's retry. When the post job of the newest run of the head of #number
          # of a task of <tasks> failed, at a sign-in or at a write of the App, the head is due <task> again, once an
          # hour after that run ended. A post job that failed at a step that is not a sign-in counts a try of the head;
          # after REVIEW_TRIES of them, the automated <work> of the head is not tried again (head_stopped <work>).
          due_retry() {
            local created ended run f post tries
            read -r created ended run <<< "$(runs_of "$1" "$head" | tail -n 1)"
            [ -n "${run:-}" ] || return 0
            f=$(facts "$run") || { echo "::error::the jobs of run $run could not be read."; return 1; }
            read -r _ _ post _ <<< "$f"
            [ "$post" = signin ] || [ "$post" = failure ] || return 0
            if [[ ! $ended < $hour ]]; then
              echo "#$number: the post job of run $run failed, less than an hour ago: tried again later."
              return 0
            fi
            if [ "$post" = failure ]; then
              tries=$(failures "$1") || return 1
              if (( tries >= REVIEW_TRIES )); then
                head_stopped "$3" "$tries"
                return 0
              fi
            fi
            owe "$ended" "$2" "" "$head" - "the post job of run $run failed"
          }
          # merge_of: merge, the mergeable_state of #number, read again once while GitHub has not computed it (its
          # mergeable is null); null when it still has not, and then the head waits for the next run.
          merge_of() {
            local data
            [ -z "$merge" ] || return 0
            for _ in 1 2; do
              data=$(gh api "repos/$REPO/pulls/$number" --jq '"\(.mergeable) \(.mergeable_state // "unknown")"') \
                || { echo "::error::pull request #$number could not be read."; return 1; }
              if [[ $data != null\ * ]]; then
                merge=${data#* }
                return 0
              fi
            done
            merge=null
          }
          # head_of: review, held and conflicted, what the comments of #number say of its head (head_marks), read once.
          head_of() {
            local line
            [ -z "$head_read" ] || return 0
            line=$(head_marks "$number" "$head") \
              || { echo "::error::the comments of #$number could not be read."; return 1; }
            read -r review held conflicted <<< "$line"
            head_read=1
          }
          # ci_head: ci, what the CI runs of the head of #number say (ci_of), read once.
          ci_head() {
            [ -z "$ci_read" ] || return 0
            ci=$(ci_of "$head") || { echo "::error::the CI runs of $head could not be read."; return 1; }
            ci_read=1
          }
          # ci_over: whether the newest CI run of the head ended over an hour ago, with none still to finish (read by
          # ci_head first).
          ci_over() {
            case $ci in
              "") echo "#$number: no CI run of $head ended."; return 1 ;;
              pending) echo "#$number: a CI run of $head has not finished, and its review comes after it."; return 1 ;;
            esac
            [[ ! $ci < $hour ]] || return 0
            echo "#$number: the CI run of $head ended at $ci, less than an hour ago."
            return 1
          }
          # due_conflict: the merge conflict of the head of an outside pull request, decided from the label comment's
          # line <!-- review-conflict-state <head> --> and the mergeable_state that GitHub gives now. A head with a
          # conflict that the line does not name yet: a conflict run, which asks the author to resolve it and gives
          # waits-on-author and the line. A head with the line whose conflict is gone, with no push: a relabel, which
          # sets its label again from what the workflow wrote of it and takes the line out. Each relabel of the head
          # since the line counts: one that its trust job refused is started again at the next run, one that ran an
          # hour after it ended, and after REVIEW_TRIES of them the head is not tried again (head_stopped). While the
          # head has a conflict or the line, or GitHub has not computed its merge state, no other reason takes it
          # (taken).
          due_conflict() {
            local at since tries ended run f early
            merge_of || return 1
            if [ "$merge" = null ]; then
              echo "#$number: GitHub has not computed whether $head has a merge conflict: left for the next run."
              taken=1
              return 0
            fi
            if [ "$conflicted" = false ]; then
              [ "$merge" = dirty ] || return 0
              taken=1
              owe "$opened" conflict "" "$head" - "$head has a merge conflict"
              return 0
            fi
            taken=1
            if [ "$merge" = dirty ]; then
              echo "#$number: $head still has the merge conflict that its label comment names: its author's step."
              return 0
            fi
            at=$(comments "$number" | jq -rs '[.[] | select(.user.login == "github-actions[bot]"
                and ((.body // "") | startswith("<!-- review-label -->"))) | .updated_at // ""] | max // ""') \
              || { echo "::error::the comments of #$number could not be read."; return 1; }
            since=$(runs_of relabel "$head" workflow_dispatch | awk -v at="$at" '$1 >= at')
            tries=$(grep -c . <<< "$since" || true)
            if (( tries >= REVIEW_TRIES )); then
              head_stopped import "$tries"
              return 0
            fi
            if (( tries > 0 )); then
              read -r _ ended run <<< "$(tail -n 1 <<< "$since")"
              f=$(facts "$run") || { echo "::error::the jobs of run $run could not be read."; return 1; }
              read -r _ _ _ _ early _ <<< "$f"
              if [ "$early" != stopped ] && [[ ! $ended < $hour ]]; then
                echo "#$number: relabel run $run of $head ended at $ended, less than an hour ago: tried again later."
                return 0
              fi
            fi
            owe "$opened" relabel "" "$head" - "the merge conflict of $head is gone"
          }
          # due_catchup: the catch-up of an outside pull request whose head no review and no run of this workflow
          # names (no run met it), whose head repository is still there, and whose newest CI run of the head ended over
          # an hour ago, with none still to finish: a catchup run, whose post job closes and reopens it with the OSS
          # Verify App's token. GitHub then starts CI on the head, and the review of that CI run follows. Once for each
          # head: that run names it. A pull request whose head repository is gone is never closed: GitHub cannot
          # reopen it.
          due_catchup() {
            [ "$review" = none ] || return 0
            [ -z "$(runs_of '[a-z]+' "$head")" ] || return 0
            if [ "${pr_repo[$number]:-0}" = 0 ]; then
              echo "#$number: the head repository of $head is gone, so it is not closed."
              return 0
            fi
            ci_head || return 1
            ci_over || return 0
            owe "$ci" catchup "" "$head" - "no run met $head, and its CI run ended at $ci"
          }
          # rerun <run> <facts>: when the screen of <run> passed and its review job then failed at a step whose name
          # starts with "Sign in" (its facts), the failed jobs of <run> run again (rerun-failed-jobs, which this job's
          # actions: write allows): the screen's verdict stands and is paid once, and the review job's Count step counts
          # the run once. Its caller asks only once the run ended over an hour ago, so a run runs again at most once an
          # hour. It fails, and the caller starts a new run, for any other run, for a run at its attempt 51 (50 re-runs,
          # which GitHub allows no more of), and when GitHub refuses the re-run, which stops nothing else of this run.
          # GitHub re-runs no run made over 30 days ago, and this job reads only the runs of the last 8 days. Else taken
          # holds the head for this run.
          rerun() {
            local screen reviewed attempt
            read -r _ screen _ _ _ reviewed _ <<< "$2"
            [ "$screen" = success ] && [ "$reviewed" = signin ] || return 1
            attempt=$(awk -v r="$1" '$1 == r { print $13; exit }' "$seen/runs")
            if [[ ! $attempt =~ ^[1-9][0-9]*$ ]] || (( attempt > 50 )); then
              echo "#$number: run $1 is at attempt ${attempt:-none}, past 50 re-runs: a new run instead."
              return 1
            fi
            if ! gh api --method POST "repos/$REPO/actions/runs/$1/rerun-failed-jobs" > /dev/null; then
              echo "::warning::#$number: GitHub refused to run the failed jobs of run $1 again: a new run instead."
              return 1
            fi
            echo "#$number: the screen of run $1 passed and its review could not sign in: its failed jobs run again."
            taken=1
          }
          # due_old: the review of the head of an outside pull request whose review is in the form of before the move
          # off pull_request_target, and none of now, under the CI conditions of the catch-up: a review run of that
          # head, which reviews it from the API and closes and reopens nothing. Once for each head, and again an hour
          # after each run of it that posted nothing of its own: one that ended at a failed sign-in (the failed jobs of
          # that run when its screen passed and its review could not sign in, by rerun, else a new run), and one whose
          # comment job failed or was cancelled (a GitHub error on the post, say, for which no hold job runs). After
          # REVIEW_TRIES runs of the head whose comment job failed so, the head is not tried again (head_stopped). A
          # hold that is tried again leaves it to that hold.
          due_old() {
            local created ended run f signin commented last="" latest="" known="" tries=0
            [ "$review" = old ] && [ -z "$retaken" ] || return 0
            ci_head || return 1
            ci_over || return 0
            while read -r created ended run; do
              [ -n "${run:-}" ] || continue
              f=$(facts "$run") || { echo "::error::the jobs of run $run could not be read."; return 1; }
              read -r signin _ _ _ _ _ commented _ <<< "$f"
              if [[ $commented == failure || $commented == cancelled ]]; then
                tries=$((tries + 1))
              elif [ "$signin" != signin ]; then
                echo "#$number: run $run took the review of $head."
                return 0
              fi
              last=$ended latest=$run known=$f
            done < <(runs_of review "$head" workflow_dispatch)
            if (( tries >= REVIEW_TRIES )); then
              head_stopped review "$tries"
              return 0
            fi
            if [ -n "$last" ] && [[ ! $last < $hour ]]; then
              echo "#$number: the review run of $head posted no review (a failed sign-in or a failed comment job), less" \
                "than an hour ago: tried again later."
              return 0
            fi
            if [ -n "$latest" ] && rerun "$latest" "$known"; then return 0; fi
            owe "$ci" review "$limited" "$head" - "the review of $head is in the form of before"
          }
          # due_unreviewed: the review of the head of an open pull request into main, a writer's too, that a run of
          # this workflow names and that no review and no hold comment names, with no merge conflict and no CI run of
          # the head still to finish (the review of an approval's CI run comes first). At the next run when each run
          # that named the head stopped at its trust job, gave the task conflict, or was a relabel (a draft marked
          # ready, a base changed to main, a conflict that went away); else once the newest of them ended over an hour
          # ago, as for a run that could not sign in: the failed jobs of that run when its screen passed and its review
          # could not sign in (rerun), else a new run. Not when the post job of that newest run failed: the App's retry
          # takes it. After REVIEW_TRIES review runs by hand of the head that ended with no failed sign-in and gave no
          # conflict, the head is not tried again (head_stopped).
          due_unreviewed() {
            local list created ended run task event f signin post early all=true newest="" last="" tries=0
            local latest="" known=""
            [ -z "$retaken" ] || return 0
            list=$(awk -v n="$number" -v h="$head" '$7 == n && $9 == h { print $2, $3, $1, $8, $6 }' "$seen/runs" \
              | sort)
            [ -n "$list" ] || return 0
            head_of || return 1
            [ "$review" = none ] && [ "$held" = false ] || return 0
            if [ "$outsider" = false ]; then
              [ "$conflicted" = false ] || return 0
              merge_of || return 1
              if [ "$merge" = dirty ] || [ "$merge" = null ]; then
                echo "#$number: $head has a merge conflict, or GitHub has not computed whether it has one."
                return 0
              fi
            fi
            ci_head || return 1
            if [ "$ci" = pending ]; then
              echo "#$number: a CI run of $head has not finished, and its review comes after it."
              return 0
            fi
            while read -r created ended run task event; do
              f=$(facts "$run") || { echo "::error::the jobs of run $run could not be read."; return 1; }
              read -r signin _ post _ early _ <<< "$f"
              newest=$ended last=$post latest=$run known=$f
              [[ $early == stopped || $early == conflict || $task == relabel ]] || all=false
              if [[ $task == review && $event == workflow_dispatch && $signin != signin && $early != conflict ]]; then
                tries=$((tries + 1))
              fi
            done <<< "$list"
            if (( tries >= REVIEW_TRIES )); then
              head_stopped review "$tries"
              return 0
            fi
            if [ "$last" = signin ] || [ "$last" = failure ]; then
              echo "#$number: the post job of the newest run of $head failed: the App's retry takes it."
              return 0
            fi
            if [ "$all" = false ] && [[ ! $newest < $hour ]]; then
              echo "#$number: the newest run of $head ended at $newest with no review, less than an hour ago."
              return 0
            fi
            rerun "$latest" "$known" && return 0
            owe "$newest" review "$limited" "$head" - "the runs of $head ended with no review"
          }
          # due_variable: the value of REPO_PAIRS_IMPORT_PATHS that the workflow recorded for the head of an outside
          # pull request: the newer of the label comment's line <!-- repo-pairs-import-paths <head>: <value> --> and
          # the same line in the output text of the head's check run repo-pairs/import-approved, by the OSS Verify App.
          # When it is not the value now (IMPORT_PATHS, none when empty), or the head has a review of now and neither
          # line: a relabel, which decides R12 again by the value now and sets the label again. Once an hour.
          due_variable() {
            local found checks at value same ended run
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            found=$(comments "$number" | SHA=$head jq -r 'select(.user.login == "github-actions[bot]"
                and ((.body // "") | startswith("<!-- review-label -->")))
              | .updated_at as $at | .body | split("\n")[]
              | capture("^<!-- repo-pairs-import-paths (?<h>[0-9a-f]{40}): (?<v>.*) -->$")
              | select(.h == $ENV.SHA) | "\($at) \(.v)"') \
              || { echo "::error::the comments of #$number could not be read."; return 1; }
            [ -n "$found" ] || [ "$review" = new ] || return 0
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            checks=$(SHA=$head gh api --method GET --paginate "repos/$REPO/commits/$head/check-runs" \
              -f check_name=repo-pairs/import-approved -F per_page=100 --jq '.check_runs[]
                | select(.name == "repo-pairs/import-approved" and .head_sha == $ENV.SHA and .app.id == 5447700)
                | (.completed_at // .started_at // "-") as $at | .output.text // "" | split("\n")[]
                | capture("^<!-- repo-pairs-import-paths (?<h>[0-9a-f]{40}): (?<v>.*) -->$")
                | select(.h == $ENV.SHA) | "\($at) \(.v)"') \
              || { echo "::error::the check runs of $head could not be read."; return 1; }
            read -r at value <<< "$(printf '%s\n%s\n' "$found" "$checks" | awk NF | sort | tail -n 1)"
            if [ -n "${at:-}" ]; then
              same=$(jq -n --arg recorded "$value" --arg now "${IMPORT_PATHS:-}" \
                '($recorded | try fromjson catch {}) == (if $now == "" then null else $now end)') \
                || { echo "::error::the value recorded for $head could not be read."; return 1; }
              [ "$same" != true ] || return 0
            fi
            read -r _ ended run <<< "$(runs_of relabel "$head" workflow_dispatch | tail -n 1)"
            if [ -n "${run:-}" ] && [[ ! $ended < $hour ]]; then
              echo "#$number: relabel run $run of $head ended at $ended, less than an hour ago: tried again later."
              return 0
            fi
            owe "${at:-$opened}" relabel "" "$head" - \
              "the value of REPO_PAIRS_IMPORT_PATHS recorded for $head is not the value now"
          }
          # consider: the runs that #number is due, by each reason above (due_*), in order. A writer's pull request
          # gets only the work that its holds name and the review of a head that a run left with no review. A read
          # that fails for it leaves it for the next run, and this run fails at its end. Once a reason took the head
          # (taken), no later one takes it in this run. hold is the newest hold of each work of the item (holds).
          consider() {
            local head="" outsider=false limited="" hold=""
            local retaken="" waits="" waits_read="" marks="" marks_read="" taken="" reason
            local review=none held=false conflicted=false head_read="" merge="" ci="" ci_read=""
            if [ "$draft" != false ]; then
              echo "#$number: a draft, of which the trust job takes no run."
              return 0
            fi
            if [ "$kind" = pr ]; then
              head=${pr_head[$number]:-}
              if [ -z "$head" ]; then
                echo "#$number: not in the list of open pull requests: left for the next run."
                return 0
              fi
              if [ "${pr_draft[$number]}" != false ]; then
                echo "#$number: a draft, of which the trust job takes no run."
                return 0
              fi
              if [ "${pr_base[$number]}" != main ]; then
                echo "#$number: into ${pr_base[$number]}, not main."
                return 0
              fi
            fi
            if [ -n "${running[$number]:-}" ]; then
              echo "#$number: a run of it has not finished."
              return 0
            fi
            access_of "$author" || return 1
            if (( ${access[$author]} != 0 )); then outsider=true limited=$author; fi
            [ "$labelled" = true ] || [ "$outsider" = true ] || [ "$kind" = pr ] || return 0
            if [ "$labelled" = true ] || [ "$outsider" = true ]; then
              hold=$(holds "$number") || { echo "::error::the comments of #$number could not be read."; return 1; }
            fi
            if [ "$labelled" = true ]; then due_held || return 1; fi
            if [ "$outsider" = false ]; then
              [ "$kind" = pr ] || return 0
              due_unreviewed
              return
            fi
            due_answer || return 1
            if [ "$kind" = issue ]; then
              due_draft || return 1
              return 0
            fi
            due_approve || return 1
            [ -z "$taken" ] || return 0
            head_of || return 1
            due_conflict || return 1
            [ -z "$taken" ] || return 0
            if [ -n "$(awk -v h="$head" '$3 == "-" && $9 == h' <<< "$hold")" ]; then
              echo "#$number: a hold that is not tried again names $head: the App's writes of it are not tried again."
              return 0
            fi
            for reason in catchup old unreviewed variable; do
              "due_$reason" || return 1
              [ -z "$taken" ] || return 0
            done
            due_retry 'review|rescreen|relabel' relabel import || return 1
            [ -z "$taken" ] || return 0
            due_retry catchup catchup catchup || return 1
          }
          # consider_closed: a catch-up left closed, the one closed item that this job takes: #number, a pull request
          # of an outside author that is not merged, whose newest close (at and by, of the list of the closed pull
          # requests) is oss-verify[bot]'s and falls between the start and the end of a catchup run of it whose post job
          # failed or was cancelled (the closing run), as the trust job tells it (left_closed). Its runs by hand are
          # read back to the day before the close. It is due a catchup run, which only reopens it, once an hour after
          # the newest catchup run of it ended. Each catchup run since the closing run counts, whatever its outcome, but
          # one that failed at a sign-in: after REVIEW_TRIES of them it is not tried again (left_stopped), and nothing
          # more of it is read (gave_up).
          consider_closed() {
            local head="" given closing="" made="" created ended run started f post count=0 newest=""
            if [ -n "${running[$number]:-}" ]; then
              echo "#$number: a run of it has not finished."
              return 0
            fi
            access_of "$author" || return 1
            (( ${access[$author]} != 0 )) || return 0
            [ "${by:-}" = 'oss-verify[bot]' ] || return 0
            [[ ${at:-} =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || return 0
            given=$(gave_up "$number") || { echo "::error::the comments of #$number could not be read."; return 1; }
            if [ "$given" = true ]; then
              echo "#$number: the catch-up closed it and could not reopen it: Sami reopens it."
              return 0
            fi
            reach "$(date -u -d "${at:0:10} -1 day" +%Y-%m-%d)" || return 1
            while read -r created ended run started; do
              [[ ! $at < $started ]] || continue
              [ "$ended" = - ] || [[ ! $ended < $at ]] || continue
              f=$(facts "$run") || { echo "::error::the jobs of run $run could not be read."; return 1; }
              read -r _ _ post _ <<< "$f"
              case $post in
                failure|signin|cancelled) closing=$run made=$created; break ;;
              esac
            done < <(awk -v n="$number" '$6 == "workflow_dispatch" && $7 == n && $8 == "catchup" {
              print $2, $3, $1, $12 }' "$seen/runs" | sort)
            [ -n "$closing" ] || return 0
            while read -r created ended run; do
              [[ ! $created < $made ]] || continue
              newest=$ended
              [ "$run" != "$closing" ] || continue
              f=$(facts "$run") || { echo "::error::the jobs of run $run could not be read."; return 1; }
              [ "${f%% *}" = signin ] || count=$((count + 1))
            done < <(runs_of catchup "" workflow_dispatch)
            head=$(gh api "repos/$REPO/pulls/$number" --jq .head.sha) \
              || { echo "::error::pull request #$number could not be read."; return 1; }
            [[ $head =~ ^[0-9a-f]{40}$ ]] || { echo "::error::pull request #$number names no head commit."; return 1; }
            if (( count >= REVIEW_TRIES )); then
              left_stopped "$count"
              return 0
            fi
            if [[ ! $newest < $hour ]]; then
              echo "#$number: catch-up run of it ended at $newest, less than an hour ago: tried again later."
              return 0
            fi
            owe "$at" catchup "" "$head" - "a catch-up closed it at $at and did not reopen it"
          }
          # The open pull requests and issues, each with its kind, whether it is a draft or labelled review-held, when
          # it was opened, and its author.
          # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
          items=$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100" --jq '.[] | select(.state == "open")
            | [.number, (if .pull_request then "pr" else "issue" end), (.draft // false),
               any(.labels[]?; .name == $ENV.HELD_LABEL), (.created_at // "-"), (.user.login // "")]
            | map(tostring) | join(" ")') \
            || { echo "::error::the open pull requests and issues could not be read."; exit 1; }
          while read -r number kind draft labelled opened author; do
            [ -n "${number:-}" ] || continue
            [[ $number =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $number"; failed=1; continue; }
            if [ -z "${author:-}" ]; then
              echo "#$number: GitHub names no author of it: left alone."
              continue
            fi
            consider || failed=1
          done <<< "$items"
          # The closed pull requests that are not merged, each with its author and its newest close, when and by whom,
          # - for none, in one GraphQL query: a catch-up left closed among them is due its reopen (consider_closed).
          # GraphQL names an App <name>, and login gives it as <name>[bot], as the REST API names it. A list that cannot
          # be read leaves them for the next run.
          # shellcheck disable=SC2016 # $owner, $name and $endCursor are GraphQL's
          closed=$(gh api graphql --paginate -f owner="${REPO%%/*}" -f name="${REPO#*/}" -f query='
            query($owner: String!, $name: String!, $endCursor: String) {
              repository(owner: $owner, name: $name) {
                pullRequests(states: CLOSED, first: 100, after: $endCursor) {
                  nodes {
                    number
                    author { __typename login }
                    timelineItems(itemTypes: [CLOSED_EVENT], last: 1) {
                      nodes { ... on ClosedEvent { createdAt actor { __typename login } } }
                    }
                  }
                  pageInfo { hasNextPage endCursor }
                }
              }
            }' --jq 'def login: if .__typename == "Bot" then .login + "[bot]" else .login end;
              .data.repository.pullRequests.nodes[] | (.timelineItems.nodes[0] // {}) as $close
              | "\(.number) \(.author // {} | login // "-") \($close.createdAt // "-")"
                + " \($close.actor // {} | login // "-")"') \
            || { echo "::error::the closed pull requests could not be read."; closed="" failed=1; }
          while read -r number author at by; do
            [[ ${number:-} =~ ^[1-9][0-9]*$ && ${author:--} != - ]] || continue
            consider_closed || failed=1
          done <<< "$closed"
          # The runs due, oldest reason first. A run that screens counts toward the limit of the account that its name
          # ends with: at OUTSIDE_HOURLY_LIMIT runs of the last hour, the next one of that account waits for a later run
          # of this job.
          while read -r at number task account head comment why; do
            [ "$account" != - ] || account=""
            [ "$head" != - ] || head=""
            [ "$comment" != - ] || comment=""
            if [ -n "$account" ]; then
              pace "$account" || { failed=1; continue; }
              if (( ${used[$account]} >= OUTSIDE_HOURLY_LIMIT )); then
                echo "#$number waits: $account had ${used[$account]} runs that screen in the last hour, the limit is" \
                  "$OUTSIDE_HOURLY_LIMIT."
                continue
              fi
            fi
            if gh api --method POST "repos/$REPO/actions/workflows/review.yml/dispatches" -f ref=main \
                -f "inputs[number]=$number" -f "inputs[task]=$task" -f "inputs[account]=$account" \
                -f "inputs[head]=$head" -f "inputs[comment]=$comment" > /dev/null; then
              [ -z "$account" ] || used[$account]=$(( ${used[$account]} + 1 ))
              echo "#$number: started $task ($why, since $at)."
            else
              echo "::error::the run of $task for #$number could not be started."
              failed=1
            fi
          done < <(sort "$seen/due")
          exit "$failed"
