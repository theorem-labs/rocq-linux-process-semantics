# review.yml: Claude reviews pull requests into main and issues by the rules in .github/review.md, and the review is
# posted as a comment there.
#
# Whose pull requests and issues are reviewed, and who goes first. A pull request or an issue is considered when it is
# opened (and a pull request again at each push). Write access is what GitHub's collaborator permission API answers:
# admin or write (maintain counts as write). Membership of the organisation alone is not write access. The Apps in APPS
# count as having it.
#
# - When its author has write access, and so does the account whose action started the run, it is reviewed.
# - Otherwise it is screened first (the screen job, .github/screen.py). Independent checks read the text that the
#   account wrote: Google Cloud Model Armor's prompt injection and jailbreak filter, always; Azure AI Content Safety's
#   Prompt Shields, and a small Claude model with no tools whose answer a schema holds to the words clean and
#   suspicious, each when its identity is set up below. When every check that ran answers clean it is reviewed, as a
#   writer's is, and the review's comment names the checks that ran. Otherwise, and when a check that ran cannot
#   answer, it is held: it gets the label review-held and a short comment, and no review, and a person decides. Why it
#   was held goes to a private bucket, never to this run's log or outputs. When the account that started the run has
#   no write access and its events have reached the screen OUTSIDE_HOURLY_LIMIT times in the last hour, it is held
#   without a screen, and screened again later with no person (below).
# - An item held for a reason that is not its own is screened again with no person: at that limit; a screened review
#   stopped at SCREENED_HOURLY_CAP; or a screened review that failed or ran out of time, until it has failed
#   REVIEW_TRIES times. Every 15 minutes (the schedule below) the rescreen job lists the open pull requests and issues
#   labelled review-held whose newest hold comment is such a hold, not the screen's, and is over an hour old, and
#   starts this workflow for each with -f rescreen=true and the account the hold names (-f account=<login>). Such a run
#   takes an outsider's path: the trust job reads the author, the hold and the account again from the API, never from
#   the inputs alone, and the item is screened, then reviewed and the review posted, as for an event; only when the
#   author and that account both have write access is it reviewed without the screen, as a writer's item is. When
#   that account has no write access, its screen counts toward the account's OUTSIDE_HOURLY_LIMIT with the account's
#   own events, so an account still at the limit stays held, and its hold comment says from when it is tried again. A
#   writer's account has no such limit: its rescreens are bounded by the rescreen job's count alone (below). An item
#   that the screen held is never screened again this way: a person decides.
# - A maintainer can ask for the review of any pull request or issue, without the screen or, with -f screen=true, after
#   it:
#
#   gh workflow run review.yml -R theorem-labs/rocq-linux-process-semantics -f number=<n>
#
# or "Run workflow" on this workflow's page in the Actions tab. GitHub lets only an account with write access start a
# run that way. Every review reads the comments and reviews of the author and of accounts with write access, and no
# others.
#
# - A maintainer can measure the screen: -f measure=true, with no number, runs every listed check three times
#   (-f measure_repeats=<1-5>) on each text of a labelled set kept in the private bucket (-f measure_set=
#   measure/set-v<n>.json, by default measure/set-v1.json), and puts the false holds and missed injections of each
#   rule of SCREEN_RULE's choices in the run's summary. The texts, and each check's words for
#   them, stay in the bucket.
#
#   trust   decides the route: review, screen, or held at the limit. It checks nothing out, and its token can only read
#           metadata, the pull request or issue, and this workflow's runs.
#   gather  reads the pull request or the issue as data into .review/, and keeps it as this run's artifact, which the
#           screen job and the review job both take, by its SHA-256: the review reads what the screen passed. Its
#           token can only read, and it holds no model.
#   screen  runs in the environment review-screen. Its identity token is exchanged for short-lived tokens, which only
#           a job in that environment can get, and for Google Cloud and Anthropic only a job of this file on main:
#           Google Cloud (Model Armor, and adding the reason to its bucket), Azure (Prompt Shields) and Anthropic (a
#           service account of its own, not the review's). SCREEN_CHECKS names the checks that run. Its GitHub token
#           can only read, and no key is stored. The checks get the text as data, and each answers a word; none
#           can act on it. Its outputs are the verdict and the names of the checks that ran.
#   review  reads .review/, with this repository's main and the Linux and QEMU source the model describes, and asks
#           Claude for the comment. It holds an identity token, which Anthropic exchanges for a short-lived token that
#           can call Claude and nothing else; no key is stored. Anthropic's federation rule admits this file alone, on
#           refs/heads/main, for the events pull_request_target, issues and workflow_dispatch (a rescreen is one), and
#           refuses a job in review-screen, so the screen job cannot get the review's Claude token. The review job
#           cannot get the screen's tokens either: they need the environment.
#   post    posts that comment, or replaces the one it posted before, when POST_REVIEW says so, and takes the label
#           review-held off.
#   hold    labels a held pull request or issue review-held and says so in a comment. It holds no model, and has no
#           reason to read: the screen job's outputs are its verdict and the names of the checks that ran.
#   rescreen
#           runs on the schedule alone, in the public repository alone, and starts the runs that screen a held item
#           again. It is the only job with actions: write, which it needs to start a run; it reads the held items and
#           this workflow's runs, checks nothing out and holds no model.
#
# No job runs code of a pull request. pull_request_target runs this file as main has it, so a pull request, from a fork
# or not, cannot change what runs here. The gather job checks out main, never the pull request; it reads the pull
# request's diff and files from git objects as data under .review/, with every CLAUDE.md, AGENTS.md and .claude/ taken
# out. Claude gets the tools Read, Glob and Grep only, in the permission mode dontAsk (a call that would need approval
# is refused), and reads nothing outside the checkout: not the runner's temporary files, which hold the identity
# token, the Claude token and git's own files, nor /proc. It can run nothing and write nothing. The screen job runs
# only .github/screen.py from main. The post and hold jobs check out nothing.
#
# From 2 December 2026 GitHub blocks pull_request_target in a public repository unless an Actions event policy allows
# it. This file needs a repository policy that targets the workflow path .github/workflows/review.yml and allows the
# events pull_request_target, issues, workflow_dispatch and schedule, and lets github-actions[bot] start a run (the
# rescreen job's dispatch). Without it, a pull request is reviewed only when someone with write access asks for it,
# and an item held for a reason not its own is not screened again.
#
# Never re-run this workflow with debug logging. A debug run prints the whole conversation with the model, with the
# pull request's or the issue's text, in the run's log, and anyone can read the logs of a public repository.
name: review
run-name: >-
  ${{ github.event_name == 'schedule' && 'rescreen the held items'
  || inputs.measure && 'measure the screen'
  || inputs.rescreen && format('rescreen #{0} of {1}', inputs.number, inputs.account)
  || format('review #{0}', github.event.pull_request.number || github.event.issue.number || inputs.number) }}

on:
  pull_request_target:
    branches: [main]
    # edited for a pull request retargeted to main; the job runs on it only when the base changed.
    types: [opened, reopened, synchronize, ready_for_review, edited]
  issues:
    types: [opened, reopened]
  # The rescreen job's own minutes, off the hour: :07, :22, :37 and :52.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      number:
        description: Number of the pull request or issue to review (none when measuring)
        required: false
        type: number
      screen:
        description: Screen it first, as the pull request or issue of an account without write access is screened
        type: boolean
        default: false
      measure:
        description: Measure the screen's rules on its private labelled set, and review nothing
        type: boolean
        default: false
      measure_set:
        description: The labelled set to measure on, an object of the private bucket (measure/set-v<n>.json)
        type: string
        default: measure/set-v1.json
      measure_repeats:
        description: How many times each check answers each text of the set
        type: number
        default: 3
      rescreen:
        description: Screen again an item held for a reason not its own (the rescreen job sets it; the trust job checks the hold)
        type: boolean
        default: false
      account:
        description: With rescreen, the account whose event the item's hold names
        type: string
        default: ""

permissions: {}

env:
  # This repository's decision: "true" posts each review as a comment on its pull request or issue; any other value
  # keeps it in the run's summary only.
  POST_REVIEW: "true"
  # The Apps that count as having write access: this organisation's own. The Review step admits no other App, except
  # an App whose pull request or issue the screen passed, and github-actions[bot] for a rescreen the trust job accepted.
  APPS: "sjawhar-agent[bot],oss-verify[bot]"
  # The most reviews that may call the model in one hour. An agent of ours can open many pull requests at once, and
  # the screen passes others', so a burst must not start model runs without limit. A run at the cap stops before the
  # model, and the run is red; a maintainer can re-run it once the hour has passed. A run that the trust job stops, or
  # that the screen holds, never counts. The reviews of screened items count toward SCREENED_HOURLY_CAP instead.
  HOURLY_CAP: "10"
  # The same cap for the reviews of screened pull requests and issues, counted apart, so that accounts without write
  # access cannot use up HOURLY_CAP. A screened run at this cap is held. It is above OUTSIDE_HOURLY_LIMIT, so one
  # account cannot fill it alone; several new accounts together still can, and then the others' items are held.
  SCREENED_HOURLY_CAP: "6"
  # The most runs that one account without write access may start in an hour and have screened: its next pull request,
  # issue or push in that hour is held without a screen. Every run its event started that the trust job did not skip
  # counts, the held ones too, so a burst stays held until an hour has passed since its runs.
  # The rescreens of its held items count toward the same limit, with its events: so N, the most rescreens of one
  # account that are screened in an hour, is this number, 3, less what its own events used. (The rescreen job starts
  # up to 3 an hour whatever its events used, and the trust job holds the extra ones at the limit.) One count and one
  # limit, because a rescreen is the screen that the held event did not get: it gives an account no more screens an
  # hour than its events alone could, which keeps it under SCREENED_HOURLY_CAP, so one account cannot fill that pool. A
  # smaller N for rescreens would only leave a burst held for longer; an account that keeps opening, pushing or
  # reopening stays held. An account with write access has no such limit (a writer's push to an outsider's item, whose
  # cap or transient hold names the writer's run): the rescreen job still starts at most this number of its rescreens
  # an hour.
  OUTSIDE_HOURLY_LIMIT: "3"
  # The label a held pull request or issue gets, and the marker of the comment that says so.
  HELD_LABEL: review-held
  # The most times the review of a screened item that the screen passed may fail, or run out of time, before a person
  # decides: each such hold is tried again with no person (the rescreen job), and the third one is not. A review stopped
  # at SCREENED_HOURLY_CAP is not such a failure, and is tried again whatever this number: the cap is not the item's.
  REVIEW_TRIES: "3"

jobs:
  # A draft pull request is not considered (ready_for_review starts it), nor an edit of a pull request that left its
  # base as it was, nor anything in a fork of this repository. A scheduled run is the rescreen job's alone.
  trust:
    if: >-
      github.repository_id == 1425819621 && github.event_name != 'schedule'
      && (github.event_name != 'pull_request_target' || (!github.event.pull_request.draft
          && (github.event.action != 'edited' || github.event.changes.base != null)))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions: read for OUTSIDE_HOURLY_LIMIT, which reads this workflow's runs; issues and pull-requests: read for a
    # rescreen, which reads the item and its hold comment again.
    permissions: {actions: read, issues: read, pull-requests: read}
    outputs:
      route: ${{ steps.trust.outputs.route }}
      outsider: ${{ steps.trust.outputs.outsider }}
      number: ${{ steps.trust.outputs.number }}
      started: ${{ steps.trust.outputs.started }}
      # true for a rescreen that the trust job accepted; the Review step then admits github-actions[bot], the account
      # that the rescreen job's dispatch makes the run's actor.
      rescreen: ${{ steps.trust.outputs.rescreen }}
      # The run whose event this item's hold names (a hold that is tried again), and the screened reviews of the item
      # that failed so far, which a hold of a review that did not finish counts on.
      origin: ${{ steps.trust.outputs.origin }}
      tries: ${{ steps.trust.outputs.tries }}
    steps:
      - name: Whether the author and the account that started the run have write access
        id: trust
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.number }}
          AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
          ACTOR: ${{ github.actor }}
          SCREEN: ${{ inputs.screen }}
          MEASURE: ${{ inputs.measure }}
          RESCREEN: ${{ inputs.rescreen }}
          ACCOUNT: ${{ inputs.account }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # trusted
          # trusted <login>: 0 when <login> is one of the APPS, or an account that GitHub's collaborator permission API
          # gives admin or write; 1 when it is neither; 2 when the API could not say.
          trusted() {
            local permission
            [[ $1 =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || return 1
            [[ ,$APPS, != *",$1,"* ]] || return 0
            [[ $1 != *'[bot]' ]] || return 1
            permission=$(gh api "repos/$REPO/collaborators/$1/permission" --jq .permission) || return 2
            [[ $permission == admin || $permission == write ]]
          }
          # end of trusted
          # known <login>: trusted's answer, 0 or 1; the run stops when GitHub could not say.
          known() {
            local rc=0
            trusted "$1" || rc=$?
            (( rc != 2 )) || { echo "::error::GitHub did not say whether $1 has write access. Re-run this run."; exit 1; }
            return "$rc"
          }
          # held
          # limit_hold <number>: "<time> <run> <tries> <kind>" of the newest hold comment of <number> when it is one
          # that the rescreen job tries again (its marker <!-- review-held-<kind> <run> <tries> -->): <kind> is limit
          # (OUTSIDE_HOURLY_LIMIT), cap (SCREENED_HOURLY_CAP) or transient (a screened review that failed or ran out of
          # time), <run> the run of the event this hold comes from (a rescreen keeps it), and <tries> the screened
          # reviews of it that failed so far.
          # "<time> -" when the screen held it, or a person decides. Nothing when it has no hold comment. Only
          # github-actions[bot]'s comments count.
          limit_hold() {
            gh api --paginate "repos/$REPO/issues/$1/comments" --jq '.[]
              | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- review-held -->")))
              | "\(.updated_at) \((.body
                  | capture("\n<!-- review-held-(?<kind>limit|cap|transient) (?<run>[0-9]+)(?: (?<tries>[0-9]+))? -->(\n|$)")
                  | "\(.run) \(.tries // "0") \(.kind)") // "-")"' \
              | sort | tail -n 1
          }
          # held_account <run>: the account that started <run>, when <run> is a run of this workflow that a pull
          # request's or an issue's event started; nothing when it is not, or when GitHub no longer has it (a deleted
          # or expired run: a person decides). It fails when GitHub could not say.
          held_account() {
            local workflow run id event login
            [[ $1 =~ ^[1-9][0-9]*$ ]] || return 0
            workflow=$(gh api "repos/$REPO/actions/workflows/review.yml" --jq .id) || return 1
            run=$(gh api "repos/$REPO/actions/runs/$1" --jq '"\(.workflow_id) \(.event) \(.actor.login)"' 2>&1) \
              || { [[ $run == *"(HTTP 404)"* ]] || return 1; return 0; }
            read -r id event login <<< "$run"
            [[ $id == "$workflow" && ($event == pull_request_target || $event == issues) \
               && $login =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || return 0
            echo "$login"
          }
          # end of held
          # earlier <login>: sets count to how many runs of this workflow in the last hour, before this run, the trust
          # job did not skip and either <login> started by an event, or screened again an item whose hold names an
          # event of <login> (a rescreen, whose name, which its trust job checks, ends with the account). A run whose
          # trust job is not listed yet counts. A rescreen that its trust job refused (the item closed, or lost its
          # label, in between), so that every other job of it was skipped, screened nothing and does not count. The
          # rescreen job, which every dispatched run skips, is not one of those jobs: a rescreen whose trust job has
          # just accepted it and whose next jobs are not listed yet counts. The run stops when GitHub could not say.
          earlier() {
            local from runs id kind verdict
            count=0
            from=$(date -u -d '-1 hour' +%Y-%m-%dT%H:%M:%SZ)
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            runs=$(LOGIN=$1 gh api --method GET --paginate "repos/$REPO/actions/workflows/review.yml/runs" \
              -f created=">=$from" -F per_page=100 --jq '.workflow_runs[] | (.display_title // "") as $title
                | select(.id < ($ENV.RUN_ID | tonumber)
                         and ((.actor.login == $ENV.LOGIN and (.event == "pull_request_target" or .event == "issues"))
                              or (.event == "workflow_dispatch"
                                  and ($title | test("^rescreen #[0-9]+ of [A-Za-z0-9-]+(\\[bot\\])?$"))
                                  and ($title | endswith(" of " + $ENV.LOGIN)))))
                | "\(.id) \(if .event == "workflow_dispatch" then "rescreen" else "event" end)"') \
              || { echo "::error::the runs of this workflow could not be read. Re-run this run."; exit 1; }
            while read -r id kind; do
              [ -n "$id" ] || continue
              [[ $id =~ ^[0-9]+$ ]] || { echo "::error::a run id is not a number. Re-run this run."; exit 1; }
              # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
              verdict=$(KIND=$kind gh api --method GET --paginate "repos/$REPO/actions/runs/$id/jobs" -F per_page=100 \
                --jq '([.jobs[] | select(.name == "trust")] | first) as $t
                  | [.jobs[] | select(.name != "trust" and .name != "rescreen")] as $rest
                  | if $t == null then "count" elif $t.conclusion == "skipped" then "skip"
                    elif $ENV.KIND == "rescreen" and $t.status == "completed" and ($rest | length) > 0
                         and ($rest | all(.conclusion == "skipped")) then "skip"
                    else "count" end') \
                || { echo "::error::the jobs of run $id could not be read. Re-run this run."; exit 1; }
              if [[ $verdict == *count* ]]; then count=$((count + 1)); fi
            done <<< "$runs"
          }
          # origin: the run whose event this item's hold names, for a hold that is tried again; tries: the screened
          # reviews of the item that failed so far, which a rescreen carries from its hold to the next.
          rescreen=false origin="" tries=0
          route() {
            echo "Route of #$NUMBER: $1."
            { echo "route=$1"; echo "outsider=$2"; echo "number=$NUMBER"; echo "rescreen=$rescreen"; echo "origin=$origin"
              echo "tries=$tries"; echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; } >> "$GITHUB_OUTPUT"
            exit 0
          }
          # A measurement of the screen, by hand, reads no pull request or issue (the screen job's Measure step).
          if [[ $EVENT == workflow_dispatch && $MEASURE == true ]]; then
            if [[ $ACTOR == *'[bot]' ]]; then
              known "$ACTOR" || { echo "::notice::No measurement: the App that started this run ($ACTOR) is not one" \
                "of the APPS."; exit 0; }
            fi
            NUMBER=""
            route measure ""
          fi
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          [[ $OUTSIDE_HOURLY_LIMIT =~ ^[1-9][0-9]*$ ]] || { echo "::error::OUTSIDE_HOURLY_LIMIT is not a number"; exit 1; }
          [[ $RUN_ID =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a run id: $RUN_ID"; exit 1; }
          case $EVENT in
            pull_request_target|issues)
              author=0 actor=0
              known "$AUTHOR" || author=$?
              known "$ACTOR" || actor=$?
              (( author != 0 || actor != 0 )) || route review ""
              # The account without write access whose action the action checks: the account that started the run,
              # or else the author.
              outsider=$AUTHOR
              (( actor == 0 )) || outsider=$ACTOR
              [[ $outsider =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] \
                || { echo "::notice::No review of #$NUMBER: $outsider is not a GitHub login."; exit 0; }
              echo "::notice::#$NUMBER is screened first: $outsider has no write access. A maintainer can ask for" \
                "the review without it: gh workflow run review.yml -R $REPO -f number=$NUMBER"
              # The limit is the account's that started the run; a writer's action on an outsider's item has none.
              # This run is the one a hold of it names: at the limit, or of a screened review that does not finish.
              origin=$RUN_ID
              if (( actor != 0 )); then
                earlier "$ACTOR"
                (( count < OUTSIDE_HOURLY_LIMIT )) || route limit "$outsider"
              fi
              route screen "$outsider" ;;
            # GitHub lets only an account with write access start a run by hand; an App must be one of the APPS, as the
            # Review step's allowed_bots says. A rescreen may come from github-actions[bot] too: a dispatch made with the
            # token of a job of this repository given actions: write, which the rescreen job is. Whoever started it, a
            # rescreen is checked against the hold, screened unless both accounts are writers, and, for an account
            # without write access, counted.
            workflow_dispatch)
              if [[ $ACTOR == *'[bot]' && ! ($RESCREEN == true && $ACTOR == 'github-actions[bot]') ]]; then
                known "$ACTOR" || { echo "::notice::No review of #$NUMBER: the App that started this run ($ACTOR)" \
                  "is not one of the APPS."; exit 0; }
              fi
              if [ "$RESCREEN" = true ]; then
                # A held item screened again: an outsider's path, decided from what the API says now, never a
                # maintainer's request. The item must be open and held, its newest hold must be one that is tried again
                # (at the limit, at the cap, or a review that did not finish), and the run that hold names must be an
                # event's of this workflow, whose account is the one the inputs give.
                rescreen=true
                stop() { echo "::notice::No rescreen of #$NUMBER: $1"; exit 0; }
                # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
                item=$(gh api "repos/$REPO/issues/$NUMBER" --jq '[.state, .user.login, ((.draft // false) | tostring),
                  (any(.labels[]?; .name == $ENV.HELD_LABEL) | tostring)] | join(" ")') \
                  || { echo "::error::#$NUMBER could not be read. Re-run this run."; exit 1; }
                read -r state AUTHOR draft labelled <<< "$item"
                [ "$state" = open ] || stop "it is $state."
                [ "$draft" = false ] || stop "it is a draft."
                [ "$labelled" = true ] || stop "it is not labelled $HELD_LABEL."
                hold=$(limit_hold "$NUMBER") || { echo "::error::the comments of #$NUMBER could not be read. Re-run this run."; exit 1; }
                read -r _ origin tries _ <<< "$hold"
                [[ -n $origin && $origin != - ]] || stop "it has no hold that is tried again: the screen held it, or a person decides."
                [[ $tries =~ ^[0-9]+$ ]] || stop "its hold names no count of tries."
                account=$(held_account "$origin") || { echo "::error::run $origin could not be read. Re-run this run."; exit 1; }
                [ -n "$account" ] || stop "its hold names no run of this workflow's events."
                [ "$ACCOUNT" = "$account" ] || stop "the account its hold names is $account, not ${ACCOUNT:-none}."
                author=0 actor=0
                known "$AUTHOR" || author=$?
                known "$account" || actor=$?
                # A writer's item whose hold names a writer's event (at the cap, or a review that did not finish):
                # reviewed without the screen.
                (( author != 0 || actor != 0 )) || route review ""
                outsider=$AUTHOR
                (( actor == 0 )) || outsider=$account
                [[ $outsider =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || stop "$outsider is not a GitHub login."
                if (( actor != 0 )); then
                  earlier "$account"
                  (( count < OUTSIDE_HOURLY_LIMIT )) || route limit "$outsider"
                fi
                route screen "$outsider"
              fi
              [ "$SCREEN" != true ] || route screen ""
              route review "" ;;
            *) echo "::error::not an event of this workflow: $EVENT"; exit 1 ;;
          esac

  # Data only: nothing gathered here runs, and this job holds no model. The pull request's files come from git objects
  # (git diff, git cat-file), never from a checkout, so no attribute, filter or hook of the pull request applies. What
  # .review/ leaves out is listed in omitted.txt. It is kept as one tar file, so that no file name of the pull request
  # can stop the upload, for a day, and the screen and review jobs take it by its SHA-256.
  gather:
    needs: trust
    if: needs.trust.outputs.route == 'review' || needs.trust.outputs.route == 'screen'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {contents: read, pull-requests: read, issues: read, checks: read, statuses: read}
    outputs:
      kind: ${{ steps.what.outputs.kind }}
      number: ${{ steps.what.outputs.number }}
      digest: ${{ steps.keep.outputs.digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with: {persist-credentials: false, fetch-depth: 0}

      - name: What to review
        id: what
        env:
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ needs.trust.outputs.number }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          case $EVENT in
            pull_request_target) kind="pr" ;;
            issues) kind="issue" ;;
            *) kind=$(gh api "repos/$REPO/issues/$NUMBER" --jq 'if .pull_request then "pr" else "issue" end') ;;
          esac
          echo "Reviewing $kind #$NUMBER."
          { echo "kind=$kind"; echo "number=$NUMBER"; } >> "$GITHUB_OUTPUT"

      - name: Gather the pull request or issue
        id: gather
        env:
          KIND: ${{ steps.what.outputs.kind }}
          NUMBER: ${{ steps.what.outputs.number }}
          # The head the event is about. When the pull request has moved on, a newer push started its own run, which
          # the trust job judged by that push's account: this run gathers nothing, and so neither screens nor reviews.
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          out=.review
          mkdir -p "$out"
          : > "$out/omitted.txt"
          # trusted
          # trusted <login>: 0 when <login> is one of the APPS, or an account that GitHub's collaborator permission API
          # gives admin or write; 1 when it is neither; 2 when the API could not say.
          trusted() {
            local permission
            [[ $1 =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || return 1
            [[ ,$APPS, != *",$1,"* ]] || return 0
            [[ $1 != *'[bot]' ]] || return 1
            permission=$(gh api "repos/$REPO/collaborators/$1/permission" --jq .permission) || return 2
            [[ $permission == admin || $permission == write ]]
          }
          # end of trusted
          # comments
          # The comments, reviews and review comments that the review reads: those of the pull request's or the
          # issue's author, and of each account that trusted passes. GitHub's REST API names an App <name>[bot]. The
          # others are counted in omitted.txt, and never read.
          author=$(gh api "repos/$REPO/issues/$NUMBER" --jq .user.login)
          gh api --paginate "repos/$REPO/issues/$NUMBER/comments" \
            --jq '.[] | {author: .user.login, created_at, body}' > "$RUNNER_TEMP/comments.jsonl"
          : > "$RUNNER_TEMP/reviews.jsonl"
          : > "$RUNNER_TEMP/review-comments.jsonl"
          if [ "$KIND" = pr ]; then
            gh api --paginate "repos/$REPO/pulls/$NUMBER/reviews" \
              --jq '.[] | {author: .user.login, state, submitted_at, body}' > "$RUNNER_TEMP/reviews.jsonl"
            gh api --paginate "repos/$REPO/pulls/$NUMBER/comments" \
              --jq '.[] | {author: .user.login, path, line: (.line // .original_line), body}' \
              > "$RUNNER_TEMP/review-comments.jsonl"
          fi
          readers=("$author")
          while IFS= read -r login; do
            if [ "$login" != "$author" ] && trusted "$login"; then readers+=("$login"); fi
          done < <(cat "$RUNNER_TEMP"/{comments,reviews,review-comments}.jsonl | jq -r '.author // empty' | sort -u)
          read_json=$(jq -cn '$ARGS.positional' --args "${readers[@]}")
          for what in comments reviews review-comments; do
            jq -s --argjson readers "$read_json" 'map(select(.author | IN($readers[])))' "$RUNNER_TEMP/$what.jsonl" \
              > "$RUNNER_TEMP/$what.json"
            left=$(jq -s --argjson readers "$read_json" 'map(select(.author | IN($readers[]) | not)) | length' \
              "$RUNNER_TEMP/$what.jsonl")
            (( left == 0 )) || echo "$left $what by accounts without write access: not read" >> "$out/omitted.txt"
          done
          # end of comments
          if [ "$KIND" = issue ]; then
            gh issue view "$NUMBER" -R "$REPO" --json number,title,author,createdAt,state,body \
              | jq --slurpfile c "$RUNNER_TEMP/comments.json" '. + {comments: $c[0]}' > "$out/issue.json"
          else
            gh pr view "$NUMBER" -R "$REPO" --json \
              number,title,author,createdAt,isDraft,baseRefName,headRefOid,headRepository,body,commits,files \
              | jq --slurpfile c "$RUNNER_TEMP/comments.json" --slurpfile r "$RUNNER_TEMP/reviews.json" \
                  '. + {comments: $c[0], reviews: $r[0]}' > "$out/pr.json"
            gh pr view "$NUMBER" -R "$REPO" --json statusCheckRollup > "$out/checks.json"
            jq -r '.[] | "\(.author) \(.path):\(.line) \(.body)"' "$RUNNER_TEMP/review-comments.json" \
              > "$out/review-comments.txt"
            if [ -n "$EVENT_HEAD" ] && [ "$(jq -r .headRefOid "$out/pr.json")" != "$EVENT_HEAD" ]; then
              echo "::notice::#$NUMBER has moved on from $EVENT_HEAD: the run of its newer push considers it."
              echo "moved=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            base=$(jq -r .baseRefName "$out/pr.json")
            [ "$base" = main ] || { echo "::error::pull request #$NUMBER is into $base, not main: not reviewed."; exit 1; }
            git fetch -q --no-tags origin "+refs/pull/$NUMBER/head:refs/review/head"
            head=$(git rev-parse refs/review/head)
            [ "$head" = "$(jq -r .headRefOid "$out/pr.json")" ] \
              || { echo "::error::the pull request's head moved while it was read; the next run reviews the new head."; exit 1; }
            mb=$(git merge-base origin/main "$head")
            printf 'base %s\nhead %s\n' "$mb" "$head" > "$out/commits.txt"
            git diff --no-renames --name-only -z "$mb" "$head" > "$RUNNER_TEMP/changed"
            changed=$(tr -cd '\0' < "$RUNNER_TEMP/changed" | wc -c)
            (( changed <= 3000 )) || { echo "::error::$changed changed files: too large for this review."; exit 1; }
            git diff --no-renames --no-ext-diff --no-textconv "$mb" "$head" > "$out/pr.diff"
            # Each changed file as the pull request has it: regular files only, each cut at 2 MiB, 512 MiB in all.
            total=0
            while IFS= read -r -d '' path; do
              mode=$(git ls-tree --format='%(objectmode)' "$head" -- ":(literal)$path")
              case $mode in
                '') echo "$path: deleted" >> "$out/omitted.txt"; continue ;;
                100644|100755) ;;
                *) echo "$path: not a regular file (mode $mode)" >> "$out/omitted.txt"; continue ;;
              esac
              file="$out/head/$path"
              mkdir -p "$(dirname -- "$file")"
              git cat-file blob "$head:$path" > "$file"
              size=$(stat -c %s "$file")
              total=$((total + size))
              (( total <= 536870912 )) || { echo "::error::the changed files hold over 512 MiB: too large for this review."; exit 1; }
              if (( size > 2097152 )); then
                truncate -s 2097152 "$file"
                echo "$path: cut at 2 MiB of its $size bytes" >> "$out/omitted.txt"
              fi
            done < "$RUNNER_TEMP/changed"
            # Claude Code reads a CLAUDE.md, an AGENTS.md or a .claude/ beside a file it reads as instructions. The pull
            # request's are data, so they go.
            if [ -d "$out/head" ]; then
              find "$out/head" \( -iname 'CLAUDE*.md' -o -iname 'AGENTS*.md' -o -iname .claude \) -prune -print0 \
                | while IFS= read -r -d '' p; do
                    echo "${p#"$out"/head/}: removed (instructions for Claude Code)" >> "$out/omitted.txt"
                    rm -rf -- "$p"
                  done
            fi
          fi
          echo "Gathered $(find "$out" -type f | wc -l) files."

      - name: Keep it for the screen and the review
        id: keep
        if: steps.gather.outputs.moved != 'true'
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/review-data"
          tar -cf "$RUNNER_TEMP/review-data/review.tar" .review
          digest=$(sha256sum "$RUNNER_TEMP/review-data/review.tar" | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Kept .review/ as review.tar, SHA-256 $digest."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (sha-pinned)
        if: steps.gather.outputs.moved != 'true'
        with: {name: review-data, path: "${{ runner.temp }}/review-data/review.tar", if-no-files-found: error, retention-days: 1, overwrite: true}

  # The screen of a pull request or issue whose author, or the account that started the run, has no write access, or
  # that a maintainer asked to screen (the top of this file, and .github/screen.py). In the environment review-screen,
  # whose jobs alone can exchange their identity token for the screen's three: so this job cannot get the review's
  # Claude token, and no other job, the review's included, can get the screen's. Its one output is the verdict, clean
  # or held; the reason goes to the private bucket REASON_BUCKET.
  screen:
    name: screen ${{ needs.trust.outputs.outsider }}
    needs: [trust, gather]
    # A screen of what the gather job kept, or a measurement, which needs no gather job.
    if: >-
      ${{ !cancelled() && ((needs.trust.outputs.route == 'screen' && needs.gather.result == 'success'
          && needs.gather.outputs.digest != '') || needs.trust.outputs.route == 'measure') }}
    environment: {name: review-screen, deployment: false}
    concurrency:
      group: screen-${{ needs.trust.outputs.number }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ needs.trust.outputs.route == 'measure' && 60 || 15 }}
    permissions: {contents: read, id-token: write}
    outputs:
      verdict: ${{ steps.screen.outputs.verdict }}
      checks: ${{ steps.screen.outputs.checks }}
    env:
      # Ids and endpoints, not secrets. Google Cloud: the pool, its provider and the account that only this
      # environment's jobs of this file reach, Model Armor's template, and the bucket the reason goes to.
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/805240912354/locations/global/workloadIdentityPools/review-screen/providers/github
      GCP_SERVICE_ACCOUNT: review-screen@theorem-agent-infra.iam.gserviceaccount.com
      MODEL_ARMOR_URL: https://modelarmor.us.rep.googleapis.com
      MODEL_ARMOR_TEMPLATE: projects/theorem-agent-infra/locations/us/templates/review-screen
      STORAGE_URL: https://storage.googleapis.com
      REASON_BUCKET: theorem-agent-infra-review-screen-reasons
      # Azure: Theorem's tenant, the managed identity review-screen, whose federated credential admits this
      # repository's jobs in review-screen, and whose role allows text:shieldPrompt on the Content Safety account and
      # nothing else.
      AZURE_LOGIN_URL: https://login.microsoftonline.com
      AZURE_TENANT_ID: aaa6ad34-51af-41e7-891f-f16f5c53c396
      AZURE_CLIENT_ID: 878cb696-144f-4c60-b04c-3974fad24e96
      CONTENT_SAFETY_URL: https://theorem-review-screen.cognitiveservices.azure.com
      # Anthropic: Theorem's organization, the service account review-screen (not the review's oss-verify-ci), its
      # workspace, and the federation rule rocq-linux-process-semantics-screen, which admits only this file's jobs in
      # review-screen on main, for the events pull_request_target, issues and workflow_dispatch, with the scope
      # workspace:inference.
      ANTHROPIC_URL: https://api.anthropic.com
      ANTHROPIC_ORGANIZATION_ID: 5fd73c3e-8a2c-4166-b80d-fb5ce0c1b4a6
      ANTHROPIC_WORKSPACE_ID: wrkspc_01Qr1iUVcow4jdgQM7Amfks5
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01JFhEhPizCyTiK2i22mRJ8a
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01SQMHj4Tw85dV4DNYWQDKeA
      SCREEN_MODEL: claude-haiku-5-5
      # The checks that run, all three. A listed check whose settings are missing, or that cannot answer (a 429 of
      # Prompt Shields' free tier among the causes), holds the item; a check leaves only by leaving this list.
      SCREEN_CHECKS: model_armor,prompt_shields,claude
      # How the checks' words make the verdict (.github/screen.py, RULES, with the measurement behind the choice):
      # held when the model answers suspicious, or Model Armor and Prompt Shields both do; and, under every rule, when
      # a check cannot answer.
      SCREEN_RULE: claude_or_both_detectors
    steps:
      # main's .github/, for screen.py; never the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with: {persist-credentials: false, sparse-checkout: .github, sparse-checkout-cone-mode: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (sha-pinned)
        if: needs.trust.outputs.route != 'measure'
        with: {name: review-data, path: "${{ runner.temp }}/review-data"}
      - name: Take the gathered pull request or issue
        if: needs.trust.outputs.route != 'measure'
        env: {DIGEST: "${{ needs.gather.outputs.digest }}"}
        run: |
          set -euo pipefail
          tar=$RUNNER_TEMP/review-data/review.tar
          [[ $DIGEST =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the gather job gave no SHA-256"; exit 1; }
          printf '%s  %s\n' "$DIGEST" "$tar" | sha256sum -c --strict
          # The listing goes to a file first: grep -q in a pipe would stop tar early, and pipefail would read that as
          # the check passing.
          tar -tf "$tar" > "$RUNNER_TEMP/review-data/members"
          ! grep -qvE '^\.review(/|$)' "$RUNNER_TEMP/review-data/members" \
            || { echo "::error::review.tar holds more than .review/"; exit 1; }
          ! grep -qE '(^|/)\.\.(/|$)' "$RUNNER_TEMP/review-data/members" || { echo "::error::review.tar holds a .. path"; exit 1; }
          [ ! -e .review ] || { echo "::error::.review is there already"; exit 1; }
          tar -xf "$tar" --no-same-owner --no-same-permissions
          echo "Took $(find .review -type f | wc -l) files."

      # A token for 10 minutes, or an hour for a measurement, which can run longer, which the account can use for
      # Model Armor, for adding an object to the reason bucket and for reading the labelled set, and for nothing else. A sign-in that fails fails this job, and the hold job holds it.
      - name: Sign in to Google Cloud
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (sha-pinned)
        with: {workload_identity_provider: "${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}", service_account: "${{ env.GCP_SERVICE_ACCOUNT }}", token_format: access_token, access_token_lifetime: "${{ needs.trust.outputs.route == 'measure' && '3600s' || '600s' }}", create_credentials_file: false, export_environment_variables: false}
      - name: Screen
        id: screen
        if: needs.trust.outputs.route != 'measure'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ needs.trust.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REASON_OBJECT: ${{ github.repository }}/${{ github.run_id }}-${{ github.run_attempt }}.json
        run: python3 .github/screen.py .review
      # Every listed check, three times, on each text of the labelled set kept in the private bucket, and the verdict
      # of each rule of SCREEN_RULE's choices. The texts and their words stay in the bucket; this log and the run's
      # summary get the counts per rule alone.
      - name: Measure
        if: needs.trust.outputs.route == 'measure'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MEASURE_SET: ${{ inputs.measure_set }}
          MEASURE_OBJECT: measure/runs/${{ github.repository }}/${{ github.run_id }}-${{ github.run_attempt }}.json
          MEASURE_REPEATS: ${{ inputs.measure_repeats }}
        run: |
          set -euo pipefail
          [[ $MEASURE_SET =~ ^measure/set-v[0-9]+\.json$ ]] || { echo "::error::not a labelled set: $MEASURE_SET"; exit 1; }
          [[ $MEASURE_REPEATS =~ ^[1-5]$ ]] || { echo "::error::MEASURE_REPEATS must be 1 to 5"; exit 1; }
          python3 .github/screen.py --measure

  review:
    # The hourly caps tell the two kinds of review apart by this name.
    name: ${{ needs.trust.outputs.route == 'screen' && 'review (screened)' || 'review' }}
    needs: [trust, gather, screen]
    # A writer's, or a maintainer's request; or one the screen passed. A run whose gather job failed, or whose screen
    # held it, failed or was cancelled, has no review.
    if: >-
      !cancelled() && needs.gather.result == 'success' && needs.gather.outputs.digest != ''
      && (needs.trust.outputs.route == 'review'
          || (needs.trust.outputs.route == 'screen' && needs.screen.result == 'success'
              && needs.screen.outputs.verdict == 'clean'))
    # One review at a time for each pull request or issue: a new push replaces the review of the old head. A run that
    # the trust job stops, or that the screen holds, never reaches this job, so it cancels no review.
    concurrency:
      group: review-${{ needs.gather.outputs.number }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions: {contents: read, pull-requests: read, issues: read, checks: read, statuses: read, actions: read, id-token: write}
    outputs:
      number: ${{ needs.gather.outputs.number }}
      started: ${{ needs.trust.outputs.started }}
      head: ${{ steps.result.outputs.head }}
      body: ${{ steps.result.outputs.body }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      # The Linux the model describes (README.md, SCOPE.md: stable Linux v6.18.46), and QEMU 10.0.11, the version of
      # SCOPE.md's QEMU measurements.
      LINUX_URL: https://github.com/gregkh/linux
      LINUX_COMMIT: 1f99e9ab748fc5c32120de9c4eca31abfe54a4d5
      QEMU_URL: https://github.com/qemu/qemu
      QEMU_COMMIT: e3ad0582fdcec5c194835b0b4e8342cdc197b5cb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with: {persist-credentials: false}

      # Counts the review jobs of this workflow's other runs that started in the last hour, or have not started, and
      # have called the model or may still call it: one whose Review step ran or runs; one that passed the step "Hold
      # at the hourly cap" and has not finished; and one that has not finished that step yet and belongs to an earlier
      # run, which goes first. So in a burst the earliest runs go ahead and the later ones stop at that step. Runs
      # created up to 3 hours ago are read, which covers a job's 75 minutes and its time in the queue. A review job that
      # waits for its run's trust job is not listed yet, and one the trust job skipped has no Review step, so neither
      # counts. Only jobs of this run's kind count, by the job's name: a writer's review against HOURLY_CAP, a screened
      # one against SCREENED_HOURLY_CAP. A read that fails stops the run here, not at the next step, so that the hold
      # job, which reads that step's failure as the cap, never says the cap was reached when it was not.
      - name: Count the reviews of the last hour
        id: count
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          POOL: ${{ needs.trust.outputs.route == 'screen' && 'review (screened)' || 'review' }}
          CAP: ${{ needs.trust.outputs.route == 'screen' && env.SCREENED_HOURLY_CAP || env.HOURLY_CAP }}
        run: |
          set -uo pipefail
          stop() { echo "::error::$1 No model ran. A maintainer can re-run this run."; exit 1; }
          [[ $CAP =~ ^[1-9][0-9]*$ ]] || stop "the cap is not a number."
          SINCE=$(date -u -d '-1 hour' +%s) || stop "the time could not be read."
          from=$(date -u -d '-3 hours' +%Y-%m-%dT%H:%M:%SZ) || stop "the time could not be read."
          export SINCE
          runs=$(gh api --method GET --paginate "repos/$REPO/actions/workflows/review.yml/runs" \
            -f created=">=$from" -F per_page=100 --jq '.workflow_runs[] | "\(.id) \(.created_at)"') \
            || stop "the runs could not be read."
          count=0
          while read -r id created; do
            [ -n "$id" ] || continue
            [[ $id =~ ^[0-9]+$ ]] || stop "a run id is not a number."
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            n=$(RUN_CREATED=$created gh api --method GET --paginate "repos/$REPO/actions/runs/$id/jobs" \
              -f filter=all -F per_page=100 --jq '
                [.jobs[] | select(.name == $ENV.POOL)
                 | select((.run_id | tostring) != $ENV.RUN_ID or (.run_attempt | tostring) != $ENV.RUN_ATTEMPT)
                 | select(((.started_at // $ENV.RUN_CREATED) | fromdateiso8601) >= ($ENV.SINCE | tonumber))
                 | ([(.steps // [])[] | select(.name == "Review")] | first) as $review
                 | ([(.steps // [])[] | select(.name == "Hold at the hourly cap")] | first) as $cap
                 | select(($review != null and ($review.status == "in_progress"
                                                 or ($review.conclusion != null and $review.conclusion != "skipped")))
                          or (.status != "completed" and $cap != null and $cap.conclusion == "success")
                          or (.status != "completed" and ($cap == null or $cap.status != "completed")
                              and .run_id < ($ENV.RUN_ID | tonumber)))]
                | length') || stop "the jobs of run $id could not be read."
            [[ $n =~ ^[0-9]+$ ]] || stop "the jobs of run $id could not be read."
            count=$((count + n))
          done <<< "$runs"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$count reviews ($POOL) called the model, or may, in the last hour."

      # Fails only when the count is at the cap: the hold job reads this step's failure as the cap reached.
      - name: Hold at the hourly cap
        env:
          COUNT: ${{ steps.count.outputs.count }}
          POOL: ${{ needs.trust.outputs.route == 'screen' && 'review (screened)' || 'review' }}
          CAP: ${{ needs.trust.outputs.route == 'screen' && env.SCREENED_HOURLY_CAP || env.HOURLY_CAP }}
        run: |
          set -uo pipefail
          if (( COUNT >= CAP )); then
            echo "::error::HELD: $COUNT reviews ($POOL) called the model, or may, in the last hour: the cap is $CAP." \
              "No model ran. A maintainer can re-run this run once the hour has passed."
            exit 1
          fi
          echo "$COUNT reviews ($POOL) in the last hour, under the cap of $CAP."

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (sha-pinned)
        if: needs.trust.outputs.route != 'measure'
        with: {name: review-data, path: "${{ runner.temp }}/review-data"}
      - name: Take the gathered pull request or issue
        if: needs.trust.outputs.route != 'measure'
        env: {DIGEST: "${{ needs.gather.outputs.digest }}"}
        run: |
          set -euo pipefail
          tar=$RUNNER_TEMP/review-data/review.tar
          [[ $DIGEST =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the gather job gave no SHA-256"; exit 1; }
          printf '%s  %s\n' "$DIGEST" "$tar" | sha256sum -c --strict
          # The listing goes to a file first: grep -q in a pipe would stop tar early, and pipefail would read that as
          # the check passing.
          tar -tf "$tar" > "$RUNNER_TEMP/review-data/members"
          ! grep -qvE '^\.review(/|$)' "$RUNNER_TEMP/review-data/members" \
            || { echo "::error::review.tar holds more than .review/"; exit 1; }
          ! grep -qE '(^|/)\.\.(/|$)' "$RUNNER_TEMP/review-data/members" || { echo "::error::review.tar holds a .. path"; exit 1; }
          [ ! -e .review ] || { echo "::error::.review is there already"; exit 1; }
          tar -xf "$tar" --no-same-owner --no-same-permissions
          echo "Took $(find .review -type f | wc -l) files."

      # The source the model describes, for the kernel and QEMU code that comments and issues cite.
      - name: Gather the Linux and QEMU source
        run: |
          set -euo pipefail
          out=.review
          fetch() {
            local dir=$1 url=$2 commit=$3; shift 3
            git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 --filter=blob:none "$url" "$commit"
            git -C "$dir" sparse-checkout set --no-cone "$@"
            git -C "$dir" -c advice.detachedHead=false checkout -q FETCH_HEAD
            rm -rf "$dir/.git"
            find "$dir" \( -iname 'CLAUDE*.md' -o -iname 'AGENTS*.md' -o -iname .claude \) -prune -exec rm -rf {} +
          }
          fetch "$out/linux" "$LINUX_URL" "$LINUX_COMMIT" /mm/ /kernel/ /ipc/ /lib/ /arch/riscv/ /include/ /fs/ /net/ \
            /security/ /init/ /block/ /io_uring/ /drivers/char/ /drivers/tty/
          fetch "$out/qemu" "$QEMU_URL" "$QEMU_COMMIT" /linux-user/ /include/user/ /target/riscv/
          echo "Gathered $(find "$out" -type f | wc -l) files."

      # The Review step's action writes this job's GitHub token into the checkout's git configuration (as the origin
      # URL), and Claude can read every file of the working directory. So git's own directory moves under the runner's
      # temporary directory, which Claude cannot read, and .git becomes a file that names it. git works as before.
      - name: Keep git's configuration out of Claude's reach
        run: |
          set -euo pipefail
          git init -q --separate-git-dir="$RUNNER_TEMP/review-git"
          [ -f .git ] || { echo "::error::.git is still a directory"; exit 1; }

      # The action would download and run Claude Code's installer (curl https://claude.ai/install.sh | bash) and a Bun
      # at run time, unchecked, in a job that holds an identity token. This step downloads the versions that the action
      # at its pinned commit installs, and refuses any file whose SHA-256 is not the one written here. When the action's
      # pin moves, take the new versions from its src/entrypoints/run.ts (claudeCodeVersion) and its action.yml
      # (bun-version), and their digests from https://downloads.claude.ai/claude-code-releases/<version>/manifest.json
      # (platforms.linux-x64.checksum) and from the bun-linux-x64.zip asset of the oven-sh/bun release.
      - name: Download Claude Code and Bun at pinned digests
        env:
          CLAUDE_CODE_VERSION: 2.1.312
          CLAUDE_CODE_SHA256: 4f4178ce41d83e23341ebfbaecdbcf8ea6bf7baea0690025abe49eeec3a5d01d
          BUN_VERSION: 1.4.4
          BUN_SHA256: bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c
        run: |
          set -euo pipefail
          [ "$(uname -sm)" = "Linux x86_64" ] || { echo "::error::the pinned binaries are for Linux on x86-64"; exit 1; }
          dir=$RUNNER_TEMP/review-tools
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/claude" \
            "https://downloads.claude.ai/claude-code-releases/$CLAUDE_CODE_VERSION/linux-x64/claude"
          curl -fsSL --retry 3 -o "$dir/bun.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/bun-linux-x64.zip"
          printf '%s  %s\n' "$CLAUDE_CODE_SHA256" "$dir/claude" "$BUN_SHA256" "$dir/bun.zip" | sha256sum -c --strict
          unzip -q -j "$dir/bun.zip" bun-linux-x64/bun -d "$dir"
          rm "$dir/bun.zip"
          chmod +x "$dir/claude" "$dir/bun"

      # allowed_non_write_users, which a screened item sets, makes the action put /usr/bin and /bin before the pinned
      # Bun on the PATH. So no other Bun may be there.
      - name: No Bun but the pinned one
        run: |
          set -euo pipefail
          for bun in /usr/bin/bun /bin/bun; do
            [ ! -e "$bun" ] || { echo "::error::$bun is on the runner, ahead of the pinned Bun"; exit 1; }
          done

      - name: Review
        id: review
        timeout-minutes: 50
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1 (v1.0.264, sha-pinned)
        with:
          # Theorem's Anthropic organization, its service account oss-verify-ci and its workspace, and the federation
          # rule that admits this file on main (ids, not secrets).
          anthropic_federation_rule_id: fdrl_01PuYUs4GWGMxDQi1kLWwu7y
          anthropic_organization_id: 5fd73c3e-8a2c-4166-b80d-fb5ce0c1b4a6
          anthropic_service_account_id: svac_01WdHTLcJPEfiPttcuLK1hGT
          anthropic_workspace_id: wrkspc_01Qr1iUVcow4jdgQM7Amfks5
          github_token: ${{ github.token }}
          # The action itself refuses a run started by an account without write access (its default), and any App
          # but these, except the account whose pull request or issue the screen passed: this job runs for a
          # screened item only when the screen job's verdict is clean (its if). A rescreen's run is started by
          # github-actions[bot] (the rescreen job's dispatch), which it admits only when the trust job accepted the
          # rescreen: then the run reviews a screened item whose screen passed, or a writer's item.
          allowed_non_write_users: ${{ needs.trust.outputs.route == 'screen' && needs.trust.outputs.outsider || '' }}
          allowed_bots: >-
            ${{ needs.trust.outputs.rescreen == 'true' && format('{0},github-actions[bot]', env.APPS)
            || needs.trust.outputs.route == 'screen' && endsWith(needs.trust.outputs.outsider, '[bot]')
            && format('{0},{1}', env.APPS, needs.trust.outputs.outsider) || env.APPS }}
          path_to_claude_code_executable: ${{ runner.temp }}/review-tools/claude
          path_to_bun_executable: ${{ runner.temp }}/review-tools/bun
          # Claude reads nothing outside the checkout. The runner's temporary files hold the identity token, the
          # exchanged Claude token and git's configuration, and /proc holds the environment: the deny rules name them
          # as well.
          settings: >-
            {"permissions": {"blockReadsOutsideWorkingDirectories": true,
            "deny": ["Read(//home/runner/work/_temp/**)", "Read(//proc/**)"]}}
          prompt: >-
            Read .github/review.md: it is the rules of this review. Review ${{ needs.gather.outputs.kind == 'pr' &&
            'pull request' || 'issue' }} #${{ needs.gather.outputs.number }} of this repository as it says, from what
            .review/ holds, and give the comment as the structured output.
          claude_args: >-
            --tools Read,Glob,Grep --permission-mode dontAsk --model claude-opus-5-5 --effort xhigh --max-turns 300
            --json-schema '{"type": "object", "additionalProperties": false, "required": ["comment"],
            "properties": {"comment": {"type": "string", "description": "The review comment, in Markdown."}}}'

      # The model's text, which a pull request or an issue can steer, made unable to notify anyone, to link another
      # issue or pull request, or to link or load anything outside github.com. First each character reference (&#64;,
      # &#x40;, &commat; and the like, with or without its ;) that stands for an ASCII letter or digit or one of
      # @ # / \ : . _ - is decoded, again until none is left, so that the rules after it see the text as GitHub renders
      # it. Then a word joiner (U+2060) goes after every @, and between a digit and the #, the GH- or the
      # github.com/<owner>/<repo>/issues/ (pull/, pulls/, discussions/) before it. A word joiner also goes before the :
      # of each URL scheme that a link or an image can use, unless it is http or https to github.com itself, inside the
      # two slashes of a link or image address with no scheme (//host), and after the www of an address GitHub would
      # link on its own: such an address is text, or at most a link within this repository, and no image loads from
      # outside. A review's own links to github.com, this repository's docs among them, still work. The text is cut at
      # 20,000 characters and put between a header and a footer the model does not write.
      - name: The comment, as it is posted
        id: result
        env:
          RESULT: ${{ steps.review.outputs.execution_file }}
          RULES: ${{ github.server_url }}/${{ github.repository }}/blob/main/.github/review.md
          # The checks the screen ran, when it screened this pull request or issue first.
          SCREENED: ${{ needs.trust.outputs.route == 'screen' && needs.screen.outputs.checks || '' }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          comment=$(jq -re 'map(select(.type == "result")) | last | .structured_output.comment | strings' "$RESULT" \
            | python3 -X utf8 -c '
          import html, re, sys
          text = sys.stdin.read()
          ref = re.compile(r"&(?:#[0-9]+|#[xX][0-9a-fA-F]+|[A-Za-z][A-Za-z0-9]*);?")
          def decode(m):
              c = html.unescape(m.group(0))
              return c if len(c) == 1 and c.isascii() and (c.isalnum() or c in "@#/\\:._-") else m.group(0)
          while (decoded := ref.sub(decode, text)) != text:
              text = decoded
          text = text.replace("@", "@\u2060")
          text = re.sub(r"(#|(?i:GH-)|(?i:github\.com/[^/\s]+/[^/\s]+/(?:issues|pulls?|discussions)/))(?=[0-9])",
                        "\\1\u2060", text)
          text = re.sub(r"(?i)\b(https?|ftps?|mailto|xmpp|ircs?|news|nntp|wss?|data|tel|sms|javascript|vbscript|file)"
                        r"(?=:)(?!:[/\\]{2}(?:www\.)?github\.com(?:[/?#\s)\]>\x22\x27]|$))", "\\1\u2060", text)
          text = re.sub(r"(?m)((?:[(=<\x22\x27]|^\s*\[[^\]\n]+\]:)\s*[/\\])(?=[/\\])", "\\1\u2060", text)
          text = re.sub(r"(?i)(?<![\w.\-/\\@])(www)(?=\.)(?!\.github\.com(?:[/?#\s)\]>\x22\x27]|$))", "\\1\u2060", text)
          sys.stdout.write(text)
          ')
          if (( ${#comment} > 20000 )); then
            comment="${comment:0:20000}"$'\n\n'"(The review was cut here, at 20,000 characters.)"
          fi
          what="this issue"
          if [ -f .review/commits.txt ]; then
            head=$(sed -n 's/^head //p' .review/commits.txt)
            what="commit ${head:0:12}"
            echo "head=$head" >> "$GITHUB_OUTPUT"
          fi
          foot="Claude wrote this review by [these rules]($RULES) ([run]($RUN)). It is advice; a maintainer decides."
          if [ -n "$SCREENED" ]; then
            [[ $SCREENED =~ ^[a-z_]+(,[a-z_]+)*$ ]] || { echo "::error::not a list of checks: $SCREENED"; exit 1; }
            names=$(tr ',' '\n' <<< "$SCREENED" | sed -e 's/^model_armor$/Google Cloud Model Armor/' \
              -e 's/^prompt_shields$/Azure AI Content Safety Prompt Shields/' -e 's/^claude$/a Claude model with no tools/' \
              | paste -sd ',' | sed 's/,/, /g')
            foot="An automated screen passed it first. The checks that ran: $names. $foot"
          fi
          body=$(printf '%s\n%s\n\n%s\n\n---\n%s\n' '<!-- review -->' "**Automated review** of $what" "$comment" "$foot")
          delimiter="body_$(openssl rand -hex 16)"
          { echo "body<<$delimiter"; printf '%s\n' "$body"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

  post:
    needs: review
    # GitHub's implicit success() skips a job with a skipped ancestor, and a writer's run skips the screen job.
    if: ${{ !cancelled() && needs.review.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {issues: write, pull-requests: write}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ needs.review.outputs.number }}
      BODY: ${{ needs.review.outputs.body }}
    steps:
      - name: Post the review, or replace the one posted before
        if: env.POST_REVIEW == 'true'
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ && -n $BODY ]] || { echo "::error::no review to post"; exit 1; }
          id=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- review -->"))) | .id' \
            | tail -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -f body="$BODY" --jq .html_url
          else
            gh api --method POST "repos/$REPO/issues/$NUMBER/comments" -f body="$BODY" --jq .html_url
          fi
      # A review replaces the hold: a maintainer's request, or a later push that the screen passed. Not the review of
      # an older head: a newer push may have been held since. Nor when a hold came after this run started: a newer
      # event of the issue or the pull request was held.
      - name: Take the label review-held off
        if: env.POST_REVIEW == 'true'
        env:
          HEAD: ${{ needs.review.outputs.head }}
          STARTED: ${{ needs.review.outputs.started }}
        run: |
          set -uo pipefail
          [[ $STARTED =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
            || { echo "::error::no start time of this run"; exit 1; }
          if [ -n "$HEAD" ]; then
            now=$(gh api "repos/$REPO/pulls/$NUMBER" --jq .head.sha) || { echo "::error::no head of #$NUMBER"; exit 1; }
            [ "$now" = "$HEAD" ] || { echo "#$NUMBER has moved on from $HEAD: the label stays."; exit 0; }
          fi
          held=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" --jq '.[]
            | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- review-held -->"))) | .updated_at') \
            || { echo "::error::the comments of #$NUMBER could not be read"; exit 1; }
          last=$(sort <<< "$held" | tail -n 1)
          if [[ -n $last && ! $last < $STARTED ]]; then
            echo "#$NUMBER was held at $last, after this run started at $STARTED: the label stays."
            exit 0
          fi
          out=$(gh api --method DELETE "repos/$REPO/issues/$NUMBER/labels/$HELD_LABEL" 2>&1) && exit 0
          [[ $out == *"(HTTP 404)"* ]] || { echo "::error::the label could not be taken off: $out"; exit 1; }
      - name: Keep the review in the run's summary
        if: env.POST_REVIEW != 'true'
        run: printf '%s\n' "$BODY" >> "$GITHUB_STEP_SUMMARY"

  # A pull request or an issue that the screen held, that could not be gathered or screened, whose review the screen
  # passed but that did not finish (SCREENED_HOURLY_CAP among the causes), or whose account is at OUTSIDE_HOURLY_LIMIT:
  # the label review-held, and one comment that says it was held, which a later hold replaces. The comment says
  # nothing of why the screen held it: the screen job's outputs are its verdict and the names of its checks. A hold
  # that the rescreen job tries again ends with the marker <!-- review-held-<kind> <run> <tries> -->, by which that job
  # finds it and the account: limit (OUTSIDE_HOURLY_LIMIT); cap, a screened review stopped at SCREENED_HOURLY_CAP; or
  # transient, a screened review that failed otherwise or ran out of time, while it has failed fewer than REVIEW_TRIES
  # times. <run> is the run of the event this hold comes from (a rescreen keeps it), and <tries> the screened reviews
  # of it that failed so far. A cancelled screen holds nothing, nor a screened review that a newer run of the same item
  # cancelled: that run decides.
  hold:
    needs: [trust, gather, screen, review]
    if: >-
      !cancelled() && (needs.trust.outputs.route == 'limit'
      || (needs.trust.outputs.route == 'screen'
          && (needs.gather.result == 'failure' || needs.screen.result == 'failure'
              || (needs.screen.result == 'success' && needs.screen.outputs.verdict != 'clean')
              || (needs.screen.outputs.verdict == 'clean'
                  && (needs.review.result == 'failure' || needs.review.result == 'cancelled')))))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions: read for this run's jobs (was the review stopped at the cap?) and this workflow's runs (did a newer run
    # of the item cancel it?).
    permissions: {issues: write, pull-requests: write, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ needs.trust.outputs.number }}
      ROUTE: ${{ needs.trust.outputs.route }}
      OUTSIDER: ${{ needs.trust.outputs.outsider }}
      REVIEW: ${{ needs.review.result }}
      ORIGIN: ${{ needs.trust.outputs.origin }}
      TRIES: ${{ needs.trust.outputs.tries }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Label it and say that it was held
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          [[ $RUN_ID =~ ^[1-9][0-9]*$ && $RUN_ATTEMPT =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a run id or attempt"; exit 1; }
          [[ $REVIEW_TRIES =~ ^[1-9][0-9]*$ ]] || { echo "::error::REVIEW_TRIES is not a number"; exit 1; }
          ask="A maintainer can start the review with \`gh workflow run review.yml -R $REPO -f number=$NUMBER\`."
          tries=${TRIES:-0}
          [[ $tries =~ ^[0-9]+$ ]] || tries=0
          kind=""
          # The rescreen job takes a hold with a marker once its comment is an hour old, at its next run of the four
          # each hour. A limit hold says what happens if the account is still at its limit; the other holds say only
          # that a new hold replaces this comment, since a rescreen can be held for another cause than theirs.
          next=$(date -u -d '+1 hour' '+%Y-%m-%d %H:%M UTC')
          again="It is screened again automatically, with no maintainer, from $next, by a check that runs every 15 minutes."
          again_limit="$again If that account is still at the limit then, the check tries again later, and if the item is held again, this comment gives the new time."
          again_other="$again If it is held again, this comment says why."
          if [ "$ROUTE" = limit ]; then
            [[ $OUTSIDER =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || { echo "::error::not a GitHub login: $OUTSIDER"; exit 1; }
            kind=limit
            why="The account behind its latest event has no write access to this repository, and its pull requests, issues and pushes have reached the limit of $OUTSIDE_HOURLY_LIMIT an hour that are screened for the automated review. $again_limit"
          elif [ -z "$OUTSIDER" ]; then
            why="A maintainer asked for the automated screen first, and the screen did not pass it, or the automated review after it did not finish. A maintainer will look at it."
          elif [ "$REVIEW" = failure ] || [ "$REVIEW" = cancelled ]; then
            if [ "$REVIEW" = cancelled ]; then
              # A newer run of the item (its next push, or its rescreen) cancels this run's review: that run decides.
              # Not a newer run whose trust job was skipped (an edit of a pull request that left its base as it was),
              # failed or was cancelled: it decides nothing, so this run holds the item. A trust job not listed yet,
              # still running, or passed may still decide.
              # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
              newer=$(gh api --method GET --paginate "repos/$REPO/actions/workflows/review.yml/runs" \
                -f created=">=$(date -u -d '-1 day' +%Y-%m-%dT%H:%M:%SZ)" -F per_page=100 --jq '.workflow_runs[]
                  | select(.id > ($ENV.RUN_ID | tonumber)
                           and (.event == "pull_request_target" or .event == "issues" or .event == "workflow_dispatch")
                           and ((.display_title // "") == "review #" + $ENV.NUMBER
                           or ((.display_title // "") | startswith("rescreen #" + $ENV.NUMBER + " of ")))) | .id') \
                || { echo "::error::the runs of this workflow could not be read"; exit 1; }
              for id in $newer; do
                [[ $id =~ ^[0-9]+$ ]] || { echo "::error::a run id is not a number"; exit 1; }
                trust=$(gh api --method GET --paginate "repos/$REPO/actions/runs/$id/jobs" -F per_page=100 \
                  --jq '.jobs[] | select(.name == "trust") | .conclusion // "running"') \
                  || { echo "::error::the jobs of run $id could not be read"; exit 1; }
                case $trust in
                  skipped|failure|cancelled) ;;
                  *) echo "A newer run of #$NUMBER cancelled this run's review: that run decides."; exit 0 ;;
                esac
              done
            fi
            # Stopped at SCREENED_HOURLY_CAP: its step of that name failed, in this attempt of this run.
            capped=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" --jq '.jobs[]
              | .steps[]? | select(.name == "Hold at the hourly cap" and .conclusion == "failure") | .name') \
              || { echo "::warning::the jobs of this run could not be read: the hold counts as a review that did not finish."; capped=""; }
            if [ -n "$capped" ]; then
              kind=cap
              why="It comes from an account without write access to this repository. The automated screen passed it, but the automated reviews of such items had reached their limit of $SCREENED_HOURLY_CAP an hour. $again_other"
            else
              tries=$((tries + 1))
              if (( tries < REVIEW_TRIES )); then
                kind=transient
                why="It comes from an account without write access to this repository. The automated screen passed it, but the automated review of it did not finish ($tries of the $REVIEW_TRIES times it is tried). $again_other"
              else
                why="It comes from an account without write access to this repository. The automated screen passed it, but the automated review of it did not finish, $tries times. A maintainer will look at it."
              fi
            fi
          else
            why="It comes from an account without write access to this repository, so an automated screen reads it before the automated review does, and the screen did not pass it. A maintainer will look at it."
          fi
          marker=""
          if [ -n "$kind" ]; then
            [[ $ORIGIN =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a run id: $ORIGIN"; exit 1; }
            marker=$'\n'"<!-- review-held-$kind $ORIGIN $tries -->"
          fi
          body=$(printf '%s\n%s\n\n%s %s\n%s' '<!-- review-held -->' "**Automated review held.**" "$why" "$ask" "$marker")
          # Adding a label that does not exist makes it, so a failed creation (two holds at once) only loses the colour.
          if ! gh api "repos/$REPO/labels/$HELD_LABEL" --jq .name > /dev/null 2>&1; then
            gh api --method POST "repos/$REPO/labels" -f name="$HELD_LABEL" -f color=d93f0b \
              -f description="The automated screen held this for a maintainer" --jq .name \
              || echo "::warning::the label $HELD_LABEL could not be made; adding it makes it."
          fi
          gh api --method POST "repos/$REPO/issues/$NUMBER/labels" -f "labels[]=$HELD_LABEL" --jq '.[].name' > /dev/null
          id=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- review-held -->"))) | .id' \
            | tail -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -f body="$body" --jq .html_url
          else
            gh api --method POST "repos/$REPO/issues/$NUMBER/comments" -f body="$body" --jq .html_url
          fi

  # The schedule's job, in the public repository alone: each open pull request or issue whose newest hold is one that
  # is tried again, over an hour old, is screened again by a run of this file that this job starts (-f rescreen=true,
  # the top of this file). Those holds: at OUTSIDE_HOURLY_LIMIT; of a screened review stopped at SCREENED_HOURLY_CAP;
  # and of a screened review that failed or ran out of time, under REVIEW_TRIES. Never one that the screen held: a
  # person decides on that. Oldest hold first, each account gets at most OUTSIDE_HOURLY_LIMIT rescreens an hour, less
  # those it had in the last hour; the trust job of each run counts again, with the account's own events, and holds
  # the item again at the limit, with a comment that says when it is tried next. A failed read or start leaves that
  # item for the next run and fails this job.
  # It is the only job of this file with actions: write, which starting a run needs; it checks nothing out, holds no
  # model, and writes nothing but those runs. Its cost: one job of a few seconds every 15 minutes, 96 runs a day on a
  # standard runner, whose minutes GitHub does not bill in a public repository.
  rescreen:
    if: >-
      github.event_name == 'schedule' && github.repository == 'theorem-labs/rocq-linux-process-semantics'
      && github.repository_id == 1425819621
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One at a time, so that two runs cannot start the same item.
    concurrency: {group: review-rescreen, cancel-in-progress: false}
    permissions: {actions: write, issues: read, pull-requests: read}
    steps:
      - name: Start the screen again of each held item whose hold is over an hour old
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ $OUTSIDE_HOURLY_LIMIT =~ ^[1-9][0-9]*$ ]] || { echo "::error::OUTSIDE_HOURLY_LIMIT is not a number"; exit 1; }
          # Without a posted review the label never comes off, so the same item would be screened and reviewed again
          # every hour.
          if [ "$POST_REVIEW" != true ]; then
            echo "::notice::POST_REVIEW is not true: reviews are not posted, so held items are not screened again."
            exit 0
          fi
          # held
          # limit_hold <number>: "<time> <run> <tries> <kind>" of the newest hold comment of <number> when it is one
          # that the rescreen job tries again (its marker <!-- review-held-<kind> <run> <tries> -->): <kind> is limit
          # (OUTSIDE_HOURLY_LIMIT), cap (SCREENED_HOURLY_CAP) or transient (a screened review that failed or ran out of
          # time), <run> the run of the event this hold comes from (a rescreen keeps it), and <tries> the screened
          # reviews of it that failed so far.
          # "<time> -" when the screen held it, or a person decides. Nothing when it has no hold comment. Only
          # github-actions[bot]'s comments count.
          limit_hold() {
            gh api --paginate "repos/$REPO/issues/$1/comments" --jq '.[]
              | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- review-held -->")))
              | "\(.updated_at) \((.body
                  | capture("\n<!-- review-held-(?<kind>limit|cap|transient) (?<run>[0-9]+)(?: (?<tries>[0-9]+))? -->(\n|$)")
                  | "\(.run) \(.tries // "0") \(.kind)") // "-")"' \
              | sort | tail -n 1
          }
          # held_account <run>: the account that started <run>, when <run> is a run of this workflow that a pull
          # request's or an issue's event started; nothing when it is not, or when GitHub no longer has it (a deleted
          # or expired run: a person decides). It fails when GitHub could not say.
          held_account() {
            local workflow run id event login
            [[ $1 =~ ^[1-9][0-9]*$ ]] || return 0
            workflow=$(gh api "repos/$REPO/actions/workflows/review.yml" --jq .id) || return 1
            run=$(gh api "repos/$REPO/actions/runs/$1" --jq '"\(.workflow_id) \(.event) \(.actor.login)"' 2>&1) \
              || { [[ $run == *"(HTTP 404)"* ]] || return 1; return 0; }
            read -r id event login <<< "$run"
            [[ $id == "$workflow" && ($event == pull_request_target || $event == issues) \
               && $login =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || return 0
            echo "$login"
          }
          # end of held
          from=$(date -u -d '-1 hour' +%Y-%m-%dT%H:%M:%SZ)
          since=$(date -u -d '-1 day' +%Y-%m-%dT%H:%M:%SZ)
          # This workflow's runs of the last day, by their names: an item with a run not finished (rescreen #<n> of
          # <account>, or review #<n>: its own event's or a maintainer's) is not started again, because its screen and
          # review can outlast this job's 15 minutes, and a second run would cancel them and use the hour's screened
          # reviews twice; the rescreens of the last hour count toward each account's limit (a rescreen's name, which
          # its trust job checks against the hold, names the account); and an item rescreened after its hold, whose
          # rescreen left neither a new hold nor a posted review (its review or post failed on the writers' route,
          # say), is not started again: a person decides, so that no item is screened and reviewed without end.
          runs=$(gh api --method GET --paginate "repos/$REPO/actions/workflows/review.yml/runs" \
            -f created=">=$since" -F per_page=100 \
            --jq '.workflow_runs[]
              | "\(.created_at // "-") \(.status // "-") \(.event // "-") \(.display_title // "" | gsub("[\r\n]"; " "))"') \
            || { echo "::error::the runs of this workflow could not be read."; exit 1; }
          declare -A used=() running=() last=()
          rescreen_re='^rescreen #([0-9]+) of ([A-Za-z0-9-]+(\[bot\])?)$'
          review_re='^review #([0-9]+)$'
          while read -r created status event title; do
            # Only this workflow's own events name a run: a fork's pull request can run its own copy of this file
            # (event pull_request) under any name.
            if [[ ($event == pull_request_target || $event == issues || $event == workflow_dispatch) \
                  && ${title:-} =~ $review_re ]]; then
              [ "$status" = completed ] || running[${BASH_REMATCH[1]}]=1
            elif [[ $event == workflow_dispatch && ${title:-} =~ $rescreen_re ]]; then
              [ "$status" = completed ] || running[${BASH_REMATCH[1]}]=1
              if [[ $created > ${last[${BASH_REMATCH[1]}]:-} ]]; then last[${BASH_REMATCH[1]}]=$created; fi
              if [[ ! $created < $from ]]; then
                used[${BASH_REMATCH[2]}]=$(( ${used[${BASH_REMATCH[2]}]:-0} + 1 ))
              fi
            fi
          done <<< "$runs"
          # Not a draft: the trust job takes none, and a run it stops would still count toward the account's limit.
          # Marking it ready starts its own run.
          numbers=$(gh api --paginate "repos/$REPO/issues?state=open&labels=$HELD_LABEL&per_page=100" \
            --jq '.[] | select(.state == "open" and ((.draft // false) | not)) | .number') \
            || { echo "::error::the held pull requests and issues could not be read."; exit 1; }
          failed=0
          : > "$RUNNER_TEMP/due"
          for number in $numbers; do
            [[ $number =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $number"; exit 1; }
            if [ -n "${running[$number]:-}" ]; then
              echo "#$number: a run of it has not finished."
              continue
            fi
            hold=$(limit_hold "$number") \
              || { echo "::error::the comments of #$number could not be read."; failed=1; continue; }
            read -r at origin _ <<< "$hold"
            if [[ -z ${origin:-} || $origin == - ]]; then
              echo "#$number: no hold that is tried again (the screen held it, or a person decides)."
              continue
            fi
            if [[ ! $at < $from ]]; then
              echo "#$number: held at $at, less than an hour ago."
              continue
            fi
            if [[ -n ${last[$number]:-} && $at < ${last[$number]} ]]; then
              echo "#$number: rescreened at ${last[$number]}, after its hold, with no new hold: a person decides."
              continue
            fi
            account=$(held_account "$origin") || { echo "::error::run $origin could not be read."; failed=1; continue; }
            if [ -z "$account" ]; then
              echo "#$number: its hold names no run of this workflow's events: left alone."
              continue
            fi
            echo "$at $number $account" >> "$RUNNER_TEMP/due"
          done
          while read -r at number account; do
            if (( ${used[$account]:-0} >= OUTSIDE_HOURLY_LIMIT )); then
              echo "#$number waits: $account had ${used[$account]} rescreens in the last hour, the limit is $OUTSIDE_HOURLY_LIMIT."
              continue
            fi
            if gh api --method POST "repos/$REPO/actions/workflows/review.yml/dispatches" -f ref=main \
                -f "inputs[number]=$number" -f "inputs[rescreen]=true" -f "inputs[account]=$account" > /dev/null; then
              used[$account]=$(( ${used[$account]:-0} + 1 ))
              echo "#$number: screened again (held at $at, for $account)."
            else
              echo "::error::the rescreen of #$number could not be started."
              failed=1
            fi
          done < <(sort "$RUNNER_TEMP/due")
          exit "$failed"
