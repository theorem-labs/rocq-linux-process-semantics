# review.yml: Claude reviews pull requests into main and issues by the rules in .github/review.md, and the review is
# posted as a comment there.
#
# Two workflows. CI (.github/workflows/ci.yml) runs on pull_request with the copy of ci.yml at the pull request's merge
# commit, a token that can only read, no secret and no identity token. This file runs when such a CI run completes
# (workflow_run), and on issues, issue_comment, schedule and workflow_dispatch. GitHub runs each of these events with
# main's copy of this file, so a pull request, from a fork or not, cannot change what runs here. From the CI run, the
# jobs that hold a right take only its head commit and head repository, by which the trust job finds the pull request
# among the open ones into main. They read the number, the head, the author, the text and the diff from the GitHub
# API, and never download an artifact of the CI run. The CI run's results reach the review as data: the head's check
# runs and statuses (.review/checks.json). A run by hand on a ref other than main runs no job: the if of each job
# checks the ref, so such a run holds no identity and posts nothing.
#
# Tasks. The trust job gives each run one task, and the jobs after it do that task alone:
#   review    a pull request's new head (the workflow_run of its CI run), a new issue of an account with write access,
#             or a run by hand with a number: the review comment.
#   answer    a new comment of an outside item's author in its conversation (issue_comment): the answer.
#   draft     a new issue of an outside author: a draft of the reply, which is stored and not posted.
#   reply     a run by hand with a reply text that Sami approved, which is posted as it is.
#   rescreen  a held item, screened again (below).
#   approve   a first-time contributor's pull request whose CI runs GitHub holds: the screen, and, when it passes, the
#             approval of the held runs. A run by hand with the task review on such a pull request gets this task.
#   catchup   an outside pull request whose head no run met: the OSS Verify App closes and reopens it, which starts CI.
#   conflict  a pull request with a merge conflict, for which GitHub starts no CI run: a comment that asks its author
#             to resolve the conflict.
#   relabel   the label and the label comment of a head, set again.
#   measure   the screen, measured on its private labelled set.
# An answer run, or a run by hand, that reads a merge conflict in its pull request gets the task conflict. The name of a
# run gives its task, its item and the account whose limit it counts on (run-name, below). The scripts that count runs
# read that name, and #<n> in it ends at a space or at the end of the name, so that #12 is never #123.
#
# Who is screened. Write access is what GitHub's collaborator permission API answers: admin or write (maintain counts
# as write). Membership of the organisation alone is not write access. The Apps in APPS count as having it.
#
# - When the item's author has write access, and so does the account whose action started the run, it is reviewed.
# - Otherwise it is screened first (the screen job, .github/screen.py). Independent checks read the text that the
#   account wrote: Google Cloud Model Armor's prompt injection and jailbreak filter, always; Azure AI Content Safety's
#   Prompt Shields, and a small Claude model with no tools whose answer a schema holds to the words clean and
#   suspicious, each when its identity is set up below. When every check that ran answers clean it is reviewed, as a
#   writer's is. Otherwise, and when a check that ran cannot answer, it is held: it gets the label review-held and a
#   short comment, and no review. Why it was held goes to a private bucket, never to this run's log or outputs. When
#   the account that started the run has no write access and its runs have reached the screen OUTSIDE_HOURLY_LIMIT
#   times in the last hour, it is held without a screen, and screened again later with no person (below).
# - An item held for a reason that is not its own is screened again with no person: at that limit; a screened review
#   stopped at SCREENED_HOURLY_CAP; or a screened review that failed or ran out of time, until it has failed
#   REVIEW_TRIES times. After REVIEW_TRIES rescreens since its hold that end with neither a new hold nor a posted
#   review, its hold comment says that it is not screened again. Every 15 minutes (the schedule below) the rescreen
#   job lists the open pull requests and issues labelled review-held whose newest hold comment is such a hold, not the
#   screen's, and is over an hour old, and starts this workflow for each with -f task=rescreen and the account the hold
#   names (-f account=<login>). Such a run takes an outsider's path: the trust job reads the author, the hold and the
#   account again from the API, never from the inputs alone, and the item is screened, then reviewed and the review
#   posted, as for an event; only when the author and that account both have write access is it reviewed without the
#   screen, as a writer's item is. When that account has no write access, its screen counts toward the account's
#   OUTSIDE_HOURLY_LIMIT with the account's own runs, so an account still at the limit stays held, and its hold comment
#   says from when it is tried again. An account with write access has no such limit: its rescreens are bounded by the
#   rescreen job's count alone (below). An item that the screen held is never screened again this way.
# - An account with write access can start a run by hand for any pull request or issue, with a task (-f task=<task>,
#   review when none is given) and, for a review, with the screen first (-f screen=true):
#
#   gh workflow run review.yml -R theorem-labs/rocq-linux-process-semantics -f number=<n>
#
# or "Run workflow" on this workflow's page in the Actions tab. GitHub lets only an account with write access start a
# run that way. An App must be one of the APPS. A run that github-actions[bot] starts (the rescreen job's) is taken
# only for that job's tasks, and only when its name is the one that job gives the task and what it names reads the
# same from the API now. Every review reads the comments and reviews of the author and of accounts with write access,
# and no others.
#
# - The screen can be measured: -f task=measure, with no number, runs every listed check three times
#   (-f measure_repeats=<1-5>) on each text of a labelled set kept in the private bucket (-f measure_set=
#   measure/set-v<n>.json, by default measure/set-v1.json), and puts the false holds and missed injections of each
#   rule of SCREEN_RULE's choices in the run's summary. The texts, and each check's words for
#   them, stay in the bucket.
#
# The jobs, and what each one holds:
#   trust   decides the task and the route: review, screen, or held at the limit. It checks nothing out, and its token
#           can only read metadata, pull requests and issues, and this workflow's runs.
#   gather  reads the pull request or the issue as data into .review/, and keeps it as this run's artifact, which the
#           screen job and the review job both take, by its SHA-256: the review reads what the screen passed. Its
#           token can only read, and it holds no model.
#   screen  runs in the environment review-screen. Its identity token is exchanged for short-lived tokens, which only
#           a job in that environment can get, and for Google Cloud and Anthropic only a job of this file on main:
#           Google Cloud (Model Armor, and adding the reason to its bucket), Azure (Prompt Shields) and Anthropic (a
#           service account of its own, not the review's). Two steps sign in before the screen: one to Google Cloud,
#           and one to Anthropic and Azure, which writes their tokens to a file in the runner's temporary directory
#           that the Screen step reads and deletes. A sign-in that fails fails the job before the screen, with no
#           verdict. SCREEN_CHECKS names the checks that run. Its GitHub token can only read, and no key is stored.
#           The checks get the text as data, and each answers a word; none can act on it. The screen reads up to
#           400,000 characters of an item and holds a longer one unread. Claude reads the text in pieces of at most
#           150,000 characters. A check that has not answered after 600 seconds holds the item. Its one output is the
#           verdict.
#   review  reads .review/, with this repository's main and the Linux and QEMU source the model describes, and asks
#           Claude for the comment, its verdict and the list of what it asks (.github/review.md). It holds an identity
#           token, which Anthropic exchanges for a short-lived token that can call Claude and nothing else; no key is
#           stored. Anthropic's federation rule admits this file alone, on refs/heads/main, for this file's events,
#           and refuses a job in review-screen, so the screen job cannot get the review's Claude token. The review job
#           cannot get the screen's tokens either: they need the environment. Its first step after the checkout signs
#           in to Anthropic and drops the token, so that a run the rule does not admit fails there, before the model.
#           After the model, a step signs in again for the fresh reader: a second Claude request, with no tools, that
#           shortens the comment (.github/review/trim.py). Code adds each listed item that the shorter text left out,
#           and the whole review in a collapsed block. While SOUNDNESS_HOLD is true, code also gives the verdict person
#           to the review of an outside pull request that adds, changes or deletes a .v file, and adds the section on
#           soundness after the shorter text (.github/review/rules.py soundness).
#   post    runs in the environment post, which only main reaches and which holds the OSS Verify App's key. It does
#           the App's writes alone, each after a step of its own that mints a token for this repository alone: one
#           with checks: write and pull-requests: write, and one with actions: write alone, only for an approval
#           whose screen passed. It posts no comment and no label, holds no identity token and no model, and its own
#           GitHub token can only read.
#   comment posts the review comment, or replaces the one it posted before, when POST_REVIEW says so, takes the label
#           review-held off, and sets the state label and the label comment (below); for a merge conflict, it posts
#           the comment that asks the author to resolve it, with the label waits-on-author. It uses this run's GitHub
#           token, so none of its comments and labels starts a run of any workflow.
#   hold    labels a held pull request or issue review-held, says so in a comment, and sets the state label and the
#           label comment. It holds no model, and has no screen's reason to read: the screen job's one output is its
#           verdict. It reads this run's jobs and this workflow's runs: did a step that signs in fail (then it holds
#           nothing, and the schedule takes the item again), was the review stopped at the cap, or cancelled by a
#           newer run of the same item and task?
#   rescreen
#           runs on the schedule alone, in the public repository alone, and starts the runs that screen a held item
#           again. It is the only job with actions: write, which it needs to start a run. Its issues and pull-requests:
#           write let it replace the hold comment of an item whose rescreens reached REVIEW_TRIES without settling, with
#           one that says that it is not screened again automatically, and give the item waits-on-theorem. It reads the
#           held items and this workflow's runs, and holds no model.
#
# Labels (.github/review.md, "Outside items and labels"). Each outside item has one state label: waits-on-author when
# the next step is its author's, waits-on-theorem when the next step is Sami's, and none while the workflow works on
# it. The comment, hold and rescreen jobs set it in the run of the event that changes the state, by the one rule of
# .github/review/rules.py, and setting one takes the other off. With it, the item gets one label comment of the
# workflow, edited in place, which names the next step and who takes it. review-held, the mark of a hold, stays beside
# the state label.
#
# No job runs code of a pull request. The gather job checks out main, never the pull request; it reads the pull
# request's diff and files from git objects as data under .review/, with every CLAUDE.md, AGENTS.md and .claude/ taken
# out. Claude gets the tools Read, Glob and Grep only, in the permission mode dontAsk (a call that would need approval
# is refused), and reads nothing outside the checkout: not the runner's temporary files, which hold the identity
# token, the Claude token and git's own files, nor /proc. It can run nothing and write nothing. The screen job runs
# only .github/screen.py from main, and the review job runs .github/review/trim.py from main after Claude. The comment,
# hold and rescreen jobs check out main's .github/ alone, and run only .github/review/rules.py from it. The post job
# checks out nothing.
#
# The sign-ins are admitted by rules outside this repository that name this file, main and its events. Until those
# rules admit the events workflow_run and issue_comment, the screen and review jobs of such runs fail at sign-in, and
# the schedule's runs by hand on main take the item again. Until the environment post holds the App's key, the post
# job's sign-ins fail, and nothing else does.
#
# Never re-run this workflow with debug logging. A debug run prints the whole conversation with the model, with the
# pull request's or the issue's text, in the run's log, and anyone can read the logs of a public repository.
name: review
# The name of each run: its task, its item and the account whose limit it counts on, which the trust job, the Count
# step, the hold job and the rescreen job read. A workflow_run's name holds the whole head commit, because GitHub's
# expressions have no substring function, and that head maps to its pull request through the open pull requests. A
# run by hand: <task> #<n>, then " at <head>", " for <comment>" and " of <account>" for the inputs given.
run-name: >-
  ${{ github.event_name == 'schedule' && 'rescreen the held items'
  || github.event_name == 'workflow_run'
     && format('review {0} by {1}', github.event.workflow_run.head_sha, github.actor)
  || github.event_name == 'issues' && format('review #{0}', github.event.issue.number)
  || github.event_name == 'issue_comment'
     && format('answer #{0} by {1}', github.event.issue.number, github.event.comment.user.login)
  || inputs.task == 'measure' && 'measure the screen'
  || format('{0} #{1}{2}{3}{4}', inputs.task, inputs.number, inputs.head && format(' at {0}', inputs.head) || '',
            inputs.comment && format(' for {0}', inputs.comment) || '',
            inputs.account && format(' of {0}', inputs.account) || '') }}

on:
  # Each completed run of CI; the trust job takes only a run of a pull request's event.
  workflow_run:
    workflows: [CI]
    types: [completed]
  issues:
    types: [opened, reopened]
  # Each new comment on an issue or a pull request; the trust job takes only one of the item's author.
  issue_comment:
    types: [created]
  # The rescreen job's own minutes, off the hour: :07, :22, :37 and :52.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      number:
        description: Number of the pull request or issue (none when measuring)
        required: false
        type: number
      task:
        description: What the run does (the top of this file)
        type: choice
        default: review
        options: [review, answer, draft, reply, rescreen, approve, catchup, conflict, relabel, measure]
      screen:
        description: With the task review, screen it first, as the item of an account without write access is screened
        type: boolean
        default: false
      reply:
        description: With the task reply, the text that Sami approved, which is posted as it is
        type: string
        default: ""
      account:
        description: The account whose hourly limit the run counts on (the rescreen job sets it)
        type: string
        default: ""
      comment:
        description: With the task answer, the id of the author's comment to answer
        type: string
        default: ""
      head:
        description: The head commit of the pull request that the run is about
        type: string
        default: ""
      measure_set:
        description: With the task measure, the labelled set to measure on, an object of the private bucket (measure/set-v<n>.json)
        type: string
        default: measure/set-v1.json
      measure_repeats:
        description: With the task measure, how many times each check answers each text of the set
        type: number
        default: 3

permissions: {}

env:
  # This repository's decision: "true" posts each review as a comment on its pull request or issue; any other value
  # keeps it in the run's summary only.
  POST_REVIEW: "true"
  # The Apps that count as having write access: this organisation's own, and legion-reviewer[bot], which starts the run
  # that posts an approved reply. The Review step admits no other App, except an App whose pull request or issue the
  # screen passed, and github-actions[bot] for a run of the rescreen job that the trust job accepted.
  APPS: "sjawhar-agent[bot],oss-verify[bot],legion-reviewer[bot]"
  # The most reviews that may call the model in one hour. An agent of ours can open many pull requests at once, and
  # the screen passes others', so a burst must not start model runs without limit. A run at the cap stops before the
  # model, and the run is red; a maintainer can re-run it once the hour has passed. A run that the trust job stops, or
  # that the screen holds, never counts. The reviews of screened items count toward SCREENED_HOURLY_CAP instead.
  HOURLY_CAP: "10"
  # The same cap for the reviews of screened pull requests and issues, counted apart, so that accounts without write
  # access cannot use up HOURLY_CAP. A screened run at this cap is held. It is above OUTSIDE_HOURLY_LIMIT, so one
  # account cannot fill it alone; several new accounts together still can, and then the others' items are held.
  SCREENED_HOURLY_CAP: "6"
  # The most runs that one account without write access may start in an hour and have screened: its next pull request,
  # issue, push or comment in that hour is held without a screen. Every run its event started that the trust job did
  # not skip counts, the held ones too, so a burst stays held until an hour has passed since its runs. A run whose
  # screen or review could not sign in does not count: the schedule takes its item again.
  # The runs that the rescreen job starts for its held items count toward the same limit, with its events (their names
  # end with " of <account>"): so N, the most rescreens of one
  # account that are screened in an hour, is this number less what its own events used. (The rescreen job starts up
  # to this number of an account's rescreens an hour whatever its events used, and the trust job holds the extra ones
  # at the limit.) One count and one limit, because a rescreen is the screen that the held event did not get: it gives
  # an account no more screens an hour than its events alone could, which keeps it under SCREENED_HOURLY_CAP, so one
  # account cannot fill that pool. A smaller N for rescreens would only leave a burst held for longer; an account that
  # keeps opening, pushing or reopening stays held. An account with write access has no such limit (a writer's push to
  # an outsider's item, whose cap or transient hold names the writer's run): the rescreen job still starts at most this
  # number of its rescreens an hour.
  OUTSIDE_HOURLY_LIMIT: "3"
  # The label a held pull request or issue gets, and the marker of the comment that says so.
  HELD_LABEL: review-held
  # The most times the review of a screened item that the screen passed may fail, or run out of time, before a person
  # decides: each such hold is tried again with no person (the rescreen job) while it has failed fewer times than this
  # number, and the hold of the last failure is not. A review stopped at SCREENED_HOURLY_CAP is not such a failure,
  # and is tried again whatever this number: the cap is not the item's.
  # It is also the most rescreens of a held item, since its hold, that may end with neither a new hold nor a posted
  # review (a run that failed on a GitHub read, say) before the rescreen job leaves it to a person.
  REVIEW_TRIES: "3"
  # The soundness hold of R8 (.github/review.md, "Soundness of a Rocq proof"). Stock Rocq accepts three public proofs
  # of False: rocq-prover/rocq#22651, #22760 and #22772. The checks that the import's copy of a pull request must pass,
  # in theorem-labs/rocq-linux-process-semantics-internal, run stock Rocq, as this repository's CI lanes do. While this
  # is "true", code gives the review of an outside pull request that adds, changes or deletes a .v file the verdict
  # person and a section on soundness, whatever the model wrote (.github/review/rules.py soundness). The hold lasts
  # until those checks run a Rocq with the fixes for the three issues: only then set another value. Another value also
  # ends R12's Markdown-only rule: while the hold lasts, the post job records the import's check run only for a pull
  # request whose changed files are all Markdown files.
  SOUNDNESS_HOLD: "true"

jobs:
  # The task and the route of a run (the top of this file). Nothing runs in a fork of this repository, nor for a run by
  # hand on a ref other than main. A scheduled run is the rescreen job's alone. A workflow_run is taken only for a CI
  # run of a pull request's event that was not cancelled, skipped or held (GitHub holds a first-time contributor's run,
  # whose approval is the task approve); an issue_comment only for a comment of the item's author that no App wrote.
  trust:
    if: >-
      github.repository_id == 1425819621 && github.ref == 'refs/heads/main' && github.event_name != 'schedule'
      && (github.event_name != 'workflow_run'
          || (github.event.workflow_run.path == '.github/workflows/ci.yml'
              && github.event.workflow_run.event == 'pull_request'
              && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.conclusion != 'skipped'
              && github.event.workflow_run.conclusion != 'stale'
              && github.event.workflow_run.conclusion != 'action_required'))
      && (github.event_name != 'issue_comment'
          || (github.event.comment.user.login == github.event.issue.user.login
              && github.event.comment.user.type != 'Bot'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions: read for OUTSIDE_HOURLY_LIMIT, which reads this workflow's runs, and for a head's held runs; issues and
    # pull-requests: read for the item, its comments and its events, and the open pull requests.
    permissions: {actions: read, issues: read, pull-requests: read}
    outputs:
      # review, answer, draft, reply, rescreen, approve, catchup, conflict, relabel or measure (the top of this file).
      task: ${{ steps.trust.outputs.task }}
      # review (no screen), screen (the screen first), limit (held at OUTSIDE_HOURLY_LIMIT) or measure.
      route: ${{ steps.trust.outputs.route }}
      outsider: ${{ steps.trust.outputs.outsider }}
      number: ${{ steps.trust.outputs.number }}
      # The head commit of a pull request, as the API gave it to the trust job.
      head: ${{ steps.trust.outputs.head }}
      # The account whose limit the run counts on: the one whose action started it, or the one its hold or its name
      # gives.
      account: ${{ steps.trust.outputs.account }}
      # The comment that an answer answers.
      comment: ${{ steps.trust.outputs.comment }}
      # The run whose event this item's hold names (a hold that is tried again), and the screened reviews of the item
      # that failed so far, which a hold of a review that did not finish counts on.
      origin: ${{ steps.trust.outputs.origin }}
      tries: ${{ steps.trust.outputs.tries }}
      started: ${{ steps.trust.outputs.started }}
    steps:
      - name: Whether the author and the account that started the run have write access
        id: trust
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.issue.number || inputs.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
          ACTOR: ${{ github.actor }}
          TASK: ${{ inputs.task }}
          SCREEN: ${{ inputs.screen }}
          ACCOUNT: ${{ inputs.account }}
          COMMENT: ${{ github.event.comment.id || inputs.comment }}
          HEAD: ${{ github.event.workflow_run.head_sha || inputs.head }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # trusted
          # trusted <login>: 0 when <login> is one of the APPS, or an account that GitHub's collaborator permission API
          # gives admin or write; 1 when it is neither; 2 when the API could not say.
          trusted() {
            local permission
            [[ $1 =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || return 1
            [[ ,$APPS, != *",$1,"* ]] || return 0
            [[ $1 != *'[bot]' ]] || return 1
            permission=$(gh api "repos/$REPO/collaborators/$1/permission" --jq .permission) || return 2
            [[ $permission == admin || $permission == write ]]
          }
          # end of trusted
          # known <login>: trusted's answer, 0 or 1; the run stops when GitHub could not say.
          known() {
            local rc=0
            trusted "$1" || rc=$?
            (( rc != 2 )) || { echo "::error::GitHub did not say whether $1 has write access. Re-run this run."; exit 1; }
            return "$rc"
          }
          # held
          # titled: the names of the runs that the rescreen job starts and that name an account (run-name):
          # <task> #<n>[ at <head>][ for <comment>] of <login>. BASH_REMATCH[2] is then the number, and [5] the login.
          titled='^(rescreen|review|answer|draft|approve) #([1-9][0-9]*)( at [0-9a-f]{40})?( for [1-9][0-9]*)? of ([A-Za-z0-9-]+(\[bot\])?)$'
          # limit_hold <number>: "<time> <run> <tries> <kind>" of the newest hold comment of <number> when it is one
          # that the rescreen job tries again (its marker <!-- review-held-<kind> <run> <tries> -->): <kind> is limit
          # (OUTSIDE_HOURLY_LIMIT), cap (SCREENED_HOURLY_CAP) or transient (a screened review that failed or ran out of
          # time), <run> the run of the event this hold comes from (a rescreen keeps it), and <tries> the screened
          # reviews of it that failed so far.
          # "<time> -" when the hold is not tried again (the screen held it, or its tries are used up). Nothing when it
          # has no hold comment. Only github-actions[bot]'s comments count.
          limit_hold() {
            gh api --paginate "repos/$REPO/issues/$1/comments" --jq '.[]
              | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- review-held -->")))
              | "\(.updated_at) \((.body
                  | capture("\n<!-- review-held-(?<kind>limit|cap|transient) (?<run>[0-9]+)(?: (?<tries>[0-9]+))? -->(\n|$)")
                  | "\(.run) \(.tries // "0") \(.kind)") // "-")"' \
              | sort | tail -n 1
          }
          # held_account <run>: the account whose limit a hold of <run> counts on, when <run> is a run of this
          # workflow: the account that started it, for a run of workflow_run, issues or issue_comment; the account its
          # name ends with, for a run that github-actions[bot] started (the rescreen job's) with one of that job's
          # names (titled); the account that started it, for a run by hand of an App in APPS or of an account with
          # write access, which has no limit. Nothing for any other run, or when GitHub no longer has it (a deleted or
          # expired run). It fails when GitHub could not say.
          held_account() {
            local workflow run id event login title permission
            [[ $1 =~ ^[1-9][0-9]*$ ]] || return 0
            workflow=$(gh api "repos/$REPO/actions/workflows/review.yml" --jq .id) || return 1
            run=$(gh api "repos/$REPO/actions/runs/$1" \
              --jq '"\(.workflow_id) \(.event) \(.actor.login) \(.display_title // "" | gsub("[\r\n]"; " "))"' 2>&1) \
              || { [[ $run == *"(HTTP 404)"* ]] || return 1; return 0; }
            read -r id event login title <<< "$run"
            [[ $id == "$workflow" && $login =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || return 0
            case $event in
              workflow_run|issues|issue_comment) echo "$login" ;;
              workflow_dispatch)
                if [ "$login" = 'github-actions[bot]' ]; then
                  if [[ $title =~ $titled ]]; then echo "${BASH_REMATCH[5]}"; fi
                elif [[ ,$APPS, == *",$login,"* ]]; then
                  echo "$login"
                elif [[ $login != *'[bot]' ]]; then
                  permission=$(gh api "repos/$REPO/collaborators/$login/permission" --jq .permission) || return 1
                  if [[ $permission == admin || $permission == write ]]; then echo "$login"; fi
                fi ;;
            esac
          }
          # end of held
          # earlier <login>: sets count to how many runs of this workflow in the last hour, before this run, the trust
          # job did not skip and either <login> started by an event (workflow_run, issues or issue_comment), or whose
          # name, a name of the rescreen job's (titled), ends with " of <login>": the trust job of a run that
          # github-actions[bot] started checks that name. A run whose trust job is not listed yet counts. A run by hand
          # that its trust job refused (the item closed, or lost its label, in between), so that every other job of it
          # was skipped, screened nothing and does not count. The rescreen job, which every dispatched run skips, is not
          # one of those jobs: a run whose trust job has just accepted it and whose next jobs are not listed yet counts.
          # A run whose screen or review job stopped at a failed step whose name starts with "Sign in" could not sign
          # in, and does not count: the schedule takes its item again, and that run must not find the account at its
          # limit because of it. The jobs read for each run that would count show it, so nothing more is read.
          # The run stops when GitHub could not say.
          earlier() {
            local from runs id kind verdict
            count=0
            from=$(date -u -d '-1 hour' +%Y-%m-%dT%H:%M:%SZ)
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            runs=$(LOGIN=$1 TITLED=$titled gh api --method GET --paginate "repos/$REPO/actions/workflows/review.yml/runs" \
              -f created=">=$from" -F per_page=100 --jq '.workflow_runs[] | (.display_title // "") as $title
                | select(.id < ($ENV.RUN_ID | tonumber)
                         and ((.actor.login == $ENV.LOGIN
                               and (.event == "workflow_run" or .event == "issues" or .event == "issue_comment"))
                              or (.event == "workflow_dispatch" and ($title | test($ENV.TITLED))
                                  and ($title | endswith(" of " + $ENV.LOGIN)))))
                | "\(.id) \(if .event == "workflow_dispatch" then "dispatch" else "event" end)"') \
              || { echo "::error::the runs of this workflow could not be read. Re-run this run."; exit 1; }
            while read -r id kind; do
              [ -n "$id" ] || continue
              [[ $id =~ ^[0-9]+$ ]] || { echo "::error::a run id is not a number. Re-run this run."; exit 1; }
              # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
              verdict=$(KIND=$kind gh api --method GET --paginate "repos/$REPO/actions/runs/$id/jobs" -F per_page=100 \
                --jq '([.jobs[] | select(.name == "trust")] | first) as $t
                  | [.jobs[] | select(.name != "trust" and .name != "rescreen")] as $rest
                  | if $t == null then "count" elif $t.conclusion == "skipped" then "skip"
                    elif $ENV.KIND == "dispatch" and $t.status == "completed" and ($rest | length) > 0
                         and ($rest | all(.conclusion == "skipped")) then "skip"
                    elif any($rest[] | select(.name | test("^(screen|review)( |$)")) | .steps[]?;
                             (.name | startswith("Sign in")) and .conclusion == "failure") then "signin"
                    else "count" end') \
                || { echo "::error::the jobs of run $id could not be read. Re-run this run."; exit 1; }
              if [[ $verdict == *count* ]]; then count=$((count + 1)); fi
            done <<< "$runs"
          }
          fail() { echo "::error::$1 Re-run this run."; exit 1; }
          # origin: the run whose event this item's hold names, for a hold that is tried again; tries: the screened
          # reviews of the item that failed so far, which a rescreen carries from its hold to the next.
          task="" head="" comment="" of="" tries=0 origin=$RUN_ID account=$ACTOR
          # route <route> <outsider>: the outputs, and the end of this step.
          route() {
            echo "#$NUMBER: the task $task, the route $1."
            { echo "task=$task"; echo "route=$1"; echo "outsider=$2"; echo "number=$NUMBER"; echo "head=$head"
              echo "account=$account"; echo "comment=$comment"; echo "origin=$origin"; echo "tries=$tries"
              echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; } >> "$GITHUB_OUTPUT"
            exit 0
          }
          # stop <why>: no route, so no job after this one runs.
          stop() {
            local what="#$NUMBER"
            [ -n "$NUMBER" ] || what="commit $HEAD"
            echo "::notice::No ${task:-run} of $what: $1"
            exit 0
          }
          # screened <author> <account>: the route of an item of <author> for an action of <account>: no screen when
          # both have write access; else the screen first, for the account without write access whose action it is
          # (<account>, or else <author>); or held at the limit with no screen, when <account> has no write access and
          # its runs reached the screen OUTSIDE_HOURLY_LIMIT times in the last hour. A writer's action on an outsider's
          # item has no limit. No <account> is the action of a person or an App that started a run by hand, which
          # GitHub lets only a writer do: the API is not asked.
          screened() {
            local a=0 b=0 outsider
            known "$1" || a=$?
            if [ -n "$2" ]; then known "$2" || b=$?; fi
            (( a != 0 || b != 0 )) || route review ""
            outsider=$1
            (( b == 0 )) || outsider=$2
            [[ $outsider =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || stop "$outsider is not a GitHub login."
            echo "::notice::#$NUMBER is screened first: $outsider has no write access."
            if (( b != 0 )); then
              earlier "$2"
              (( count < OUTSIDE_HOURLY_LIMIT )) || route limit "$outsider"
            fi
            route screen "$outsider"
          }
          # item: what the API says of #NUMBER now: state, AUTHOR, kind (pr or issue), is_draft, and labelled (with
          # HELD_LABEL); for a pull request also merged, base, pr_head (its head commit) and mergeable (its
          # mergeable_state: dirty for a merge conflict).
          item() {
            local data
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            data=$(gh api "repos/$REPO/issues/$NUMBER" --jq '[.state, .user.login,
              (if .pull_request then "pr" else "issue" end), ((.draft // false) | tostring),
              (any(.labels[]?; .name == $ENV.HELD_LABEL) | tostring)] | join(" ")') || fail "#$NUMBER could not be read."
            read -r state AUTHOR kind is_draft labelled <<< "$data"
            merged=false base="" pr_head="" mergeable=""
            if [ "$kind" = pr ]; then
              data=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '[((.merged // false) | tostring), .base.ref, .head.sha,
                (.mergeable_state // "unknown")] | join(" ")') || fail "pull request #$NUMBER could not be read."
              read -r merged base pr_head mergeable <<< "$data"
            fi
          }
          # held_runs: how many runs of the head pr_head GitHub holds for a person's approval (status action_required).
          held_runs() {
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            SHA=$pr_head gh api --method GET --paginate "repos/$REPO/actions/runs" -f head_sha="$pr_head" \
              -f status=action_required -F per_page=100 --jq '[.workflow_runs[] | select(.status == "action_required"
                and .head_sha == $ENV.SHA and .event == "pull_request")] | length' | awk '{ n += $1 } END { print n + 0 }'
          }
          # replied: true when the label comment of #NUMBER says that its first reply posted.
          replied() {
            local n
            n=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" --jq '[.[]
              | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- review-label -->"))
                       and (.body | test("(^|\n)<!-- issue-reply-posted [0-9]+ -->(\n|$)")))] | length' \
              | awk '{ n += $1 } END { print n + 0 }') || fail "the comments of #$NUMBER could not be read."
            (( n > 0 ))
          }
          # comment_author: the author of the comment COMMENT, when it is an issue comment, a review comment or a
          # review of #NUMBER. Nothing when it is none of them.
          comment_author() {
            local path out url login
            for path in "issues/comments/$COMMENT" "pulls/comments/$COMMENT" "pulls/$NUMBER/reviews/$COMMENT"; do
              [[ $kind == pr || $path == issues/* ]] || continue
              if out=$(gh api "repos/$REPO/$path" --jq '"\(.issue_url // .pull_request_url // "-") \(.user.login // "-")"' 2>&1); then
                read -r url login <<< "$out"
                if [[ $url == */issues/$NUMBER || $url == */pulls/$NUMBER ]]; then echo "$login"; return 0; fi
              else
                [[ $out == *"(HTTP 404)"* ]] || return 1
              fi
            done
          }
          # left_closed: true when #NUMBER is a pull request that a catch-up run closed and could not reopen: it is not
          # merged, and its newest closed event is oss-verify[bot]'s and falls between the start and the end of another
          # run of the task catchup of it whose post job failed or was cancelled (the closing run). A catchup run since
          # then that reopened it would have left it open, or closed by a newer event. The runs are read one day at a
          # time, from the day before the close to today, however long ago the close was.
          left_closed() {
            local closed at by day today runs id started ended post
            [ "$kind" = pr ] && [ "$merged" = false ] || return 1
            closed=$(gh api --paginate "repos/$REPO/issues/$NUMBER/events" --jq '.[] | select(.event == "closed")
              | "\(.created_at) \(.actor.login // "-")"' | sort | tail -n 1) || fail "the events of #$NUMBER could not be read."
            read -r at by <<< "$closed"
            [ "${by:-}" = 'oss-verify[bot]' ] || return 1
            [[ $at =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || return 1
            day=$(date -u -d "${at:0:10} -1 day" +%Y-%m-%d)
            today=$(date -u +%Y-%m-%d)
            while [[ ! $day > $today ]]; do
              # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
              runs=$(PATTERN="^catchup #$NUMBER( |\$)" gh api --method GET --paginate \
                "repos/$REPO/actions/workflows/review.yml/runs" -f event=workflow_dispatch -f created="$day" \
                -F per_page=100 --jq '.workflow_runs[]
                  | select(.event == "workflow_dispatch" and (.id | tostring) != $ENV.RUN_ID
                           and ((.display_title // "") | test($ENV.PATTERN)))
                  | "\(.id) \(.run_started_at // .created_at) \(if .status == "completed" then .updated_at else "-" end)"') \
                || fail "the runs of $day could not be read."
              while read -r id started ended; do
                [ -n "$id" ] || continue
                [[ $id =~ ^[0-9]+$ ]] || fail "a run id is not a number."
                if [[ $at < $started || ($ended != - && $ended < $at) ]]; then continue; fi
                post=$(gh api --method GET --paginate "repos/$REPO/actions/runs/$id/jobs" -F per_page=100 \
                  --jq '.jobs[] | select(.name == "post") | .conclusion // "running"') \
                  || fail "the jobs of run $id could not be read."
                if [[ $post == failure || $post == cancelled ]]; then return 0; fi
              done <<< "$runs"
              day=$(date -u -d "$day +1 day" +%Y-%m-%d)
            done
            return 1
          }
          [[ $OUTSIDE_HOURLY_LIMIT =~ ^[1-9][0-9]*$ ]] || { echo "::error::OUTSIDE_HOURLY_LIMIT is not a number"; exit 1; }
          [[ $RUN_ID =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a run id: $RUN_ID"; exit 1; }
          case $EVENT in
            # A pull request's new head: the one open pull request into main whose head is the CI run's head commit,
            # from the CI run's head repository. Its number, author and head come from the API. The account is the CI
            # run's actor (the pusher, also on a later attempt of that run), never the account that re-ran it.
            workflow_run)
              task=review
              [[ $HEAD =~ ^[0-9a-f]{40}$ && $HEAD_REPOSITORY =~ ^[1-9][0-9]*$ ]] \
                || stop "the CI run names no head commit and head repository."
              # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
              found=$(gh api --paginate "repos/$REPO/pulls?state=open&base=main&per_page=100" --jq '.[]
                | select(.head.sha == $ENV.HEAD and ((.head.repo.id // 0) | tostring) == $ENV.HEAD_REPOSITORY
                         and .base.ref == "main")
                | "\(.number) \((.draft // false) | tostring) \(.user.login)"') \
                || fail "the open pull requests could not be read."
              n=$(grep -c . <<< "$found" || true)
              (( n == 1 )) || stop "$n open pull requests into main have this head from its repository."
              read -r NUMBER is_draft AUTHOR <<< "$found"
              [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || fail "not a number: $NUMBER."
              [ "$is_draft" = false ] || stop "it is a draft."
              head=$HEAD
              screened "$AUTHOR" "$ACTOR" ;;
            # A new issue, or one reopened: a writer's is reviewed, and an outsider's gets a draft of its reply.
            issues)
              [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
              a=0
              known "$AUTHOR" || a=$?
              task=review
              (( a == 0 )) || task=draft
              screened "$AUTHOR" "$ACTOR" ;;
            # A new comment of the item's author (the job's if) is answered when the item is open, its author has no
            # write access and, on an issue, the first reply posted. A pull request with a merge conflict gets the task
            # conflict instead.
            issue_comment)
              task=answer
              [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
              [[ $COMMENT =~ ^[1-9][0-9]*$ ]] || stop "the event names no comment."
              comment=$COMMENT
              item
              head=$pr_head
              [ "$state" = open ] || stop "it is $state."
              [ "$AUTHOR" = "$ACTOR" ] || stop "the comment is $ACTOR's, not its author's ($AUTHOR)."
              a=0
              known "$AUTHOR" || a=$?
              (( a != 0 )) || stop "its author $AUTHOR has write access."
              [ "$kind" = pr ] || replied || stop "its first reply has not posted."
              if [ "$mergeable" = dirty ]; then task=conflict; route review ""; fi
              screened "$AUTHOR" "$ACTOR" ;;
            workflow_dispatch)
              task=${TASK:-review}
              case $task in
                review|answer|draft|reply|rescreen|approve|catchup|conflict|relabel|measure) ;;
                *) stop "it is not a task of this workflow." ;;
              esac
              # GitHub lets only an account with write access start a run by hand; an App must be one of the APPS, as
              # the Review step's allowed_bots says. github-actions[bot] is the rescreen job's dispatch, made with that
              # job's token, which has actions: write: it is taken only for the tasks that job starts, with the name
              # that job gives the task (below), and never for a reply or a measurement.
              if [ "$ACTOR" = 'github-actions[bot]' ]; then
                case $task in reply|measure) stop "github-actions[bot] starts no run of this task." ;; esac
              elif [[ $ACTOR == *'[bot]' ]]; then
                known "$ACTOR" || stop "the App that started this run ($ACTOR) is not one of the APPS."
              fi
              # A measurement of the screen reads no pull request or issue (the screen job's Measure step).
              if [ "$task" = measure ]; then NUMBER=""; route measure ""; fi
              [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
              [[ -z $HEAD || $HEAD =~ ^[0-9a-f]{40}$ ]] || stop "$HEAD is not a head commit."
              [[ -z $COMMENT || $COMMENT =~ ^[1-9][0-9]*$ ]] || stop "$COMMENT is not a comment id."
              comment=$COMMENT
              item
              head=$pr_head
              [[ -z $HEAD || $HEAD == "$pr_head" ]] || stop "its head is ${pr_head:-none}, not $HEAD."
              # A closed item gets no task, but the catch-up of a pull request that a catch-up run closed and could not
              # reopen: that run reopens it, and closes nothing.
              if [ "$state" != open ]; then
                [ "$task" = catchup ] && left_closed || stop "it is $state."
              fi
              [ "$kind" != pr ] || [ "$base" = main ] || stop "it is into $base, not main."
              case $task in
                draft|reply) [ "$kind" = issue ] || stop "it is not an issue." ;;
                approve|catchup|conflict|relabel) [ "$kind" = pr ] || stop "it is not a pull request." ;;
              esac
              # The rescreen job's name for the task, from what the API says now: the item, its head, and its author
              # when the author has no write access (a rescreen names the account its hold names, checked below). The
              # account a name gives is the one whose limit the run counts on; a run by hand of a person or an App
              # counts on none.
              limited=""
              if [ "$ACTOR" = 'github-actions[bot]' ]; then
                [ "$is_draft" = false ] || stop "it is a draft."
                a=0
                known "$AUTHOR" || a=$?
                (( a == 0 )) || of=" of $AUTHOR"
                case $task in
                  rescreen) want="rescreen #$NUMBER of $ACCOUNT" ;;
                  review|approve) want="$task #$NUMBER at $pr_head$of" ;;
                  answer) want="answer #$NUMBER for $COMMENT$of" ;;
                  draft) want="draft #$NUMBER$of" ;;
                  *) want="$task #$NUMBER at $pr_head" ;;
                esac
                title=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.display_title // ""') \
                  || fail "this run could not be read."
                [ "$title" = "$want" ] || stop "its name \"$title\" is not the rescreen job's for it (\"$want\")."
                account=$ACCOUNT limited=$ACCOUNT
              fi
              case $task in
                # A held item screened again: an outsider's path, decided from what the API says now, never from the
                # inputs alone. The item must be held, its newest hold must be one that is tried again (at the limit,
                # at the cap, or a review that did not finish), and the run that hold names must give the account that
                # the inputs give.
                rescreen)
                  [ "$is_draft" = false ] || stop "it is a draft."
                  [ "$labelled" = true ] || stop "it is not labelled $HELD_LABEL."
                  hold=$(limit_hold "$NUMBER") || fail "the comments of #$NUMBER could not be read."
                  read -r _ origin tries _ <<< "$hold"
                  [[ -n $origin && $origin != - ]] || stop "it has no hold that is tried again."
                  [[ $tries =~ ^[0-9]+$ ]] || stop "its hold names no count of tries."
                  account=$(held_account "$origin") || fail "run $origin could not be read."
                  [ -n "$account" ] || stop "its hold names no run whose account this workflow can tell."
                  [ "$ACCOUNT" = "$account" ] || stop "the account its hold names is $account, not ${ACCOUNT:-none}."
                  if [ "$mergeable" = dirty ]; then task=conflict; route review ""; fi
                  # A writer's item whose hold names a writer's run (at the cap, or a review that did not finish) is
                  # reviewed without the screen.
                  screened "$AUTHOR" "$account" ;;
                # A review, or the screen first when the inputs ask for it. A review by hand of a pull request whose
                # head has runs that GitHub holds gets the task approve, which screens it and approves them.
                review)
                  if [ "$mergeable" = dirty ]; then task=conflict; route review ""; fi
                  if [ "$ACTOR" = 'github-actions[bot]' ]; then
                    [ -z "$of" ] || screened "$AUTHOR" "$limited"
                    route review ""
                  fi
                  if [ "$kind" = pr ]; then
                    n=$(held_runs) || fail "the runs of $pr_head could not be read."
                    if (( n > 0 )); then task=approve; screened "$AUTHOR" "$limited"; fi
                  fi
                  [ "$SCREEN" != true ] || route screen ""
                  route review "" ;;
                # The answer to a comment of the item's author, as for the event issue_comment.
                answer)
                  [ -n "$COMMENT" ] || stop "it names no comment to answer."
                  who=$(comment_author) || fail "comment $COMMENT could not be read."
                  [ -n "$who" ] || stop "comment $COMMENT is not one of #$NUMBER."
                  [ "$who" = "$AUTHOR" ] || stop "comment $COMMENT is $who's, not its author's ($AUTHOR)."
                  a=0
                  known "$AUTHOR" || a=$?
                  (( a != 0 )) || stop "its author $AUTHOR has write access."
                  [ "$kind" = pr ] || replied || stop "its first reply has not posted."
                  if [ "$mergeable" = dirty ]; then task=conflict; route review ""; fi
                  screened "$AUTHOR" "$limited" ;;
                # The draft of the reply to an outside author's issue.
                draft)
                  a=0
                  known "$AUTHOR" || a=$?
                  (( a != 0 )) || stop "its author $AUTHOR has write access."
                  screened "$AUTHOR" "$limited" ;;
                # A reply text that Sami approved: no screen and no model.
                reply) route review "" ;;
                # The screen of a first-time contributor's pull request, and the approval of its held runs when it
                # passes. The rescreen job's run needs held runs at the head.
                approve)
                  if [ "$mergeable" = dirty ]; then task=conflict; route review ""; fi
                  if [ "$ACTOR" = 'github-actions[bot]' ]; then
                    n=$(held_runs) || fail "the runs of $pr_head could not be read."
                    (( n > 0 )) || stop "GitHub holds no run of $pr_head."
                  fi
                  screened "$AUTHOR" "$limited" ;;
                # The comment that asks the author to resolve a merge conflict, while the conflict is there.
                conflict)
                  [ "$mergeable" = dirty ] || stop "it has no merge conflict (its mergeable_state is ${mergeable:-unknown})."
                  route review "" ;;
                # The App's close and reopen, or only the reopen of a pull request that a catch-up run closed, and the
                # label set again: no screen and no model.
                catchup|relabel)
                  if [ "$state" = open ] && [ "$mergeable" = dirty ]; then task=conflict; fi
                  route review "" ;;
              esac ;;
            *) echo "::error::not an event of this workflow: $EVENT"; exit 1 ;;
          esac

  # Data only: nothing gathered here runs, and this job holds no model. The number, the head, the author and the text
  # come from the GitHub API, never from the CI run. The pull request's files come from git objects of its head
  # (git diff, git cat-file), never from a checkout, so no attribute, filter or hook of the pull request applies. What
  # .review/ leaves out is listed in omitted.txt. It is kept as one tar file, so that no file name of the pull request
  # can stop the upload, for a day, and the screen and review jobs take it by its SHA-256.
  gather:
    needs: trust
    if: >-
      github.ref == 'refs/heads/main'
      && (needs.trust.outputs.route == 'review' || needs.trust.outputs.route == 'screen')
      && (needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {contents: read, pull-requests: read, issues: read, checks: read, statuses: read}
    outputs:
      kind: ${{ steps.what.outputs.kind }}
      number: ${{ steps.what.outputs.number }}
      digest: ${{ steps.keep.outputs.digest }}
      # true for an outside item: its author has no write access and is not one of the APPS. The review's prompt says
      # which it is (.github/review.md, "Outside items and labels"), and the soundness rule reads it (SOUNDNESS_HOLD).
      outside: ${{ steps.gather.outputs.outside }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with: {persist-credentials: false, fetch-depth: 0}

      - name: What to review
        id: what
        env:
          NUMBER: ${{ needs.trust.outputs.number }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          kind=$(gh api "repos/$REPO/issues/$NUMBER" --jq 'if .pull_request then "pr" else "issue" end')
          echo "Reviewing $kind #$NUMBER."
          { echo "kind=$kind"; echo "number=$NUMBER"; } >> "$GITHUB_OUTPUT"

      - name: Gather the pull request or issue
        id: gather
        env:
          KIND: ${{ steps.what.outputs.kind }}
          NUMBER: ${{ steps.what.outputs.number }}
          # The head the trust job read from the API. When the pull request has moved on since, a newer push started
          # its own CI run, and so its own run of this file, which the trust job judged by that push's account: this
          # run gathers nothing, and so neither screens nor reviews.
          EVENT_HEAD: ${{ needs.trust.outputs.head }}
        run: |
          set -euo pipefail
          out=.review
          mkdir -p "$out"
          : > "$out/omitted.txt"
          # trusted
          # trusted <login>: 0 when <login> is one of the APPS, or an account that GitHub's collaborator permission API
          # gives admin or write; 1 when it is neither; 2 when the API could not say.
          trusted() {
            local permission
            [[ $1 =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || return 1
            [[ ,$APPS, != *",$1,"* ]] || return 0
            [[ $1 != *'[bot]' ]] || return 1
            permission=$(gh api "repos/$REPO/collaborators/$1/permission" --jq .permission) || return 2
            [[ $permission == admin || $permission == write ]]
          }
          # end of trusted
          # comments
          # The comments, reviews and review comments that the review reads: those of the pull request's or the
          # issue's author, and of each account that trusted passes. GitHub's REST API names an App <name>[bot]. The
          # others are counted in omitted.txt, and never read.
          author=$(gh api "repos/$REPO/issues/$NUMBER" --jq .user.login)
          # outside: true when trusted does not pass the author, also when GitHub could not say (status 2).
          outside=false
          trusted "$author" || outside=true
          echo "outside=$outside" >> "$GITHUB_OUTPUT"
          gh api --paginate "repos/$REPO/issues/$NUMBER/comments" \
            --jq '.[] | {author: .user.login, created_at, body}' > "$RUNNER_TEMP/comments.jsonl"
          : > "$RUNNER_TEMP/reviews.jsonl"
          : > "$RUNNER_TEMP/review-comments.jsonl"
          if [ "$KIND" = pr ]; then
            gh api --paginate "repos/$REPO/pulls/$NUMBER/reviews" \
              --jq '.[] | {author: .user.login, state, submitted_at, body}' > "$RUNNER_TEMP/reviews.jsonl"
            gh api --paginate "repos/$REPO/pulls/$NUMBER/comments" \
              --jq '.[] | {author: .user.login, path, line: (.line // .original_line), body}' \
              > "$RUNNER_TEMP/review-comments.jsonl"
          fi
          readers=("$author")
          while IFS= read -r login; do
            if [ "$login" != "$author" ] && trusted "$login"; then readers+=("$login"); fi
          done < <(cat "$RUNNER_TEMP"/{comments,reviews,review-comments}.jsonl | jq -r '.author // empty' | sort -u)
          read_json=$(jq -cn '$ARGS.positional' --args "${readers[@]}")
          for what in comments reviews review-comments; do
            jq -s --argjson readers "$read_json" 'map(select(.author | IN($readers[])))' "$RUNNER_TEMP/$what.jsonl" \
              > "$RUNNER_TEMP/$what.json"
            left=$(jq -s --argjson readers "$read_json" 'map(select(.author | IN($readers[]) | not)) | length' \
              "$RUNNER_TEMP/$what.jsonl")
            (( left == 0 )) || echo "$left $what by accounts without write access: not read" >> "$out/omitted.txt"
          done
          # end of comments
          if [ "$KIND" = issue ]; then
            gh issue view "$NUMBER" -R "$REPO" --json number,title,author,createdAt,state,body \
              | jq --slurpfile c "$RUNNER_TEMP/comments.json" '. + {comments: $c[0]}' > "$out/issue.json"
          else
            gh pr view "$NUMBER" -R "$REPO" --json \
              number,title,author,createdAt,isDraft,baseRefName,headRefOid,headRepository,body,commits,files \
              | jq --slurpfile c "$RUNNER_TEMP/comments.json" --slurpfile r "$RUNNER_TEMP/reviews.json" \
                  '. + {comments: $c[0], reviews: $r[0]}' > "$out/pr.json"
            gh pr view "$NUMBER" -R "$REPO" --json statusCheckRollup > "$out/checks.json"
            jq -r '.[] | "\(.author) \(.path):\(.line) \(.body)"' "$RUNNER_TEMP/review-comments.json" \
              > "$out/review-comments.txt"
            if [ -n "$EVENT_HEAD" ] && [ "$(jq -r .headRefOid "$out/pr.json")" != "$EVENT_HEAD" ]; then
              echo "::notice::#$NUMBER has moved on from $EVENT_HEAD: the run of its newer push considers it."
              echo "moved=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            base=$(jq -r .baseRefName "$out/pr.json")
            [ "$base" = main ] || { echo "::error::pull request #$NUMBER is into $base, not main: not reviewed."; exit 1; }
            git fetch -q --no-tags origin "+refs/pull/$NUMBER/head:refs/review/head"
            head=$(git rev-parse refs/review/head)
            [ "$head" = "$(jq -r .headRefOid "$out/pr.json")" ] \
              || { echo "::error::the pull request's head moved while it was read; the next run reviews the new head."; exit 1; }
            mb=$(git merge-base origin/main "$head")
            printf 'base %s\nhead %s\n' "$mb" "$head" > "$out/commits.txt"
            git diff --no-renames --name-only -z "$mb" "$head" > "$RUNNER_TEMP/changed"
            changed=$(tr -cd '\0' < "$RUNNER_TEMP/changed" | wc -c)
            (( changed <= 3000 )) || { echo "::error::$changed changed files: too large for this review."; exit 1; }
            git diff --no-renames --no-ext-diff --no-textconv "$mb" "$head" > "$out/pr.diff"
            # Each changed file as the pull request has it: regular files only, each cut at 2 MiB, 512 MiB in all.
            total=0
            while IFS= read -r -d '' path; do
              mode=$(git ls-tree --format='%(objectmode)' "$head" -- ":(literal)$path")
              case $mode in
                '') echo "$path: deleted" >> "$out/omitted.txt"; continue ;;
                100644|100755) ;;
                *) echo "$path: not a regular file (mode $mode)" >> "$out/omitted.txt"; continue ;;
              esac
              file="$out/head/$path"
              mkdir -p "$(dirname -- "$file")"
              git cat-file blob "$head:$path" > "$file"
              size=$(stat -c %s "$file")
              total=$((total + size))
              (( total <= 536870912 )) || { echo "::error::the changed files hold over 512 MiB: too large for this review."; exit 1; }
              if (( size > 2097152 )); then
                truncate -s 2097152 "$file"
                echo "$path: cut at 2 MiB of its $size bytes" >> "$out/omitted.txt"
              fi
            done < "$RUNNER_TEMP/changed"
            # Claude Code reads a CLAUDE.md, an AGENTS.md or a .claude/ beside a file it reads as instructions. The pull
            # request's are data, so they go.
            if [ -d "$out/head" ]; then
              find "$out/head" \( -iname 'CLAUDE*.md' -o -iname 'AGENTS*.md' -o -iname .claude \) -prune -print0 \
                | while IFS= read -r -d '' p; do
                    echo "${p#"$out"/head/}: removed (instructions for Claude Code)" >> "$out/omitted.txt"
                    rm -rf -- "$p"
                  done
            fi
          fi
          echo "Gathered $(find "$out" -type f | wc -l) files."

      - name: Keep it for the screen and the review
        id: keep
        if: steps.gather.outputs.moved != 'true'
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/review-data"
          tar -cf "$RUNNER_TEMP/review-data/review.tar" .review
          digest=$(sha256sum "$RUNNER_TEMP/review-data/review.tar" | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Kept .review/ as review.tar, SHA-256 $digest."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (sha-pinned)
        if: steps.gather.outputs.moved != 'true'
        with: {name: review-data, path: "${{ runner.temp }}/review-data/review.tar", if-no-files-found: error, retention-days: 1, overwrite: true}

  # The screen of a pull request or issue whose author, or the account that started the run, has no write access, or
  # that a run by hand asked to screen (the top of this file, and .github/screen.py). In the environment review-screen,
  # whose jobs alone can exchange their identity token for the screen's three: so this job cannot get the review's
  # Claude token, and no other job, the review's included, can get the screen's. Its one output is the verdict, clean
  # or held; the reason goes to the private bucket REASON_BUCKET.
  screen:
    name: screen ${{ needs.trust.outputs.outsider }}
    needs: [trust, gather]
    # A screen of what the gather job kept, or a measurement, which needs no gather job.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main'
          && ((needs.trust.outputs.route == 'screen' && needs.gather.result == 'success'
               && needs.gather.outputs.digest != '') || needs.trust.outputs.route == 'measure') }}
    environment: {name: review-screen, deployment: false}
    # One screen at a time for each item and task: a newer head cancels the screen of the older one. An answer never
    # cancels a review's screen, nor a review an answer's. A draft or a reply is never cancelled.
    concurrency:
      group: screen-${{ needs.trust.outputs.task }}-${{ needs.trust.outputs.number }}
      cancel-in-progress: ${{ needs.trust.outputs.task != 'draft' && needs.trust.outputs.task != 'reply' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ needs.trust.outputs.route == 'measure' && 60 || 15 }}
    permissions: {contents: read, id-token: write}
    outputs:
      verdict: ${{ steps.screen.outputs.verdict }}
    env:
      # Ids and endpoints, not secrets. Google Cloud: the pool, its provider and the account that only this
      # environment's jobs of this file reach, Model Armor's template, and the bucket the reason goes to.
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/805240912354/locations/global/workloadIdentityPools/review-screen/providers/github
      GCP_SERVICE_ACCOUNT: review-screen@theorem-agent-infra.iam.gserviceaccount.com
      MODEL_ARMOR_URL: https://modelarmor.us.rep.googleapis.com
      MODEL_ARMOR_TEMPLATE: projects/theorem-agent-infra/locations/us/templates/review-screen
      STORAGE_URL: https://storage.googleapis.com
      REASON_BUCKET: theorem-agent-infra-review-screen-reasons
      # Azure: Theorem's tenant, the managed identity review-screen, whose federated credential admits this
      # repository's jobs in review-screen, and whose role allows text:shieldPrompt on the Content Safety account and
      # nothing else.
      AZURE_LOGIN_URL: https://login.microsoftonline.com
      AZURE_TENANT_ID: aaa6ad34-51af-41e7-891f-f16f5c53c396
      AZURE_CLIENT_ID: 878cb696-144f-4c60-b04c-3974fad24e96
      CONTENT_SAFETY_URL: https://theorem-review-screen.cognitiveservices.azure.com
      # Anthropic: Theorem's organization, the service account review-screen (not the review's oss-verify-ci), its
      # workspace, and the federation rule rocq-linux-process-semantics-screen, which admits only this file's jobs in
      # review-screen on main, for this file's events (workflow_run and issue_comment from when that rule admits them),
      # with the scope workspace:inference.
      ANTHROPIC_URL: https://api.anthropic.com
      ANTHROPIC_ORGANIZATION_ID: 5fd73c3e-8a2c-4166-b80d-fb5ce0c1b4a6
      ANTHROPIC_WORKSPACE_ID: wrkspc_01Qr1iUVcow4jdgQM7Amfks5
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01JFhEhPizCyTiK2i22mRJ8a
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01SQMHj4Tw85dV4DNYWQDKeA
      SCREEN_MODEL: claude-haiku-5-5
      # The checks that run, all three. A listed check whose settings are missing, or that cannot answer (a 429 of
      # Prompt Shields' free tier among the causes), holds the item; a check leaves only by leaving this list.
      SCREEN_CHECKS: model_armor,prompt_shields,claude
      # How the checks' words make the verdict (.github/screen.py, RULES, with the measurement behind the choice):
      # held when the model answers suspicious, or Model Armor and Prompt Shields both do; and, under every rule, when
      # a check cannot answer.
      SCREEN_RULE: claude_or_both_detectors
    steps:
      # main's .github/, for screen.py; never the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with: {persist-credentials: false, sparse-checkout: .github, sparse-checkout-cone-mode: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (sha-pinned)
        if: needs.trust.outputs.route != 'measure'
        with: {name: review-data, path: "${{ runner.temp }}/review-data"}
      - name: Take the gathered pull request or issue
        if: needs.trust.outputs.route != 'measure'
        env: {DIGEST: "${{ needs.gather.outputs.digest }}"}
        run: |
          set -euo pipefail
          tar=$RUNNER_TEMP/review-data/review.tar
          [[ $DIGEST =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the gather job gave no SHA-256"; exit 1; }
          printf '%s  %s\n' "$DIGEST" "$tar" | sha256sum -c --strict
          # The listing goes to a file first: grep -q in a pipe would stop tar early, and pipefail would read that as
          # the check passing.
          tar -tf "$tar" > "$RUNNER_TEMP/review-data/members"
          ! grep -qvE '^\.review(/|$)' "$RUNNER_TEMP/review-data/members" \
            || { echo "::error::review.tar holds more than .review/"; exit 1; }
          ! grep -qE '(^|/)\.\.(/|$)' "$RUNNER_TEMP/review-data/members" || { echo "::error::review.tar holds a .. path"; exit 1; }
          [ ! -e .review ] || { echo "::error::.review is there already"; exit 1; }
          tar -xf "$tar" --no-same-owner --no-same-permissions
          echo "Took $(find .review -type f | wc -l) files."

      # A token for 10 minutes, or an hour for a measurement, which can run longer, which the account can use for
      # Model Armor, for adding an object to the reason bucket and for reading the labelled set, and for nothing else.
      # A sign-in that fails fails this job before the screen, with no verdict, and the hold job holds nothing for it.
      - name: Sign in to Google Cloud
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 (sha-pinned)
        with: {workload_identity_provider: "${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}", service_account: "${{ env.GCP_SERVICE_ACCOUNT }}", token_format: access_token, access_token_lifetime: "${{ needs.trust.outputs.route == 'measure' && '3600s' || '600s' }}", create_credentials_file: false, export_environment_variables: false}
      # This step exchanges the identity token for Microsoft Entra's token for Prompt Shields and for Anthropic's token
      # for the screen's model, each when SCREEN_CHECKS lists its check and the job's env above sets up its identity.
      # Both tokens go to a file under the runner's temporary directory that only the runner's account can read, and
      # that the Screen or Measure step deletes as it reads it; never to this log or an output. An exchange that fails
      # fails this job before the screen, with no verdict, and the hold job holds nothing for it.
      - name: Sign in to Anthropic and Azure
        run: python3 .github/screen.py --sign-in
      # The screen reads the tokens of the step before and deletes their file.
      - name: Screen
        id: screen
        if: needs.trust.outputs.route != 'measure'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ needs.trust.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REASON_OBJECT: ${{ github.repository }}/${{ github.run_id }}-${{ github.run_attempt }}.json
        run: python3 .github/screen.py .review
      # Every listed check, three times, on each text of the labelled set kept in the private bucket, and the verdict
      # of each rule of SCREEN_RULE's choices, with the tokens of the sign-in. The texts and their words stay in the
      # bucket; this log and the run's summary get the counts per rule alone.
      - name: Measure
        if: needs.trust.outputs.route == 'measure'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MEASURE_SET: ${{ inputs.measure_set }}
          MEASURE_OBJECT: measure/runs/${{ github.repository }}/${{ github.run_id }}-${{ github.run_attempt }}.json
          MEASURE_REPEATS: ${{ inputs.measure_repeats }}
        run: |
          set -euo pipefail
          [[ $MEASURE_SET =~ ^measure/set-v[0-9]+\.json$ ]] || { echo "::error::not a labelled set: $MEASURE_SET"; exit 1; }
          [[ $MEASURE_REPEATS =~ ^[1-5]$ ]] || { echo "::error::MEASURE_REPEATS must be 1 to 5"; exit 1; }
          python3 .github/screen.py --measure

  review:
    # The hourly caps tell the two kinds of review apart by this name.
    name: ${{ needs.trust.outputs.route == 'screen' && 'review (screened)' || 'review' }}
    needs: [trust, gather, screen]
    # A writer's, or a request by hand; or one the screen passed. A run whose gather job failed, or whose screen held
    # it, failed or was cancelled, has no review.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && needs.gather.result == 'success'
      && needs.gather.outputs.digest != ''
      && (needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen')
      && (needs.trust.outputs.route == 'review'
          || (needs.trust.outputs.route == 'screen' && needs.screen.result == 'success'
              && needs.screen.outputs.verdict == 'clean'))
    # One run of this job at a time for each pull request or issue and task: a new push replaces the review of the old
    # head, and a later comment's answer run answers every comment that waits. An answer never cancels a review, nor a
    # review an answer: their groups differ. A draft or a reply is never cancelled. A run that the trust job stops, or
    # that the screen holds, never reaches this job, so it cancels nothing.
    concurrency:
      group: review-${{ needs.trust.outputs.task }}-${{ needs.trust.outputs.number }}
      cancel-in-progress: ${{ needs.trust.outputs.task != 'draft' && needs.trust.outputs.task != 'reply' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions: {contents: read, pull-requests: read, issues: read, checks: read, statuses: read, actions: read, id-token: write}
    outputs:
      number: ${{ needs.gather.outputs.number }}
      started: ${{ needs.trust.outputs.started }}
      head: ${{ steps.result.outputs.head }}
      # The review's verdict (pass, blocking or person), after the soundness rule (SOUNDNESS_HOLD), and will_fix (true
      # or false), for the state label.
      verdict: ${{ steps.result.outputs.verdict }}
      will_fix: ${{ steps.result.outputs.will_fix }}
      body: ${{ steps.result.outputs.body }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      # The Linux the model describes (README.md, SCOPE.md: stable Linux v6.18.46), and QEMU 10.0.11, the version of
      # SCOPE.md's QEMU measurements.
      LINUX_URL: https://github.com/gregkh/linux
      LINUX_COMMIT: 1f99e9ab748fc5c32120de9c4eca31abfe54a4d5
      QEMU_URL: https://github.com/qemu/qemu
      QEMU_COMMIT: e3ad0582fdcec5c194835b0b4e8342cdc197b5cb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with: {persist-credentials: false}

      # Anthropic's exchange of a new identity token, with the federation rule, the organization, the service account
      # and the workspace of the Review step below, before any step that runs the model. The step only shows that the
      # rule admits this run: the Claude token it gets is checked and then dropped, never printed, written or kept,
      # and the Review step gets a token of its own. When the rule does not admit the run (a run of an event that the
      # rule does not admit yet, say), the job fails here, at a step whose name starts with "Sign in", before the
      # model, and the hold job holds nothing for it: the schedule takes the item again. curl reads the request
      # header and the exchange's body from its standard input, so that no token is in a command line.
      - name: Sign in to Anthropic
        env:
          ANTHROPIC_URL: https://api.anthropic.com
          FEDERATION_RULE_ID: fdrl_01PuYUs4GWGMxDQi1kLWwu7y
          ORGANIZATION_ID: 5fd73c3e-8a2c-4166-b80d-fb5ce0c1b4a6
          SERVICE_ACCOUNT_ID: svac_01WdHTLcJPEfiPttcuLK1hGT
          WORKSPACE_ID: wrkspc_01Qr1iUVcow4jdgQM7Amfks5
        run: |
          set -euo pipefail
          fail() { echo "::error::The sign-in to Anthropic failed: $1 No model ran."; exit 1; }
          [[ -n ${ACTIONS_ID_TOKEN_REQUEST_URL:-} && -n ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-} ]] \
            || fail "this job can get no identity token."
          jwt=$(printf 'header = "Authorization: Bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            | curl -sS --fail --retry 3 -K - -G --data-urlencode audience=https://api.anthropic.com \
                "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -er '.value | strings | select(length > 0)') \
            || fail "GitHub gave no identity token."
          answer=$(JWT=$jwt jq -n '{grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer", assertion: $ENV.JWT,
              federation_rule_id: $ENV.FEDERATION_RULE_ID, organization_id: $ENV.ORGANIZATION_ID,
              service_account_id: $ENV.SERVICE_ACCOUNT_ID, workspace_id: $ENV.WORKSPACE_ID}' \
            | curl -sS --retry 3 -H 'Content-Type: application/json' --data-binary @- -w '\n%{http_code}' \
                "$ANTHROPIC_URL/v1/oauth/token") || fail "Anthropic could not be reached."
          jwt=""
          status=${answer##*$'\n'}
          answer=${answer%$'\n'*}
          # An answer that is not 2xx holds no token: it says why Anthropic refused the run.
          [[ $status == 2[0-9][0-9] ]] \
            || fail "HTTP $status from Anthropic: $(printf '%s' "${answer:0:500}" | tr '\n' ' ')"
          jq -e '.access_token | strings | length > 0' <<< "$answer" > /dev/null 2>&1 \
            || fail "Anthropic gave no access token."
          answer=""
          echo "Anthropic's federation rule admits this run. The Review step gets a token of its own."

      # Counts the review jobs of this workflow's other runs that started in the last hour, or have not started, and
      # have called the model or may still call it: one whose Review step ran or runs; one that passed the step "Hold
      # at the hourly cap" and has not finished; and one that has not finished that step yet and belongs to an earlier
      # run, which goes first. So in a burst the earliest runs go ahead and the later ones stop at that step. Runs
      # created up to 3 hours ago are read, which covers a job's 75 minutes and its time in the queue: the runs of
      # workflow_run, issues, issue_comment and workflow_dispatch, never a fork's own run of this file (pull_request).
      # A review job that waits for its run's trust job is not listed yet, and one the trust job skipped has no Review
      # step, so neither counts. Only jobs of this run's kind count, by the job's name, whatever the task of their run:
      # a writer's review against HOURLY_CAP, a screened one against SCREENED_HOURLY_CAP. A read that fails stops the
      # run here, not at "Hold at the hourly cap", so that the hold job, which reads a failure of that step as the cap,
      # never says the cap was reached when it was not.
      - name: Count the reviews of the last hour
        id: count
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          POOL: ${{ needs.trust.outputs.route == 'screen' && 'review (screened)' || 'review' }}
          CAP: ${{ needs.trust.outputs.route == 'screen' && env.SCREENED_HOURLY_CAP || env.HOURLY_CAP }}
        run: |
          set -uo pipefail
          stop() { echo "::error::$1 No model ran. A maintainer can re-run this run."; exit 1; }
          [[ $CAP =~ ^[1-9][0-9]*$ ]] || stop "the cap is not a number."
          SINCE=$(date -u -d '-1 hour' +%s) || stop "the time could not be read."
          from=$(date -u -d '-3 hours' +%Y-%m-%dT%H:%M:%SZ) || stop "the time could not be read."
          export SINCE
          runs=$(gh api --method GET --paginate "repos/$REPO/actions/workflows/review.yml/runs" \
            -f created=">=$from" -F per_page=100 --jq '.workflow_runs[]
              | select(.event == "workflow_run" or .event == "issues" or .event == "issue_comment"
                       or .event == "workflow_dispatch")
              | "\(.id) \(.created_at)"') \
            || stop "the runs could not be read."
          count=0
          while read -r id created; do
            [ -n "$id" ] || continue
            [[ $id =~ ^[0-9]+$ ]] || stop "a run id is not a number."
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            n=$(RUN_CREATED=$created gh api --method GET --paginate "repos/$REPO/actions/runs/$id/jobs" \
              -f filter=all -F per_page=100 --jq '
                [.jobs[] | select(.name == $ENV.POOL)
                 | select((.run_id | tostring) != $ENV.RUN_ID or (.run_attempt | tostring) != $ENV.RUN_ATTEMPT)
                 | select(((.started_at // $ENV.RUN_CREATED) | fromdateiso8601) >= ($ENV.SINCE | tonumber))
                 | ([(.steps // [])[] | select(.name == "Review")] | first) as $review
                 | ([(.steps // [])[] | select(.name == "Hold at the hourly cap")] | first) as $cap
                 | select(($review != null and ($review.status == "in_progress"
                                                 or ($review.conclusion != null and $review.conclusion != "skipped")))
                          or (.status != "completed" and $cap != null and $cap.conclusion == "success")
                          or (.status != "completed" and ($cap == null or $cap.status != "completed")
                              and .run_id < ($ENV.RUN_ID | tonumber)))]
                | length') || stop "the jobs of run $id could not be read."
            [[ $n =~ ^[0-9]+$ ]] || stop "the jobs of run $id could not be read."
            count=$((count + n))
          done <<< "$runs"
          # A failed write would leave the count empty: it stops the run here (the next step refuses an empty count too).
          echo "count=$count" >> "$GITHUB_OUTPUT" || stop "the count could not be written."
          echo "$count reviews ($POOL) called the model, or may, in the last hour."

      # A count that is not a number, or a cap that is not one, lets no model run. It fails here, in a step of its own,
      # so that the hold job reads it as a review that did not finish (a try counts), not as the cap reached.
      - name: Check the count and the cap
        env:
          COUNT: ${{ steps.count.outputs.count }}
          CAP: ${{ needs.trust.outputs.route == 'screen' && env.SCREENED_HOURLY_CAP || env.HOURLY_CAP }}
        run: |
          set -uo pipefail
          [[ $COUNT =~ ^[0-9]+$ && $CAP =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::no count of the hour's reviews ($COUNT) or no cap ($CAP). No model ran."; exit 1; }
          echo "A count of $COUNT against a cap of $CAP."

      # Runs after the two steps above have passed, so it fails only when the count is at the cap: the hold job reads
      # this step's failure as the cap reached.
      - name: Hold at the hourly cap
        env:
          COUNT: ${{ steps.count.outputs.count }}
          POOL: ${{ needs.trust.outputs.route == 'screen' && 'review (screened)' || 'review' }}
          CAP: ${{ needs.trust.outputs.route == 'screen' && env.SCREENED_HOURLY_CAP || env.HOURLY_CAP }}
        run: |
          set -uo pipefail
          if (( COUNT >= CAP )); then
            echo "::error::HELD: $COUNT reviews ($POOL) called the model, or may, in the last hour: the cap is $CAP." \
              "No model ran. A maintainer can re-run this run once the hour has passed."
            exit 1
          fi
          echo "$COUNT reviews ($POOL) in the last hour, under the cap of $CAP."

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (sha-pinned)
        if: needs.trust.outputs.route != 'measure'
        with: {name: review-data, path: "${{ runner.temp }}/review-data"}
      - name: Take the gathered pull request or issue
        if: needs.trust.outputs.route != 'measure'
        env: {DIGEST: "${{ needs.gather.outputs.digest }}"}
        run: |
          set -euo pipefail
          tar=$RUNNER_TEMP/review-data/review.tar
          [[ $DIGEST =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the gather job gave no SHA-256"; exit 1; }
          printf '%s  %s\n' "$DIGEST" "$tar" | sha256sum -c --strict
          # The listing goes to a file first: grep -q in a pipe would stop tar early, and pipefail would read that as
          # the check passing.
          tar -tf "$tar" > "$RUNNER_TEMP/review-data/members"
          ! grep -qvE '^\.review(/|$)' "$RUNNER_TEMP/review-data/members" \
            || { echo "::error::review.tar holds more than .review/"; exit 1; }
          ! grep -qE '(^|/)\.\.(/|$)' "$RUNNER_TEMP/review-data/members" || { echo "::error::review.tar holds a .. path"; exit 1; }
          [ ! -e .review ] || { echo "::error::.review is there already"; exit 1; }
          tar -xf "$tar" --no-same-owner --no-same-permissions
          echo "Took $(find .review -type f | wc -l) files."

      # The source the model describes, for the kernel and QEMU code that comments and issues cite.
      - name: Gather the Linux and QEMU source
        run: |
          set -euo pipefail
          out=.review
          fetch() {
            local dir=$1 url=$2 commit=$3; shift 3
            git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 --filter=blob:none "$url" "$commit"
            git -C "$dir" sparse-checkout set --no-cone "$@"
            git -C "$dir" -c advice.detachedHead=false checkout -q FETCH_HEAD
            rm -rf "$dir/.git"
            find "$dir" \( -iname 'CLAUDE*.md' -o -iname 'AGENTS*.md' -o -iname .claude \) -prune -exec rm -rf {} +
          }
          fetch "$out/linux" "$LINUX_URL" "$LINUX_COMMIT" /mm/ /kernel/ /ipc/ /lib/ /arch/riscv/ /include/ /fs/ /net/ \
            /security/ /init/ /block/ /io_uring/ /drivers/char/ /drivers/tty/
          fetch "$out/qemu" "$QEMU_URL" "$QEMU_COMMIT" /linux-user/ /include/user/ /target/riscv/
          echo "Gathered $(find "$out" -type f | wc -l) files."

      # The Review step's action writes this job's GitHub token into the checkout's git configuration (as the origin
      # URL), and Claude can read every file of the working directory. So git's own directory moves under the runner's
      # temporary directory, which Claude cannot read, and .git becomes a file that names it. git works as before.
      - name: Keep git's configuration out of Claude's reach
        run: |
          set -euo pipefail
          git init -q --separate-git-dir="$RUNNER_TEMP/review-git"
          [ -f .git ] || { echo "::error::.git is still a directory"; exit 1; }

      # The action would download and run Claude Code's installer (curl https://claude.ai/install.sh | bash) and a Bun
      # at run time, unchecked, in a job that holds an identity token. This step downloads the versions that the action
      # at its pinned commit installs, and refuses any file whose SHA-256 is not the one written here. When the action's
      # pin moves, take the new versions from its src/entrypoints/run.ts (claudeCodeVersion) and its action.yml
      # (bun-version), and their digests from https://downloads.claude.ai/claude-code-releases/<version>/manifest.json
      # (platforms.linux-x64.checksum) and from the bun-linux-x64.zip asset of the oven-sh/bun release.
      - name: Download Claude Code and Bun at pinned digests
        env:
          CLAUDE_CODE_VERSION: 2.1.312
          CLAUDE_CODE_SHA256: 4f4178ce41d83e23341ebfbaecdbcf8ea6bf7baea0690025abe49eeec3a5d01d
          BUN_VERSION: 1.4.4
          BUN_SHA256: bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c
        run: |
          set -euo pipefail
          [ "$(uname -sm)" = "Linux x86_64" ] || { echo "::error::the pinned binaries are for Linux on x86-64"; exit 1; }
          dir=$RUNNER_TEMP/review-tools
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/claude" \
            "https://downloads.claude.ai/claude-code-releases/$CLAUDE_CODE_VERSION/linux-x64/claude"
          curl -fsSL --retry 3 -o "$dir/bun.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/bun-linux-x64.zip"
          printf '%s  %s\n' "$CLAUDE_CODE_SHA256" "$dir/claude" "$BUN_SHA256" "$dir/bun.zip" | sha256sum -c --strict
          unzip -q -j "$dir/bun.zip" bun-linux-x64/bun -d "$dir"
          rm "$dir/bun.zip"
          chmod +x "$dir/claude" "$dir/bun"

      # allowed_non_write_users, which a screened item sets, makes the action put /usr/bin and /bin before the pinned
      # Bun on the PATH. So no other Bun may be there.
      - name: No Bun but the pinned one
        run: |
          set -euo pipefail
          for bun in /usr/bin/bun /bin/bun; do
            [ ! -e "$bun" ] || { echo "::error::$bun is on the runner, ahead of the pinned Bun"; exit 1; }
          done

      - name: Review
        id: review
        timeout-minutes: 50
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1 (v1.0.264, sha-pinned)
        with:
          # Theorem's Anthropic organization, its service account oss-verify-ci and its workspace, and the federation
          # rule that admits this file on main (ids, not secrets).
          anthropic_federation_rule_id: fdrl_01PuYUs4GWGMxDQi1kLWwu7y
          anthropic_organization_id: 5fd73c3e-8a2c-4166-b80d-fb5ce0c1b4a6
          anthropic_service_account_id: svac_01WdHTLcJPEfiPttcuLK1hGT
          anthropic_workspace_id: wrkspc_01Qr1iUVcow4jdgQM7Amfks5
          github_token: ${{ github.token }}
          # The action itself refuses a run started by an account without write access (its default), and any App
          # but these, except the account whose pull request or issue the screen passed: this job runs for a
          # screened item only when the screen job's verdict is clean (its if). The rescreen job's runs are started by
          # github-actions[bot], which it admits for a run by hand alone, and this job runs only when the trust job
          # accepted that run: then the run reviews a screened item whose screen passed, or a writer's item.
          allowed_non_write_users: ${{ needs.trust.outputs.route == 'screen' && needs.trust.outputs.outsider || '' }}
          allowed_bots: >-
            ${{ github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]'
            && format('{0},github-actions[bot]', env.APPS)
            || needs.trust.outputs.route == 'screen' && endsWith(needs.trust.outputs.outsider, '[bot]')
            && format('{0},{1}', env.APPS, needs.trust.outputs.outsider) || env.APPS }}
          path_to_claude_code_executable: ${{ runner.temp }}/review-tools/claude
          path_to_bun_executable: ${{ runner.temp }}/review-tools/bun
          # Claude reads nothing outside the checkout. The runner's temporary files hold the identity token, the
          # exchanged Claude token and git's configuration, and /proc holds the environment: the deny rules name them
          # as well.
          settings: >-
            {"permissions": {"blockReadsOutsideWorkingDirectories": true,
            "deny": ["Read(//home/runner/work/_temp/**)", "Read(//proc/**)"]}}
          # The first two of the three steps of .github/review.md: the repository's rules, and the whole copies of the
          # two skills to write by, with their reference and example files. The third, the fresh reader, is the step
          # after the next. The prompt says whether the author has write access (the gather job's outside), and the
          # schema is the same for a writer's item and an outside one.
          prompt: >-
            Read .github/review.md: it is the rules of this review. Before you write, read the whole of the two skill
            copies that it names, with their reference and example files. These are
            .github/review/skills/asd-ste100/SKILL.md, .github/review/skills/asd-ste100/references/writing-rules.md,
            .github/review/skills/asd-ste100/examples/before-after.md, .github/review/skills/ce-noslop/SKILL.md,
            .github/review/skills/ce-noslop/references/patterns.md and
            .github/review/skills/ce-noslop/references/terminology.md. Review
            ${{ needs.gather.outputs.kind == 'pr' && 'pull request' || 'issue' }} #${{ needs.gather.outputs.number }}
            of this repository as .github/review.md says, from what .review/ holds.
            ${{ needs.gather.outputs.outside == 'false' && 'Its author has write access to this repository.'
            || 'Its author has no write access to this repository.' }} Give the comment, the verdict, will_fix and the
            list of items as the structured output (.github/review.md, "What the review gives").
          claude_args: >-
            --tools Read,Glob,Grep --permission-mode dontAsk --model claude-opus-5-5 --effort xhigh --max-turns 300
            --json-schema '{"type": "object", "additionalProperties": false,
            "required": ["comment", "verdict", "will_fix", "items"],
            "properties": {"comment": {"type": "string", "description": "The review comment, in Markdown."},
            "verdict": {"type": "string", "enum": ["pass", "blocking", "person"]},
            "will_fix": {"type": "boolean"},
            "items": {"type": "array", "items": {"type": "object", "additionalProperties": false,
            "required": ["kind", "ref", "text", "optional"],
            "properties": {"kind": {"type": "string", "enum": ["change", "question"]},
            "ref": {"type": ["string", "null"]}, "text": {"type": "string"}, "optional": {"type": "boolean"}}}}}}'

      # The fresh reader's token (.github/review/trim.py sign-in): Anthropic exchanges a new identity token of this
      # job with the Review step's federation rule, organization, service account and workspace. The token goes to a
      # file in the runner's temporary directory that only the runner's account can read, and that the next step
      # reads and deletes. It never goes to this log or an output. Claude has finished before this step. When the
      # exchange fails, the job fails here, at a step whose name starts with "Sign in", and the hold job holds nothing
      # for it: the schedule takes the item again.
      - name: Sign in to Anthropic for the fresh reader
        env:
          ANTHROPIC_URL: https://api.anthropic.com
          ANTHROPIC_FEDERATION_RULE_ID: fdrl_01PuYUs4GWGMxDQi1kLWwu7y
          ANTHROPIC_ORGANIZATION_ID: 5fd73c3e-8a2c-4166-b80d-fb5ce0c1b4a6
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01WdHTLcJPEfiPttcuLK1hGT
          ANTHROPIC_WORKSPACE_ID: wrkspc_01Qr1iUVcow4jdgQM7Amfks5
        run: python3 .github/review/trim.py sign-in

      # The third of the three steps of .github/review.md, and the comment as it is posted. The model gives its
      # comment, its verdict, will_fix and its list. First comes the soundness rule of R8, whatever the model wrote
      # (.github/review/rules.py soundness): while SOUNDNESS_HOLD is true, the review of an outside pull request (the
      # gather job's outside) that adds, changes or deletes a .v file gets the verdict person, a question on soundness
      # in its list when the list has none, and the section on soundness. The section lists, as facts, the lines of
      # the changed .v files at the head that use the VM, the native compiler or a primitive array.
      # .github/review/trim.py makes the comment unable to notify anyone, to link another issue or pull request, or to
      # link or load anything outside github.com (trim.py's inert), and cuts it at 20,000 characters. Then it runs the
      # fresh reader: one request to Claude, with no tools, that holds the reader's instruction, the list and that text
      # alone, with the token of the step before. A reader that fails fails this job, so nothing posts untrimmed: a
      # screened item is held as a review that did not finish, and is tried again. The comment: the header and its
      # markers, the trimmed text, the section on soundness, each listed item that the trimmed text lacks, the footer,
      # and the text that the reader read in a collapsed block. The model writes none of the fixed parts, and the
      # reader never sees them. The trimmed text and the added items are made inert too. The run's summary gets the
      # text that the reader read, the list, and the section on soundness with every line.
      - name: The comment, as it is posted
        id: result
        env:
          RESULT: ${{ steps.review.outputs.execution_file }}
          RULES: ${{ github.server_url }}/${{ github.repository }}/blob/main/.github/review.md
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTSIDE: ${{ needs.gather.outputs.outside }}
          ANTHROPIC_URL: https://api.anthropic.com
        run: |
          set -euo pipefail
          # trim.py deletes the token's file as it reads it. This deletes it too when trim.py does not run.
          trap 'rm -f -- "$RUNNER_TEMP/reader-token"' EXIT
          work=$RUNNER_TEMP/comment
          mkdir -p "$work"
          jq -e 'map(select(.type == "result")) | last | .structured_output
            | select(type == "object" and (.comment | type) == "string" and (.verdict | IN("pass", "blocking", "person"))
                     and (.will_fix | type) == "boolean" and (.items | type) == "array")' "$RESULT" > "$work/output.json" \
            || { echo "::error::The review gave no comment, verdict, will_fix and list. Nothing posts."; exit 1; }
          python3 .github/review/rules.py soundness .review "$work/output.json" "${SOUNDNESS_HOLD:-}" "$OUTSIDE" \
            "$work/section.md" "$work/section-all.md"
          jq -j .comment "$work/output.json" > "$work/review.md"
          jq .items "$work/output.json" > "$work/items.json"
          verdict=$(jq -r .verdict "$work/output.json")
          will_fix=$(jq -r .will_fix "$work/output.json")
          what="this issue" markers=""
          if [ -f .review/commits.txt ]; then
            head=$(sed -n 's/^head //p' .review/commits.txt)
            [[ $head =~ ^[0-9a-f]{40}$ ]] || { echo "::error::.review/commits.txt names no head commit."; exit 1; }
            what="commit ${head:0:12}"
            fix=""
            [ "$will_fix" = false ] || fix=" will-fix"
            markers=$'\n'"<!-- review-head $head -->"$'\n'"<!-- review-verdict $head $verdict$fix -->"
            echo "head=$head" >> "$GITHUB_OUTPUT"
          fi
          printf '%s%s\n%s\n' '<!-- review -->' "$markers" "**Automated review** of $what" > "$work/head.md"
          foot="Claude wrote this review by [these rules]($RULES) ([run]($RUN))."
          foot+=" A second Claude session shortened the review. The block below holds the whole review."
          printf '%s\n' "$foot" > "$work/foot.md"
          python3 .github/review/trim.py review --review "$work/review.md" --items "$work/items.json" \
            --head "$work/head.md" --section "$work/section.md" --foot "$work/foot.md" \
            --summary "$GITHUB_STEP_SUMMARY" --summary-extra "$work/section-all.md" > "$work/body.md" \
            || { echo "::error::The fresh reader gave no trimmed text. Nothing posts."; exit 1; }
          { echo "verdict=$verdict"; echo "will_fix=$will_fix"; } >> "$GITHUB_OUTPUT"
          delimiter="body_$(openssl rand -hex 16)"
          { echo "body<<$delimiter"; cat "$work/body.md"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

  # The OSS Verify App's writes, and nothing else: no comment and no label. In the environment post, which only main's
  # runs reach and which holds the App's key (OSS_VERIFY_APP_PRIVATE_KEY). Each write comes after a step of its own
  # that mints a token for this repository alone: token A, with checks: write and pull-requests: write, for the import
  # check run of a review or a relabel and for the close and reopen of a catch-up; token B, with actions: write alone,
  # for the approval of a head's held runs, minted only for the task approve when the screen passed. A missing key
  # fails these steps alone. Its own token can only read (actions: read lists a head's held runs). It holds no identity
  # token and no model. Its outputs: recorded, true when it recorded the import check run at the head, and decision,
  # what it decided for that check run. It records no check run yet, so recorded is false.
  post:
    needs: [trust, gather, screen, review]
    # The review of an outside pull request whose screen passed and whose review succeeded, a relabel, a catch-up, and
    # an approval whose screen passed. GitHub's implicit success() would skip it when a job it needs was skipped: the
    # gather, screen and review jobs of a relabel or a catch-up, and the review job of an approval.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main'
          && ((needs.trust.outputs.task == 'review' && needs.trust.outputs.route == 'screen'
               && needs.gather.outputs.kind == 'pr' && needs.review.result == 'success')
              || ((needs.trust.outputs.task == 'relabel' || needs.trust.outputs.task == 'catchup')
                  && needs.trust.result == 'success')
              || (needs.trust.outputs.task == 'approve' && needs.screen.result == 'success'
                  && needs.screen.outputs.verdict == 'clean')) }}
    environment: {name: post, deployment: false}
    # One at a time for each item, and none cancelled: GitHub keeps every pending one (queue: max).
    concurrency:
      group: post-${{ needs.trust.outputs.number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {contents: read, pull-requests: read, actions: read}
    outputs:
      recorded: "false"
      decision: ""
    steps:
      # Token A: for the import check run of a review or a relabel, and the close and reopen of a catch-up.
      - name: Sign in as the OSS Verify App
        id: app
        if: >-
          needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'relabel'
          || needs.trust.outputs.task == 'catchup'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0 (sha-pinned)
        with:
          app-id: 5447700
          private-key: ${{ secrets.OSS_VERIFY_APP_PRIVATE_KEY }}
          owner: theorem-labs
          repositories: rocq-linux-process-semantics
          permission-checks: write
          permission-pull-requests: write
      # Token B: for the approval of the head's held runs, only when the screen passed.
      - name: Sign in as the OSS Verify App to approve
        id: approver
        if: needs.trust.outputs.task == 'approve' && needs.screen.outputs.verdict == 'clean'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0 (sha-pinned)
        with:
          app-id: 5447700
          private-key: ${{ secrets.OSS_VERIFY_APP_PRIVATE_KEY }}
          owner: theorem-labs
          repositories: rocq-linux-process-semantics
          permission-actions: write
      # The App's writes follow here, each with the token of its step above: the import check run at the head (token
      # A), which sets the outputs recorded and decision; the close and reopen of a catch-up (token A); the approval
      # of the head's held runs (token B).

  # The posts, with this run's own GitHub token: the review comment, or the comment that asks the author of a pull
  # request with a merge conflict to resolve it, and the state label and the label comment of each, which
  # .github/review/rules.py sets from main's checkout of .github/. No App token posts here, so none of these comments
  # and labels starts a run of a workflow. It runs whatever the post job's result, and reads that job's recorded as
  # false when it did not succeed.
  comment:
    needs: [trust, gather, screen, review, post]
    # GitHub's implicit success() skips a job with a skipped ancestor, and a writer's run skips the screen job.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main'
          && (((needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen')
               && needs.review.result == 'success')
              || (needs.trust.outputs.task == 'conflict' && needs.trust.result == 'success')) }}
    # One at a time for each item, and none cancelled: GitHub keeps every pending one (queue: max).
    concurrency:
      group: comment-${{ needs.trust.outputs.number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # contents: read for main's .github/, which holds .github/review/rules.py.
    permissions: {contents: read, issues: write, pull-requests: write}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ needs.trust.outputs.number }}
      BODY: ${{ needs.review.outputs.body }}
      # What the post job did at the head: false, and no decision, when that job did not succeed.
      RECORDED: ${{ needs.post.result == 'success' && needs.post.outputs.recorded || 'false' }}
      DECISION: ${{ needs.post.result == 'success' && needs.post.outputs.decision || '' }}
    steps:
      # main's .github/, for .github/review/rules.py; never the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with: {ref: main, persist-credentials: false, sparse-checkout: .github, sparse-checkout-cone-mode: false}
      - name: Post the review, or replace the one posted before
        if: env.POST_REVIEW == 'true' && needs.trust.outputs.task != 'conflict'
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ && -n $BODY ]] || { echo "::error::no review to post"; exit 1; }
          id=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- review -->"))) | .id' \
            | tail -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -f body="$BODY" --jq .html_url
          else
            gh api --method POST "repos/$REPO/issues/$NUMBER/comments" -f body="$BODY" --jq .html_url
          fi
      # A review replaces the hold: a request by hand, or a later push that the screen passed. Not the review of an
      # older head: a newer push may have been held since. Nor when a hold came after this run started: a newer event
      # of the issue or the pull request was held. Then the state label of the review's outcome, and the label comment
      # (.github/review/rules.py), from the item's kind, whether this run took an outsider's path (so the screen
      # passed it), the review's verdict and will_fix, and whether the post job recorded the import check run at the
      # head.
      - name: Take the label review-held off and set the state label
        if: env.POST_REVIEW == 'true' && needs.trust.outputs.task != 'conflict'
        env:
          HEAD: ${{ needs.review.outputs.head }}
          STARTED: ${{ needs.review.outputs.started }}
          KIND: ${{ needs.gather.outputs.kind }}
          OUTSIDER: ${{ needs.trust.outputs.outsider }}
          VERDICT: ${{ needs.review.outputs.verdict }}
          WILL_FIX: ${{ needs.review.outputs.will_fix }}
        run: |
          set -uo pipefail
          [[ $STARTED =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
            || { echo "::error::no start time of this run"; exit 1; }
          if [ -n "$HEAD" ]; then
            now=$(gh api "repos/$REPO/pulls/$NUMBER" --jq .head.sha) || { echo "::error::no head of #$NUMBER"; exit 1; }
            [ "$now" = "$HEAD" ] || { echo "#$NUMBER has moved on from $HEAD: the labels stay."; exit 0; }
          fi
          held=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" --jq '.[]
            | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- review-held -->"))) | .updated_at') \
            || { echo "::error::the comments of #$NUMBER could not be read"; exit 1; }
          last=$(sort <<< "$held" | tail -n 1)
          if [[ -n $last && ! $last < $STARTED ]]; then
            echo "#$NUMBER was held at $last, after this run started at $STARTED: the labels stay."
            exit 0
          fi
          out=$(gh api --method DELETE "repos/$REPO/issues/$NUMBER/labels/$HELD_LABEL" 2>&1) \
            || [[ $out == *"(HTTP 404)"* ]] || { echo "::error::the label could not be taken off: $out"; exit 1; }
          outsider=false
          [ -z "$OUTSIDER" ] || outsider=true
          python3 .github/review/rules.py label "$NUMBER" kind="$KIND" outsider="$outsider" verdict="$VERDICT" \
            will_fix="$WILL_FIX" recorded="$RECORDED"
      - name: Keep the review in the run's summary
        if: env.POST_REVIEW != 'true' && needs.trust.outputs.task != 'conflict'
        run: printf '%s\n' "$BODY" >> "$GITHUB_STEP_SUMMARY"
      # A pull request with a merge conflict starts no CI run, and so no review: its author resolves the conflict, and
      # the next push starts both. One comment for each head, which says so, and the label waits-on-author, which takes
      # the place of waits-on-theorem, with a label comment that holds <!-- review-conflict-state <head> -->
      # (.github/review/rules.py). The comment stays as the record of the conflict; the label comment's line goes
      # when a later state of the item takes its place.
      - name: Ask the author to resolve the merge conflict
        if: needs.trust.outputs.task == 'conflict'
        env:
          HEAD: ${{ needs.trust.outputs.head }}
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          [[ $HEAD =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no head commit of #$NUMBER"; exit 1; }
          marker="<!-- review-conflict $HEAD -->"
          body=$(printf '%s\n%s\n\n%s\n' "$marker" "**Merge conflict** at commit ${HEAD:0:12}." \
            "This pull request has a merge conflict with \`main\`. GitHub runs no checks on a pull request with a merge conflict, so the automated review does not run. Resolve the conflict: merge \`main\` into the branch, or rebase the branch on \`main\`. Then push the branch. After the push, the checks and the automated review run again.")
          if [ "$POST_REVIEW" != true ]; then
            printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
          posted=$(MARKER=$marker gh api --paginate "repos/$REPO/issues/$NUMBER/comments" --jq '.[]
            | select(.user.login == "github-actions[bot]" and (.body | startswith($ENV.MARKER))) | .id') \
            || { echo "::error::the comments of #$NUMBER could not be read"; exit 1; }
          if [ -n "$posted" ]; then
            echo "#$NUMBER: the comment on the conflict at $HEAD was posted before."
          else
            gh api --method POST "repos/$REPO/issues/$NUMBER/comments" -f body="$body" --jq .html_url
          fi
          python3 .github/review/rules.py label "$NUMBER" conflict=true head="$HEAD"

  # A pull request or an issue that the screen held, that could not be gathered or screened, whose review the screen
  # passed but that did not finish (SCREENED_HOURLY_CAP among the causes), or whose account is at OUTSIDE_HOURLY_LIMIT:
  # the label review-held, and one comment that says it was held, which a later hold replaces. The comment says
  # nothing of why the screen held it: the screen job's one output is its verdict. A hold that the rescreen job tries
  # again ends with the marker <!-- review-held-<kind> <run> <tries> -->, by which that job finds it and the account:
  # limit (OUTSIDE_HOURLY_LIMIT); cap, a screened review stopped at SCREENED_HOURLY_CAP; or
  # transient, a screened review that failed otherwise or ran out of time, while it has failed fewer than REVIEW_TRIES
  # times. <run> is the run of the event this hold comes from (a rescreen keeps it), and <tries> the screened reviews
  # of it that failed so far. Such a hold gives the UTC time when the item is tried again, and no state label: the
  # workflow still works on the item. A hold that is not tried again (the screen's, or the last try of a review) gives
  # waits-on-theorem and a label comment that names Sami's next step (.github/review/rules.py, from main's checkout of
  # .github/). A cancelled screen holds nothing, nor a screened review that a newer run of the same item and task
  # cancelled: that run decides. Nor a run whose sign-in failed: a step whose name starts with "Sign in" failed in this
  # attempt of the run, in any of its jobs. Such a run judged nothing of the item, so it gets no comment, no label and
  # no try, and the schedule takes the item again. The if below cannot see the steps of another job, so a screen job
  # that failed at its sign-in starts this job, which reads this attempt's jobs first and stops.
  hold:
    needs: [trust, gather, screen, review]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main'
      && (needs.trust.outputs.task == 'review' || needs.trust.outputs.task == 'rescreen')
      && (needs.trust.outputs.route == 'limit'
      || (needs.trust.outputs.route == 'screen'
          && (needs.gather.result == 'failure' || needs.screen.result == 'failure'
              || (needs.screen.result == 'success' && needs.screen.outputs.verdict != 'clean')
              || (needs.screen.outputs.verdict == 'clean'
                  && (needs.review.result == 'failure' || needs.review.result == 'cancelled')))))
    # One at a time for each item, and none cancelled: GitHub keeps every pending one (queue: max).
    concurrency:
      group: hold-${{ needs.trust.outputs.number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions: read for this run's jobs (did a sign-in fail? was the review stopped at the cap?) and this workflow's
    # runs (did a newer run of the item and task cancel it?); pull-requests: write reads the open pull requests too,
    # which map a head to its pull request; contents: read for main's .github/, which holds .github/review/rules.py.
    permissions: {contents: read, issues: write, pull-requests: write, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ needs.trust.outputs.number }}
      TASK: ${{ needs.trust.outputs.task }}
      ROUTE: ${{ needs.trust.outputs.route }}
      OUTSIDER: ${{ needs.trust.outputs.outsider }}
      REVIEW: ${{ needs.review.result }}
      ORIGIN: ${{ needs.trust.outputs.origin }}
      TRIES: ${{ needs.trust.outputs.tries }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      # main's .github/, for .github/review/rules.py; never the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with: {ref: main, persist-credentials: false, sparse-checkout: .github, sparse-checkout-cone-mode: false}
      - name: Label it and say that it was held
        run: |
          set -euo pipefail
          [[ $NUMBER =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $NUMBER"; exit 1; }
          [[ $RUN_ID =~ ^[1-9][0-9]*$ && $RUN_ATTEMPT =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a run id or attempt"; exit 1; }
          [[ $REVIEW_TRIES =~ ^[1-9][0-9]*$ ]] || { echo "::error::REVIEW_TRIES is not a number"; exit 1; }
          # Every step of this file that exists to get a token, or to show that the run can get one, has a name that
          # starts with "Sign in", and no other step has: the screen job's two, the review job's two, and the post
          # job's two. A new such step must be named so too, or this job would hold its failure as one of the item.
          # When such a step failed in this attempt of the run, in any of its jobs, nothing of the item was judged: no
          # comment, no label and no try, and the schedule takes the item again. A run at the limit ran no job but the
          # trust job. The failed steps tell a review stopped at SCREENED_HOURLY_CAP too (below). When the jobs cannot
          # be read, nothing is held, so that a run whose sign-in failed is never held: this job fails instead.
          failed=""
          if [ "$ROUTE" != limit ]; then
            failed=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" \
              --jq '.jobs[] | .steps[]? | select(.conclusion == "failure") | .name') \
              || { echo "::error::the jobs of this run could not be read, so nothing is held: the schedule takes the item again."; exit 1; }
            signin=$(grep -m 1 '^Sign in' <<< "$failed" || true)
            if [ -n "$signin" ]; then
              line="#$NUMBER is not held: the step \"$signin\" failed in this run. This run writes no hold comment and no label, and counts no try. The schedule takes the item again."
              echo "$line"
              printf '%s\n' "$line" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          tries=${TRIES:-0}
          [[ $tries =~ ^[0-9]+$ ]] || tries=0
          kind=""
          # The fact that this hold gives the label rule (.github/review/rules.py): held, for a hold that is tried
          # again, with no state label; screen_held or tries_used_up, for a hold that is not, with waits-on-theorem.
          fact=held
          # The rescreen job takes a hold with a marker once its comment is an hour old, at its next run of the four
          # each hour. A limit hold says what happens if the account is still at its limit; the other holds say only
          # that a new hold replaces this comment, since a rescreen can be held for another cause than theirs.
          next=$(date -u -d '+1 hour' '+%Y-%m-%d %H:%M UTC')
          again="It is screened again automatically, with no maintainer, from $next, by a check that runs every 15 minutes."
          again_limit="$again If that account is still at the limit then, the check tries again later, and if the item is held again, this comment gives the new time."
          again_other="$again If it is held again, this comment says why."
          if [ "$ROUTE" != limit ] && [ "$REVIEW" = cancelled ]; then
            # A newer run of the same item and task (its next push, its next comment, its rescreen, or a request by
            # hand) cancels this run's review: only such a run is in the review job's concurrency group. That run
            # decides, whoever asked for this one. Not a newer run whose trust job was skipped (a CI run that was
            # cancelled, say), failed or was cancelled: it decides nothing, so this run holds the item. A trust job not
            # listed yet, still running, or passed may still decide. A run's name gives its task and item: #<n> ends at
            # a space or at the end of the name, and a workflow_run's head maps to its pull request through the open
            # pull requests.
            [[ $TASK =~ ^[a-z]+$ ]] || { echo "::error::not a task: $TASK"; exit 1; }
            same="^$TASK #$NUMBER( |\$)"
            pushed='^review ([0-9a-f]{40}) by '
            heads=""
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            newer=$(gh api --method GET --paginate "repos/$REPO/actions/workflows/review.yml/runs" \
              -f created=">=$(date -u -d '-1 day' +%Y-%m-%dT%H:%M:%SZ)" -F per_page=100 --jq '.workflow_runs[]
                | select(.id > ($ENV.RUN_ID | tonumber) and (.event == "workflow_run" or .event == "issues"
                         or .event == "issue_comment" or .event == "workflow_dispatch"))
                | "\(.id) \(.event) \(.display_title // "" | gsub("[\r\n]"; " "))"') \
              || { echo "::error::the runs of this workflow could not be read"; exit 1; }
            while read -r id event title; do
              [ -n "$id" ] || continue
              [[ $id =~ ^[0-9]+$ ]] || { echo "::error::a run id is not a number"; exit 1; }
              if [[ $title =~ $same ]]; then
                :
              elif [[ $TASK == review && $event == workflow_run && $title =~ $pushed ]]; then
                sha=${BASH_REMATCH[1]}
                if [ -z "$heads" ]; then
                  heads=$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --jq '.[] | "\(.head.sha) \(.number)"') \
                    || { echo "::error::the open pull requests could not be read"; exit 1; }
                  heads=${heads:--}
                fi
                grep -qxF "$sha $NUMBER" <<< "$heads" || continue
              else
                continue
              fi
              trust=$(gh api --method GET --paginate "repos/$REPO/actions/runs/$id/jobs" -F per_page=100 \
                --jq '.jobs[] | select(.name == "trust") | .conclusion // "running"') \
                || { echo "::error::the jobs of run $id could not be read"; exit 1; }
              case $trust in
                skipped|failure|cancelled) ;;
                *) echo "A newer run of #$NUMBER ($TASK) cancelled this run's review: that run decides."; exit 0 ;;
              esac
            done <<< "$newer"
          fi
          if [ "$ROUTE" = limit ]; then
            [[ $OUTSIDER =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || { echo "::error::not a GitHub login: $OUTSIDER"; exit 1; }
            kind=limit
            why="The account behind its latest event has no write access to this repository, and its pull requests, issues and pushes have reached the limit of $OUTSIDE_HOURLY_LIMIT an hour that are screened for the automated review. $again_limit"
          elif [ -z "$OUTSIDER" ]; then
            # A run by hand that asked for the screen first: no account's limit, and no try again.
            if [ "$REVIEW" = failure ] || [ "$REVIEW" = cancelled ]; then
              fact=tries_used_up
              why="A run started by hand asked for the automated screen first. The screen passed it, but the automated review after the screen did not finish. It is not tried again."
            else
              fact=screen_held
              why="A run started by hand asked for the automated screen first. The automated screen held this item, so the automated review did not run. You do not need to do anything."
            fi
          elif [ "$REVIEW" = failure ] || [ "$REVIEW" = cancelled ]; then
            # Stopped at SCREENED_HOURLY_CAP: its step of that name failed, in this attempt of this run (failed, read
            # above).
            if grep -qxF 'Hold at the hourly cap' <<< "$failed"; then
              kind=cap
              why="It comes from an account without write access to this repository. The automated screen passed it, but the automated reviews of such items had reached their limit of $SCREENED_HOURLY_CAP an hour. $again_other"
            else
              tries=$((tries + 1))
              if (( tries < REVIEW_TRIES )); then
                kind=transient
                why="It comes from an account without write access to this repository. The automated screen passed it, but the automated review of it did not finish ($tries of the $REVIEW_TRIES times it is tried). $again_other"
              else
                fact=tries_used_up
                why="It comes from an account without write access to this repository. The automated screen passed it, but the automated review of it did not finish after $tries tries. It is not tried again."
              fi
            fi
          else
            fact=screen_held
            item=$(gh api "repos/$REPO/issues/$NUMBER" --jq 'if .pull_request then "pr" else "issue" end') \
              || { echo "::error::#$NUMBER could not be read"; exit 1; }
            if [ "$item" = pr ]; then
              why="The automated screen held this pull request, so the automated review did not run. You do not need to do anything."
            else
              why="The automated screen held this issue, so no automated reply was written. You do not need to do anything."
            fi
          fi
          marker=""
          if [ -n "$kind" ]; then
            [[ $ORIGIN =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a run id: $ORIGIN"; exit 1; }
            marker=$'\n'"<!-- review-held-$kind $ORIGIN $tries -->"
          fi
          body=$(printf '%s\n%s\n\n%s\n%s' '<!-- review-held -->' "**Automated review held.**" "$why" "$marker")
          # Adding a label that does not exist makes it, so a failed creation (two holds at once) only loses its colour
          # and its description.
          python3 .github/review/rules.py make-label "$HELD_LABEL"
          gh api --method POST "repos/$REPO/issues/$NUMBER/labels" -f "labels[]=$HELD_LABEL" --jq '.[].name' > /dev/null
          id=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- review-held -->"))) | .id' \
            | tail -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -f body="$body" --jq .html_url
          else
            gh api --method POST "repos/$REPO/issues/$NUMBER/comments" -f body="$body" --jq .html_url
          fi
          python3 .github/review/rules.py label "$NUMBER" "$fact=true"

  # The schedule's job, in the public repository alone: each open pull request or issue whose newest hold is one that
  # is tried again, over an hour old, is screened again by a run of this file that this job starts (-f task=rescreen,
  # the top of this file). Those holds: at OUTSIDE_HOURLY_LIMIT; of a screened review stopped at SCREENED_HOURLY_CAP;
  # and of a screened review that failed or ran out of time, under REVIEW_TRIES. Never one that the screen held: that
  # item waits on Sami. Oldest hold first, each account gets at most OUTSIDE_HOURLY_LIMIT rescreens an hour, less
  # those it had in the last hour; the trust job of each run counts again, with the account's own events, and holds
  # the item again at the limit, with a comment that says when it is tried next. A failed read or start leaves that
  # item for the next run and fails this job. An item whose rescreens since its hold reach REVIEW_TRIES with no new
  # hold and no posted review (a run that failed on a GitHub read, say) is not started again: this job gives it
  # waits-on-theorem, with the label comment's step "Sami reads the runs and starts the work again"
  # (.github/review/rules.py, from main's checkout of .github/), replaces its hold comment with one that says that it
  # is not screened again automatically, with no marker, and fails for that run. Before that, each try waits until the
  # newest rescreen since the hold is over an hour old, as the first waits on the hold.
  # It is the only job of this file with actions: write, which starting a run needs; issues and pull-requests: write
  # let it set that label and replace that hold comment, and contents: read checks out main's .github/. It holds no
  # model, and writes nothing but those runs, those labels and those comments. Its cost: one job of a few seconds
  # every 15 minutes, 96 runs a day on a standard runner, whose minutes GitHub does not bill in a public repository.
  rescreen:
    if: >-
      github.event_name == 'schedule' && github.ref == 'refs/heads/main'
      && github.repository == 'theorem-labs/rocq-linux-process-semantics' && github.repository_id == 1425819621
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One at a time, so that two runs cannot start the same item.
    concurrency: {group: review-rescreen, cancel-in-progress: false}
    permissions: {actions: write, contents: read, issues: write, pull-requests: write}
    steps:
      # main's .github/, for .github/review/rules.py; never the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with: {ref: main, persist-credentials: false, sparse-checkout: .github, sparse-checkout-cone-mode: false}
      - name: Start the screen again of each held item whose hold is over an hour old
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ $OUTSIDE_HOURLY_LIMIT =~ ^[1-9][0-9]*$ ]] || { echo "::error::OUTSIDE_HOURLY_LIMIT is not a number"; exit 1; }
          [[ $REVIEW_TRIES =~ ^[1-9][0-9]*$ ]] || { echo "::error::REVIEW_TRIES is not a number"; exit 1; }
          # Without a posted review the label never comes off, so every held item would be screened and reviewed again
          # up to REVIEW_TRIES times for nothing, and then left to a person.
          if [ "$POST_REVIEW" != true ]; then
            echo "::notice::POST_REVIEW is not true: reviews are not posted, so held items are not screened again."
            exit 0
          fi
          # held
          # titled: the names of the runs that the rescreen job starts and that name an account (run-name):
          # <task> #<n>[ at <head>][ for <comment>] of <login>. BASH_REMATCH[2] is then the number, and [5] the login.
          titled='^(rescreen|review|answer|draft|approve) #([1-9][0-9]*)( at [0-9a-f]{40})?( for [1-9][0-9]*)? of ([A-Za-z0-9-]+(\[bot\])?)$'
          # limit_hold <number>: "<time> <run> <tries> <kind>" of the newest hold comment of <number> when it is one
          # that the rescreen job tries again (its marker <!-- review-held-<kind> <run> <tries> -->): <kind> is limit
          # (OUTSIDE_HOURLY_LIMIT), cap (SCREENED_HOURLY_CAP) or transient (a screened review that failed or ran out of
          # time), <run> the run of the event this hold comes from (a rescreen keeps it), and <tries> the screened
          # reviews of it that failed so far.
          # "<time> -" when the hold is not tried again (the screen held it, or its tries are used up). Nothing when it
          # has no hold comment. Only github-actions[bot]'s comments count.
          limit_hold() {
            gh api --paginate "repos/$REPO/issues/$1/comments" --jq '.[]
              | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- review-held -->")))
              | "\(.updated_at) \((.body
                  | capture("\n<!-- review-held-(?<kind>limit|cap|transient) (?<run>[0-9]+)(?: (?<tries>[0-9]+))? -->(\n|$)")
                  | "\(.run) \(.tries // "0") \(.kind)") // "-")"' \
              | sort | tail -n 1
          }
          # held_account <run>: the account whose limit a hold of <run> counts on, when <run> is a run of this
          # workflow: the account that started it, for a run of workflow_run, issues or issue_comment; the account its
          # name ends with, for a run that github-actions[bot] started (the rescreen job's) with one of that job's
          # names (titled); the account that started it, for a run by hand of an App in APPS or of an account with
          # write access, which has no limit. Nothing for any other run, or when GitHub no longer has it (a deleted or
          # expired run). It fails when GitHub could not say.
          held_account() {
            local workflow run id event login title permission
            [[ $1 =~ ^[1-9][0-9]*$ ]] || return 0
            workflow=$(gh api "repos/$REPO/actions/workflows/review.yml" --jq .id) || return 1
            run=$(gh api "repos/$REPO/actions/runs/$1" \
              --jq '"\(.workflow_id) \(.event) \(.actor.login) \(.display_title // "" | gsub("[\r\n]"; " "))"' 2>&1) \
              || { [[ $run == *"(HTTP 404)"* ]] || return 1; return 0; }
            read -r id event login title <<< "$run"
            [[ $id == "$workflow" && $login =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || return 0
            case $event in
              workflow_run|issues|issue_comment) echo "$login" ;;
              workflow_dispatch)
                if [ "$login" = 'github-actions[bot]' ]; then
                  if [[ $title =~ $titled ]]; then echo "${BASH_REMATCH[5]}"; fi
                elif [[ ,$APPS, == *",$login,"* ]]; then
                  echo "$login"
                elif [[ $login != *'[bot]' ]]; then
                  permission=$(gh api "repos/$REPO/collaborators/$login/permission" --jq .permission) || return 1
                  if [[ $permission == admin || $permission == write ]]; then echo "$login"; fi
                fi ;;
            esac
          }
          # end of held
          from=$(date -u -d '-1 hour' +%Y-%m-%dT%H:%M:%SZ)
          since=$(date -u -d '-3 hours' +%Y-%m-%dT%H:%M:%SZ)
          # This workflow's runs of the last 3 hours, by their names: an item with a run not finished, of any task, is
          # not started again, because its screen and review can outlast this job's 15 minutes, and a second run would
          # use the hour's screened reviews twice; and the runs of the last hour that this job starts count toward each
          # account's limit (their names, which their trust job checks, end with the account). 3 hours cover a run's
          # jobs and their time in the queue. A name gives its item as #<n>, which ends at a space or at the end of the
          # name; a workflow_run's name gives its head, which the open pull requests map to its pull request.
          runs=$(gh api --method GET --paginate "repos/$REPO/actions/workflows/review.yml/runs" \
            -f created=">=$since" -F per_page=100 \
            --jq '.workflow_runs[]
              | "\(.created_at // "-") \(.status // "-") \(.event // "-") \(.display_title // "" | gsub("[\r\n]"; " "))"') \
            || { echo "::error::the runs of this workflow could not be read."; exit 1; }
          declare -A used=() running=() heads=()
          item_re='^(review|answer|draft|reply|rescreen|approve|catchup|conflict|relabel) #([0-9]+)( |$)'
          pushed_re='^review ([0-9a-f]{40}) by '
          while read -r created status event title; do
            # Only this workflow's own events name a run: a fork's pull request can run its own copy of this file
            # (event pull_request) under any name.
            case $event in workflow_run|issues|issue_comment|workflow_dispatch) ;; *) continue ;; esac
            if [[ $event == workflow_dispatch && ${title:-} =~ $titled && ! $created < $from ]]; then
              used[${BASH_REMATCH[5]}]=$(( ${used[${BASH_REMATCH[5]}]:-0} + 1 ))
            fi
            [ "$status" != completed ] || continue
            if [[ ${title:-} =~ $item_re ]]; then
              running[${BASH_REMATCH[2]}]=1
            elif [[ $event == workflow_run && ${title:-} =~ $pushed_re ]]; then
              heads[${BASH_REMATCH[1]}]=1
            fi
          done <<< "$runs"
          if (( ${#heads[@]} > 0 )); then
            open=$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --jq '.[] | "\(.head.sha) \(.number)"') \
              || { echo "::error::the open pull requests could not be read."; exit 1; }
            while read -r sha number; do
              if [ -n "${sha:-}" ] && [ -n "${heads[$sha]:-}" ]; then running[$number]=1; fi
            done <<< "$open"
          fi
          # Not a draft: the trust job takes none, and a run it stops would still count toward the account's limit.
          # Marking it ready starts its own run.
          numbers=$(gh api --paginate "repos/$REPO/issues?state=open&labels=$HELD_LABEL&per_page=100" \
            --jq '.[] | select(.state == "open" and ((.draft // false) | not)) | .number') \
            || { echo "::error::the held pull requests and issues could not be read."; exit 1; }
          failed=0
          : > "$RUNNER_TEMP/due"
          for number in $numbers; do
            [[ $number =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a number: $number"; exit 1; }
            if [ -n "${running[$number]:-}" ]; then
              echo "#$number: a run of it has not finished."
              continue
            fi
            hold=$(limit_hold "$number") \
              || { echo "::error::the comments of #$number could not be read."; failed=1; continue; }
            read -r at origin _ <<< "$hold"
            if [[ -z ${origin:-} || $origin == - ]]; then
              echo "#$number: no hold that is tried again (the screen held it, or its tries are used up)."
              continue
            fi
            if [[ ! $at < $from ]]; then
              echo "#$number: held at $at, less than an hour ago."
              continue
            fi
            # An item rescreened after its hold whose rescreens left neither a new hold nor a posted review is started
            # again up to REVIEW_TRIES times in all: one such run may have failed on a GitHub read, or its hold job may
            # have failed to write. After that the item waits on Sami, so that no item is screened and reviewed
            # without end, and this job fails, so that someone sees it. The runs since the hold are read, however long
            # ago it was: each run of the item that this job starts for any task a hold can name (its name, titled, ends
            # with an account; #<n> in it ends at the space before " at", " for" or " of").
            [[ $at =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
              || { echo "::error::#$number: its hold has no time."; failed=1; continue; }
            # shellcheck disable=SC2016 # $ENV is jq's, read from this step's environment
            since_hold=$(AT=$at PATTERN="^(rescreen|review|answer|draft|approve) #$number( at [0-9a-f]{40})?( for [1-9][0-9]*)? of " \
              gh api --method GET --paginate \
              "repos/$REPO/actions/workflows/review.yml/runs" -f event=workflow_dispatch -f created=">=$at" \
              -F per_page=100 --jq '.workflow_runs[] | select(.event == "workflow_dispatch"
                and (.created_at // "") >= $ENV.AT and ((.display_title // "") | test($ENV.PATTERN))) | .created_at') \
              || { echo "::error::the runs since the hold of #$number could not be read."; failed=1; continue; }
            unsettled=$(grep -c . <<< "$since_hold" || true)
            if (( unsettled >= REVIEW_TRIES )); then
              # The hold comment is replaced with words that promise nothing, and with no marker, so no later run picks
              # the item again, and this run alone fails for it. Only while the newest hold comment is still the one
              # read above, at $at: a newer hold (a new event's, or a rescreen's that finished meanwhile) is not
              # overwritten, and the next run decides from it. A comment that could not be replaced keeps its marker,
              # and the next run tries again.
              newest_hold=$(gh api --paginate "repos/$REPO/issues/$number/comments" --jq '.[]
                | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- review-held -->")))
                | "\(.updated_at) \(.id)"' | sort | tail -n 1) \
                || { echo "::error::the comments of #$number could not be read."; failed=1; continue; }
              read -r now_at id <<< "$newest_hold"
              if [ "${now_at:-}" != "$at" ]; then
                echo "#$number: its hold changed (${now_at:-none}, read at $at) since this run read it: left for the next run."
                continue
              fi
              echo "::error::#$number: screened again $unsettled times since its hold at $at, with no new hold and no" \
                "review posted: a maintainer must look at it."
              failed=1
              [[ $id =~ ^[1-9][0-9]*$ ]] || { echo "::error::#$number has no hold comment to replace."; continue; }
              # The work is not tried again: waits-on-theorem first, so that a label that could not be set leaves the
              # hold comment's marker, and the next run tries both again.
              python3 .github/review/rules.py label "$number" tries_used_up=true \
                || { echo "::error::the label of #$number could not be set; the next run tries again."; continue; }
              body=$(printf '%s\n%s\n\n%s\n' '<!-- review-held -->' "**Automated review held.**" \
                "It was screened again automatically $unsettled times since it was held, and none of those runs ended in a new hold or a posted review. It is not screened again automatically. A maintainer will look at it, and can start the screen and the review with \`gh workflow run review.yml -R $REPO -f number=$number -f screen=true\`.")
              gh api --method PATCH "repos/$REPO/issues/comments/$id" -f body="$body" --jq .html_url \
                || echo "::error::the hold comment of #$number could not be replaced; the next run tries again."
              continue
            fi
            if (( unsettled > 0 )); then
              # Spaced as the hold's own hour is: the next try waits until the newest rescreen since the hold is over
              # an hour old, so a short outage of GitHub does not use up the tries.
              newest=$(sort <<< "$since_hold" | tail -n 1)
              if [[ ! $newest < $from ]]; then
                echo "#$number: rescreened at $newest, less than an hour ago, with no new hold: tried again later."
                continue
              fi
              echo "#$number: $unsettled rescreens since its hold settled nothing; trying again."
            fi
            account=$(held_account "$origin") || { echo "::error::run $origin could not be read."; failed=1; continue; }
            if [ -z "$account" ]; then
              echo "#$number: its hold names no run whose account this job can tell: left alone."
              continue
            fi
            echo "$at $number $account" >> "$RUNNER_TEMP/due"
          done
          while read -r at number account; do
            if (( ${used[$account]:-0} >= OUTSIDE_HOURLY_LIMIT )); then
              echo "#$number waits: $account had ${used[$account]} rescreens in the last hour, the limit is $OUTSIDE_HOURLY_LIMIT."
              continue
            fi
            if gh api --method POST "repos/$REPO/actions/workflows/review.yml/dispatches" -f ref=main \
                -f "inputs[number]=$number" -f "inputs[task]=rescreen" -f "inputs[account]=$account" > /dev/null; then
              used[$account]=$(( ${used[$account]:-0} + 1 ))
              echo "#$number: screened again (held at $at, for $account)."
            else
              echo "::error::the rescreen of #$number could not be started."
              failed=1
            fi
          done < <(sort "$RUNNER_TEMP/due")
          exit "$failed"
