name: Review tests

# The tests of the review workflow (.github/workflows/review.yml) and of its
# screen. They have a workflow of their own, apart from ci.yml's Rocq lanes, so
# a change to them changes no file that the lanes' workflow holds. Every job
# runs on every event: this repository has no merge queue, so a pull request's
# run is the whole check of its change.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# As in ci.yml: one group per branch, so a newer push to main, or a pull
# request's newer head, cancels the run of the older one. No job reads the
# previous tip of main, so the newer run checks all the older one would have.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The scripts of .github/workflows/review.yml, .github/workflows/rescreen.yml and .github/workflows/screen-start.yml,
  # run against a stand-in gh (.github/test_review.py): who is reviewed and who is screened first, which jobs run on
  # each route, which comments the review reads, and what the posted comment can notify or link; and its screen,
  # against stand-in services (.github/test_screen.py). Each of the two test files runs in its own job, in parallel,
  # so a failure of one does not hide the result of the other. test_review.py takes about 9 minutes on a runner, so its
  # job has 20 (OSSV-221's architect, 2026-11-22 03:17Z, after a run that 10 minutes cancelled).
  review-workflow-review:
    name: 'Review workflow: test_review.py'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false
      - run: python3 .github/test_review.py

  review-workflow-screen:
    name: 'Review workflow: test_screen.py'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false
      - run: python3 .github/test_screen.py

  # The one check of this workflow to require: it always runs, and passes only
  # when every job it needs succeeded. .github/test_ci.py, which ci.yml runs,
  # tests this script.
  gate:
    name: Review tests
    needs: [review-workflow-review, review-workflow-screen]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -c 'map_values(.result)'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null \
            || { echo "a job did not pass"; exit 1; }
