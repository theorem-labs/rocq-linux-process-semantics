name: Lean twin

# The Lean twin of the Rocq model lives in `lean/` (see lean/README.md).
# This workflow is separate from ci.yml on purpose: it is not a step of any
# of the four lanes there, it runs only for a pull request that touches
# `lean/`, and `continue-on-error` keeps it from failing the run. A red
# Lean build must never stop a Rocq pull request from merging.

on:
  pull_request:
    paths:
      - 'lean/**'
      - '.github/workflows/lean-twin.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean-twin-build:
    name: Lean twin (lake build, not required)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o elan-init.sh
          sha256sum elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        working-directory: lean
        run: |
          lean --version
          lake --version

      # Another stream's Lean job got a cold build from about 47-50 minutes
      # down to 738 s and 585 s by sizing lake's job count from memory and
      # never setting LEAN_NUM_THREADS=1
      # (dispatch://BET-59/artifact/speed-log-md, tick 46).  Half of that
      # does not apply here: the pinned toolchain's Lake is 5.0.0-src+293d5d0
      # (Lean 4.34.0) and has no job option -- `lake build -j 41` answers
      # "error: unknown short option '-j'", and neither `lake --help` nor
      # `lake help build` has a jobs or threads option.  The lakefile sizes
      # the per-module worker pool itself (`moreLeanArgs := #["-j2"]`).  So
      # this step sets nothing, which is the other half of that measurement:
      # LEAN_NUM_THREADS is left unset.
      - name: lake build
        working-directory: lean
        run: |
          awk '/^MemAvailable:/ {print "MemAvailable " $2 " kiB"}' /proc/meminfo
          nproc
          lake build
